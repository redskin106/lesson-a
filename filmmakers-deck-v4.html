<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Filmmaker's deck</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#141414;--surface2:#1e1e1e;
  --border:rgba(255,255,255,0.07);--text:#f0ede8;--muted:#666;--amber:#F5C842;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;flex-shrink:0;}
.hdr-left{display:flex;flex-direction:column;gap:1px}
.hdr-title{font-size:11px;letter-spacing:0.1em;color:var(--muted);font-weight:500}
.hdr-sub{font-size:10px;color:#444}
.hdr-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:5px;padding:10px 18px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;font-size:11px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.tab.active{background:var(--amber);color:#080808;border-color:var(--amber);font-weight:600}

.deck{flex:1;position:relative;padding:10px 18px 0;overflow:hidden;min-height:0}

.card{
  position:absolute;inset:0;margin:0 18px;
  background:var(--surface);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;
  opacity:0;transform:translateX(56px);
  transition:opacity 0.2s ease,transform 0.2s ease;
  pointer-events:none;border:0.5px solid var(--border);
}
.card.active{opacity:1;transform:translateX(0);pointer-events:all}
.card.exit-left{opacity:0;transform:translateX(-56px)}
.card.exit-right{opacity:0;transform:translateX(56px)}

/* Photo top half */
.photo-wrap{position:relative;flex-shrink:0;height:52%;overflow:hidden;}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:opacity 0.3s;}
.photo-wrap img.loading{opacity:0}
.photo-credit{position:absolute;bottom:6px;right:8px;font-size:9px;color:rgba(255,255,255,0.3);font-style:italic;pointer-events:none;}
.photo-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:32px 16px 10px;
  background:linear-gradient(to top,rgba(8,8,8,0.95) 0%,transparent 100%);
}
.card-name{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#fff;margin-bottom:3px;}
.card-mood{font-size:11px;font-weight:500;}

/* Video top half — clickable thumbnail */
.video-wrap{position:relative;flex-shrink:0;height:52%;overflow:hidden;background:#000;cursor:pointer;}
.video-wrap img.vthumb{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.2s;}
.video-wrap:hover img.vthumb{opacity:0.85;}
.play-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  width:56px;height:56px;border-radius:50%;
  background:rgba(8,8,8,0.75);border:2px solid rgba(255,255,255,0.8);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.play-btn svg{width:22px;height:22px;fill:#fff;margin-left:3px;}
.video-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:28px 16px 10px;
  background:linear-gradient(to top,rgba(8,8,8,0.95) 0%,transparent 100%);
  pointer-events:none;
}

/* Body */
.card-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:11px 16px 10px;display:flex;flex-direction:column;gap:7px;min-height:0;}
.card-body::-webkit-scrollbar{display:none}
.card-cat{font-size:10px;letter-spacing:0.1em;color:var(--muted);}
.expl-en{font-size:13px;line-height:1.55;color:rgba(240,237,232,0.75);}

.translate-btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--surface2);border:0.5px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer;align-self:flex-start;transition:border-color 0.12s;}
.translate-btn:hover{border-color:rgba(255,255,255,0.18)}
.translation-box{display:none;background:rgba(245,200,66,0.08);border:0.5px solid rgba(245,200,66,0.18);border-radius:10px;padding:10px 13px;}
.translation-box.show{display:block}
.lang-tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.lang-tab{font-size:10px;padding:3px 8px;border-radius:12px;border:0.5px solid rgba(245,200,66,0.2);background:transparent;color:rgba(245,200,66,0.5);cursor:pointer;transition:all 0.12s;}
.lang-tab.active{background:var(--amber);color:#080808;border-color:var(--amber);font-weight:600}
.t-text{font-size:13px;color:var(--amber);line-height:1.6;min-height:18px;}
.t-text[dir="rtl"]{text-align:right;font-size:14px;}

.vids{display:flex;flex-direction:column;gap:6px;}
.vid-btn{display:flex;align-items:center;gap:10px;background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--text);transition:border-color 0.12s;}
.vid-btn:hover{border-color:rgba(255,255,255,0.18)}
.vid-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.vid-icon.how{background:rgba(245,200,66,0.12);}
.vid-icon.film{background:rgba(255,255,255,0.06);}
.vid-label{font-size:9px;color:var(--muted);margin-bottom:1px;}
.vid-title{font-size:11px;font-weight:500;line-height:1.3;}

.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 16px;flex-shrink:0;}
.nav-btn{width:44px;height:44px;border-radius:50%;border:0.5px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s;}
.nav-btn:hover{border-color:rgba(255,255,255,0.2);background:var(--surface2)}
.nav-btn:disabled{opacity:0.2;cursor:default}
.dots{display:flex;gap:5px;align-items:center;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:0.3;transition:all 0.15s;}
.dot.active{opacity:1;background:var(--amber);transform:scale(1.6);}
</style>
</head>

<div class="deck" id="deck"></div>

  <button class="nav-btn" id="next">→</button>
</nav>

// ── APP ───────────────────────────────────────────────────────────────────────
const CATS=['All',...new Set(cards.map(c=>c.cat))];
let currentCat='All',filtered=cards,idx=0,animating=false;

function getFiltered(){return currentCat==='All'?cards:cards.filter(c=>c.cat===currentCat);}

function mediaHTML(c){
  if(c.mediaType==='video'){
    const thumb=`https://img.youtube.com/vi/${c.videoId}/hqdefault.jpg`;
    const ytUrl=c.isShort?`https://www.youtube.com/shorts/${c.videoId}`:`https://www.youtube.com/watch?v=${c.videoId}`;
    return `<div class="video-wrap" onclick="window.open('${ytUrl}','_blank')">
      <img class="vthumb" src="${thumb}" alt="${c.name}">
      <div class="play-btn"><svg viewBox="0 0 16 16"><path d="M3 2l10 6-10 6V2z"/></svg></div>
      <div class="video-label">
        <div class="card-name">${c.name}</div>
        <div class="card-mood" style="color:${c.moodColor}">${c.mood}</div>
      </div>
    </div>`;
  }
  const url=`https://images.unsplash.com/photo-${c.photo}?w=800&q=80&fit=crop&auto=format`;
  const pos=c.photoPosition||'center center';
  const fit=c.photoFit||'cover';
  return `<div class="photo-wrap" style="${c.photoFit==='contain'?'background:#0a0a0a':''}">
    <img src="${url}" alt="${c.name}" class="loading" style="object-fit:${fit};object-position:${pos}"
         onload="this.classList.remove('loading')"
         onerror="this.style.background='#1a1a1a'">
    <div class="photo-credit">${c.credit} / Unsplash</div>
    <div class="photo-label">
      <div class="card-name">${c.name}</div>
      <div class="card-mood" style="color:${c.moodColor}">${c.mood}</div>
    </div>
  </div>`;
}

function cardHTML(c){
  const langs=LANGS.map(l=>`<button class="lang-tab" data-code="${l.code}" data-dir="${l.dir}">${l.label}</button>`).join('');
  return `
    ${mediaHTML(c)}
    <div class="card-body">
      <div class="card-cat">${c.cat}</div>
      <div class="expl-en">${c.en}</div>
      <button class="translate-btn" onclick="toggleTr(this)"><span>🌐</span><span class="tl"> Translate</span></button>
      <div class="translation-box">
        <div class="lang-tabs">${langs}</div>
        <div class="t-text"></div>
      </div>
      <div class="vids">
        <a class="vid-btn" href="${c.how.url}" target="_blank" rel="noopener">
          <div class="vid-icon how">📱</div>
          <div><div class="vid-label">How to shoot it</div><div class="vid-title">${c.how.label}</div></div>
        </a>
        <a class="vid-btn" href="${c.film.url}" target="_blank" rel="noopener">
          <div class="vid-icon film">🎬</div>
          <div><div class="vid-label">In a real film</div><div class="vid-title">${c.film.label}</div></div>
        </a>
      </div>
    </div>`;
}

function toggleTr(btn){
  const box=btn.nextElementSibling;
  const show=box.classList.toggle('show');
  btn.querySelector('span').textContent=show?'✕':'🌐';
  btn.querySelector('.tl').textContent=show?' Hide':' Translate';
  if(show&&!box.querySelector('.lang-tab.active'))selectLang(box.querySelector('.lang-tab'));
}

function selectLang(tab){
  const box=tab.closest('.translation-box');
  box.querySelectorAll('.lang-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  const tt=box.querySelector('.t-text');
  tt.textContent=filtered[idx].translations[tab.dataset.code]||'';
  tt.dir=tab.dataset.dir;
}

document.addEventListener('click',e=>{if(e.target.classList.contains('lang-tab'))selectLang(e.target);});

function renderDeck(){
  const deck=document.getElementById('deck');
  deck.innerHTML='';
  filtered.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card'+(i===idx?' active':'');
    el.innerHTML=cardHTML(c);
    deck.appendChild(el);
  });
  document.getElementById('dots').innerHTML=filtered.map((_,i)=>`<div class="dot${i===idx?' active':''}"></div>`).join('');
  document.getElementById('counter').textContent=`${idx+1} / ${filtered.length}`;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===filtered.length-1;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>
    `<button class="tab${c===currentCat?' active':''}" onclick="setcat('${c}')">${c}</button>`
  ).join('');
}

function setcat(cat){currentCat=cat;filtered=getFiltered();idx=0;renderDeck();renderTabs();}

function goTo(to,dir){
  if(animating||to<0||to>=filtered.length)return;
  animating=true;
  const cs=document.querySelectorAll('.card');
  const out=dir==='next'?'exit-left':'exit-right';
  cs[idx].classList.remove('active');cs[idx].classList.add(out);
  setTimeout(()=>{
    cs[idx].classList.remove(out);idx=to;
    cs[idx].classList.add('active');
    cs[idx].querySelector('.card-body').scrollTop=0;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
    document.getElementById('counter').textContent=`${idx+1} / ${filtered.length}`;
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===filtered.length-1;
    animating=false;
  },200);
}

document.getElementById('prev').onclick=()=>goTo(idx-1,'prev');
document.getElementById('next').onclick=()=>goTo(idx+1,'next');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goTo(idx+1,'next');if(e.key==='ArrowLeft')goTo(idx-1,'prev');});

let tx=0;
document.getElementById('deck').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('deck').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>45)dx<0?goTo(idx+1,'next'):goTo(idx-1,'prev');
},{passive:true});

renderTabs();renderDeck();
</script>
