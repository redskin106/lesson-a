fy-content: space-between; }\n.mp-pips-row-v2 { display: flex; gap: 1.5%; margin-bottom: 3%; }\n.mp-pip-v2 { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); opacity: 0.5; transition: all .25s; }\n.mp-pip-v2.current { opacity: 1; border-color: #7052B4; }\n.mp-pip-v2.done { opacity: 1; border: none; }\n.mp-card-grid-v2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; margin-bottom: 5%; }\n.mp-card-wrap-v2 { aspect-ratio: 1/1; cursor: pointer; }\n.mp-card-inner-v2 { width: 100%; height: 100%; position: relative; border-radius: 10px; }\n.mp-card-face-v2 { position: absolute; inset: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: opacity .25s ease, transform .25s ease; }\n.mp-card-back-v2 { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.2); font-size: 6.5cqw; opacity: 1; transform: scaleX(1); }\n.mp-card-front-v2 { background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); flex-direction: column; gap: 3%; font-size: 4cqw; font-weight: 600; color: rgba(255,255,255,0.85); padding: 4%; text-align: center; opacity: 0; transform: scaleX(0); pointer-events: none; }\n.mp-card-inner-v2.flipped .mp-card-back-v2 { opacity: 0; transform: scaleX(0); }\n.mp-card-inner-v2.flipped .mp-card-front-v2 { opacity: 1; transform: scaleX(1); pointer-events: auto; }\n.mp-card-front-v2 .mp-emoji-v2 { font-size: 10.5cqw; line-height: 1; }\n.mp-status-v2 { min-height: 5cqw; text-align: center; font-size: 3.4cqw; color: rgba(255,255,255,0.5); margin-bottom: 3%; }\n\n/* Word Match (v2) */\n.wm-grid-v2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3cqw; margin-bottom: 5%; }\n.wm-col-v2 { display: flex; flex-direction: column; gap: 1.44cqw; }\n.wm-btn-v2 {\n  background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.08);\n  border-radius: 12px; padding: 4% 3%;\n  color: rgba(255,255,255,0.85); font-size: 3.4cqw; font-family: inherit;\n  cursor: pointer; transition: transform .12s, background .15s, border-color .15s, color .15s;\n  min-height: 0; line-height: 1.3;\n  display: flex; align-items: center; justify-content: center; text-align: center;\n}\n.wm-encourage-v2 { text-align: center; font-size: 3.2cqw; color: #AED581; font-weight: 500; opacity: 0; transition: opacity .3s; margin-bottom: 3%; min-height: 0; }\n.wm-nudge-v2 { text-align: center; font-size: 3.2cqw; color: #E8B44A; font-weight: 500; opacity: 0; transition: opacity .3s; margin-bottom: 3%; min-height: 0; }\n.wm-notquite-btn-v2 {\n  display: none; margin: 0 auto;\n  padding: 3% 12%; border-radius: 999px;\n  background: rgba(233,30,99,0.14); border: 1.5px solid rgba(233,30,99,0.4);\n  color: #F48FB1; font-size: 4.4cqw; font-weight: 500; font-family: inherit;\n  cursor: default; pointer-events: none;\n  align-items: center; justify-content: center;\n}\n\n/* Listen & Choose (v2) */\n.lc-question-v2 { color: #fff; font-size: 4.4cqw; text-align: center; margin-bottom: 5%; line-height: 1.4; }\n.lc-listen-btn-v2 {\n  display: flex; align-items: center; justify-content: center; gap: 3%;\n  margin: 0 auto 5%; padding: 3% 12%;\n  background: rgba(112,82,180,0.16); border: 1.5px solid rgba(112,82,180,0.5);\n  border-radius: 999px; color: #C9B8EA; font-size: 4cqw; font-weight: 500;\n  cursor: pointer; font-family: inherit; transition: background .15s;\n}\n.lc-listen-btn-v2.playing { background: rgba(112,82,180,0.28); }\n.lc-listen-icon-v2 { font-size: 4.5cqw; }\n.lc-hint-line-v2 { text-align: center; font-size: 3.2cqw; color: #E8B44A; min-height: 4cqw; margin-bottom: 3%; opacity: 0; transition: opacity .2s; }\n.lc-options-grid-v2 { display: grid; grid-template-columns: 1fr 1fr; row-gap: 1.44cqw; column-gap: 3cqw; margin-bottom: 5%; }\n.lc-option-btn-v2 {\n  background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.08);\n  border-radius: 12px; padding: 4% 3%;\n  color: rgba(255,255,255,0.85); font-size: 3.4cqw; font-family: inherit;\n  cursor: pointer; text-align: center; line-height: 1.3;\n  display: flex; align-items: center; justify-content: center;\n  transition: opacity .25s, transform .12s, border-color .15s, background .15s;\n}\n.lc-option-btn-v2.locked { opacity: 0.35; }\n\n/* Word Scramble (v2) */\n.ws-visual-v2 { text-align: center; margin-bottom: 5%; position: relative; }\n.ws-emoji-v2 { font-size: 15cqw; line-height: 1; }\n.ws-play-btn-v2 {\n  position: absolute; left: 0; top: 0;\n  background: rgba(112,82,180,0.16); border: 1.5px solid rgba(112,82,180,0.5);\n  border-radius: 50%; width: 9cqw; height: 9cqw; font-size: 4cqw;\n  cursor: pointer; color: #C9B8EA; display: flex; align-items: center; justify-content: center;\n}\n.ws-slots-v2 { display: flex; gap: 2%; justify-content: center; flex-wrap: wrap; margin-bottom: 3%; }\n.ws-slot-v2 {\n  width: 11cqw; height: 13cqw; border-radius: 10px;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 5cqw; font-weight: 700; color: #fff; cursor: pointer;\n  transition: border-color .2s, background .2s, color .2s;\n}\n.ws-bank-v2 { display: flex; gap: 2.5%; flex-wrap: wrap; justify-content: center; min-height: 13cqw; margin-bottom: 4%; }\n.ws-tile-v2 {\n  width: 11cqw; height: 13cqw; border-radius: 10px;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  font-size: 5cqw; font-weight: 700; color: rgba(255,255,255,0.85);\n  cursor: pointer; font-family: inherit; transition: opacity .2s;\n}\n.ws-tile-v2.used { opacity: 0; pointer-events: none; }\n.ws-feedback-v2 { min-height: 4cqw; text-align: center; font-size: 3.4cqw; margin-bottom: 2%; }\n\n/* Spelling (v2) */\n.sp-visual-v2 { text-align: center; margin-bottom: 4%; }\n.sp-emoji-v2 { font-size: 13cqw; line-height: 1; margin-bottom: 2%; }\n.sp-listen-row-v2 { display: flex; align-items: center; justify-content: center; gap: 3%; }\n.sp-play-btn-v2 {\n  background: rgba(112,82,180,0.16); border: 1.5px solid rgba(112,82,180,0.5);\n  border-radius: 50%; width: 9cqw; height: 9cqw; font-size: 4cqw;\n  cursor: pointer; color: #C9B8EA; display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0;\n}\n.sp-instruction-v2 { font-size: 3cqw; color: rgba(255,255,255,0.4); }\n.sp-slots-v2 { display: flex; gap: 2%; justify-content: center; flex-wrap: wrap; margin-bottom: 3%; }\n.sp-slot-v2 {\n  width: 11cqw; height: 13cqw; border-radius: 10px;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 5cqw; font-weight: 700; color: #fff; cursor: pointer;\n  transition: border-color .2s, background .2s, color .2s;\n}\n.sp-bank-v2 { display: flex; gap: 2.5%; flex-wrap: wrap; justify-content: center; min-height: 13cqw; margin-bottom: 4%; }\n.sp-tile-v2 {\n  width: 11cqw; height: 13cqw; border-radius: 10px;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  font-size: 5cqw; font-weight: 700; color: rgba(255,255,255,0.85);\n  cursor: pointer; font-family: inherit; transition: opacity .2s;\n}\n.sp-tile-v2.used { opacity: 0; pointer-events: none; }\n.sp-input-v2 {\n  width: 100%; font-size: 5.5cqw; font-weight: 600; text-align: center;\n  padding: 4%; border-radius: 12px; letter-spacing: .08em;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  color: #fff; outline: none; margin-bottom: 4%; font-family: inherit;\n}\n.sp-check-btn-v2 {\n  display: none; margin: 0 auto 3%;\n  padding: 3% 12%; border-radius: 999px;\n  background: rgba(112,82,180,0.16); border: 1.5px solid rgba(112,82,180,0.5);\n  color: #C9B8EA; font-size: 4.4cqw; font-weight: 500; cursor: pointer; font-family: inherit;\n}\n.sp-check-btn-v2:disabled { opacity: 0.4; pointer-events: none; }\n.sp-feedback-v2 { min-height: 4cqw; text-align: center; font-size: 3.4cqw; margin-bottom: 2%; }\n\n/* Build a Sentence (v2) */\n.sb-prompt-v2 { color: rgba(255,255,255,0.5); font-size: 3.4cqw; text-align: center; margin-bottom: 4%; }\n.sb-slots-v2 { display: flex; gap: 2%; flex-wrap: wrap; justify-content: center; min-height: 12cqw; margin-bottom: 5%; }\n.sb-slot-v2 {\n  min-width: 11%; height: 10cqw; padding: 0 3%;\n  border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 3.6cqw; font-weight: 600; color: #fff; cursor: pointer;\n  transition: border-color .2s, background .2s, color .2s;\n}\n.sb-bank-v2 { display: flex; gap: 2.5%; flex-wrap: wrap; justify-content: center; min-height: 10cqw; margin-bottom: 4%; }\n.sb-tile-v2 {\n  padding: 3% 4%; border-radius: 12px;\n  border: 1.5px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);\n  font-size: 3.6cqw; font-weight: 600; color: rgba(255,255,255,0.85);\n  cursor: pointer; font-family: inherit; transition: opacity .2s;\n}\n.sb-tile-v2.used { opacity: 0; pointer-events: none; }\n.sb-feedback-v2 { min-height: 5cqw; text-align: center; font-size: 3.4cqw; margin-bottom: 2%; }\n.sb-legend-v2 { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }\n</style>\n</head>\n<body>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     DEBUG HARNESS \u2014 only shown with ?debug=1\n     Jumps straight to any module/tier, skipping the\n     name picker and linear tier progression.\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"debug-harness\" style=\"display:none; position:fixed; top:0; left:0; right:0; z-index:999; background:#0D1B2A; border-bottom:1px solid #1E3248; padding:10px 12px; gap:8px; flex-wrap:wrap; justify-content:center;\">\n  <select id=\"debug-module-select\" style=\"flex:1; min-width:160px; background:#0D1B2A; border:1.5px solid rgba(255,255,255,0.12); color:#fff; font-size:14px; padding:8px 10px; border-radius:8px; font-family:inherit;\"></select>\n  <select id=\"debug-tier-select\" style=\"background:#0D1B2A; border:1.5px solid rgba(255,255,255,0.12); color:#fff; font-size:14px; padding:8px 10px; border-radius:8px; font-family:inherit;\">\n    <option value=\"bronze\" style=\"background:#0D1B2A; color:#fff;\">Bronze</option>\n    <option value=\"silver\" style=\"background:#0D1B2A; color:#fff;\">Silver</option>\n    <option value=\"gold\" style=\"background:#0D1B2A; color:#fff;\">Gold</option>\n  </select>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 1 \u2014 NAME PICKER\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-name\" class=\"screen active\">\n  <p class=\"welcome-label\">EFL Lesson</p>\n  <h1 class=\"welcome-title\">Hello! \ud83d\udc4b</h1>\n  <p class=\"welcome-sub\">Tap your name to begin.</p>\n  <div class=\"name-grid\" id=\"name-grid\"></div>\n  <button class=\"start-btn\" id=\"start-btn\">Start \u2192</button>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 2 \u2014 MODULE\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-module\" class=\"screen\">\n<div class=\"frame-wrap\">\n<div class=\"app-frame\">\n  <div class=\"layer-bg\"></div>\n  <div class=\"frame-mask\"></div>\n  <div class=\"layer-scene\"></div>\n\n  <div class=\"pos block-header\">\n    <div class=\"v2-header-inner\">\n      <div class=\"v2-header-left\">\n        <div class=\"v2-badge\" id=\"v2-badge\"></div>\n        <span class=\"v2-module-title\" id=\"v2-module-title\"></span>\n      </div>\n      <div class=\"v2-medal-icon\"><img id=\"v2-medal-img\" src=\"assets/bronze.png\" alt=\"tier medal\"></div>\n    </div>\n  </div>\n\n  <div class=\"pos block-qlabel v2-qlabel\" id=\"v2-qlabel\"></div>\n\n  <div class=\"pos block-progress\">\n    <div class=\"v2-prog-track\"><div class=\"v2-prog-fill\" id=\"v2-prog-fill\"></div></div>\n  </div>\n\n  <div class=\"pos block-flowzone\" id=\"module-container\"></div>\n\n  <!-- Shared overlay: toggles between per-question reinforcement and\n       tier-completion content, exactly like module-demos' overlay\n       (reinforceContent/completeContent) \u2014 never a separate screen. -->\n  <div id=\"gr-overlay\" class=\"gr-overlay\">\n    <div id=\"gr-reinforce-content\">\n      <div style=\"font-size:3.5cqw;font-weight:600;color:#AED581;margin-bottom:4%;\">correct!</div>\n      <div style=\"font-size:4cqw;line-height:2;margin-bottom:5%;\" id=\"gr-sentence\"></div>\n      <div id=\"gr-legend\" style=\"margin-bottom:2%;\"></div>\n      <button id=\"gr-continue-btn\" class=\"gr-continue-btn\">Continue</button>\n    </div>\n    <div id=\"gr-complete-content\" style=\"display:none;\">\n      <div class=\"stars-row-frame-v2\" id=\"stars-row\"></div>\n      <div style=\"font-size:5cqw;color:#fff;font-weight:600;margin-bottom:2%;\" id=\"result-title\"></div>\n      <div style=\"font-size:3.6cqw;color:rgba(255,255,255,0.6);margin-bottom:2%;\" id=\"result-score\"></div>\n      <div style=\"font-size:3.4cqw;color:rgba(255,255,255,0.7);line-height:1.5;margin-bottom:6%;\" id=\"result-msg\"></div>\n      <button id=\"result-cta\" class=\"gr-continue-btn\"></button>\n    </div>\n  </div>\n</div>\n</div>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     REINFORCEMENT PANEL\n     Shared by image-vocab, memory-pairs,\n     word-scramble, spelling modules\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"reinforce-panel\" style=\"\n  position:fixed;bottom:0;left:0;right:0;\n  background:#0D1B2A;\n  border-top:1px solid #1E3248;\n  border-radius:20px 20px 0 0;\n  padding:1.5rem 1.5rem 2.25rem;\n  display:flex;flex-direction:column;align-items:center;gap:.75rem;\n  transform:translateY(100%);\n  transition:transform .35s cubic-bezier(.4,0,.2,1);\n  z-index:200;\n\">\n  <div id=\"rp-em\"   style=\"font-size:64px;line-height:1;\"></div>\n  <div id=\"rp-word\" style=\"font-size:28px;font-weight:600;color:#FFD700;letter-spacing:.03em;\"></div>\n  <div id=\"rp-sent\" style=\"font-size:15px;color:#7A9BBF;text-align:center;line-height:1.7;\"></div>\n  <div style=\"width:100%;height:3px;background:#1E3248;border-radius:99px;overflow:hidden;margin-top:.25rem;\">\n    <div id=\"rp-bar\" style=\"height:100%;background:#FFD700;width:0%;border-radius:99px;transition:width linear;\"></div>\n  </div>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 4 \u2014 END SCREEN\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-end\" class=\"screen\">\n  <div class=\"end-header\">\n    <div class=\"end-trophy\">\ud83c\udfc6</div>\n    <div class=\"end-name\"  id=\"end-name\"></div>\n    <div class=\"end-total\" id=\"end-total\"></div>\n  </div>\n  <div class=\"selfassess-wrap\" id=\"selfassess-wrap\">\n    <div class=\"selfassess-prompt\">How did that feel?</div>\n    <div class=\"selfassess-options\">\n      <button class=\"selfassess-btn\" data-val=\"1\" onclick=\"pickSelfAssess(1)\"><span class=\"emoji\">\ud83d\ude05</span><span class=\"label\">Tricky</span></button>\n      <button class=\"selfassess-btn\" data-val=\"2\" onclick=\"pickSelfAssess(2)\"><span class=\"emoji\">\ud83d\ude42</span><span class=\"label\">OK</span></button>\n      <button class=\"selfassess-btn\" data-val=\"3\" onclick=\"pickSelfAssess(3)\"><span class=\"emoji\">\ud83d\ude04</span><span class=\"label\">Easy</span></button>\n    </div>\n  </div>\n  <div class=\"vocab-review-summary\" id=\"vocab-review-summary\" style=\"display:none;\">\n    <div class=\"vocab-review-line\" id=\"vocab-review-line\" onclick=\"toggleVocabReviewPanel()\"></div>\n    <div class=\"vocab-review-panel\" id=\"vocab-review-panel\" style=\"display:none;\"></div>\n  </div>\n  <div class=\"summary-list\" id=\"summary-list\"></div>\n  <button class=\"retry-btn\" id=\"retry-btn\" style=\"display:none\">\u21a9 Retry incomplete modules</button>\n  <button class=\"done-btn\"  id=\"done-btn\">\u2713 Done</button>\n</div>\n\n<script>\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CONFIG\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst STUDENTS       = ['Sophy','Davit','Sam','Nu','Tue','Yee','Lee Ga','Felix','Tin','Ken','Thai'];\nconst PASS_THRESHOLD = 0.6; // 60% to pass a tier\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LESSON DATA\n//  Each module: { id, type, label, data: { bronze, silver, gold } }\n//  Add / replace entries here to build the full lesson.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// Swapped at publish time alongside LESSON \u2014 scopes recordings/tierResults\n// so two different lessons never collide in the same student's local storage.\nconst LESSON_ID = 'lesson-shell-v2-debug';\n\nconst LESSON = [\n  {\n    id: 'mod-1',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 1',\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          { audio: 'dog', question: 'What word did you hear?',\n            options: ['dog','cat','bus','book'], answer: 'dog' },\n          { audio: 'water', question: 'What word did you hear?',\n            options: ['water','chair','rain','cat'], answer: 'water' }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          { audio: 'The dog runs in the park.', question: 'Where does the dog run?',\n            options: ['in the house','in the park','in the school','in the car'], answer: 'in the park' },\n          { audio: 'I eat breakfast before school.', question: 'When does she eat breakfast?',\n            options: ['after dinner','at night','before school','at the weekend'], answer: 'before school' }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          { audio: 'My father drives the car every morning.', question: 'What does the father do every morning?',\n            options: ['reads a book','drives the car','goes to school','walks the dog'], answer: 'drives the car' },\n          { audio: 'She goes to the library after class to study quietly.', question: 'Why does she go to the library?',\n            options: ['to meet a friend','to study quietly','to borrow a book','to eat lunch'], answer: 'to study quietly' }\n        ]\n      }\n    }\n  },\n  {\n    id: 'mod-2',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 2',\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          { audio: 'water', question: 'What word did you hear?',\n            options: ['water','chair','rain','cat'], answer: 'water' },\n          { audio: 'school', question: 'What word did you hear?',\n            options: ['school','phone','money','house'], answer: 'school' }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          { audio: 'I eat breakfast before school.', question: 'When does she eat breakfast?',\n            options: ['after dinner','at night','before school','at the weekend'], answer: 'before school' },\n          { audio: 'It is cold in the morning.', question: 'When is it cold?',\n            options: ['at night','in the afternoon','in the morning','at the weekend'], answer: 'in the morning' }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          { audio: 'She goes to the library after class to study quietly.', question: 'Why does she go to the library?',\n            options: ['to meet a friend','to study quietly','to borrow a book','to eat lunch'], answer: 'to study quietly' },\n          { audio: 'We visit our grandparents on the weekend because we miss them.', question: 'Why do they visit their grandparents?',\n            options: ['because they are bored','because they miss them','because school is closed','because they live nearby'], answer: 'because they miss them' }\n        ]\n      }\n    }\n  },\n  {\n    id: 'mod-3',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 3',\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          { audio: 'school', question: 'What word did you hear?',\n            options: ['school','phone','money','house'], answer: 'school' },\n          { audio: 'dog', question: 'What word did you hear?',\n            options: ['dog','cat','bus','book'], answer: 'dog' }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          { audio: 'It is cold in the morning.', question: 'When is it cold?',\n            options: ['at night','in the afternoon','in the morning','at the weekend'], answer: 'in the morning' },\n          { audio: 'I eat breakfast before school.', question: 'When does she eat breakfast?',\n            options: ['after dinner','at night','before school','at the weekend'], answer: 'before school' }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          { audio: 'We visit our grandparents on the weekend because we miss them.', question: 'Why do they visit their grandparents?',\n            options: ['because they are bored','because they miss them','because school is closed','because they live nearby'], answer: 'because they miss them' },\n          { audio: 'My father drives the car every morning.', question: 'What does the father do every morning?',\n            options: ['reads a book','drives the car','goes to school','walks the dog'], answer: 'drives the car' }\n        ]\n      }\n    }\n  }\n\n  ,\n  // \u2500\u2500 GAP FILL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool. `pick` is configurable per lesson/module (teacher-set).\n  {\n    id: 'mod-4',\n    type: 'gap-fill',\n    label: 'Fill the Gap',\n    canDo: {\n      bronze: 'I can pick the right word for a simple sentence.',\n      silver: 'I can complete sentences using context clues.',\n      gold:   'I can complete sentences confidently, even tricky ones.',\n    },\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          {\n            sentence: 'I ___ water every day.',\n            options: ['drink', 'eat', 'sleep', 'run'],\n            answer: 'drink',\n            tokens: [\n              { t:'I', r:'subject' }, { t:'drink', r:'verb' },\n              { t:'water', r:'object' }, { t:'every day', r:'time' }\n            ]\n          },\n          {\n            sentence: 'He ___ to school by bus.',\n            options: ['goes', 'eats', 'sleeps', 'drinks'],\n            answer: 'goes',\n            tokens: [\n              { t:'He', r:'subject' }, { t:'goes', r:'verb' },\n              { t:'to school', r:'place' }, { t:'by bus', r:'time' }\n            ]\n          }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          {\n            sentence: 'She ___ her homework before dinner.',\n            options: ['does', 'eats', 'reads', 'plays', 'sleeps'],\n            answer: 'does',\n            tokens: [\n              { t:'She', r:'subject' }, { t:'does', r:'verb' },\n              { t:'her homework', r:'object' }, { t:'before dinner', r:'time' }\n            ]\n          },\n          {\n            sentence: 'They ___ football every Saturday.',\n            options: ['play', 'eat', 'read', 'watch', 'sleep'],\n            answer: 'play',\n            tokens: [\n              { t:'They', r:'subject' }, { t:'play', r:'verb' },\n              { t:'football', r:'object' }, { t:'every Saturday', r:'time' }\n            ]\n          }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          {\n            sentence: 'My uncle works at the hospital and ___ sick people.',\n            options: ['helps', 'calls', 'reads', 'drives', 'meets', 'teaches'],\n            answer: 'helps',\n            tokens: [\n              { t:'My uncle', r:'subject' }, { t:'works', r:'verb' },\n              { t:'at the hospital', r:'place' }, { t:'and', r:'connector' },\n              { t:'helps', r:'verb' }, { t:'sick people', r:'object' }\n            ]\n          },\n          {\n            sentence: 'We usually visit our grandparents and ___ dinner together.',\n            options: ['eat', 'buy', 'read', 'watch', 'drive', 'clean'],\n            answer: 'eat',\n            tokens: [\n              { t:'We', r:'subject' }, { t:'usually', r:'connector' }, { t:'visit', r:'verb' },\n              { t:'our grandparents', r:'object' }, { t:'and', r:'connector' },\n              { t:'eat', r:'verb' }, { t:'dinner', r:'object' }, { t:'together', r:'connector' }\n            ]\n          }\n        ]\n      }\n    }\n  },\n\n  // \u2500\u2500 TRUE / FALSE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool. `pick` is configurable per lesson/module (teacher-set).\n  {\n    id: 'mod-5',\n    type: 'true-false',\n    label: 'True or False',\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          {\n            statement: 'A dog is an animal.',\n            answer: true,\n            tokens: [{ t:'A dog', r:'subject' }, { t:'is', r:'verb' }, { t:'an animal', r:'object' }]\n          },\n          {\n            statement: 'A cat can fly.',\n            answer: false,\n            tokens: [{ t:'A cat', r:'subject' }, { t:'can fly', r:'verb' }]\n          }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          {\n            statement: 'We eat breakfast at night.',\n            answer: false,\n            tokens: [\n              { t:'We', r:'subject' }, { t:'eat', r:'verb' },\n              { t:'breakfast', r:'object' }, { t:'at night', r:'time' }\n            ]\n          },\n          {\n            statement: 'Students go to school on Sunday.',\n            answer: false,\n            tokens: [\n              { t:'Students', r:'subject' }, { t:'go', r:'verb' },\n              { t:'to school', r:'place' }, { t:'on Sunday', r:'time' }\n            ]\n          }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          {\n            statement: 'She goes to the library after class to study quietly.',\n            answer: true,\n            tokens: [\n              { t:'She', r:'subject' }, { t:'goes', r:'verb' },\n              { t:'to the library', r:'place' }, { t:'after class', r:'time' }\n            ]\n          },\n          {\n            statement: 'My brother works at a hospital and fixes cars every night.',\n            answer: false,\n            tokens: [\n              { t:'My brother', r:'subject' }, { t:'works', r:'verb' },\n              { t:'at a hospital', r:'place' }, { t:'and', r:'connector' },\n              { t:'fixes cars', r:'verb' }, { t:'every night', r:'time' }\n            ]\n          }\n        ]\n      }\n    }\n  },\n\n  // \u2500\u2500 WORD MATCH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool, { pick, items: [{left,right}] }. pick defaults to\n  // the full pool size for now (matches the locked demo's \"use them all\"\n  // behavior) but is ready for a teacher to add more than pick draws.\n  {\n    id: 'mod-6',\n    type: 'word-match',\n    label: 'Word Match',\n    data: {\n      bronze: {\n        pick: 3,\n        items: [\n          { left: 'dog',   right: 'an animal' },\n          { left: 'water', right: 'a drink'   },\n          { left: 'book',  right: 'you read it' }\n        ]\n      },\n      silver: {\n        pick: 4,\n        items: [\n          { left: 'hungry', right: 'want food'  },\n          { left: 'tired',  right: 'need sleep' },\n          { left: 'happy',  right: 'feel good'  },\n          { left: 'cold',   right: 'not warm'   }\n        ]\n      },\n      gold: {\n        pick: 5,\n        items: [\n          { left: 'library',   right: 'place to study'    },\n          { left: 'homework',  right: 'work after school' },\n          { left: 'breakfast', right: 'morning meal'      },\n          { left: 'neighbor',  right: 'person nearby'     },\n          { left: 'weekend',   right: 'Saturday & Sunday' }\n        ]\n      }\n    }\n  },\n\n  // \u2500\u2500 SEQUENCING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool, { pick, items: [{prompt, sequence, correct}] }.\n  {\n    id: 'mod-7',\n    type: 'sequencing',\n    label: 'Put in Order',\n    data: {\n      bronze: {\n        pick: 2,\n        items: [\n          {\n            prompt: 'Put these in order \u2014 morning first.',\n            sequence: ['eat lunch', 'wake up', 'eat breakfast'],\n            correct:  ['wake up', 'eat breakfast', 'eat lunch']\n          },\n          {\n            prompt: 'Put these in order.',\n            sequence: ['go to bed', 'eat dinner', 'brush teeth'],\n            correct:  ['eat dinner', 'brush teeth', 'go to bed']\n          }\n        ]\n      },\n      silver: {\n        pick: 2,\n        items: [\n          {\n            prompt: 'Put these in the right order.',\n            sequence: ['go to school', 'wake up', 'eat dinner', 'eat breakfast'],\n            correct:  ['wake up', 'eat breakfast', 'go to school', 'eat dinner']\n          },\n          {\n            prompt: 'Put these in the right order.',\n            sequence: ['do homework', 'come home', 'eat lunch', 'go to school'],\n            correct:  ['go to school', 'eat lunch', 'come home', 'do homework']\n          }\n        ]\n      },\n      gold: {\n        pick: 2,\n        items: [\n          {\n            prompt: 'Put these in the right order.',\n            sequence: ['go home', 'wake up', 'eat dinner', 'eat breakfast', 'go to school'],\n            correct:  ['wake up', 'eat breakfast', 'go to school', 'go home', 'eat dinner']\n          },\n          {\n            prompt: 'Put these in the right order.',\n            sequence: ['brush teeth', 'wake up', 'go to bed', 'get dressed', 'eat breakfast'],\n            correct:  ['wake up', 'brush teeth', 'get dressed', 'eat breakfast', 'go to bed']\n          }\n        ]\n      }\n    }\n  },\n\n  // \u2500\u2500 AUDIO SPEAKING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool, { pick, items: [{prompt,target,keyWords}] }. This\n  // module's test data was missed during the original merge \u2014 kept the\n  // pre-merge single-item shape while the renderer above (and the Lesson\n  // Builder's authoring side) were already pool-based. Fixed together.\n  {\n    id: 'mod-8',\n    type: 'audio-speaking',\n    label: 'Say It',\n    data: {\n      bronze: { pick: 1, items: [\n        { prompt: 'Say this word:', target: 'water', keyWords: ['water'] },\n      ]},\n      silver: { pick: 1, items: [\n        { prompt: 'Say this sentence:', target: 'I eat breakfast before school.', keyWords: ['eat', 'breakfast', 'school'] },\n      ]},\n      gold: { pick: 1, items: [\n        { prompt: 'Say this sentence:', target: 'We visit our grandparents on the weekend because we miss them.', keyWords: ['visit', 'grandparents', 'weekend', 'miss'] },\n      ]}\n    }\n  },\n\n  // \u2500\u2500 GAME 1: Memory Pairs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // v2: per-tier pool \u2014 { pick, flipback(ms), items }. Separate pool per\n  // tier now (was shared across tiers) \u2014 same standardization as everything\n  // else. `tokens` drive the grammar-color sentence reveal on match.\n  {\n    id: 'mod-game-1',\n    type: 'memory-pairs',\n    label: 'Memory Pairs',\n    data: {\n      bronze: {\n        pick: 3,\n        flipback: 1200,\n        items: [\n          { word:'dog',   emoji:'\ud83d\udc15', image:null, sentence:'The dog runs in the park.',\n            tokens:[{t:'The dog',r:'subject'},{t:'runs',r:'verb'},{t:'in the park',r:'place'}] },\n          { word:'water', emoji:'\ud83d\udca7', image:null, sentence:'I drink water every day.',\n            tokens:[{t:'I',r:'subject'},{t:'drink',r:'verb'},{t:'water',r:'object'},{t:'every day',r:'time'}] },\n          { word:'cat',   emoji:'\ud83d\udc08', image:null, sentence:'The cat sleeps on the chair.',\n            tokens:[{t:'The cat',r:'subject'},{t:'sleeps',r:'verb'},{t:'on the chair',r:'place'}] },\n          { word:'bus',   emoji:'\ud83d\ude8c', image:null, sentence:'She takes the bus to school.',\n            tokens:[{t:'She',r:'subject'},{t:'takes',r:'verb'},{t:'the bus',r:'object'},{t:'to school',r:'place'}] }\n        ]\n      },\n      silver: {\n        pick: 4,\n        flipback: 900,\n        items: [\n          { word:'school', emoji:'\ud83c\udfeb', ns: [ {text:'She', role:'subject'}, {text:'needs',  role:'verb'}, {text:'help',   role:'object'}, {text:'because', role:null}, {text:'she is tired',role:null} ] },\n          { tokens: [ {text:'We',  role:'subject'}, {text:'eat',    role:'verb'}, {text:'lunch',  role:'object'}, {text:'before',  role:null}, {text:'school',      role:'place'}  ] },\n          { tokens: [ {text:'He',  role:'subject'}, {text:'likes',  role:'verb'}, {text:'it',     role:'object'}, {text:'because', role:null}, {text:'it is sweet', role:null} ] },\n          { tokens: [ {text:'I',   role:'subject'}, {text:'go',     role:'verb'}, {text:'home',   role:'place'},  {text:'after',   role:null}, {text:'school',      role:'place'}  ] },\n          { tokens: [ {text:'She', role:'subject'}, {text:'drinks', role:'verb'}, {text:'water',  role:'object'}, {text:'before',  role:null}, {text:'bed',         role:'place'}  ] }\n        ]\n      },\n      gold: {\n        pick: 4,\n        items: [\n          { tokens: [ {text:'I',    role:'subject'}, {text:'really', role:null}, {text:'like',  role:'verb'}, {text:'it',        role:'object'}, {text:'because', role:null}, {text:'it',   role:'subject'}, {text:'is',    role:'verb'}, {text:'warm', role:null} ] },\n          { tokens: [ {text:'She',  role:'subject'}, {text:'eats',   role:'verb'}, {text:'breakfast', role:'object'}, {text:'before', role:null}, {text:'she',  role:'subject'}, {text:'goes',  role:'verb'}, {text:'to', role:null}, {text:'school', role:'place'} ] },\n          { tokens: [ {text:'He',   role:'subject'}, {text:'drives', role:'verb'}, {text:'the',   role:null},   {text:'car',   role:'object'}, {text:'because', role:null}, {text:'he',   role:'subject'}, {text:'likes', role:'verb'}, {text:'it', role:'object'} ] },\n          { tokens: [ {text:'We',   role:'subject'}, {text:'visit',  role:'verb'}, {text:'our',   role:null},   {text:'grandparents', role:'object'}, {text:'because', role:null}, {text:'we', role:'subject'}, {text:'miss', role:'verb        l3: { tiles: ['with a zip', 'with a handle', 'looks old', 'looks new'], because_mode: 'typed' }\n        }\n      ]}\n    }\n  },\n\n  // \u2500\u2500 IMAGE-TO-FEELING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // Uses the real, Cambridge-validated colour-feeling pairs from the\n  // curriculum spec (purple=exciting/mysterious, orange=warm/exciting,\n  // green=natural/quiet, grey=quiet/serious) \u2014 not invented content.\n  {\n    id: 'mod-10',\n    type: 'image-to-feeling',\n    label: 'How Does It Feel?',\n    data: {\n      bronze: { pick: 1, items: [\n        { stimulusType: 'colour', stimulusValue: '#F97316', stimulusLabel: 'orange',\n          mascotEmoji: '\ud83d\udc7d', mascotName: 'Zorp',\n          tiles: ['happy', 'excited', 'calm', 'scared'] },\n      ]},\n      silver: { pick: 1, items: [\n        { stimulusType: 'colour', stimulusValue: '#8B5CF6', stimulusLabel: 'purple',\n          mascotEmoji: '\ud83d\udc7d', mascotName: 'Zorp',\n          tiles: ['excited', 'curious', 'nervous', 'calm'] },\n      ]},\n      gold: { pick: 1, items: [\n        { stimulusType: 'colour', stimulusValue: '#6B7280', stimulusLabel: 'grey',\n          mascotEmoji: '\ud83d\udc7d', mascotName: 'Zorp',\n          tiles: ['quiet', 'serious', 'mysterious', 'peaceful'], because_mode: 'typed' },\n      ]}\n    }\n  },\n\n  // \u2500\u2500 CREATIVE REFLECTION CARD \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // Real templates from the Objects lesson (Stage 1 of the Description\n  // Pathway) \u2014 the same card grows richer as the tier grows, matching how\n  // it's actually used in the notebook ritual.\n  {\n    id: 'mod-11',\n    type: 'creative-reflection',\n    label: 'Reflection Card',\n    data: {\n      bronze: { pick: 1, items: [\n        { template: 'It is a {0}.', blankHints: ['thing'] },\n      ]},\n      silver: { pick: 1, items: [\n        { template: 'It is a {0}, {1}, {2}.', blankHints: ['size', 'shape', 'colour'] },\n      ]},\n      gold: { pick: 1, items: [\n        { template: 'It is a {0}, {1}, {2} with {3}.', blankHints: ['size', 'shape', 'colour', 'detail'] },\n      ]}\n    }\n  },\n];\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  STATE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LOCAL PROGRESS DATABASE\n//  One IndexedDB shared by every module that needs to remember something\n//  across sessions, keyed by student name first (handles shared classroom\n//  devices \u2014 a student only sees their own data as long as they pick their\n//  own name). Three stores:\n//    - recordings:    Say It self-eval audio, last 3 attempts per exercise\n//    - tierResults:   pass/fail + score history, powers the future student\n//                      progress dashboard and lets returning students keep\n//                      their unlocked tiers instead of starting over\n//    - wordExposure:  reserved for future spaced-repetition vocabulary\n//                      tracking \u2014 created now, empty, so adding it later\n//                      never needs an IndexedDB version-bump migration\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst PROGRESS_DB_NAME = 'efl-progress';\nconst PROGRESS_DB_VERSION = 3; // bumped to add sessionTracker for spaced repetition \u2014 IndexedDB only runs onupgradeneeded on a version increase\nlet _progressDBPromise = null;\n\nfunction openProgressDB() {\n  if (_progressDBPromise) return _progressDBPromise;\n\n  // Ask the browser for stronger persistence guarantees on this data \u2014 by\n  // default, storage is \"best-effort\" and browsers (Safari on iOS\n  // especially) can evict it under storage pressure, in Private Browsing,\n  // or after a period of disuse. This doesn't force anything and the grant\n  // outcome is deliberately ignored here (fire-and-forget, never awaited)\n  // \u2014 recordings/progress still work either way, this just lowers the odds\n  // of silent data loss. Guarded so it can never throw on an older browser.\n  if (navigator.storage && navigator.storage.persist) {\n    navigator.storage.persist().catch(() => {});\n  }\n\n  _progressDBPromise = new Promise((resolve, reject) => {\n    const req = indexedDB.open(PROGRESS_DB_NAME, PROGRESS_DB_VERSION);\n    req.onupgradeneeded = () => {\n      const db = req.result;\n      if (!db.objectStoreNames.contains('recordings'))   db.createObjectStore('recordings',   { keyPath: 'key' });\n      if (!db.objectStoreNames.contains('tierResults'))   db.createObjectStore('tierResults',   { keyPath: 'key' });\n      if (!db.objectStoreNames.contains('wordExposure'))   db.createObjectStore('wordExposure',   { keyPath: 'key' });\n      if (!db.objectStoreNames.contains('selfAssessments'))   db.createObjectStore('selfAssessments',   { keyPath: 'key' });\n      if (!db.objectStoreNames.contains('sessionTracker'))   db.createObjectStore('sessionTracker',   { keyPath: 'key' });\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n    // Without this, a version-bump open request just hangs forever (neither\n    // onsuccess nor onerror fires) if an older tab still has the DB open at\n    // the previous version \u2014 reject explicitly instead of leaving every\n    // awaiting caller (saveTierResult, saveSelfAssessment, etc.) stuck.\n    req.onblocked = () => reject(new Error('Progress database is open in another tab \u2014 please close other tabs of this lesson and reload.'));\n  });\n  return _progressDBPromise;\n}\n\nfunction _idbGet(storeName, key) {\n  return openProgressDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(storeName, 'readonly');\n    const req = tx.objectStore(storeName).get(key);\n    req.onsuccess = () => resolve(req.result || null);\n    req.onerror = () => reject(req.error);\n  })).catch(() => null); // local storage is a nice-to-have, never block the lesson on it failing\n}\nfunction _idbPut(storeName, value) {\n  return openProgressDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(storeName, 'readwrite');\n    tx.objectStore(storeName).put(value);\n    tx.oncomplete = () => resolve();\n    tx.onerror = () => reject(tx.error);\n  })).catch(() => {}); // same \u2014 a failed save shouldn't interrupt the student\n}\nfunction _idbGetAllForStudent(storeName, studentPrefix) {\n  return openProgressDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(storeName, 'readonly');\n    const req = tx.objectStore(storeName).getAll();\n    req.onsuccess = () => resolve((req.result || []).filter(r => r.key.startsWith(studentPrefix)));\n    req.onerror = () => reject(req.error);\n  })).catch(() => []);\n}\n\nfunction recordingKey(student, moduleIndex, tier, itemIndex) {\n  return `${student}::${LESSON_ID}::${moduleIndex}::${tier}::${itemIndex}`;\n}\nasync function saveRecording(student, moduleIndex, tier, itemIndex, blob) {\n  const key = recordingKey(student, moduleIndex, tier, itemIndex);\n  const existing = await _idbGet('recordings', key);\n  const attempts = (existing && existing.attempts) || [];\n  attempts.push({ timestamp: Date.now(), blob });\n  while (attempts.length > 3) attempts.shift(); // keep the last 3 only\n  await _idbPut('recordings', { key, attempts });\n  return attempts;\n}\nasync function getRecordings(student, moduleIndex, tier, itemIndex) {\n  const rec = await _idbGet('recordings', recordingKey(student, moduleIndex, tier, itemIndex));\n  return (rec && rec.attempts) || [];\n}\n\nfunction tierResultKey(student, moduleIndex, tier) {\n  return `${student}::${LESSON_ID}::${moduleIndex}::${tier}`;\n}\nasync function saveTierResult(student, moduleIndex, tier, score, passed) {\n  const key = tierResultKey(student, moduleIndex, tier);\n  await _idbPut('tierResults', { key, student, moduleIndex, tier, score, passed, updatedAt: Date.now() });\n}\nasync function getTierResultsForStudent(student) {\n  return _idbGetAllForStudent('tierResults', `${student}::${LESSON_ID}::`);\n}\nasync function saveSelfAssessment(student, value) {\n  // One rating per student per lesson-completion visit \u2014 a private, in-the-moment\n  // gut-check (matches the classroom's \"three fingers\" ritual), never scored or\n  // graded, kept separate from tierResults on purpose.\n  const key = `${student}::${LESSON_ID}::${Date.now()}`;\n  await _idbPut('selfAssessments', { key, student, value, updatedAt: Date.now() });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SPACED REPETITION / VOCABULARY RECYCLING\n//  Leitner box system, session-based (not calendar-based) intervals \u2014\n//  see SPACED_REPETITION_SPEC.md. wordExposure and sessionTracker are both\n//  deliberately NOT lesson-scoped (no LESSON_ID in their keys, unlike\n//  tierResults/recordings) \u2014 word mastery genuinely generalizes across\n//  lessons, so it shouldn't reset just because a student opened a\n//  different lesson. Both stores live in the same shared IndexedDB\n//  database, and every published lesson shares one origin (GitHub Pages),\n//  so this cross-lesson persistence works correctly in practice.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction normalise(word) {\n  return (word || '').toString().trim().toLowerCase();\n}\n\n// Box -> sessions until due again. Box 5 has no interval \u2014 it's retired\n// from active rotation (nextDue stays null).\nconst LEITNER_INTERVALS = { 1: 1, 2: 2, 3: 4, 4: 8 };\n\nfunction wordExposureKey(student, normalisedWord) {\n  return `${student}::${normalisedWord}`;\n}\n\n// One increment per genuine \"app open + completed at least one exercise\"\n// event, never per question. sessionCounted is a plain module-scope\n// variable, so it can only ever be true once per real page load \u2014 exactly\n// matching the spec's definition of a session.\nlet sessionCounted = false;\nlet _cachedSessionNumber = null;\n\nasync function ensureSessionCounted(student) {\n  if (sessionCounted) return;\n  sessionCounted = true;\n  const key = `session::${student}`;\n  const existing = await _idbGet('sessionTracker', key);\n  const newSession = (existing ? existing.currentSession : 0) + 1;\n  _cachedSessionNumber = newSession;\n  await _idbPut('sessionTracker', { key, student, currentSession: newSession, updatedAt: Date.now() });\n}\n\n// Records one exposure (correct or miss) for a single word, creating the\n// record on first encounter. Safe to call with any raw (non-normalised)\n// word string \u2014 normalises internally.\n// Tracks every word touched THIS session, for the completion screen's\n// \"N words reviewed today\" panel. Populated as a side effect of\n// recordWordExposure \u2014 one source of truth, not duplicated at each of the\n// 9 module call sites. wasNew distinguishes a genuine first encounter\n// (no meaningful \"before\" box to show) from a real box transition.\nlet sessionReviewedWords = new Map(); // word -> { beforeBox, afterBox, wasNew, lastCorrect }\n\nasync function recordWordExposure(student, rawWord, moduleType, correct) {\n  const word = normalise(rawWord);\n  if (!word) return null;\n  await ensureSessionCounted(student);\n  const currentSession = _cachedSessionNumber || 1;\n  const key = wordExposureKey(student, word);\n\n  let record = await _idbGet('wordExposure', key);\n  const wasNew = !record;\n  if (!record) {\n    record = { key, student, word, box: 1, exposures: 0, misses: 0, lastSeen: Date.now(), nextDue: currentSession + 1, sourceModules: [] };\n  }\n  const beforeBox = record.box;\n\n  if (correct) {\n    if (record.box < 5) record.box += 1;\n    record.exposures += 1;\n  } else {\n    record.box = 1;\n    record.misses += 1;\n  }\n  record.lastSeen = Date.now();\n  record.nextDue = record.box === 5 ? null : currentSession + LEITNER_INTERVALS[record.box];\n  if (!record.sourceModules.includes(moduleType)) record.sourceModules.push(moduleType);\n\n  await _idbPut('wordExposure', record);\n  sessionReviewedWords.set(word, { beforeBox, afterBox: record.box, wasNew, lastCorrect: correct });\n  return record;\n}\n\n// Manual self-assessment adjustment \u2014 the spec's escape valve for\n// miscalibration. \"I know this\" moves a word up one box even without\n// another correct exercise attempt; \"still learning\" drops it straight to\n// Box 1. Both update sessionReviewedWords too, so the completion panel\n// reflects the adjustment immediately rather than showing stale numbers.\nasync function manuallyAdjustWord(student, rawWord, direction) {\n  const word = normalise(rawWord);\n  if (!word) return null;\n  const currentSession = _cachedSessionNumber || 1;\n  const key = wordExposureKey(student, word);\n\n  let record = await _idbGet('wordExposure', key);\n  if (!record) return null; // nothing to adjust if it was never actually recorded\n  const beforeBox = record.box;\n\n  if (direction === 'up') {\n    if (record.box < 5) record.box += 1;\n  } else {\n    record.box = 1;\n  }\n  record.lastSeen = Date.now();\n  record.nextDue = record.box === 5 ? null : currentSession + LEITNER_INTERVALS[record.box];\n\n  await _idbPut('wordExposure', record);\n  const existing = sessionReviewedWords.get(word);\n  sessionReviewedWords.set(word, { beforeBox: existing ? existing.beforeBox : beforeBox, afterBox: record.box, wasNew: existing ? existing.wasNew : false, lastCorrect: direction === 'up' });\n  return record;\n}\n\n// Word passport integration \u2014 box number drives tick status automatically,\n// no separate field needed. No digital passport screen exists yet (it's\n// currently a physical notebook card per the classroom ritual), so this is\n// the ready-to-use mapping for whenever one gets built, not wired into any\n// UI on its own.\nfunction passportTickForBox(box) {\n  if (box >= 5) return '\u2713\u2713'; // mastered\n  if (box === 4) return '\u2713';  // confident\n  return '';                  // still learning, unmarked\n}\n\n// Whole-lesson exposure cache \u2014 loaded once when the student clicks Start,\n// not per-module. This keeps every module's own item-selection logic\n// synchronous (unchanged in shape from before), instead of needing every\n// render() function across the whole registry to become async-aware just\n// to draw its session's items.\nlet wordExposureCache = new Map();\n\n// Central word-field mapping for cache population only \u2014 uses each\n// module's REAL data shape as actually implemented in this shell, not the\n// spec's shorthand field names (e.g. Word Match has no 'answer' field at\n// all, it uses left/right \u2014 'left' is the real target word there).\nfunction extractLessonTrackableWords() {\n  const words = new Set();\n  LESSON.forEach(mod => {\n    ['bronze', 'silver', 'gold'].forEach(t => {\n      const tierData = mod.data && mod.data[t];\n      if (!tierData || !tierData.items) return;\n      tierData.items.forEach(it => {\n        if (mod.type === 'sentence-building') {\n          (it.tokens || []).forEach(tk => { if (tk.text) words.add(normalise(tk.text)); });\n        } else if (mod.type === 'description-pyramid') {\n          if (it.l1 && it.l1.answer) words.add(normalise(it.l1.answer));\n          (it.l2 || []).forEach(g => { if (g.answer) words.add(normalise(g.answer)); });\n        } else if (mod.type === 'word-match') {\n          if (it.left) words.add(normalise(it.left));\n        } else if (mod.type === 'gap-fill' || mod.type === 'audio-understanding') {\n          if (it.answer) words.add(normalise(it.answer));\n        } else if (mod.type === 'memory-pairs' || mod.type === 'image-vocab' || mod.type === 'spelling' || mod.type === 'word-scramble') {\n          if (it.word) words.add(normalise(it.word));\n        }\n      });\n    });\n  });\n  return [...words];\n}\n\nasync function loadWordExposureCache(student) {\n  wordExposureCache = new Map();\n  const words = extractLessonTrackableWords();\n  await Promise.all(words.map(async word => {\n    const rec = await _idbGet('wordExposure', wordExposureKey(student, word));\n    if (rec) wordExposureCache.set(word, rec);\n  }));\n}\n\n// Drop-in replacement for the safeShuffle(items,()=>false).slice(0,pick)\n// pattern every module currently uses to draw its session. getWordFn lets\n// each module supply its own accessor for \"the word this item tests\",\n// since that varies by module shape. Falls back to the exact original\n// random behaviour whenever the cache isn't populated (debug-harness\n// direct module jumps skip the Start flow entirely, and a brand new\n// device naturally starts with an empty cache) \u2014 recycling is purely\n// additive, never a requirement for a module to function.\nfunction biasedSelect(items, pick, getWordFn) {\n  if (wordExposureCache.size === 0) {\n    return safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n  }\n  const currentSession = _cachedSessionNumber || 1;\n  const scored = items.map(item => {\n    const word = normalise(getWordFn(item));\n    const rec = word ? wordExposureCache.get(word) : null;\n    const box = rec ? rec.box : 0; // never-seen words get top priority\n    const isDue = rec ? (rec.nextDue !== null && currentSession >= rec.nextDue) : true;\n    return { item, box, isDue, _tiebreak: Math.random() };\n  });\n  scored.sort((a, b) => {\n    if (a.isDue !== b.isDue) return a.isDue ? -1 : 1;\n    if (a.box !== b.box) return a.box - b.box;\n    return a._tiebreak - b._tiebreak;\n  });\n  return scored.slice(0, Math.min(pick, items.length)).map(s => s.item);\n}\n\nfunction timeAgo(timestamp) {\n  const diffMs = Date.now() - timestamp;\n  const mins = Math.round(diffMs / 60000);\n  if (mins < 1) return 'just now';\n  if (mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;\n  const hours = Math.round(mins / 60);\n  if (hours < 24) return `${hours} hour${hours===1?'':'s'} ago`;\n  const days = Math.round(hours / 24);\n  if (days === 1) return 'yesterday';\n  return `${days} days ago`;\n}\n\nconst state = {\n  student: null,\n  currentModuleIndex: 0,\n  currentTier: 'bronze',\n  results: buildResults(),\n  replayMode: false, // true when a module is launched from the end-screen's free replay grid\n};\n\nfunction buildResults() {\n  return LESSON.map(() => ({\n    bronze:   { score: null, passed: false },\n    silver:   { score: null, passed: false },\n    gold:     { score: null, passed: false },\n    complete: false\n  }));\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  HELPERS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst TIERS = ['bronze','silver','gold'];\nconst nextTier  = t => TIERS[TIERS.indexOf(t) + 1] || null;\nconst cap       = s => s.charAt(0).toUpperCase() + s.slice(1);\n\nfunction showScreen(id) {\n  document.querySelectorAll('.screen').forEach(s => {\n    s.classList.remove('active');\n    s.style.display = 'none';\n  });\n  const el = document.getElementById(id);\n  el.style.display = 'flex';\n  el.classList.add('active');\n  el.scrollTop = 0;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 1 \u2014 NAME PICKER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst nameGrid = document.getElementById('name-grid');\nconst startBtn = document.getElementById('start-btn');\n\nSTUDENTS.forEach(name => {\n  const btn = document.createElement('button');\n  btn.className   = 'name-btn';\n  btn.textContent = name;\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));\n    btn.classList.add('selected');\n    state.student = name;\n    startBtn.classList.add('ready');\n  });\n  nameGrid.appendChild(btn);\n});\n\nstartBtn.addEventListener('click', async () => {\n  if (!state.student) return;\n  state.currentModuleIndex = 0;\n  state.currentTier = 'bronze';\n  state.results = buildResults();\n\n  // Restore this student's real pass/fail + score history from previous\n  // sessions. Doesn't change where the lesson starts (still module 0,\n  // bronze) \u2014 that's a separate \"resume where you left off\" UX decision,\n  // not assumed here. This just means state.results is honest from the\n  // first render instead of quietly pretending prior sessions never\n  // happened, which matters for anything downstream that reads it.\n  // Wrapped in try/catch \u2014 if the progress DB is ever unavailable (private\n  // browsing restrictions, storage quota, another tab holding it open),\n  // the lesson should still start rather than leave the student stuck on\n  // the name screen with an unhandled rejection. Losing cross-session\n  // history in that edge case is far better than blocking the lesson.\n  try {\n    const priorResults = await getTierResultsForStudent(state.student);\n    priorResults.forEach(r => {\n      if (state.results[r.moduleIndex]) {\n        state.results[r.moduleIndex][r.tier] = { score: r.score, passed: r.passed };\n      }\n    });\n  } catch (e) {\n    console.warn('Could not restore prior progress \u2014 starting fresh this session:', e);\n  }\n\n  // Loaded once here, not per-module \u2014 every module's own item-selection\n  // stays synchronous. Same fail-safe reasoning as above: if this fails,\n  // biasedSelect() naturally falls back to plain random selection (an\n  // empty cache is exactly its \"no exposure data\" case), so recycling\n  // just doesn't happen this session rather than blocking the lesson.\n  try {\n    await loadWordExposureCache(state.student);\n  } catch (e) {\n    console.warn('Could not load vocabulary recycling data \u2014 continuing without it this session:', e);\n  }\n\n  startModule(0, 'bronze');\n});\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 2 \u2014 MODULE RUNNER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction startModule(moduleIndex, tier) {\n  state.currentModuleIndex = moduleIndex;\n  state.currentTier = tier;\n\n  const mod = LESSON[moduleIndex];\n\n  // v2 chrome: badge number + module title + tier-aware medal\n  document.getElementById('v2-badge').textContent = moduleIndex + 1;\n  document.getElementById('v2-module-title').textContent = mod.label;\n  document.getElementById('v2-medal-img').src = `assets/${tier}.png?v=2`;\n  document.getElementById('v2-medal-img').alt = `${cap(tier)} tier`;\n\n  // v2 chrome: student name + tier, shown in the qlabel slot\n  // qlabel text is now set per-module (short instruction or live question\n  // progress) inside each renderer \u2014 see MODULE_REGISTRY. Clear it here so\n  // stale text doesn't linger from the previous module.\n  document.getElementById('v2-qlabel').textContent = '';\n\n  // v2 chrome: overall lesson progress (modules fully complete / total)\n  const doneCount = state.results.filter(r => r.complete).length;\n  document.getElementById('v2-prog-fill').style.width = Math.round((doneCount / LESSON.length) * 100) + '%';\n\n  // v2 chrome: per-module background/scene image variant \u2014 lets a lesson\n  // give a specific exercise more visual context (e.g. a food-court scene\n  // for an ordering-food module) instead of every module sharing the same\n  // fixed illustration. Falls back to the default CSS-defined images when a\n  // module doesn't specify one, so every already-published lesson keeps\n  // working exactly as before with zero changes needed.\n  const bgLayer = document.querySelector('.layer-bg');\n  const sceneLayer = document.querySelector('.layer-scene');\n  bgLayer.style.backgroundImage = (mod.imageVariant && mod.imageVariant.background)\n    ? `url('${mod.imageVariant.background}')` : '';\n  sceneLayer.style.backgroundImage = (mod.imageVariant && mod.imageVariant.scene)\n    ? `url('${mod.imageVariant.scene}')` : '';\n\n  showScreen('screen-module');\n\n  // Render module\n  const container = document.getElementById('module-container');\n  container.innerHTML = '';\n  document.getElementById('gr-overlay').style.display = 'none';\n  document.getElementById('gr-reinforce-content').style.display = 'block';\n  document.getElementById('gr-complete-content').style.display = 'none';\n\n  const renderer = MODULE_REGISTRY[mod.type];\n  if (!renderer) {\n    container.innerHTML = `<p style=\"color:var(--text-dim);padding:32px 0;text-align:center\">Module type \"${mod.type}\" not registered.</p>`;\n    return;\n  }\n\n  // Every module now uses a per-tier pool: { pick, items: [...], ...mode? }.\n  // No more shared-across-tiers special-casing needed (Nick's call: pools\n  // shouldn't be shared across tiers since difficulty differs per tier).\n  renderer.render(container, mod.data[tier], tier, score => {\n    handleTierResult(moduleIndex, tier, score);\n  });\n\n  // Illustration \"slides down\" to clear whatever height this module's\n  // content actually renders at, and stays live via MutationObserver for\n  // any later content change within the same module (multi-question\n  // sessions, retries, etc.) without each renderer needing to know about it.\n  watchModuleContentForSceneReposition();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  TIER RESULT HANDLER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// Ported verbatim from module-demos' finishTier()/dropStar() \u2014 stars pop\n// in one at a time (scale 0\u21921, opacity 0\u21921) with a tone each, then once\n// all are in, a completion chime plus a staggered brightness/glow shimmer\n// sweeps across all of them.\nfunction animateStarsReveal(starCount) {\n  const starsEl = document.getElementById('stars-row');\n  starsEl.innerHTML = '';\n  for (let s = 0; s < starCount; s++) {\n    const img = document.createElement('img');\n    img.src = 'assets/star.png';\n    img.alt = '';\n    img.style.opacity = '0';\n    img.style.transform = 'scale(0)';\n    starsEl.appendChild(img);\n  }\n  const allStarImgs = starsEl.querySelectorAll('img');\n  let i = 0;\n  function dropStar() {\n    if (i >= starCount) {\n      sfx('complete');\n      allStarImgs.forEach((img, si) => {\n        setTimeout(() => {\n          img.animate([\n            { filter: 'brightness(1) drop-shadow(0 0 0px rgba(240,174,99,0))' },\n            { filter: 'brightness(1.6) drop-shadow(0 0 10px rgba(240,174,99,0.9))' },\n            { filter: 'brightness(1) drop-shadow(0 0 0px rgba(240,174,99,0))' }\n          ], { duration: 500, easing: 'ease-in-out' });\n        }, si * 120);\n      });\n      return;\n    }\n    const img = allStarImgs[i];\n    img.animate([{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'forwards' });\n    sfx('star');\n    i++;\n    setTimeout(dropStar, 220);\n  }\n  dropStar();\n}\n\nfunction handleTierResult(moduleIndex, tier, score) {\n  const passed = score >= PASS_THRESHOLD;\n  state.results[moduleIndex][tier] = { score, passed };\n  if (state.student) saveTierResult(state.student, moduleIndex, tier, score, passed).catch(() => {});\n\n  const pct      = Math.round(score * 100);\n  const tierName = cap(tier);\n  const next     = nextTier(tier);\n\n  const ctaBtn = document.getElementById('result-cta');\n\n  // A free replay from the end screen's grid \u2014 not part of the normal\n  // linear first-time flow, so it shouldn't try to auto-advance to \"next\n  // tier\" or \"next module\" (which may be irrelevant or already complete).\n  // Just acknowledge the updated score and return to the refreshed grid.\n  if (state.replayMode) {\n    state.replayMode = false;\n    document.getElementById('result-msg').innerHTML = `<strong>Updated!</strong> Your best score is saved.`;\n    ctaBtn.textContent = '\u2190 Back to results';\n    ctaBtn.onclick = () => showEndScreen();\n\n    document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} \u2014 nice try`;\n    document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;\n    document.getElementById('gr-reinforce-content').style.display = 'none';\n    document.getElementById('gr-complete-content').style.display = 'block';\n    document.getElementById('gr-overlay').style.display = 'flex';\n    const stars = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;\n    animateStarsReveal(stars);\n    return;\n  }\n\n  if (passed && next) {\n    document.getElementById('result-msg').innerHTML =\n      `Great work! <strong>${cap(next)}</strong> is now unlocked.`;\n    ctaBtn.textContent = `Try ${cap(next)} \u2192`;\n    ctaBtn.onclick = () => startModule(moduleIndex, next);\n\n  } else if (passed && !next) {\n    state.results[moduleIndex].complete = true;\n    const nextMod = moduleIndex + 1;\n\n    if (nextMod < LESSON.length) {\n      document.getElementById('result-msg').innerHTML =\n        `<strong>Module complete!</strong> Moving to the next exercise.`;\n      ctaBtn.textContent = 'Next module \u2192';\n      ctaBtn.onclick = () => startModule(nextMod, 'bronze');\n    } else {\n      document.getElementById('result-msg').innerHTML =\n        `<strong>All done!</strong> You've completed every module.`;\n      ctaBtn.textContent = 'See my results \u2192';\n      ctaBtn.onclick = () => showEndScreen();\n    }\n\n  } else {\n    document.getElementById('result-msg').innerHTML =\n      `You need <strong>${Math.round(PASS_THRESHOLD * 100)}%</strong> to unlock the next level. You can do it!`;\n    ctaBtn.textContent = `\u21a9 Try ${tierName} again`;\n    ctaBtn.onclick = () => startModule(moduleIndex, tier);\n  }\n\n  document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} \u2014 try again`;\n  document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;\n\n  // Same overlay as per-question reinforcement, just swapped to the\n  // completion content \u2014 no screen navigation, matches the locked demo.\n  document.getElementById('gr-reinforce-content').style.display = 'none';\n  document.getElementById('gr-complete-content').style.display = 'block';\n  document.getElementById('gr-overlay').style.display = 'flex';\n\n  const stars = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;\n  animateStarsReveal(stars);\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 4 \u2014 END SCREEN\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction starsFromPct(pct) {\n  // Same formula as the per-tier completion celebration (handleTierResult)\n  // \u2014 one consistent star scale everywhere in the shell, not a second one\n  // invented just for this screen.\n  return pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;\n}\nfunction starsHtml(stars) {\n  return '\u2b50'.repeat(stars) + '\u2729'.repeat(3 - stars);\n}\n\nfunction pickSelfAssess(value) {\n  document.querySelectorAll('.selfassess-btn').forEach(b => {\n    b.classList.toggle('selected', parseInt(b.dataset.val) === value);\n  });\n  if (state.student) saveSelfAssessment(state.student, value).catch(() => {});\n}\n\nfunction replayModule(i) {\n  const r = state.results[i];\n  let tier = 'bronze';\n  for (const t of ['gold','silver','bronze']) {\n    if (r[t].score !== null) { tier = t; break; }\n  }\n  state.replayMode = true;\n  startModule(i, tier);\n}\n\nfunction showEndScreen() {\n  document.getElementById('end-name').textContent = state.student;\n  document.querySelectorAll('.selfassess-btn').forEach(b => b.classList.remove('selected'));\n\n  // Overall score: highest-tier score per module, averaged\n  let total = 0;\n  state.results.forEach(r => {\n    for (const t of ['gold','silver','bronze']) {\n      if (r[t].score !== null) { total += r[t].score; break; }\n    }\n  });\n  const overallPct = Math.round((total / LESSON.length) * 100);\n  document.getElementById('end-total').innerHTML = `Overall score: <span>${overallPct}%</span>`;\n\n  const summaryList = document.getElementById('summary-list');\n  summaryList.innerHTML = '';\n  let hasIncomplete = false;\n\n  LESSON.forEach((mod, i) => {\n    const r = state.results[i];\n    if (!r.complete) hasIncomplete = true;\n\n    let highestTier = null, highestScore = null;\n    for (const t of ['gold','silver','bronze']) {\n      if (r[t].score !== null) { highestTier = t; highestScore = r[t].score; break; }\n    }\n\n    const canDoText = highestTier && mod.canDo ? mod.canDo[highestTier] : null;\n\n    const item = document.createElement('div');\n    item.className = 'summary-item' + (highestScore !== null ? ' replayable' : '');\n    item.innerHTML = `\n      <div>\n        <div class=\"summary-item-label\">${mod.label}</div>\n        <div class=\"summary-item-detail\">${\n          highestScore !== null\n            ? `${cap(highestTier)} \u00b7 <span class=\"summary-stars\">${starsHtml(starsFromPct(Math.round(highestScore * 100)))}</span>`\n            : 'Not attempted'\n        }</div>\n        ${highestScore !== null ? `<div class=\"summary-replay-hint\">Tap to practice again</div>` : ''}\n        ${canDoText ? `<div class=\"summary-candoo\">\u2713 ${canDoText}</div>` : ''}\n      </div>\n      <div class=\"summary-status ${r.complete ? 'complete' : 'incomplete'}\">\n        ${r.complete ? '\u2713 Done' : 'Retry'}\n      </div>\n    `;\n    if (highestScore !== null) item.addEventListener('click', () => replayModule(i));\n    summaryList.appendChild(item);\n  });\n\n  renderVocabReviewSummary();\n\n  const retryBtn = document.getElementById('retry-btn');\n  retryBtn.style.display = hasIncomplete ? 'block' : 'none';\n  retryBtn.onclick = retryFailed;\n\n  document.getElementById('done-btn').onclick = () => {\n    resetAll();\n    showScreen('screen-name');\n  };\n\n  showScreen('screen-end');\n}\n\nfunction vocabReviewStatusText(entry) {\n  const { beforeBox, afterBox, wasNew } = entry;\n  if (wasNew && afterBox === 1) return '\ud83c\udd95 New word';\n  if (wasNew) return `\u2b06 New \u2192 Box ${afterBox}`;\n  if (beforeBox < afterBox) return `\u2b06 Box ${beforeBox} \u2192 Box ${afterBox}`;\n  if (beforeBox > afterBox) return `\u2193 Box ${beforeBox} \u2192 Box ${afterBox}`;\n  return afterBox >= 5 ? '\u2713\u2713 Box 5 (mastered)' : `Box ${afterBox}`;\n}\n\nfunction renderVocabReviewSummary() {\n  const wrap = document.getElementById('vocab-review-summary');\n  const line = document.getElementById('vocab-review-line');\n  const panel = document.getElementById('vocab-review-panel');\n  const words = [...sessionReviewedWords.entries()];\n\n  if (words.length === 0) {\n    wrap.style.display = 'none';\n    return;\n  }\n  wrap.style.display = 'block';\n  line.textContent = `\ud83d\udcda ${words.length} word${words.length === 1 ? '' : 's'} reviewed today`;\n  line.classList.remove('open');\n  panel.style.display = 'none';\n\n  panel.innerHTML = words.map(([word, entry]) => `\n    <div class=\"vocab-review-row-wrap\">\n      <div class=\"vocab-review-row\" onclick=\"toggleVocabAdjustRow('${word}')\">\n        <span class=\"vocab-review-word\">${word}</span>\n        <span class=\"vocab-review-status\">${vocabReviewStatusText(entry)}</span>\n      </div>\n      <div class=\"vocab-review-adjust\" id=\"vocab-adjust-${word}\" style=\"display:none;\">\n        <button class=\"vocab-adjust-btn\" onclick=\"event.stopPropagation(); applyVocabAdjust('${word}','up',this)\">I know this</button>\n        <button class=\"vocab-adjust-btn\" onclick=\"event.stopPropagation(); applyVocabAdjust('${word}','down',this)\">Still learning</button>\n      </div>\n    </div>`).join('');\n}\n\nfunction toggleVocabReviewPanel() {\n  const line = document.getElementById('vocab-review-line');\n  const panel = document.getElementById('vocab-review-panel');\n  const opening = panel.style.display === 'none';\n  panel.style.display = opening ? 'block' : 'none';\n  line.classList.toggle('open', opening);\n}\n\nfunction toggleVocabAdjustRow(word) {\n  const el = document.getElementById(`vocab-adjust-${word}`);\n  if (!el) return;\n  el.style.display = el.style.display === 'none' ? 'flex' : 'none';\n}\n\nasync function applyVocabAdjust(word, direction, btnEl) {\n  if (!state.student) return;\n  try {\n    const record = await manuallyAdjustWord(state.student, word, direction);\n    if (!record) return;\n    btnEl.classList.add('applied');\n    btnEl.textContent = direction === 'up' ? '\u2713 Marked known' : '\u2713 Marked learning';\n    const row = btnEl.closest('.vocab-review-row-wrap').querySelector('.vocab-review-status');\n    if (row) row.textContent = direction === 'up' ? `\u2b06 moved to Box ${record.box}` : `\u2193 reset to Box 1`;\n  } catch (e) {\n    console.warn('Could not apply manual vocabulary adjustment:', e);\n  }\n}\n\n\nfunction retryFailed() {\n  const idx = state.results.findIndex(r => !r.complete);\n  if (idx === -1) { showEndScreen(); return; }\n  const r = state.results[idx];\n  const tier = r.silver.passed ? 'gold' : r.bronze.passed ? 'silver' : 'bronze';\n  startModule(idx, tier);\n}\n\nfunction resetAll() {\n  state.student = null;\n  state.results = buildResults();\n  state.replayMode = false;\n  sessionReviewedWords = new Map();\n  sessionCounted = false;\n  _cachedSessionNumber = null;\n  wordExposureCache = new Map();\n  document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));\n  startBtn.classList.remove('ready');\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MODULE REGISTRY\n//  Contract: render(container, data, tier, onComp
