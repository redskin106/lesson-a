  },

  // ─────────────────────────────────────────────
  //  PHONICS — "Sound It Out"
  //  Students see the object emoji + (Bronze) the written word.
  //  Jumbled phoneme group tiles appear in a pool — e.g. SH · I · P.
  //  Gold adds one distractor tile. Students tap tiles into order,
  //  then tap each placed tile to hear its phoneme sound (stub: TTS).
  //  On full correct order: each phoneme plays in sequence, then the
  //  full word plays. Then: record + self-assess (same Say It mechanic).
  //  Audio files: assets/phonemes/{grapheme}.mp3 — falls back to TTS.
  //  Bronze: word shown. Silver: word hidden. Gold: word hidden + distractor.
  'phonics': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = biasedSelect(items, pick, it => it.word);

      const isBronze = tier === 'bronze';
      const isGold   = tier === 'gold';
      let idx = 0, score = 0;
      let phSlots = [], phPool = [], phLocked = false, phCorrect = false;

      function pips() {
        return session.map((_,i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      // Map graphemes to Jolly Phonics filenames (not always 1:1)
      const PHONEME_FILE = {
        'c':'ck', 'k':'k', 'ck':'ck',
        'g':'g',  'j':'j', 'qu':'qu',
        'x':'x',  'y':'y', 'z':'z',
        'ng':'ng', 'sh':'sh', 'th':'thh', 'ch':'ch',
        'ai':'ai', 'ee':'ee', 'ie':'ie', 'oa':'oa',
        'oo':'ooo', 'or':'or', 'ur':'er', 'er':'er',
        'ow':'ou', 'ou':'ou', 'oi':'oi',
        'ear':'ar', 'air':'ar', 'ar':'ar',
        'ue':'ue', 'thh':'thh',
      };

      function playPhoneme(grapheme) {
        const fileKey = PHONEME_FILE[grapheme] || grapheme;
        const audioFile = `assets/phonemes/sound_${fileKey}.mp3`;
        const a = new Audio(audioFile);
        a.onerror = () => {
          // TTS fallback — speak a word containing the sound
          const FALLBACK = {
            'c':'cat','k':'kit','g':'got','j':'jam','qu':'quick',
            'x':'fox','y':'yes','z':'zip','ng':'ring',
          };
          speak(FALLBACK[grapheme] || grapheme, 'slow');
        };
        a.play().catch(() => a.onerror());
      }

      function load() {
        phLocked = false; phCorrect = false;
        const item = session[idx];
        // Build pool: phoneme groups + optional distractor at Gold
        const groups = [...item.phonemes];
        if (isGold && item.distractor) groups.push({ grapheme: item.distractor, isDistractor: true });
        phPool = safeShuffle(groups, r => {
          // Avoid accidental correct order on first shuffle
          const nonDistractors = r.filter(g => !g.isDistractor);
          return nonDistractors.every((g, i) => g.grapheme === item.phonemes[i].grapheme);
        }).map((g, i) => ({ ...g, id: i, used: false }));
        phSlots = item.phonemes.map(() => null);
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        draw();
      }

      function draw() {
        const item = session[idx];
        container.innerHTML = `
          <div class="mp-pips-row-v2" id="ph-pips" style="${session.length <= 1 ? 'display:none;' : ''}"></div>

          <!-- Stimulus -->
          <div style="text-align:center;margin-bottom:3%;">
            <div class="ws-emoji-v2">${item.emoji}</div>
            ${isBronze ? `<div style="font-size:5.5cqw;font-weight:700;color:#fff;margin-top:1.5%;letter-spacing:0.05em;">${item.word}</div>` : ''}
            <button class="ws-play-btn-v2" id="ph-play-btn" style="position:relative;margin:2% auto 0;">🔊</button>
          </div>

          <!-- Slots -->
          <div style="font-size:2.8cqw;color:var(--text-dim);text-align:center;margin-bottom:4%;text-transform:uppercase;letter-spacing:0.08em;">Build the sounds in order</div>
          <div class="ws-slots-v2" id="ph-slots" style="justify-content:center;flex-wrap:wrap;padding-bottom:4%;border-bottom:1px solid transparent;min-height:13cqw;"></div>

          <!-- Pool -->
          <div style="font-size:2.4cqw;color:rgba(255,255,255,0.2);text-align:center;margin-top:4%;margin-bottom:2%;">tap a tile to place it · tap a slot to remove</div>
          <div class="ws-bank-v2" id="ph-bank" style="justify-content:center;flex-wrap:wrap;min-height:13cqw;margin-bottom:2%;"></div>

          <p class="ws-feedback-v2" id="ph-fb" style="min-height:3cqw;margin-bottom:2%;">&nbsp;</p>
        `;
        container.querySelector('#ph-pips').innerHTML = pips();
        container.querySelector('#ph-play-btn').addEventListener('click', () => speak(item.word, 'neutral'));

        renderSlots(); renderPool();
      }

      function renderSlots() {
        const slotsEl = document.getElementById('ph-slots');
        if (!slotsEl) return;
        slotsEl.innerHTML = '';
        phSlots.forEach((entry, si) => {
          const d = document.createElement('div');
          d.className = 'ws-slot-v2';
          d.id = `ph-s-${si}`;
          d.style.minWidth = '16cqw';
          d.style.height = '16cqw';
          d.style.fontSize = '5cqw';
          d.style.fontWeight = '700';
          if (entry) {
            d.textContent = entry.grapheme;
            if (phCorrect) {
              d.style.borderColor = '#8BC34A'; d.style.background = 'rgba(139,195,74,0.15)'; d.style.color = '#AED581';
              // After correct: tap to hear phoneme again, no removal
              d.style.cursor = 'pointer';
              d.addEventListener('click', () => playPhoneme(entry.grapheme));
            } else {
              d.style.borderColor = '#00BCD4'; d.style.background = 'rgba(0,188,212,0.15)'; d.style.color = '#4DD0E1';
              if (!phLocked) d.addEventListener('click', () => {
                playPhoneme(entry.grapheme);
                phRemove(si);
              });
            }
          }
          slotsEl.appendChild(d);
        });
      }

      function renderPool() {
        const bankEl = document.getElementById('ph-bank');
        if (!bankEl) return;
        bankEl.innerHTML = '';
        phPool.forEach((tile, pi) => {
          const b = document.createElement('button');
          b.className = 'ws-tile-v2';
          b.id = `ph-p-${pi}`;
          b.textContent = tile.grapheme;
          b.style.minWidth = '16cqw'; b.style.height = '16cqw'; b.style.fontSize = '5cqw'; b.style.fontWeight = '700';
          if (tile.isDistractor) b.style.borderColor = 'rgba(233,30,99,0.4)';
          if (tile.used) b.classList.add('used');
          b.addEventListener('click', () => phTap(pi));
          bankEl.appendChild(b);
        });
      }

      function phTap(pi) {
        if (phLocked) return;
        const tile = phPool[pi];
        if (tile.used) return;

        if (tile.isDistractor) {
          // Play the sound so student hears it, then shake and reject
          playPhoneme(tile.grapheme);
          const btn = document.getElementById(`ph-p-${pi}`);
          if (btn) {
            btn.style.borderColor = '#E91E63'; btn.style.background = 'rgba(233,30,99,0.1)';
            btn.animate([
              {transform:'translateX(0)'},{transform:'translateX(-6px)'},
              {transform:'translateX(6px)'},{transform:'translateX(0)'}
            ], {duration: 300});
            setTimeout(() => { btn.style.borderColor = 'rgba(233,30,99,0.4)'; btn.style.background = ''; }, 700);
          }
          sfx('wrong');
          return;
        }

        const si = phSlots.indexOf(null);
        if (si === -1) return;
        tile.used = true;
        phSlots[si] = tile;
        playPhoneme(tile.grapheme);
        renderSlots(); renderPool();

        if (phSlots.indexOf(null) === -1) setTimeout(phCheck, 200);
      }

      function phRemove(si) {
        if (phLocked) return;
        const entry = phSlots[si];
        if (!entry) return;
        phPool[entry.id].used = false;
        phSlots[si] = null;
        sfx('tap');
        renderSlots(); renderPool();
      }

      function phCheck() {
        const item = session[idx];
        const ok = phSlots.every((e, i) => e && e.grapheme === item.phonemes[i].grapheme);
        if (!ok) {
          sfx('wrong');
          // Return all to pool, let them try again
          phSlots = item.phonemes.map(() => null);
          phPool.forEach(t => { t.used = false; });
          const fb = document.getElementById('ph-fb');
          if (fb) { fb.textContent = 'Not quite — try a different order.'; fb.style.color = 'rgba(255,255,255,0.5)'; }
          renderSlots(); renderPool();
          return;
        }

        // Correct! Play sequence: each phoneme then full word
        phLocked = true; phCorrect = true;
        score++;
        if (state.student) recordWordExposure(state.student, item.word, 'phonics', true).catch(() => {});
        renderSlots();

        const fb = document.getElementById('ph-fb');
        if (fb) { fb.textContent = ''; }

        // Animate: play each phoneme tile in sequence, then the whole word
        // Correct — slots go green, pause, then record section appears
        setTimeout(() => {
          renderSlots();
          const fb = container.querySelector('#ph-fb');
          if (fb) fb.textContent = '';
          const recContainer = document.createElement('div');
          recContainer.style.marginTop = '4%';
          container.appendChild(recContainer);
          renderSayItInteraction(recContainer, {
            prompt: 'Now you say it:',
            target: item.word,
            audioFile: item.audioFile || null,
            isBronze,
            moduleIndex: state.currentModuleIndex,
            tier,
            recordingItemIndex: idx,
            allowSkip: true,
          }, () => {
            idx++;
            if (idx < session.length) load();
            else onComplete(score / session.length);
          });
        }, 800);

        // Pause before starting the phoneme sequence
        playNext();
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  MINIMAL PAIRS — "Listen Close"
  //  One screen, audio-first. Target sound shown + play button at top.
  //  Bronze: two words hidden (emoji only), tap which has the sound.
  //  Silver: words revealed, same task.
  //  Gold: three options, tap ALL that have the sound.
  //  Wrong taps reset cleanly. No IPA, no symbols — pure listening.
  'minimal-pairs': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      const isGold = tier === 'gold';
      const showWords = tier !== 'bronze';
      let idx = 0, totalScore = 0;

      function pips() {
        return session.map((_,i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      function playSound(file, fallback) {
        if (file) speak(fallback, 'neutral', 0, file);
        else speak(fallback, 'neutral');
      }

      function renderQuestion() {
        const item = session[idx];
        let answered = false;
        let goldAnswered = {};
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <div class="mp-pips-row-v2" id="mp-pips" style="display:none;margin:0;"></div>

          <!-- Target sound banner -->
          <div style="background:rgba(0,188,212,0.07);border:1.5px solid rgba(0,188,212,0.2);
            border-radius:14px;padding:4% 5%;display:flex;align-items:center;
            gap:4%;margin-bottom:5%;flex-shrink:0;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:2.8cqw;color:var(--text-dim);text-transform:uppercase;
                letter-spacing:.08em;margin-bottom:4%;">Find this sound</div>
              <div style="font-size:10cqw;font-weight:800;color:#00BCD4;line-height:1;
                letter-spacing:.05em;">${item.targetSound}</div>
              <div style="font-size:3cqw;color:rgba(255,255,255,0.3);margin-top:1.5%;">
                ${item.targetHint || ''}</div>
            </div>
            <button id="mp-target-play"
              style="width:11cqw;height:11cqw;border-radius:50%;flex-shrink:0;
              background:rgba(0,188,212,0.15);border:1.5px solid rgba(0,188,212,0.35);
              color:#00BCD4;font-size:4.5cqw;cursor:pointer;
              display:flex;align-items:center;justify-content:center;font-family:inherit;">🔊</button>
          </div>

          <!-- Question -->
          <p style="font-size:3.6cqw;font-weight:600;color:#fff;text-align:center;
            margin-bottom:5%;line-height:1.4;">
            ${isGold
              ? `Tap <span style="color:#00BCD4;">every word</span> that has this sound`
              : `Which word has <span style="color:#00BCD4;">${item.targetSound}</span>?`}
          </p>

          <!-- Word cards -->
          <div id="mp-words" style="flex:1;"></div>

          <p class="ws-feedback-v2" id="mp-fb" style="margin-top:3%;">&nbsp;</p>
          <button class="iv-proceed-btn" id="mp-next" style="display:none;">Next →</button>
        `;

        container.querySelector('#mp-pips').innerHTML = pips();
        container.querySelector('#mp-target-play').addEventListener('click', () =>
          playSound(item.targetAudioFile, item.targetSound));

        const wordsEl = container.querySelector('#mp-words');

        if (!isGold) {
          wordsEl.innerHTML = `
            <div style="display:flex;gap:4%;justify-content:center;flex-wrap:wrap;margin-bottom:4%;">
              ${item.options.map((opt, i) => `
                <div id="mp-opt-${i}"
                  style="width:42%;max-width:42%;display:flex;flex-direction:column;align-items:center;gap:3%;
                  padding:5% 4%;border-radius:14px;cursor:pointer;
                  background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);
                  transition:border-color .2s,background .2s;">
                  <div style="font-size:2.6cqw;color:var(--text-dim);text-transform:uppercase;
                    letter-spacing:.07em;">Word ${i+1}</div>
                  <div style="font-size:14cqw;line-height:1;margin:2% 0;">${opt.emoji}</div>
                  <div class="mp-word-label" style="font-size:4cqw;font-weight:700;
                    color:rgba(255,255,255,0.9);min-height:5cqw;text-align:center;
                    ${showWords ? '' : 'filter:blur(6px);user-select:none;'}">${opt.word}</div>
                  <div class="mp-listen-btn" data-play="${i}"
                    style="margin-top:3%;background:rgba(255,255,255,0.06);
                    border:1px solid rgba(255,255,255,0.12);border-radius:999px;
                    padding:2% 8%;color:rgba(255,255,255,0.5);font-size:2.8cqw;cursor:pointer;">
                    🔊 Listen</div>
                </div>
              `).join('')}
            </div>`;

          wordsEl.querySelectorAll('.mp-listen-btn').forEach(div => {
            const i = parseInt(div.dataset.play);
            div.addEventListener('click', (e) => {
              e.stopPropagation();
              playSound(item.options[i].audioFile, item.options[i].word);
            });
          });

          item.options.forEach((opt, i) => {
            const card = container.querySelector(`#mp-opt-${i}`);
            card.addEventListener('click', () => {
              if (answered) return;
              answered = true;
              const correct = opt.hasTarget;
              const other = container.querySelector(`#mp-opt-${i === 0 ? 1 : 0}`);
              container.querySelectorAll('.mp-word-label').forEach(d => d.style.filter = '');
              if (correct) {
                card.style.borderColor = '#8BC34A'; card.style.background = 'rgba(139,195,74,0.12)';
                setFb('\u2713 Yes! That one has the sound.', '#AED581');
                totalScore++;
                showNext(() => advance());
              } else {
                card.style.borderColor = '#E91E63'; card.style.background = 'rgba(233,30,99,0.1)';
                if (other) { other.style.borderColor = '#8BC34A'; other.style.background = 'rgba(139,195,74,0.12)'; }
                setFb('Not quite \u2014 listen again \ud83d\udc42', '#F48FB1');
                setTimeout(() => {
                  card.style.borderColor = 'rgba(255,255,255,0.08)'; card.style.background = 'rgba(255,255,255,0.05)';
                  if (other) { other.style.borderColor = 'rgba(255,255,255,0.08)'; other.style.background = 'rgba(255,255,255,0.05)'; }
                  if (!showWords) container.querySelectorAll('.mp-word-label').forEach(d => d.style.filter = 'blur(6px)');
                  answered = false;
                  setFb('Try once more', 'rgba(255,255,255,0.4)');
                }, 1800);
              }
            });
          });

        } else {
          // Gold: stacked horizontal rows
          wordsEl.innerHTML = `
            <div style="display:flex;flex-direction:column;gap:3%;">
              ${item.options.map((opt, i) => `
                <button id="mp-gopt-${i}"
                  style="background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.09);
                  border-radius:12px;padding:3.5% 4%;display:flex;align-items:center;gap:3%;
                  cursor:pointer;font-family:inherit;transition:all .18s;">
                  <button onclick="event.stopPropagation();"
                    style="width:10cqw;height:10cqw;border-radius:50%;
                    background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);
                    color:rgba(255,255,255,0.5);font-size:4cqw;cursor:pointer;
                    display:flex;align-items:center;justify-content:center;flex-shrink:0;"
                    data-gold-play="${i}">\ud83d\udd0a</button>
                  <span style="font-size:8cqw;line-height:1;">${opt.emoji}</span>
                  <span style="font-size:4cqw;font-weight:700;color:#fff;flex:1;text-align:left;">${opt.word}</span>
                  <span id="mp-gtick-${i}" style="font-size:4.5cqw;opacity:0;transition:opacity .2s;">\u2713</span>
                </button>
              `).join('')}
            </div>`;

          wordsEl.querySelectorAll('[data-gold-play]').forEach(btn => {
            const i = parseInt(btn.dataset.goldPlay);
            btn.addEventListener('click', () => playSound(item.options[i].audioFile, item.options[i].word));
          });

          const totalTargets = item.options.filter(o => o.hasTarget).length;
          let foundTargets = 0;

          item.options.forEach((opt, i) => {
            const card = container.querySelector(`#mp-gopt-${i}`);
            card.addEventListener('click', () => {
              if (goldAnswered[i] !== undefined) return;
              goldAnswered[i] = opt.hasTarget;
              if (opt.hasTarget) {
                card.classList.add('correct');
                card.onclick = null;
                const tick = container.querySelector(`#mp-gtick-${i}`);
                if (tick) tick.style.opacity = '1';
                foundTargets++;
                if (foundTargets === totalTargets) {
                  setFb('\u2713 You found them all!', '#AED581');
                  totalScore++;
                  showNext(() => advance());
                } else {
                  setFb(`\u2713 Good \u2014 find the other${totalTargets - foundTargets > 1 ? 's' : ''}!`, '#AED581');
                }
              } else {
                card.classList.add('wrong');
                setFb("That one doesn't have it \u2014 keep listening", '#F48FB1');
                setTimeout(() => {
                  card.classList.remove('wrong');
                  delete goldAnswered[i];
                  setFb('', 'rgba(255,255,255,0.4)');
                }, 1100);
              }
            });
          });
        }

        function setFb(msg, color) {
          const el = container.querySelector('#mp-fb');
          if (el) { el.textContent = msg; el.style.color = color; }
        }
        function showNext(cb) {
          const btn = container.querySelector('#mp-next');
          if (btn) { btn.style.display = 'block'; btn.onclick = cb; }
        }
        function advance() {
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(totalScore / session.length);
        }
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  DESCRIPTION PYRAMID
  //  Three-level scaffolded description: L1 category (one tile) → L2
  //  observable attributes (ordered groups, sequential unlock) → L3 detail/
  //  opinion/sensation (hybrid tile+free-type, no wrong answer). Tier gates
  //  which levels exist at all: bronze=L1, silver=L1+L2, gold=all three —
  //  the pyramid visually grows as the tier grows, that growth IS the
  //  feedback mechanism. On completion, chains into the same Say It
  //  recorder/persistence/compare-card used everywhere else (optional,
  //  skippable, never affects the star score either way).
  'description-pyramid': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      // L1's answer is the one word guaranteed present across all three
      // tiers (bronze=L1 only, silver=L1+L2, gold=all three), so it's used
      // as the recycling-priority driver here — same "good enough, not
      // perfect" tradeoff already accepted elsewhere (word-match uses only
      // .left, image-vocab uses only .word even in cloze mode) rather than
      // leaving Pyramid's own selection fully unbiased. L2 group answers
      // still get their own exposure recording during play either way,
      // which feeds recycling for any OTHER module testing those same
      // words even though they don't drive this module's own draw.
      const session = biasedSelect(items, pick, it => it.l1?.answer ?? '');
      const requiredLevels = tier === 'bronze' ? ['l1'] : tier === 'silver' ? ['l1','l2'] : ['l1','l2','l3'];
      let idx = 0, totalStars = 0;

      const COLOR_WORD_MAP = {
        red:'#EF5350', blue:'#42A5F5', yellow:'#FFEE58', green:'#66BB6A',
        black:'#616161', white:'#F5F5F5', pink:'#F48FB1', brown:'#8D6E63',
        orange:'#FFA726', purple:'#AB47BC', gray:'#BDBDBD', grey:'#BDBDBD',
        gold:'#FFD700', silver:'#B0BEC5'
      };
      function dynamicColorFor(word){ return COLOR_WORD_MAP[(word||'').toLowerCase()] || '#9575CD'; }
      function isColourGroup(label){ return /colour|color/i.test(label || ''); }

      function renderItem() {
        const item = session[idx];
        let l1Answer = null;
        let l2Answers = []; // parallel to item.l2, undefined until that group is locked in
        let l2GroupIndex = 0;
        let l3TileAnswer = null;
        let l3BecauseText = '';
        let currentLevel = 'l1'; // 'l1' | 'l2' | 'l3' | 'done'

        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;

        function setMascot(reaction) {
          // Image stays constant throughout — no mascot to update
        }

        function buildStripHtml() {
          const pills = [`<span class="dp-strip-plain">It's a</span>`];
          if (l2Answers.length) {
            item.l2.forEach((group, i) => {
              if (l2Answers[i] === undefined) return;
              if (isColourGroup(group.label)) {
                pills.push(`<span class="dp-strip-pill l2-dynamic" style="background:${dynamicColorFor(l2Answers[i])};">${l2Answers[i]}</span>`);
              } else {
                const cls = i % 2 === 0 ? 'l2-size' : 'l2-shape';
                pills.push(`<span class="dp-strip-pill ${cls}">${l2Answers[i]}</span>`);
              }
            });
          }
          if (l1Answer) pills.push(`<span class="dp-strip-pill l1">${l1Answer}</span>`);
          if (l3TileAnswer) pills.push(`<span class="dp-strip-pill l3">${l3TileAnswer}</span>`);
          return pills.join(' ');
        }
        function updateStrip() {
          const el = container.querySelector('#dp-strip');
          if (el) el.innerHTML = buildStripHtml();
        }

        function levelStateClass(level) {
          if (!requiredLevels.includes(level)) return 'locked'; // this tier never unlocks it
          if (level === currentLevel) return 'active';
          const order = ['l1','l2','l3'];
          return order.indexOf(level) < order.indexOf(currentLevel) || currentLevel === 'done' ? 'complete' : 'locked';
        }

        function renderPyramid() {
          const l1State = levelStateClass('l1');
          const l2State = levelStateClass('l2');
          const l3State = levelStateClass('l3');
          container.querySelector('#dp-pyramid').innerHTML = `
            <div class="dp-block dp-block-l1 ${l1State}">
              <span class="dp-lock-icon">🔒</span>
              <span class="dp-block-icon">👁️</span>
              <span class="dp-block-label">${l1State === 'complete' ? l1Answer : 'What is it?'}</span>
              <span class="dp-check-icon">✓</span>
            </div>
            <div class="dp-block dp-block-l2 ${l2State}">
              <span class="dp-lock-icon">🔒</span>
              <span class="dp-block-icon">📏🎨</span>
              <span class="dp-block-label">${l2State === 'complete' ? l2Answers.join(' · ') : 'What does it look like?'}</span>
              <span class="dp-check-icon">✓</span>
            </div>
            <div class="dp-block dp-block-l3 ${l3State}">
              <span class="dp-lock-icon">🔒</span>
              <span class="dp-block-icon">⭐</span>
              <span class="dp-block-label">${l3State === 'complete' ? (l3TileAnswer || 'noted') : 'What makes it special?'}</span>
              <span class="dp-check-icon">✓</span>
            </div>`;
        }

        function renderActiveZone() {
          const zone = container.querySelector('#dp-active-zone');
          if (currentLevel === 'l1') {
            zone.innerHTML = `<div class="dp-tile-row" id="dp-tiles"></div>`;
            const row = zone.querySelector('#dp-tiles');
            const l1ShuffledOptions = safeShuffle(item.l1.options, () => false);
            l1ShuffledOptions.forEach(opt => {
              // Support both plain string options (legacy) and {label, emoji} objects
              const label = (typeof opt === 'object') ? opt.label : opt;
              const emoji = (typeof opt === 'object') ? opt.emoji : null;
              const btn = document.createElement('button');
              btn.className = 'dp-tile';
              btn.innerHTML = emoji
                ? `<span style="display:block;font-size:5cqw;line-height:1.2;">${emoji}</span><span style="display:block;font-size:3cqw;">${label}</span>`
                : label;
              btn.addEventListener('click', () => {
                if (label !== item.l1.answer) {
                  sfx('wrong');
                  if (state.student) recordWordExposure(state.student, item.l1.answer, 'description-pyramid', false).catch(() => {});
                  btn.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:250});
                  return;
                }
                sfx('correct');
                if (state.student) recordWordExposure(state.student, item.l1.answer, 'description-pyramid', true).catch(() => {});
                l1Answer = label;
                btn.classList.add('selected');
                btn.style.background = '#00BCD4'; btn.style.borderColor = '#00BCD4';
                updateStrip();
                setMascot('l1');
                currentLevel = requiredLevels.includes('l2') ? 'l2' : 'done';
                setTimeout(() => { renderPyramid(); renderActiveZone(); if (currentLevel === 'done') finishPyramid(); }, 450);
              });
              row.appendChild(btn);
            });
          } else if (currentLevel === 'l2') {
            const group = item.l2[l2GroupIndex];
            zone.innerHTML = `
              <div class="dp-group-label">${group.label}</div>
              <div class="dp-tile-row" id="dp-tiles"></div>`;
            const row = zone.querySelector('#dp-tiles');
            const isColour = isColourGroup(group.label);
            const l2ShuffledOptions = safeShuffle(group.options, () => false);
            l2ShuffledOptions.forEach(opt => {
              // Support both plain string options (legacy) and {label, emoji} objects
              const label = (typeof opt === 'object') ? opt.label : opt;
              const emoji = (typeof opt === 'object') ? opt.emoji : null;
              const btn = document.createElement('button');
              btn.className = 'dp-tile';
              btn.innerHTML = emoji
                ? `<span style="display:block;font-size:5cqw;line-height:1.2;">${emoji}</span><span style="display:block;font-size:3cqw;">${label}</span>`
                : (isColour ? label : label);
              btn.addEventListener('click', () => {
                if (label !== group.answer) {
                  sfx('wrong');
                  if (state.student) recordWordExposure(state.student, group.answer, 'description-pyramid', false).catch(() => {});
                  btn.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:250});
                  return;
                }
                sfx('correct');
                if (state.student) recordWordExposure(state.student, group.answer, 'description-pyramid', true).catch(() => {});
                l2Answers[l2GroupIndex] = label;
                btn.classList.add('selected');
                const c = isColour ? dynamicColorFor(label) : (l2GroupIndex % 2 === 0 ? '#FF9800' : '#AB47BC');
                btn.style.background = c; btn.style.borderColor = c;
                updateStrip();
                l2GroupIndex++;
                if (l2GroupIndex < item.l2.length) {
                  setTimeout(renderActiveZone, 400);
                } else {
                  setMascot('l2');
                  currentLevel = requiredLevels.includes('l3') ? 'l3' : 'done';
                  setTimeout(() => { renderPyramid(); renderActiveZone(); if (currentLevel === 'done') finishPyramid(); }, 450);
                }
              });
              row.appendChild(btn);
            });
          } else if (currentLevel === 'l3') {
            const becauseMode = item.l3.because_mode || 'typed';
            zone.innerHTML = `
              <div class="dp-group-label">because it is…</div>
              <div class="dp-tile-row" id="dp-tiles"></div>
              <input type="text" class="dp-l3-free-input" id="dp-l3-free" placeholder="…or type your own">
              ${becauseMode === 'typed'
                ? `<input type="text" class="dp-l3-free-input" id="dp-because-input" placeholder="because it…" style="margin-top:2%;">`
                : `<div class="dp-sayit-only-note">You'll say why out loud in a moment.</div>`}
              <button class="iv-proceed-btn dp-check-btn" id="dp-l3-continue" style="display:none;">Continue →</button>`;
            const row = zone.querySelector('#dp-tiles');
            (item.l3.tiles || []).forEach(opt => {
              const label = (typeof opt === 'object') ? opt.label : opt;
              const emoji = (typeof opt === 'object') ? opt.emoji : null;
              const btn = document.createElement('button');
              btn.className = 'dp-tile';
              btn.innerHTML = emoji
                ? `<span style="display:block;font-size:5cqw;line-height:1.2;">${emoji}</span><span style="display:block;font-size:3cqw;">${label}</span>`
                : label;
              btn.addEventListener('click', () => {
                row.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.borderColor=''; });
                btn.classList.add('selected');
                btn.style.background = '#FFD700'; btn.style.borderColor = '#FFD700';
                l3TileAnswer = label;
                freeInput.value = '';
                updateStrip();
                continueBtn.style.display = 'block';
              });
              row.appendChild(btn);
            });
            const freeInput = zone.querySelector('#dp-l3-free');
            const continueBtn = zone.querySelector('#dp-l3-continue');
            freeInput.addEventListener('input', () => {
              if (!freeInput.value.trim()) return;
              row.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.borderColor=''; });
              l3TileAnswer = freeInput.value.trim();
              updateStrip();
              continueBtn.style.display = 'block';
            });
            const becauseInput = zone.querySelector('#dp-because-input');
            if (becauseInput) {
              becauseInput.addEventListener('input', () => { l3BecauseText = becauseInput.value.trim(); });
            }
            continueBtn.addEventListener('click', () => {
              sfx('correct');
              setMascot('l3');
              currentLevel = 'done';
              renderPyramid();
              finishPyramid();
            });
          }
        }

        function starsForThisItem() {
          // Deepest level actually reached determines the star count — tier
          // gating means every completed item naturally maxes its tier's
          // ceiling (bronze can only ever reach 1, silver 2, gold 3), which
          // is the point: more pyramid unlocked = more stars possible.
          if (requiredLevels.includes('l3')) return 3;
          if (requiredLevels.includes('l2')) return 2;
          return 1;
        }
        const maxStarsPerItem = requiredLevels.includes('l3') ? 3 : requiredLevels.includes('l2') ? 2 : 1;

        function finishPyramid() {
          const stars = starsForThisItem();
          totalStars += stars;

          setTimeout(() => {
            const plain = buildStripHtml().replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
            const fullSentence = l3BecauseText
              ? `${plain}. I think it's special because ${l3BecauseText}.`
              : `${plain}.`;

            container.innerHTML = `
              <div class="dp-image-wrap">
                ${item.imageFile
                  ? `<img class="dp-image" src="${item.imageFile}" alt="${item.label || ''}">`
                  : `<div class="dp-image-fallback">🎉</div>`}
              </div>
              <p class="module-question" style="text-align:center;">Nice work! Now you say it:</p>
              <div id="dp-sayit-zone"></div>
            `;

            if (item.full_sentence_audio) {
              const a = new Audio(item.full_sentence_audio);
              a.play().catch(() => {});
            }

            renderSayItInteraction(container.querySelector('#dp-sayit-zone'), {
              prompt: null,
              target: fullSentence,
              audioFile: item.full_sentence_audio,
              isBronze: tier === 'bronze',
              moduleIndex: state.currentModuleIndex,
              tier,
              recordingItemIndex: idx,
              allowSkip: true, // Say It is optional here — must never penalize skipping
            }, () => {
              // Stars already locked in from the pyramid itself — Say It
              // (attempted or skipped) never changes the score, per spec.
              idx++;
              if (idx < session.length) renderItem();
              else onComplete(Math.min(1, totalStars / (session.length * maxStarsPerItem)));
            });
          }, 700); // let the pyramid's own gold-glow settle before handing off
        }

        container.innerHTML = `
          <div class="dp-image-wrap">
            ${item.imageFile
              ? `<img class="dp-image" src="${item.imageFile}" alt="${item.label || ''}">`
              : `<div class="dp-image-fallback">🖼️</div>`}
          </div>
          <div class="dp-pyramid" id="dp-pyramid"></div>
          <div id="dp-active-zone"></div>
          <div class="dp-sentence-strip" id="dp-strip"></div>
        `;
        renderPyramid();
        renderActiveZone();
        updateStrip();
      }

      renderItem();
    }
  },

  // ─────────────────────────────────────────────
  //  IMAGE-TO-FEELING
  //  Subjective response, genuinely no wrong answer — a safe-zone stimulus
  //  (colour or emoji, never a person/face) is shown, and the question is
  //  always mediated through the mascot ("How does [mascot] feel?"), never
  //  asked of the student directly, per the Feelings-lesson design
  //  constraint. Any tile the student picks is accepted immediately — this
  //  module scores participation, not correctness. Bronze = pick a tile,
  //  Silver = pick + hear the model sentence, Gold = pick + say/type why,
  //  the same Say-it/Say-more/Say-it-well depth curve as everywhere else.
  //  The Gold "why" step reuses the exact shared Say It interaction built
  //  for Description Pyramid — same recorder, same persistence, same
  //  compare card, not a second copy.
  'image-to-feeling': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0;

      function renderItem() {
        const item = session[idx];
        const mascotEmoji = item.mascotEmoji || '👽';
        const mascotName = item.mascotName || 'Zorp';
        let selectedTile = null;
        let done = false;

        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;

        const stimulusStyle = item.stimulusType === 'colour'
          ? `background:${item.stimulusValue};`
          : `background:rgba(255,255,255,0.04);`;
        const stimulusContent = item.stimulusType === 'colour' ? '' : item.stimulusValue;

        container.innerHTML = `
          <div class="itf-stimulus" style="${stimulusStyle}">${stimulusContent}</div>
          <div class="itf-stimulus-label">${item.stimulusLabel}</div>
          <div class="dp-mascot-wrap"><span class="dp-mascot" id="itf-mascot">${mascotEmoji}</span></div>
          <p class="itf-prompt">How does ${mascotName} feel about this?</p>
          <div class="dp-tile-row" id="itf-tiles"></div>
          <div id="itf-why-zone"></div>
          <button class="iv-proceed-btn" id="itf-continue-btn" style="display:none;">Continue →</button>
        `;

        const tileRow = container.querySelector('#itf-tiles');
        const mascotEl = container.querySelector('#itf-mascot');
        const continueBtn = container.querySelector('#itf-continue-btn');
        const whyZone = container.querySelector('#itf-why-zone');

        function bumpMascot() {
          mascotEl.classList.remove('bump');
          void mascotEl.offsetWidth;
          mascotEl.classList.add('bump');
        }

        function playModelSentence(feeling) {
          if (!TTS) return;
          TTS.cancel();
          let u;
          try { u = new SpeechSynthesisUtterance(`${mascotName} feels ${feeling}.`); }
          catch(e) { return; }
          u.rate = tier === 'bronze' ? 0.8 : 0.85;
          u.lang = 'en-US';
          TTS.speak(u);
        }

        item.tiles.forEach(feeling => {
          const btn = document.createElement('button');
          btn.className = 'dp-tile';
          btn.textContent = feeling;
          btn.addEventListener('click', () => {
            if (done) return;
            sfx('tap');
            tileRow.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.color=''; });
            btn.classList.add('selected');
            btn.style.background = '#4FC3F7';
            selectedTile = feeling;
            bumpMascot();

            if (tier === 'bronze') {
              continueBtn.style.display = 'block';
            } else {
              playModelSentence(feeling);
              if (tier === 'silver') {
                continueBtn.style.display = 'block';
              } else {
                // Gold: a why-elaboration step, hybrid typed/say-it — mirrors
                // Description Pyramid's L3 exactly, same design language.
                const becauseMode = item.because_mode || 'typed';
                whyZone.innerHTML = becauseMode === 'typed'
                  ? `<div class="dp-because-label">Why does ${mascotName} feel ${feeling}?</div><input type="text" class="dp-l3-free-input" id="itf-why-input" placeholder="because…">`
                  : `<div class="dp-sayit-only-note">You'll say why out loud in a moment.</div>`;
                continueBtn.style.display = 'block';
              }
            }
          });
          tileRow.appendChild(btn);
        });

        continueBtn.addEventListener('click', () => {
          if (done || !selectedTile) return;
          done = true;

          if (tier === 'gold' && (item.because_mode || 'typed') === 'say-it') {
            // Chain into the shared Say It flow for the spoken elaboration —
            // same recorder/persistence/compare-card as Description Pyramid
            // uses, not a separate implementation.
            const target = `${mascotName} feels ${selectedTile} because...`;
            container.innerHTML = `<p class="module-question" style="text-align:center;">Tell us why:</p><div id="itf-sayit-zone"></div>`;
            renderSayItInteraction(container.querySelector('#itf-sayit-zone'), {
              prompt: null, target, audioFile: null, isBronze: false,
              moduleIndex: state.currentModuleIndex, tier, recordingItemIndex: idx,
              allowSkip: true, // subjective reflection — never force a recording
            }, () => advance());
            return;
          }

          advance();
        });

        function advance() {
          idx++;
          if (idx < session.length) renderItem();
          else onComplete(1); // no wrong answer possible — completing the session is full credit
        }
      }

      renderItem();
    }
  },

  // ─────────────────────────────────────────────
  //  CREATIVE REFLECTION CARD
  //  A digital companion to the physical notebook ritual (written by hand,
  //  bottom-right of the right-hand page, every lesson) — not a
  //  replacement for it. The template itself grows richer through the
  //  Description Pathway (Objects: "It is a ___" -> "___, ___, ___ with
  //  ___" / People: "He/She looks ___ and ___" / Feelings: "I think it
  //  feels ___ because ___" / Creative Work: the full 3-line card) — so
  //  the template is authored per lesson, not fixed in the shell. Purpose
  //  is an emergency presentation tool: any student who freezes when
  //  showing their work always has something ready to say. No correctness
  //  possible — this is the student's own expression, always full credit
  //  for genuine completion. Chains into the same shared Say It
  //  interaction used by Description Pyramid and Image-to-Feeling.
  'creative-reflection': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0;

      function renderItem() {
        const item = session[idx];
        const parts = item.template.split(/(\{\d+\})/g);
        let blankCount = 0;

        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;

        const cardHtml = parts.map(part => {
          const match = part.match(/^\{(\d+)\}$/);
          if (!match) return part.replace(/&/g,'&amp;').replace(/</g,'&lt;');
          const i = parseInt(match[1]);
          const hint = (item.blankHints && item.blankHints[i]) || '...';
          blankCount++;
          return `<input type="text" class="crc-blank-input" id="crc-blank-${i}" data-idx="${i}" placeholder="${hint}">`;
        }).join('');

        container.innerHTML = `
          <p class="crc-notebook-note">Can you remember what you wrote in your notebook? 📓</p>
          <div class="crc-card" id="crc-card">${cardHtml}</div>
          <div style="flex:1;min-height:4%;"></div>
          <button class="iv-proceed-btn" id="crc-continue-btn" style="display:none;">Continue →</button>
        `;

        const inputs = [...container.querySelectorAll('.crc-blank-input')];
        const continueBtn = container.querySelector('#crc-continue-btn');

        function checkAllFilled() {
          const allFilled = inputs.every(inp => inp.value.trim());
          continueBtn.style.display = allFilled ? 'block' : 'none';
        }
        inputs.forEach(inp => inp.addEventListener('input', () => {
          checkAllFilled();
        }));

        continueBtn.addEventListener('click', () => {
          const filled = template => {
            let result = item.template;
            inputs.forEach(inp => { result = result.replace(`{${inp.dataset.idx}}`, inp.value.trim()); });
            return result;
          };
          const target = filled();

          container.innerHTML = `<p class="module-question" style="text-align:center;">Now say it:</p><div id="crc-sayit-zone"></div>`;
          renderSayItInteraction(container.querySelector('#crc-sayit-zone'), {
            prompt: null, target, audioFile: null, isBronze: tier === 'bronze',
            moduleIndex: state.currentModuleIndex, tier, recordingItemIndex: idx,
            allowSkip: true, // this is a rehearsal tool, never force the recording
          }, () => {
            idx++;
            if (idx < session.length) renderItem();
            else onComplete(1); // no wrong answer possible — genuine completion is full credit
          });
        });
      }

      renderItem();
    }
  },

};



// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════

showScreen('screen-name');

// ══════════════════════════════════════════════════
//  DEBUG HARNESS — ?debug=1
//  Skips the name picker/linear tier flow so any
//  module + tier can be jumped to directly, the same
//  way module-demos/test-harness.html works for the
//  standalone demo files.
// ══════════════════════════════════════════════════
(function initDebugHarness() {
  if (new URLSearchParams(location.search).get('debug') !== '1') return;

  document.getElementById('debug-harness').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.style.paddingTop = '54px');

  const moduleSelect = document.getElementById('debug-module-select');
  const tierSelect = document.getElementById('debug-tier-select');

  LESSON.forEach((mod, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i + 1}. ${mod.label} (${mod.type})`;
    opt.style.background = '#0D1B2A';
    opt.style.color = '#fff';
    moduleSelect.appendChild(opt);
  });

  // Auto-pick the first student so audio/name display works without
  // clicking through the name picker.
  state.student = STUDENTS[0];
  state.results = buildResults();

  function jump() {
    startModule(Number(moduleSelect.value), tierSelect.value);
  }
  moduleSelect.addEventListener('change', jump);
  tierSelect.addEventListener('change', jump);

  // Read initial state from URL if provided (?module=<index>&tier=bronze)
  const params = new URLSearchParams(location.search);
  const initialModule = params.get('module');
  const initialTier = params.get('tier');
  if (initialModule !== null && LESSON[initialModule]) moduleSelect.value = initialModule;
  if (initialTier) tierSelect.value = initialTier;

  jump();
})();
</script>
