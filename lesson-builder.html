lete)\n//  onComplete(score)  score = 0\u20131\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// Render ID \u2014 incremented on every render call.\n// All async callbacks (onend, setTimeout) check this before acting\n// so stale callbacks from a previous render can never fire into a new one.\nlet _audioRID = 0;\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SHARED UTILITIES\n//  speak(), speakThenSentence(), safeShuffle(),\n//  showReinforcePanel() \u2014 used by new module types\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst TTS = window.speechSynthesis || null;\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SOUND EFFECTS \u2014 ported verbatim from module-demos/*.html.\n//  Every demo file has this exact same tone system (tap/star/complete),\n//  consistently, but none of it made it into the shell until now.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _sfxCtx = null;\nfunction sfxUnlock() {\n  if (!_sfxCtx) {\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (AC) _sfxCtx = new AC();\n  }\n  if (_sfxCtx && _sfxCtx.state === 'suspended') _sfxCtx.resume();\n}\nfunction tone(freq, dur) {\n  sfxUnlock();\n  if (!_sfxCtx) return;\n  const o = _sfxCtx.createOscillator(), g = _sfxCtx.createGain();\n  o.frequency.value = freq;\n  g.gain.setValueAtTime(0.15, _sfxCtx.currentTime);\n  g.gain.exponentialRampToValueAtTime(0.001, _sfxCtx.currentTime + dur);\n  o.connect(g); g.connect(_sfxCtx.destination);\n  o.start(); o.stop(_sfxCtx.currentTime + dur);\n}\nfunction sfx(name) {\n  if (name === 'tap') tone(600, 0.06);\n  if (name === 'correct') { tone(880, 0.12); setTimeout(() => tone(1180, 0.14), 90); }\n  if (name === 'wrong') tone(350, 0.22);\n  if (name === 'star') tone(1000, 0.1);\n  if (name === 'complete') { tone(700, 0.1); setTimeout(() => tone(1050, 0.16), 110); }\n}\n\nconst SPEAK_MOODS = {\n  neutral:   { rate:0.85, pitch:1.0,  volume:0.9 },\n  wrong:     { rate:0.80, pitch:0.9,  volume:0.8 },\n  celebrate: { rate:1.15, pitch:1.55, volume:1.0 },\n  slow:      { rate:0.80, pitch:1.0,  volume:0.9 },\n};\n\n// onEnd (optional) fires once playback genuinely finishes, whichever path\n// (audioFile or TTS) actually played. Added for modules that need to gate\n// an action on \"audio has finished\" (e.g. Listen & Choose unlocking\n// options only after the student has listened) \u2014 existing callers that\n// don't pass onEnd are unaffected.\nfunction speak(text, mood='neutral', delay=0, audioFile=null, onEnd=null) {\n  setTimeout(() => {\n    if (audioFile) {\n      const a = new Audio(audioFile);\n      a.onended = () => { if (onEnd) onEnd(); };\n      a.onerror = () => speakViaTTS(text, mood, onEnd); // missing/broken file \u2014 fall back, never go silent\n      a.play().catch(() => speakViaTTS(text, mood, onEnd));\n      return;\n    }\n    speakViaTTS(text, mood, onEnd);\n  }, delay);\n}\n\nfunction speakViaTTS(text, mood='neutral', onEnd=null) {\n  if (!TTS) { if (onEnd) onEnd(); return; }\n  TTS.cancel();\n  let u;\n  try { u = new SpeechSynthesisUtterance(text); } catch(e) { if (onEnd) onEnd(); return; }\n  const m = SPEAK_MOODS[mood];\n  u.rate = m.rate; u.pitch = m.pitch; u.volume = m.volume;\n  u.onend = () => { if (onEnd) onEnd(); };\n  TTS.speak(u);\n}\n\nfunction speakThenSentence(word, sentence, wordMood='celebrate', wordAudioFile=null, sentenceAudioFile=null) {\n  const playSentencePart = () => {\n    setTimeout(() => {\n      if (sentenceAudioFile) {\n        const a = new Audio(sentenceAudioFile);\n        a.onerror = () => speakViaTTS(sentence, 'neutral');\n        a.play().catch(() => speakViaTTS(sentence, 'neutral'));\n      } else {\n        speakViaTTS(sentence, 'neutral');\n      }\n    }, 400);\n  };\n\n  if (wordAudioFile) {\n    const wa = new Audio(wordAudioFile);\n    let done = false;\n    const advance = () => { if (done) return; done = true; playSentencePart(); };\n    wa.onended = advance;\n    wa.onerror = () => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); };\n    wa.play().catch(() => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); });\n    // No reliable duration fallback for a file we haven't loaded yet \u2014 onended covers the\n    // normal case; onerror/play() rejection covers the broken-file case.\n    return;\n  }\n  speakWordThenSentenceViaTTS(word, sentence, wordMood);\n}\n\nfunction speakWordThenSentenceViaTTS(word, sentence, wordMood='celebrate') {\n  if (!TTS) return;\n  TTS.cancel();\n  let wu;\n  try { wu = new SpeechSynthesisUtterance(word); } catch(e) { return; }\n  const wm = SPEAK_MOODS[wordMood];\n  wu.rate = wm.rate; wu.pitch = wm.pitch; wu.volume = wm.volume;\n  let done = false;\n  const playSentence = () => {\n    if (done) return; done = true;\n    setTimeout(() => {\n      if (!TTS) return;\n      let su;\n      try { su = new SpeechSynthesisUtterance(sentence); } catch(e) { return; }\n      const nm = SPEAK_MOODS['neutral'];\n      su.rate = nm.rate; su.pitch = nm.pitch; su.volume = nm.volume;\n      TTS.speak(su);\n    }, 400);\n  };\n  wu.onend = playSentence;\n  const fallback = Math.max(1200, (word.length / wu.rate) * 120) + 600;\n  setTimeout(playSentence, fallback);\n  TTS.speak(wu);\n}\n\n// Never returns a shuffled array that satisfies badFn (e.g. same order as input)\nfunction safeShuffle(arr, badFn, maxAttempts=20) {\n  const sh = a => [...a].sort(() => Math.random() - .5);\n  let result = sh(arr), attempts = 0;\n  while (badFn(result) && attempts++ < maxAttempts) result = sh(arr);\n  return result;\n}\n\n// Shared reinforcement panel \u2014 slides up, shows emoji/word/sentence, auto-closes\nconst MIN_READ_MS   = 3500;\nconst READ_PAUSE_MS = 1800;\n\nfunction showReinforcePanel(item, onClose) {\n  const plain = item.sentence.replace(/<[^>]+>/g, '');\n  const panel = document.getElementById('reinforce-panel');\n  const bar   = document.getElementById('rp-bar');\n\n  document.getElementById('rp-em').innerHTML = item.image\n    ? `<img src=\"${item.image}\" style=\"width:64px;height:64px;object-fit:cover;border-radius:10px;\" alt=\"${item.word}\">`\n    : item.emoji;\n  document.getElementById('rp-word').textContent = item.word;\n  document.getElementById('rp-sent').innerHTML   = item.sentence;\n\n  panel.style.transform = 'translateY(0)';\n\n  const wordMs  = Math.max(800,  (item.word.length / SPEAK_MOODS.celebrate.rate) * 120);\n  const sentMs  = Math.max(1500, (plain.length      / SPEAK_MOODS.neutral.rate)  * 60);\n  const panelMs = Math.max(MIN_READ_MS, wordMs + 400 + sentMs + READ_PAUSE_MS);\n\n  bar.style.transition = 'none'; bar.style.width = '0%';\n  requestAnimationFrame(() => requestAnimationFrame(() => {\n    bar.style.transition = `width ${panelMs}ms linear`;\n    bar.style.width = '100%';\n  }));\n\n  speakThenSentence(item.word, plain, 'celebrate', item.audioFile, item.sentenceAudioFile);\n\n  setTimeout(() => {\n    panel.style.transform = 'translateY(100%)';\n    bar.style.transition = 'none'; bar.style.width = '0%';\n    if (onClose) onClose();\n  }, panelMs);\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCENE REPOSITIONING \u2014 illustration \"slides down\" to clear content\n//  The frame uses a fixed aspect-ratio box (matching bg_and_border.png/\n//  frame_mask.png), so the illustration can't rely on normal document\n//  flow to avoid overlapping tall module content. Instead, after every\n//  content change, measure the flowzone's actual rendered bottom edge\n//  and move .layer-scene down to clear it. Its original design position\n//  (51.47%) is the floor \u2014 it never moves *up* past that. If content is\n//  tall enough to push the illustration mostly off-frame, fade it out\n//  rather than showing an awkward sliver.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst SCENE_DEFAULT_TOP = 51.47;\nlet _sceneObserver = null;\n\nfunction repositionSceneLayer() {\n  const flowzone = document.getElementById('module-container');\n  const scene = document.querySelector('.layer-scene');\n  const appFrame = document.querySelector('.app-frame');\n  if (!flowzone || !scene || !appFrame) return;\n\n  const frameRect = appFrame.getBoundingClientRect();\n  const flowRect = flowzone.getBoundingClientRect();\n  if (frameRect.height === 0) return;\n\n  const contentBottomPct = ((flowRect.bottom - frameRect.top) / frameRect.height) * 100;\n  const GAP_PCT = 2; // breathing room below content before the illustration starts\n  const newTop = Math.max(SCENE_DEFAULT_TOP, contentBottomPct + GAP_PCT);\n\n  scene.style.top = newTop + '%';\n  // Fade out once less than ~8% of the frame's height is left for it to show in\n  scene.style.opacity = (100 - newTop) < 8 ? '0' : '1';\n}\n\nfunction watchModuleContentForSceneReposition() {\n  const flowzone = document.getElementById('module-container');\n  if (!flowzone) return;\n  if (_sceneObserver) _sceneObserver.disconnect();\n  _sceneObserver = new MutationObserver(() => repositionSceneLayer());\n  _sceneObserver.observe(flowzone, { childList: true, subtree: true, characterData: true });\n  repositionSceneLayer();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  GRAMMAR-COLOR REINFORCEMENT \u2014 shared by gap-fill & true-false\n//  NEW in this shell (SHELL_MERGE_SPEC.md). Token fields are\n//  `t` (text) / `r` (role), matching the real published data shape \u2014\n//  NOT `text`/`role` as seen in the standalone module-demos files.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst GRAMMAR_COLORS = {\n  subject: { bg: 'rgba(0,188,212,0.18)',  border: '#00BCD4', color: '#00BCD4' },\n  verb:    { bg: 'rgba(139,195,74,0.18)', border: '#8BC34A', color: '#8BC34A' },\n  object:  { bg: 'rgba(255,152,0,0.18)',  border: '#FF9800', color: '#FFB74D' },\n  place:   { bg: 'rgba(171,71,188,0.18)', border: '#AB47BC', color: '#CE93D8' },\n  time:    { bg: 'rgba(233,30,99,0.18)',  border: '#E91E63', color: '#F48FB1' }\n};\nconst GRAMMAR_FADED = {\n  subject: { dot: '#1A6070', text: '#3A7A8A' },\n  verb:    { dot: '#3A5C22', text: '#4A7030' },\n  object:  { dot: '#6A4008', text: '#7A5010' },\n  place:   { dot: '#4A2058', text: '#5A3068' },\n  time:    { dot: '#6A1030', text: '#7A2040' }\n};\nfunction grammarSentence(tokens) {\n  return (tokens || []).map(tok => {\n    const c = GRAMMAR_COLORS[tok.r];\n    if (!c) return `<span style=\"color:#fff;\">${tok.t}</span>`;\n    return `<span style=\"display:inline-block;background:${c.bg};border:1.5px solid ${c.border};color:${c.color};border-radius:999px;padding:0px 9px;margin:1px 2px;font-weight:600;font-size:.85em;line-height:1.6;\">${tok.t}</span>`;\n  }).join(' ');\n}\nfunction grammarLegend(tokens) {\n  const ORDER = ['subject', 'verb', 'object', 'place', 'time'];\n  const present = {};\n  (tokens || []).forEach(tok => { present[tok.r] = true; });\n  const roles = ORDER.filter(r => present[r] && GRAMMAR_FADED[r]);\n  if (roles.length === 0) return '';\n  const pills = roles.map(role => {\n    const c = GRAMMAR_FADED[role];\n    return `<span style=\"display:inline-flex;align-items:center;gap:4px;color:${c.text};font-size:11px;font-weight:600;white-space:nowrap;\"><span style=\"width:7px;height:7px;border-radius:50%;background:${c.dot};flex-shrink:0;\"></span>${role.charAt(0).toUpperCase()+role.slice(1)}</span>`;\n  }).join('');\n  return `<div style=\"display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;\">${pills}</div>`;\n}\n// Shows the grammar-colored full sentence + speaks it, then calls onContinue\n// when the student taps Continue. Used only after a CORRECT answer.\nfunction showGrammarReinforce(tokens, plainSentence, onContinue) {\n  const overlay = document.getElementById('gr-overlay');\n  document.getElementById('gr-sentence').innerHTML = grammarSentence(tokens);\n  document.getElementById('gr-legend').innerHTML = grammarLegend(tokens);\n  overlay.style.display = 'flex';\n  speak(plainSentence, 'neutral', 200);\n  const btn = document.getElementById('gr-continue-btn');\n  btn.onclick = () => {\n    overlay.style.display = 'none';\n    onContinue();\n  };\n}\nfunction setGrammarReinforceLabel(correct) {\n  const label = document.querySelector('#gr-reinforce-content > div:first-child');\n  label.textContent = correct ? 'correct!' : 'not quite';\n  label.style.color = correct ? '#AED581' : '#F48FB1';\n}\n\n// Reuses the same #gr-overlay DOM as showGrammarReinforce, but with plain\n// text instead of grammar-colored tokens \u2014 for modules that just need a\n// simple \"here's what was right\" reveal, not a colored sentence breakdown.\n// No audio plays here by default (unlike showGrammarReinforce).\nfunction showPlainReinforce(correct, bodyText, onContinue) {\n  setGrammarReinforceLabel(correct);\n  document.getElementById('gr-sentence').innerHTML =\n    `<span style=\"color:rgba(255,255,255,0.8);font-size:.85em;\">${bodyText}</span>`;\n  document.getElementById('gr-legend').innerHTML = '';\n  document.getElementById('gr-overlay').style.display = 'flex';\n  const btn = document.getElementById('gr-continue-btn');\n  btn.onclick = () => {\n    document.getElementById('gr-overlay').style.display = 'none';\n    onContinue();\n  };\n}\n\n// Shared recording interaction \u2014 record/model/compare/self-assess, with the\n// same IndexedDB persistence and before/after compare card everywhere it's\n// used. Extracted so the standalone Say It module and Description Pyramid's\n// chained \"Now you say it\" step are the SAME code, not two copies that can\n// drift apart over time. `onDone` receives { assessed: true, correct: bool }\n// on a real self-assessment, or { assessed: false } if skipped (only\n// possible when opts.allowSkip is true \u2014 the standalone module never allows\n// skipping, but Description Pyramid's Say It step is explicitly optional).\nfunction renderSayItInteraction(container, opts, onDone) {\n  const { prompt, target, audioFile, moduleIndex, tier, recordingItemIndex, isBronze, allowSkip } = opts;\n\n  let modelPlaying   = false;\n  let modelAudio     = null;\n  let selfPlaying    = false;\n  let isRecording    = false;\n  let done           = false;\n  let recordingBlob  = null;\n  let selfAudio      = null;\n  let mediaRecorder  = null;\n  let stream         = null;\n  let priorAttempts  = [];\n\n  container.innerHTML = `\n    ${prompt ? `<p class=\"module-question\">${prompt}</p>` : ''}\n    <div class=\"speak-target\">${target}</div>\n    <div class=\"speak-trio\">\n      <button class=\"trio-btn model\" id=\"model-btn\">\n        <span class=\"trio-icon\" id=\"model-icon\">\ud83d\udd0a</span>\n        <span class=\"trio-label\">Model</span>\n      </button>\n      <button class=\"trio-btn playback\" id=\"play-btn\">\n        <span class=\"trio-icon\" id=\"play-icon\">\u25b6</span>\n        <span class=\"trio-label\">You</span>\n      </button>\n      <button class=\"trio-btn record\" id=\"rec-btn\">\n        <span class=\"trio-icon\" id=\"rec-icon\">\ud83c\udfa4</span>\n        <span class=\"trio-label\" id=\"rec-label\">Record</span>\n      </button>\n    </div>\n    <p class=\"speak-hint\" id=\"speak-hint\">Hear the model, then record yourself.</p>\n    <div class=\"compare-card\" id=\"compare-card\" style=\"display:none;\">\n      <div class=\"compare-play-btn\" id=\"compare-play-btn\">\u25b6</div>\n      <div class=\"compare-text\">\n        <div class=\"compare-title\">Compare with your last try</div>\n        <div class=\"compare-sub\" id=\"compare-sub\"></div>\n      </div>\n    </div>\n    <div id=\"assess-wrap\" style=\"display:none\">\n      <div class=\"assess-btns\">\n        <button class=\"assess-btn assess-yes\" id=\"assess-yes\">\u2713 That sounded right</button>\n        <button class=\"assess-btn assess-no\"  id=\"assess-no\">\u21a9 I need more practice</button>\n      </div>\n      <button class=\"share-link\" id=\"share-btn\">\ud83d\udce4 Share this recording</button>\n    </div>\n    ${allowSkip ? `<button class=\"share-link\" id=\"skip-sayit-btn\" style=\"margin-top:2%;\">Skip this step \u2192</button>` : ''}\n    <button class=\"iv-proceed-btn\" id=\"next-btn\">Next \u2192</button>\n  `;\n\n  const modelBtn    = container.querySelector('#model-btn');\n  const modelIcon   = container.querySelector('#model-icon');\n  const playBtn     = container.querySelector('#play-btn');\n  const playIcon    = container.querySelector('#play-icon');\n  const recBtn      = container.querySelector('#rec-btn');\n  const recIcon     = container.querySelector('#rec-icon');\n  const recLabel    = container.querySelector('#rec-label');\n  const hint        = container.querySelector('#speak-hint');\n  const compareCard = container.querySelector('#compare-card');\n  const compareSub  = container.querySelector('#compare-sub');\n  const comparePlayBtn = container.querySelector('#compare-play-btn');\n  const assessWrap  = container.querySelector('#assess-wrap');\n  const yesBtn      = container.querySelector('#assess-yes');\n  const noBtn       = container.querySelector('#assess-no');\n  const nextBtn     = container.querySelector('#next-btn');\n  const shareBtn    = container.querySelector('#share-btn');\n  const skipBtn     = container.querySelector('#skip-sayit-btn');\n\n  if (state.student) {\n    getRecordings(state.student, moduleIndex, tier, recordingItemIndex).then(attempts => {\n      priorAttempts = attempts;\n    }).catch(() => {}); // fails safe to \"no prior attempts\" \u2014 matches a genuine first try either way\n  }\n\n  function finishModelPlayback() {\n    modelPlaying = false;\n    modelIcon.textContent = '\ud83d\udd0a';\n    modelBtn.classList.remove('playing');\n  }\n\n  function playModel() {\n    if (modelPlaying) return;\n    stopSelf();\n    modelPlaying = true;\n    modelIcon.textContent = '\u23f8';\n    modelBtn.classList.add('playing');\n\n    if (audioFile) {\n      const a = new Audio(audioFile);\n      modelAudio = a;\n      a.onended = finishModelPlayback;\n      a.onerror = () => playModelViaSynthesis();\n      a.play().catch(() => playModelViaSynthesis());\n      return;\n    }\n    playModelViaSynthesis();\n  }\n\n  function playModelViaSynthesis() {\n    if (!TTS) { modelPlaying = false; return; }\n    TTS.cancel();\n    let u;\n    try { u = new SpeechSynthesisUtterance(target); }\n    catch(e) { modelPlaying = false; return; }\n    u.rate   = isBronze ? 0.8 : 0.85;\n    u.lang   = 'en-US';\n    u.onend  = finishModelPlayback;\n    TTS.speak(u);\n  }\n\n  modelBtn.addEventListener('click', () => {\n    if (modelPlaying) {\n      TTS && TTS.cancel();\n      if (modelAudio) { modelAudio.pause(); modelAudio.currentTime = 0; modelAudio = null; }\n      modelPlaying = false;\n      modelIcon.textContent = '\ud83d\udd0a';\n      modelBtn.classList.remove('playing');\n    } else {\n      playModel();\n    }\n  });\n\n  function stopSelf() {\n    if (selfAudio) { selfAudio.pause(); selfAudio.currentTime = 0; }\n    selfPlaying = false;\n    playIcon.textContent = '\u25b6';\n    playBtn.classList.remove('playing');\n  }\n\n  playBtn.addEventListener('click', () => {\n    if (!recordingBlob || isRecording || done) return;\n    if (selfPlaying) { stopSelf(); return; }\n\n    TTS && TTS.cancel();\n    modelPlaying = false;\n    modelIcon.textContent = '\ud83d\udd0a';\n    modelBtn.classList.remove('playing');\n\n    selfPlaying = true;\n    playIcon.textContent = '\u23f8';\n    playBtn.classList.add('playing');\n\n    const url  = URL.createObjectURL(recordingBlob);\n    selfAudio  = new Audio(url);\n    const resetSelfBtn = () => { stopSelf(); URL.revokeObjectURL(url); };\n    selfAudio.onended = resetSelfBtn;\n    selfAudio.onerror = resetSelfBtn;\n    selfAudio.play().catch(resetSelfBtn);\n  });\n\n  let comparePlaying = false;\n  comparePlayBtn.addEventListener('click', () => {\n    if (comparePlaying || !priorAttempts.length) return;\n    const lastAttempt = priorAttempts[priorAttempts.length - 1];\n    TTS && TTS.cancel();\n    stopSelf();\n    comparePlaying = true;\n    comparePlayBtn.textContent = '\u23f8';\n    const url = URL.createObjectURL(lastAttempt.blob);\n    const audio = new Audio(url);\n    const resetCompareBtn = () => {\n      comparePlaying = false;\n      comparePlayBtn.textContent = '\u25b6';\n      URL.revokeObjectURL(url);\n    };\n    audio.onended = resetCompareBtn;\n    audio.onerror = resetCompareBtn;\n    audio.play().catch(resetCompareBtn);\n  });\n\n  recBtn.addEventListener('click', async () => {\n    if (done) return;\n\n    if (isRecording) {\n      mediaRecorder.stop();\n      return;\n    }\n\n    stopSelf();\n    TTS && TTS.cancel();\n    modelPlaying = false;\n    modelIcon.textContent = '\ud83d\udd0a';\n    modelBtn.classList.remove('playing');\n\n    try {\n      stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n\n      const mimeType = MediaRecorder.isTypeSupported('audio/webm')\n        ? 'audio/webm' : 'audio/mp4';\n\n      const chunks  = [];\n      mediaRecorder = new MediaRecorder(stream, { mimeType });\n\n      mediaRecorder.ondataavailable = e => {\n        if (e.data.size > 0) chunks.push(e.data);\n      };\n\n      mediaRecorder.onstop = () => {\n        stream.getTracks().forEach(t => t.stop());\n        isRecording = false;\n        recIcon.textContent  = '\ud83c\udfa4';\n        recLabel.textContent = 'Re-record';\n        recBtn.classList.remove('recording');\n\n        recordingBlob = new Blob(chunks, { type: mimeType });\n        playBtn.classList.add('ready');\n\n        const hadPriorBeforeThisRecording = priorAttempts.length > 0;\n        yesBtn.textContent = hadPriorBeforeThisRecording ? '\u2713 That sounded better' : '\u2713 That sounded right';\n\n        if (state.student) {\n          saveRecording(state.student, moduleIndex, tier, recordingItemIndex, recordingBlob).then(() => {\n            if (hadPriorBeforeThisRecording) {\n              const lastAttempt = priorAttempts[priorAttempts.length - 1];\n              compareSub.textContent = `Recorded ${timeAgo(lastAttempt.timestamp)}`;\n              compareCard.style.display = 'flex';\n            }\n          }).catch(() => {});\n        }\n\n        assessWrap.style.display = 'block';\n        if (skipBtn) skipBtn.style.display = 'none'; // once they've recorded, skip no longer makes sense\n        hint.textContent = 'Listen to both, then tap how it went.';\n      };\n\n      mediaRecorder.start();\n      isRecording = true;\n      recIcon.textContent  = '\u23f9';\n      recLabel.textContent = 'Stop';\n      recBtn.classList.add('recording');\n      hint.textContent = 'Recording\u2026 tap \u23f9 to stop.';\n\n    } catch (err) {\n      showNoMicFallback();\n    }\n  });\n\n  shareBtn.addEventListener('click', async () => {\n    if (!recordingBlob) return;\n    const ext = recordingBlob.type.includes('mp4') ? 'm4a' : 'webm';\n    const file = new File([recordingBlob], `say-it-${Date.now()}.${ext}`, { type: recordingBlob.type });\n\n    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {\n      try {\n        await navigator.share({ files: [file], title: 'My recording', text: target });\n      } catch (e) {}\n      return;\n    }\n\n    const url = URL.createObjectURL(recordingBlob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `say-it-recording.${ext}`;\n    a.click();\n    URL.revokeObjectURL(url);\n  });\n\n  function lockAssess() {\n    done = true;\n    yesBtn.disabled = true;\n    noBtn.disabled  = true;\n    if (stream) stream.getTracks().forEach(t => t.stop());\n  }\n\n  yesBtn.addEventListener('click', () => {\n    if (done) return;\n    yesBtn.classList.add('selected');\n    lockAssess();\n    nextBtn.style.display = 'block';\n    nextBtn.onclick = () => onDone({ assessed: true, correct: true });\n  });\n\n  noBtn.addEventListener('click', () => {\n    if (done) return;\n    noBtn.classList.add('selected');\n    lockAssess();\n    nextBtn.style.display = 'block';\n    nextBtn.onclick = () => onDone({ assessed: true, correct: false });\n  });\n\n  if (skipBtn) {\n    skipBtn.addEventListener('click', () => {\n      if (done) return;\n      if (stream) stream.getTracks().forEach(t => t.stop());\n      onDone({ assessed: false });\n    });\n  }\n\n  function showNoMicFallback() {\n    recBtn.style.display  = 'none';\n    playBtn.style.display = 'none';\n    shareBtn.style.display = 'none';\n    if (skipBtn) skipBtn.style.display = 'none';\n    const msg = document.createElement('div');\n    msg.className   = 'no-mic-msg';\n    msg.textContent = 'Microphone not available. Listen to the model, say it aloud, then tap how it went.';\n    container.querySelector('.speak-trio').insertAdjacentElement('afterend', msg);\n    assessWrap.style.display = 'block';\n    hint.style.display = 'none';\n  }\n}\n\nconst CONTEXT_ROLE_PRIORITY = ['object', 'time', 'place', 'subject', 'connector', 'verb'];\n\n// Finds a real clue already sitting in a sentence's grammar tokens \u2014\n// whichever role the answer itself ISN'T, picked by how much context it\n// usually carries (object/time/place tend to be more informative than a\n// bare subject or connector). Needs no new authored content since it\n// reuses tokens every module already has for the reinforcement panel.\n// `answer` can be null (True/False has no single \"answer word\" \u2014 every\n// token is fair game). `exclude` lets a second, genuinely different clue\n// be found once the first has already been shown.\nfunction findContextClue(answer, tokens, exclude) {\n  if (!tokens || !tokens.length) return null;\n  const answerToken = answer ? tokens.find(t => t.t.split(/\\s+/).includes(answer)) : null;\n  const candidates = tokens.filter(t => t !== answerToken && t.t && t.t.trim() && !(exclude || []).includes(t.t));\n  if (!candidates.length) return null;\n  for (const role of CONTEXT_ROLE_PRIORITY) {\n    const match = candidates.find(t => t.r === role);\n    if (match) return match.t;\n  }\n  return candidates[0].t;\n}\n\nconst MODULE_REGISTRY = {\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  LISTEN & CHOOSE\n  //  v2 design: pool-based { pick, items: [{audio, question, options,\n  //  answer}] }, separate pool per tier, multi-question session like every\n  //  other module now. Every tier requires listening before the options\n  //  unlock (the old bronze-only \"unlock after 400ms regardless\" safety\n  //  window is gone \u2014 the new design just requires a listen every time,\n  //  simpler and more consistent). Gold re-locks options on replay.\n  //  Tap an option to select it, then Check (not immediate-answer-on-tap).\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-understanding': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = biasedSelect(items, pick, it => it.answer);\n      const isBronze = tier === 'bronze';\n      const isGold = tier === 'gold';\n      let idx = 0, totalScore = 0;\n\n      const PALETTE = [\n        { border:'#00BCD4', bg:'rgba(0,188,212,.18)',  color:'#4DD0E1' },\n        { border:'#AB47BC', bg:'rgba(171,71,188,.18)', color:'#CE93D8' },\n        { border:'#FF9800', bg:'rgba(255,152,0,.18)',  color:'#FFB74D' },\n        { border:'#E91E63', bg:'rgba(233,30,99,.18)',  color:'#F48FB1' }\n      ];\n\n      function renderQuestion() {\n        const { audio, question, options, answer } = session[idx];\n        let hasPlayed = false, playing = false, answered = false, optionsLive = false, selected = null, hintUsed = false;\n\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        container.innerHTML = `\n          <button class=\"precheck-hint-btn\" id=\"lc-hint-btn\" disabled>\ud83d\udca1 Hint</button>\n          <p class=\"lc-question-v2\">${question}</p>\n          <button class=\"lc-listen-btn-v2\" id=\"lc-listen-btn\">\n            <span class=\"lc-listen-icon-v2\" id=\"lc-listen-icon\">\ud83d\udd0a</span>\n            <span id=\"lc-listen-label\">Listen</span>\n          </button>\n          <p class=\"lc-hint-line-v2\" id=\"lc-hint\">&nbsp;</p>\n          <div class=\"lc-options-grid-v2\" id=\"lc-options\"></div>\n          <button id=\"gf-check-btn\" class=\"gf-check-btn\" style=\"display:none;\">Check</button>\n        `;\n\n        const listenBtn = container.querySelector('#lc-listen-btn');\n        const listenIcon = container.querySelector('#lc-listen-icon');\n        const listenLabel = container.querySelector('#lc-listen-label');\n        const hintLine = container.querySelector('#lc-hint');\n        const optionsGrid = container.querySelector('#lc-options');\n        const checkBtn = container.querySelector('#gf-check-btn');\n        const hintBtn = container.querySelector('#lc-hint-btn');\n\n        // Pre-check hint \u2014 no sentence/token context exists in this module\n        // (just audio + options), so elimination is the honest fit here,\n        // same reasoning as Picture & Word's image-to-word/word-to-image\n        // modes. Gated behind having listened at least once \u2014 a hint\n        // shouldn't let a student skip the actual listening step.\n        hintBtn.addEventListener('click', () => {\n          if (hintUsed || !hasPlayed) return;\n          hintUsed = true;\n          const wrongBtns = [...optionsGrid.querySelectorAll('.lc-option-btn-v2')].filter(b => b.textContent !== answer);\n          if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); }\n          hintBtn.disabled = true;\n          hintBtn.textContent = '\ud83d\udca1 Hint used';\n        });\n\n        function showHint(msg) {\n          hintLine.textContent = msg;\n          hintLine.style.opacity = '1';\n          setTimeout(() => { hintLine.style.opacity = '0'; }, 1800);\n        }\n        function setGridLive(live) {\n          optionsLive = live;\n          optionsGrid.querySelectorAll('.lc-option-btn-v2').forEach(b => {\n            if (b.dataset.done) return;\n            b.classList.toggle('locked', !live);\n          });\n        }\n\n        options.forEach((opt, i) => {\n          const btn = document.createElement('button');\n          btn.className = 'lc-option-btn-v2 locked';\n          btn.textContent = opt;\n          const c = PALETTE[i % PALETTE.length];\n          btn.addEventListener('click', () => {\n            if (answered) return;\n            if (!optionsLive) { showHint('\ud83d\udd0a Listen first!'); return; }\n            if (selected === btn) {\n              btn.style.borderColor = ''; btn.style.background = ''; btn.style.color = '';\n              selected = null;\n              checkBtn.style.display = 'none';\n            } else {\n              if (selected) {\n                selected.style.borderColor = ''; selected.style.background = ''; selected.style.color = '';\n              }\n              selected = btn;\n              btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n              checkBtn.style.display = 'block';\n            }\n          });\n          optionsGrid.appendChild(btn);\n        });\n\n        setGridLive(false);\n\n        listenBtn.addEventListener('click', () => {\n          if (playing) return;\n          playing = true;\n          listenIcon.textContent = '\u23f8';\n          listenLabel.textContent = 'Playing\u2026';\n          listenBtn.classList.add('playing');\n          if (isGold && hasPlayed) setGridLive(false); // gold: re-hide options on replay\n\n          const mood = isBronze ? 'slow' : 'neutral';\n          let done = false;\n          function onAudioEnd() {\n            if (done) return;\n            done = true;\n            playing = false; hasPlayed = true;\n            listenIcon.textContent = '\ud83d\udd0a';\n            listenLabel.textContent = 'Listen';\n            listenBtn.classList.remove('playing');\n            setGridLive(true);\n            if (!hintUsed) hintBtn.disabled = false;\n          }\n          speak(audio, mood, 0, null, onAudioEnd);\n          // Fallback in case onEnd never fires (browser quirk) \u2014 estimate\n          // from text length, matching the demo's own safety margin.\n          const estMs = Math.max(1500, (audio.length / (isBronze ? 0.8 : 0.85)) * 65);\n          setTimeout(onAudioEnd, estMs + 2000);\n        });\n\n        checkBtn.addEventListener('click', () => {\n          if (!selected || answered) return;\n          answered = true;\n          if (window.speechSynthesis) window.speechSynthesis.cancel();\n\n          const correct = (selected.textContent === answer);\n          if (state.student) recordWordExposure(state.student, answer, 'audio-understanding', correct).catch(() => {});\n          optionsGrid.querySelectorAll('.lc-option-btn-v2').forEach(b => { b.dataset.done = '1'; b.style.pointerEvents = 'none'; });\n          if (correct) totalScore++;\n          checkBtn.style.display = 'none';\n\n          setTimeout(() => {\n            const bodyText = correct ? `You heard: \"${audio}\"` : `The answer was: ${answer}`;\n            showPlainReinforce(correct, bodyText, () => {\n              idx++;\n              if (idx < session.length) renderQuestion();\n              else onComplete(totalScore / session.length);\n            });\n          }, 550);\n        });\n      }\n\n      renderQuestion();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  GAP FILL\n  //  One blank per question. Tap a word to fill it.\n  //  Tap the same word again to clear.\n  //  Check button confirms answer.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'gap-fill': {\n    // v2 design: pool-based. Each tier is { pick, items: [...] } \u2014 a separate\n    // pool per tier (per Nick's decision: difficulty differs per tier, so\n    // pools shouldn't be shared across tiers). Draws `pick` items.\n    //\n    // PILOT: Fading Hint Ladder (ported from hint-ladder-demo.html, this is\n    // the first module to get it \u2014 replaces the old binary retry scoring).\n    // hintLevel (0-3) only ever moves on a wrong attempt, resets each new\n    // question: 1 = glow only, no text; 2 = category hint (\"it's a verb\");\n    // 3 = first-letter hint. Stars this question: 0 hints=3, 1=2, 2+=1 \u2014\n    // mapped to a 0-1 score (1, 2/3, 1/3) that now drives the tier average\n    // in place of the old first-try=1/retry=0.6 model. A Reflect pause only\n    // appears when a hint was actually needed \u2014 a student who got it right\n    // immediately keeps the same fast pace as before, unslowed.\n    // Category hints fall back to the answer's grammar role (from tokens)\n    // since there's no dedicated per-item hint-category field yet \u2014 real\n    // authored categories (\"it's a food word\") would read richer than\n    // \"it's an object,\" but this needs no new content to work today.\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = biasedSelect(items, pick, it => it.answer);\n      let idx = 0, totalScore = 0;\n\n      const PALETTE = [\n        { border:'#00BCD4', bg:'rgba(0,188,212,.18)',  color:'#4DD0E1' },\n        { border:'#AB47BC', bg:'rgba(171,71,188,.18)', color:'#CE93D8' },\n        { border:'#FF9800', bg:'rgba(255,152,0,.18)',  color:'#FFB74D' },\n        { border:'#E91E63', bg:'rgba(233,30,99,.18)',  color:'#F48FB1' },\n        { border:'#8BC34A', bg:'rgba(139,195,74,.18)', color:'#AED581' }\n      ];\n      const SCORE_BY_HINT_LEVEL = { 0: 1, 1: 2/3, 2: 1/3, 3: 1/3 };\n      const STARS_BY_HINT_LEVEL = { 0: 3, 1: 2, 2: 1, 3: 1 };\n\n      function renderQuestion() {\n        const { sentence, options, answer, tokens } = session[idx];\n        let selected = null, hintLevel = 0, locked = false, usedElimination = false;\n        const wrongOptions = new Set(); // confirmed wrong this question \u2014 tried by the student OR eliminated by a hint\n        const contextClue1 = findContextClue(answer, tokens, []);\n        const contextClue2 = contextClue1 ? findContextClue(answer, tokens, [contextClue1]) : null;\n\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        container.innerHTML = `\n          <p class=\"gf-sentence\" id=\"gf-sentence\"></p>\n          <div class=\"gf-hint-row\" id=\"gf-hint-row\">\n            <span>hints</span>\n            <div class=\"gf-hint-dot\" id=\"gf-dot-1\"></div>\n            <div class=\"gf-hint-dot\" id=\"gf-dot-2\"></div>\n            <div class=\"gf-hint-dot\" id=\"gf-dot-3\"></div>\n          </div>\n          <div class=\"gf-pill-row\" id=\"gf-pill-row\"></div>\n          <button id=\"gf-check-btn\" class=\"gf-check-btn\">Check</button>\n          <p class=\"gf-status\" id=\"gf-status\">&nbsp;</p>\n          <button class=\"gf-reflect-btn\" id=\"gf-reflect-btn\">I see it now \ud83d\udc4d \u2014 continue</button>\n        `;\n\n        function renderSentence(cluesToShow) {\n          let html = sentence.replace('___', '<span class=\"gf-blank\" id=\"gf-blank-slot\">&nbsp;</span>');\n          (cluesToShow || []).forEach(clue => {\n            if (clue && html.includes(clue)) {\n              html = html.replace(clue, `<span class=\"gf-context-clue\">${clue}</span>`);\n            }\n          });\n          container.querySelector('#gf-sentence').innerHTML = html;\n        }\n        renderSentence([]);\n\n        const pillRow    = container.querySelector('#gf-pill-row');\n        const checkBtn   = container.querySelector('#gf-check-btn');\n        const statusEl   = container.querySelector('#gf-status');\n        const reflectBtn = container.querySelector('#gf-reflect-btn');\n        const dots       = [null,\n          container.querySelector('#gf-dot-1'),\n          container.querySelector('#gf-dot-2'),\n          container.querySelector('#gf-dot-3')];\n\n        let letterHintIndex = null; // chosen once, first time hintLevel reaches 3 \u2014 stays stable after that\n\n        function markPillWrong(word) {\n          const pill = pillRow.querySelector(`[data-word=\"${word}\"]`);\n          if (pill) pill.classList.add('eliminated');\n        }\n\n        // Crosses out one wrong option the student hasn't already ruled out\n        // \u2014 real, actionable narrowing, instead of a grammar-role label\n        // that's equally true of every option and tells them nothing.\n        // `respectFloor` protects against a PREMATURE full-solve (used at\n        // level 2's fallback) \u2014 never eliminate down to 1 live option there,\n        // some real retrieval effort should survive that early. Level 3 is\n        // the genuine last resort after two real reasoning hints already\n        // happened, so it's allowed to fully resolve if the pool is small\n        // enough that nothing partial is left to reveal \u2014 that's not a\n        // shortcut, it's what \"last resort\" is supposed to mean.\n        function eliminateOneMore(respectFloor) {\n          const liveCount = options.length - wrongOptions.size;\n          if (respectFloor && liveCount <= 2) return null;\n          const candidates = options.filter(o => o !== answer && !wrongOptions.has(o));\n          if (candidates.length === 0) return null;\n          const pick = candidates[0];\n          wrongOptions.add(pick);\n          markPillWrong(pick);\n          return pick;\n        }\n\n        function updateHintVisuals() {\n          if (hintLevel === 1) {\n            renderSentence([contextClue1]);\n          } else if (hintLevel === 2 && contextClue2) {\n            renderSentence([contextClue1, contextClue2]);\n          }\n          const blank = container.querySelector('#gf-blank-slot'); // re-query fresh in case renderSentence just rebuilt it\n          if (!blank) return;\n          blank.classList.toggle('hint-glow', hintLevel >= 1);\n          if (hintLevel === 3) {\n            if (letterHintIndex === null) letterHintIndex = Math.floor(Math.random() * answer.length);\n            const revealed = answer.split('').map((ch, i) => i === letterHintIndex ? ch : '_').join('');\n            blank.innerHTML = `<span class=\"gf-hint-placeholder\">${revealed}</span>`;\n          } else if (!selected) {\n            blank.innerHTML = '&nbsp;';\n          }\n          for (let i = 1; i <= 3; i++) dots[i].classList.toggle('used', hintLevel >= i);\n        }\n\n        options.forEach((opt, i) => {\n          const btn = document.createElement('button');\n          btn.className = 'gf-pill';\n          btn.textContent = opt;\n          btn.dataset.word = opt;\n          const c = PALETTE[i % PALETTE.length];\n          btn.addEventListener('click', () => {\n            if (locked) return;\n            pillRow.querySelectorAll('.gf-pill').forEach(x => {\n              x.classList.remove('selected');\n              x.style.borderColor = ''; x.style.background = ''; x.style.color = '';\n            });\n            btn.classList.add('selected');\n            btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n            selected = opt;\n            const blank = container.querySelector('#gf-blank-slot');\n            if (blank) { blank.textContent = opt; blank.style.color = c.color; }\n            sfx('tap');\n          });\n          pillRow.appendChild(btn);\n        });\n\n        checkBtn.addEventListener('click', () => {\n          if (locked) return;\n          if (!selected) { statusEl.textContent = 'pick an option first'; return; }\n\n          if (selected === answer) {\n            locked = true;\n            checkBtn.disabled = true;\n            sfx('correct');\n            if (state.student) recordWordExposure(state.student, answer, 'gap-fill', true).catch(() => {});\n            const score = SCORE_BY_HINT_LEVEL[hintLevel];\n            const stars = STARS_BY_HINT_LEVEL[hintLevel];\n            totalScore += score;\n            statusEl.textContent = `correct! ${'\u2b50'.repeat(stars)}${'\u2729'.repeat(3 - stars)}`;\n\n            const proceed = () => {\n              const plain = (tokens || []).map(t => t.t).join(' ');\n              showGrammarReinforce(tokens, plain, () => {\n                idx++;\n                if (idx < session.length) renderQuestion();\n                else onComplete(totalScore / session.length);\n              });\n            };\n\n            if (hintLevel > 0) {\n              // A hint was actually needed this time \u2014 worth a real pause,\n              // not just the usual fast handoff. A student who got it right\n              // immediately never sees this and keeps the old pace exactly.\n              reflectBtn.classList.add('show');\n              reflectBtn.addEventListener('click', () => {\n                reflectBtn.disabled = true;\n                reflectBtn.textContent = 'Nice \u2014 that sticks better than just moving on \u2713';\n                setTimeout(proceed, 500);\n              }, { once: true });\n            } else {\n              setTimeout(proceed, 550);\n            }\n          } else {\n            wrongOptions.add(selected);\n            markPillWrong(selected);\n            hintLevel = Math.min(hintLevel + 1, 3);\n            sfx('wrong');\n            if (state.student) recordWordExposure(state.student, answer, 'gap-fill', false).catch(() => {});\n\n            let eliminatedWord = null;\n            let secondClueShown = false;\n\n            if (hintLevel === 2) {\n              if (contextClue2) {\n                secondClueShown = true;\n              } else if (!usedElimination) {\n                // No second real clue exists for this sentence (short item) \u2014\n                // fall back to elimination here instead of showing nothing new.\n                // Still a \"middle rung\" moment, so the floor still applies.\n                eliminatedWord = eliminateOneMore(true);\n                if (eliminatedWord) usedElimination = true;\n              }\n            } else if (hintLevel === 3 && !usedElimination) {\n              // Only spend the elimination budget here if level 2 didn't\n              // already use it via the fallback above \u2014 exactly one\n              // elimination total across the whole ladder, never two.\n              // No floor here \u2014 this is the genuine last resort.\n              eliminatedWord = eliminateOneMore(false);\n              if (eliminatedWord) usedElimination = true;\n            }\n\n            const messages = {\n              1: contextClue1 ? 'Not quite \u2014 look at the highlighted word for a clue.' : 'Not quite \u2014 look at the highlighted blank.',\n              2: secondClueShown\n                  ? 'Not quite \u2014 here\\'s another clue in the sentence.'\n                  : (eliminatedWord ? `Hint: \"${eliminatedWord}\" isn't it either.` : 'Not quite \u2014 try again.'),\n              3: eliminatedWord\n                  ? `Almost \u2014 \"${eliminatedWord}\" is out too, and one letter is revealed in the blank.`\n                  : 'Almost \u2014 one letter is revealed in the blank.',\n            };\n            statusEl.textContent = messages[hintLevel];\n            updateHintVisuals();\n            const sel = pillRow.querySelector(`[data-word=\"${selected}\"]`);\n            if (sel) sel.animate(\n              [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],\n              {duration:350}\n            );\n          }\n        });\n      }\n\n      renderQuestion();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  TRUE / FALSE\n  //  Statement shown. Two big buttons.\n  //  Tap one \u2192 immediate feedback, show correct.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'true-false': {\n    // v2 design: pool-based, { pick, items: [...] } per tier, separate pool\n    // per tier. Tap True/False then Check, single attempt per question \u2014\n    // grammar reinforcement shows either way, correct or wrong \u2014 then\n    // averages across the session for the tier's overall score.\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      let idx = 0, totalScore = 0;\n\n      function renderQuestion() {\n        const { statement, answer, tokens } = session[idx];\n        let selectedChoice = null;\n        let hintUsed = false;\n\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        container.innerHTML = `\n          <button class=\"precheck-hint-btn\" id=\"tf-hint-btn\">\ud83d\udca1 Hint</button>\n          <div class=\"tf-statement-v2\" id=\"tf-statement\">${statement}</div>\n          <div class=\"tf-buttons-v2\">\n            <button class=\"tf-btn-v2\" id=\"tf-true-btn\">\u2713 True</button>\n            <button class=\"tf-btn-v2\" id=\"tf-false-btn\">\u2717 False</button>\n          </div>\n          <button id=\"gf-check-btn\" class=\"gf-check-btn\">Check</button>\n          <p class=\"gf-status\" id=\"tf-status\">&nbsp;</p>\n        `;\n\n        const trueBtn  = container.querySelector('#tf-true-btn');\n        const falseBtn = container.querySelector('#tf-false-btn');\n        const checkBtn = container.querySelector('#gf-check-btn');\n        const statusEl = container.querySelector('#tf-status');\n        const hintBtn  = container.querySelector('#tf-hint-btn');\n\n        // Pre-check hint \u2014 a single, optional context-clue glow available\n        // before committing an answer, not an escalating ladder. True/False\n        // is a binary choice, so eliminating an option would just hand over\n        // the answer \u2014 this respects that instead of forcing a mismatched\n        // mechanic onto it.\n        if (!findContextClue(null, tokens)) hintBtn.style.display = 'none';\n        hintBtn.addEventListener('click', () => {\n          if (hintUsed) return;\n          hintUsed = true;\n          const clue = findContextClue(null, tokens);\n          if (!clue) return;\n          const statementEl = container.querySelector('#tf-statement');\n          if (statementEl.textContent.includes(clue)) {\n            statementEl.innerHTML = statementEl.textContent.replace(clue, `<span class=\"gf-context-clue\">${clue}</span>`);\n          }\n          hintBtn.disabled = true;\n          hintBtn.textContent = '\ud83d\udca1 Hint used';\n        });\n\n        function selectChoice(choice) {\n          if (trueBtn.disabled) return;\n          selectedChoice = (selectedChoice === choice) ? null : choice;\n          trueBtn.classList.toggle('selected', selectedChoice === true);\n          falseBtn.classList.toggle('selected', selectedChoice === false);\n          statusEl.textContent = '\\u00A0';\n          sfx('tap');\n        }\n        trueBtn.addEventListener('click', () => selectChoice(true));\n        falseBtn.addEventListener('click', () => selectChoice(false));\n\n        checkBtn.addEventListener('click', () => {\n          if (trueBtn.disabled) return;\n          if (selectedChoice === null) { statusEl.textContent = 'pick True or False first'; return; }\n\n          const correct = (selectedChoice === answer);\n          trueBtn.disabled = true;\n          falseBtn.disabled = true;\n          checkBtn.disabled = true;\n          if (correct) totalScore += 1;\n\n          const chosenBtn = selectedChoice ? trueBtn : falseBtn;\n          chosenBtn.classList.remove('selected');\n          chosenBtn.classList.add(correct ? 'hl-correct' : 'hl-wrong');\n          statusEl.textContent = correct ? 'correct!' : 'not quite right';\n\n          const plain = tokens && tokens.length ? tokens.map(t => t.t).join(' ') : statement;\n          setTimeout(() => {\n            setGrammarReinforceLabel(correct);\n            showGrammarReinforce(tokens, plain, () => {\n              idx++;\n              if (idx < session.length) renderQuestion();\n              else onComplete(totalScore / session.length);\n            });\n          }, 550);\n        });\n      }\n\n      renderQuestion();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  WORD MATCH\n  //  Tap a word on the left, then its match on the right.\n  //  Each matched pair gets a distinct colour from PALETTE.\n  //  Wrong \u2192 both flash red, deselect.\n  //  Score: 1.0 minus 0.1 per wrong attempt (floor 0.6).\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  WORD MATCH\n  //  v2 design: pool-based { pick, items: [{left,right}] }, separate pool\n  //  per tier. Free re-pairing model (not lock-on-first-click) \u2014 tap a left,\n  //  tap a right to assign it (unlinking any prior pairing on either side\n  //  first), reassign as much as you want. Only checks correctness once\n  //  every left has SOME right assigned; if not fully correct, shows\n  //  \"Not quite yet\" and lets you keep adjusting rather than penalizing.\n  //  Bronze-only nudge message on a wrong-but-complete-looking assignment.\n  //  Always full score on completion \u2014 this module requires eventual full\n  //  correctness to advance, not partial credit.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'word-match': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const pairs = biasedSelect(items, pick, it => it.left);\n      const total = pairs.length;\n      const isBronze = (tier === 'bronze');\n\n      const PALETTE = [\n        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },\n        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },\n        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },\n        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },\n        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }\n      ];\n      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);\n\n      document.getElementById('v2-qlabel').innerHTML =\n        `<span>Match the words.</span><span id=\"wm-score\">0 of ${total} paired</span>`;\n\n      container.innerHTML = `\n        <div class=\"wm-grid-v2\">\n          <div class=\"wm-col-v2\" id=\"wm-left-col\"></div>\n          <div class=\"wm-col-v2\" id=\"wm-right-col\"></div>\n        </div>\n        <p class=\"wm-encourage-v2\" id=\"wm-encourage\"></p>\n        <p class=\"wm-nudge-v2\" id=\"wm-nudge\"></p>\n        <button id=\"wm-notquite-btn\" class=\"wm-notquite-btn-v2\" disabled>Not quite yet</button>\n        <button id=\"wm-next-btn\" class=\"iv-proceed-btn\">Next \u2192</button>\n      `;\n\n      const leftCol      = container.querySelector('#wm-left-col');\n      const rightCol     = container.querySelector('#wm-right-col');\n      const scoreLabel   = document.getElementById('wm-score');\n      const encourageEl  = container.querySelector('#wm-encourage');\n      const nudgeEl      = container.querySelector('#wm-nudge');\n      const notQuiteBtn  = container.querySelector('#wm-notquite-btn');\n      const nextBtn      = container.querySelector('#wm-next-btn');\n\n      let pairings = new Map();   // leftIdx -> rightIdx\n      let rightUsed = new Map();  // rightIdx -> leftIdx\n      let selectedLeftBtn = null;\n      let confirmed = false;\n\n      function styleLeft(btn) {\n        if (confirmed) return;\n        const idx = parseInt(btn.dataset.pairIdx);\n        const c = pairColor[idx];\n        const isSelected = (btn === selectedLeftBtn);\n        const isPaired = pairings.has(idx);\n        if (isSelected) {\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n          btn.style.boxShadow = `0 0 0 3px ${c.border}`;\n        } else if (isPaired) {\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n          btn.style.boxShadow = '';\n        } else {\n          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';\n          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';\n        }\n      }\n      function styleRight(btn) {\n        if (confirmed) return;\n        const rightIdx = parseInt(btn.dataset.pairIdx);\n        if (rightUsed.has(rightIdx)) {\n          const c = pairColor[rightUsed.get(rightIdx)];\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n        } else {\n          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';\n          btn.style.color = 'rgba(255,255,255,0.85)';\n        }\n      }\n      function checkAllCorrect() {\n        if (pairings.size !== total) return false;\n        for (const leftIdx of pairings.keys()) {\n          if (pairings.get(leftIdx) !== leftIdx) return false;\n        }\n        return true;\n      }\n      function refreshAll() {\n        container.querySelectorAll('.wm-btn-v2[data-side=\"left\"]').forEach(styleLeft);\n        container.querySelectorAll('.wm-btn-v2[data-side=\"right\"]').forEach(styleRight);\n\n        let correctSoFar = 0, wrongSoFar = 0;\n        pairings.forEach((rightIdx, leftIdx) => {\n          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;\n        });\n\n        if (pairings.size === total) {\n          if (state.student) {\n            pairings.forEach((rightIdx, leftIdx) => {\n              const word = pairs[leftIdx] && pairs[leftIdx].left;\n              if (word) recordWordExposure(state.student, word, 'word-match', rightIdx === leftIdx).catch(() => {});\n            });\n          }\n          if (checkAllCorrect()) {\n            confirmed = true;\n            sfx('correct');\n            scoreLabel.textContent = 'Good job!';\n            scoreLabel.style.color = '#AED581';\n            notQuiteBtn.style.display = 'none';\n            nudgeEl.style.opacity = '0';\n            encourageEl.style.opacity = '0';\n            nextBtn.style.display = 'flex';\n            nextBtn.onclick = () => onComplete(1);\n          } else {\n            sfx('wrong');\n            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;\n            scoreLabel.style.color = '';\n            nextBtn.style.display = 'none';\n            notQuiteBtn.style.display = 'flex';\n            nudgeEl.style.opacity = '0';\n            encourageEl.style.opacity = '0';\n          }\n        } else {\n          scoreLabel.textContent = `${pairings.size} of ${total} paired`;\n          scoreLabel.style.color = '';\n          nextBtn.style.display = 'none';\n          notQuiteBtn.style.display = 'none';\n\n          // Bronze only: nudge the moment a wrong pairing exists, takes priority over encouragement\n          if (isBronze && wrongSoFar > 0) {\n            nudgeEl.textContent = 'Are you sure about that one?';\n            nudgeEl.style.opacity = '1';\n            encourageEl.style.opacity = '0';\n          } else {\n            nudgeEl.style.opacity = '0';\n            if (correctSoFar > 0) {\n              const ratio = correctSoFar / total;\n              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'\n                                       : ratio >= 0.34 ? 'Getting there!'\n                                       : 'Nice, keep going!';\n              encourageEl.style.opacity = '1';\n            } else {\n              encourageEl.style.opacity = '0';\n            }\n          }\n        }\n      }\n\n      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));\n      const leftItems = safeShuffle(withIdx, () => false);\n      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));\n\n      leftItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className = 'wm-btn-v2';\n        btn.textContent = pair.left;\n        btn.dataset.side = 'left';\n        btn.dataset.pairIdx = pair.pairIdx;\n        leftCol.appendChild(btn);\n      });\n      rightItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className = 'wm-btn-v2';\n        btn.textContent = pair.right;\n        btn.dataset.side = 'right';\n        btn.dataset.pairIdx = pair.pairIdx;\n        rightCol.appendChild(btn);\n      });\n\n      container.querySelectorAll('.wm-btn-v2').forEach(btn => {\n        btn.addEventListener('click', () => {\n          if (confirmed) return;\n\n          if (btn.dataset.side === 'left') {\n            sfx('tap');\n            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;\n            refreshAll();\n            return;\n          }\n\n          // Right button \u2014 always unlink any existing pairing first, then optionally re-pair\n          const rightIdx = parseInt(btn.dataset.pairIdx);\n          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;\n\n          if (rightUsed.has(rightIdx)) {\n            const prevLeftIdx = rightUsed.get(rightIdx);\n            pairings.delete(prevLeftIdx);\n            rightUsed.delete(rightIdx);\n            if (leftIdx === null || leftIdx === prevLeftIdx) {\n              selectedLeftBtn = null;\n              sfx('tap');\n              refreshAll();\n              return;\n            }\n          }\n          if (leftIdx === null) { refreshAll(); return; }\n\n          if (pairings.has(leftIdx)) {\n            rightUsed.delete(pairings.get(leftIdx));\n            pairings.delete(leftIdx);\n          }\n          pairings.set(leftIdx, rightIdx);\n          rightUsed.set(rightIdx, leftIdx);\n          selectedLeftBtn = null;\n          sfx('tap');\n          refreshAll();\n        });\n      });\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SEQUENCING (\"Put in Order\")\n  //  v2 design: pool-based { pick, items: [{prompt, sequence, correct}] },\n  //  same standard as every other module. Each slot is colored by its\n  //  POSITION (1st, 2nd, 3rd...) using the same 5-color PALETTE as\n  //  gap-fill/word-match, not by which word occupies it \u2014 matches\n  //  put-in-order-demo.html exactly (SEQ_PALETTE there).\n  //  Items shown in pool. Tap to place into numbered slots.\n  //  Tap a filled slot to return item to pool.\n  //  Check button appears when all slots filled.\n  //  Score per question: correct positions / total. Averaged across the\n  //  `pick` questions drawn for the tier's session.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'sequencing': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      let idx = 0, totalScore = 0;\n\n      const PALETTE = [\n        { border:'#00BCD4', bg:'rgba(0,188,212,.15)',  text:'#00BCD4' },\n        { border:'#AB47BC', bg:'rgba(171,71,188,.15)', text:'#CE93D8' },\n        { border:'#FF9800', bg:'rgba(255,152,0,.15)',  text:'#FFB74D' },\n        { border:'#E91E63', bg:'rgba(233,30,99,.15)',  text:'#F48FB1' },\n        { border:'#8BC34A', bg:'rgba(139,195,74,.15)', text:'#AED581' }\n      ];\n\n      function renderQuestion() {\n        const { prompt, sequence, correct } = session[idx];\n        const slots = new Array(correct.length).fill(null);\n        let checked = false;\n\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        container.innerHTML = `\n          <p class=\"seq-prompt-v2\">${prompt}</p>\n          <div class=\"seq-slots-v2\" id=\"seq-slots\"></div>\n          <p class=\"seq-pool-label-v2\">Tap to place \u2193</p>\n          <div class=\"seq-pool-v2\" id=\"seq-pool\"></div>\n          <button id=\"gf-check-btn\" class=\"gf-check-btn\" style=\"display:none;\">Check</button>\n          <button id=\"seq-next-btn\" class=\"iv-proceed-btn\">Next \u2192</button>\n        `;\n\n        const slotsEl  = container.querySelector('#seq-slots');\n        const poolEl   = container.querySelector('#seq-pool');\n        const checkBtn = container.querySelector('#gf-check-btn');\n        const nextBtn  = container.querySelector('#seq-next-btn');\n\n        function renderSlots() {\n          slotsEl.innerHTML = '';\n          slots.forEach((val, i) => {\n            const c = PALETTE[i % PALETTE.length];\n            const slot = document.createElement('div');\n            slot.className = 'seq-slot-v2';\n            const numColor = val ? c.border : 'rgba(255,255,255,0.3)';\n            slot.innerHTML = `<div class=\"slot-num-v2\" style=\"color:${numColor};\">${i + 1}</div><div class=\"slot-text-v2\">${val || ''}</div>`;\n\n            if (val && !checked) {\n              slot.style.borderColor = c.border;\n              slot.style.background = c.bg;\n              slot.querySelector('.slot-text-v2').style.color = c.text;\n              slot.style.cursor = 'pointer';\n              slot.addEventListener('click', () => {\n                const word = slots[i];\n                slots[i] = null;\n                poolEl.querySelectorAll('.seq-item-v2').forEach(b => {\n                  if (b.dataset.word === word) b.classList.remove('used');\n                });\n                sfx('tap');\n                renderSlots();\n                updateCheck();\n              });\n            }\n            slotsEl.appendChild(slot);\n          });\n        }\n\n        function updateCheck() {\n          checkBtn.style.display = slots.every(s => s !== null) ? 'block' : 'none';\n        }\n\n        const shuffled = [...sequence].sort(() => Math.random() - 0.5);\n        shuffled.forEach(word => {\n          const btn = document.createElement('button');\n          btn.className = 'seq-item-v2';\n          btn.textContent = word;\n          btn.dataset.word = word;\n          btn.addEventListener('click', () => {\n            if (btn.classList.contains('used') || checked) return;\n            const emptyIdx = slots.indexOf(null);\n            if (emptyIdx === -1) return;\n            slots[emptyIdx] = word;\n            btn.classList.add('used');\n            sfx('tap');\n            renderSlots();\n            updateCheck();\n          });\n          poolEl.appendChild(btn);\n        });\n\n        checkBtn.addEventListener('click', () => {\n          if (checked) return;\n          checked = true;\n          checkBtn.style.display = 'none';\n          poolEl.querySelectorAll('.seq-item-v2').forEach(b => b.style.pointerEvents = 'none');\n\n          let correctCount = 0;\n          slotsEl.querySelectorAll('.seq-slot-v2').forEach((slot, i) => {\n            const isCorrect = (slots[i] === correct[i]);\n            if (isCorrect) {\n              slot.style.borderColor = '#8BC34A';\n              slot.style.background = 'rgba(139,195,74,0.15)';\n              correctCount++;\n            } else {\n              slot.style.borderColor = '#E91E63';\n              slot.style.background = 'rgba(233,30,99,0.12)';\n              slot.querySelector('.slot-text-v2').innerHTML =\n                `<span style=\"text-decoration:line-through;opacity:0.5;\">${slots[i]}</span> <span style=\"color:#AED581;margin-left:4px;\">\u2192 ${correct[i]}</span>`;\n            }\n          });\n\n          const score = correctCount / correct.length;\n          totalScore += score;\n          nextBtn.style.display = 'block';\n        });\n\n        nextBtn.addEventListener('click', () => {\n          idx++;\n          if (idx < session.length) renderQuestion();\n          else onComplete(totalScore / session.length);\n        });\n\n        renderSlots();\n      }\n\n      renderQuestion();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  AUDIO SPEAKING (\"Say It\")\n  //  v2 design: pool-based, { pick, items: [{prompt,target,keyWords}] } per\n  //  tier \u2014 this module was missed during the original 12-module shell\n  //  merge (it kept its pre-merge single-item shape while the Lesson\n  //  Builder's authoring side was already pool-based), found and fixed here.\n  //\n  //  Three-button compare mechanic:\n  //    [\ud83d\udd0a Model] \u2014 plays TTS (swap src for MP3 later)\n  //    [\u25b6 You]   \u2014 plays back student's recording (unlocks after first record)\n  //    [\ud83c\udfa4 Rec]  \u2014 records / re-records via MediaRecorder\n  //\n  //  Recordings persist to the local progress database (last 3 kept per\n  //  exercise, keyed by student \u2014 see saveRecording/getRecordings). This is\n  //  a self-evaluation tool, not a teacher-review tool: nothing leaves the\n  //  device unless the student actively shares it. When a prior attempt\n  //  exists, a compare card appears after the fresh recording (never\n  //  before \u2014 nothing to compare on a genuine first try), and the\n  //  self-assess wording shifts from \"sounded right\" (checking against the\n  //  model) to \"sounded better\" (checking growth against yourself).\n  //\n  //  Uses MediaRecorder API (works on iOS Safari 14.5+, Chrome, Firefox, Edge).\n  //  Falls back to model-only + self-assess if mic permission denied.\n  //  Scoring: self-assess only \u2014 student decides when they're happy.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-speaking': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      const isBronze = tier === 'bronze';\n      let idx = 0, totalScore = 0;\n\n      function renderQuestion() {\n        const { prompt, target, audioFile } = session[idx];\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        renderSayItInteraction(container, {\n          prompt, target, audioFile, isBronze,\n          moduleIndex: state.currentModuleIndex,\n          tier,\n          recordingItemIndex: idx,\n          allowSkip: false, // the standalone module always requires an assessment \u2014 only the pyramid's chained step is skippable\n        }, (result) => {\n          totalScore += result.correct ? 1 : 0;\n          idx++;\n          if (idx < session.length) renderQuestion();\n          else onComplete(totalScore / session.length);\n        });\n      }\n\n      renderQuestion();\n    }\n  },\n\n\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  IMAGE VOCAB\n  //  Bronze: image \u2192 tap correct word\n  //  Silver: word  \u2192 tap correct image\n  //  Gold:   image + sentence blank \u2192 word bank\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'image-vocab': {\n    // \"Picture & Word\" module \u2014 kept as 'image-vocab' to match the real\n    // production `type` field; SHELL_MERGE_SPEC's \"picture-word\" is a\n    // descriptive name, not the actual data-contract key.\n    // v2 design: separate pool PER TIER \u2014 { pick, mode, items: [...] } \u2014\n    // per Nick's decision that difficulty (and content) shouldn't be shared\n    // across tiers. `cloze` is just the answer word (e.g. \"runs\"), not a\n    // full sentence \u2014 `sentence` already contains the ___ blank.\n    render(container, data, tier, onComplete) {\n      const { pick, mode, items } = data;\n      const session = biasedSelect(items, pick, it => it.word);\n      let idx = 0, score = 0, locked = false, selected = null;\n\n      function pips() {\n        return session.map((_, i) =>\n          `<div class=\"iv-pip${i<idx?' done':i===idx?' current':''}\"></div>`\n        ).join('');\n      }\n\n      function renderQuestion() {\n        locked = false; selected = null;\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n        container.innerHTML = `\n          <div class=\"iv-pips-row\" id=\"iv-pips\"></div>\n          <div id=\"iv-content\"></div>\n          <p class=\"iv-feedback\" id=\"iv-feedback\"></p>\n          <button id=\"iv-check-btn\" class=\"iv-action-btn\">Check \u2192</button>\n          <button id=\"iv-next-btn\" class=\"iv-proceed-btn\">Next \u2192</button>\n        `;\n        container.querySelector('#iv-pips').innerHTML = pips();\n\n        const content  = container.querySelector('#iv-content');\n        const checkBtn = container.querySelector('#iv-check-btn');\n        const nextBtn  = container.querySelector('#iv-next-btn');\n        const item = session[idx];\n        let spokenWord;\n\n        let hintUsed = false;\n        function addHintButton(onUse) {\n          const btn = document.createElement('button');\n          btn.className = 'precheck-hint-btn';\n          btn.textContent = '\ud83d\udca1 Hint';\n          btn.addEventListener('click', () => {\n            if (hintUsed) return;\n            hintUsed = true;\n            onUse();\n            btn.disabled = true;\n            btn.textContent = '\ud83d\udca1 Hint used';\n          }, { once: true });\n          content.insertAdjacentElement('afterbegin', btn);\n        }\n\n        if (mode === 'image-to-word') {\n          const pool = safeShuffle(items.filter(i => i.word !== item.word), () => false).slice(0, 2);\n          const opts = safeShuffle([item, ...pool], r => r[0].word === item.word);\n          content.innerHTML = `\n            <div class=\"iv-visual\"><div class=\"iv-emoji\">${item.emoji}</div><p class=\"iv-instruction\">Tap the correct word</p></div>\n            <div class=\"iv-options-grid\">${opts.map(o => `<button class=\"iv-option-btn\" data-val=\"${o.word}\" data-ans=\"${item.word}\">${o.word}</button>`).join('')}</div>\n          `;\n          spokenWord = item.word;\n          // No sentence context exists in this mode \u2014 elimination is the\n          // honest fit here, not a mismatched sentence-glow with nothing to point at.\n          addHintButton(() => {\n            const wrongBtns = [...content.querySelectorAll('.iv-option-btn')].filter(b => b.dataset.val !== item.word);\n            if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); wrongBtns[0].disabled = true; }\n          });\n        } else if (mode === 'word-to-image') {\n          const pool = safeShuffle(items.filter(i => i.emoji !== item.emoji), () => false).slice(0, 2);\n          const opts = safeShuffle([item, ...pool], r => r[0].emoji === item.emoji);\n          content.innerHTML = `\n            <div class=\"iv-visual\"><div class=\"iv-word\">${item.word}</div><p class=\"iv-instruction\">Tap the correct picture</p></div>\n            <div class=\"iv-options-grid\">${opts.map(o => `<button class=\"iv-option-btn emoji-opt\" data-val=\"${o.emoji}\" data-ans=\"${item.emoji}\">${o.emoji}</button>`).join('')}</div>\n          `;\n          spokenWord = item.word;\n          addHintButton(() => {\n            const wrongBtns = [...content.querySelectorAll('.iv-option-btn')].filter(b => b.dataset.val !== item.emoji);\n            if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); wrongBtns[0].disabled = true; }\n          });\n        } else {\n          // cloze-image: `sentence` already has ___, `cloze` is the answer word\n          const pool = safeShuffle(items.filter(i => i.cloze !== item.cloze), () => false).slice(0, 3);\n          const opts = safeShuffle([item, ...pool], r => r[0].cloze === item.cloze);\n          content.innerHTML = `\n            <div class=\"iv-visual\"><div class=\"iv-emoji\" style=\"font-size:9cqw;\">${item.emoji}</div></div>\n            <div class=\"iv-sentence\" id=\"iv-sentence-text\">${item.sentence.replace('___', '<span class=\"iv-blank\" id=\"iv-blank\">___</span>')}</div>\n            <div class=\"iv-options-grid\">${opts.map(o => `<button class=\"iv-option-btn\" data-val=\"${o.cloze}\" data-ans=\"${item.cloze}\">${o.clo
