<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Lesson Builder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font-family: inherit; }

:root {
  --bg:       #0f1117;
  --panel:    #171b24;
  --card:     #1e2330;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --text:     #e8eaf0;
  --dim:      rgba(232,234,240,0.45);
  --faint:    rgba(232,234,240,0.07);
  --coral:    #e8734a;
  --coral-d:  rgba(232,115,74,0.15);
  --sage:     #7ab89a;
  --sage-d:   rgba(122,184,154,0.13);
  --gold:     #c9a84c;
  --gold-d:   rgba(201,168,76,0.13);
  --purple:   #9b7fd4;
  --purple-d: rgba(155,127,212,0.13);
  --red:      #e05c5c;
  --red-d:    rgba(224,92,92,0.13);
  --radius:   10px;
  --pill:     999px;
}

body { background: var(--bg); color: var(--text); font-family: 'Inter',-apple-system,sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* ── Layout ── */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.main { flex: 1; padding: 28px; overflow-y: auto; max-width: 900px; }

/* ── Sidebar ── */
.sidebar-head { padding: 16px 14px 10px; border-bottom: 1px solid var(--border); }
.sidebar-title { font-size: 13px; font-weight: 700; color: var(--text); }
.sidebar-sub   { font-size: 10px; color: var(--dim); margin-top: 2px; }
.sidebar-section { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding: 12px 14px 4px; }
.obj-list { padding: 0 6px 6px; }
.obj-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.12s; margin-bottom: 2px; }
.obj-item:hover { background: var(--faint); }
.obj-item.active { background: var(--coral-d); border-left: 2px solid var(--coral); }
.obj-item-icon { font-size: 18px; flex-shrink: 0; }
.obj-item-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.obj-item-status { font-size: 9px; color: var(--dim); }
.sidebar-actions { padding: 8px; border-top: 1px solid var(--border); margin-top: auto; }
.btn-full { width: 100%; padding: 9px; border-radius: var(--radius); border: 1.5px solid var(--border2); background: transparent; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 6px; transition: background 0.12s; }
.btn-full:hover { background: var(--faint); }
.btn-full.coral { background: var(--coral-d); border-color: var(--coral); color: var(--coral); }
.btn-full.sage  { background: var(--sage-d);  border-color: var(--sage);  color: var(--sage);  }

/* ── Buttons ── */
.btn { padding: 8px 16px; border-radius: var(--radius); border: 1.5px solid var(--border2); background: transparent; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background 0.12s; }
.btn:hover   { background: var(--faint); }
.btn.coral   { border-color: var(--coral);  color: var(--coral);  background: var(--coral-d);  }
.btn.sage    { border-color: var(--sage);   color: var(--sage);   background: var(--sage-d);   }
.btn.purple  { border-color: var(--purple); color: var(--purple); background: var(--purple-d); }
.btn.gold    { border-color: var(--gold);   color: var(--gold);   background: var(--gold-d);   }
.btn.red     { border-color: var(--red);    color: var(--red);    background: var(--red-d);    }
.btn.sm      { padding: 5px 11px; font-size: 11px; }
.btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

/* ── Config section ── */
.config-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.config-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.config-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.config-row { display: flex; gap: 8px; align-items: center; }
.config-row label { font-size: 11px; color: var(--dim); width: 80px; flex-shrink: 0; }
.config-row input, .config-row select { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 12px; }
.config-row input:focus, .config-row select:focus { outline: none; border-color: var(--sage); }

/* ── Topbar ── */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.topbar-title { font-size: 17px; font-weight: 700; flex: 1; }
.topbar-obj   { font-size: 13px; color: var(--dim); }

/* ── Zone tabs ── */
.zone-tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
.zone-tab { padding: 7px 14px; border-radius: var(--pill); border: 1.5px solid var(--border2); background: transparent; color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s; white-space: nowrap; }
.zone-tab:hover { background: var(--faint); color: var(--text); }
.zone-tab.active { background: var(--coral-d); border-color: var(--coral); color: var(--coral); }
.zone-tab.filled { border-color: var(--sage); color: var(--sage); }
.zone-tab.active.filled { background: var(--coral-d); border-color: var(--coral); color: var(--coral); }

/* ── Zone page ── */
.zone-page { display: none; }
.zone-page.active { display: block; }
.zone-header { margin-bottom: 20px; }
.zone-label { font-size: 20px; font-weight: 700; color: var(--text); }
.zone-desc  { font-size: 13px; color: var(--dim); margin-top: 4px; }

/* ── Field groups ── */
.field-group { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.field-group-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; justify-content: space-between; }
.field-group-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: 0.04em; }
.field input, .field textarea, .field select { background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; color: var(--text); font-size: 13px; transition: border-color 0.12s; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--coral); }
.field textarea { resize: vertical; min-height: 64px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.field-note { font-size: 10px; color: var(--dim); font-style: italic; margin-top: 2px; }

/* ── Tile editor ── */
.tile-editor { display: flex; flex-direction: column; gap: 10px; }
.tile-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; padding: 8px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }
.tile-chip { display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 10px; border-radius: var(--pill); font-size: 12px; font-weight: 600; border: 1.5px solid var(--border2); background: var(--faint); color: var(--text); cursor: default; }
.tile-chip.preplaced { background: var(--sage-d); border-color: var(--sage); color: var(--sage); }
.tile-chip-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 0 0 2px; }
.tile-chip-del:hover { color: var(--red); }
.tile-chip-toggle { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 0 2px; }
.tile-chip-toggle:hover { color: var(--sage); }
.tile-add-row { display: flex; gap: 6px; }
.tile-add-row input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.tile-add-row input:focus { outline: none; border-color: var(--coral); }
.tile-hint { font-size: 11px; color: var(--dim); }

/* ── Hint editor ── */
.hint-list { display: flex; flex-direction: column; gap: 6px; }
.hint-row { display: flex; gap: 6px; align-items: center; }
.hint-row input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.hint-row input:focus { outline: none; border-color: var(--gold); }
.hint-num { font-size: 10px; font-weight: 700; color: var(--gold); width: 20px; flex-shrink: 0; text-align: center; }

/* ── Audio section ── */
.el-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.el-head    { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.el-head-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.el-audio-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.el-audio-row  { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }
.el-audio-label { flex: 1; font-size: 12px; color: var(--dim); }
.el-audio-text  { font-size: 13px; font-weight: 600; color: var(--text); font-family: monospace; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Asset browser ── */
.browser-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.browser-overlay.open { display: flex; }
.browser-panel { background: var(--panel); border-radius: 16px 16px 0 0; border-top: 1px solid var(--border2); width: 100%; max-width: 700px; max-height: 70vh; display: flex; flex-direction: column; }
.browser-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.browser-head-title { font-size: 14px; font-weight: 700; flex: 1; }
.browser-target { font-size: 11px; color: var(--coral); background: var(--coral-d); padding: 3px 8px; border-radius: var(--pill); }
.browser-toolbar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.browser-toolbar input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.browser-toolbar input:focus { outline: none; border-color: var(--sage); }
.browser-generate { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card); display: none; gap: 8px; align-items: center; }
.browser-generate.visible { display: flex; }
.browser-generate input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.browser-file-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
.browser-folder { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding: 10px 8px 4px; }
.browser-file { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
.browser-file:hover { background: var(--faint); }
.browser-file.selected { background: var(--sage-d); }
.browser-file-icon { font-size: 14px; flex-shrink: 0; color: var(--dim); }
.browser-file-name { font-size: 13px; flex: 1; color: var(--text); font-family: monospace; }
.browser-file-actions { display: flex; gap: 4px; }
.browser-empty { text-align: center; padding: 40px; color: var(--dim); font-size: 13px; }
.browser-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* ── Q&A list (zone 4a/4b) ── */
.qa-list { display: flex; flex-direction: column; gap: 6px; }
.qa-row { display: flex; gap: 8px; align-items: center; }
.qa-row input.qa-q { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.qa-row select { background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 8px; color: var(--text); font-size: 12px; width: 100px; }
.qa-row input:focus, .qa-row select:focus { outline: none; border-color: var(--coral); }

/* ── Zone 4c options ── */
.options-list { display: flex; flex-direction: column; gap: 6px; }
.option-row { display: flex; gap: 8px; align-items: center; }
.option-row input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; }
.option-row input:focus { outline: none; border-color: var(--coral); }
.option-correct-badge { font-size: 10px; font-weight: 700; color: var(--sage); background: var(--sage-d); padding: 2px 7px; border-radius: var(--pill); white-space: nowrap; }

/* ── Zone 5 frames ── */
.frames-list { display: flex; flex-direction: column; gap: 10px; }
.frame-row { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.frame-label { font-size: 10px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; }

/* ── Notebook prompt ── */
.notebook-block { background: rgba(201,168,76,0.06); border: 1px solid rgba(201,168,76,0.2); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.notebook-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
.notebook-block textarea { flex: 1; background: transparent; border: none; color: var(--gold); font-size: 13px; resize: none; min-height: 44px; }
.notebook-block textarea:focus { outline: none; }

/* ── Push modal ── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 300; }
.modal-bg.open { display: flex; }
.modal-box { background: var(--panel); border: 1px solid var(--border2); border-radius: 14px; width: 420px; max-width: 95vw; overflow: hidden; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-head-title { font-size: 14px; font-weight: 700; }
.modal-body { padding: 20px; }
.push-confirm-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.push-confirm-row span:last-child { font-weight: 600; color: var(--text); }
.push-progress { margin-top: 14px; display: none; }
.push-progress.visible { display: block; }
.push-progress-bar { height: 6px; background: var(--faint); border-radius: var(--pill); overflow: hidden; margin-bottom: 6px; }
.push-progress-fill { height: 100%; background: var(--sage); border-radius: var(--pill); transition: width 0.3s; width: 0%; }
.push-progress-label { font-size: 12px; color: var(--dim); text-align: center; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border2); border-radius: var(--pill); padding: 10px 20px; font-size: 13px; font-weight: 500; color: var(--text); z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 80px 24px; color: var(--dim); }
.empty-state-icon  { font-size: 48px; margin-bottom: 16px; }
.empty-state-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }

/* ── Stretch toggle ── */
.stretch-toggle { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.stretch-toggle label { font-size: 12px; color: var(--dim); }
.toggle-switch { position: relative; width: 36px; height: 20px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--faint); border-radius: var(--pill); cursor: pointer; transition: 0.2s; border: 1px solid var(--border2); }
.toggle-slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: var(--dim); border-radius: 50%; transition: 0.2s; }
.toggle-switch input:checked + .toggle-slider { background: var(--sage-d); border-color: var(--sage); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: var(--sage); }
</style>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Micro-Lesson Builder</div>
      <div class="sidebar-sub">Confidence Ladder</div>
    </div>

    <div class="sidebar-section">Objects</div>
    <div class="obj-list" id="obj-list"></div>

    <div class="sidebar-actions">
      <button class="btn-full" onclick="newObject()">＋ New object</button>
      <button class="btn-full" onclick="loadJSON()">📂 Load JSON</button>
      <button class="btn-full sage" onclick="openPushModal()">🚀 Push to GitHub</button>
      <button class="btn-full" onclick="exportJSON()">💾 Export JSON</button>
      <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="handleJSONLoad(this)">
    </div>

    <!-- Config -->
    <div style="padding:8px;border-top:1px solid var(--border);">
      <div class="config-section">
        <div class="config-head">ElevenLabs</div>
        <div class="config-body">
          <div class="config-row"><label>API Key</label><input type="password" id="el-key" placeholder="sk_..."></div>
          <div class="config-row"><label>Voice</label>
            <select id="el-voice">
              <option value="EXAVITQu4vr4xnSDxMaL">Sarah · American · F</option>
              <option value="XB0fDUnXU5powFXDhCwa">Charlotte · British · F</option>
              <option value="Xb7hH8MSUJpSbSDYk0k2">Alice · British · F</option>
              <option value="FGY2WhTYpPnrIDTdsKH5">Laura · American · F</option>
              <option value="nPczCjzI2devNBz1zQrb">Brian · American · M</option>
              <option value="JBFqnCBsd6RMkjVDRZzb">George · British · M</option>
            </select>
          </div>
          <div class="config-row"><label>Word spd</label><input type="number" id="el-speed-word" value="0.75" min="0.5" max="1.2" step="0.05" style="width:60px;flex:none;"></div>
          <div class="config-row"><label>Sent. spd</label><input type="number" id="el-speed-sent" value="0.85" min="0.5" max="1.2" step="0.05" style="width:60px;flex:none;"></div>
        </div>
      </div>
      <div class="config-section">
        <div class="config-head">GitHub</div>
        <div class="config-body">
          <div class="config-row"><label>PAT</label><input type="password" id="gh-pat" placeholder="github_pat_..."></div>
          <div class="config-row"><label>Repo</label><input type="text" id="gh-repo" value="redskin106/lesson-a"></div>
          <div class="config-row"><label>JSON path</label><input type="text" id="gh-path" value="micro-lesson/confidence-ladder-objects.json"></div>
          <div class="config-row"><label>Audio folder</label><input type="text" id="gh-audio-folder" value="micro-lesson/audio"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main" id="main-area">
    <div class="empty-state">
      <div class="empty-state-icon">🪜</div>
      <div class="empty-state-title">No object selected</div>
      <div style="font-size:13px;color:var(--dim);">Add an object or load a JSON to get started.</div>
    </div>
  </main>

</div>

<!-- ── Asset Browser ── -->
<div class="browser-overlay" id="browser-overlay">
  <div class="browser-panel">
    <div class="browser-head">
      <div class="browser-head-title">📁 Audio Assets</div>
      <div class="browser-target" id="browser-target-label">—</div>
      <button class="btn sm" onclick="closeBrowser()">✕</button>
    </div>
    <div class="browser-toolbar">
      <input type="text" id="browser-search" placeholder="Filter files…" oninput="filterBrowserFiles()">
      <button class="btn sm sage" onclick="fetchRepoAudio()">↺ Refresh</button>
      <button class="btn sm coral" onclick="toggleBrowserGenerate()">🎙 Generate new</button>
    </div>
    <div class="browser-generate" id="browser-generate">
      <input type="text" id="browser-gen-text" placeholder="Text to generate…">
      <button class="btn sm coral" onclick="generateAndSelect()">Generate</button>
    </div>
    <div class="browser-file-list" id="browser-file-list">
      <div class="browser-empty">Click ↺ Refresh to load audio files from GitHub.</div>
    </div>
    <div class="browser-foot">
      <button class="btn" onclick="closeBrowser()">Cancel</button>
      <button class="btn sage" id="browser-select-btn" onclick="confirmBrowserSelect()" disabled>Select</button>
    </div>
  </div>
</div>

<!-- ── Push Modal ── -->
<div class="modal-bg" id="push-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">🚀 Push to GitHub</span>
      <button class="btn sm" onclick="closePushModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="push-confirm-row"><span>Target file</span><span id="push-info-path">—</span></div>
      <div class="push-confirm-row"><span>Objects</span><span id="push-info-objects">—</span></div>
      <div class="push-confirm-row"><span>Audio slots filled</span><span id="push-info-audio">—</span></div>
      <div class="push-confirm-row"><span>To upload to GitHub</span><span id="push-info-upload">—</span></div>
      <div class="push-progress" id="push-progress">
        <div class="push-progress-bar"><div class="push-progress-fill" id="push-progress-fill"></div></div>
        <div class="push-progress-label" id="push-progress-label">Preparing…</div>
      </div>
    </div>
    <div class="modal-foot" id="push-confirm-actions">
      <button class="btn" onclick="closePushModal()">Cancel</button>
      <button class="btn sage" onclick="confirmPush()">Push</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// DATA MODEL
// ─────────────────────────────────────────────

// lesson = { objects: [ objectData, ... ] }
// objectData = { id, name, emoji, zones: { z0, z1, z2, z3, z3b, z4a, z4b, z4c, z5, z6 } }

let lesson = { objects: [] };
let currentObjId  = null;
let currentZone   = 'z0';
let audioBlobs    = {}; // key: `${objId}_${zoneKey}_${slotKey}` → dataUrl

// Browser state
let browserTargetCallback = null;
let browserTargetLabel    = '';
let browserSelectedFile   = null;
let browserAllFiles       = [];

// ─────────────────────────────────────────────
// BLANK OBJECT TEMPLATE
// ─────────────────────────────────────────────

function blankObject(name, emoji) {
  return {
    id: 'obj_' + Date.now(),
    name: name || 'New Object',
    emoji: emoji || '📦',
    zones: {
      z0:  { object_name:'', image_url:'', audio_word:'', notebook_prompt:'' },
      z1:  { model_sentence:'', model_audio:'', build_tiles:[], build_preplaced:[], fixit_broken:'', fixit_prompt:'', fixit_hints:['','','',''], fixit_correct:'', stretch_on:false, stretch_sentence:'', stretch_tiles:[], notebook_prompt:'', video_url:'' },
      z2:  { model_sentence:'', model_audio:'', build_tiles:[], build_preplaced:[], fixit_broken:'', fixit_prompt:'', fixit_hints:['','','',''], fixit_correct:'', stretch_on:false, stretch_sentence:'', stretch_tiles:[], notebook_prompt:'', video_url:'' },
      z3:  { model_sentence:'', model_audio:'', build_tiles:[], build_preplaced:[], fixit_broken:'', fixit_prompt:'', fixit_hints:['','','',''], fixit_correct:'', stretch_on:false, stretch_sentence:'', stretch_tiles:[], notebook_prompt:'', video_url:'' },
      z3b: { model_sentence:'', model_audio:'', build_tiles:[], build_preplaced:[], fixit_broken:'', fixit_prompt:'', fixit_hints:['','','',''], fixit_correct:'', stretch_on:false, stretch_sentence:'', stretch_tiles:[], notebook_prompt:'', video_url:'' },
      z4a: { questions:[], build_sentence:'', build_tiles:[], build_hints:['','',''], stretch_chain:'', notebook_prompt:'' },
      z4b: { questions:[], build_sentence:'', build_tiles:[], build_hints:['','',''], stretch_chain:'', notebook_prompt:'' },
      z4c: { scenario_text:'', scenario_image:'', video_url:'', transactional_options:['','',''], transactional_correct:0, repair_options:['','',''], notebook_prompt:'' },
      z5:  { frames:[] },
      z6:  { reveal_audio:'', notebook_prompt:'' }
    }
  };
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────

let toastTimer;
function toast(msg, dur=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─────────────────────────────────────────────
// OBJECT LIST
// ─────────────────────────────────────────────

function renderSidebar() {
  const list = document.getElementById('obj-list');
  if (!lesson.objects.length) { list.innerHTML = '<div style="padding:10px 14px;font-size:12px;color:var(--dim);">No objects yet</div>'; return; }
  list.innerHTML = lesson.objects.map(o => `
    <div class="obj-item ${o.id === currentObjId ? 'active' : ''}" onclick="selectObject('${o.id}')">
      <span class="obj-item-icon">${o.emoji||'📦'}</span>
      <span class="obj-item-name">${esc(o.name)}</span>
    </div>`).join('');
}

function selectObject(id) {
  saveCurrentZone();
  currentObjId = id;
  currentZone  = 'z0';
  renderSidebar();
  renderMain();
}

function newObject() {
  const name = prompt('Object name (e.g. Bag):');
  if (!name) return;
  const emoji = prompt('Emoji (e.g. 🎒):') || '📦';
  const obj = blankObject(name.trim(), emoji.trim());
  lesson.objects.push(obj);
  selectObject(obj.id);
}

// ─────────────────────────────────────────────
// ZONE DEFINITIONS
// ─────────────────────────────────────────────

const ZONES = [
  { key:'z0',  label:'Zone 0',  tab:'0 · Meet it' },
  { key:'z1',  label:'Zone 1',  tab:'1 · What is it?' },
  { key:'z2',  label:'Zone 2',  tab:'2 · What does it look like?' },
  { key:'z3',  label:'Zone 3',  tab:'3 · What makes it special?' },
  { key:'z3b', label:'Zone 3b', tab:'3b · How does it feel?' },
  { key:'z4a', label:'Zone 4a', tab:'4a · Physical questions' },
  { key:'z4b', label:'Zone 4b', tab:'4b · Behaviour questions' },
  { key:'z4c', label:'Zone 4c', tab:'4c · Real world survival' },
  { key:'z5',  label:'Zone 5',  tab:'5 · Comparison (stretch)' },
  { key:'z6',  label:'Zone 6',  tab:'6 · The reveal' },
];

// ─────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────

function renderMain() {
  const obj = lesson.objects.find(o => o.id === currentObjId);
  if (!obj) { document.getElementById('main-area').innerHTML = `<div class="empty-state"><div class="empty-state-icon">🪜</div><div class="empty-state-title">No object selected</div></div>`; return; }

  const tabs = ZONES.map(z => `<button class="zone-tab ${z.key===currentZone?'active':''}" onclick="switchZone('${z.key}')">${esc(z.tab)}</button>`).join('');

  document.getElementById('main-area').innerHTML = `
    <div class="topbar">
      <div class="topbar-title">${obj.emoji} ${esc(obj.name)}</div>
      <button class="btn sm" onclick="renameObject('${obj.id}')">✎ Rename</button>
      <button class="btn sm red" onclick="deleteObject('${obj.id}')">🗑 Delete</button>
    </div>
    <div class="zone-tabs">${tabs}</div>
    <div id="zone-editor"></div>
  `;
  renderZone(obj);
}

function switchZone(zKey) {
  saveCurrentZone();
  currentZone = zKey;
  renderMain();
}

// ─────────────────────────────────────────────
// ZONE RENDERERS
// ─────────────────────────────────────────────

function renderZone(obj) {
  const z = obj.zones[currentZone];
  const el = document.getElementById('zone-editor');
  if (!el) return;

  switch(currentZone) {
    case 'z0':  el.innerHTML = renderZ0(obj, z);  break;
    case 'z1':
    case 'z2':
    case 'z3':
    case 'z3b': el.innerHTML = renderZStandard(obj, z, currentZone); break;
    case 'z4a':
    case 'z4b': el.innerHTML = renderZ4ab(obj, z, currentZone); break;
    case 'z4c': el.innerHTML = renderZ4c(obj, z); break;
    case 'z5':  el.innerHTML = renderZ5(obj, z);  break;
    case 'z6':  el.innerHTML = renderZ6(obj, z);  break;
  }
}

// ── Zone 0 ──
function renderZ0(obj, z) {
  return `
  <div class="zone-header">
    <div class="zone-label">Zone 0 — Meet it</div>
    <div class="zone-desc">First contact. Student sees the object image, hears the word, writes it.</div>
  </div>
  <div class="field-group">
    <div class="field-group-head">Object</div>
    <div class="field-group-body">
      <div class="field-row">
        <div class="field"><label>Object name</label><input type="text" id="f_object_name" value="${esc(z.object_name)}" placeholder="bag"></div>
        <div class="field"><label>Emoji</label><input type="text" id="f_emoji" value="${esc(obj.emoji)}" placeholder="🎒" style="width:80px;flex:none;"></div>
      </div>
      <div class="field"><label>Image URL</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="f_image_url" value="${esc(z.image_url)}" placeholder="https://raw.githubusercontent.com/…" style="flex:1;">
          <button class="btn sm" onclick="openBrowser('z0','image_url','Image')">📁 Browse</button>
        </div>
      </div>
    </div>
  </div>
  ${renderAudioSlots(obj, 'z0', [{ key:'audio_word', label:'Word audio', text: z.object_name||'(word)' }])}
  ${renderNotebook('z0', z.notebook_prompt)}
  `;
}

// ── Zone 1 / 2 / 3 / 3b (standard structure) ──
function renderZStandard(obj, z, zKey) {
  const meta = {
    z1:  { label:'Zone 1 — What is it?',         desc:'Basic identification. It\'s a ___.' },
    z2:  { label:'Zone 2 — What does it look like?', desc:'Colour, size, shape description.' },
    z3:  { label:'Zone 3 — What makes it special?',  desc:'Feature or detail. It has a ___.' },
    z3b: { label:'Zone 3b — How does it make you feel?', desc:'Impression + reason. It looks ___ because ___.' },
  }[zKey];

  return `
  <div class="zone-header">
    <div class="zone-label">${meta.label}</div>
    <div class="zone-desc">${meta.desc}</div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Model sentence</div>
    <div class="field-group-body">
      <div class="field"><label>Sentence</label><input type="text" id="f_model_sentence" value="${esc(z.model_sentence)}" placeholder="It's a bag."></div>
      <div class="field"><label>Video URL (optional)</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="f_video_url" value="${esc(z.video_url||'')}" placeholder="https://youtube.com/…" style="flex:1;">
        </div>
      </div>
    </div>
  </div>

  ${renderAudioSlots(obj, zKey, [{ key:'model_audio', label:'Model sentence audio', text: z.model_sentence||'(sentence)' }])}

  <div class="field-group">
    <div class="field-group-head">Build-it exercise</div>
    <div class="field-group-body">
      ${renderTileEditor(zKey, 'build_tiles', z.build_tiles, z.build_preplaced, 'Tiles (click ⊙ to mark as pre-placed)')}
    </div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Fix-it exercise</div>
    <div class="field-group-body">
      <div class="field"><label>Broken sentence</label><input type="text" id="f_fixit_broken" value="${esc(z.fixit_broken)}" placeholder="The wrong version…"></div>
      <div class="field"><label>Prompt to student</label><input type="text" id="f_fixit_prompt" value="${esc(z.fixit_prompt)}" placeholder="Look at the image. Is this correct?"></div>
      <div class="field"><label>Correct answer</label><input type="text" id="f_fixit_correct" value="${esc(z.fixit_correct)}" placeholder="The correct sentence"></div>
      <div class="field"><label>Hint sequence</label>${renderHints(zKey, z.fixit_hints)}</div>
    </div>
  </div>

  <div class="field-group">
    <div class="field-group-head">
      Stretch
      <label class="toggle-switch"><input type="checkbox" id="f_stretch_on" ${z.stretch_on?'checked':''} onchange="toggleStretch('${zKey}',this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div class="field-group-body" id="stretch-body" style="${z.stretch_on?'':'opacity:0.4;pointer-events:none;'}">
      <div class="field"><label>Stretch sentence</label><input type="text" id="f_stretch_sentence" value="${esc(z.stretch_sentence)}" placeholder="More complex version…"></div>
      ${renderTileEditor(zKey, 'stretch_tiles', z.stretch_tiles, [], 'Stretch tiles')}
    </div>
  </div>

  ${renderNotebook(zKey, z.notebook_prompt)}
  `;
}

// ── Zone 4a / 4b ──
function renderZ4ab(obj, z, zKey) {
  const meta = {
    z4a: { label:'Zone 4a — Physical questions', desc:'Is it ___? Yes/No with silhouette reveal.' },
    z4b: { label:'Zone 4b — Behaviour questions', desc:'Does it ___? Can it ___? Do you ___?' },
  }[zKey];

  const qs = (z.questions||[]);

  return `
  <div class="zone-header">
    <div class="zone-label">${meta.label}</div>
    <div class="zone-desc">${meta.desc}</div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Questions <button class="btn sm" onclick="addQuestion('${zKey}')">＋ Add</button></div>
    <div class="field-group-body">
      <div class="qa-list" id="qa-list-${zKey}">
        ${qs.map((q,i) => `
          <div class="qa-row">
            <input class="qa-q" type="text" value="${esc(q.question)}" placeholder="Is it big?" oninput="updateQuestion('${zKey}',${i},'question',this.value)">
            <select onchange="updateQuestion('${zKey}',${i},'answer',this.value)">
              <option value="yes" ${q.answer==='yes'?'selected':''}>Yes</option>
              <option value="no"  ${q.answer==='no'?'selected':''}>No</option>
              <option value="custom" ${q.answer!=='yes'&&q.answer!=='no'?'selected':''}>Custom</option>
            </select>
            ${q.answer!=='yes'&&q.answer!=='no' ? `<input type="text" value="${esc(q.answer)}" placeholder="No, it's light" oninput="updateQuestion('${zKey}',${i},'answer',this.value)" style="width:140px;">` : ''}
            <button class="btn sm red" onclick="removeQuestion('${zKey}',${i})">✕</button>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Build-it exercise</div>
    <div class="field-group-body">
      <div class="field"><label>Sentence to build</label><input type="text" id="f_build_sentence" value="${esc(z.build_sentence)}" placeholder="Is it big?"></div>
      ${renderTileEditor(zKey, 'build_tiles', z.build_tiles, [], 'Tiles')}
      <div class="field"><label>Hints</label>${renderHints(zKey, z.build_hints||['','',''])}</div>
      <div class="field"><label>Stretch chain (optional)</label><input type="text" id="f_stretch_chain" value="${esc(z.stretch_chain||'')}" placeholder="Is it big? Is it heavy?"></div>
    </div>
  </div>

  ${renderNotebook(zKey, z.notebook_prompt)}
  `;
}

// ── Zone 4c ──
function renderZ4c(obj, z) {
  return `
  <div class="zone-header">
    <div class="zone-label">Zone 4c — Real world survival</div>
    <div class="zone-desc">Transactional language, repair strategies, real scenarios.</div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Scenario</div>
    <div class="field-group-body">
      <div class="field"><label>Scenario text</label><textarea id="f_scenario_text" placeholder="You are in a shop. You want this bag. You don't understand the price.">${esc(z.scenario_text)}</textarea></div>
      <div class="field"><label>Scenario image URL</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="f_scenario_image" value="${esc(z.scenario_image||'')}" placeholder="https://…" style="flex:1;">
        </div>
      </div>
      <div class="field"><label>Video URL (optional)</label><input type="text" id="f_video_url" value="${esc(z.video_url||'')}" placeholder="https://youtube.com/…"></div>
    </div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Task 1 — Transactional (one correct)</div>
    <div class="field-group-body">
      <div class="options-list">
        ${(z.transactional_options||['','','']).map((opt,i) => `
          <div class="option-row">
            <input type="text" value="${esc(opt)}" placeholder="Option ${i+1}" oninput="updateOption('transactional_options',${i},this.value)">
            <button class="btn sm ${z.transactional_correct===i?'sage':''}" onclick="setCorrect(${i})">${z.transactional_correct===i?'✓ Correct':'Mark correct'}</button>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="field-group">
    <div class="field-group-head">Task 2 — Repair strategies (all correct)</div>
    <div class="field-group-body">
      <div class="options-list">
        ${(z.repair_options||['','','']).map((opt,i) => `
          <div class="option-row">
            <input type="text" value="${esc(opt)}" placeholder="Repair strategy ${i+1}" oninput="updateRepair(${i},this.value)">
            <span class="option-correct-badge">✓ All correct</span>
          </div>`).join('')}
      </div>
    </div>
  </div>

  ${renderNotebook('z4c', z.notebook_prompt)}
  `;
}

// ── Zone 5 ──
function renderZ5(obj, z) {
  const frames = z.frames||[];
  return `
  <div class="zone-header">
    <div class="zone-label">Zone 5 — Comparison anchors</div>
    <div class="zone-desc">Stretch only. Unlocks silently after Zone 3b. "Can you say more?"</div>
  </div>
  <div class="field-group">
    <div class="field-group-head">Frames <button class="btn sm" onclick="addFrame()">＋ Add frame</button></div>
    <div class="field-group-body">
      <div class="frames-list" id="frames-list">
        ${frames.map((f,i) => `
          <div class="frame-row">
            <div class="frame-label">Frame ${i+1}</div>
            <div class="field"><label>Frame text</label><input type="text" value="${esc(f.frame)}" placeholder="It's like a ___." oninput="updateFrame(${i},'frame',this.value)"></div>
            <div class="field"><label>Example answer</label><input type="text" value="${esc(f.example)}" placeholder="It's like a suitcase." oninput="updateFrame(${i},'example',this.value)"></div>
            <div class="field-row">
              <div class="field"><label>Option A</label><input type="text" value="${esc(f.optionA||'')}" oninput="updateFrame(${i},'optionA',this.value)"></div>
              <div class="field"><label>Option B</label><input type="text" value="${esc(f.optionB||'')}" oninput="updateFrame(${i},'optionB',this.value)"></div>
            </div>
            <button class="btn sm red" onclick="removeFrame(${i})" style="align-self:flex-end;">Remove</button>
          </div>`).join('')}
        ${!frames.length ? '<div style="font-size:13px;color:var(--dim);">No frames yet. Add one above.</div>' : ''}
      </div>
    </div>
  </div>
  `;
}

// ── Zone 6 ──
function renderZ6(obj, z) {
  return `
  <div class="zone-header">
    <div class="zone-label">Zone 6 — The reveal</div>
    <div class="zone-desc">Pyramid appears tier by tier. Full description plays as audio. Image annotated.</div>
  </div>
  ${renderAudioSlots(obj, 'z6', [{ key:'reveal_audio', label:'Full description audio', text:'(full description)' }])}
  ${renderNotebook('z6', z.notebook_prompt)}
  `;
}

// ─────────────────────────────────────────────
// SHARED COMPONENTS
// ─────────────────────────────────────────────

function renderNotebook(zKey, value) {
  return `
  <div class="notebook-block">
    <div class="notebook-icon">📓</div>
    <textarea id="f_notebook_prompt" placeholder="Handwriting prompt for this zone transition…">${esc(value||'')}</textarea>
  </div>`;
}

function renderHints(zKey, hints) {
  const h = hints || ['','','',''];
  return `<div class="hint-list">
    ${h.map((hint,i) => `
      <div class="hint-row">
        <span class="hint-num">${i+1}</span>
        <input type="text" id="f_hint_${i}" value="${esc(hint)}" placeholder="Hint ${i+1}…">
      </div>`).join('')}
  </div>`;
}

function renderTileEditor(zKey, field, tiles, preplaced, label) {
  tiles    = tiles    || [];
  preplaced = preplaced || [];
  const chipHtml = tiles.map((t,i) => {
    const isPre = preplaced.includes(t);
    return `<span class="tile-chip ${isPre?'preplaced':''}" title="${isPre?'Pre-placed (click ⊙ to toggle)':'Tap ⊙ to mark as pre-placed'}">
      ${esc(t)}
      <button class="tile-chip-toggle" onclick="togglePreplaced('${zKey}','${field}','${esc(t)}')" title="${isPre?'Un-mark pre-placed':'Mark as pre-placed'}">⊙</button>
      <button class="tile-chip-del" onclick="removeTile('${zKey}','${field}',${i})">✕</button>
    </span>`;
  }).join('');

  return `
  <div class="field">
    <label>${esc(label)}</label>
    <div class="tile-list" id="tiles-${zKey}-${field}">${chipHtml||'<span style="font-size:12px;color:var(--dim);align-self:center;">No tiles yet</span>'}</div>
    <div class="tile-add-row" style="margin-top:6px;">
      <input type="text" id="tile-input-${zKey}-${field}" placeholder="Type word, press Enter or ＋" onkeydown="if(event.key==='Enter')addTile('${zKey}','${field}')">
      <button class="btn sm" onclick="addTile('${zKey}','${field}')">＋</button>
    </div>
    <div class="tile-hint">Green = pre-placed (given to student). Click ⊙ to toggle.</div>
  </div>`;
}

function renderAudioSlots(obj, zKey, slots) {
  const rows = slots.map(s => {
    const blobKey = `${obj.id}_${zKey}_${s.key}`;
    const zData   = obj.zones[zKey];
    const has     = !!(audioBlobs[blobKey] || (zData && zData[s.key]));
    return `
    <div class="el-audio-row">
      <span class="el-audio-label">${esc(s.label)}</span>
      <span class="el-audio-text">${esc(s.text)}</span>
      <button class="btn sm coral" onclick="generateAudioSlot('${obj.id}','${zKey}','${s.key}','${esc(s.text)}')">🎙 EL</button>
      <button class="btn sm" onclick="browseAudioForSlot('${obj.id}','${zKey}','${s.key}','${esc(s.label)}')">📁</button>
      <button class="btn sm sage" ${has?'':'disabled'} onclick="playSlot('${obj.id}','${zKey}','${s.key}')">▶</button>
      <button class="btn sm red"  ${has?'':'disabled'} onclick="clearSlot('${obj.id}','${zKey}','${s.key}')">✕</button>
    </div>`;
  }).join('');

  return `
  <div class="el-section" style="margin-bottom:16px;">
    <div class="el-head"><span class="el-head-title">🎙 Audio</span></div>
    <div class="el-audio-list">${rows}</div>
  </div>`;
}

// ─────────────────────────────────────────────
// TILE OPERATIONS
// ─────────────────────────────────────────────

function getObjZone() {
  const obj = lesson.objects.find(o => o.id === currentObjId);
  return obj ? obj.zones[currentZone] : null;
}

function addTile(zKey, field) {
  const input = document.getElementById(`tile-input-${zKey}-${field}`);
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const z = getObjZone();
  if (!z) return;
  if (!z[field]) z[field] = [];
  z[field].push(val);
  input.value = '';
  renderMain();
}

function removeTile(zKey, field, idx) {
  const z = getObjZone();
  if (!z || !z[field]) return;
  const removed = z[field][idx];
  z[field].splice(idx, 1);
  // Also remove from preplaced if present
  const preKey = field === 'build_tiles' ? 'build_preplaced' : 'stretch_preplaced';
  if (z[preKey]) z[preKey] = z[preKey].filter(t => t !== removed);
  renderMain();
}

function togglePreplaced(zKey, field, word) {
  const z = getObjZone();
  if (!z) return;
  const preKey = field === 'build_tiles' ? 'build_preplaced' : 'stretch_preplaced';
  if (!z[preKey]) z[preKey] = [];
  const idx = z[preKey].indexOf(word);
  if (idx > -1) z[preKey].splice(idx, 1);
  else z[preKey].push(word);
  renderMain();
}

function toggleStretch(zKey, on) {
  const z = getObjZone();
  if (!z) return;
  z.stretch_on = on;
  const body = document.getElementById('stretch-body');
  if (body) body.style = on ? '' : 'opacity:0.4;pointer-events:none;';
}

// ─────────────────────────────────────────────
// SAVE CURRENT ZONE FIELDS → DATA
// ─────────────────────────────────────────────

function saveCurrentZone() {
  const obj = lesson.objects.find(o => o.id === currentObjId);
  if (!obj) return;
  const z = obj.zones[currentZone];

  const read = id => { const el = document.getElementById(id); return el ? el.value : null; };

  switch(currentZone) {
    case 'z0':
      if (read('f_object_name') !== null) z.object_name = read('f_object_name');
      if (read('f_image_url')   !== null) z.image_url   = read('f_image_url');
      if (read('f_emoji')       !== null) obj.emoji      = read('f_emoji');
      if (read('f_notebook_prompt') !== null) z.notebook_prompt = read('f_notebook_prompt');
      break;

    case 'z1': case 'z2': case 'z3': case 'z3b':
      if (read('f_model_sentence')  !== null) z.model_sentence  = read('f_model_sentence');
      if (read('f_video_url')       !== null) z.video_url       = read('f_video_url');
      if (read('f_fixit_broken')    !== null) z.fixit_broken    = read('f_fixit_broken');
      if (read('f_fixit_prompt')    !== null) z.fixit_prompt    = read('f_fixit_prompt');
      if (read('f_fixit_correct')   !== null) z.fixit_correct   = read('f_fixit_correct');
      if (read('f_stretch_sentence')!== null) z.stretch_sentence= read('f_stretch_sentence');
      if (read('f_notebook_prompt') !== null) z.notebook_prompt = read('f_notebook_prompt');
      z.fixit_hints = [0,1,2,3].map(i => read(`f_hint_${i}`) || '');
      break;

    case 'z4a': case 'z4b':
      if (read('f_build_sentence')  !== null) z.build_sentence  = read('f_build_sentence');
      if (read('f_stretch_chain')   !== null) z.stretch_chain   = read('f_stretch_chain');
      if (read('f_notebook_prompt') !== null) z.notebook_prompt = read('f_notebook_prompt');
      z.build_hints = [0,1,2].map(i => read(`f_hint_${i}`) || '');
      break;

    case 'z4c':
      if (read('f_scenario_text')   !== null) z.scenario_text   = read('f_scenario_text');
      if (read('f_scenario_image')  !== null) z.scenario_image  = read('f_scenario_image');
      if (read('f_video_url')       !== null) z.video_url       = read('f_video_url');
      if (read('f_notebook_prompt') !== null) z.notebook_prompt = read('f_notebook_prompt');
      break;

    case 'z6':
      if (read('f_notebook_prompt') !== null) z.notebook_prompt = read('f_notebook_prompt');
      break;
  }

  // Sync object name from z0
  if (currentZone === 'z0' && z.object_name) obj.name = z.object_name;
}

// ─────────────────────────────────────────────
// AUDIO — ElevenLabs (from V5)
// ─────────────────────────────────────────────

async function elTTS(text, isWord) {
  const key     = document.getElementById('el-key').value.trim();
  if (!key) { toast('⚠️ Enter ElevenLabs API key first'); return null; }
  const voiceId = document.getElementById('el-voice').value;
  const speed   = isWord
    ? parseFloat(document.getElementById('el-speed-word').value)
    : parseFloat(document.getElementById('el-speed-sent').value);
  const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: 'POST',
    headers: { 'xi-api-key': key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, model_id:'eleven_multilingual_v2', voice_settings:{ stability:0.75, similarity_boost:0.90, speed } })
  });
  if (!resp.ok) { toast('❌ ElevenLabs error: ' + resp.status); return null; }
  return resp.blob();
}

async function generateAudioSlot(objId, zKey, slotKey, text) {
  if (!text || text === '(word)' || text === '(sentence)' || text === '(full description)') {
    toast('⚠️ Enter text first'); return;
  }
  toast(`🎙 Generating "${text}"…`);
  const isWord = slotKey.includes('word') || slotKey === 'audio_word';
  const blob = await elTTS(text, isWord);
  if (!blob) return;
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const blobKey = `${objId}_${zKey}_${slotKey}`;
    audioBlobs[blobKey] = dataUrl;
    const obj = lesson.objects.find(o => o.id === objId);
    if (obj && obj.zones[zKey]) obj.zones[zKey][slotKey] = dataUrl;
    renderMain();
    toast(`✅ Audio ready`);
  };
  reader.readAsDataURL(blob);
}

function playSlot(objId, zKey, slotKey) {
  const blobKey = `${objId}_${zKey}_${slotKey}`;
  const src = audioBlobs[blobKey];
  const obj = lesson.objects.find(o => o.id === objId);
  const stored = obj && obj.zones[zKey] ? obj.zones[zKey][slotKey] : null;
  const audio = src || stored;
  if (audio) new Audio(audio).play();
  else toast('No audio loaded');
}

function clearSlot(objId, zKey, slotKey) {
  const blobKey = `${objId}_${zKey}_${slotKey}`;
  delete audioBlobs[blobKey];
  const obj = lesson.objects.find(o => o.id === objId);
  if (obj && obj.zones[zKey]) obj.zones[zKey][slotKey] = '';
  renderMain();
}

// ─────────────────────────────────────────────
// AUDIO — Asset Browser
// ─────────────────────────────────────────────

function browseAudioForSlot(objId, zKey, slotKey, label) {
  browserTargetCallback = (url) => {
    const blobKey = `${objId}_${zKey}_${slotKey}`;
    const obj = lesson.objects.find(o => o.id === objId);
    if (obj && obj.zones[zKey]) obj.zones[zKey][slotKey] = url;
    audioBlobs[blobKey] = url;
    renderMain();
    toast(`✅ Linked: ${url.split('/').pop()}`);
  };
  browserTargetLabel = label;
  browserSelectedFile = null;
  document.getElementById('browser-target-label').textContent = label;
  document.getElementById('browser-select-btn').disabled = true;
  document.getElementById('browser-overlay').classList.add('open');
  document.getElementById('browser-search').value = '';
  filterBrowserFiles();
}

function openBrowser(zKey, field, label) {
  // For image/non-audio fields — simplified: just sets a URL
  browserTargetCallback = null; // handled differently
  toast('Use a direct URL for images for now.');
}

function closeBrowser() {
  document.getElementById('browser-overlay').classList.remove('open');
  document.getElementById('browser-generate').classList.remove('visible');
  browserTargetCallback = null;
}

function toggleBrowserGenerate() {
  const el = document.getElementById('browser-generate');
  el.classList.toggle('visible');
}

async function fetchRepoAudio() {
  const pat  = document.getElementById('gh-pat').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const folder = (document.getElementById('gh-audio-folder').value || 'micro-lesson/audio').trim();
  if (!pat || !repo) { toast('⚠️ Enter GitHub PAT and repo first'); return; }

  const listEl = document.getElementById('browser-file-list');
  listEl.innerHTML = '<div class="browser-empty">Loading…</div>';

  try {
    const resp = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}`, {
      headers: { Authorization: `token ${pat}` }
    });
    if (!resp.ok) { listEl.innerHTML = '<div class="browser-empty">Folder not found or empty.</div>'; return; }
    const files = await resp.json();
    browserAllFiles = files.filter(f => f.name.endsWith('.mp3') || f.name.endsWith('.wav') || f.name.endsWith('.ogg'));
    filterBrowserFiles();
  } catch(e) {
    listEl.innerHTML = `<div class="browser-empty">Error: ${e.message}</div>`;
  }
}

function filterBrowserFiles() {
  const q = (document.getElementById('browser-search').value || '').toLowerCase();
  const files = browserAllFiles.filter(f => !q || f.name.toLowerCase().includes(q));
  const listEl = document.getElementById('browser-file-list');

  if (!browserAllFiles.length) {
    listEl.innerHTML = '<div class="browser-empty">Click ↺ Refresh to load audio files from GitHub.</div>';
    return;
  }
  if (!files.length) {
    listEl.innerHTML = '<div class="browser-empty">No matches.</div>';
    return;
  }

  listEl.innerHTML = files.map(f => `
    <div class="browser-file ${browserSelectedFile===f.download_url?'selected':''}" onclick="selectBrowserFile('${f.download_url}','${esc(f.name)}')">
      <span class="browser-file-icon">🎵</span>
      <span class="browser-file-name">${esc(f.name)}</span>
      <div class="browser-file-actions">
        <button class="btn sm" onclick="previewBrowserFile(event,'${f.download_url}')">▶</button>
      </div>
    </div>`).join('');
}

function selectBrowserFile(url, name) {
  browserSelectedFile = url;
  document.getElementById('browser-select-btn').disabled = false;
  filterBrowserFiles();
}

function previewBrowserFile(event, url) {
  event.stopPropagation();
  new Audio(url).play();
}

function confirmBrowserSelect() {
  if (!browserSelectedFile || !browserTargetCallback) return;
  browserTargetCallback(browserSelectedFile);
  closeBrowser();
}

async function generateAndSelect() {
  const text = document.getElementById('browser-gen-text').value.trim();
  if (!text) { toast('Enter text to generate'); return; }

  const pat    = document.getElementById('gh-pat').value.trim();
  const repo   = document.getElementById('gh-repo').value.trim();
  const folder = (document.getElementById('gh-audio-folder').value || 'micro-lesson/audio').trim();
  if (!pat || !repo) { toast('⚠️ Set GitHub PAT and repo first'); return; }

  toast('🎙 Generating…');
  const isWord = text.split(' ').length === 1;
  const blob = await elTTS(text, isWord);
  if (!blob) return;

  const slug = text.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const reader = new FileReader();
  reader.onload = async e => {
    const dataUrl = e.target.result;
    try {
      const rawUrl = await uploadAudioToGitHub(pat, repo, folder, slug, dataUrl);
      toast('✅ Generated and uploaded');
      // Refresh browser list
      await fetchRepoAudio();
      // Auto-select
      browserSelectedFile = rawUrl;
      document.getElementById('browser-select-btn').disabled = false;
      filterBrowserFiles();
    } catch(err) {
      toast('❌ Upload failed: ' + err.message);
    }
  };
  reader.readAsDataURL(blob);
}

// ─────────────────────────────────────────────
// GITHUB PUSH (from V5)
// ─────────────────────────────────────────────

async function uploadAudioToGitHub(pat, repo, folder, slug, dataUrl) {
  const b64    = dataUrl.split(',')[1];
  const ghPath = `${folder}/${slug}.mp3`;
  let sha = '';
  try {
    const check = await fetch(`https://api.github.com/repos/${repo}/contents/${ghPath}`, { headers: { Authorization: `token ${pat}` } });
    if (check.ok) { const d = await check.json(); sha = d.sha || ''; }
  } catch(_) {}
  const body = { message: `audio: add ${slug}.mp3`, content: b64 };
  if (sha) body.sha = sha;
  const resp = await fetch(`https://api.github.com/repos/${repo}/contents/${ghPath}`, {
    method: 'PUT',
    headers: { Authorization: `token ${pat}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`Upload failed for ${slug}: ${resp.status}`);
  return `https://raw.githubusercontent.com/${repo}/main/${ghPath}`;
}

function openPushModal() {
  saveCurrentZone();
  const path = document.getElementById('gh-path').value.trim();

  // Count audio
  let filled = 0, total = 0, toUpload = 0;
  lesson.objects.forEach(obj => {
    const audioKeys = ['audio_word','model_audio','reveal_audio'];
    audioKeys.forEach(k => {
      ZONES.forEach(zd => {
        const zData = obj.zones[zd.key];
        if (!zData) return;
        if (k in zData) {
          total++;
          const val = audioBlobs[`${obj.id}_${zd.key}_${k}`] || zData[k] || '';
          if (val) { filled++; if (val.startsWith('data:')) toUpload++; }
        }
      });
    });
  });

  document.getElementById('push-info-path').textContent    = path||'—';
  document.getElementById('push-info-objects').textContent  = lesson.objects.length;
  document.getElementById('push-info-audio').textContent   = `${filled} / ${total}`;
  document.getElementById('push-info-upload').textContent  = toUpload ? `${toUpload} clips` : '—';
  document.getElementById('push-progress').classList.remove('visible');
  document.getElementById('push-confirm-actions').style.display = 'flex';
  document.getElementById('push-modal').classList.add('open');
}

function closePushModal() {
  document.getElementById('push-modal').classList.remove('open');
}

function setPushProgress(pct, label) {
  document.getElementById('push-progress-fill').style.width  = pct + '%';
  document.getElementById('push-progress-label').textContent = label;
}

async function confirmPush() {
  const pat     = document.getElementById('gh-pat').value.trim();
  const repo    = document.getElementById('gh-repo').value.trim();
  const path    = document.getElementById('gh-path').value.trim();
  const aFolder = (document.getElementById('gh-audio-folder').value || 'micro-lesson/audio').trim();
  if (!pat||!repo||!path) { toast('Fill in GitHub fields first'); return; }

  document.getElementById('push-confirm-actions').style.display = 'none';
  document.getElementById('push-progress').classList.add('visible');

  // Step 1 — upload pending audio
  const audioJobs = [];
  lesson.objects.forEach(obj => {
    ZONES.forEach(zd => {
      const zData = obj.zones[zd.key];
      if (!zData) return;
      Object.keys(zData).forEach(k => {
        if (!k.includes('audio') && !k.includes('Audio')) return;
        const blobKey = `${obj.id}_${zd.key}_${k}`;
        const val = audioBlobs[blobKey] || zData[k] || '';
        if (val.startsWith('data:')) {
          const slug = `${obj.name}_${zd.key}_${k}`.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
          audioJobs.push({ obj, zKey:zd.key, k, slug, dataUrl:val });
        }
      });
    });
  });

  if (audioJobs.length) {
    setPushProgress(10, `Uploading ${audioJobs.length} audio file(s)…`);
    let done = 0;
    for (const job of audioJobs) {
      try {
        const rawUrl = await uploadAudioToGitHub(pat, repo, aFolder, job.slug, job.dataUrl);
        job.obj.zones[job.zKey][job.k] = rawUrl;
        audioBlobs[`${job.obj.id}_${job.zKey}_${job.k}`] = rawUrl;
        done++;
        setPushProgress(10 + Math.round(done / audioJobs.length * 30), `Uploaded ${done} / ${audioJobs.length}…`);
      } catch(e) { toast('⚠️ ' + e.message); }
    }
  }

  // Step 2 — fetch sha
  setPushProgress(45, 'Fetching JSON from GitHub…');
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers:{ Authorization:'token '+pat } });
    if (r.ok) { const d = await r.json(); sha = d.sha||''; }
    else if (r.status !== 404) { toast('Could not fetch JSON: ' + r.status); closePushModal(); return; }
  } catch(e) { toast('Error: ' + e.message); closePushModal(); return; }

  // Step 3 — build and push JSON
  setPushProgress(65, 'Building JSON…');
  const json = JSON.stringify(lesson, null, 2);
  const b64  = btoa(unescape(encodeURIComponent(json)));

  setPushProgress(80, 'Pushing to GitHub…');
  const body = { message:'micro-lesson: update confidence ladder data', content:b64 };
  if (sha) body.sha = sha;

  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: { Authorization:'token '+pat, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) { toast('❌ Push failed: ' + r.status); closePushModal(); return; }
  } catch(e) { toast('❌ ' + e.message); closePushModal(); return; }

  setPushProgress(100, '✅ Done!');
  setTimeout(() => { closePushModal(); toast('✅ Pushed to GitHub'); }, 800);
}

// ─────────────────────────────────────────────
// LOAD / EXPORT JSON
// ─────────────────────────────────────────────

function loadJSON() {
  document.getElementById('json-file-input').click();
}

function handleJSONLoad(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      lesson = data;
      currentObjId = lesson.objects.length ? lesson.objects[0].id : null;
      currentZone  = 'z0';
      renderSidebar();
      renderMain();
      toast('✅ JSON loaded');
    } catch(err) {
      toast('❌ Invalid JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function exportJSON() {
  saveCurrentZone();
  const json = JSON.stringify(lesson, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'confidence-ladder-objects.json'; a.click();
  URL.revokeObjectURL(url);
  toast('✅ JSON exported');
}

// ─────────────────────────────────────────────
// OBJECT MANAGEMENT
// ─────────────────────────────────────────────

function renameObject(id) {
  const obj = lesson.objects.find(o => o.id === id);
  if (!obj) return;
  const name = prompt('New name:', obj.name);
  if (!name) return;
  obj.name = name.trim();
  if (obj.zones.z0) obj.zones.z0.object_name = obj.name;
  renderSidebar(); renderMain();
}

function deleteObject(id) {
  if (!confirm('Delete this object? This cannot be undone.')) return;
  lesson.objects = lesson.objects.filter(o => o.id !== id);
  currentObjId = lesson.objects.length ? lesson.objects[0].id : null;
  renderSidebar(); renderMain();
}

renderSidebar();
renderMain();
