  // ─────────────────────────────────────────────
  //  WORD MATCH
  //  Tap a word on the left, then its match on the right.
  //  Each matched pair gets a distinct colour from PALETTE.
  //  Wrong → both flash red, deselect.
  //  Score: 1.0 minus 0.1 per wrong attempt (floor 0.6).
  // ─────────────────────────────────────────────
  // ─────────────────────────────────────────────
  //  WORD MATCH
  //  v2 design: pool-based { pick, items: [{left,right}] }, separate pool
  //  per tier. Free re-pairing model (not lock-on-first-click) — tap a left,
  //  tap a right to assign it (unlinking any prior pairing on either side
  //  first), reassign as much as you want. Only checks correctness once
  //  every left has SOME right assigned; if not fully correct, shows
  //  "Not quite yet" and lets you keep adjusting rather than penalizing.
  //  Bronze-only nudge message on a wrong-but-complete-looking assignment.
  //  Always full score on completion — this module requires eventual full
  //  correctness to advance, not partial credit.
  // ─────────────────────────────────────────────
  'word-match': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const pairs = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      const total = pairs.length;
      const isBronze = (tier === 'bronze');

      const PALETTE = [
        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },
        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },
        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },
        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },
        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }
      ];
      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Match the words.</span><span id="wm-score">0 of ${total} paired</span>`;

      container.innerHTML = `
        <div class="wm-grid-v2">
          <div class="wm-col-v2" id="wm-left-col"></div>
          <div class="wm-col-v2" id="wm-right-col"></div>
        </div>
        <p class="wm-encourage-v2" id="wm-encourage"></p>
        <p class="wm-nudge-v2" id="wm-nudge"></p>
        <button id="wm-notquite-btn" class="wm-notquite-btn-v2" disabled>Not quite yet</button>
        <button id="wm-next-btn" class="iv-proceed-btn">Next →</button>
      `;

      const leftCol      = container.querySelector('#wm-left-col');
      const rightCol     = container.querySelector('#wm-right-col');
      const scoreLabel   = document.getElementById('wm-score');
      const encourageEl  = container.querySelector('#wm-encourage');
      const nudgeEl      = container.querySelector('#wm-nudge');
      const notQuiteBtn  = container.querySelector('#wm-notquite-btn');
      const nextBtn      = container.querySelector('#wm-next-btn');

      let pairings = new Map();   // leftIdx -> rightIdx
      let rightUsed = new Map();  // rightIdx -> leftIdx
      let selectedLeftBtn = null;
      let confirmed = false;

      function styleLeft(btn) {
        if (confirmed) return;
        const idx = parseInt(btn.dataset.pairIdx);
        const c = pairColor[idx];
        const isSelected = (btn === selectedLeftBtn);
        const isPaired = pairings.has(idx);
        if (isSelected) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = `0 0 0 3px ${c.border}`;
        } else if (isPaired) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = '';
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';
        }
      }
      function styleRight(btn) {
        if (confirmed) return;
        const rightIdx = parseInt(btn.dataset.pairIdx);
        if (rightUsed.has(rightIdx)) {
          const c = pairColor[rightUsed.get(rightIdx)];
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)';
        }
      }
      function checkAllCorrect() {
        if (pairings.size !== total) return false;
        for (const leftIdx of pairings.keys()) {
          if (pairings.get(leftIdx) !== leftIdx) return false;
        }
        return true;
      }
      function refreshAll() {
        container.querySelectorAll('.wm-btn-v2[data-side="left"]').forEach(styleLeft);
        container.querySelectorAll('.wm-btn-v2[data-side="right"]').forEach(styleRight);

        let correctSoFar = 0, wrongSoFar = 0;
        pairings.forEach((rightIdx, leftIdx) => {
          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;
        });

        if (pairings.size === total) {
          if (checkAllCorrect()) {
            confirmed = true;
            scoreLabel.textContent = 'Good job!';
            scoreLabel.style.color = '#AED581';
            notQuiteBtn.style.display = 'none';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
            nextBtn.style.display = 'flex';
            nextBtn.onclick = () => onComplete(1);
          } else {
            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;
            scoreLabel.style.color = '';
            nextBtn.style.display = 'none';
            notQuiteBtn.style.display = 'flex';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
          }
        } else {
          scoreLabel.textContent = `${pairings.size} of ${total} paired`;
          scoreLabel.style.color = '';
          nextBtn.style.display = 'none';
          notQuiteBtn.style.display = 'none';

          // Bronze only: nudge the moment a wrong pairing exists, takes priority over encouragement
          if (isBronze && wrongSoFar > 0) {
            nudgeEl.textContent = 'Are you sure about that one?';
            nudgeEl.style.opacity = '1';
            encourageEl.style.opacity = '0';
          } else {
            nudgeEl.style.opacity = '0';
            if (correctSoFar > 0) {
              const ratio = correctSoFar / total;
              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'
                                       : ratio >= 0.34 ? 'Getting there!'
                                       : 'Nice, keep going!';
              encourageEl.style.opacity = '1';
            } else {
              encourageEl.style.opacity = '0';
            }
          }
        }
      }

      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));
      const leftItems = safeShuffle(withIdx, () => false);
      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));

      leftItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.left;
        btn.dataset.side = 'left';
        btn.dataset.pairIdx = pair.pairIdx;
        leftCol.appendChild(btn);
      });
      rightItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.right;
        btn.dataset.side = 'right';
        btn.dataset.pairIdx = pair.pairIdx;
        rightCol.appendChild(btn);
      });

      container.querySelectorAll('.wm-btn-v2').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirmed) return;

          if (btn.dataset.side === 'left') {
            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;
            refreshAll();
            return;
          }

          // Right button — always unlink any existing pairing first, then optionally re-pair
          const rightIdx = parseInt(btn.dataset.pairIdx);
          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;

          if (rightUsed.has(rightIdx)) {
            const prevLeftIdx = rightUsed.get(rightIdx);
            pairings.delete(prevLeftIdx);
            rightUsed.delete(rightIdx);
            if (leftIdx === null || leftIdx === prevLeftIdx) {
              selectedLeftBtn = null;
              refreshAll();
              return;
            }
          }
          if (leftIdx === null) { refreshAll(); return; }

          if (pairings.has(leftIdx)) {
            rightUsed.delete(pairings.get(leftIdx));
            pairings.delete(leftIdx);
          }
          pairings.set(leftIdx, rightIdx);
          rightUsed.set(rightIdx, leftIdx);
          selectedLeftBtn = null;
          refreshAll();
        });
      });
    }
  },

  // ─────────────────────────────────────────────
  //  SEQUENCING ("Put in Order")
  //  v2 design: pool-based { pick, items: [{prompt, sequence, correct}] },
  //  same standard as every other module. Each slot is colored by its
  //  POSITION (1st, 2nd, 3rd...) using the same 5-color PALETTE as
  //  gap-fill/word-match, not by which word occupies it — matches
  //  put-in-order-demo.html exactly (SEQ_PALETTE there).
  //  Items shown in pool. Tap to place into numbered slots.
  //  Tap a filled slot to return item to pool.
  //  Check button appears when all slots filled.
  //  Score per question: correct positions / total. Averaged across the
  //  `pick` questions drawn for the tier's session.
  // ─────────────────────────────────────────────
  'sequencing': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0, totalScore = 0;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)',  text:'#00BCD4' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)', text:'#CE93D8' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)',  text:'#FFB74D' },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)',  text:'#F48FB1' },
        { border:'#8BC34A', bg:'rgba(139,195,74,.15)', text:'#AED581' }
      ];

      function renderQuestion() {
        const { prompt, sequence, correct } = session[idx];
        const slots = new Array(correct.length).fill(null);
        let checked = false;

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <p class="seq-prompt-v2">${prompt}</p>
          <div class="seq-slots-v2" id="seq-slots"></div>
          <p class="seq-pool-label-v2">Tap to place ↓</p>
          <div class="seq-pool-v2" id="seq-pool"></div>
          <button id="gf-check-btn" class="gf-check-btn" style="display:none;">Check</button>
          <button id="seq-next-btn" class="iv-proceed-btn">Next →</button>
        `;

        const slotsEl  = container.querySelector('#seq-slots');
        const poolEl   = container.querySelector('#seq-pool');
        const checkBtn = container.querySelector('#gf-check-btn');
        const nextBtn  = container.querySelector('#seq-next-btn');

        function renderSlots() {
          slotsEl.innerHTML = '';
          slots.forEach((val, i) => {
            const c = PALETTE[i % PALETTE.length];
            const slot = document.createElement('div');
            slot.className = 'seq-slot-v2';
            const numColor = val ? c.border : 'rgba(255,255,255,0.3)';
            slot.innerHTML = `<div class="slot-num-v2" style="color:${numColor};">${i + 1}</div><div class="slot-text-v2">${val || ''}</div>`;

            if (val && !checked) {
              slot.style.borderColor = c.border;
              slot.style.background = c.bg;
              slot.querySelector('.slot-text-v2').style.color = c.text;
              slot.style.cursor = 'pointer';
              slot.addEventListener('click', () => {
                const word = slots[i];
                slots[i] = null;
                poolEl.querySelectorAll('.seq-item-v2').forEach(b => {
                  if (b.dataset.word === word) b.classList.remove('used');
                });
                renderSlots();
                updateCheck();
              });
            }
            slotsEl.appendChild(slot);
          });
        }

        function updateCheck() {
          checkBtn.style.display = slots.every(s => s !== null) ? 'block' : 'none';
        }

        const shuffled = [...sequence].sort(() => Math.random() - 0.5);
        shuffled.forEach(word => {
          const btn = document.createElement('button');
          btn.className = 'seq-item-v2';
          btn.textContent = word;
          btn.dataset.word = word;
          btn.addEventListener('click', () => {
            if (btn.classList.contains('used') || checked) return;
            const emptyIdx = slots.indexOf(null);
            if (emptyIdx === -1) return;
            slots[emptyIdx] = word;
            btn.classList.add('used');
            renderSlots();
            updateCheck();
          });
          poolEl.appendChild(btn);
        });

        checkBtn.addEventListener('click', () => {
          if (checked) return;
          checked = true;
          checkBtn.style.display = 'none';
          poolEl.querySelectorAll('.seq-item-v2').forEach(b => b.style.pointerEvents = 'none');

          let correctCount = 0;
          slotsEl.querySelectorAll('.seq-slot-v2').forEach((slot, i) => {
            const isCorrect = (slots[i] === correct[i]);
            if (isCorrect) {
              slot.style.borderColor = '#8BC34A';
              slot.style.background = 'rgba(139,195,74,0.15)';
              correctCount++;
            } else {
              slot.style.borderColor = '#E91E63';
              slot.style.background = 'rgba(233,30,99,0.12)';
              slot.querySelector('.slot-text-v2').innerHTML =
                `<span style="text-decoration:line-through;opacity:0.5;">${slots[i]}</span> <span style="color:#AED581;margin-left:4px;">→ ${correct[i]}</span>`;
            }
          });

          const score = correctCount / correct.length;
          totalScore += score;
          nextBtn.style.display = 'block';
        });

        nextBtn.addEventListener('click', () => {
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(totalScore / session.length);
        });

        renderSlots();
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  AUDIO SPEAKING
  //  Three-button compare mechanic:
  //    [🔊 Model] — plays TTS (swap src for MP3 later)
  //    [▶ You]   — plays back student's recording (unlocks after first record)
  //    [🎤 Rec]  — records / re-records via MediaRecorder
  //
  //  Uses MediaRecorder API (works on iOS Safari 14.5+, Chrome, Firefox, Edge).
  //  Falls back to model-only + self-assess if mic permission denied.
  //  Scoring: self-assess only — student decides when they're happy.
  // ─────────────────────────────────────────────
  'audio-speaking': {
    render(container, data, tier, onComplete) {
      const { prompt, target } = data;
      const isBronze = tier === 'bronze';

      let modelPlaying   = false;
      let modelAudio     = null;
      let selfPlaying    = false;
      let isRecording    = false;
      let done           = false;
      let recordingBlob  = null;
      let selfAudio      = null;
      let mediaRecorder  = null;
      let stream         = null;

      container.innerHTML = `
        <p class="module-question">${prompt}</p>
        <div class="speak-target">${target}</div>
        <div class="speak-trio">
          <button class="trio-btn model" id="model-btn">
            <span class="trio-icon" id="model-icon">🔊</span>
            <span class="trio-label">Model</span>
          </button>
          <button class="trio-btn playback" id="play-btn">
            <span class="trio-icon" id="play-icon">▶</span>
            <span class="trio-label">You</span>
          </button>
          <button class="trio-btn record" id="rec-btn">
            <span class="trio-icon" id="rec-icon">🎤</span>
            <span class="trio-label" id="rec-label">Record</span>
          </button>
        </div>
        <p class="speak-hint" id="speak-hint">Hear the model, then record yourself.</p>
        <div id="assess-wrap" style="display:none">
          <div class="assess-btns">
            <button class="assess-btn assess-yes" id="assess-yes">✓ That sounded right</button>
            <button class="assess-btn assess-no"  id="assess-no">↩ I need more practice</button>
          </div>
        </div>
        <button class="next-ex-btn" id="next-btn" style="display:none">Next →</button>
      `;

      const modelBtn  = container.querySelector('#model-btn');
      const modelIcon = container.querySelector('#model-icon');
      const playBtn   = container.querySelector('#play-btn');
      const playIcon  = container.querySelector('#play-icon');
      const recBtn    = container.querySelector('#rec-btn');
      const recIcon   = container.querySelector('#rec-icon');
      const recLabel  = container.querySelector('#rec-label');
      const hint      = container.querySelector('#speak-hint');
      const assessWrap= container.querySelector('#assess-wrap');
      const yesBtn    = container.querySelector('#assess-yes');
      const noBtn     = container.querySelector('#assess-no');
      const nextBtn   = container.querySelector('#next-btn');

      // ── Model audio ─────────────────────────────
      function finishModelPlayback() {
        modelPlaying = false;
        modelIcon.textContent = '🔊';
        modelBtn.classList.remove('playing');
      }

      function playModel() {
        if (modelPlaying) return;
        stopSelf();
        modelPlaying = true;
        modelIcon.textContent = '⏸';
        modelBtn.classList.add('playing');

        if (data.audioFile) {
          const a = new Audio(data.audioFile);
          modelAudio = a;
          a.onended = finishModelPlayback;
          a.onerror = () => playModelViaSynthesis();
          a.play().catch(() => playModelViaSynthesis());
          return;
        }
        playModelViaSynthesis();
      }

      function playModelViaSynthesis() {
        if (!TTS) { modelPlaying = false; return; }
        TTS.cancel();
        let u;
        try { u = new SpeechSynthesisUtterance(target); }
        catch(e) { modelPlaying = false; return; }
        u.rate   = isBronze ? 0.8 : 0.85;
        u.lang   = 'en-US';
        u.onend  = finishModelPlayback;
        TTS.speak(u);
      }

      modelBtn.addEventListener('click', () => {
        if (modelPlaying) {
          TTS && TTS.cancel();
          if (modelAudio) { modelAudio.pause(); modelAudio.currentTime = 0; modelAudio = null; }
          modelPlaying = false;
          modelIcon.textContent = '🔊';
          modelBtn.classList.remove('playing');
        } else {
          playModel();
        }
      });

      // ── Self playback ──────────────────────────
      function stopSelf() {
        if (selfAudio) { selfAudio.pause(); selfAudio.currentTime = 0; }
        selfPlaying = false;
        playIcon.textContent = '▶';
        playBtn.classList.remove('playing');
      }

      playBtn.addEventListener('click', () => {
        if (!recordingBlob || isRecording || done) return;
        if (selfPlaying) { stopSelf(); return; }

        TTS && TTS.cancel();
        modelPlaying = false;
        modelIcon.textContent = '🔊';
        modelBtn.classList.remove('playing');

        selfPlaying = true;
        playIcon.textContent = '⏸';
        playBtn.classList.add('playing');

        const url  = URL.createObjectURL(recordingBlob);
        selfAudio  = new Audio(url);
        selfAudio.play();
        selfAudio.onended = () => {
          stopSelf();
          URL.revokeObjectURL(url);
        };
      });

      // ── MediaRecorder ──────────────────────────
      recBtn.addEventListener('click', async () => {
        if (done) return;

        if (isRecording) {
          // Stop recording
          mediaRecorder.stop();
          return;
        }

        // Stop any playback first
        stopSelf();
        TTS && TTS.cancel();
        modelPlaying = false;
        modelIcon.textContent = '🔊';
        modelBtn.classList.remove('playing');

        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          const mimeType = MediaRecorder.isTypeSupported('audio/webm')
            ? 'audio/webm' : 'audio/mp4';

          const chunks  = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType });

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            // Release mic
            stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            recIcon.textContent  = '🎤';
            recLabel.textContent = 'Re-record';
            recBtn.classList.remove('recording');

            recordingBlob = new Blob(chunks, { type: mimeType });

            // Unlock playback button
            playBtn.classList.add('ready');

            // Show self-assess after first recording
            assessWrap.style.display = 'block';
            hint.textContent = 'Listen to both, then tap how it went.';
          };

          mediaRecorder.start();
          isRecording = true;
          recIcon.textContent  = '⏹';
          recLabel.textContent = 'Stop';
          recBtn.classList.add('recording');
          hint.textContent = 'Recording… tap ⏹ to stop.';

        } catch (err) {
          // Mic permission denied or not available — fallback
          showNoMicFallback();
        }
      });

      // ── Self-assess ────────────────────────────
      function lockAssess() {
        done = true;
        yesBtn.disabled = true;
        noBtn.disabled  = true;
        if (stream) stream.getTracks().forEach(t => t.stop());
      }

      yesBtn.addEventListener('click', () => {
        if (done) return;
        yesBtn.classList.add('selected');
        lockAssess();
        nextBtn.style.display = 'block';
        nextBtn.onclick = () => onComplete(1);
      });

      noBtn.addEventListener('click', () => {
        if (done) return;
        noBtn.classList.add('selected');
        lockAssess();
        nextBtn.style.display = 'block';
        nextBtn.onclick = () => onComplete(0);
      });

      // ── No-mic fallback ────────────────────────
      function showNoMicFallback() {
        recBtn.style.display  = 'none';
        playBtn.style.display = 'none';
        const msg = document.createElement('div');
        msg.className   = 'no-mic-msg';
        msg.textContent = 'Microphone not available. Listen to the model, say it aloud, then tap how it went.';
        container.querySelector('.speak-trio').insertAdjacentElement('afterend', msg);
        assessWrap.style.display = 'block';
        hint.style.display = 'none';
      }
    }
  },



  // ─────────────────────────────────────────────
  //  IMAGE VOCAB
  //  Bronze: image → tap correct word
  //  Silver: word  → tap correct image
  //  Gold:   image + sentence blank → word bank
  // ─────────────────────────────────────────────
  'image-vocab': {
    // "Picture & Word" module — kept as 'image-vocab' to match the real
    // production `type` field; SHELL_MERGE_SPEC's "picture-word" is a
    // descriptive name, not the actual data-contract key.
    // v2 design: separate pool PER TIER — { pick, mode, items: [...] } —
    // per Nick's decision that difficulty (and content) shouldn't be shared
    // across tiers. `cloze` is just the answer word (e.g. "runs"), not a
    // full sentence — `sentence` already contains the ___ blank.
    render(container, data, tier, onComplete) {
      const { pick, mode, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0, score = 0, locked = false, selected = null;

      function pips() {
        return session.map((_, i) =>
          `<div class="iv-pip${i<idx?' done':i===idx?' current':''}"></div>`
        ).join('');
      }

      function renderQuestion() {
        locked = false; selected = null;
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        container.innerHTML = `
          <div class="iv-pips-row" id="iv-pips"></div>
          <div id="iv-content"></div>
          <p class="iv-feedback" id="iv-feedback"></p>
          <button id="iv-check-btn" class="iv-action-btn">Check →</button>
          <button id="iv-next-btn" class="iv-proceed-btn">Next →</button>
        `;
        container.querySelector('#iv-pips').innerHTML = pips();

        const content  = container.querySelector('#iv-content');
        const checkBtn = container.querySelector('#iv-check-btn');
        const nextBtn  = container.querySelector('#iv-next-btn');
        const item = session[idx];
        let spokenWord;

        if (mode === 'image-to-word') {
          const pool = safeShuffle(items.filter(i => i.word !== item.word), () => false).slice(0, 2);
          const opts = safeShuffle([item, ...pool], r => r[0].word === item.word);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-emoji">${item.emoji}</div><p class="iv-instruction">Tap the correct word</p></div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn" data-val="${o.word}" data-ans="${item.word}">${o.word}</button>`).join('')}</div>
          `;
          spokenWord = item.word;
        } else if (mode === 'word-to-image') {
          const pool = safeShuffle(items.filter(i => i.emoji !== item.emoji), () => false).slice(0, 2);
          const opts = safeShuffle([item, ...pool], r => r[0].emoji === item.emoji);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-word">${item.word}</div><p class="iv-instruction">Tap the correct picture</p></div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn emoji-opt" data-val="${o.emoji}" data-ans="${item.emoji}">${o.emoji}</button>`).join('')}</div>
          `;
          spokenWord = item.word;
        } else {
          // cloze-image: `sentence` already has ___, `cloze` is the answer word
          const pool = safeShuffle(items.filter(i => i.cloze !== item.cloze), () => false).slice(0, 3);
          const opts = safeShuffle([item, ...pool], r => r[0].cloze === item.cloze);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-emoji" style="font-size:9cqw;">${item.emoji}</div></div>
            <div class="iv-sentence">${item.sentence.replace('___', '<span class="iv-blank" id="iv-blank">___</span>')}</div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn" data-val="${o.cloze}" data-ans="${item.cloze}">${o.cloze}</button>`).join('')}</div>
          `;
          spokenWord = item.cloze;
        }
        speak(spokenWord, 'neutral', 300);

        content.querySelectorAll('.iv-option-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (locked) return;
            content.querySelectorAll('.iv-option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selected = { val: btn.dataset.val, ans: btn.dataset.ans };
            const blank = content.querySelector('#iv-blank');
            if (blank && mode === 'cloze-image') blank.textContent = btn.dataset.val;
            checkBtn.style.display = 'block';
          });
        });

        checkBtn.addEventListener('click', () => {
          if (!selected || locked) return;
          locked = true;
          const ok = selected.val === selected.ans;
          if (ok) score++;
          const feedback = container.querySelector('#iv-feedback');
          feedback.textContent = ok ? '✓ Correct!' : '✗ See the right answer';
          feedback.style.color = ok ? '#AED581' : '#F48FB1';
          checkBtn.style.display = 'none';
          content.querySelectorAll('.iv-option-btn').forEach(b => {
            b.disabled = true;
            if (b.dataset.val === b.dataset.ans) b.classList.add('correct');
            else if (b.dataset.val === selected.val && !ok) b.classList.add('wrong');
            else b.classList.remove('selected');
          });
          const blank = content.querySelector('#iv-blank');
          if (blank) blank.textContent = selected.ans;
          speak(spokenWord, ok ? 'celebrate' : 'wrong');
          if (mode === 'cloze-image') {
            const fullSentence = item.sentence.replace('___', selected.ans);
            speak(fullSentence, ok ? 'celebrate' : 'neutral', 900);
          }
          nextBtn.style.display = 'block';
        });

        nextBtn.addEventListener('click', () => {
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(score / session.length);
        });
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  MEMORY PAIRS
  //  v2 design: per-tier pool { pick, flipback(ms), items }, separate pool
  //  per tier (not shared across tiers — same standardization as every
  //  other module now). `pick` pairs drawn, image card + word card each.
  //  Flip two, find the match. Cards colored by pair via PALETTE on match,
  //  matching Put in Order/Gap-fill's shared palette convention.
  //  Audio rule (confirmed with Nick): every flip says its word immediately,
  //  EXCEPT the 2nd flip is silent if it matches the 1st (already just
  //  heard it). On mismatch, both cards' audio already played at flip-time.
  //  On match: grammar-color sentence reinforcement (shared with
  //  gap-fill/true-false), not the generic word/emoji panel.
  // ─────────────────────────────────────────────
  'memory-pairs': {
    render(container, data, tier, onComplete) {
      const { pick, flipback, items } = data;
      const PAIRS = Math.min(pick, items.length);
      const picked = safeShuffle(items, ()=>false).slice(0, PAIRS);
      const deckSrc = [
        ...picked.map((it,i)=>({...it, kind:'image', pid:i})),
        ...picked.map((it,i)=>({...it, kind:'word',  pid:i})),
      ];
      const deck = safeShuffle(deckSrc, r => {
        for (let i=0;i<r.length-1;i++) if(r[i].pid===r[i+1].pid) return true;
        return false;
      });

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)'  },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)'  },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)'  },
        { border:'#8BC34A', bg:'rgba(139,195,74,.15)' }
      ];

      let flipped=[], matched=0, flips=0, cardLocked=false;

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Find the pairs</span><span>Flips: <span id="mp-flips">0</span></span>`;

      container.innerHTML = `
        <div class="mp-pips-row-v2" id="mp-pips"></div>
        <div class="mp-card-grid-v2" id="mp-grid"></div>
        <p class="mp-status-v2" id="mp-msg">&nbsp;</p>
      `;

      const pipsEl = container.querySelector('#mp-pips');
      picked.forEach((_, i) => {
        const c = PALETTE[i % PALETTE.length];
        const pip = document.createElement('div');
        pip.className = 'mp-pip-v2';
        pip.id = `mp-pip-${i}`;
        pip.style.background = c.bg;
        pip.style.borderColor = c.border;
        pipsEl.appendChild(pip);
      });

      const gridEl = container.querySelector('#mp-grid');
      deck.forEach((card, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'mp-card-wrap-v2';
        wrap.id = `mp-cw-${i}`;
        wrap.innerHTML = `
          <div class="mp-card-inner-v2" id="mp-ci-${i}">
            <div class="mp-card-face-v2 mp-card-back-v2">?</div>
            <div class="mp-card-face-v2 mp-card-front-v2" id="mp-cf-${i}">
              ${card.kind === 'image'
                ? (card.image
                    ? `<img src="${card.image}" alt="${card.word}" style="width:70%;height:70%;object-fit:cover;border-radius:8px;">`
                    : `<span class="mp-emoji-v2">${card.emoji}</span>`)
                : `<span>${card.word}</span>`}
            </div>
          </div>`;
        wrap.addEventListener('click', () => mpFlip(i));
        gridEl.appendChild(wrap);
      });

      function mpFlip(i) {
        if (cardLocked) return;
        const cw = document.getElementById(`mp-cw-${i}`);
        const ci = document.getElementById(`mp-ci-${i}`);
        if (!cw || cw.dataset.done || cw.dataset.flipped) return;
        cw.dataset.flipped = '1';
        ci.classList.add('flipped');

        if (flipped.length === 0) {
          // First card of the pair — always say it.
          speak(deck[i].word, 'neutral', 0, deck[i].audioFile);
        } else {
          // Second card — only say it if it's NOT a match with the first;
          // a match means it's the same word we just said a second ago.
          const first = deck[flipped[0]];
          const second = deck[i];
          const isMatch = first.pid === second.pid && first.kind !== second.kind;
          if (!isMatch) speak(second.word, 'neutral', 0, second.audioFile);
        }

        flips++;
        document.getElementById('mp-flips').textContent = flips;
        flipped.push(i);
        if (flipped.length === 2) { cardLocked = true; setTimeout(mpCheck, 500); }
      }

      function mpCheck() {
        const [a, b] = flipped;
        const ca = deck[a], cb = deck[b];
        const isMatch = ca.pid === cb.pid && ca.kind !== cb.kind;
        if (isMatch) {
          matched++;
          const c = PALETTE[ca.pid % PALETTE.length];
          ['mp-cf-'+a,'mp-cf-'+b].forEach(id=>{
            const el=document.getElementById(id);
            if(el){el.style.background=c.bg;el.style.borderColor=c.border;}
          });
          document.getElementById(`mp-cw-${a}`).dataset.done='1';
          document.getElementById(`mp-cw-${b}`).dataset.done='1';
          const pip=document.getElementById(`mp-pip-${ca.pid}`);
          if(pip){pip.classList.add('done');pip.style.background=c.border;}
          flipped=[];

          if (window.speechSynthesis) window.speechSynthesis.cancel();
          showGrammarReinforce(ca.tokens, ca.sentence, () => {
            cardLocked = false;
            if (matched === PAIRS) {
              setTimeout(()=>onComplete(matched/PAIRS), 400);
            }
          });
        } else {
          const ciA=document.getElementById(`mp-ci-${a}`);
          const ciB=document.getElementById(`mp-ci-${b}`);
          if(ciA){ciA.style.boxShadow='0 0 0 2px #E91E63';}
          if(ciB){ciB.style.boxShadow='0 0 0 2px #E91E63';}
          // No audio here — both cards already said their word at flip-time
          // (see mpFlip). Playing again here would just repeat them.
          setTimeout(()=>{
            if(ciA){ciA.classList.remove('flipped');ciA.style.boxShadow='';}
            if(ciB){ciB.classList.remove('flipped');ciB.style.boxShadow='';}
            delete document.getElementById(`mp-cw-${a}`).dataset.flipped;
            delete document.getElementById(`mp-cw-${b}`).dataset.flipped;
            flipped=[]; cardLocked=false;
          }, flipback || 1100);
        }
      }
    }
  },

  // ─────────────────────────────────────────────
  //  WORD SCRAMBLE
  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] },
  //  separate pool per tier. Tap scrambled letter tiles into slots; tap a
  //  filled slot to remove. Manual play button only — no auto-announce on
  //  question load, matching the locked demo (word-scramble-demo.html).
  //  Each question gets one color from PALETTE (not per-letter), cycling
  //  across the session.
  //  Audio (confirmed with Nick): correct → word once, then the sentence
  //  (not word-word-sentence). Wrong → word once, then silent retry (not
  //  twice). Grammar-color sentence reinforcement on correct via
  //  showGrammarReinforce, same as gap-fill/true-false/memory-pairs.
  // ─────────────────────────────────────────────
  'word-scramble': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, ()=>false).slice(0, Math.min(pick, items.length));
      let idx = 0, score = 0, slotData = [], bankData = [], wsLocked = false;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)' },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)' }
      ];
      function itemColor() { return PALETTE[idx % PALETTE.length]; }

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      function load() {
        wsLocked = false;
        const item = session[idx];
        const letters = item.word.toUpperCase().split('');
        slotData = letters.map(() => null);
        const wordUp = item.word.toUpperCase();
        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        draw();
      }

      function draw() {
        const item = session[idx];
        container.innerHTML = `
          <div class="mp-pips-row-v2" id="ws-pips"></div>
          <div class="ws-visual-v2">
            <div class="ws-emoji-v2">${item.emoji}</div>
            <button class="ws-play-btn-v2" id="ws-play-btn">🔊</button>
          </div>
          <div class="ws-slots-v2" id="ws-slots"></div>
          <div class="ws-bank-v2" id="ws-bank"></div>
          <p class="ws-feedback-v2" id="ws-fb">&nbsp;</p>
        `;
        container.querySelector('#ws-pips').innerHTML = pips();

        const wsSlots = container.querySelector('#ws-slots');
        slotData.forEach((_, si) => {
          const d = document.createElement('div');
          d.className = 'ws-slot-v2';
          d.id = `ws-s-${si}`;
          d.addEventListener('click', () => wsRemove(si));
          wsSlots.appendChild(d);
        });

        const wsBank = container.querySelector('#ws-bank');
        bankData.forEach((t, bi) => {
          const b = document.createElement('button');
          b.className = 'ws-tile-v2';
          b.id = `ws-t-${bi}`;
          b.textContent = t.letter;
          b.addEventListener('click', () => wsTap(bi));
          wsBank.appendChild(b);
        });

        container.querySelector('#ws-play-btn').addEventListener('click', () => {
          speak(item.word, 'neutral');
        });

        refreshSlots(); refreshBank();
      }

      function refreshSlots() {
        const c = itemColor();
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`ws-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.letter : '';
          el.style.borderColor = entry ? c.border : 'rgba(255,255,255,0.08)';
          el.style.background = entry ? c.bg : 'rgba(255,255,255,0.05)';
          el.style.color = entry ? c.border : '#fff';
        });
      }
      function refreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`ws-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });
      }

      function wsTap(bi) {
        if (wsLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.indexOf(null);
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { letter: tile.letter, bankId: bi };
        refreshSlots(); refreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(wsCheck, 200);
      }
      function wsRemove(si) {
        if (wsLocked) return;
        const entry = slotData[si];
        if (!entry) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        refreshSlots(); refreshBank();
      }

      function wsCheck() {
        const item = session[idx];
        const attempt = slotData.map(e => e.letter).join('').toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        wsLocked = true;
        const c = itemColor();
        const fb = document.getElementById('ws-fb');

        slotData.forEach((_, si) => {
          const el = document.getElementById(`ws-s-${si}`);
          if (el) {
            el.style.borderColor = ok ? c.border : '#E91E63';
            el.style.background = ok ? c.bg : 'rgba(233,30,99,0.12)';
            el.style.color = ok ? c.border : '#F48FB1';
          }
        });

        if (ok) {
          score++;
          if (fb) { fb.textContent = '✓ Correct!'; fb.style.color = '#AED581'; }
          speak(item.word, 'celebrate'); // word once — sentence comes from the reinforcement panel, not repeated here
          setTimeout(() => {
            const plainSentence = item.tokens.map(t => t.t).join(' ');
            showGrammarReinforce(item.tokens, plainSentence, () => {
              idx++;
              if (idx < session.length) load();
              else onComplete(score / session.length);
            });
          }, 500);
        } else {
          if (fb) { fb.textContent = `✗ The word is: ${item.word}`; fb.style.color = '#F48FB1'; }
          speak(item.word, 'wrong'); // word once, then silent retry — no second play
          setTimeout(() => {
            slotData = slotData.map(() => null);
            bankData.forEach(t => t.used = false);
            wsLocked = false;
            refreshSlots(); refreshBank();
            if (fb) { fb.textContent = 'Try again!'; fb.style.color = 'rgba(255,255,255,0.4)'; }
          }, 1500);
        }
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  SPELLING
  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] }, separate
  //  pool per tier. Bronze: image + tap tiles. Silver: audio-only + tap
  //  tiles. Gold: audio-only + free typing (no letter bank at all — this
  //  is the genuine skill difference from Word Scramble: production
  //  spelling from memory, not anagram-solving). tokens can be null
  //  (library/hospital) — falls back to just the word for reinforcement.
  //  Manual play button only — no auto-announce, matching Word Scramble.
  //  Audio: correct → word once, then sentence. Wrong → word once, silent
  //  retry. Same rule Nick confirmed for Word Scramble.
  // ─────────────────────────────────────────────
  'spelling': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, ()=>false).slice(0, Math.min(pick, items.length));
      let idx = 0, score = 0, spLocked = false, retypeMode = false;
      let slotData = [], bankData = [];

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      function load() {
        spLocked = false; retypeMode = false;
        const item = session[idx];
        const letters = item.word.toUpperCase().split('');
        slotData = letters.map(() => null);
        const wordUp = item.word.toUpperCase();
        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));

        const showImage = tier === 'bronze';
        const isTile = tier !== 'gold';
        const instruction = tier === 'bronze' ? 'Tap the letters to spell the word'
                           : tier === 'silver' ? 'Listen and spell what you hear'
                           : 'Listen and type the word';

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <div class="mp-pips-row-v2" id="sp-pips"></div>
          <div class="sp-visual-v2">
            ${showImage ? `<div class="sp-emoji-v2">${item.emoji}</div>` : ''}
            <div class="sp-listen-row-v2">
              <button class="sp-play-btn-v2" id="sp-play-btn">🔊</button>
              <span class="sp-instruction-v2">${instruction}</span>
            </div>
          </div>
          ${isTile ? `
          <div class="sp-slots-v2" id="sp-slots"></div>
          <div class="sp-bank-v2" id="sp-bank"></div>
          ` : `
          <input id="sp-input" class="sp-input-v2" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Type the word…">
          <button id="sp-chk" class="sp-check-btn-v2" disabled>Check →</button>
          `}
          <p class="sp-feedback-v2" id="sp-fb">&nbsp;</p>
        `;
        container.querySelector('#sp-pips').innerHTML = pips();

        container.querySelector('#sp-play-btn').addEventListener('click', () => speak(item.word, 'neutral'));

        if (isTile) {
          const slotsEl = container.querySelector('#sp-slots');
          slotData.forEach((_, si) => {
            const d = document.createElement('div');
            d.className = 'sp-slot-v2';
            d.id = `sp-s-${si}`;
            d.addEventListener('click', () => spRemove(si));
            slotsEl.appendChild(d);
          });
          const bankEl = container.querySelector('#sp-bank');
          bankData.forEach((t, bi) => {
            const b = document.createElement('button');
            b.className = 'sp-tile-v2';
            b.id = `sp-t-${bi}`;
            b.textContent = t.letter;
            b.addEventListener('click', () => spTap(bi));
            bankEl.appendChild(b);
          });
          spRefreshSlots(); spRefreshBank();
        } else {
          const inp = container.querySelector('#sp-input');
          const chk = container.querySelector('#sp-chk');
          inp.addEventListener('input', () => {
            chk.style.display = 'block';
            chk.disabled = inp.value.trim().length === 0;
            chk.style.opacity = inp.value.trim().length ? '1' : '.4';
          });
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') spCheckType(); });
          chk.addEventListener('click', spCheckType);
          setTimeout(() => inp.focus(), 200);
        }
      }

      function spTap(bi) {
        if (spLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.indexOf(null);
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { letter: tile.letter, bankId: bi };
        spRefreshSlots(); spRefreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(spCheckTiles, 200);
      }
      function spRemove(si) {
        if (spLocked) return;
        const entry = slotData[si];
        if (!entry) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        spRefreshSlots(); spRefreshBank();
      }
      function spRefreshSlots() {
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`sp-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.letter : '';
          el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';
          el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';
        });
      }
      function spRefreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`sp-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });
      }

      function reinforceThenAdvance(item) {
        const plainSentence = item.tokens ? item.tokens.map(t => t.t).join(' ') : item.word;
        showGrammarReinforce(item.tokens, plainSentence, () => {
          idx++;
          if (idx < session.length) load();
          else onComplete(score / session.length);
        });
      }

      function spCheckTiles() {
        const item = session[idx];
        const attempt = slotData.map(e => e.letter).join('').toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        spLocked = true;
        const fb = document.getElementById('sp-fb');
        slotData.forEach((_, si) => {
          const el = document.getElementById(`sp-s-${si}`);
          if (el) {
            el.style.borderColor = ok ? '#8BC34A' : '#E91E63';
            el.style.background = ok ? 'rgba(139,195,74,0.15)' : 'rgba(233,30,99,0.12)';
          }
        });
        if (ok) {
          score++;
          if (fb) { fb.textContent = '✓ Correct!'; fb.style.color = '#AED581'; }
          speak(item.word, 'celebrate'); // word once — sentence comes from the reinforcement panel
          setTimeout(() => reinforceThenAdvance(item), 500);
        } else {
          if (fb) { fb.textContent = `✗ The word is: ${item.word}`; fb.style.color = '#F48FB1'; }
          speak(item.word, 'wrong'); // word once, then silent retry
          setTimeout(() => {
            slotData = slotData.map(() => null);
            bankData.forEach(t => t.used = false);
            spLocked = false;
            spRefreshSlots(); spRefreshBank();
            if (fb) { fb.textContent = 'Try again!'; fb.style.color = 'rgba(255,255,255,0.4)'; }
          }, 1500);
        }
      }

      function spCheckType() {
        if (spLocked) return;
        const item = session[idx];
        const inp = document.getElementById('sp-input');
        if (!inp || !inp.value.trim()) return;
        const attempt = inp.value.trim().toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        spLocked = true;
        const fb = document.getElementById('sp-fb');
        inp.style.borderColor = ok ? '#8BC34A' : '#E91E63';
        inp.style.background = ok ? 'rgba(139,195,74,0.08)' : 'rgba(233,30,99,0.08)';
        const chk = document.getElementById('sp-chk');
        if (chk) chk.style.display = 'none';

        if (ok) {
          if (!retypeMode) score++;
          if (fb) { fb.textContent = '✓ Correct!'; fb.style.color = '#AED581'; }
          speak(item.word, 'celebrate'); // word once — sentence comes from the reinforcement panel
          setTimeout(() => reinforceThenAdvance(item), 500);
        } else {
          if (fb) { fb.textContent = `✗ The word is: ${item.word} — now type it correctly`; fb.style.color = '#F48FB1'; }
          speak(item.word, 'wrong'); // word once, then silent retry
          setTimeout(() => {
            retypeMode = true; spLocked = false;
            inp.value = ''; inp.style.borderColor = 'rgba(255,255,255,0.08)';
            inp.style.background = 'rgba(255,255,255,0.05)';
            inp.placeholder = 'Type the correct word…'; inp.focus();
            if (chk) { chk.style.display = 'block'; chk.disabled = true; chk.style.opacity = '.4'; }
            if (fb) { fb.textContent = `Type: ${item.word}`; fb.style.color = '#C9B8EA'; }
          }, 1600);
        }
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  LISTEN & MATCH
  //  v2 design: pool-based { pick, items: [{left,right}] } — same shape
  //  and free-pairing engine as Word Match, confirmed identical in the
  //  locked demo (listen-match-demo.html). Only real difference: left
  //  buttons show a 🔊 icon and play audio on every tap (unlimited
  //  replay) instead of showing text. left always equals right in the
  //  data — it's an audio-echo match, not a translation pair.
  // ─────────────────────────────────────────────
  'audio-match': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const pairs = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      const total = pairs.length;
      const isBronze = (tier === 'bronze');

      const PALETTE = [
        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },
        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },
        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },
        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },
        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }
      ];
      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Tap 🔊 to listen, then match.</span><span id="am-score">0 of ${total} paired</span>`;

      container.innerHTML = `
        <div class="wm-grid-v2">
          <div class="wm-col-v2" id="am-left-col"></div>
          <div class="wm-col-v2" id="am-right-col"></div>
        </div>
        <p class="wm-encourage-v2" id="am-encourage"></p>
        <p class="wm-nudge-v2" id="am-nudge"></p>
        <button id="am-notquite-btn" class="wm-notquite-btn-v2" disabled>Not quite yet</button>
        <button id="am-next-btn" class="iv-proceed-btn">Next →</button>
      `;

      const leftCol      = container.querySelector('#am-left-col');
      const rightCol     = container.querySelector('#am-right-col');
      const scoreLabel   = document.getElementById('am-score');
      const encourageEl  = container.querySelector('#am-encourage');
      const nudgeEl      = container.querySelector('#am-nudge');
      const notQuiteBtn  = container.querySelector('#am-notquite-btn');
      const nextBtn      = container.querySelector('#am-next-btn');

      let pairings = new Map();
      let rightUsed = new Map();
      let selectedLeftBtn = null;
      let confirmed = false;

      function styleLeft(btn) {
        if (confirmed) return;
        const idx = parseInt(btn.dataset.pairIdx);
        const c = pairColor[idx];
        const isSelected = (btn === selectedLeftBtn);
        const isPaired = pairings.has(idx);
        if (isSelected) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = `0 0 0 3px ${c.border}`;
        } else if (isPaired) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = '';
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';
        }
      }
      function styleRight(btn) {
        if (confirmed) return;
        const rightIdx = parseInt(btn.dataset.pairIdx);
        if (rightUsed.has(rightIdx)) {
          const c = pairColor[rightUsed.get(rightIdx)];
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)';
        }
      }
      function checkAllCorrect() {
        if (pairings.size !== total) return false;
        for (const leftIdx of pairings.keys()) {
          if (pairings.get(leftIdx) !== leftIdx) return false;
        }
        return true;
      }
      function refreshAll() {
        container.querySelectorAll('.wm-btn-v2[data-side="left"]').forEach(styleLeft);
        container.querySelectorAll('.wm-btn-v2[data-side="right"]').forEach(styleRight);

        let correctSoFar = 0, wrongSoFar = 0;
        pairings.forEach((rightIdx, leftIdx) => {
          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;
        });

        if (pairings.size === total) {
          if (checkAllCorrect()) {
            confirmed = true;
            scoreLabel.textContent = 'Good job!';
            scoreLabel.style.color = '#AED581';
            notQuiteBtn.style.display = 'none';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
            nextBtn.style.display = 'flex';
            nextBtn.onclick = () => onComplete(1);
          } else {
            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;
            scoreLabel.style.color = '';
            nextBtn.style.display = 'none';
            notQuiteBtn.style.display = 'flex';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
          }
        } else {
          scoreLabel.textContent = `${pairings.size} of ${total} paired`;
          scoreLabel.style.color = '';
          nextBtn.style.display = 'none';
          notQuiteBtn.style.display = 'none';

          if (isBronze && wrongSoFar > 0) {
            nudgeEl.textContent = 'Are you sure about that one?';
            nudgeEl.style.opacity = '1';
            encourageEl.style.opacity = '0';
          } else {
            nudgeEl.style.opacity = '0';
            if (correctSoFar > 0) {
              const ratio = correctSoFar / total;
              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'
                                       : ratio >= 0.34 ? 'Getting there!'
                                       : 'Nice, keep going!';
              encourageEl.style.opacity = '1';
            } else {
              encourageEl.style.opacity = '0';
            }
          }
        }
      }

      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));
      const leftItems = safeShuffle(withIdx, () => false);
      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));

      leftItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.innerHTML = '🔊';
        btn.dataset.side = 'left';
        btn.dataset.pairIdx = pair.pairIdx;
        btn.dataset.audio = pair.left;
        leftCol.appendChild(btn);
      });
      rightItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.right;
        btn.dataset.side = 'right';
        btn.dataset.pairIdx = pair.pairIdx;
        rightCol.appendChild(btn);
      });

      container.querySelectorAll('.wm-btn-v2').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirmed) return;

          if (btn.dataset.side === 'left') {
            speak(btn.dataset.audio, 'neutral'); // unlimited replay — plays every tap, matched or not
            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;
            refreshAll();
            return;
          }

          const rightIdx = parseInt(btn.dataset.pairIdx);
          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;

          if (rightUsed.has(rightIdx)) {
            const prevLeftIdx = rightUsed.get(rightIdx);
            pairings.delete(prevLeftIdx);
            rightUsed.delete(rightIdx);
            if (leftIdx === null || leftIdx === prevLeftIdx) {
              selectedLeftBtn = null;
              refreshAll();
              return;
            }
          }
          if (leftIdx === null) { refreshAll(); return; }

          if (pairings.has(leftIdx)) {
            rightUsed.delete(pairings.get(leftIdx));
            pairings.delete(leftIdx);
          }
          pairings.set(leftIdx, rightIdx);
          rightUsed.set(rightIdx, leftIdx);
          selectedLeftBtn = null;
          refreshAll();
        });
      });
    }
  },

  // ─────────────────────────────────────────────
  //  SENTENCE BUILDING
  //  Word-tile version of Word Scramble: tap tiles from the bank into
  //  ordered slots, auto-check on last slot filled, reset on wrong.
  //  On correct: tiles recolour by grammar role (subject/verb/object/
  //  place/time — 5 colours; everything else stays neutral) and the
  //  full sentence plays. Manual "Next →" so the reveal isn't rushed.
  // ─────────────────────────────────────────────
  'sentence-building': {
    render(container, data, tier, onComplete) {
      const { items } = data;
      const PICK = Math.min(items.length, 4);
      const session = safeShuffle(items, ()=>false).slice(0, PICK);
      let idx=0, score=0, sbLocked=false;
      let slotData=[], bankData=[];

      const ROLE_COLOR = {
        subject: '#00BCD4',
        verb:    '#8BC34A',
        object:  '#FF9800',
        place:   '#AB47BC',
        time:    '#E91E63',
      };
      const roleColor = role => ROLE_COLOR[role] || null; // null = neutral grey

      function pips() {
        return session.map((_,i)=>`<div class="pip${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      function sentenceText(tokens) {
        return tokens.map(t=>t.text).join(' ');
      }

      function load() {
        sbLocked=false;
        if(idx>=session.length){onComplete(score/PICK);return;}
        const item=session[idx];
        slotData=item.tokens.map(()=>null);
        const withId=item.tokens.map((t,i)=>({...t,id:i}));
        bankData=safeShuffle(withId, r=>r.every((t,i)=>t.text===item.tokens[i].text))
          .map(t=>({...t,used:false}));
        draw();
      }

      function draw() {
        container.innerHTML=`
          <div class="progress-row" style="margin-bottom:1rem;">${pips()}</div>
          <p class="module-question" style="text-align:center;">Put the words in order.</p>
          <div id="sb-slots" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;min-height:52px;">
            ${slotData.map((_,si)=>`<div id="sb-s-${si}" onclick="sbRemove(${si})" style="
              min-width:44px;height:44px;padding:0 10px;border-radius:8px;
              border:2px solid var(--surface2);background:var(--surface);
              display:flex;align-items:center;justify-content:center;
              font-size:15px;font-weight:700;color:var(--text);cursor:pointer;
            "></div>`).join('')}
          </div>
          <div id="sb-bank" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:52px;margin-bottom:1rem;">
            ${bankData.map((t,bi)=>`<button id="sb-t-${bi}" onclick="sbTap(${bi})" style="
              padding:11px 14px;border-radius:8px;
              border:1.5px solid #4A6080;background:var(--surface);
              font-size:15px;font-weight:600;color:var(--text);
              cursor:pointer;box-shadow:0 2px 0 #1E3248;transition:opacity .2s;
            ">${t.text}</button>`).join('')}
          </div>
          <div id="sb-fb" style="min-height:24px;text-align:center;font-size:14px;color:var(--text-dim);margin-bottom:.5rem;"></div>
          <button class="next-ex-btn" id="sb-next-btn" style="display:none">Next →</button>`;
      }

      function refreshSlots() {
        slotData.forEach((entry,si)=>{
          const el=document.getElementById(`sb-s-${si}`);
          if(!el)return;
          el.textContent=entry?entry.text:'';
          el.style.borderColor=entry?'var(--accent)':'var(--surface2)';
          el.style.background=entry?'rgba(79,195,247,.08)':'var(--surface)';
        });
      }
      function refreshBank() {
        bankData.forEach((t,bi)=>{
          const el=document.getElementById(`sb-t-${bi}`);
          if(el)el.style.opacity=t.used?'0':'1';
        });
      }

      window.sbTap=function(bi){
        if(sbLocked)return;
        const tile=bankData[bi];
        if(tile.used)return;
        const si=slotData.indexOf(null);
        if(si===-1)return;
        tile.used=true;
        slotData[si]={text:tile.text,role:tile.role,bankId:bi};
        refreshSlots();refreshBank();
        if(slotData.indexOf(null)===-1)setTimeout(sbCheck,200);
      };
      window.sbRemove=function(si){
        if(sbLocked)return;
        const entry=slotData[si];
        if(!entry)return;
        bankData[entry.bankId].used=false;
        slotData[si]=null;
        refreshSlots();refreshBank();
      };

      function sbCheck(){
        const item=session[idx];
        const ok=slotData.every((e,i)=>e.text===item.tokens[i].text);
        sbLocked=true;
        const fb=document.getElementById('sb-fb');
        const nextBtn=document.getElementById('sb-next-btn');

        if(ok){
          score++;
          slotData.forEach((entry,si)=>{
            const el=document.getElementById(`sb-s-${si}`);
            if(!el)return;
            const c=roleColor(entry.role);
            el.style.borderColor=c||'var(--text-dim)';
            el.style.background=c?c+'26':'rgba(255,255,255,.06)';
            el.style.color=c||'var(--text-dim)';
          });
          if(fb){fb.textContent='✓ Correct!';fb.style.color='var(--pass)';}
          speak(sentenceText(item.tokens),'celebrate', 0, item.audioFile);
          if(nextBtn){
            nextBtn.style.display='block';
            nextBtn.onclick=()=>{idx++;load();};
          }
        } else {
          slotData.forEach((_,si)=>{
            const el=document.getElementById(`sb-s-${si}`);
            if(el){el.style.borderColor='var(--fail)';el.style.background='rgba(239,83,80,.1)';}
          });
          if(fb){fb.textContent='✗ Not quite — listen and try again';fb.style.color='var(--fail)';}
          speak(sentenceText(item.tokens),'wrong', 0, item.audioFile);
          setTimeout(()=>{
            slotData=slotData.map(()=>null);
            bankData.forEach(t=>t.used=false);
            sbLocked=false;
            refreshSlots();refreshBank();
            if(fb){fb.textContent='Try again!';fb.style.color='var(--text-dim)';}
          },1600);
        }
      }

      load();
    }
  },

};

showScreen('screen-name');

// ══════════════════════════════════════════════════
//  DEBUG HARNESS — ?debug=1
//  Skips the name picker/linear tier flow so any
//  module + tier can be jumped to directly, the same
//  way module-demos/test-harness.html works for the
//  standalone demo files.
// ══════════════════════════════════════════════════
(function initDebugHarness() {
  if (new URLSearchParams(location.search).get('debug') !== '1') return;

  document.getElementById('debug-harness').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.style.paddingTop = '54px');

  const moduleSelect = document.getElementById('debug-module-select');
  const tierSelect = document.getElementById('debug-tier-select');

  LESSON.forEach((mod, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i + 1}. ${mod.label} (${mod.type})`;
    opt.style.background = '#0D1B2A';
    opt.style.color = '#fff';
    moduleSelect.appendChild(opt);
  });

  // Auto-pick the first student so audio/name display works without
  // clicking through the name picker.
  state.student = STUDENTS[0];
  state.results = buildResults();

  function jump() {
    startModule(Number(moduleSelect.value), tierSelect.value);
  }
  moduleSelect.addEventListener('change', jump);
  tierSelect.addEventListener('change', jump);

  // Read initial state from URL if provided (?module=<index>&tier=bronze)
  const params = new URLSearchParams(location.search);
  const initialModule = params.get('module');
  const initialTier = params.get('tier');
  if (initialModule !== null && LESSON[initialModule]) moduleSelect.value = initialModule;
  if (initialTier) tierSelect.value = initialTier;

  jump();
})();
</script>
