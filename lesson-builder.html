<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson Builder — Module Authoring (Mockup v2)</title>
<style>
  :root{
    --bg-0:#0B0714; --violet:#8B5CF6; --violet-dim:#5B3FA6;
    --glass:rgba(255,255,255,0.045); --glass-brd:rgba(255,255,255,0.09); --glass-brd-hi:rgba(139,92,246,0.55);
    --text-hi:#F3F1FA; --text-mid:rgba(243,241,250,0.62); --text-lo:rgba(243,241,250,0.34);
    --teal:#00BCD4; --green:#8BC34A; --orange:#FFB74D; --purple:#CE93D8; --pink:#F48FB1;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; color:var(--text-hi);
    background: radial-gradient(ellipse 900px 500px at 15% -5%, rgba(139,92,246,0.20), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 10%, rgba(91,63,166,0.16), transparent 55%), var(--bg-0);
    background-attachment:fixed; }
  .app{ display:grid; grid-template-columns:230px 1fr 320px; min-height:calc(100vh - 57px); }

  .top-nav{ display:flex; align-items:center; gap:26px; padding:14px 26px; border-bottom:1px solid var(--glass-brd); }
  .top-nav-brand{ font-size:13px; letter-spacing:.08em; color:var(--text-lo); text-transform:uppercase; margin-right:10px;}
  .top-nav-tabs{ display:flex; gap:4px;}
  .top-nav-tab{ font-size:13.5px; padding:8px 16px; border-radius:9px; color:var(--text-mid); cursor:pointer; display:flex; align-items:center; gap:8px;}
  .top-nav-tab:hover{ background:var(--glass); color:var(--text-hi);}
  .top-nav-tab.active{ background:var(--glass); color:var(--text-hi); border:1px solid var(--glass-brd-hi);}
  .nav-badge{ font-size:10.5px; background:rgba(244,143,177,0.2); color:var(--pink); padding:1px 7px; border-radius:999px; font-weight:700;}

  .ap-wrap{ max-width:920px; margin:0 auto; padding:26px 30px 60px;}
  .ap-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .ap-title{ font-size:20px; font-weight:700;}
  .ap-sub{ font-size:12.5px; color:var(--text-lo); margin-top:4px;}
  .ap-filter{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mid); margin:18px 0;}
  .ap-filter input{ accent-color:var(--violet);}
  .ap-row{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:14px; padding:14px 18px; margin-bottom:10px;}
  .ap-row-top{ display:flex; align-items:center; gap:14px;}
  .ap-icon{ width:34px; height:34px; border-radius:9px; background:rgba(139,92,246,0.14); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .ap-text{ flex:1; min-width:0;}
  .ap-text-main{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ap-meta{ font-size:11.5px; color:var(--text-lo); margin-top:2px; display:flex; gap:10px;}
  .ap-persona{ padding:1px 8px; border-radius:999px; background:rgba(255,255,255,0.06);}
  .ap-state{ font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600; flex-shrink:0;}
  .ap-state.never{ background:rgba(244,143,177,0.15); color:var(--pink);}
  .ap-state.draft{ background:rgba(255,183,77,0.15); color:var(--orange);}
  .ap-actions{ display:flex; gap:6px; flex-shrink:0;}
  .ap-usage-toggle{ font-size:11.5px; color:#C4B5FD; cursor:pointer; white-space:nowrap;}
  .ap-usages{ margin-top:12px; padding-top:12px; border-top:1px solid var(--glass-brd); display:none; flex-direction:column; gap:6px;}
  .ap-usages.open{ display:flex;}
  .ap-usage-item{ font-size:12px; color:var(--text-mid); display:flex; gap:8px; align-items:center;}
  .ap-usage-item .ub{ font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--text-lo);}
  .ap-bulk{ font-size:12.5px; padding:8px 16px; }

  .sidebar{ padding:22px 14px; border-right:1px solid var(--glass-brd); }
  .brand{ font-size:13px; letter-spacing:.08em; color:var(--text-lo); text-transform:uppercase; margin-bottom:22px; padding-left:6px;}
  .lesson-name{ font-size:15px; font-weight:600; margin-bottom:2px; padding-left:6px;}
  .lesson-sub{ font-size:12px; color:var(--text-lo); margin-bottom:12px; padding-left:6px;}
  .lesson-notes{ width:100%; min-height:52px; margin-bottom:18px; padding:8px 9px; font-size:11.5px; color:var(--text-mid); background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); border-radius:9px; resize:vertical; font-family:inherit; line-height:1.5;}
  .lesson-notes:focus{ outline:none; border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .lesson-notes::placeholder{ color:var(--text-lo);}
  .mod-progress{ display:flex; gap:2px; margin-left:auto; flex-shrink:0;}
  .mod-progress .dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.12);}
  .mod-progress .dot.filled{ background:var(--green);}
  .copy-tier-btn{ font-size:11.5px; padding:7px 12px; border-radius:9px; border:1px dashed var(--glass-brd); color:#C4B5FD; cursor:pointer; background:transparent;}
  .copy-tier-btn:hover{ border-style:solid; border-color:var(--glass-brd-hi);}
  .mod-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .mod-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px; font-size:13.5px; color:var(--text-mid); cursor:pointer; transition:.15s;}
  .mod-item:hover{ background:var(--glass); color:var(--text-hi);}
  .mod-item.active{ background:linear-gradient(90deg, rgba(139,92,246,0.22), rgba(139,92,246,0.05)); color:var(--text-hi); border:1px solid var(--glass-brd-hi);}
  .mod-num{ font-size:10.5px; color:var(--text-lo); width:16px; }
  .mod-item.active .mod-num{ color:var(--violet); }
  .mod-pool-tag{ margin-left:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(139,92,246,0.15); color:#C4B5FD;}
  .mod-stub-tag{ margin-left:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,0.06); color:var(--text-lo);}

  .main{ padding:22px 26px; overflow-y:auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .crumb{ font-size:12px; color:var(--text-lo);}
  .crumb b{ color:var(--text-mid); font-weight:500;}
  .actions{ display:flex; gap:8px; align-items:center;}
  .save-state{ font-size:11.5px; color:var(--text-lo); margin-right:6px;}
  .btn{ font-size:13px; padding:8px 15px; border-radius:9px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--text-hi); cursor:pointer; }
  .btn.primary{ background:linear-gradient(135deg, var(--violet), var(--violet-dim)); border:none; font-weight:600; box-shadow:0 4px 18px rgba(139,92,246,0.35);}

  .tier-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .tier-tabs{ display:flex; gap:6px; }
  .tier-tab{ padding:7px 16px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid); display:flex; align-items:center; gap:6px;}
  .tier-tab .dot{width:7px;height:7px;border-radius:50%;}
  .tier-tab.bronze .dot{background:#CD7F32;} .tier-tab.silver .dot{background:#C0C0C0;} .tier-tab.gold .dot{background:#FFD54F;}
  .tier-tab.active{ background:var(--glass); border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .compare-btn{ font-size:12px; padding:7px 14px; border-radius:9px; border:1px dashed var(--glass-brd); color:#C4B5FD; cursor:pointer; background:transparent;}
  .compare-btn.active{ background:rgba(139,92,246,0.14); border-style:solid; border-color:var(--glass-brd-hi);}

  .card{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:16px; padding:18px 20px; margin-bottom:16px; backdrop-filter:blur(14px); }
  .card-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-lo); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-mid); margin-bottom:6px;}
  .field input[type=text]{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:9px; padding:10px 12px; color:var(--text-hi); font-size:14px;}
  .field input:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .row-inline{ display:flex; gap:8px; align-items:center;}
  .speak-btn{ flex-shrink:0; width:34px; height:34px; border-radius:9px; border:1px solid var(--glass-brd); background:rgba(139,92,246,0.12); color:#C4B5FD; cursor:pointer; font-size:14px;}
  .audio-status{ font-size:11px; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;}
  .audio-status.ok{ background:rgba(139,195,74,0.15); color:var(--green);}
  .audio-status.needs{ background:rgba(255,183,77,0.15); color:var(--orange);}
  .options-list{ display:flex; flex-direction:column; gap:7px;}
  .opt-row{ display:flex; gap:8px; align-items:center;}
  .opt-row input{ flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:9px; padding:10px 12px; color:var(--text-hi); font-size:14px;}
  .opt-row input:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .opt-audio-icon{ flex-shrink:0; width:18px; text-align:center; font-size:12.5px; cursor:pointer;}
  .opt-audio-icon.needs{ color:var(--orange);}
  .opt-audio-icon.ok{ color:var(--text-lo); opacity:0.5;}
  .opt-audio-icon.overridden{ color:var(--violet); opacity:0.85;}
  .opt-audio-icon:hover{ opacity:1; transform:scale(1.1);}
  .opt-tag{ font-size:10px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--text-mid); border:1px solid var(--glass-brd); flex-shrink:0; cursor:pointer; white-space:nowrap; user-select:none;}
  .opt-tag:hover{ border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .opt-tag.is-correct{ background:rgba(139,195,74,0.18); color:var(--green); border-color:var(--green);}
  .add-link{ font-size:12.5px; color:#C4B5FD; cursor:pointer; margin-top:2px; display:inline-block;}

  .token-editor{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .token-actions{ min-height:18px; margin-bottom:4px;}
  .token-action-link{ font-size:12px; color:#C4B5FD; cursor:pointer; }
  .token-action-link:hover{ text-decoration:underline; }
  .token-action-hint{ font-size:11.5px; color:var(--text-lo); }
  .chip{ padding:4px 11px; border-radius:999px; font-size:13px; font-weight:600; border:1.5px solid; cursor:pointer; user-select:none; transition:.1s;}
  .chip:hover{ filter:brightness(1.25);}
  .chip-selected{ box-shadow:0 0 0 2px var(--bg-0), 0 0 0 4px var(--violet); }
  .chip.subject{background:rgba(0,188,212,0.18); border-color:var(--teal); color:var(--teal);}
  .chip.verb{background:rgba(139,195,74,0.18); border-color:var(--green); color:var(--green);}
  .chip.object{background:rgba(255,152,0,0.18); border-color:#FF9800; color:var(--orange);}
  .chip.place{background:rgba(171,71,188,0.18); border-color:#AB47BC; color:var(--purple);}
  .chip.time{background:rgba(233,30,99,0.18); border-color:#E91E63; color:var(--pink);}
  .chip.connector{background:rgba(255,255,255,0.08); border-color:var(--text-lo); color:var(--text-mid);}
  .role-swatches{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .swatch-item{ display:flex; align-items:center; gap:6px;}
  .swatch-item span{ font-size:11.5px; color:var(--text-mid);}
  .swatch{ width:20px; height:20px; border-radius:50%; }
  .swatch.subject{background:var(--teal);} .swatch.verb{background:var(--green);} .swatch.object{background:var(--orange);}
  .swatch.place{background:var(--purple);} .swatch.time{background:var(--pink);} .swatch.none{background:var(--text-lo);}

  .pool-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .pool-count{ font-size:12px; color:#C4B5FD; background:rgba(139,92,246,0.14); padding:4px 10px; border-radius:999px;}
  .pool-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px;}
  .pool-item .emoji{ font-size:18px; width:26px; text-align:center; flex-shrink:0;}
  .pool-item .word{ font-weight:600; font-size:13.5px; flex:1;}
  .pool-item .meta{ font-size:11px; color:var(--text-lo); flex-shrink:0;}
  .pool-item input[type=text]{ flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:8px; padding:7px 10px; color:var(--text-hi); font-size:13.5px;}
  .pool-item input[type=text]:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .pool-item .del{ flex-shrink:0; color:var(--text-lo); cursor:pointer; font-size:13px;}
  .pool-item .emoji-btn{ flex-shrink:0; width:30px; height:30px; border-radius:8px; border:1px solid var(--glass-brd); background:rgba(255,255,255,0.03); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .pair-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px;}
  .pair-row .pair-arrow{ color:var(--text-lo); font-size:13px; flex-shrink:0;}
  .toggle-group{ display:flex; gap:8px;}
  .toggle-btn{ padding:9px 20px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid); background:rgba(255,255,255,0.02);}
  .toggle-btn.active.true{ background:rgba(139,195,74,0.16); color:var(--green); border-color:var(--green);}
  .toggle-btn.active.false{ background:rgba(244,143,177,0.16); color:var(--pink); border-color:var(--pink);}
  .reorder-row{ display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:6px;}
  .reorder-row .arrows{ display:flex; flex-direction:column; cursor:pointer; color:var(--text-lo); font-size:9px; line-height:1; flex-shrink:0;}
  .reorder-row .arrows span:hover{ color:var(--text-hi);}
  .reorder-row .step-num{ font-size:11px; color:var(--text-lo); width:16px; flex-shrink:0;}
  .shared-pool-note{ font-size:11.5px; color:var(--text-lo); margin-bottom:12px; line-height:1.5; background:rgba(139,92,246,0.06); border:1px solid var(--glass-brd); border-radius:9px; padding:9px 12px;}
  .mode-select{ display:flex; gap:8px; flex-wrap:wrap;}
  .mode-opt{ padding:8px 14px; border-radius:9px; font-size:12.5px; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid);}
  .mode-opt.active{ background:rgba(139,92,246,0.16); color:var(--text-hi); border-color:var(--glass-brd-hi);}
  .bs-item-row{ padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px; cursor:pointer;}
  .bs-item-row:hover{ border-color:var(--glass-brd-hi);}
  .bs-item-row.active{ border-color:var(--glass-brd-hi); background:rgba(139,92,246,0.06);}
  .bs-item-preview{ display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .bs-item-preview .chip{ cursor:default; font-size:12px; padding:3px 9px;}
  .bs-add-word-row{ display:flex; gap:8px; margin-top:10px;}

  .stub-card{ text-align:center; padding:50px 20px; color:var(--text-lo); font-size:13.5px; line-height:1.7;}
  .stub-card b{ color:var(--text-mid); display:block; font-size:15px; margin-bottom:8px;}

  /* compare view */
  .compare-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .compare-card{ border-radius:14px; padding:14px 16px; border:1px solid var(--glass-brd); background:rgba(255,255,255,0.03);}
  .compare-card.bronze{ border-top:3px solid #CD7F32;} .compare-card.silver{ border-top:3px solid #C0C0C0;} .compare-card.gold{ border-top:3px solid #FFD54F;}
  .compare-head{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-lo); margin-bottom:10px; display:flex; justify-content:space-between;}
  .compare-sentence{ font-size:14px; line-height:1.5; margin-bottom:10px;}
  .compare-blank{ color:var(--violet); font-weight:700;}
  .compare-opts{ font-size:12px; color:var(--text-mid); display:flex; flex-wrap:wrap; gap:5px;}
  .compare-opts span{ background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:999px;}
  .compare-opts span.ans{ color:var(--green); border:1px solid var(--green); background:rgba(139,195,74,0.12);}
  .compare-word-list{ display:flex; flex-direction:column; gap:6px;}
  .compare-word{ font-size:13px; display:flex; gap:8px; align-items:center;}
  .compare-edit-link{ font-size:11px; color:#C4B5FD; margin-top:12px; cursor:pointer; display:inline-block;}

  .preview-col{ padding:22px 18px; border-left:1px solid var(--glass-brd); }
  .preview-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-lo); margin-bottom:12px;}
  .phone{ border-radius:26px; border:1px solid var(--glass-brd); background:linear-gradient(160deg, #1a1030, #0c0818); padding:18px 16px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .phone-tier{ font-size:10px; color:#FFD54F; text-align:center; margin-bottom:10px; letter-spacing:.08em;}
  .phone-q{ font-size:15px; text-align:center; line-height:1.5; margin-bottom:16px; color:var(--text-hi);}
  .phone-blank{ color:var(--violet); font-weight:700; border-bottom:2px solid var(--violet);}
  .phone-opts{ display:flex; flex-direction:column; gap:8px;}
  .phone-opt{ padding:10px; border-radius:11px; background:rgba(255,255,255,0.04); border:1px solid var(--glass-brd); text-align:center; font-size:13px;}
  .phone-opt.correct{ border-color:var(--green); color:var(--green); background:rgba(139,195,74,0.1);}
  .phone-stars{ text-align:center; margin-top:16px; font-size:18px; letter-spacing:4px; color:var(--text-lo);}
  .live-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--green); margin-top:14px;}
  .live-dot{ width:6px;height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}
  .preview-note{ font-size:11.5px; color:var(--text-lo); margin-top:14px; line-height:1.5;}

  /* ---- Dashboard ---- */
  .dash-wrap{ max-width:980px; margin:0 auto; padding:30px 30px 60px;}
  .dash-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .dash-title{ font-size:22px; font-weight:700;}
  .dash-sub{ font-size:12.5px; color:var(--text-lo); margin-top:4px;}
  .dash-section-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-lo); margin:24px 0 12px;}
  .lesson-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .lesson-card{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:16px; padding:18px 20px; cursor:pointer; transition:.15s;}
  .lesson-card:hover{ border-color:var(--glass-brd-hi); transform:translateY(-1px);}
  .lc-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .lc-name{ font-size:15.5px; font-weight:700;}
  .lc-theme{ font-size:12px; color:var(--text-lo); margin-top:2px;}
  .status-pill{ font-size:10.5px; padding:3px 10px; border-radius:999px; font-weight:600; flex-shrink:0;}
  .status-pill.published{ background:rgba(139,195,74,0.16); color:var(--green);}
  .status-pill.draft{ background:rgba(255,183,77,0.16); color:var(--orange);}
  .lc-meta{ font-size:11.5px; color:var(--text-lo); display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;}
  .lc-audio-flag{ color:var(--orange);}
  .new-lesson-card{ border:1.5px dashed var(--glass-brd); border-radius:16px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; cursor:pointer; color:var(--text-mid); padding:18px; min-height:104px;}
  .new-lesson-card:hover{ border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .new-lesson-card .plus{ font-size:22px; color:var(--violet);}

  /* ---- Modal / wizard ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(5,2,12,0.65); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50;}

<script>
const MODULES = [
  {id:'gapfill', name:'Gap-fill', pool:false, built:true},
  {id:'truefalse', name:'True / False', pool:false, built:true},
  {id:'wordmatch', name:'Word Match', pool:true, built:true},
  {id:'memorypairs', name:'Memory Pairs', pool:true, built:true},
  {id:'listenchoose', name:'Listen & Choose', pool:false, built:true},
  {id:'putinorder', name:'Put in Order', pool:false, built:true},
  {id:'sayit', name:'Say It', pool:false, built:true},
  {id:'picword', name:'Picture & Word', pool:true, built:true},
  {id:'wordscramble', name:'Word Scramble', pool:true, built:true},
  {id:'spelling', name:'Spelling', pool:true, built:true},
  {id:'listenmatch', name:'Listen & Match', pool:true, built:true},
  {id:'buildsentence', name:'Build a Sentence', pool:true, built:true},
];

// ==========================================================================
// MULTI-INSTANCE SUPPORT — the real shell allows several modules of the same
// type in one lesson (e.g. three separate "Listen & Choose" instances). The
// builder now allows that too: a lesson.modules entry is either a bare type
// slug ('gapfill', for the first/only instance of that type — preserves every
// existing lesson unchanged) or a suffixed instance id ('gapfill-2', 'gapfill-3'
// for repeats). instanceType() resolves either form back to the type slug that
// every type-dispatch switch/if-chain in this file already keys off of; the
// bare instance id itself keeps working everywhere as the LESSON_CONTENT
// storage key, since that was already just a string key with no assumption
// baked in beyond "one per lesson".
// ==========================================================================
function instanceType(id){
  return id.replace(/-\d+$/, '');
}
function instanceLabel(id){
  const type = instanceType(id);
  const catalogName = (MODULES.find(m => m.id === type) || {}).name || type;
  const suffixMatch = id.match(/-(\d+)$/);
  return suffixMatch ? `${catalogName} #${suffixMatch[1]}` : catalogName;
}
function nextInstanceId(existingIds, type){
  // First instance of a type keeps the bare slug (backward compatible with
  // every lesson authored before multi-instance existed). Repeats get -2, -3...
  if(!existingIds.includes(type)) return type;
  let n = 2;
  while(existingIds.includes(`${type}-${n}`)) n++;
  return `${type}-${n}`;
}

const FOOD_COURT_GAPFILL = {
  bronze:{ pick:1, items:[
    { sentence:'I ___ water every day.', answer:'drink', options:['drink','eat','sleep','run'],
      tokens:[{t:'I',r:'subject'},{t:'drink',r:'verb'},{t:'water',r:'object'},{t:'every day',r:'time'}] }
  ]},
  silver:{ pick:1, items:[
    { sentence:'I drink water because I feel ___.', answer:'thirsty', options:['thirsty','tired','happy','cold'],
      tokens:[{t:'I',r:'subject'},{t:'drink',r:'verb'},{t:'water',r:'object'},{t:'because',r:'connector'},{t:'I feel thirsty',r:null}] }
  ]},
  gold:{ pick:1, items:[
    { sentence:'Although it was raining, I still ___ to the bus stop.', answer:'walked', options:['walked','walk','walking','walks'],
      tokens:[{t:'Although it was raining',r:'connector'},{t:'I',r:'subject'},{t:'still walked',r:'verb'},{t:'to the bus stop',r:'place'}] }
  ]},
};

const FOOD_COURT_SPELLING = {
  bronze:[ {word:'dog',emoji:'🐕'}, {word:'cat',emoji:'🐈'}, {word:'bus',emoji:'🚌'}, {word:'book',emoji:'📚'}, {word:'rain',emoji:'🌧️'}, {word:'water',emoji:'💧'} ],
  silver:[ {word:'kitchen',emoji:'🍳'}, {word:'ticket',emoji:'🎫'}, {word:'delivery',emoji:'🛵'}, {word:'receipt',emoji:'🧾'}, {word:'napkin',emoji:'🧻'} ],
  gold:[ {word:'restaurant',emoji:'🍽️'}, {word:'convenience',emoji:'🏪'}, {word:'notification',emoji:'🔔'}, {word:'apartment',emoji:'🏢'} ],
};

// ---- Per-lesson content store. Every lesson gets its own data, not a shared global. ----
const LESSON_CONTENT = {}; // keyed by lessonId -> { gapfill?: {...}, spelling?: {...} }

function blankGapfillData(){
  const blankItem = () => ({ sentence:'', answer:'', options:['',''], tokens:[] });
  const blankTier = () => ({ pick:2, items:[blankItem()] });
  return { bronze: blankTier(), silver: blankTier(), gold: blankTier() };
}
function blankSpellingData(){
  return { bronze:[], silver:[], gold:[] };
}
function blankTrueFalseData(){
  const blankItem = () => ({ statement:'', answer:true, tokens:[] });
  const blankTier = () => ({ pick:2, items:[blankItem()] });
  return { bronze: blankTier(), silver: blankTier(), gold: blankTier() };
}
function blankPairsData(){ // Word Match & Listen & Match share this shape
  return { bronze:[], silver:[], gold:[] };
}
function blankMemoryPairsData(){
  return { allItems:[], tiers:{ bronze:{pairs:3,flipback:1500}, silver:{pairs:4,flipback:1200}, gold:{pairs:6,flipback:900} } };
}
function blankListenChooseData(){
  const blankTier = () => ({ audio:'', question:'', options:['',''], answer:'' });
  return { bronze: blankTier(), silver: blankTier(), gold: blankTier() };
}
function blankPutInOrderData(){
  const blankTier = () => ({ prompt:'', items:[] });
  return { bronze: blankTier(), silver: blankTier(), gold: blankTier() };
}
function blankSayItData(){
  const blankTier = () => ({ prompt:'', target:'' });
  return { bronze: blankTier(), silver: blankTier(), gold: blankTier() };
}
function blankPicWordData(){
  return { allItems:[], tiers:{ bronze:{mode:'word-to-image'}, silver:{mode:'image-to-word'}, gold:{mode:'cloze-image'} } };
}
function blankWordScrambleData(){
  return { bronze:[], silver:[], gold:[] };
}
function blankBuildSentenceData(){
  return { bronze:[], silver:[], gold:[] }; // each pool item is just { tokens: [...] }
}

const BLANK_DATA_BY_MODULE = {
  gapfill: blankGapfillData, spelling: blankSpellingData, truefalse: blankTrueFalseData,
  wordmatch: blankPairsData, listenmatch: blankPairsData, memorypairs: blankMemoryPairsData,
  listenchoose: blankListenChooseData, putinorder: blankPutInOrderData, sayit: blankSayItData,
  picword: blankPicWordData, wordscramble: blankWordScrambleData, buildsentence: blankBuildSentenceData,
};

// ---- "Colors Around Us" — real seed content across every module type, used to test the whole tool end to end ----
const COLORS_GAPFILL = {
  bronze:{ pick:1, items:[
    { sentence:'The apple is ___.', answer:'red', options:['red','blue','green','yellow'],
      tokens:[{t:'The apple',r:'subject'},{t:'is',r:'verb'},{t:'red',r:'object'}] }
  ]},
  silver:{ pick:1, items:[
    { sentence:'I like yellow because it is ___.', answer:'bright', options:['bright','heavy','quiet','far'],
      tokens:[{t:'I',r:'subject'},{t:'like',r:'verb'},{t:'yellow',r:'object'},{t:'because',r:'connector'},{t:'it is bright',r:null}] }
  ]},
  gold:{ pick:1, items:[
    { sentence:'Although blue is calm, my favorite color is ___.', answer:'red', options:['red','blue','green','tired'],
      tokens:[{t:'Although blue is calm',r:'connector'},{t:'my favorite color',r:'subject'},{t:'is',r:'verb'},{t:'red',r:'object'}] }
  ]},
};

const COLORS_TRUEFALSE = {
  bronze:{ pick:1, items:[
    { statement:'The sky is blue.', answer:true,
      tokens:[{t:'The sky',r:'subject'},{t:'is',r:'verb'},{t:'blue',r:'object'}] }
  ]},
  silver:{ pick:1, items:[
    { statement:'Bananas are usually purple.', answer:false,
      tokens:[{t:'Bananas',r:'subject'},{t:'are usually',r:'verb'},{t:'purple',r:'object'}] }
  ]},
  gold:{ pick:1, items:[
    { statement:'Mixing red and yellow makes orange.', answer:true,
      tokens:[{t:'Mixing red and yellow',r:'subject'},{t:'makes',r:'verb'},{t:'orange',r:'object'}] }
  ]},
};

const COLORS_WORDMATCH = {
  bronze:[ {left:'red',right:'apple'}, {left:'blue',right:'sky'}, {left:'yellow',right:'banana'} ],
  silver:[ {left:'red',right:'apple'}, {left:'blue',right:'sky'}, {left:'yellow',right:'banana'}, {left:'green',right:'leaf'} ],
  gold:[ {left:'red',right:'apple'}, {left:'blue',right:'sky'}, {left:'yellow',right:'banana'}, {left:'green',right:'leaf'}, {left:'purple',right:'grape'}, {left:'black',right:'night'} ],
};

const COLORS_LISTENMATCH = {

  silver:[ {left:'red',right:'red'}, {left:'blue',right:'blue'}, {left:'green',right:'green'}, {left:'yellow',right:'yellow'} ],
  gold:[ {left:'red',right:'red'}, {left:'blue',right:'blue'}, {left:'green',right:'green'}, {left:'yellow',right:'yellow'}, {left:'purple',right:'purple'} ],
};

const COLORS_MEMORYPAIRS = {
  allItems:[
    {word:'red',emoji:'🔴',image:null,sentence:'The apple is red.',tokens:[]},
    {word:'blue',emoji:'🔵',image:null,sentence:'The sky is blue.',tokens:[]},
    {word:'green',emoji:'🟢',image:null,sentence:'The grass is green.',tokens:[]},
    {word:'yellow',emoji:'🟡',image:null,sentence:'The sun is yellow.',tokens:[]},
    {word:'orange',emoji:'🟠',image:null,sentence:'The pumpkin is orange.',tokens:[]},
    {word:'purple',emoji:'🟣',image:null,sentence:'The grape is purple.',tokens:[]},
    {word:'black',emoji:'⚫',image:null,sentence:'The night is black.',tokens:[]},
    {word:'white',emoji:'⚪',image:null,sentence:'The cloud is white.',tokens:[]},
  ],
  tiers:{ bronze:{pairs:3,flipback:1500}, silver:{pairs:4,flipback:1200}, gold:{pairs:6,flipback:900} }

const COLORS_LISTENCHOOSE = {
  bronze:{ audio:'What color is the sun?', question:'What color is the sun?', options:['yellow','blue','black','green'], answer:'yellow' },
  silver:{ audio:'Which color means stop on a traffic light?', question:'Which color means stop on a traffic light?', options:['red','green','yellow','blue'], answer:'red' },
  gold:{ audio:'Which color do you get by mixing blue and yellow?', question:'Which color do you get by mixing blue and yellow?', options:['green','purple','orange','black'], answer:'green' },

const COLORS_PUTINORDER = {
  bronze:{ prompt:'Put the traffic light colors in order (top to bottom).', items:['red','yellow','green'] },
  silver:{ prompt:'Order the first three rainbow colors.', items:['red','orange','yellow'] },

const COLORS_SAYIT = {

const COLORS_PICWORD = {
  allItems:[
    {word:'red',emoji:'🔴',sentence:'The apple is red.',cloze:'The apple is ___.'},
    {word:'blue',emoji:'🔵',sentence:'The sky is blue.',cloze:'The sky is ___.'},
    {word:'green',emoji:'🟢',sentence:'The grass is green.',cloze:'The grass is ___.'},

const COLORS_WORDSCRAMBLE = {
  bronze:[ {word:'red',emoji:'🔴'}, {word:'blue',emoji:'🔵'}, {word:'green',emoji:'🟢'}, {word:'pink',emoji:'🩷'} ],
  silver:[ {word:'orange',emoji:'🟠'}, {word:'purple',emoji:'🟣'}, {word:'yellow',emoji:'🟡'}, {word:'brown',emoji:'🟤'} ],
  gold:[ {word:'violet',emoji:'🟣'}, {word:'indigo',emoji:'🔵'}, {word:'magenta',emoji:'🩷'}, {word:'charcoal',emoji:'⚫'} ],

const COLORS_BUILDSENTENCE = {
  bronze:[
    { tokens:[{text:'The',role:null,chunkId:0},{text:'sky',role:'subject',chunkId:1},{text:'is',role:'verb',chunkId:2},{text:'blue',role:'object',chunkId:3}] },
    { tokens:[{text:'The',role:null,chunkId:0},{text:'grass',role:'subject',chunkId:1},{text:'is',role:'verb',chunkId:2},{text:'green',role:'object',chunkId:3}] },
  ],
  silver:[
    { tokens:[{text:'I',role:'subject',chunkId:0},{text:'wear',role:'verb',chunkId:1},{text:'a',role:null,chunkId:2},{text:'red',role:null,chunkId:2},{text:'shirt',role:'object',chunkId:3},{text:'every day',role:'time',chunkId:4}] },
  ],
  gold:[
    { tokens:[{text:'I',role:'subject',chunkId:0},{text:'like',role:'verb',chunkId:1},{text:'blue',role:'object',chunkId:2},{text:'because',role:'connector',chunkId:3},{text:'it is calm',role:null,chunkId:4}] },
  ],
};

const COLORS_SPELLING = {
  bronze:[ {word:'red',emoji:'🔴'}, {word:'blue',emoji:'🔵'}, {word:'green',emoji:'🟢'}, {word:'pink',emoji:'🩷'} ],
  silver:[ {word:'orange',emoji:'🟠'}, {word:'purple',emoji:'🟣'}, {word:'yellow',emoji:'🟡'}, {word:'brown',emoji:'🟤'} ],
  gold:[ {word:'turquoise',emoji:'🔵'}, {word:'maroon',emoji:'🔴'}, {word:'lavender',emoji:'🟣'} ],
};

function seedColorsContent(lesson){
  const content = {};
  const seeds = {
    gapfill: COLORS_GAPFILL, truefalse: COLORS_TRUEFALSE, wordmatch: COLORS_WORDMATCH, listenmatch: COLORS_LISTENMATCH,
    memorypairs: COLORS_MEMORYPAIRS, listenchoose: COLORS_LISTENCHOOSE, putinorder: COLORS_PUTINORDER, sayit: COLORS_SAYIT,
    picword: COLORS_PICWORD, wordscramble: COLORS_WORDSCRAMBLE, buildsentence: COLORS_BUILDSENTENCE, spelling: COLORS_SPELLING,
  };
  // Seed data is per TYPE (there's only ever one canned "Colors" example per module type) but
  // gets stored under the real instance id, so a repeat instance still gets its own blank slate
  // via the fallback below rather than silently sharing the first instance's seeded content.
  lesson.modules.forEach(m => { const t = instanceType(m); if(seeds[t] !== undefined && m === t) content[m] = seeds[t]; });
  return content;
}

function ensureLessonContent(lessonId){
  if(LESSON_CONTENT[lessonId]) return;
  const lesson = LESSONS.find(l => l.id === lessonId);
  let content = {};
  if(lessonId === 'food-court'){
    content.gapfill = FOOD_COURT_GAPFILL;
    content.spelling = FOOD_COURT_SPELLING;
  } else if(lessonId === 'colors' && lesson){
    content = seedColorsContent(lesson);
  }
  // Any module in this lesson's list that wasn't explicitly seeded above still needs SOME data,
  // or opening that module's screen crashes trying to read undefined. Fill the gaps with blanks —
  // keyed by real instance id, using the resolved type to pick the right blank shape.
  if(lesson){
    lesson.modules.forEach(m => {
      const t = instanceType(m);
      if(content[m] === undefined && BLANK_DATA_BY_MODULE[t]) content[m] = BLANK_DATA_BY_MODULE[t]();
    });
  }
  LESSON_CONTENT[lessonId] = content;
}

function gd(){ // gap-fill data for whichever lesson is currently open
  ensureLessonContent(currentLessonId);
  return LESSON_CONTENT[currentLessonId].gapfill;
}
function sd(){ // spelling data for whichever lesson is currently open
  ensureLessonContent(currentLessonId);
  return LESSON_CONTENT[currentLessonId].spelling;
}
function md(moduleId){ // generic: any module's data for whichever lesson is currently open
  ensureLessonContent(currentLessonId);
  return LESSON_CONTENT[currentLessonId][moduleId];
}

let currentLessonId = 'food-court';
let currentModule = 'gapfill';
let currentTier = 'bronze';
let compareMode = false;
let gfExpandedIndex = 0; // which pool item's full editor (sentence/options/tags) is open
let tfExpandedIndex = 0; // same, for true-false's statement pool

function isTierFilled(moduleId, tier, dataOverride){
  const data = dataOverride !== undefined ? dataOverride : md(moduleId);
  if(!data) return false;
  const type = instanceType(moduleId);
  try{
    switch(type){
      case 'gapfill': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.sentence && it.answer && it.options.some(o=>o)); }
      case 'truefalse': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.statement); }
      case 'listenchoose': { const d=data[tier]; return !!(d.question && d.answer); }
      case 'sayit': return !!data[tier].target;
      case 'putinorder': { const d=data[tier]; return d.items.length>=2 && d.items.every(it=>it) && !!d.prompt; }
      case 'wordmatch': case 'listenmatch':
        return data[tier].length>=1 && data[tier].every(p=>p.left && p.right);
      case 'spelling': case 'wordscramble':
        return data[tier].length>=1 && data[tier].every(it=>it.word);
      case 'buildsentence':
        return data[tier].length>=1 && data[tier].every(it=>it.tokens.length>=1);
      case 'memorypairs': case 'picword':
        return data.allItems.length>=1; // shared pool — same fill status for every tier
      default: return false;
    }
  }catch(e){ return false; }
}

function renderSidebar(){
  const list = document.getElementById('modList');
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  // Preserve the order the teacher actually chose in the New Lesson wizard (lesson.modules),
  // not MODULES' fixed catalog order — reordering there was supposed to mean something.
  // Each entry is an instance id (bare type slug for the first of a type, 'type-2' etc for
  // repeats) — keep the real id for selection/storage, resolve display name via instanceLabel.
  const included = lesson
    ? lesson.modules.map(id => ({ id, name: instanceLabel(id) }))
    : MODULES.map(m => ({ id: m.id, name: m.name }));
  list.innerHTML = included.map((m,i)=>{
    const dots = ['bronze','silver','gold'].map(t=>`<span class="dot ${isTierFilled(m.id,t)?'filled':''}" title="${t}"></span>`).join('');
    return `
    <li class="mod-item ${m.id===currentModule?'active':''}" onclick="selectModule('${m.id}')">
      <span class="mod-num">${String(i+1).padStart(2,'0')}</span> ${m.name}
      <span class="mod-progress">${dots}</span>
    </li>`;
  }).join('');
}

const LIVE_FLAGS = {}; // keyed by "gapfill-<tier>-sentence" -> {text, lesson, module, tier}

// ---- Token editor state: per-scope list of {text, role, chunkId}, one entry per WORD.
// Adjacent entries sharing a chunkId render as one merged pill. A "scope" identifies which field
// is being tagged (e.g. gap-fill's sentence, True/False's statement, one Build-a-Sentence item) so
// the same generic editor can attach to any of them without state bleeding between fields. ----
const LIVE_TOKENS = {}; // keyed by scope string -> [{text, role, chunkId}]
let selectedChunkIds = new Set();
let chunkIdCounter = 1;
function newChunkId(){ return chunkIdCounter++; }
let activeTokenScope = null; // which scope the visible token editor is currently bound to
let onTokenEditorChange = null; // optional callback other module forms can set to react when tags change

function flattenTokens(tokens){
  // Each original phrase (e.g. "every day") keeps its words grouped under one chunkId,
  // so it still renders as a single merged pill by default.
  const out = [];
  (tokens || []).forEach(tk => {
    const cid = newChunkId();
    tk.t.split(/\s+/).forEach(w => out.push({ text: w, role: tk.r, chunkId: cid }));
  });
  return out;
}

function tokenKey(tier, itemIndex){ return currentLessonId + '::gapfill::' + tier + (itemIndex!=null?'::'+itemIndex:''); }

function ensureLiveTokens(tier, itemIndex){
  const key = tokenKey(tier, itemIndex);
  if(!LIVE_TOKENS[key]) LIVE_TOKENS[key] = flattenTokens(gd()[tier].items[itemIndex].tokens);
}

function ensureLiveTokensForScope(scope, initialTokens){
  if(!LIVE_TOKENS[scope]) LIVE_TOKENS[scope] = flattenTokens(initialTokens);
}

function normWord(w){
  return w.toLowerCase().replace(/[.,!?;:"'()]+$/, '').replace(/^[.,!?;:"'()]+/, '');
}

function fillBlank(sentence, answer){
  // "___" is a display convention for the blank — never send it to a speech engine as-is,
  // since it gets read literally (spelled out or as a long pause of underscores).
  if(answer && sentence.includes('___')) return sentence.replace('___', answer);
  return sentence;
}

function rebuildTokensFromSentence(tier, itemIndex, sentenceText, answer){
  rebuildTokensForScope(tokenKey(tier, itemIndex), fillBlank(sentenceText, answer));
}

function rebuildTokensForScope(scope, displaySentence){
  const newWords = displaySentence.split(/\s+/).filter(Boolean);
  const prev = LIVE_TOKENS[scope] || [];
  LIVE_TOKENS[scope] = newWords.map((w, i) => {
    // Same word (ignoring case/trailing punctuation), same position → keep its role AND chunkId,
    // so existing merges survive edits elsewhere in the sentence — and survive punctuation-only changes too
    if(prev[i] && normWord(prev[i].text) === normWord(w)) return { text: w, role: prev[i].role, chunkId: prev[i].chunkId };
    // Changed or new word → starts untagged, and breaks out of whatever chunk it used to belong to
    return { text: w, role: null, chunkId: newChunkId() };
  });
}

function getChunks(scope){
  const tokens = LIVE_TOKENS[scope] || [];
  const chunks = [];
  let i = 0;
  while(i < tokens.length){
    let j = i;
    while(j + 1 < tokens.length && tokens[j+1].chunkId === tokens[i].chunkId) j++;
    chunks.push({ chunkId: tokens[i].chunkId, role: tokens[i].role, words: tokens.slice(i, j+1).map(t=>t.text), startIndex: i, endIndex: j });
    i = j + 1;
  }
  return chunks;
}

function handleChipClick(e, chunkId){
  if(e && e.shiftKey){
    if(selectedChunkIds.has(chunkId)) selectedChunkIds.delete(chunkId);
    else selectedChunkIds.add(chunkId);
  } else {
    selectedChunkIds = new Set([chunkId]);
  }
  renderTokenEditor();
}

function assignRole(role){
  if(selectedChunkIds.size === 0 || !activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId));
  chunks.forEach(c => {
    for(let k = c.startIndex; k <= c.endIndex; k++) LIVE_TOKENS[activeTokenScope][k].role = role;
  });
  selectedChunkIds = new Set();
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function mergeSelected(){
  if(!activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId)).sort((a,b)=>a.startIndex-b.startIndex);
  if(chunks.length < 2) return;
  const contiguous = chunks.every((c,i) => i===0 || c.startIndex === chunks[i-1].endIndex + 1);
  if(!contiguous) return;
  const newId = newChunkId();
  const role = chunks[0].role;
  for(let k = chunks[0].startIndex; k <= chunks[chunks.length-1].endIndex; k++){
    LIVE_TOKENS[activeTokenScope][k].chunkId = newId;
    LIVE_TOKENS[activeTokenScope][k].role = role;
  }
  selectedChunkIds = new Set([newId]);
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function splitSelected(){
  if(!activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId));
  if(chunks.length !== 1 || chunks[0].words.length < 2) return;
  const c = chunks[0];
  for(let k = c.startIndex; k <= c.endIndex; k++) LIVE_TOKENS[activeTokenScope][k].chunkId = newChunkId();
  selectedChunkIds = new Set();
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function renderTokenEditor(scope){
  if(scope) activeTokenScope = scope;
  const el = document.getElementById('tokenEditor');
  const actionsEl = document.getElementById('tokenActions');
  if(!el || !activeTokenScope) return;
  const chunks = getChunks(activeTokenScope);

  el.innerHTML = chunks.map(c => `
    <div class="chip ${c.role || 'connector'} ${selectedChunkIds.has(c.chunkId) ? 'chip-selected' : ''}" onclick="handleChipClick(event, ${c.chunkId})">${c.words.join(' ')}</div>
  `).join('') || '<span style="color:var(--text-lo);font-size:12.5px;">Type above to tag its words.</span>';

  if(!actionsEl) return;
  const selected = chunks.filter(c => selectedChunkIds.has(c.chunkId)).sort((a,b)=>a.startIndex-b.startIndex);
  let html = '';
  if(selected.length >= 2){
    const contiguous = selected.every((c,i) => i===0 || c.startIndex === selected[i-1].endIndex + 1);
    html = contiguous
      ? `<span class="token-action-link" onclick="mergeSelected()">🔗 Merge into one pill</span>`
      : `<span class="token-action-hint">Select adjacent words to merge them</span>`;
  } else if(selected.length === 1 && selected[0].words.length > 1){
    html = `<span class="token-action-link" onclick="splitSelected()">✂ Split into separate words</span>`;
  } else if(selected.length === 1){
    html = `<span class="token-action-hint">Shift-click an adjacent word to merge with it</span>`;
  }
  actionsEl.innerHTML = html;
}

function updatePreviewLive(){
  if(currentModule!=='gapfill' || compareMode) return;
  const sentence = document.getElementById('gfSentence').value;
  const d = gd()[currentTier].items[gfExpandedIndex];
  d.sentence = sentence; // persist immediately — content should never be lost just by switching tiers/modules
  let options = [], answer = '';
  document.querySelectorAll('#gfOptions .opt-row').forEach((r, i)=>{
    const val = r.querySelector('input').value;
    options.push(val);
    if(r.querySelector('.opt-tag').classList.contains('is-correct')) answer = val;

    // Per-option audio check — each option word is its own speakable field, flagged independently
    const icon = r.querySelector('.opt-audio-icon');
    if(icon) syncSpeakableField('gapfill', 'option', i, val, icon, undefined, currentTier, gfExpandedIndex);
  });
  d.options = options; // persist immediately, same reasoning as the sentence above
  d.answer = answer;

  // Tag editor works off the blank-filled sentence, so the answer word is taggable instead of "___"
  ensureLiveTokens(currentTier, gfExpandedIndex);
  rebuildTokensFromSentence(currentTier, gfExpandedIndex, sentence, answer);
  const scope = tokenKey(currentTier, gfExpandedIndex);
  onTokenEditorChange = () => { d.tokens = getChunks(scope).map(c=>({t:c.words.join(' '), r:c.role})); };
  renderTokenEditor(scope);
  onTokenEditorChange(); // also persist on every keystroke, not just on explicit tag/merge/split actions

  // Compare live text to the audio-recorded baseline (separate from content) — this is the hash-mismatch check in miniature
  const statusEl = document.getElementById('gfAudioStatus');
  const needs = syncSpeakableField('gapfill', 'sentence', null, sentence, null, answer, currentTier, gfExpandedIndex);
  setAudioStatusBadge(statusEl, needs);

  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <div class="phone-tier">${currentTier.toUpperCase()}</div>
    <div class="phone-q">${sentence.replace('___','<span class="phone-blank">___</span>') || '<span style="color:var(--text-lo);">Type a sentence…</span>'}</div>

}

// ---- Global word bank — one entry per concept, shared across every lesson. ----
// Picking from it copies word+emoji+sentence in as an editable starting point (never a live link).
// Audio reuse across lessons happens separately, via exact-text matching in GLOBAL_AUDIO_LIBRARY.
let WORD_BANK = [];
let wordBankSeeded = false;
let bankIdCounter = 1;

function seedWordBankFromColors(){
  if(wordBankSeeded) return;
  wordBankSeeded = true;
  ensureLessonContent('colors');
  const content = LESSON_CONTENT['colors'];
  const byWord = {}; // dedupe by lowercase word text

  function addCandidate(word, emoji, sentence){
    if(!word) return;
    const key = word.toLowerCase();
    if(byWord[key]) return; // keep the first one seen
    byWord[key] = { id: 'bank-'+(bankIdCounter++), word, emoji: emoji||'', sentence: sentence||'' };
  }

  if(content.spelling) Object.values(content.spelling).flat().forEach(it => addCandidate(it.word, it.emoji));
  if(content.wordscramble) Object.values(content.wordscramble).flat().forEach(it => addCandidate(it.word, it.emoji));
  if(content.memorypairs) content.memorypairs.allItems.forEach(it => addCandidate(it.word, it.emoji, it.sentence));
  if(content.picword) content.picword.allItems.forEach(it => addCandidate(it.word, it.emoji, it.sentence));

  WORD_BANK = Object.values(byWord);
}
function getWordBank(){ return WORD_BANK; }

function pickFromBank(id){
  const entry = WORD_BANK.find(e => e.id === id);
  if(entry && wordBankOnSelect) wordBankOnSelect({ word: entry.word, emoji: entry.emoji, sentence: entry.sentence });
  closeWordBankPicker();

function addNewToBankAndPick(){
  const word = wordBankSearchTerm.trim();
  if(!word) return;
  const existing = WORD_BANK.find(e => e.word.toLowerCase() === word.toLowerCase());
  if(existing){ pickFromBank(existing.id); return; }
  const entry = { id: 'bank-'+(bankIdCounter++), word, emoji:'', sentence:'' };
  WORD_BANK.push(entry);
  if(wordBankOnSelect) wordBankOnSelect({ word: entry.word, emoji: entry.emoji, sentence: entry.sentence });
  closeWordBankPicker();
}

let audioModalContext = null;
let audioModalOverriding = false; // true once "generate different for this lesson" is chosen for the current modal session

// ---- Global audio library: same text + same persona = same audio, reused across every lesson. ----
// This is the actual payoff of the word bank — pick "water" from the bank, and if it already has
// audio from another lesson, you get it for free instead of generating (and paying for) it again.
const GLOBAL_AUDIO_LIBRARY = {}; // keyed by normalized text + persona -> {text, persona, firstLesson, generatedAt}
const AUDIO_OVERRIDES = new Set(); // flagKeys that deliberately opted OUT of shared audio for this one field

function audioLibKey(text, persona){ return (text||'').trim().toLowerCase() + '::' + persona; }
function findGlobalAudio(text, persona){ return GLOBAL_AUDIO_LIBRARY[audioLibKey(text, persona)]; }
function registerGlobalAudio(text, persona, lessonName){
  const key = audioLibKey(text, persona);
  if(!GLOBAL_AUDIO_LIBRARY[key]) GLOBAL_AUDIO_LIBRARY[key] = { text, persona, firstLesson: lessonName, generatedAt: Date.now() };
}

function buildFlagKey(moduleId, tier, fieldType, index, itemIndex){
  return currentLessonId+'::'+moduleId+'::'+tier+'::'+fieldType+(itemIndex!=null?'.item'+itemIndex:'')+(index!=null?index:'');
}

// ---- Audio-recorded baseline: SEPARATE from live content on purpose. ----
// Live content (LESSON_CONTENT) updates immediately as a teacher types, so nothing is ever lost
// switching tiers/modules. This baseline only updates when audio is actually generated & accepted —
// it answers "what text did we last generate audio for," not "what does the field currently say."
const AUDIO_RECORDED = {}; // keyed by lessonId -> moduleId -> (mirrors that module's data shape, text fields only)

function ensureAudioRecorded(lessonId){
  if(AUDIO_RECORDED[lessonId]) return;
  if(lessonId === 'food-court'){
    // Food Court is treated as an existing, previously-published lesson — its original seed content
    // already has real audio in production, so that's the starting baseline.
    AUDIO_RECORDED[lessonId] = {
      gapfill: JSON.parse(JSON.stringify(FOOD_COURT_GAPFILL)),
      spelling: JSON.parse(JSON.stringify(FOOD_COURT_SPELLING)),
    };
  } else {
    // Everything else (Colors, wizard-created lessons) is freshly authored — nothing has audio yet,
    // honestly, until a teacher generates it. Starts empty; every module falls back to '' below.
    AUDIO_RECORDED[lessonId] = {};
  }
}

function getBaselineValue(moduleId, tierKey, fieldType, index, itemIndex){
  ensureAudioRecorded(currentLessonId);
  const data = AUDIO_RECORDED[currentLessonId][moduleId];
  if(!data) return '';
  const tier = data[tierKey];
  const type = instanceType(moduleId);
  try{
    switch(type){
      case 'gapfill': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return fieldType==='sentence' ? (it && it.sentence || '') : (it && it.options && it.options[index] || '');
      }
      case 'truefalse': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return (it && it.statement) || '';
      }
      case 'listenchoose': return (tier && tier.question) || '';
      case 'sayit': return (tier && tier.target) || '';
      case 'putinorder': return (tier && tier.items && tier.items[index]) || '';
      case 'wordmatch': case 'listenmatch':
        if(!tier || !tier[index]) return '';
        return fieldType==='pairLeft' ? (tier[index].left||'') : (tier[index].right||'');
      case 'spelling': case 'wordscramble':
        return (tier && tier[index] && tier[index].word) || '';
      case 'memorypairs': case 'picword':
        return (data.allItems && data.allItems[index] && data.allItems[index].word) || '';
      case 'buildsentence':
        return (tier && tier[index] && tier[index]._recordedSpoken) || '';
      default: return '';
    }
  }catch(e){ return ''; }
}

function setBaselineValue(lessonId, moduleId, tierKey, fieldType, index, value, itemIndex){
  ensureAudioRecorded(lessonId);
  if(!AUDIO_RECORDED[lessonId][moduleId]) AUDIO_RECORDED[lessonId][moduleId] = {};
  const data = AUDIO_RECORDED[lessonId][moduleId];
  const ensureTier = (shape) => { if(!data[tierKey]) data[tierKey] = shape; return data[tierKey]; };
  const type = instanceType(moduleId);
  switch(type){
    case 'gapfill': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = { options:[] };
      if(fieldType==='sentence') t.items[ii].sentence = value;
      else { if(!t.items[ii].options) t.items[ii].options = []; t.items[ii].options[index] = value; }
      break;
    }
    case 'truefalse': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = {};
      t.items[ii].statement = value;
      break;
    }
    case 'listenchoose': ensureTier({}).question = value; break;
    case 'sayit': ensureTier({}).target = value; break;
    case 'putinorder': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      t.items[index] = value;
      break;
    }
    case 'wordmatch': case 'listenmatch': {
      const t = ensureTier([]);
      if(!t[index]) t[index] = {};
      if(fieldType==='pairLeft') t[index].left = value; else t[index].right = value;
      break;
    }
    case 'spelling': case 'wordscramble': {
      const t = ensureTier([]);
      if(!t[index]) t[index] = {};
      t[index].word = value;
      break;
    }
    case 'memorypairs': case 'picword': {
      if(!data.allItems) data.allItems = [];
      if(!data.allItems[index]) data.allItems[index] = {};
      data.allItems[index].word = value;
      break;
    }
    case 'buildsentence': {
      const t = ensureTier([]);
      if(!t[index]) t[index] = {};
      t[index]._recordedSpoken = value;
      break;
    }
  }
}

function speakableModuleName(moduleId){
  return instanceLabel(moduleId);
}

// Called from every module's live-edit handlers to keep a field's 🔊 icon and the Audio Polish
// backlog in sync with whatever's currently typed — the same mechanism Gap-fill pioneered, generalized.
function syncSpeakableField(moduleId, fieldType, index, liveText, iconEl, answer, tierOverride, itemIndex){
  const tier = tierOverride || currentTier;
  const lessonName = (LESSONS.find(l=>l.id===currentLessonId) || {}).name || currentLessonId;
  const recorded = getBaselineValue(moduleId, tier, fieldType, index, itemIndex);
  const key = buildFlagKey(moduleId, tier, fieldType, index, itemIndex);
  const needs = (liveText !== recorded) || liveText === '';
  const overridden = !needs && AUDIO_OVERRIDES.has(key);
  if(iconEl){
    iconEl.className = iconEl.className.replace(/\b(ok|needs|overridden)\b/g, '').trim() + ' ' + (needs ? 'needs' : (overridden ? 'overridden' : 'ok'));
    iconEl.title = needs ? 'Needs new audio' : (overridden ? 'Custom audio for this lesson only' : 'Audio matches');
  }
  if(needs && liveText){
    LIVE_FLAGS[key] = {
      text: liveText, spokenText: fillBlank(liveText, answer), lesson:lessonName, module: speakableModuleName(moduleId),
      tier: tier==='shared' ? 'All tiers' : tier.charAt(0).toUpperCase()+tier.slice(1),
      lessonId: currentLessonId, tierKey: tier, moduleId, fieldType, optionIndex: index, itemIndex
    };
  } else {
    delete LIVE_FLAGS[key];
  }
  renderAudioPolish();
  return needs;
}

function setAudioStatusBadge(el, needs){
  el.className = 'audio-status ' + (needs ? 'needs' : 'ok');
  el.textContent = needs ? '⚠ needs new audio' : '✓ audio matches';
}

function openFieldAudioModal(moduleId, fieldType, index, text, tierOverride, itemIndex){
  const tier = tierOverride || currentTier;
  openAudioGenerator({
    source:'live', key: buildFlagKey(moduleId, tier, fieldType, index, itemIndex), text, spokenText: text, persona:'Teaching',
    lessonId: currentLessonId, tierKey: tier, fieldType, optionIndex: index, moduleId, itemIndex
  });
}

function resolveAudioContext(ctx, opts){
  opts = opts || {};
  if(ctx.source === 'live'){
    delete LIVE_FLAGS[ctx.key];
    // Update the "recorded" baseline for the field's OWN lesson (not necessarily the one currently open),
    // so this text no longer re-flags itself as needing audio next time that lesson is edited.
    if(ctx.lessonId && ctx.tierKey && ctx.fieldType && ctx.moduleId){
      setBaselineValue(ctx.lessonId, ctx.moduleId, ctx.tierKey, ctx.fieldType, ctx.optionIndex, ctx.text, ctx.itemIndex);
    }
    // Register into the shared library so other lessons using this exact text+voice get it for free —
    // unless this was a deliberate "different audio just for this lesson" override, which should stay local.
    if(!opts.isOverride){
      const lessonName = (LESSONS.find(l=>l.id===ctx.lessonId) || {}).name || ctx.lessonId;
      registerGlobalAudio(ctx.spokenText || ctx.text, ctx.persona, lessonName);
    }
    if(ctx.lessonId === currentLessonId) renderMain(); // refresh whatever's currently on screen so its icon reflects the resolution
  } else if(ctx.source === 'seeded'){
    const idx = AUDIO_BACKLOG.findIndex(x => x.id === ctx.key);
    if(idx > -1) AUDIO_BACKLOG.splice(idx, 1);
  }
  renderAudioPolish();
}

// ==========================================================================================
// PUBLISH SCHEMA TRANSFORMER — v2, corrected against lesson-shell-v1_3.html directly
//
// What changed from v1: the previous transform produced {questions:[t0,t1,t2]} / {tiers:[...]}
// — an index-ordered ARRAY per module. The real shell's LESSON const uses a tier-NAME-KEYED
// object instead: { id, type, label, data: { bronze:{...}, silver:{...}, gold:{...} } }, and
// module "type" strings are hyphenated (gap-fill, not gapfill). This version matches that.
//
// Known, deliberately NOT solved here (flagged, not silently patched over):
//   1. Multiple instances of the same module type in one lesson (the real shell's example
//      lesson has three separate 'audio-understanding' modules) — the builder still only
//      supports one instance per type. Fixing that is a UI-level change, not a transform fix.
//   2. Per-field parity for every module beyond what's visible in the one real example lesson
//      inspected — e.g. whether 'audio-speaking' needs a keyWords array wasn't re-verified
//      field-by-field here, to avoid guessing new mistakes on top of old ones.
// ==========================================================================================

const TIER_ORDER = ['bronze','silver','gold'];

// Internal builder id -> real shell type string (confirmed from lesson-shell-v1_3.html)
const SHELL_TYPE_MAP = {
  gapfill:       'gap-fill',
  truefalse:     'true-false',
  listenchoose:  'audio-understanding',
  sayit:         'audio-speaking',
  putinorder:    'sequencing',
  wordmatch:     'word-match',
  listenmatch:   'audio-match',
  wordscramble:  'word-scramble',
  spelling:      'spelling',
  buildsentence: 'sentence-building',
  memorypairs:   'memory-pairs',
  picword:       'image-vocab',
};

// pushedAudioIds: Set of ids (from lessons/{lessonId}/manifest.json, status==='pushed') that
// the TTS tool has actually generated and pushed real audio for. Ids here use the exact same
// '{moduleId}.{tier}.{field}' scheme as extractSpeakableForTTS() — that's what makes the match
// work at all. Only 9 module types are confirmed to have real audio playback in the shell ever
// get an audioFile attached; truefalse/putinorder/wordmatch never will (unverified against
// shell-v2 though — see extractSpeakableForTTS note). gapfill WAS in this excluded list but is
// confirmed wrong — it has a real audio call site (reinforcement panel), fixed.
// Same algorithm as the TTS tool's slugForFilename() — MUST stay identical, since both sides
// independently construct the same file path: the TTS tool when it pushes the mp3, this
// transform when it writes the shell's audioFile reference. 'id' (used in pushedAudioIds
// matching) stays untouched; the slug is purely a human-readable prefix for browsing the repo.
function slugForFilename(text){
  return (text || '')
    .toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[^a-z0-9\s]/g, '')
    .trim()
    .split(/\s+/)
    .slice(0, 4)
    .join('-')
    .slice(0, 40) || 'audio';
}

function transformModuleForPublish(moduleId, data, pushedAudioIds){
  const type = instanceType(moduleId);
  const pushed = pushedAudioIds || new Set();
  const audioFor = (fieldKey, text) => {
    const id = `${moduleId}.${fieldKey}`;
    return pushed.has(id) ? `audio/${slugForFilename(text)}--${id}.mp3` : undefined;
  };

  switch(type){
    case 'gapfill':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          sentence: it.sentence, answer: it.answer, options: it.options, tokens: it.tokens,
          audioFile: audioFor(`${t}.item${i}.sentence`, it.sentence),
        }))
      }]));

    case 'truefalse':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          statement: it.statement, answer: it.answer, tokens: it.tokens,
          audioFile: audioFor(`${t}.item${i}.statement`, it.statement),
        }))
      }]));

    case 'listenchoose':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        audio: data[t].audio || data[t].question, question: data[t].question,
        options: data[t].options, answer: data[t].answer,
        audioFile: audioFor(`${t}.audio`, data[t].audio),
      }]));

    case 'sayit':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        prompt: data[t].prompt, target: data[t].target, keyWords: data[t].keyWords || [],
        audioFile: audioFor(`${t}.target`, data[t].target),
      }]));

    case 'putinorder':
      // "items" is the shuffled display order at runtime — we hand over the correct order for
      // both; the live module's own safeShuffle() does the actual shuffling client-side.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        prompt: data[t].prompt, items: [...data[t].items], correct: [...data[t].items]
      }]));

    case 'wordmatch':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pairs: data[t].map(p => ({ left: p.left, right: p.right }))
      }]));

    case 'listenmatch':
      // CORRECTED against the real shell: audio-match reads pair.audio and pair.text, not
      // pair.left/pair.right — that was the wordmatch-shaped default, carried over incorrectly.
      // Internally left===right always for this module (an audio-echo match), so either value
      // works for both fields.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pairs: data[t].map((p,i) => ({ audio: p.left, text: p.left, audioFile: audioFor(`${t}.pair${i}`, p.left) }))
      }]));

    case 'wordscramble':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        items: data[t].map((it,i) => {
          const o = { word: it.word };
          if(it.emoji) o.emoji = it.emoji;
          // Unconditional, not "if truthy": showReinforcePanel() calls item.sentence.replace(...)
          // on every correct answer with no null-check — an empty string is safe, undefined is a
          // hard crash for the student mid-lesson.
          o.sentence = it.sentence || '';
          if(it.clozeWord) o.clozeWord = it.clozeWord;
          if(it.tokens && it.tokens.length) o.tokens = it.tokens;
          o.audioFile = audioFor(`${t}.item${i}.word`, it.word);
          if(it.sentence) o.sentenceAudioFile = audioFor(`${t}.item${i}.sentence`, it.sentence);
          return o;
        })
      }]));

    case 'spelling':
      // 'sentence' was missing entirely before — spelling's own render() doesn't destructure it,
      // but it hands the whole item to showReinforcePanel() on a correct answer, which calls
      // item.sentence.replace(...) unconditionally. Omitting it was a real crash waiting to
      // happen the first time a student spelled a word correctly.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        items: data[t].map((it,i) => ({
          word: it.word,
          emoji: it.emoji || undefined,
          sentence: it.sentence || '',
          tokens: (it.tokens && it.tokens.length) ? it.tokens : null,
          audioFile: audioFor(`${t}.item${i}.word`, it.word),
          sentenceAudioFile: it.sentence ? audioFor(`${t}.item${i}.sentence`, it.sentence) : undefined,
        }))
      }]));

    case 'buildsentence':
      // Each chip is its own token here — unlike Gap-fill/True-False, chips aren't merged into
      // phrases, since every chip is individually draggable in the live module.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        items: data[t].map((it,i) => ({
          tokens: it.tokens.map(tk => ({ text: tk.text, role: tk.role })),
          audioFile: audioFor(`${t}.item${i}.sentence`, it.tokens.map(tk => tk.text).join(' ')),
        }))
      }]));

    case 'memorypairs':
      // CORRECTED against the real shell example: the shell wants { bronze:{items:[...]},
      // silver:{items:[...]}, gold:{items:[...]} } — plain per-tier item arrays. It does NOT
      // read a shared allItems pool or a per-tier pairs-count/flipback config at all; its
      // render() hardcodes `const PAIRS = 4` regardless of tier, and the real example lesson
      // gives every tier the IDENTICAL full item list, letting that hardcoded draw-4 do the
      // difficulty scaling implicitly. So: same full list into every tier, matching real
      // behavior — NOT the { allItems, tiers:{pairs,flipback} } shape used previously, which
      // doesn't correspond to anything the shell actually reads.
      // KNOWN GAP: the authoring tool's tiers[t].pairs/flipback fields are consequently unused
      // by the shell as it exists today — either the shell needs updating to honor them, or
      // the authoring UI should stop implying they do anything, but that's a product decision,
      // not something to silently paper over here.
      return Object.fromEntries(TIER_ORDER.map((t,ti) => [t, {
        items: data.allItems.map((it,i) => ({
          word: it.word, emoji: it.emoji, image: it.image ?? null, sentence: it.sentence,
          audioFile: audioFor(`shared.item${i}.word`, it.word),
          sentenceAudioFile: it.sentence ? audioFor(`shared.item${i}.sentence`, it.sentence) : undefined,
        }))
      }]));

    case 'picword': {
      // Also corrected to the real per-tier { mode, items } shape (not allItems+tiers).
      // 'mode' comes straight from the authoring tiers[t] config — that part was already right.
      // KNOWN GAP: cloze-image mode in the real shell wants an items[].word that's the CLOZE
      // ANSWER (e.g. the verb "runs" for "The dog ___ in the park."), which can legitimately
      // differ from the item's base vocabulary word (e.g. "dog"). The authoring tool only
      // stores one 'cloze' sentence field per item, with no separate answer-word field — so
      // this assumes the vocab word IS the cloze answer (true for the Colors demo content,
      // not guaranteed true in general). A real fix needs a clozeAnswer field added to the
      // authoring UI, not a transformer workaround.
      return Object.fromEntries(TIER_ORDER.map((t,ti) => {
        const mode = data.tiers[t].mode;
        const isCloze = mode === 'cloze-image';
        return [t, {
          mode,
          items: data.allItems.map((it,i) => isCloze
            ? { word: it.word, emoji: it.emoji, image: null, sentence: it.cloze || it.sentence,
                audioFile: audioFor(`shared.item${i}.word`, it.word) }
            : { word: it.word, emoji: it.emoji, image: null, sentence: it.sentence,
                audioFile: audioFor(`shared.item${i}.word`, it.word) }
          )
        }];
      }));
    }

    default:
      return null;
  }
}

function transformLessonForPublish(lessonId, pushedAudioIds){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return null;
  const content = LESSON_CONTENT[lessonId];
  // Each entry in lesson.modules is now either a bare type slug (first/only instance,
  // e.g. 'gapfill') or a suffixed instance id ('gapfill-2') for repeats — instanceType()
  // resolves either back to the type for SHELL_TYPE_MAP/label lookups, while 'id' below
  // stays the raw instance id, giving every module instance the unique id the real shell
  // needs (matching how mod-1/mod-2/mod-3 are three distinct audio-understanding instances).
  return lesson.modules.map(moduleId => ({
    id: moduleId,
    type: SHELL_TYPE_MAP[instanceType(moduleId)] || instanceType(moduleId),
    label: instanceLabel(moduleId),
    data: transformModuleForPublish(moduleId, content[moduleId], pushedAudioIds),
  }));
}

// ==========================================================================================
// BRIDGE TO THE TTS TOOL — closes the gap that's been open since we first built the audio
// pipeline: content authored here has had no path into tts-tool-v4 except manual retyping.
// This walks the REAL content shape (post multi-instance fix) and produces exactly the JSON
// shape tts-tool-v4's confirmImport() expects: { lesson, assets:[{id,text,voice,emotion,status,file}] }.
//
// Ids are DETERMINISTIC — '{instanceId}.{tier}.{field}' — not random. That matters: tts-tool's
// import is merge-aware (added for this), so re-exporting after editing one sentence only
// resets that one line to 'pending'; every other line's already-approved or pushed audio is
// left alone, because its id and text didn't change.
//
// Deliberately NOT extracted: 'putinorder' (Sequencing) and 'wordmatch' (Word Match). Verified
// directly against lesson-shell-v1_3.html — neither module has any speak()/TTS call site at
// all, so generating audio for them would spend ElevenLabs credits on lines that can never
// actually play. If the shell ever gains audio for these, add their cases below.
// ==========================================================================================

function stripHtmlForSpeech(s){
  return (s || '').replace(/<[^>]+>/g, '').trim();
}

function extractSpeakableForTTS(lessonId){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return [];
  const content = LESSON_CONTENT[lessonId];
  const items = [];
  const add = (instId, fieldKey, text) => {
    const clean = stripHtmlForSpeech(text);
    if(clean) items.push({ id: `${instId}.${fieldKey}`, text: clean });
  };

  lesson.modules.forEach(instId => {
    const type = instanceType(instId);
    const data = content[instId];
    if(!data) return;

    if(type === 'listenchoose'){
      // Only 'audio' is ever fed to the shell's speak() here — 'question' is on-screen text only.
      TIER_ORDER.forEach(t => add(instId, `${t}.audio`, data[t] && data[t].audio));
    } else if(type === 'sayit'){
      // Only 'target' drives playModel() — 'prompt' is on-screen instruction text only.
      TIER_ORDER.forEach(t => add(instId, `${t}.target`, data[t] && data[t].target));
    } else if(type === 'listenmatch'){
      // left === right by design for this module (an audio-echo match) — left alone is enough.
      TIER_ORDER.forEach(t => (data[t] || []).forEach((p,i) => add(instId, `${t}.pair${i}`, p.left)));
    } else if(type === 'spelling' || type === 'wordscramble'){
      TIER_ORDER.forEach(t => (data[t] || []).forEach((it,i) => {
        add(instId, `${t}.item${i}.word`, it.word);
        if(it.sentence) add(instId, `${t}.item${i}.sentence`, it.sentence);
      }));
    } else if(type === 'memorypairs' || type === 'picword'){
      (data.allItems || []).forEach((it,i) => {
        add(instId, `shared.item${i}.word`, it.word);
        if(it.sentence) add(instId, `shared.item${i}.sentence`, it.sentence);
      });
    } else if(type === 'buildsentence'){
      TIER_ORDER.forEach(t => (data[t] || []).forEach((it,i) => {
        const sentence = (it.tokens || []).map(tk => tk.text).join(' ');
        add(instId, `${t}.item${i}.sentence`, sentence);
      }));
    } else if(type === 'gapfill'){
      // CORRECTED: the old comment below claimed gapfill has no audio call site at all —
      // true against the OLD shell (lesson-shell-v1_3.html), false against shell-v2. Gap-fill's
      // reinforcement panel (showGrammarReinforce) genuinely speaks the sentence with the blank
      // filled in, on every correct answer. truefalse/putinorder/wordmatch below are NOT yet
      // re-verified against shell-v2 the same way — that stale claim may be wrong for them too,
      // this only fixes the one we've actually confirmed.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        const filled = it.answer && it.sentence && it.sentence.includes('___') ? it.sentence.replace('___', it.answer) : it.sentence;
        add(instId, `${t}.item${i}.sentence`, filled);
      }));
    }
    // 'truefalse', 'putinorder' and 'wordmatch' still skipped here — this was originally verified
    // directly against every module's render() function in lesson-shell-v1_3.html, but that
    // verification is now STALE (shell-v2 replaced that file entirely, and gapfill above turned
    // out to be wrong under the same claim). Needs re-checking against shell-v2 before trusting,
    // not silently carried forward.
  });

  return items;
}

function exportForTTSTool(){
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  if(!lesson) return;
  const items = extractSpeakableForTTS(lesson.id);
  const assets = items.map(it => ({
    id: it.id,
    text: it.text,
    voice: 'teach', // Celebration is for fixed praise strings, not lesson content — set per-line in the TTS tool if needed
    emotion: 'neutral',
    status: 'pending',
    file: `lessons/${lesson.id}/audio/${slugForFilename(it.text)}--${it.id}.mp3`,
  }));
  const manifest = { lesson: lesson.id, assets };
  const json = JSON.stringify(manifest, null, 2);
  const NO_AUDIO_TYPES = ['truefalse','putinorder','wordmatch']; // gapfill removed — confirmed it DOES have a real audio call site in shell-v2 (see extractSpeakableForTTS); the other three are unverified against shell-v2, not confirmed silent
  const skipped = lesson.modules.filter(m => NO_AUDIO_TYPES.includes(instanceType(m)));

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal" style="width:640px;max-width:92vw;">
        <div class="modal-head">
          <div class="modal-title">Export for TTS tool — ${lesson.name}</div>
          <div class="modal-close" onclick="closeModal()">✕</div>
        </div>
        <div class="upload-note" style="text-align:left;padding:2px 0 10px;">
          ${assets.length} speakable line${assets.length===1?'':'s'} found across ${lesson.modules.length} module instance${lesson.modules.length===1?'':'s'}.
          Download this file, then use "📁 Choose a manifest file…" in the TTS tool's Import Manifest.
          Re-exporting after an edit only resets the changed line${assets.length===1?'':'s'} — everything else keeps its
          generated audio, since ids are stable and the TTS tool's import merges rather than replaces.
          ${skipped.length ? `<br><br>Skipped (no audio playback exists for ${skipped.length===1?'this module':'these modules'} in the shell yet): ${skipped.map(instanceLabel).join(', ')}.` : ''}
        </div>
        <textarea id="ttsExportJson" readonly style="max-height:45vh;height:280px;width:100%;overflow:auto;background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;color:inherit;resize:vertical;">${json}</textarea>
        <div class="upload-note" id="ttsExportCopyMsg" style="text-align:left;padding:6px 0 0;min-height:1.2em;"></div>
        <div class="modal-actions">
          <button class="btn" onclick="copyJsonRobust('ttsExportJson', this, 'ttsExportCopyMsg')">Copy JSON</button>
          <button class="btn" onclick="downloadJsonRobust('ttsExportJson', '${lesson.id}-tts-manifest.json', this, 'ttsExportCopyMsg')">Download file</button>
          <button class="btn primary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
}

// ==========================================================================
// Robust copy/download — file:// pages are NOT a "secure context" in browsers,
// so navigator.clipboard doesn't exist there at all; calling it threw silently,
// with no visible feedback, before this was reported. Textarea.select() and
// execCommand('copy') both work with zero special permissions on any origin,
// including file://, so they're the primary path now — Clipboard API is only
// tried first as a nicety on origins where it actually exists. Worst case, the
// text ends up selected and ready for the device's native manual copy gesture,
// which always works everywhere no matter what the JS APIs allow.
// ==========================================================================
async function copyJsonRobust(textareaId, btn, msgId){
  const ta = document.getElementById(textareaId);
  const msgEl = msgId ? document.getElementById(msgId) : null;
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length); // iOS Safari needs this in addition to .select()

  let copied = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(ta.value); copied = true; }catch(e){ /* fall through */ }
  }
  if(!copied){
    try{ copied = document.execCommand('copy'); }catch(e){ /* fall through */ }
  }

  if(copied){
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
    if(msgEl) msgEl.textContent = '';
  } else if(msgEl){
    msgEl.textContent = 'Couldn\'t copy automatically — the text above is selected, use your device\'s copy option now.';
  }
}

function downloadJsonRobust(textareaId, filename, btn, msgId){
  const ta = document.getElementById(textareaId);
  const msgEl = msgId ? document.getElementById(msgId) : null;
  try{
    const blob = new Blob([ta.value], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if(msgEl) msgEl.textContent = 'If nothing downloaded, use Copy JSON instead and paste into a new file.';
  }catch(e){
    if(msgEl) msgEl.textContent = 'Download isn\'t available here — use Copy JSON instead and paste into a new file.';
  }
}
