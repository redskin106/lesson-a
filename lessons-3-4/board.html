<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case board</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:#0f0e1a;color:#f6f3ff;height:100vh;display:flex;flex-direction:column;padding:16px 24px;gap:12px;overflow:hidden}
header{display:flex;align-items:center;gap:20px}h1{font-size:34px}#left{margin-left:auto;font-size:30px;font-weight:800;background:#ffb21f;color:#1c1b2e;border-radius:999px;padding:8px 26px}
#sus{display:flex;gap:14px}.s{flex:1;border-radius:24px;background:#1d1b33;padding:10px 16px;text-align:center;font-size:24px;border:3px solid transparent;transition:.4s}.s b{font-size:46px;display:block}.s .m{font-size:20px;min-height:28px}.s.win{border-color:#19b38a;background:#14382e}.s.dim{opacity:.35}
#grid{flex:1;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:repeat(4,1fr);gap:14px;min-height:0}.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.tile{flex:1 1 0;border-radius:22px;padding:10px 14px;background:#24223f;display:flex;flex-direction:column;justify-content:center;font-size:20px;line-height:1.25;border:3px solid transparent;cursor:default;min-height:0;overflow:hidden}
.tile .p{font-size:36px}.tile.ready{background:#2d2a52;border-color:var(--c);cursor:pointer;animation:pl 1.6s infinite}.tile.ok{background:#fff;color:#1c1b2e;border-color:var(--c)}
.tile.lock{opacity:.4}@keyframes pl{50%{box-shadow:0 0 0 8px rgba(255,255,255,.12)}}
.hd{border-radius:18px;padding:8px;text-align:center;font-weight:800;font-size:26px;color:#fff}
.pips{font-size:16px;opacity:.8}
footer{display:flex;gap:12px;flex-shrink:0;position:relative;z-index:2}footer button{font:inherit;font-weight:700;font-size:20px;padding:10px 22px;border-radius:999px;border:0;cursor:pointer;background:#fff;color:#1c1b2e}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}#modal.on{display:flex}
#mb{background:#fff;color:#1c1b2e;border-radius:36px;padding:34px 40px;width:min(900px,92vw);font-size:28px}#mb h3{font-size:36px;margin-bottom:10px}.ex{background:#efeaff;border-radius:20px;padding:14px 20px;margin:14px 0;font-size:26px}
label{display:block;margin:10px 0;font-size:28px}input[type=checkbox]{width:28px;height:28px;vertical-align:middle;margin-right:10px}
.bt{font:inherit;font-weight:700;font-size:26px;padding:12px 34px;border-radius:999px;border:0;background:#19b38a;color:#fff;cursor:pointer;margin-right:10px}.bt[disabled]{opacity:.35}.bt.g{background:#ddd;color:#333}
#twist{background:#ffe0e3;color:#1c1b2e;border-radius:22px;padding:10px 18px;font-size:22px;display:none}
</style></head><body>
<header><h1 id="ttl"></h1><div id="left"></div></header><div id="sus"></div><div id="twist"></div><div id="grid"></div>
<footer><button onclick="twist()" id="btw">⚡ Late twist</button><button onclick="testq()">🧪 Confirming test</button><button onclick="reveal()">🎬 Reveal</button><button onclick="if(confirm('Reset the board?')){localStorage.removeItem(K);location.reload()}" style="margin-left:auto;opacity:.6">reset</button></footer>
<div id="modal"><div id="mb"></div></div>
<script>
const D={"teams": [["red", "Red", "#ff5a6a"], ["blue", "Blue", "#2a8cf0"], ["green", "Green", "#19b38a"], ["yellow", "Yellow", "#f2a900"]], "dials": [["A", "How often?", "#ff9a3c", "every day · twice a week · never"], ["B", "How long? / When?", "#2a8cf0", "for two weeks · since Monday · at night"], ["C", "How bad?", "#e0408a", "a little · quite · very · 3 out of 10"], ["D", "Compared with normal?", "#19b38a", "more than · less than · the same as · normal: ..."]], "l3": {"title": "Lesson 3 · Which illness?", "kind": "3", "suspects": [["flu", "Flu", "🤧"], ["dengue", "Dengue", "🦟"], ["measles", "Measles", "🔴"], ["food", "Food poisoning", "🤢"], ["appendix", "Appendicitis", "🩺"]], "clues": [{"id": "A1", "team": "red", "r": 1, "kind": "audio", "pic": "🎧", "ask": "How long have you had a fever?", "text": "Three days.", "say": "She has had a fever for three days.", "fx": {}}, {"id": "A2", "team": "red", "r": 2, "kind": "audio", "pic": "🎧", "ask": "Where does it hurt?", "text": "My head and behind my eyes. My muscles hurt too.", "say": "Her head, her eyes and her muscles hurt, so it might be flu or dengue. It can't be appendicitis.", "fx": {"dengue": "for", "flu": "for", "appendix": "against"}}, {"id": "A3", "team": "red", "r": 3, "kind": "audio", "pic": "🎧", "ask": "Do you have a cough?", "text": "No. No cough.", "say": "She has no cough, so it is unlikely to be flu or measles.", "fx": {"flu": "against", "measles": "against"}}, {"id": "A4", "team": "red", "r": 4, "kind": "audio", "pic": "🎧", "ask": "Have you been bitten by mosquitoes?", "text": "Yes, a lot. In the garden by the pond, about a week ago.", "say": "She was bitten by mosquitoes a week ago, so it might be dengue.", "fx": {"dengue": "for"}}, {"id": "B1", "team": "blue", "r": 1, "kind": "number", "pic": "🌡️", "text": "Temperature: 39.2 °C   (normal: about 37 °C)", "say": "Her temperature is 39.2. It is higher than normal, so she has a fever.", "fx": {"appendix": "against"}}, {"id": "B2", "team": "blue", "r": 2, "kind": "number", "pic": "💓", "text": "Pulse: 104 per minute   (normal: 60 – 100)", "say": "Her pulse is 104. It is a little higher than normal.", "fx": {}}, {"id": "B3", "team": "blue", "r": 3, "kind": "number", "pic": "🩸", "text": "Platelets: 95   (normal: 150 – 450)\nWhite cells: 3.1   (normal: 4.5 – 11)", "say": "Her platelets and white cells are lower than normal. That fits dengue.", "fx": {"dengue": "for"}, "level": "silver"}, {"id": "B4", "team": "blue", "r": 4, "kind": "number", "pic": "🫁", "text": "Breathing: 18 per minute   (normal: 12 – 20)", "say": "Her breathing is normal. It is the same as normal.", "fx": {}}, {"id": "C1", "team": "green", "r": 1, "kind": "photo", "pic": "🖐️", "text": "Red rash on the arms and chest. No rash on the face.", "say": "She has a rash on her arms and chest, but not on her face. It might be dengue. It is unlikely to be measles.", "fx": {"dengue": "for", "measles": "against"}}, {"id": "C2", "team": "green", "r": 2, "kind": "photo", "pic": "👁️", "text": "Eyes: not red, not watery.", "say": "Her eyes are not red or watery, so it is unlikely to be measles.", "fx": {"measles": "against"}}, {"id": "C3", "team": "green", "r": 3, "kind": "photo", "pic": "🫄", "text": "Belly: soft. No pain when the nurse presses.", "say": "Her belly does not hurt when I press it, so it can't be appendicitis.", "fx": {"appendix": "against"}}, {"id": "C4", "team": "green", "r": 4, "kind": "photo", "pic": "👃", "text": "Nose and throat: normal. No runny nose.", "say": "She has no runny nose and her throat is normal, so it is unlikely to be flu.", "fx": {"flu": "against"}, "level": "silver"}, {"id": "D1", "team": "yellow", "r": 1, "kind": "paper", "pic": "💉", "text": "Vaccination card: measles vaccine, 2 doses.", "say": "She had two measles vaccines, so measles is unlikely.", "fx": {"measles": "against"}}, {"id": "D2", "team": "yellow", "r": 2, "kind": "paper", "pic": "🍱", "text": "Friend: \"We ate the same food. Nobody else is sick.\"", "say": "Her friends ate the same food and they are not sick, so food poisoning is less likely.", "fx": {"food": "against"}}, {"id": "D3", "team": "yellow", "r": 3, "kind": "paper", "pic": "🏘️", "text": "Neighbour: \"Two people on our street had a fever last week.\"", "say": "Two people on her street were sick, so it might be an infection from mosquitoes.", "fx": {"dengue": "for"}}, {"id": "D4", "team": "yellow", "r": 4, "kind": "paper", "pic": "💊", "text": "Bottle: paracetamol. She took it yesterday. The fever went down, then came back.", "say": "She took paracetamol. The fever went down, then came back.", "fx": {}, "level": "silver"}], "twist": {"pic": "📞", "text": "Phone call: \"Her sister had flu last week!\"", "say": "Her sister had flu, so flu is possible. But she has no cough and she has a rash.", "fx": {"flu": "for"}}, "test": {"q": "It is day 3 of the fever. Which test do we do?", "opts": ["Dengue blood test (NS1)", "Chest X-ray", "Stool test"], "ans": 0, "why": "On days 1 to 7 of a fever, a blood test for the virus itself (NS1 antigen or PCR) can confirm dengue. Antibody tests come later (from about day 4 or 5)."}, "answer": "dengue", "reveal": "Dengue. Rash on the arms and chest, low platelets and white cells, no cough, mosquito bites a week ago. Tell the class: in real life the nurse reports the clues and the doctor decides."}, "l4": {"title": "Lesson 4 · The Sleepless Patient", "kind": "4", "suspects": [["flu", "Flu", "🤧"], ["food", "Food poisoning", "🤢"], ["coffee", "Too much coffee", "☕"], ["stress", "Exam stress", "📚"], ["heart", "Broken heart", "💔"]], "clues": [{"id": "R1", "team": "red", "r": 1, "topic": "Coffee", "pic": "☕", "dials": {"A": "She says: \"Two cups a day.\" The café card says: 8 cups a day.", "B": "Every day for two weeks, since the exams started.", "C": "8 cups is a lot.", "D": "Usual limit for adults: about 4 or 5 cups a day."}, "fx": {"coffee": "for"}}, {"id": "R2", "team": "red", "r": 2, "topic": "Sleep", "pic": "🛏️", "dials": {"A": "She sleeps 3 hours most nights.", "B": "For two weeks. She wakes up at 3 am.", "C": "Very tired in the morning.", "D": "Adults need at least 7 hours. She sleeps less than half."}, "fx": {"coffee": "for", "stress": "for"}}, {"id": "R3", "team": "red", "r": 3, "topic": "Pulse", "pic": "💓", "dials": {"A": "Pulse checked 3 times today: 108, 112, 110.", "B": "All day, even when she is sitting still.", "C": "Faster than normal. Not dangerous.", "D": "Normal pulse at rest: 60 – 100."}, "fx": {"coffee": "for", "stress": "for", "flu": "for"}}, {"id": "R4", "team": "red", "r": 4, "topic": "Temperature", "pic": "🌡️", "dials": {"A": "Checked twice a day.", "B": "36.8 °C for four days.", "C": "No fever.", "D": "Normal temperature: about 37 °C. Hers is normal."}, "fx": {"flu": "against"}}, {"id": "B1", "team": "blue", "r": 1, "topic": "Stomach", "pic": "🍽️", "dials": {"A": "She eats one meal a day, but she has no vomiting and no diarrhoea.", "B": "Normal stomach for the whole week.", "C": "A little hungry, not sick.", "D": "With food poisoning, vomiting or diarrhoea is common. She has none."}, "fx": {"food": "against"}}, {"id": "B2", "team": "blue", "r": 2, "topic": "Studying", "pic": "📚", "dials": {"A": "She studies every night.", "B": "Until 2 am, for two weeks.", "C": "Very tired.", "D": "Her classes start at 8 am."}, "fx": {"stress": "for", "coffee": "for"}}, {"id": "B3", "team": "blue", "r": 3, "topic": "Headache", "pic": "🤕", "dials": {"A": "A headache most afternoons.", "B": "Since last week.", "C": "3 out of 10. That is mild (1–3 = mild).", "D": "0 = no pain. 10 = the worst pain."}, "fx": {}}, {"id": "B4", "team": "blue", "r": 4, "topic": "Phone", "pic": "📱", "dials": {"A": "She looks at her phone ten times an hour.", "B": "Pulse goes up every time it buzzes.", "C": "Pulse: about 15 higher than normal.", "D": "No new messages today."}, "fx": {"heart": "for", "stress": "for"}, "level": "silver"}, {"id": "G1", "team": "green", "r": 1, "topic": "Hands", "pic": "✋", "dials": {"A": "Her hands shake after every coffee.", "B": "For about 30 minutes after each cup.", "C": "A little shaky, not very.", "D": "Without coffee her hands are normal."}, "fx": {"coffee": "for"}}, {"id": "G2", "team": "green", "r": 2, "topic": "Cough", "pic": "😷", "dials": {"A": "She never coughs.", "B": "No cough for the whole week.", "C": "Throat is normal.", "D": "With flu, a cough is common. She has none."}, "fx": {"flu": "against"}}, {"id": "G3", "team": "green", "r": 3, "topic": "Mood", "pic": "😟", "dials": {"A": "She cries a little when people talk about exams.", "B": "Only when she talks about exams.", "C": "Quite worried.", "D": "Her friends say she is usually calm. Now she is worried."}, "fx": {"stress": "for"}}, {"id": "G4", "team": "green", "r": 4, "topic": "Energy", "pic": "⚡", "dials": {"A": "She is awake at night, tired in class.", "B": "Every night for two weeks.", "C": "Very tired but very awake at night.", "D": "She wants to sleep but she cannot."}, "fx": {"coffee": "for", "stress": "for"}, "level": "silver"}, {"id": "Y1", "team": "yellow", "r": 1, "topic": "Before", "pic": "🗓️", "dials": {"A": "She never had this before the exams.", "B": "It started two weeks ago.", "C": "A big change.", "D": "Last month she was normal."}, "fx": {"stress": "for", "coffee": "for"}}, {"id": "Y2", "team": "yellow", "r": 2, "topic": "Sunday", "pic": "😴", "dials": {"A": "On Sunday she did not drink coffee.", "B": "She slept 9 hours and felt better by the evening.", "C": "Much better.", "D": "Her pulse on Sunday evening: 78. That is normal."}, "fx": {"coffee": "for"}}, {"id": "Y3", "team": "yellow", "r": 3, "topic": "Lunch", "pic": "🍱", "dials": {"A": "She ate lunch with three friends.", "B": "Same lunch, two days ago.", "C": "Her friends are fine.", "D": "Nobody else is sick."}, "fx": {"food": "against"}}, {"id": "Y4", "team": "yellow", "r": 4, "topic": "Exams", "pic": "📅", "dials": {"A": "Three exams in four days.", "B": "This week.", "C": "A lot of work.", "D": "Normal: one exam a week."}, "fx": {"stress": "for"}, "level": "silver"}], "twist": {"pic": "🗣️", "text": "A friend says: \"It's just exam stress!\"", "say": "Her friend thinks it is exam stress. But on Sunday, without coffee, she felt better.", "fx": {"stress": "for"}}, "test": {"q": "Which test do we do?", "opts": ["No coffee for three days. Then check her pulse and sleep.", "Chest X-ray", "Take a blood test for flu"], "ans": 0, "why": "If the pulse and sleep go back to normal when she stops the coffee, the coffee was the cause."}, "answer": "coffee", "reveal": "Too much coffee (8 cups a day, 3 hours of sleep, pulse 110, normal temperature, better on the Sunday without coffee). Exam stress is part of the story, but the coffee is what we can change."}};const q=new URLSearchParams(location.search);const N=q.get('case')==='4'?4:3;const C=D['l'+N];const K='sxl-board-'+N;
let st=JSON.parse(localStorage.getItem(K)||'{"ok":{},"twist":false}');const save=()=>localStorage.setItem(K,JSON.stringify(st));
const $=id=>document.getElementById(id);function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const clues=C.clues.concat([]);const byId=id=>clues.find(c=>c.id===id);
function fxAll(){const f={};C.suspects.forEach(s=>f[s[0]]={for:0,against:0});Object.keys(st.ok).forEach(id=>{const c=id==='TW'?C.twist:byId(id);Object.entries(c.fx||{}).forEach(([k,v])=>f[k][v]++)});return f}
let won=st.won||false;
function draw(){$('ttl').textContent=C.title;const total=clues.length;const done=Object.keys(st.ok).filter(k=>k!=='TW').length;$('left').textContent=(total-done)+' answers to go';
 const f=fxAll();$('sus').innerHTML=C.suspects.map(s=>`<div class="s ${won?(s[0]===C.answer?'win':'dim'):''}"><b>${s[2]}</b>${s[1]}<div class="m">${'✔'.repeat(f[s[0]].for)} ${'✖'.repeat(f[s[0]].against)}</div></div>`).join('');
 $('grid').innerHTML=D.teams.map(t=>{const mine=clues.filter(c=>c.team===t[0]).sort((a,b)=>a.r-b.r);let open=true;return `<div class="col" style="--c:${t[2]}"><div class="hd" style="background:${t[2]}">${t[1]}</div>${mine.map(c=>{const ok=st.ok[c.id];const ready=!ok&&open;if(!ok)open=false;
  if(ok)return `<div class="tile ok"><div style="display:flex;gap:10px;align-items:center"><span class="p">${c.pic}</span><div>${C.kind==='4'?`<b>${c.topic}</b><br>`:''}${(c.text||'').replace(/\n/g,'<br>')}${c.dials?`<div>${Object.entries(c.dials).map(([k,v])=>`<b>${k}</b> ${v}`).join('<br>')}</div>`:''}</div></div></div>`;
  return `<div class="tile ${ready?'ready':'lock'}" ${ready?`onclick="openTile('${c.id}')"`:''}><div style="display:flex;gap:10px;align-items:center"><span class="p">${ready?'✋':'🔒'}</span><div>${ready?'tap when the team is ready':'locked'}</div></div></div>`}).join('')}</div>`}).join('');
 if(st.twist){$('twist').style.display='block';$('twist').innerHTML='⚡ '+C.twist.pic+' '+C.twist.text}}
function openTile(id){const c=byId(id);let h=`<h3>${c.pic} ${c.id} · ${D.teams.find(t=>t[0]===c.team)[1]} team</h3>`;
 if(C.kind==='3'&&c.kind==='audio')h+=`<div>The team should ask: <b>"${c.ask}"</b></div>`;
 h+=`<div class="ex">Meaning to listen for:<br><b>${c.say}</b></div><div class="mu" style="font-size:22px">Approve on meaning, not grammar. At least one dial for Lesson 4. Another team: "say it differently".</div>`;
 h+=`<label><input type="checkbox" id="c1" onchange="chk()">Said aloud ✔</label><label><input type="checkbox" id="c2" onchange="chk()">Written on the tablet ✔</label><button class="bt" id="ap" disabled onclick="approve('${id}')">Approve · show clue</button><button class="bt g" onclick="$('modal').classList.remove('on')">Not yet</button>`;$('mb').innerHTML=h;$('modal').classList.add('on')}
function chk(){$('ap').disabled=!($('c1').checked&&$('c2').checked)}
function approve(id){st.ok[id]=1;save();$('modal').classList.remove('on');draw();const c=byId(id);if(c.kind==='audio')say(c.text)}
function twist(){st.twist=true;st.ok.TW=1;save();draw();say(C.twist.text.replace(/["⚡]/g,''))}
function testq(){const T=C.test;$('mb').innerHTML=`<h3>🧪 ${T.q}</h3>`+T.opts.map((o,i)=>`<button class="bt ${i?'g':''}" style="display:block;margin:12px 0;width:100%;text-align:left" onclick="this.style.background=${i===T.ans?"'#19b38a'":"'#ffb0b8'"};${i===T.ans?`document.getElementById('why').textContent=${JSON.stringify(T.why)}`:''}">${o}</button>`).join('')+'<div id="why" class="ex" style="font-size:22px">Let the teams argue first.</div><button class="bt g" onclick="$(\'modal\').classList.remove(\'on\')">Close</button>';$('modal').classList.add('on')}
function reveal(){won=true;st.won=true;save();draw();const a=C.suspects.find(s=>s[0]===C.answer);$('mb').innerHTML=`<h3 style="font-size:60px">${a[2]} ${a[1]}</h3><div class="ex">${C.reveal}</div><button class="bt g" onclick="$('modal').classList.remove('on')">Close</button>`;$('modal').classList.add('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('on')});draw();
</script></body></html>
