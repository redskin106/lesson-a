// A word with no emoji renders as a genuinely blank button in the shell — the "picture" in
// Picture & Word, Memory Pairs, Word Scramble, and Spelling isn't a real image anywhere yet
// (see the Shared Assets note — real illustrations are still a manual, one-time repo upload),
// it's the emoji field standing in. Skipping it in the authoring UI has no visible consequence
// there (just a "?" placeholder button), so it was shipping to students silently.
function findMissingEmojiItems(moduleId, data){
  const type = instanceType(moduleId);
  const missing = [];
  if(type === 'memorypairs' || type === 'picword'){
    (data.allItems || []).forEach(it => { if(!it.emoji) missing.push(it.word || '(unnamed)'); });
  } else if(type === 'wordscramble' || type === 'spelling'){
    TIER_ORDER.forEach(t => {
      (data[t] || []).forEach(it => { if(!it.emoji) missing.push(it.word || '(unnamed)'); });
    });
  }
  return missing;
}

function validateLessonForPublish(lessonId){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return ['Lesson not found'];
  const content = LESSON_CONTENT[lessonId];
  const problems = [];
  const modName = id => instanceLabel(id);

  lesson.modules.forEach(moduleId => {
    TIER_ORDER.forEach(t => {
      if(!isTierFilled(moduleId, t, content[moduleId])){
        problems.push(`${modName(moduleId)} — ${t.charAt(0).toUpperCase()+t.slice(1)} isn't filled in yet`);
      }
    });
    const missingEmoji = findMissingEmojiItems(moduleId, content[moduleId]);
    if(missingEmoji.length){
      const words = missingEmoji.slice(0, 5).join(', ') + (missingEmoji.length > 5 ? `, +${missingEmoji.length - 5} more` : '');
      problems.push(`${modName(moduleId)} — missing emoji for: ${words} (shows as a blank button to students)`);
    }
  });
  return problems;
}

function getAudioIssuesForLesson(lessonId){
  return Object.entries(LIVE_FLAGS)
    .filter(([key, f]) => f.lessonId === lessonId)
    .map(([key, f]) => ({ source:'live', key, persona: 'Teaching', ...f }));
}

async function openPublishModal(){
  publishKind = 'lesson';

  const contentProblems = validateLessonForPublish(publishLessonId);
  if(contentProblems.length){
    publishState = 'blocked';
    renderPublishModal(contentProblems);
    return;
  }

  publishState = 'checking-audio';
  renderPublishModal();

  let audioStatus, audioVerified;
  if(GH_CREDS.token){
    try{
      audioStatus = await getFullAudioStatusForLesson(publishLessonId);
      audioVerified = true;
      // Debug aid: if lines you know you've pushed still show as missing, open dev tools and
      // compare these two lists — a mismatch here means the id the TTS tool used doesn't match
      // what extractSpeakableForTTS() expects (e.g. lines added via "Add Assets" manually rather
      // than imported from "Export for TTS tool" get random ids, not the deterministic scheme).
      console.log('[audio check] pushed ids from manifest:', audioStatus.filter(a=>a.pushed).map(a=>a.key));
      console.log('[audio check] all expected ids:', audioStatus.map(a=>a.key));
    }catch(e){
      // Couldn't verify for real (network error, bad manifest, etc.) — fall back to the local
      // guess below rather than block the teacher entirely on a check that itself failed.
      audioStatus = getAudioIssuesForLesson(publishLessonId).map(i => ({ ...i, pushed:false }));
      audioVerified = false;
      console.log('[audio check] real check failed, falling back to local guess:', e.message);
    }
  }else{
    // No credentials yet — this is the old LIVE_FLAGS-based local guess (only catches "text
    // changed since audio was last touched," not "no audio has ever been generated at all") —
    // shown honestly as unverified rather than silently passed off as a real check.
    audioStatus = getAudioIssuesForLesson(publishLessonId).map(i => ({ ...i, pushed:false }));
    audioVerified = false;
  }

  const missingCount = audioStatus.filter(a => !a.pushed).length;
  if(missingCount > 0){
    publishState = 'audio-warning';
    renderPublishModal(null, audioStatus, audioVerified);
  } else {

  }
}

12px;\n  min-height: 60px;\n  cursor: pointer;\n  text-align: center;\n  transition: border-color 0.15s, background 0.15s;\n}\n.name-btn.selected {\n  border-color: var(--accent);\n  background: rgba(79,195,247,0.1);\n  color: var(--accent);\n}\n.start-btn {\n  background: var(--accent);\n  color: #0D1B2A;\n  border: none;\n  border-radius: var(--radius);\n  font-size: 18px;\n  font-weight: 700;\n  padding: 18px;\n  width: 100%;\n  cursor: pointer;\n  opacity: 0.25;\n  pointer-events: none;\n  transition: opacity 0.2s;\n  margin-top: auto;\n}\n.start-btn.ready { opacity: 1; pointer-events: auto; }\n\n/* \u2500\u2500\u2500 MODULE SCREEN \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.module-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 14px;\n}\n.student-name {\n  font-size: 14px;\n  color: var(--text-dim);\n  font-weight: 600;\n}\n.tier-badge {\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  padding: 4px 12px;\n  border-radius: 20px;\n}\n.tier-badge.bronze { background: var(--bronze-bg); color: var(--bronze); }\n.tier-badge.silver { background: var(--silver-bg); color: var(--silver); }\n.tier-badge.gold   { background: var(--gold-bg);   color: var(--gold);   }\n\n.progress-row {\n  display: flex;\n  gap: 6px;\n  margin-bottom: 14px;\n}\n.pip {\n  flex: 1;\n  height: 4px;\n  border-radius: 2px;\n  background: var(--surface2);\n  transition: background 0.3s;\n}\n.pip.done    { background: var(--pass); }\n.pip.current { background: var(--accent); }\n\n.tier-track {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 22px;\n}\n.tier-seg {\n  flex: 1;\n  padding: 9px 6px;\n  border-radius: var(--radius-sm);\n  text-align: center;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  opacity: 0.25;\n  transition: opacity 0.3s;\n}\n.tier-seg.bronze { background: var(--bronze-bg); color: var(--bronze); }\n.tier-seg.silver { background: var(--silver-bg); color: var(--silver); }\n.tier-seg.gold   { background: var(--gold-bg);   color: var(--gold);   }\n.tier-seg.active { opacity: 1; }\n.tier-seg.passed { opacity: 0.65; }\n.tier-seg.passed::after { content: ' \u2713'; }\n\n#module-container { flex: 1; }\n\n/* \u2500\u2500\u2500 TIER RESULT SCREEN \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.result-icon  { font-size: 64px; text-align: center; margin: 28px 0 14px; }\n.result-title { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 6px; }\n.result-score { font-size: 17px; color: var(--text-dim); text-align: center; margin-bottom: 28px; }\n.result-score span { color: var(--text); font-weight: 700; }\n.result-msg {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 16px 20px;\n  font-size: 15px;\n  color: var(--text-dim);\n  text-align: center;\n  margin-bottom: 28px;\n  line-height: 1.6;\n}\n.result-msg strong { color: var(--text); }\n\n.cta-btn {\n  display: block; width: 100%;\n  background: var(--accent); color: #0D1B2A;\n  border: none; border-radius: var(--radius);\n  font-size: 18px; font-weight: 700;\n  padding: 18px; cursor: pointer;\n  text-align: center; margin-bottom: 12px;\n}\n.secondary-btn {\n  display: block; width: 100%;\n  background: var(--surface2); color: var(--text);\n  border: none; border-radius: var(--radius);\n  font-size: 16px; font-weight: 600;\n  padding: 16px; cursor: pointer; text-align: center;\n}\n\n/* \u2500\u2500\u2500 END SCREEN \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.end-header { text-align: center; padding: 16px 0 20px; }\n.end-trophy  { font-size: 56px; margin-bottom: 10px; }\n.end-name    { font-size: 24px; font-weight: 700; margin-bottom: 4px; }\n.end-total   { font-size: 15px; color: var(--text-dim); }\n.end-total span { color: var(--accent); font-weight: 700; }\n\n.summary-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }\n\n.summary-item {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 14px 16px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n.summary-item-label  { font-size: 15px; font-weight: 600; }\n.summary-item-detail { font-size: 13px; color: var(--text-dim); margin-top: 2px; }\n.summary-status {\n  font-size: 12px; font-weight: 700;\n  padding: 4px 10px; border-radius: 20px; white-space: nowrap;\n}\n.summary-status.complete   { background: rgba(76,175,80,0.15);  color: var(--pass); }\n.summary-status.incomplete { background: rgba(239,83,80,0.15);  color: var(--fail); }\n\n.retry-btn {\n  display: block; width: 100%;\n  background: transparent; color: var(--text);\n  border: 2px solid var(--fail); border-radius: var(--radius);\n  font-size: 16px; font-weight: 600;\n  padding: 16px; cursor: pointer; text-align: center; margin-bottom: 12px;\n}\n.done-btn {\n  display: block; width: 100%;\n  background: var(--pass); color: #fff;\n  border: none; border-radius: var(--radius);\n  font-size: 18px; font-weight: 700;\n  padding: 18px; cursor: pointer; text-align: center;\n}\n\n/* \u2500\u2500\u2500 MODULE: AUDIO UNDERSTANDING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.module-title    { font-size: 17px; font-weight: 700; margin-bottom: 6px; }\n.module-question { font-size: 15px; color: var(--text-dim); margin-bottom: 20px; }\n\n.listen-btn {\n  display: flex; align-items: center; justify-content: center; gap: 10px;\n  width: 100%;\n  background: var(--surface2);\n  border: 2px solid var(--accent);\n  border-radius: var(--radius);\n  color: var(--accent);\n  font-size: 16px; font-weight: 700;\n  padding: 16px; cursor: pointer; margin-bottom: 20px;\n  transition: background 0.15s;\n}\n.listen-btn.playing { background: rgba(79,195,247,0.1); }\n\n.options-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n.option-btn {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius);\n  color: var(--text);\n  font-size: 15px; font-weight: 500;\n  padding: 16px 12px; min-height: 64px;\n  cursor: pointer; text-align: center;\n  transition: border-color 0.15s, background 0.15s, opacity 0.25s;\n}\n.option-btn.correct { border-color: var(--pass); background: rgba(76,175,80,0.12); color: var(--pass); }\n.option-btn.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.1);  color: var(--fail); }\n.option-btn:disabled { cursor: default; }\n.option-btn.locked  { opacity: 0; pointer-events: none; }\n\n.next-ex-btn {\n  display: block; width: 100%;\n  background: var(--accent); color: #0D1B2A;\n  border: none; border-radius: var(--radius);\n  font-size: 18px; font-weight: 700;\n  padding: 18px; cursor: pointer; margin-top: 20px;\n}\n\n/* \u2500\u2500\u2500 MODULE: GAP FILL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.sentence-display {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 20px 18px;\n  font-size: 18px;\n  line-height: 2;\n  margin-bottom: 20px;\n}\n.blank-slot {\n  display: inline-block;\n  min-width: 80px;\n  border-bottom: 2px solid var(--accent);\n  color: var(--accent);\n  font-weight: 700;\n  text-align: center;\n  padding: 0 6px;\n  transition: color 0.2s, border-color 0.2s;\n}\n.word-bank {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 4px;\n}\n.word-btn {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 15px; font-weight: 600;\n  padding: 12px 16px;\n  cursor: pointer;\n  transition: border-color 0.15s, background 0.15s, color 0.15s;\n}\n.word-btn.selected { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }\n.word-btn.correct  { border-color: var(--pass);   color: var(--pass); }\n.word-btn.wrong    { border-color: var(--fail);   color: var(--fail); }\n.word-btn:disabled { cursor: default; }\n\n/* \u2500\u2500\u2500 MODULE: TRUE / FALSE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.tf-statement {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 24px 20px;\n  font-size: 18px;\n  line-height: 1.6;\n  margin-bottom: 28px;\n  text-align: center;\n}\n.tf-buttons {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n.tf-btn {\n  border: 2px solid transparent;\n  border-radius: var(--radius);\n  font-size: 19px; font-weight: 700;\n  padding: 24px 12px;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.tf-btn.true-btn  { background: rgba(76,175,80,0.1);  color: var(--pass); border-color: var(--pass); }\n.tf-btn.false-btn { background: rgba(239,83,80,0.1);  color: var(--fail); border-color: var(--fail); }\n.tf-btn.highlight-correct { background: var(--pass);  color: #fff; border-color: var(--pass); }\n.tf-btn.highlight-wrong   { background: var(--fail);  color: #fff; border-color: var(--fail); }\n.tf-btn:disabled { cursor: default; opacity: 0.7; }\n\n/* \u2500\u2500\u2500 MODULE: WORD MATCH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.match-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n  margin-bottom: 20px;\n}\n.match-col { display: flex; flex-direction: column; gap: 8px; }\n.match-btn {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 14px; font-weight: 600;\n  padding: 12px 10px;\n  min-height: 54px;\n  cursor: pointer; text-align: center;\n  line-height: 1.3;\n  transition: all 0.15s;\n}\n.match-btn.selected   { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }\n.match-btn.matched    { border-color: var(--pass);   background: rgba(76,175,80,0.12); color: var(--pass); pointer-events: none; }\n.match-btn.wrong-flash { border-color: var(--fail);  background: rgba(239,83,80,0.1); }\n.match-score {\n  font-size: 14px; color: var(--text-dim);\n  text-align: center; margin-bottom: 12px;\n}\n\n/* \u2500\u2500\u2500 MODULE: SEQUENCING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.seq-prompt { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; }\n.seq-slots  { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }\n.seq-slot {\n  display: flex; align-items: center; gap: 12px;\n  background: var(--surface2);\n  border: 2px dashed rgba(255,255,255,0.1);\n  border-radius: var(--radius-sm);\n  padding: 12px 14px; min-height: 50px;\n  transition: border-color 0.2s, background 0.2s;\n}\n.seq-slot.filled  { border-style: solid; border-color: var(--accent); cursor: pointer; }\n.seq-slot.correct { border-color: var(--pass); background: rgba(76,175,80,0.1); }\n.seq-slot.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.08); }\n.slot-num {\n  width: 24px; height: 24px; flex-shrink: 0;\n  background: var(--surface); border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 11px; font-weight: 700; color: var(--text-dim);\n  transition: background 0.2s, color 0.2s;\n}\n.seq-slot.filled .slot-num { background: var(--accent); color: #0D1B2A; }\n.slot-text { font-size: 15px; font-weight: 600; }\n.seq-pool-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }\n.seq-pool  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }\n.seq-item {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 14px; font-weight: 600;\n  padding: 11px 14px;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.seq-item:active { background: var(--surface); }\n.seq-item.used   { opacity: 0.2; pointer-events: none; }\n\n/* \u2500\u2500\u2500 MODULE: AUDIO SPEAKING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.speak-target {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 22px 20px;\n  font-size: 20px; font-weight: 700;\n  text-align: center; line-height: 1.5;\n  margin-bottom: 20px;\n}\n\n/* Three-button comparison row */\n.speak-trio {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n  margin-bottom: 20px;\n}\n.trio-btn {\n  display: flex; flex-direction: column;\n  align-items: center; justify-content: center; gap: 6px;\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius);\n  padding: 16px 8px;\n  cursor: pointer;\n  transition: all 0.2s;\n  min-height: 80px;\n}\n.trio-btn .trio-icon  { font-size: 24px; line-height: 1; }\n.trio-btn .trio-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }\n\n/* Model button \u2014 accent blue */\n.trio-btn.model { border-color: var(--accent); color: var(--accent); }\n.trio-btn.model .trio-label { color: var(--accent); }\n.trio-btn.model.playing { background: rgba(79,195,247,0.1); }\n\n/* Playback button \u2014 purple, disabled until recorded */\n.trio-btn.playback { border-color: #AB47BC; color: #CE93D8; opacity: 0.3; pointer-events: none; }\n.trio-btn.playback .trio-label { color: #AB47BC; }\n.trio-btn.playback.ready { opacity: 1; pointer-events: auto; }\n.trio-btn.playback.playing { background: rgba(171,71,188,0.1); }\n\n/* Record button \u2014 red */\n.trio-btn.record { border-color: var(--fail); color: var(--fail); }\n.trio-btn.record .trio-label { color: var(--fail); }\n.trio-btn.record.recording {\n  background: rgba(239,83,80,0.1);\n  animation: pulse-record 1s ease-in-out infinite;\n}\n@keyframes pulse-record {\n  0%, 100% { box-shadow: 0 0 0 0   rgba(239,83,80,0.4); }\n  50%       { box-shadow: 0 0 0 8px rgba(239,83,80,0);   }\n}\n\n.speak-hint {\n  font-size: 13px; color: var(--text-dim);\n  text-align: center; margin-bottom: 20px;\n}\n\n/* Self-assess \u2014 appears after first recording */\n.assess-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }\n.assess-btn {\n  border: 2px solid transparent; border-radius: var(--radius);\n  font-size: 16px; font-weight: 700; padding: 18px; cursor: pointer;\n  transition: all 0.15s;\n}\n.assess-yes { background: rgba(76,175,80,0.1); color: var(--pass); border-color: var(--pass); }\n.assess-no  { background: rgba(239,83,80,0.1); color: var(--fail); border-color: var(--fail); }\n.assess-btn.selected.assess-yes { background: var(--pass); color: #fff; }\n.assess-btn.selected.assess-no  { background: var(--fail); color: #fff; }\n.assess-btn:disabled { cursor: default; opacity: 0.5; }\n.no-mic-msg {\n  background: var(--surface2); border-radius: var(--radius-sm);\n  padding: 14px 16px; font-size: 14px; color: var(--text-dim);\n  text-align: center; margin-bottom: 14px; line-height: 1.6;\n}\n\n\n/* \u2500\u2500\u2500 NEW MODULE STYLES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.option-btn.selected {\n  border-color: var(--accent);\n  background: rgba(79,195,247,0.08);\n  color: var(--accent);\n}\n.module-game-label {\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--gold);\n  text-align: center;\n  margin-bottom: 8px;\n}\n</style>\n</head>\n<body>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 1 \u2014 NAME PICKER\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-name\" class=\"screen active\">\n  <p class=\"welcome-label\">EFL Lesson</p>\n  <h1 class=\"welcome-title\">Hello! \ud83d\udc4b</h1>\n  <p class=\"welcome-sub\">Tap your name to begin.</p>\n  <div class=\"name-grid\" id=\"name-grid\"></div>\n  <button class=\"start-btn\" id=\"start-btn\">Start \u2192</button>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 2 \u2014 MODULE\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-module\" class=\"screen\">\n  <div class=\"module-header\">\n    <span class=\"student-name\" id=\"header-name\"></span>\n    <span class=\"tier-badge bronze\" id=\"tier-badge\">Bronze</span>\n  </div>\n  <div class=\"progress-row\" id=\"progress-pips\"></div>\n  <div class=\"tier-track\">\n    <div class=\"tier-seg bronze\" id=\"seg-bronze\">Bronze</div>\n    <div class=\"tier-seg silver\" id=\"seg-silver\">Silver</div>\n    <div class=\"tier-seg gold\"   id=\"seg-gold\">Gold</div>\n  </div>\n  <div id=\"module-container\"></div>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 3 \u2014 TIER RESULT\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-tier-result\" class=\"screen\">\n  <div class=\"result-icon\"  id=\"result-icon\"></div>\n  <h2 class=\"result-title\"  id=\"result-title\"></h2>\n  <p  class=\"result-score\"  id=\"result-score\"></p>\n  <p  class=\"result-msg\"    id=\"result-msg\"></p>\n  <button class=\"cta-btn\"       id=\"result-cta\"></button>\n  <button class=\"secondary-btn\" id=\"result-secondary\" style=\"display:none\"></button>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     REINFORCEMENT PANEL\n     Shared by image-vocab, memory-pairs,\n     word-scramble, spelling modules\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"reinforce-panel\" style=\"\n  position:fixed;bottom:0;left:0;right:0;\n  background:#0D1B2A;\n  border-top:1px solid #1E3248;\n  border-radius:20px 20px 0 0;\n  padding:1.5rem 1.5rem 2.25rem;\n  display:flex;flex-direction:column;align-items:center;gap:.75rem;\n  transform:translateY(100%);\n  transition:transform .35s cubic-bezier(.4,0,.2,1);\n  z-index:200;\n\">\n  <div id=\"rp-em\"   style=\"font-size:64px;line-height:1;\"></div>\n  <div id=\"rp-word\" style=\"font-size:28px;font-weight:600;color:#FFD700;letter-spacing:.03em;\"></div>\n  <div id=\"rp-sent\" style=\"font-size:15px;color:#7A9BBF;text-align:center;line-height:1.7;\"></div>\n  <div style=\"width:100%;height:3px;background:#1E3248;border-radius:99px;overflow:hidden;margin-top:.25rem;\">\n    <div id=\"rp-bar\" style=\"height:100%;background:#FFD700;width:0%;border-radius:99px;transition:width linear;\"></div>\n  </div>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     SCREEN 4 \u2014 END SCREEN\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div id=\"screen-end\" class=\"screen\">\n  <div class=\"end-header\">\n    <div class=\"end-trophy\">\ud83c\udfc6</div>\n    <div class=\"end-name\"  id=\"end-name\"></div>\n    <div class=\"end-total\" id=\"end-total\"></div>\n  </div>\n  <div class=\"summary-list\" id=\"summary-list\"></div>\n  <button class=\"retry-btn\" id=\"retry-btn\" style=\"display:none\">\u21a9 Retry incomplete modules</button>\n  <button class=\"done-btn\"  id=\"done-btn\">\u2713 Done</button>\n</div>\n\n<script>\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CONFIG\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst STUDENTS       = ['Sophy','Davit','Sam','Nu','Tue','Yee','Lee Ga','Felix','Tin','Ken','Thai'];\nconst PASS_THRESHOLD = 0.6; // 60% to pass a tier\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LESSON DATA\n//  Each module: { id, type, label, data: { bronze, silver, gold } }\n//  Add / replace entries here to build the full lesson.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst LESSON = [\n  {\n    id: 'mod-1',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 1',\n    data: {\n      bronze: {\n        audio: 'dog',\n        question: 'What word did you hear?',\n        options: ['dog','cat','bus','book'],\n        answer: 'dog'\n      },\n      silver: {\n        audio: 'The dog runs in the park.',\n        question: 'Where does the dog run?',\n        options: ['in the house','in the park','in the school','in the car'],\n        answer: 'in the park'\n      },\n      gold: {\n        audio: 'My father drives the car every morning.',\n        question: 'What does the father do every morning?',\n        options: ['reads a book','drives the car','goes to school','walks the dog'],\n        answer: 'drives the car'\n      }\n    }\n  },\n  {\n    id: 'mod-2',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 2',\n    data: {\n      bronze: {\n        audio: 'water',\n        question: 'What word did you hear?',\n        options: ['water','chair','rain','cat'],\n        answer: 'water'\n      },\n      silver: {\n        audio: 'I eat breakfast before school.',\n        question: 'When does she eat breakfast?',\n        options: ['after dinner','at night','before school','at the weekend'],\n        answer: 'before school'\n      },\n      gold: {\n        audio: 'She goes to the library after class to study quietly.',\n        question: 'Why does she go to the library?',\n        options: ['to meet a friend','to study quietly','to borrow a book','to eat lunch'],\n        answer: 'to study quietly'\n      }\n    }\n  },\n  {\n    id: 'mod-3',\n    type: 'audio-understanding',\n    label: 'Listen & Choose 3',\n    data: {\n      bronze: {\n        audio: 'school',\n        question: 'What word did you hear?',\n        options: ['school','phone','money','house'],\n        answer: 'school'\n      },\n      silver: {\n        audio: 'It is cold in the morning.',\n        question: 'When is it cold?',\n        options: ['at night','in the afternoon','in the morning','at the weekend'],\n        answer: 'in the morning'\n      },\n      gold: {\n        audio: 'We visit our grandparents on the weekend because we miss them.',\n        question: 'Why do they visit their grandparents?',\n        options: ['because they are bored','because they miss them','because school is closed','because they live nearby'],\n        answer: 'because they miss them'\n      }\n    }\n  }\n\n  ,\n  // \u2500\u2500 GAP FILL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-4',\n    type: 'gap-fill',\n    label: 'Fill the Gap',\n    data: {\n      bronze: {\n        sentence: 'I ___ water every day.',\n        options: ['drink', 'eat', 'sleep', 'run'],\n        answer: 'drink'\n      },\n      silver: {\n        sentence: 'She ___ her homework before dinner.',\n        options: ['does', 'eats', 'reads', 'plays', 'sleeps'],\n        answer: 'does'\n      },\n      gold: {\n        sentence: 'My uncle works at the hospital and ___ sick people.',\n        options: ['helps', 'calls', 'reads', 'drives', 'meets', 'teaches'],\n        answer: 'helps'\n      }\n    }\n  },\n\n  // \u2500\u2500 TRUE / FALSE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-5',\n    type: 'true-false',\n    label: 'True or False',\n    data: {\n      bronze: {\n        statement: 'A dog is an animal.',\n        answer: true\n      },\n      silver: {\n        statement: 'We eat breakfast at night.',\n        answer: false\n      },\n      gold: {\n        statement: 'She goes to the library after class to study quietly.',\n        answer: true\n      }\n    }\n  },\n\n  // \u2500\u2500 WORD MATCH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-6',\n    type: 'word-match',\n    label: 'Word Match',\n    data: {\n      bronze: {\n        pairs: [\n          { left: 'dog',   right: 'an animal' },\n          { left: 'water', right: 'a drink'   },\n          { left: 'book',  right: 'you read it' }\n        ]\n      },\n      silver: {\n        pairs: [\n          { left: 'hungry', right: 'want food'  },\n          { left: 'tired',  right: 'need sleep' },\n          { left: 'happy',  right: 'feel good'  },\n          { left: 'cold',   right: 'not warm'   }\n        ]\n      },\n      gold: {\n        pairs: [\n          { left: 'library',   right: 'place to study'    },\n          { left: 'homework',  right: 'work after school' },\n          { left: 'breakfast', right: 'morning meal'      },\n          { left: 'neighbor',  right: 'person nearby'     },\n          { left: 'weekend',   right: 'Saturday & Sunday' }\n        ]\n      }\n    }\n  },\n\n  // \u2500\u2500 SEQUENCING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-7',\n    type: 'sequencing',\n    label: 'Put in Order',\n    data: {\n      bronze: {\n        prompt: 'Put these in order \u2014 morning first.',\n        items:   ['eat lunch', 'wake up', 'eat breakfast'],\n        correct: ['wake up', 'eat breakfast', 'eat lunch']\n      },\n      silver: {\n        prompt: 'Put these in the right order.',\n        items:   ['go to school', 'wake up', 'eat dinner', 'eat breakfast'],\n        correct: ['wake up', 'eat breakfast', 'go to school', 'eat dinner']\n      },\n      gold: {\n        prompt: 'Put these in the right order.',\n        items:   ['go home', 'wake up', 'eat dinner', 'eat breakfast', 'go to school'],\n        correct: ['wake up', 'eat breakfast', 'go to school', 'go home', 'eat dinner']\n      }\n    }\n  },\n\n  // \u2500\u2500 AUDIO SPEAKING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-8',\n    type: 'audio-speaking',\n    label: 'Say It',\n    data: {\n      bronze: {\n        prompt: 'Say this word:',\n        target: 'water',\n        keyWords: ['water']\n      },\n      silver: {\n        prompt: 'Say this sentence:',\n        target: 'I eat breakfast before school.',\n        keyWords: ['eat', 'breakfast', 'school']\n      },\n      gold: {\n        prompt: 'Say this sentence:',\n        target: 'We visit our grandparents on the weekend because we miss them.',\n        keyWords: ['visit', 'grandparents', 'weekend', 'miss']\n      }\n    }\n  },\n\n  // \u2500\u2500 GAME 1: Memory Pairs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  {\n    id: 'mod-game-1',\n    type: 'memory-p 2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  STATE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst state = {\n  student: null,\n  currentModuleIndex: 0,\n  currentTier: 'bronze',\n  results: buildResults()\n};\n\nfunction buildResults() {\n  return LESSON.map(() => ({\n    bronze:   { score: null, passed: false },\n    silver:   { score: null, passed: false },\n    gold:     { score: null, passed: false },\n    complete: false\n  }));\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  HELPERS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst TIERS = ['bronze','silver','gold'];\nconst nextTier  = t => TIERS[TIERS.indexOf(t) + 1] || null;\nconst cap       = s => s.charAt(0).toUpperCase() + s.slice(1);\n\nfunction showScreen(id) {\n  document.querySelectorAll('.screen').forEach(s => {\n    s.classList.remove('active');\n    s.style.display = 'none';\n  });\n  const el = document.getElementById(id);\n  el.style.display = 'flex';\n  el.classList.add('active');\n  el.scrollTop = 0;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 1 \u2014 NAME PICKER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst nameGrid = document.getElementById('name-grid');\nconst startBtn = document.getElementById('start-btn');\n\nSTUDENTS.forEach(name => {\n  const btn = document.createElement('button');\n  btn.className   = 'name-btn';\n  btn.textContent = name;\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));\n    btn.classList.add('selected');\n    state.student = name;\n    startBtn.classList.add('ready');\n  });\n  nameGrid.appendChild(btn);\n});\n\nstartBtn.addEventListener('click', () => {\n  if (!state.student) return;\n  document.getElementById('header-name').textContent = state.student;\n  state.currentModuleIndex = 0;\n  state.currentTier = 'bronze';\n  state.results = buildResults();\n  startModule(0, 'bronze');\n});\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 2 \u2014 MODULE RUNNER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction startModule(moduleIndex, tier) {\n  state.currentModuleIndex = moduleIndex;\n  state.currentTier = tier;\n\n  const mod = LESSON[moduleIndex];\n\n  // Header\n  document.getElementById('header-name').textContent = state.student;\n\n  // Tier badge\n  const badge = document.getElementById('tier-badge');\n  badge.textContent = cap(tier);\n  badge.className = `tier-badge ${tier}`;\n\n  // Progress pips\n  const pipsEl = document.getElementById('progress-pips');\n  pipsEl.innerHTML = '';\n  LESSON.forEach((_, i) => {\n    const pip = document.createElement('div');\n    pip.className = 'pip'\n      + (state.results[i].complete ? ' done' : '')\n      + (i === moduleIndex && !state.results[i].complete ? ' current' : '');\n    pipsEl.appendChild(pip);\n  });\n\n  // Tier track\n  TIERS.forEach(t => {\n    const seg = document.getElementById(`seg-${t}`);\n    seg.className = `tier-seg ${t}`;\n    if (state.results[moduleIndex][t].passed) seg.classList.add('passed');\n    else if (t === tier) seg.classList.add('active');\n  });\n\n  showScreen('screen-module');\n\n  // Render module\n  const container = document.getElementById('module-container');\n  container.innerHTML = '';\n\n  const renderer = MODULE_REGISTRY[mod.type];\n  if (!renderer) {\n    container.innerHTML = `<p style=\"color:var(--text-dim);padding:32px 0;text-align:center\">Module type \"${mod.type}\" not registered.</p>`;\n    return;\n  }\n\n  renderer.render(container, mod.data[tier], tier, score => {\n    handleTierResult(moduleIndex, tier, score);\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  TIER RESULT HANDLER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction handleTierResult(moduleIndex, tier, score) {\n  const passed = score >= PASS_THRESHOLD;\n  state.results[moduleIndex][tier] = { score, passed };\n\n  const pct      = Math.round(score * 100);\n  const tierName = cap(tier);\n  const next     = nextTier(tier);\n\n  const stars   = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;\n  const starStr = '\u2b50'.repeat(stars) + '\u2729'.repeat(3 - stars);\n  document.getElementById('result-icon').textContent  = starStr;\n  document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} \u2014 try again`;\n  document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;\n\n  const ctaBtn = document.getElementById('result-cta');\n  const secBtn = document.getElementById('result-secondary');\n  secBtn.style.display = 'none';\n\n  if (passed && next) {\n    // Unlock next tier\n    document.getElementById('result-msg').innerHTML =\n      `Great work! <strong>${cap(next)}</strong> is now unlocked.`;\n    ctaBtn.textContent = `Try ${cap(next)} \u2192`;\n    ctaBtn.onclick = () => startModule(moduleIndex, next);\n\n  } else if (passed && !next) {\n    // Gold passed \u2192 module complete\n    state.results[moduleIndex].complete = true;\n    const nextMod = moduleIndex + 1;\n\n    if (nextMod < LESSON.length) {\n      document.getElementById('result-msg').innerHTML =\n        `<strong>Module complete!</strong> Moving to the next exercise.`;\n      ctaBtn.textContent = 'Next module \u2192';\n      ctaBtn.onclick = () => startModule(nextMod, 'bronze');\n    } else {\n      document.getElementById('result-msg').innerHTML =\n        `<strong>All done!</strong> You've completed every module.`;\n      ctaBtn.textContent = 'See my results \u2192';\n      ctaBtn.onclick = () => showEndScreen();\n    }\n\n  } else {\n    // Failed\n    document.getElementById('result-msg').innerHTML =\n      `You need <strong>${Math.round(PASS_THRESHOLD * 100)}%</strong> to unlock the next level. You can do it!`;\n    ctaBtn.textContent = `\u21a9 Try ${tierName} again`;\n    ctaBtn.onclick = () => startModule(moduleIndex, tier);\n  }\n\n  showScreen('screen-tier-result');\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREEN 4 \u2014 END SCREEN\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction showEndScreen() {\n  document.getElementById('end-name').textContent = state.student;\n\n  // Overall score: highest-tier score per module, averaged\n  let total = 0;\n  state.results.forEach(r => {\n    for (const t of ['gold','silver','bronze']) {\n      if (r[t].score !== null) { total += r[t].score; break; }\n    }\n  });\n  const overallPct = Math.round((total / LESSON.length) * 100);\n  document.getElementById('end-total').innerHTML = `Overall score: <span>${overallPct}%</span>`;\n\n  const summaryList = document.getElementById('summary-list');\n  summaryList.innerHTML = '';\n  let hasIncomplete = false;\n\n  LESSON.forEach((mod, i) => {\n    const r = state.results[i];\n    if (!r.complete) hasIncomplete = true;\n\n    let highestTier = null, highestScore = null;\n    for (const t of ['gold','silver','bronze']) {\n      if (r[t].score !== null) { highestTier = t; highestScore = r[t].score; break; }\n    }\n\n    const item = document.createElement('div');\n    item.className = 'summary-item';\n    item.innerHTML = `\n      <div>\n        <div class=\"summary-item-label\">${mod.label}</div>\n        <div class=\"summary-item-detail\">${\n          highestScore !== null\n            ? `${cap(highestTier)} \u00b7 ${Math.round(highestScore * 100)}%`\n            : 'Not attempted'\n        }</div>\n      </div>\n      <div class=\"summary-status ${r.complete ? 'complete' : 'incomplete'}\">\n        ${r.complete ? '\u2713 Done' : 'Retry'}\n      </div>\n    `;\n    summaryList.appendChild(item);\n  });\n\n  const retryBtn = document.getElementById('retry-btn');\n  retryBtn.style.display = hasIncomplete ? 'block' : 'none';\n  retryBtn.onclick = retryFailed;\n\n  document.getElementById('done-btn').onclick = () => {\n    resetAll();\n    showScreen('screen-name');\n  };\n\n  showScreen('screen-end');\n}\n\nfunction retryFailed() {\n  const idx = state.results.findIndex(r => !r.complete);\n  if (idx === -1) { showEndScreen(); return; }\n  const r = state.results[idx];\n  const tier = r.silver.passed ? 'gold' : r.bronze.passed ? 'silver' : 'bronze';\n  startModule(idx, tier);\n}\n\nfunction resetAll() {\n  state.student = null;\n  state.results = buildResults();\n  document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));\n  startBtn.classList.remove('ready');\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MODULE REGISTRY\n//  Contract: render(container, data, tier, onComplete)\n//  onComplete(score)  score = 0\u20131\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// Render ID \u2014 incremented on every render call.\n// All async callbacks (onend, setTimeout) check this before acting\n// so stale callbacks from a previous render can never fire into a new one.\nlet _audioRID = 0;\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SHARED UTILITIES\n//  speak(), speakThenSentence(), safeShuffle(),\n//  showReinforcePanel() \u2014 used by new module types\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nconst TTS = window.speechSynthesis || null;\n\nconst SPEAK_MOODS = {\n  neutral:   { rate:0.85, pitch:1.0,  volume:0.9 },\n  wrong:     { rate:0.80, pitch:0.9,  volume:0.8 },\n  celebrate: { rate:1.15, pitch:1.55, volume:1.0 },\n};\n\nfunction speak(text, mood='neutral', delay=0, audioFile=null) {\n  setTimeout(() => {\n    if (audioFile) {\n      const a = new Audio(audioFile);\n      a.onerror = () => speakViaTTS(text, mood); // missing/broken file \u2014 fall back, never go silent\n      a.play().catch(() => speakViaTTS(text, mood));\n      return;\n    }\n    speakViaTTS(text, mood);\n  }, delay);\n}\n\nfunction speakViaTTS(text, mood='neutral') {\n  if (!TTS) return;\n  TTS.cancel();\n  let u;\n  try { u = new SpeechSynthesisUtterance(text); } catch(e) { return; }\n  const m = SPEAK_MOODS[mood];\n  u.rate = m.rate; u.pitch = m.pitch; u.volume = m.volume;\n  TTS.speak(u);\n}\n\nfunction speakThenSentence(word, sentence, wordMood='celebrate', wordAudioFile=null, sentenceAudioFile=null) {\n  const playSentencePart = () => {\n    setTimeout(() => {\n      if (sentenceAudioFile) {\n        const a = new Audio(sentenceAudioFile);\n        a.onerror = () => speakViaTTS(sentence, 'neutral');\n        a.play().catch(() => speakViaTTS(sentence, 'neutral'));\n      } else {\n        speakViaTTS(sentence, 'neutral');\n      }\n    }, 400);\n  };\n\n  if (wordAudioFile) {\n    const wa = new Audio(wordAudioFile);\n    let done = false;\n    const advance = () => { if (done) return; done = true; playSentencePart(); };\n    wa.onended = advance;\n    wa.onerror = () => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); };\n    wa.play().catch(() => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); });\n    // No reliable duration fallback for a file we haven't loaded yet \u2014 onended covers the\n    // normal case; onerror/play() rejection covers the broken-file case.\n    return;\n  }\n  speakWordThenSentenceViaTTS(word, sentence, wordMood);\n}\n\nfunction speakWordThenSentenceViaTTS(word, sentence, wordMood='celebrate') {\n  if (!TTS) return;\n  TTS.cancel();\n  let wu;\n  try { wu = new SpeechSynthesisUtterance(word); } catch(e) { return; }\n  const wm = SPEAK_MOODS[wordMood];\n  wu.rate = wm.rate; wu.pitch = wm.pitch; wu.volume = wm.volume;\n  let done = false;\n  const playSentence = () => {\n    if (done) return; done = true;\n    setTimeout(() => {\n      if (!TTS) return;\n      let su;\n      try { su = new SpeechSynthesisUtterance(sentence); } catch(e) { return; }\n      const nm = SPEAK_MOODS['neutral'];\n      su.rate = nm.rate; su.pitch = nm.pitch; su.volume = nm.volume;\n      TTS.speak(su);\n    }, 400);\n  };\n  wu.onend = playSentence;\n  const fallback = Math.max(1200, (word.length / wu.rate) * 120) + 600;\n  setTimeout(playSentence, fallback);\n  TTS.speak(wu);\n}\n\n// Never returns a shuffled array that satisfies badFn (e.g. same order as input)\nfunction safeShuffle(arr, badFn, maxAttempts=20) {\n  const sh = a => [...a].sort(() => Math.random() - .5);\n  let result = sh(arr), attempts = 0;\n  while (badFn(result) && attempts++ < maxAttempts) result = sh(arr);\n  return result;\n}\n\n// Shared reinforcement panel \u2014 slides up, shows emoji/word/sentence, auto-closes\nconst MIN_READ_MS   = 3500;\nconst READ_PAUSE_MS = 1800;\n\nfunction showReinforcePanel(item, onClose) {\n  const plain = item.sentence.replace(/<[^>]+>/g, '');\n  const panel = document.getElementById('reinforce-panel');\n  const bar   = document.getElementById('rp-bar');\n\n  document.getElementById('rp-em').innerHTML = item.image\n    ? `<img src=\"${item.image}\" style=\"width:64px;height:64px;object-fit:cover;border-radius:10px;\" alt=\"${item.word}\">`\n    : item.emoji;\n  document.getElementById('rp-word').textContent = item.word;\n  document.getElementById('rp-sent').innerHTML   = item.sentence;\n\n  panel.style.transform = 'translateY(0)';\n\n  const wordMs  = Math.max(800,  (item.word.length / SPEAK_MOODS.celebrate.rate) * 120);\n  const sentMs  = Math.max(1500, (plain.length      / SPEAK_MOODS.neutral.rate)  * 60);\n  const panelMs = Math.max(MIN_READ_MS, wordMs + 400 + sentMs + READ_PAUSE_MS);\n\n  bar.style.transition = 'none'; bar.style.width = '0%';\n  requestAnimationFrame(() => requestAnimationFrame(() => {\n    bar.style.transition = `width ${panelMs}ms linear`;\n    bar.style.width = '100%';\n  }));\n\n  speakThenSentence(item.word, plain, 'celebrate', item.audioFile, item.sentenceAudioFile);\n\n  setTimeout(() => {\n    panel.style.transform = 'translateY(100%)';\n    bar.style.transition = 'none'; bar.style.width = '0%';\n    if (onClose) onClose();\n  }, panelMs);\n}\n\nconst MODULE_REGISTRY = {\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  AUDIO UNDERSTANDING\n  //  Bronze: word \u2192 options unlock after 400ms safety window\n  //          (prevents ghost-click / tap-through from previous screen)\n  //  Silver: sentence \u2192 options appear after first listen\n  //  Gold:   sentence \u2192 options appear when audio ends,\n  //                     hidden again on replay\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-understanding': {\n    render(container, data, tier, onComplete) {\n\n      const myRID    = ++_audioRID;   // snapshot this render's ID\n\n      const isBronze = tier === 'bronze';\n      const isSilver = tier === 'silver';\n      const isGold   = tier === 'gold';\n\n      let hasPlayed = false;\n      let playing   = false;\n      let answered  = false;\n\n      container.innerHTML = `\n        <p class=\"module-question\">${data.question}</p>\n        <button class=\"listen-btn\" id=\"listen-btn\">\n          <span id=\"listen-icon\">\ud83d\udd0a</span>\n          <span id=\"listen-label\">Listen</span>\n        </button>\n        <div class=\"options-grid\" id=\"options-grid\"></div>\n        <button class=\"next-ex-btn\" id=\"next-btn\" style=\"display:none\">Next \u2192</button>\n      `;\n\n      const listenBtn  = container.querySelector('#listen-btn');\n      const listenIcon = container.querySelector('#listen-icon');\n      const listenLbl  = container.querySelector('#listen-label');\n      const grid       = container.querySelector('#options-grid');\n      const nextBtn    = container.querySelector('#next-btn');\n\n      // \u2500\u2500 Build options \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      // ALL options start disabled + locked, regardless of tier.\n      // Bronze unlocks via setTimeout below.\n      // Silver / Gold unlock after audio plays.\n      data.options.forEach(opt => {\n        const btn = document.createElement('button');\n        btn.className   = 'option-btn locked';\n        btn.textContent = opt;\n        btn.disabled    = true;\n\n        btn.addEventListener('click', () => {\n          if (answered || btn.disabled) return;\n          answered = true;\n          TTS && TTS.cancel();\n\n          const correct = (opt === data.answer);\n          btn.classList.add(correct ? 'correct' : 'wrong');\n          if (!correct) {\n            grid.querySelectorAll('.option-btn').forEach(b => {\n              if (b.textContent === data.answer) b.classList.add('correct');\n            });\n          }\n          grid.querySelectorAll('.option-btn').forEach(b => b.disabled = true);\n          nextBtn.style.display = 'block';\n          nextBtn.onclick = () => onComplete(correct ? 1 : 0);\n        });\n\n        grid.appendChild(btn);\n      });\n\n      // \u2500\u2500 Unlock / lock helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function unlockOptions() {\n        if (answered) return;\n        grid.querySelectorAll('.option-btn').forEach(b => {\n          b.classList.remove('locked');\n          b.disabled = false;\n        });\n      }\n      function lockOptions() {\n        if (answered) return;\n        grid.querySelectorAll('.option-btn').forEach(b => {\n          b.classList.add('locked');\n          b.disabled = true;\n        });\n      }\n\n      // Bronze: unlock after 400ms \u2014 prevents ghost clicks / tap-through\n      // events from the previous screen landing on newly rendered buttons.\n      if (isBronze) {\n        setTimeout(() => {\n          if (_audioRID !== myRID || answered) return; // stale or already done\n          unlockOptions();\n        }, 400);\n      }\n\n      // \u2500\u2500 TTS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function finishPlayback() {\n        if (_audioRID !== myRID) return;\n        playing = false;\n        hasPlayed = true;\n        listenIcon.textContent = '\ud83d\udd0a';\n        listenLbl.textContent  = 'Listen again';\n        listenBtn.classList.remove('playing');\n        if (isSilver || isGold) unlockOptions();\n      }\n\n      function speak() {\n        if (playing) return;\n        playing = true;\n        listenIcon.textContent = '\u23f8';\n        listenLbl.textContent  = 'Playing\u2026';\n        listenBtn.classList.add('playing');\n\n        // Gold: hide options on replay\n        if (isGold && hasPlayed) lockOptions();\n\n        if (data.audioFile) {\n          const a = new Audio(data.audioFile);\n          a.onended = finishPlayback;\n          a.onerror = () => speakViaSynthesis();\n          a.play().catch(() => speakViaSynthesis());\n          return;\n        }\n        speakViaSynthesis();\n      }\n\n      function speakViaSynthesis() {\n        if (!TTS) { playing = false; unlockOptions(); return; }\n        TTS.cancel();\n        let u;\n        try { u = new SpeechSynthesisUtterance(data.audio); }\n        catch(e) { playing = false; unlockOptions(); return; }\n        u.rate  = isBronze ? 0.8 : 0.85;\n        u.lang  = 'en-US';\n        u.onend = finishPlayback;\n        TTS.speak(u);\n      }\n\n      listenBtn.addEventListener('click', speak);\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  GAP FILL\n  //  One blank per question. Tap a word to fill it.\n  //  Tap the same word again to clear.\n  //  Check button confirms answer.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'gap-fill': {\n    render(container, data, tier, onComplete) {\n      const { sentence, options, answer } = data;\n      let filled   = null;\n      let answered = false;\n\n      const sentenceHTML = sentence.replace(\n        '___',\n        '<span class=\"blank-slot\" id=\"blank-slot\">___</span>'\n      );\n\n      container.innerHTML = `\n        <p class=\"module-question\">Choose the missing word.</p>\n        <div class=\"sentence-display\">${sentenceHTML}</div>\n        <div class=\"word-bank\" id=\"word-bank\"></div>\n        <button class=\"next-ex-btn\" id=\"check-btn\" style=\"display:none;margin-top:16px\">Check \u2713</button>\n        <button class=\"next-ex-btn\" id=\"next-btn\"  style=\"display:none\">Next \u2192</button>\n      `;\n\n      const blankSlot = container.querySelector('#blank-slot');\n      const wordBank  = container.querySelector('#word-bank');\n      const checkBtn  = container.querySelector('#check-btn');\n      const nextBtn   = container.querySelector('#next-btn');\n\n      // Shuffle options\n      [...options].sort(() => Math.random() - 0.5).forEach(word => {\n        const btn = document.createElement('button');\n        btn.className    = 'word-btn';\n        btn.textContent  = word;\n        btn.dataset.word = word;\n\n        btn.addEventListener('click', () => {\n          if (answered) return;\n          // Toggle: tap same word to deselect\n          if (filled === word) {\n            filled = null;\n            btn.classList.remove('selected');\n            blankSlot.textContent  = '___';\n            blankSlot.style.color  = '';\n            checkBtn.style.display = 'none';\n          } else {\n            // Deselect previous\n            wordBank.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));\n            filled = word;\n            btn.classList.add('selected');\n            blankSlot.textContent  = word;\n            blankSlot.style.color  = 'var(--text)';\n            checkBtn.style.display = 'block';\n          }\n        });\n\n        wordBank.appendChild(btn);\n      });\n\n      checkBtn.addEventListener('click', () => {\n        if (!filled || answered) return;\n        answered = true;\n\n        const correct = (filled === answer);\n\n        // Style the blank\n        blankSlot.style.color       = correct ? 'var(--pass)' : 'var(--fail)';\n        blankSlot.style.borderColor = correct ? 'var(--pass)' : 'var(--fail)';\n\n        // Style word bank buttons\n        wordBank.querySelectorAll('.word-btn').forEach(b => {\n          b.disabled = true;\n          if (b.dataset.word === answer)  b.classList.add('correct');\n          if (b.dataset.word === filled && !correct) b.classList.add('wrong');\n          b.classList.remove('selected');\n        });\n\n        // If wrong, show correct answer in blank too\n        if (!correct) {\n          setTimeout(() => { blankSlot.textContent = answer; }, 400);\n        }\n\n        checkBtn.style.display = 'none';\n        nextBtn.style.display  = 'block';\n        nextBtn.onclick = () => onComplete(correct ? 1 : 0);\n      });\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  TRUE / FALSE\n  //  Statement shown. Two big buttons.\n  //  Tap one \u2192 immediate feedback, show correct.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'true-false': {\n    render(container, data, tier, onComplete) {\n      const { statement, answer } = data;\n\n      container.innerHTML = `\n        <p class=\"module-question\">Is this true or false?</p>\n        <div class=\"tf-statement\">${statement}</div>\n        <div class=\"tf-buttons\">\n          <button class=\"tf-btn true-btn\"  id=\"true-btn\">\u2713 True</button>\n          <button class=\"tf-btn false-btn\" id=\"false-btn\">\u2717 False</button>\n        </div>\n        <button class=\"next-ex-btn\" id=\"next-btn\" style=\"display:none\">Next \u2192</button>\n      `;\n\n      const trueBtn  = container.querySelector('#true-btn');\n      const falseBtn = container.querySelector('#false-btn');\n      const nextBtn  = container.querySelector('#next-btn');\n\n      function handleAnswer(chosen) {\n        const correct = (chosen === answer);\n\n        // Mark chosen button\n        const chosenBtn = chosen ? trueBtn : falseBtn;\n        chosenBtn.classList.add(correct ? 'highlight-correct' : 'highlight-wrong');\n\n        // Always show which was correct\n        if (!correct) {\n          const correctBtn = answer ? trueBtn : falseBtn;\n          correctBtn.classList.add('highlight-correct');\n        }\n\n        trueBtn.disabled  = true;\n        falseBtn.disabled = true;\n        nextBtn.style.display = 'block';\n        nextBtn.onclick = () => onComplete(correct ? 1 : 0);\n      }\n\n      trueBtn.addEventListener('click',  () => handleAnswer(true));\n      falseBtn.addEventListener('click', () => handleAnswer(false));\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  WORD MATCH\n  //  Tap a word on the left, then its match on the right.\n  //  Each matched pair gets a distinct colour from PALETTE.\n  //  Wrong \u2192 both flash red, deselect.\n  //  Score: 1.0 minus 0.1 per wrong attempt (floor 0.6).\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'word-match': {\n    render(container, data, tier, onComplete) {\n      const { pairs } = data;\n      let selectedLeft = null;\n      let matchedCount = 0;\n      let wrongCount   = 0;\n      const total      = pairs.length;\n\n      // One distinct colour per pair \u2014 dark-theme friendly\n      const PALETTE = [\n        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' }, // teal\n        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' }, // purple\n        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' }, // orange\n        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' }, // pink\n        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }, // lime\n      ];\n\n      container.innerHTML = `\n        <p class=\"module-question\">Match the words.</p>\n        <p class=\"match-score\" id=\"match-score\">${total} pairs to match</p>\n        <div class=\"match-grid\">\n          <div class=\"match-col\" id=\"left-col\"></div>\n          <div class=\"match-col\" id=\"right-col\"></div>\n        </div>\n        <button class=\"next-ex-btn\" id=\"next-btn\" style=\"display:none\">Next \u2192</button>\n      `;\n\n      const leftCol    = container.querySelector('#left-col');\n      const rightCol   = container.querySelector('#right-col');\n      const scoreLabel = container.querySelector('#match-score');\n      const nextBtn    = container.querySelector('#next-btn');\n\n      // Shuffle both columns independently, preserving pair index\n      const leftItems  = pairs.map((p, i) => ({ ...p, pairIdx: i })).sort(() => Math.random() - 0.5);\n      const rightItems = pairs.map((p, i) => ({ ...p, pairIdx: i })).sort(() => Math.random() - 0.5);\n\n      leftItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className       = 'match-btn';\n        btn.textContent     = pair.left;\n        btn.dataset.key     = pair.left;\n        btn.dataset.side    = 'left';\n        btn.dataset.pairIdx = pair.pairIdx;\n        leftCol.appendChild(btn);\n      });\n\n      rightItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className       = 'match-btn';\n        btn.textContent     = pair.right;\n        btn.dataset.key     = pair.left;   // keyed by left value\n        btn.dataset.side    = 'right';\n        btn.dataset.pairIdx = pair.pairIdx;\n        rightCol.appendChild(btn);\n      });\n\n      function applyMatchColor(btn) {\n        const c = PALETTE[parseInt(btn.dataset.pairIdx) % PALETTE.length];\n        btn.style.borderColor = c.border;\n        btn.style.background  = c.bg;\n        btn.style.color       = c.color;\n        btn.classList.add('matched');\n        btn.disabled = true;\n      }\n\n      container.querySelectorAll('.match-btn').forEach(btn => {\n        btn.addEventListener('click', () => {\n          if (btn.classList.contains('matched')) return;\n\n          if (btn.dataset.side === 'left') {\n            container.querySelectorAll('.match-btn[data-side=\"left\"]')\n              .forEach(b => b.classList.remove('selected'));\n            if (selectedLeft === btn) {\n              selectedLeft = null;\n            } else {\n              selectedLeft = btn;\n              btn.classList.add('selected');\n            }\n            return;\n          }\n\n          if (!selectedLeft) return;\n\n          const isMatch = (selectedLeft.dataset.key === btn.dataset.key);\n\n          if (isMatch) {\n            const leftBtn = selectedLeft;\n            selectedLeft  = null;\n            applyMatchColor(leftBtn);\n            applyMatchColor(btn);\n            matchedCount++;\n\n            const remaining = total - matchedCount;\n            scoreLabel.textContent = remaining > 0\n              ? `${remaining} pair${remaining > 1 ? 's' : ''} left`\n              : 'All matched! \u2713';\n\n            if (matchedCount === total) {\n              const score = Math.max(0.6, 1 - (wrongCount * 0.1));\n              nextBtn.style.display = 'block';\n              nextBtn.onclick = () => onComplete(score);\n            }\n          } else {\n            wrongCount++;\n            selectedLeft.classList.add('wrong-flash');\n            btn.classList.add('wrong-flash');\n            const prevLeft = selectedLeft;\n            selectedLeft   = null;\n            setTimeout(() => {\n              prevLeft.classList.remove('wrong-flash', 'selected');\n              btn.classList.remove('wrong-flash');\n            }, 500);\n          }\n        });\n      });\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SEQUENCING\n  //  Items shown in pool. Tap to place into numbered slots.\n  //  Tap a filled slot to return item to pool.\n  //  Check button appears when all slots filled.\n  //  Score: correct positions / total.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'sequencing': {\n    render(container, data, tier, onComplete) {\n      const { prompt, items, correct } = data;\n      const slots    = new Array(correct.length).fill(null);\n      let checked    = false;\n\n      // Shuffle pool\n      const shuffled = [...items].sort(() => Math.random() - 0.5);\n\n      container.innerHTML = `\n        <p class=\"seq-prompt\">${prompt}</p>\n        <div class=\"seq-slots\" id=\"seq-slots\"></div>\n        <p class=\"seq-pool-label\">Tap to place \u2193</p>\n        <div class=\"seq-pool\"  id=\"seq-pool\"></div>\n        <button class=\"next-ex-btn\" id=\"check-btn\" style=\"display:none;margin-top:4px\">Check \u2713</button>\n        <button class=\"next-ex-btn\" id=\"next-btn\"  style=\"display:none\">Next \u2192</button>\n      `;\n\n      const slotsEl  = container.querySelector('#seq-slots');\n      const poolEl   = container.querySelector('#seq-pool');\n      const checkBtn = container.querySelector('#check-btn');\n      const nextBtn  = container.querySelector('#next-btn');\n\n      // \u2500\u2500 Render slots \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function renderSlots() {\n        slotsEl.innerHTML = '';\n        slots.forEach((val, i) => {\n          const slot = document.createElement('div');\n          slot.className = 'seq-slot' + (val ? ' filled' : '');\n          slot.innerHTML = `<div class=\"slot-num\">${i + 1}</div><div class=\"slot-text\">${val || ''}</div>`;\n\n          if (val && !checked) {\n            slot.addEventListener('click', () => {\n              // Return item to pool\n              const word = slots[i];\n              slots[i] = null;\n              poolEl.querySelectorAll('.seq-item').forEach(b => {\n                if (b.dataset.word === word) b.classList.remove('used');\n              });\n              renderSlots();\n              updateCheck();\n            });\n          }\n\n          slotsEl.appendChild(slot);\n        });\n      }\n\n      function updateCheck() {\n        checkBtn.style.display = slots.every(s => s !== null) ? 'block' : 'none';\n      }\n\n      // \u2500\u2500 Render pool \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      shuffled.forEach(word => {\n        const btn = document.createElement('button');\n        btn.className    = 'seq-item';\n        btn.textContent  = word;\n        btn.dataset.word = word;\n\n        btn.addEventListener('click', () => {\n          if (btn.classList.contains('used') || checked) return;\n          const emptyIdx = slots.indexOf(null);\n          if (emptyIdx === -1) return;\n          slots[emptyIdx] = word;\n          btn.classList.add('used');\n          renderSlots();\n          updateCheck();\n        });\n\n        poolEl.appendChild(btn);\n      });\n\n      // \u2500\u2500 Check answer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      checkBtn.addEventListener('click', () => {\n        if (checked) return;\n        checked = true;\n        checkBtn.style.display = 'none';\n\n        // Disable pool items\n        poolEl.querySelectorAll('.seq-item').forEach(b => b.style.pointerEvents = 'none');\n\n        let correctCount = 0;\n        slotsEl.querySelectorAll('.seq-slot').forEach((slot, i) => {\n          const isCorrect = (slots[i] === correct[i]);\n          slot.classList.add(isCorrect ? 'correct' : 'wrong');\n          // Show correct label if wrong\n          if (!isCorrect) {\n            slot.querySelector('.slot-text').innerHTML =\n              `<span style=\"text-decoration:line-through;opacity:0.5\">${slots[i]}</span>\n               <span style=\"color:var(--pass);margin-left:6px\">\u2192 ${correct[i]}</span>`;\n          }\n          if (isCorrect) correctCount++;\n        });\n\n        nextBtn.style.display = 'block';\n        nextBtn.onclick = () => onComplete(correctCount / correct.length);\n      });\n\n      renderSlots();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  AUDIO SPEAKING\n  //  Three-button compare mechanic:\n  //    [\ud83d\udd0a Model] \u2014 plays TTS (swap src for MP3 later)\n  //    [\u25b6 You]   \u2014 plays back student's recording (unlocks after first record)\n  //    [\ud83c\udfa4 Rec]  \u2014 records / re-records via MediaRecorder\n  //\n  //  Uses MediaRecorder API (works on iOS Safari 14.5+, Chrome, Firefox, Edge).\n  //  Falls back to model-only + self-assess if mic permission denied.\n  //  Scoring: self-assess only \u2014 student decides when they're happy.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-speaking': {\n    render(container, data, tier, onComplete) {\n      const { prompt, target } = data;\n      const isBronze = tier === 'bronze';\n\n      let modelPlaying   = false;\n      let modelAudio     = null;\n      let selfPlaying    = false;\n      let isRecording    = false;\n      let done           = false;\n      let recordingBlob  = null;\n      let selfAudio      = null;\n      let mediaRecorder  = null;\n      let stream         = null;\n\n      container.innerHTML = `\n        <p class=\"module-question\">${prompt}</p>\n        <div class=\"speak-target\">${target}</div>\n        <div class=\"speak-trio\">\n          <button class=\"trio-btn model\" id=\"model-btn\">\n            <span class=\"trio-icon\" id=\"model-icon\">\ud83d\udd0a</span>\n            <span class=\"trio-label\">Model</span>\n          </button>\n          <button class=\"trio-btn playback\" id=\"play-btn\">\n            <span class=\"trio-icon\" id=\"play-icon\">\u25b6</span>\n            <span class=\"trio-label\">You</span>\n          </button>\n          <button class=\"trio-btn record\" id=\"rec-btn\">\n            <span class=\"trio-icon\" id=\"rec-icon\">\ud83c\udfa4</span>\n            <span class=\"trio-label\" id=\"rec-label\">Record</span>\n          </button>\n        </div>\n        <p class=\"speak-hint\" id=\"speak-hint\">Hear the model, then record yourself.</p>\n        <div id=\"assess-wrap\" style=\"display:none\">\n          <div class=\"assess-btns\">\n            <button class=\"assess-btn assess-yes\" id=\"assess-yes\">\u2713 That sounded right</button>\n            <button class=\"assess-btn assess-no\"  id=\"assess-no\">\u21a9 I need more practice</button>\n          </div>\n        </div>\n        <button class=\"next-ex-btn\" id=\"next-btn\" style=\"display:none\">Next \u2192</button>\n      `;\n\n      const modelBtn  = container.querySelector('#model-btn');\n      const modelIcon = container.querySelector('#model-icon');\n      const playBtn   = container.querySelector('#play-btn');\n      const playIcon  = container.querySelector('#play-icon');\n      const recBtn    = container.querySelector('#rec-btn');\n      const recIcon   = container.querySelector('#rec-icon');\n      const recLabel  = container.querySelector('#rec-label');\n      con
