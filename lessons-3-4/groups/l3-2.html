<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice-note hunt · Group 2</title><style>:root{--c:#2a8cf0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:linear-gradient(#f5ecff,#dff1ff);color:#1c1b2e;padding:20px;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.num{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.nt{display:flex;align-items:center;justify-content:space-between;width:100%;height:150px;margin:0 0 16px;padding:0 26px;border-radius:36px;border:6px solid var(--c);background:#fff;box-shadow:0 10px 24px rgba(60,30,140,.14);font:inherit;cursor:pointer}
.nt .pic{font-size:84px;line-height:1}.nt .pl{width:92px;height:92px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.nt.on{background:#fff7e0}.nt.on .pl{animation:pu 1s infinite}@keyframes pu{50%{transform:scale(1.14)}}.g{margin:6px 0 10px;font-weight:800;font-size:26px}</style></head><body><div class="top"><div class="num">2</div></div><button class="nt" aria-label="voice note" data-clip="" data-say="Her temperature is thirty-nine point two. Normal is about thirty-seven. That is a proper fever."><span class="pic">🌡️</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="Her pulse is one hundred and four beats a minute. Normal is sixty to one hundred. A little fast."><span class="pic">💓</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="Lab result. Platelets: ninety-five thousand. Normal is one hundred and fifty to four hundred and fifty thousand. White cells: three thousand one hundred. Normal is four and a half to eleven thousand."><span class="pic">🩸</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><script>var cur=null;function stop(){if(cur){cur.pause();cur=null}if(window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('.nt.on').forEach(function(x){x.classList.remove('on')})}
document.querySelectorAll('.nt').forEach(function(b){b.onclick=function(){var was=b.classList.contains('on');stop();if(was)return;b.classList.add('on');var c=b.dataset.clip;if(c){cur=new Audio(c);cur.onended=function(){b.classList.remove('on')};cur.play()}else if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(b.dataset.say);u.lang='en-GB';u.rate=.85;u.onend=function(){b.classList.remove('on')};speechSynthesis.speak(u)}}});</script></body></html>
