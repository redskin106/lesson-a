  useExistingAudio();
}

function renderAudioModal(ready){
  if(!audioModalContext) return;
  const ctx = audioModalContext;
  const spoken = ctx.spokenText || ctx.text;
  const showsSubstitution = spoken !== ctx.text;
  const isOverridden = AUDIO_OVERRIDES.has(ctx.key);
  const libMatch = findGlobalAudio(spoken, ctx.persona);
  const showReuseOffer = libMatch && !isOverridden && !audioModalOverriding;

  let reuseSectionHtml = '';
  if(showReuseOffer){
    reuseSectionHtml = `
      <div class="audio-modal-status" style="margin:12px 0;">🔗 Using shared bank audio — same as every other lesson using this text.</div>
      <div class="audio-modal-row">
        <button class="btn primary" onclick="useExistingAudio()">✓ Use this audio</button>
        <button class="btn" onclick="startAudioOverride()">Generate different, just for this lesson →</button>
      </div>`;
  } else if(isOverridden && !audioModalOverriding){
    reuseSectionHtml = `
      <div class="audio-modal-status" style="margin:12px 0;">🔓 This lesson uses its own audio, different from the bank.</div>
      <div class="audio-modal-row">
        <button class="btn" onclick="revertToLibraryAudio()">Revert to bank audio</button>
      </div>`;
  }

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal" style="width:480px;">
        <div class="modal-head"><div class="modal-title">Generate audio</div><div class="modal-close" onclick="closeAudioModal()">✕</div></div>
        <div class="audio-modal-text">"${ctx.text}"</div>
        ${showsSubstitution ? `<div class="audio-modal-status" style="margin:-8px 0 12px;">🔊 Will be spoken as: "${spoken}"</div>` : ''}
        <div class="wiz-field">
          <label>Voice</label>
          <select class="wiz-select" id="audioVoiceSelect" onchange="switchAudioVoice()">
            <option value="Teaching" ${ctx.persona==='Teaching'?'selected':''}>Teaching voice</option>
            <option value="Celebration" ${ctx.persona==='Celebration'?'selected':''}>Celebration voice</option>
          </select>
        </div>
        ${reuseSectionHtml}
        ${(!showReuseOffer && !(isOverridden && !audioModalOverriding)) ? `
        <div class="audio-modal-row">
          <button class="btn" onclick="playDraftTTS(audioModalContext.spokenText || audioModalContext.text)">▶ Play draft (live TTS)</button>
          <button class="btn primary" id="genFinalBtn" onclick="generateFinalAudio()" ${ready?'disabled style="opacity:.5;"':''}>${ready?'✓ Generated':'✨ Generate final (ElevenLabs)'}</button>
        </div>
        <div class="audio-modal-status" id="genFinalStatus">${ready?'Preview below, or accept to mark this resolved.':''}</div>
        <div class="modal-actions">
          <button class="btn" onclick="closeAudioModal()">Cancel</button>
          <button class="btn primary" id="acceptAudioBtn" onclick="acceptGeneratedAudio()" ${ready?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>Accept &amp; mark resolved</button>
        </div>` : `
        <div class="audio-modal-row" style="margin-top:14px;">
          <button class="btn" onclick="playDraftTTS(audioModalContext.spokenText || audioModalContext.text)">▶ Play draft (live TTS)</button>
        </div>
        <div class="modal-actions"><button class="btn" onclick="closeAudioModal()">Close</button></div>`}
      </div>
    </div>`;
}

function generateFinalAudio(){
  const statusEl = document.getElementById('genFinalStatus');
  statusEl.textContent = 'Generating with ElevenLabs…';
  document.getElementById('genFinalBtn').disabled = true;
  setTimeout(() => {
    if(!audioModalContext) return; // modal was closed while "generating"
    renderAudioModal(true);
  }, 700);
}

function acceptGeneratedAudio(){
  if(!audioModalContext) return;
  const ctx = audioModalContext;
  if(audioModalOverriding){
    AUDIO_OVERRIDES.add(ctx.key); // this field's audio deliberately diverges — don't offer it to other lessons, don't get offered theirs
    resolveAudioContext(ctx, { fromLibrary:false, isOverride:true });
  } else {
    resolveAudioContext(ctx, { fromLibrary:false });
  }
  closeAudioModal();
}

function buildFlagKey(moduleId, tier, fieldType, index, itemIndex){
  return currentLessonId+'::'+moduleId+'::'+tier+'::'+fieldType+(itemIndex!=null?'.item'+itemIndex:'')+(index!=null?index:'');
}

// ---- Audio-recorded baseline: SEPARATE from live content on purpose. ----
// Live content (LESSON_CONTENT) updates immediately as a teacher types, so nothing is ever lost
// switching tiers/modules. This baseline only updates when audio is actually generated & accepted —
// it answers "what text did we last generate audio for," not "what does the field currently say."
const AUDIO_RECORDED = {}; // keyed by lessonId -> moduleId -> (mirrors that module's data shape, text fields only)

function ensureAudioRecorded(lessonId){
  if(AUDIO_RECORDED[lessonId]) return;
  if(lessonId === 'food-court'){
    // Food Court is treated as an existing, previously-published lesson — its original seed content
    // already has real audio in production, so that's the starting baseline.
    AUDIO_RECORDED[lessonId] = {
      gapfill: JSON.parse(JSON.stringify(FOOD_COURT_GAPFILL)),
      spelling: JSON.parse(JSON.stringify(FOOD_COURT_SPELLING)),
    };
  } else {
    // Everything else (Colors, wizard-created lessons) is freshly authored — nothing has audio yet,
    // honestly, until a teacher generates it. Starts empty; every module falls back to '' below.
    AUDIO_RECORDED[lessonId] = {};
  }
}

function getBaselineValue(moduleId, tierKey, fieldType, index, itemIndex){
  ensureAudioRecorded(currentLessonId);
  const data = AUDIO_RECORDED[currentLessonId][moduleId];
  if(!data) return '';
  const tier = data[tierKey];
  const type = instanceType(moduleId);
  try{
    switch(type){
      case 'gapfill': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return fieldType==='sentence' ? (it && it.sentence || '') : (it && it.options && it.options[index] || '');
      }
      case 'truefalse': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return (it && it.statement) || '';
      }
      case 'listenchoose': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return (it && it.question) || '';
      }
      case 'sayit': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return (it && it.target) || '';
      }
      case 'putinorder': {
        const it = tier && tier.items && tier.items[itemIndex!=null?itemIndex:0];
        return (it && it.items && it.items[index]) || '';
      }
      case 'wordmatch': case 'listenmatch': {
        const it = tier && tier.items && tier.items[index];
        if(!it) return '';
        return fieldType==='pairLeft' ? (it.left||'') : (it.right||'');
      }
      case 'spelling': case 'wordscramble':
        return (tier && tier.items && tier.items[index] && tier.items[index].word) || '';
      case 'memorypairs': case 'picword':
        return (tier && tier.items && tier.items[index] && tier.items[index].word) || '';
      case 'buildsentence':
        return (tier && tier.items && tier.items[index] && tier.items[index]._recordedSpoken) || '';
      default: return '';
    }
  }catch(e){ return ''; }
}

function setBaselineValue(lessonId, moduleId, tierKey, fieldType, index, value, itemIndex){
  ensureAudioRecorded(lessonId);
  if(!AUDIO_RECORDED[lessonId][moduleId]) AUDIO_RECORDED[lessonId][moduleId] = {};
  const data = AUDIO_RECORDED[lessonId][moduleId];
  const ensureTier = (shape) => { if(!data[tierKey]) data[tierKey] = shape; return data[tierKey]; };
  const type = instanceType(moduleId);
  switch(type){
    case 'gapfill': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = { options:[] };
      if(fieldType==='sentence') t.items[ii].sentence = value;
      else { if(!t.items[ii].options) t.items[ii].options = []; t.items[ii].options[index] = value; }
      break;
    }
    case 'truefalse': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = {};
      t.items[ii].statement = value;
      break;
    }
    case 'listenchoose': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = {};
      t.items[ii].question = value;
      break;
    }
    case 'sayit': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = {};
      t.items[ii].target = value;
      break;
    }
    case 'putinorder': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      const ii = itemIndex!=null ? itemIndex : 0;
      if(!t.items[ii]) t.items[ii] = { items:[] };
      if(!t.items[ii].items) t.items[ii].items = [];
      t.items[ii].items[index] = value;
      break;
    }
    case 'wordmatch': case 'listenmatch': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      if(!t.items[index]) t.items[index] = {};
      if(fieldType==='pairLeft') t.items[index].left = value; else t.items[index].right = value;
      break;
    }
    case 'spelling': case 'wordscramble': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      if(!t.items[index]) t.items[index] = {};
      t.items[index].word = value;
      break;
    }
    case 'memorypairs': case 'picword': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      if(!t.items[index]) t.items[index] = {};
      t.items[index].word = value;
      break;
    }
    case 'buildsentence': {
      const t = ensureTier({ items:[] });
      if(!t.items) t.items = [];
      if(!t.items[index]) t.items[index] = {};
      t.items[index]._recordedSpoken = value;
      break;
    }
  }
}

function speakableModuleName(moduleId){
  return instanceLabel(moduleId);
}

// Called from every module's live-edit handlers to keep a field's 🔊 icon and the Audio Polish
// backlog in sync with whatever's currently typed — the same mechanism Gap-fill pioneered, generalized.
function syncSpeakableField(moduleId, fieldType, index, liveText, iconEl, answer, tierOverride, itemIndex){
  const tier = tierOverride || currentTier;
  const lessonName = (LESSONS.find(l=>l.id===currentLessonId) || {}).name || currentLessonId;
  const recorded = getBaselineValue(moduleId, tier, fieldType, index, itemIndex);
  const key = buildFlagKey(moduleId, tier, fieldType, index, itemIndex);
  const needs = (liveText !== recorded) || liveText === '';
  const overridden = !needs && AUDIO_OVERRIDES.has(key);
  if(iconEl){
    iconEl.className = iconEl.className.replace(/\b(ok|needs|overridden)\b/g, '').trim() + ' ' + (needs ? 'needs' : (overridden ? 'overridden' : 'ok'));
    iconEl.title = needs ? 'Needs new audio' : (overridden ? 'Custom audio for this lesson only' : 'Audio matches');
  }
  if(needs && liveText){
    LIVE_FLAGS[key] = {
      text: liveText, spokenText: fillBlank(liveText, answer), lesson:lessonName, module: speakableModuleName(moduleId),
      tier: tier==='shared' ? 'All tiers' : tier.charAt(0).toUpperCase()+tier.slice(1),
      lessonId: currentLessonId, tierKey: tier, moduleId, fieldType, optionIndex: index, itemIndex
    };
  } else {
    delete LIVE_FLAGS[key];
  }
  return needs;
}

function setAudioStatusBadge(el, needs){
  el.className = 'audio-status ' + (needs ? 'needs' : 'ok');
  el.textContent = needs ? '⚠ needs new audio' : '✓ audio matches';
}

function openFieldAudioModal(moduleId, fieldType, index, text, tierOverride, itemIndex){
  const tier = tierOverride || currentTier;
  openAudioGenerator({
    source:'live', key: buildFlagKey(moduleId, tier, fieldType, index, itemIndex), text, spokenText: text, persona:'Teaching',
    lessonId: currentLessonId, tierKey: tier, fieldType, optionIndex: index, moduleId, itemIndex
  });
}

function resolveAudioContext(ctx, opts){
  opts = opts || {};
  if(ctx.source === 'live'){
    delete LIVE_FLAGS[ctx.key];
    // Update the "recorded" baseline for the field's OWN lesson (not necessarily the one currently open),
    // so this text no longer re-flags itself as needing audio next time that lesson is edited.
    if(ctx.lessonId && ctx.tierKey && ctx.fieldType && ctx.moduleId){
      setBaselineValue(ctx.lessonId, ctx.moduleId, ctx.tierKey, ctx.fieldType, ctx.optionIndex, ctx.text, ctx.itemIndex);
    }
    // Register into the shared library so other lessons using this exact text+voice get it for free —
    // unless this was a deliberate "different audio just for this lesson" override, which should stay local.
    if(!opts.isOverride){
      const lessonName = (LESSONS.find(l=>l.id===ctx.lessonId) || {}).name || ctx.lessonId;
      registerGlobalAudio(ctx.spokenText || ctx.text, ctx.persona, lessonName);
    }
    if(ctx.lessonId === currentLessonId) renderMain(); // refresh whatever's currently on screen so its icon reflects the resolution
  }
}

// ==========================================================================================
// PUBLISH SCHEMA TRANSFORMER — v2, corrected against lesson-shell-v1_3.html directly
//
// What changed from v1: the previous transform produced {questions:[t0,t1,t2]} / {tiers:[...]}
// — an index-ordered ARRAY per module. The real shell's LESSON const uses a tier-NAME-KEYED
// object instead: { id, type, label, data: { bronze:{...}, silver:{...}, gold:{...} } }, and
// module "type" strings are hyphenated (gap-fill, not gapfill). This version matches that.
//
// Known, deliberately NOT solved here (flagged, not silently patched over):
//   1. Multiple instances of the same module type in one lesson (the real shell's example
//      lesson has three separate 'audio-understanding' modules) — the builder still only
//      supports one instance per type. Fixing that is a UI-level change, not a transform fix.
//   2. Per-field parity for every module beyond what's visible in the one real example lesson
//      inspected — e.g. whether 'audio-speaking' needs a keyWords array wasn't re-verified
//      field-by-field here, to avoid guessing new mistakes on top of old ones.
// ==========================================================================================

const TIER_ORDER = ['bronze','silver','gold'];

// Internal builder id -> real shell type string (confirmed from lesson-shell-v1_3.html)
const SHELL_TYPE_MAP = {
  gapfill:       'gap-fill',
  truefalse:     'true-false',
  listenchoose:  'audio-understanding',
  sayit:         'audio-speaking',
  putinorder:    'sequencing',
  wordmatch:     'word-match',
  listenmatch:   'audio-match',
  wordscramble:  'word-scramble',
  spelling:      'spelling',
  buildsentence: 'sentence-building',
  memorypairs:   'memory-pairs',
  picword:       'image-vocab',
  pyramid:       'description-pyramid',
  imagefeeling:  'image-to-feeling',
  creativereflection: 'creative-reflection',
};

// pushedAudioIds: Set of ids (from lessons/{lessonId}/manifest.json, status==='pushed') that
// the TTS tool has actually generated and pushed real audio for. Ids here use the exact same
// '{moduleId}.{tier}.{field}' scheme as extractSpeakableForTTS() — that's what makes the match
// work at all. 10 module types are confirmed to have real audio playback in the shell ever
// get an audioFile attached; putinorder/wordmatch never will (re-verified directly against
// shell-v2's render() functions — genuinely no speak() calls in either one).
// Same algorithm as the TTS tool's slugForFilename() — MUST stay identical, since both sides
// independently construct the same file path: the TTS tool when it pushes the mp3, this
// transform when it writes the shell's audioFile reference. 'id' (used in pushedAudioIds
// matching) stays untouched; the slug is purely a human-readable prefix for browsing the repo.
function slugForFilename(text){
  return (text || '')
    .toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[^a-z0-9\s]/g, '')
    .trim()
    .split(/\s+/)
    .slice(0, 4)
    .join('-')
    .slice(0, 40) || 'audio';
}

function transformModuleForPublish(moduleId, data, pushedAudioIds){
  const type = instanceType(moduleId);
  const pushed = pushedAudioIds || new Set();
  const audioFor = (fieldKey, text) => {
    const id = `${moduleId}.${fieldKey}`;
    return pushed.has(id) ? `audio/${slugForFilename(text)}--${id}.mp3` : undefined;
  };

  switch(type){
    case 'gapfill':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          sentence: it.sentence, answer: it.answer, options: it.options, tokens: it.tokens,
          audioFile: audioFor(`${t}.item${i}.sentence`, it.sentence),
        }))
      }]));

    case 'truefalse':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          statement: it.statement, answer: it.answer, tokens: it.tokens,
          audioFile: audioFor(`${t}.item${i}.statement`, it.statement),
        }))
      }]));

    case 'listenchoose':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          audio: it.audio || it.question, question: it.question,
          options: it.options, answer: it.answer,
          audioFile: audioFor(`${t}.item${i}.audio`, it.audio),
        }))
      }]));

    case 'sayit':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          prompt: it.prompt, target: it.target, keyWords: it.keyWords || [],
          audioFile: audioFor(`${t}.item${i}.target`, it.target),
        }))
      }]));

    case 'pyramid':
      // full_sentence_audio is generated from the AUTHORED correct answers
      // (l1.answer + each l2 group's answer, plus the first l3 tile if one
      // exists) — the canonical completion sentence, since the actual
      // assembled sentence a student reaches depends on which tile they
      // pick at runtime. Doubles as Say It's model audio on completion —
      // one file, two uses, per spec, no separate asset needed.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => {
          const l2Words = (it.l2 || []).map(g => g.answer).filter(Boolean);
          const l3Word = (it.l3 && it.l3.tiles && it.l3.tiles[0]) || '';
          const canonicalSentence = `It's a ${[...l2Words, it.l1.answer].filter(Boolean).join(' ')}${l3Word ? ' ' + l3Word : ''}.`;
          return {
            emoji: it.emoji,
            l1: { options: it.l1.options, answer: it.l1.answer },
            l2: (it.l2 || []).map(g => ({ label: g.label, options: g.options, answer: g.answer })),
            l3: { tiles: (it.l3 && it.l3.tiles) || [], because_mode: (it.l3 && it.l3.because_mode) || 'typed' },
            full_sentence_audio: audioFor(`${t}.item${i}.fullsentence`, canonicalSentence),
          };
        })
      }]));

    case 'imagefeeling':
      // No pre-generated audio needed here — the model sentence depends on
      // which tile the student picks at runtime (genuinely no correct
      // answer to pre-render for), so the shell synthesizes it live via
      // browser TTS from mascotName + whichever feeling was chosen.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map(it => ({
          stimulusType: it.stimulusType, stimulusValue: it.stimulusValue, stimulusLabel: it.stimulusLabel,
          mascotEmoji: it.mascotEmoji || '👽', mascotName: it.mascotName || 'Zorp',
          tiles: it.tiles || [], because_mode: it.because_mode || 'typed',
        }))
      }]));

    case 'creativereflection':
      // Same reasoning as image-to-feeling — the completed sentence is
      // built from the student's own typed words at runtime, so there's
      // nothing fixed to pre-generate audio for. Template and hints pass
      // through unchanged; the shell does the {n}-placeholder rendering.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map(it => ({
          template: it.template || '', blankHints: it.blankHints || [],
        }))
      }]));

    case 'putinorder':
      // 'sequence' is the shuffled display order at runtime — we hand over the correct order for
      // both; the live module's own safeShuffle() does the actual shuffling client-side.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map(puzzle => ({
          prompt: puzzle.prompt, sequence: [...puzzle.items], correct: [...puzzle.items]
        }))
      }]));

    case 'wordmatch':
      // { pick, items:[{left,right}] } — confirmed directly against lesson-shell-v2.html's
      // 'word-match' renderer, which destructures exactly { pick, items }.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map(p => ({ left: p.left, right: p.right }))
      }]));

    case 'listenmatch':
      // { pick, items:[{left,right}] } — same shape and engine as word-match, confirmed against
      // shell-v2's 'audio-match' renderer (also destructures { pick, items }, reuses word-match's
      // PALETTE/pairing logic verbatim). The audio/text field-name "correction" this replaced was
      // itself wrong, written against some other/earlier shell version — left is what actually
      // gets spoken (dataset.audio = pair.left in the real renderer), right is the tap target.
      // left===right always here in practice (an audio-echo match), so either value works either way.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((p,i) => ({ left: p.left, right: p.right, audioFile: audioFor(`${t}.item${i}.left`, p.left) }))
      }]));

    case 'wordscramble':
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => {
          const o = { word: it.word };
          if(it.emoji) o.emoji = it.emoji;
          // Unconditional, not "if truthy": showReinforcePanel() calls item.sentence.replace(...)
          // on every correct answer with no null-check — an empty string is safe, undefined is a
          // hard crash for the student mid-lesson.
          o.sentence = it.sentence || '';
          if(it.clozeWord) o.clozeWord = it.clozeWord;
          if(it.tokens && it.tokens.length) o.tokens = it.tokens;
          o.audioFile = audioFor(`${t}.item${i}.word`, it.word);
          if(it.sentence) o.sentenceAudioFile = audioFor(`${t}.item${i}.sentence`, it.sentence);
          return o;
        })
      }]));

    case 'spelling':
      // 'sentence' was missing entirely before — spelling's own render() doesn't destructure it,
      // but it hands the whole item to showReinforcePanel() on a correct answer, which calls
      // item.sentence.replace(...) unconditionally. Omitting it was a real crash waiting to
      // happen the first time a student spelled a word correctly.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          word: it.word,
          emoji: it.emoji || undefined,
          sentence: it.sentence || '',
          tokens: (it.tokens && it.tokens.length) ? it.tokens : null,
          audioFile: audioFor(`${t}.item${i}.word`, it.word),
          sentenceAudioFile: it.sentence ? audioFor(`${t}.item${i}.sentence`, it.sentence) : undefined,
        }))
      }]));

    case 'buildsentence':
      // Each chip is its own token here — unlike Gap-fill/True-False, chips aren't merged into
      // phrases, since every chip is individually draggable in the live module.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick,
        items: data[t].items.map((it,i) => ({
          tokens: it.tokens.map(tk => ({ text: tk.text, role: tk.role })),
          audioFile: audioFor(`${t}.item${i}.sentence`, it.tokens.map(tk => tk.text).join(' ')),
        }))
      }]));

    case 'memorypairs':
      // Per-tier pool, matching shell-v2 exactly: { pick, flipback, items }. The comment this
      // replaced was itself a stale half-fix from an earlier session, written against an OLDER
      // shell that hardcoded PAIRS=4 and ignored pick/flipback entirely — that's no longer true;
      // shell-v2's memory-pairs renderer genuinely reads pick and flipback per tier now.
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick, flipback: data[t].flipback,
        items: data[t].items.map((it,i) => ({
          word: it.word, emoji: it.emoji, image: it.image ?? null, sentence: it.sentence, tokens: it.tokens || [],
          audioFile: audioFor(`${t}.item${i}.word`, it.word),
          sentenceAudioFile: it.sentence ? audioFor(`${t}.item${i}.sentence`, it.sentence) : undefined,
        }))
      }]));

    case 'picword':
      // Per-tier pool, matching shell-v2 exactly: { pick, mode, items }. 'cloze' is just the
      // answer word (e.g. "red"), NOT a full sentence — the comment this replaced had that
      // backwards as a "known gap"; it's actually already correct here because the authoring
      // UI's cloze/sentence fields were fixed to match (see blankPicWordData).
      return Object.fromEntries(TIER_ORDER.map(t => [t, {
        pick: data[t].pick, mode: data[t].mode,
        items: data[t].items.map((it,i) => ({
          word: it.word, emoji: it.emoji, sentence: it.sentence, cloze: it.cloze,
          audioFile: audioFor(`${t}.item${i}.word`, it.word),
        }))
      }]));

    default:
      return null;
  }
}

function transformLessonForPublish(lessonId, pushedAudioIds){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return null;
  const content = LESSON_CONTENT[lessonId];
  // Each entry in lesson.modules is now either a bare type slug (first/only instance,
  // e.g. 'gapfill') or a suffixed instance id ('gapfill-2') for repeats — instanceType()
  // resolves either back to the type for SHELL_TYPE_MAP/label lookups, while 'id' below
  // stays the raw instance id, giving every module instance the unique id the real shell
  // needs (matching how mod-1/mod-2/mod-3 are three distinct audio-understanding instances).
  return lesson.modules.map(moduleId => {
    const entry = {
      id: moduleId,
      type: SHELL_TYPE_MAP[instanceType(moduleId)] || instanceType(moduleId),
      label: instanceLabel(moduleId),
      data: transformModuleForPublish(moduleId, content[moduleId], pushedAudioIds),
    };
    const imageVariant = resolveImageVariant(lesson, moduleId);
    if(imageVariant) entry.imageVariant = imageVariant;
    return entry;
  });
}

// Resolves a module's assigned variant ids into actual file paths — the shell
// only ever sees real paths (matching every other asset reference), never the
// Lesson Builder's own variant ids. Returns null (not an empty object) when
// nothing's assigned, so startModule()'s fallback-to-default logic applies
// cleanly rather than the shell trying to read an empty object's fields.
function resolveImageVariant(lesson, moduleId){
  const assignment = lesson.moduleImageAssignments && lesson.moduleImageAssignments[moduleId];
  if(!assignment) return null;
  const resolved = {};
  Object.entries(assignment).forEach(([slotId, variantId]) => {
    const slot = IMAGE_VARIANT_SLOTS[slotId];
    const variant = slot && slot.variants.find(v => v.id === variantId);
    if(variant) resolved[slotId] = variant.file;
  });
  return Object.keys(resolved).length ? resolved : null;
}

// ==========================================================================================
// BRIDGE TO THE TTS TOOL — closes the gap that's been open since we first built the audio
// pipeline: content authored here has had no path into tts-tool-v4 except manual retyping.
// This walks the REAL content shape (post multi-instance fix) and produces exactly the JSON
// shape tts-tool-v4's confirmImport() expects: { lesson, assets:[{id,text,voice,emotion,status,file}] }.
//
// Ids are DETERMINISTIC — '{instanceId}.{tier}.{field}' — not random. That matters: tts-tool's
// import is merge-aware (added for this), so re-exporting after editing one sentence only
// resets that one line to 'pending'; every other line's already-approved or pushed audio is
// left alone, because its id and text didn't change.
//
// Deliberately NOT extracted: 'putinorder' (Sequencing) and 'wordmatch' (Word Match). Verified
// directly against lesson-shell-v1_3.html — neither module has any speak()/TTS call site at
// all, so generating audio for them would spend ElevenLabs credits on lines that can never
// actually play. If the shell ever gains audio for these, add their cases below.
// ==========================================================================================

function stripHtmlForSpeech(s){
  return (s || '').replace(/<[^>]+>/g, '').trim();
}

function extractSpeakableForTTS(lessonId){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return [];
  const content = LESSON_CONTENT[lessonId];
  const items = [];
  const add = (instId, fieldKey, text) => {
    const clean = stripHtmlForSpeech(text);
    if(clean) items.push({ id: `${instId}.${fieldKey}`, text: clean });
  };

  lesson.modules.forEach(instId => {
    const type = instanceType(instId);
    const data = content[instId];
    if(!data) return;

    if(type === 'listenchoose'){
      // Only 'audio' is ever fed to the shell's speak() here — 'question' is on-screen text only.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => add(instId, `${t}.item${i}.audio`, it.audio)));
    } else if(type === 'sayit'){
      // Only 'target' drives playModel() — 'prompt' is on-screen instruction text only.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => add(instId, `${t}.item${i}.target`, it.target)));
    } else if(type === 'pyramid'){
      // Same canonical-sentence construction as transformModuleForPublish's
      // audioFor() key — must match exactly or the "already generated"
      // check silently fails to find a real match.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        const l2Words = (it.l2 || []).map(g => g.answer).filter(Boolean);
        const l3Word = (it.l3 && it.l3.tiles && it.l3.tiles[0]) || '';
        const canonicalSentence = `It's a ${[...l2Words, it.l1.answer].filter(Boolean).join(' ')}${l3Word ? ' ' + l3Word : ''}.`;
        add(instId, `${t}.item${i}.fullsentence`, canonicalSentence);
      }));
    } else if(type === 'listenmatch'){
      // left === right by design for this module (an audio-echo match) — left alone is enough.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((p,i) => add(instId, `${t}.item${i}.left`, p.left)));
    } else if(type === 'spelling' || type === 'wordscramble'){
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        add(instId, `${t}.item${i}.word`, it.word);
        if(it.sentence) add(instId, `${t}.item${i}.sentence`, it.sentence);
      }));
    } else if(type === 'memorypairs' || type === 'picword'){
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        add(instId, `${t}.item${i}.word`, it.word);
        if(it.sentence) add(instId, `${t}.item${i}.sentence`, it.sentence);
      }));
    } else if(type === 'buildsentence'){
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        const sentence = (it.tokens || []).map(tk => tk.text).join(' ');
        add(instId, `${t}.item${i}.sentence`, sentence);
      }));
    } else if(type === 'gapfill'){
      // CORRECTED: the old comment below claimed gapfill has no audio call site at all —
      // true against the OLD shell (lesson-shell-v1_3.html), false against shell-v2. Gap-fill's
      // reinforcement panel (showGrammarReinforce) genuinely speaks the sentence with the blank
      // filled in, on every correct answer.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        const filled = it.answer && it.sentence && it.sentence.includes('___') ? it.sentence.replace('___', it.answer) : it.sentence;
        add(instId, `${t}.item${i}.sentence`, filled);
      }));
    } else if(type === 'truefalse'){
      // CORRECTED, same bug as gapfill above: true-false's renderer calls showGrammarReinforce
      // on every answer (correct or wrong — that module always shows the reinforcement, unlike
      // gapfill which only does on correct), which genuinely speaks the statement. Re-verified
      // directly against shell-v2's 'true-false' render() — putinorder and wordmatch were also
      // re-checked the same way and are genuinely silent, unlike this one.
      TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach((it,i) => {
        add(instId, `${t}.item${i}.statement`, it.statement);
      }));
    }
    // 'putinorder' and 'wordmatch' skipped here — re-verified directly against shell-v2's actual
    // render() functions (not just carried forward from the old lesson-shell-v1_3.html claim):
    // neither one calls speak() or any reinforcement helper anywhere. Confirmed silent, not just
    // assumed.
  });

  return items;
}

// ==========================================================================
// Robust copy/download — file:// pages are NOT a "secure context" in browsers,
// so navigator.clipboard doesn't exist there at all; calling it threw silently,
// with no visible feedback, before this was reported. Textarea.select() and
// execCommand('copy') both work with zero special permissions on any origin,
// including file://, so they're the primary path now — Clipboard API is only
// tried first as a nicety on origins where it actually exists. Worst case, the
// text ends up selected and ready for the device's native manual copy gesture,
// which always works everywhere no matter what the JS APIs allow.
// ==========================================================================
async function copyJsonRobust(textareaId, btn, msgId){
  const ta = document.getElementById(textareaId);
  const msgEl = msgId ? document.getElementById(msgId) : null;
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length); // iOS Safari needs this in addition to .select()

  let copied = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(ta.value); copied = true; }catch(e){ /* fall through */ }
  }
  if(!copied){
    try{ copied = document.execCommand('copy'); }catch(e){ /* fall through */ }
  }

  if(copied){
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
    if(msgEl) msgEl.textContent = '';
  } else if(msgEl){
    msgEl.textContent = 'Couldn\'t copy automatically — the text above is selected, use your device\'s copy option now.';
  }
}

function downloadJsonRobust(textareaId, filename, btn, msgId){
  const ta = document.getElementById(textareaId);
  const msgEl = msgId ? document.getElementById(msgId) : null;
  try{
    const blob = new Blob([ta.value], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if(msgEl) msgEl.textContent = 'If nothing downloaded, use Copy JSON instead and paste into a new file.';
  }catch(e){
    if(msgEl) msgEl.textContent = 'Download isn\'t available here — use Copy JSON instead and paste into a new file.';
  }
}

// A word with no emoji renders as a genuinely blank button in the shell — the "picture" in
// Picture & Word, Memory Pairs, Word Scramble, and Spelling isn't a real image anywhere yet
// (see the Shared Assets note — real illustrations are still a manual, one-time repo upload),
// it's the emoji field standing in. Skipping it in the authoring UI has no visible consequence
// there (just a "?" placeholder button), so it was shipping to students silently.
function findMissingEmojiItems(moduleId, data){
  const type = instanceType(moduleId);
  const missing = [];
  if(type === 'memorypairs' || type === 'picword'){
    TIER_ORDER.forEach(t => (data[t] && data[t].items || []).forEach(it => { if(!it.emoji) missing.push(it.word || '(unnamed)'); }));
  } else if(type === 'wordscramble' || type === 'spelling'){
    TIER_ORDER.forEach(t => {
      (data[t] && data[t].items || []).forEach(it => { if(!it.emoji) missing.push(it.word || '(unnamed)'); });
    });
  }
  return missing;
}

function validateLessonForPublish(lessonId){
  ensureLessonContent(lessonId);
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return ['Lesson not found'];
  const content = LESSON_CONTENT[lessonId];
  const problems = [];
  const modName = id => instanceLabel(id);

  lesson.modules.forEach(moduleId => {
    TIER_ORDER.forEach(t => {
      if(!isTierFilled(moduleId, t, content[moduleId])){
        problems.push(`${modName(moduleId)} — ${t.charAt(0).toUpperCase()+t.slice(1)} isn't filled in yet`);
      }
    });
    const missingEmoji = findMissingEmojiItems(moduleId, content[moduleId]);
    if(missingEmoji.length){
      const words = missingEmoji.slice(0, 5).join(', ') + (missingEmoji.length > 5 ? `, +${missingEmoji.length - 5} more` : '');
      problems.push(`${modName(moduleId)} — missing emoji for: ${words} (shows as a blank button to students)`);
    }
  });
  return problems;
}

    // changed since audio was last touched," not "no audio has ever been generated at all") —
    // shown honestly as unverified rather than silently passed off as a real check.
    audioStatus = getAudioIssuesForLesson(publishLessonId).map(i => ({ ...i, pushed:false }));
    audioVerified = false;
  }

  const missingCount = audioStatus.filter(a => !a.pushed).length;
  if(missingCount > 0){
    publishState = 'audio-warning';
    renderPublishModal(null, audioStatus, audioVerified);
  } else {
    beginPublishSequence();
  }
}

function renderPublishModal(contentProblems, audioStatus, audioVerified){
  const lesson = LESSONS.find(l => l.id === publishLessonId);
  let body = '';

  if(publishState === 'checking-audio'){
    body = `
      <div class="modal-head"><div class="modal-title">Checking audio status…</div></div>
      <div class="upload-note" style="text-align:left;padding:6px 0 0;">${GH_CREDS.token ? 'Reading the real audio manifest from GitHub.' : 'No GitHub connection yet — using local edit history only.'}</div>`;
  } else if(publishState === 'blocked'){
    body = `
      <div class="modal-head"><div class="modal-title">Can't publish yet</div><div class="modal-close" onclick="closeModal()">✕</div></div>
      <div class="upload-note" style="text-align:left;padding:6px 0 0;">${contentProblems.length} tier${contentProblems.length===1?'':'s'} still empty — students would hit blank content.</div>
      <div class="publish-problem-list">${contentProblems.map(p=>`<div class="publish-problem-item">${p}</div>`).join('')}</div>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Go back and finish</button></div>`;
  } else if(publishState === 'audio-warning'){
    const missing = audioStatus.filter(a => !a.pushed);
    const found = audioStatus.filter(a => a.pushed);
    body = `
      <div class="modal-head"><div class="modal-title">Some audio isn't final yet</div><div class="modal-close" onclick="closeModal()">✕</div></div>
      <div class="upload-note" style="text-align:left;padding:6px 0 0;">${found.length} of ${audioStatus.length} field${audioStatus.length===1?'':'s'} have real generated audio; ${missing.length} still on draft (browser) audio. Content itself is complete.
        ${audioVerified
          ? '<br><span style="opacity:0.7;">Checked against the real audio manifest on GitHub.</span>'
          : '<br><span style="color:var(--pink);">Unverified — connect 🔑 GitHub to check against what\'s actually been generated, not just local edit history.</span>'}
      </div>
      <div class="publish-problem-list">${audioStatus.map(a=>`<div class="publish-problem-item audio" style="color:${a.pushed?'var(--pass, #4CAF50)':'var(--orange)'};">${a.pushed?'✓':'🔊'} "${a.text}" — ${a.module} (${a.tier})${a.pushed?' — real audio':''}</div>`).join('')}</div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Go back</button>
        <button class="btn" onclick="closeModal(); exportForTTSTool();">Export missing lines for TTS tool</button>
        <button class="btn primary" onclick="beginPublishSequence()">Publish anyway</button>
      </div>`;
  } else if(publishState === 'publishing' || publishState === 'done' || publishState === 'failed-safe' || publishState === 'failed-after-switch'){
    const isAssets = publishKind === 'assets';
    const targetName = isAssets ? `${publishSteps.filter(s=>s.assetId).length} asset update${publishSteps.filter(s=>s.assetId).length===1?'':'s'}` : (lesson ? lesson.name : 'this lesson');
    const titles = { publishing:'Publishing…', done: isAssets?'Assets pushed':'Published', 'failed-safe':'Publish failed — nothing changed', 'failed-after-switch': isAssets?'Pushed, but the build is lagging':'Published, but the build is lagging' };
    body = `
      <div class="modal-head"><div class="modal-title">${titles[publishState]}</div>${publishState!=='publishing'?'<div class="modal-close" onclick="closeModal()">✕</div>':''}</div>
      <div class="publish-steps">
        ${publishSteps.map(s=>`
          <div class="publish-step ${s.status}">
            <span class="step-icon">${s.status==='done'?'✓':s.status==='failed'?'✕':s.status==='active'?'…':'○'}</span>
            ${s.name}
          </div>`).join('')}
      </div>
      ${publishState==='done' ? `
        <div class="publish-success"><div class="big-check">🎉</div>${isAssets
          ? `${targetName} are live across all 12 modules.`
          : `${targetName} is live.<br><span style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.75;">${ghPagesUrl(lesson ? lesson.id : '')}</span><br><span style="font-size:11px;opacity:0.7;">${publishGhState.pushedAudioIds ? `${publishGhState.pushedAudioIds.size} line(s) linked to real generated audio; everything else falls back to browser speech.` : ''} Pages can take a minute or two to catch up after a push — if it 404s immediately, that's normal, try again shortly.</span>`}</div>
        <div class="modal-actions"><button class="btn primary" onclick="closeModal(); ${isAssets?'renderAssetsView();':'renderDashboard();'}">Done</button></div>` : ''}
      ${publishState==='failed-safe' ? `
        <div class="upload-note" style="text-align:left;padding:10px 0 0;">Nothing was published — the switch to live never happened, so ${targetName} ${isAssets?'are':'is'} exactly as ${isAssets?'they were':'it was'} before you clicked Publish. Safe to try again.${publishLastError ? `<br><br><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--error, #f87171);">${publishLastError}</span>` : ''}</div>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="retryPublish()">Retry publish</button></div>` : ''}
      ${publishState==='failed-after-switch' ? `
        <div class="upload-note" style="text-align:left;padding:10px 0 0;">The switch itself DID succeed — this failure was just the site's build refreshing, a known hiccup (per the handoff, a trivial follow-up push usually clears it). ${targetName} ${isAssets?'are':'is'} marked live; the site should catch up shortly.</div>
        <div class="modal-actions"><button class="btn" onclick="closeModal(); ${isAssets?'renderAssetsView();':'renderDashboard();'}">Close</button><button class="btn primary" onclick="retryPublish()">Retry the build refresh</button></div>` : ''}`;
  }

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal" style="width:460px;">${body}</div>
    </div>`;
}

function beginPublishSequence(){
  if(!GH_CREDS.token){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-overlay">
        <div class="modal" style="width:440px;">
          <div class="modal-head"><div class="modal-title">GitHub credentials needed</div><div class="modal-close" onclick="closeModal()">✕</div></div>
          <div class="upload-note" style="text-align:left;padding:2px 0 12px;">Publishing writes for real now — set your GitHub token first (🔑 GitHub in the topbar), then try again.</div>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn primary" onclick="closeModal(); openGitHubCredsModal();">Set credentials</button>
          </div>
        </div>
      </div>`;
    return;
  }
  const lesson = LESSONS.find(l => l.id === publishLessonId);
  publishKind = 'lesson';
  publishState = 'publishing';
  publishGhState = {};
  publishLastError = null;
  publishSteps = [
    { name: 'Reading current live commit', status: 'pending', isReadRef: true },
    { name: 'Checking for generated audio', status: 'pending', isReadAudioManifest: true },
    ...lesson.modules.map(m => ({ moduleId: m, name: 'Preparing ' + instanceLabel(m) + ' content', status: 'pending' })),
    { name: 'Building combined update', status: 'pending', isBuildUpdate: true },
    { name: 'Creating commit', status: 'pending', isCreateCommit: true },
    { name: 'Publishing — atomic switch', status: 'pending', isAtomicSwitch: true },
    { name: `Done — writes lessons/${lesson.id}/index.html (the real page) + content.json`, status: 'pending' },
  ];
  renderPublishModal();
  runPublishStep(0);
}

function openAssetPublishModal(){
  publishKind = 'assets';
  beginAssetPublishSequence();
}

function beginAssetPublishSequence(){
  publishKind = 'assets';
  publishState = 'publishing';
  const pending = pendingAssets();
  publishSteps = [
    { name: 'Reading current live commit', status: 'pending' },
    ...pending.map(a => ({ assetId: a.id, name: `Preparing ${a.file} (used by all 12 modules)`, status: 'pending' })),
    { name: 'Building combined update — writing into all 12 module folders', status: 'pending' },
    { name: 'Creating commit', status: 'pending' },
    { name: 'Publishing — atomic switch', status: 'pending', isAtomicSwitch: true },
    { name: 'Refreshing Pages build', status: 'pending' },
  ];
  renderPublishModal();
  runPublishStep(0);
}

function markPublishTargetLive(){
  if(publishKind === 'assets'){
    pendingAssets().forEach(a => { a.pending = false; });
    renderAssetsView();
  } else {
    const lesson = LESSONS.find(l => l.id === publishLessonId);
    lesson.status = 'published';
    lesson.editedAgo = 'just now';
    if(publishLessonId === currentLessonId) renderEditorShell();
    renderDashboard();
  }
  saveStateNow();
}

dth: 100%;\n  background: var(--accent); color: #0D1B2A;\n  border: none; border-radius: var(--radius);\n  font-size: 18px; font-weight: 700;\n  padding: 18px; cursor: pointer; margin-top: 20px;\n}\n\n/* \u2500\u2500\u2500 MODULE: GAP FILL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.sentence-display {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 20px 18px;\n  font-size: 18px;\n  line-height: 2;\n  margin-bottom: 20px;\n}\n.blank-slot {\n  display: inline-block;\n  min-width: 80px;\n  border-bottom: 2px solid var(--accent);\n  color: var(--accent);\n  font-weight: 700;\n  text-align: center;\n  padding: 0 6px;\n  transition: color 0.2s, border-color 0.2s;\n}\n.word-bank {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 4px;\n}\n.word-btn {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 15px; font-weight: 600;\n  padding: 12px 16px;\n  cursor: pointer;\n  transition: border-color 0.15s, background 0.15s, color 0.15s;\n}\n.word-btn.selected { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }\n.word-btn.correct  { border-color: var(--pass);   color: var(--pass); }\n.word-btn.wrong    { border-color: var(--fail);   color: var(--fail); }\n.word-btn:disabled { cursor: default; }\n\n/* \u2500\u2500\u2500 MODULE: TRUE / FALSE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.tf-statement {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 24px 20px;\n  font-size: 18px;\n  line-height: 1.6;\n  margin-bottom: 28px;\n  text-align: center;\n}\n.tf-buttons {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n.tf-btn {\n  border: 2px solid transparent;\n  border-radius: var(--radius);\n  font-size: 19px; font-weight: 700;\n  padding: 24px 12px;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.tf-btn.true-btn  { background: rgba(76,175,80,0.1);  color: var(--pass); border-color: var(--pass); }\n.tf-btn.false-btn { background: rgba(239,83,80,0.1);  color: var(--fail); border-color: var(--fail); }\n.tf-btn.highlight-correct { background: var(--pass);  color: #fff; border-color: var(--pass); }\n.tf-btn.highlight-wrong   { background: var(--fail);  color: #fff; border-color: var(--fail); }\n.tf-btn:disabled { cursor: default; opacity: 0.7; }\n\n/* \u2500\u2500\u2500 MODULE: WORD MATCH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.match-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n  margin-bottom: 20px;\n}\n.match-col { display: flex; flex-direction: column; gap: 8px; }\n.match-btn {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 14px; font-weight: 600;\n  padding: 12px 10px;\n  min-height: 54px;\n  cursor: pointer; text-align: center;\n  line-height: 1.3;\n  transition: all 0.15s;\n}\n.match-btn.selected   { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }\n.match-btn.matched    { border-color: var(--pass);   background: rgba(76,175,80,0.12); color: var(--pass); pointer-events: none; }\n.match-btn.wrong-flash { border-color: var(--fail);  background: rgba(239,83,80,0.1); }\n.match-score {\n  font-size: 14px; color: var(--text-dim);\n  text-align: center; margin-bottom: 12px;\n}\n\n/* \u2500\u2500\u2500 MODULE: SEQUENCING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.seq-prompt { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; }\n.seq-slots  { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }\n.seq-slot {\n  display: flex; align-items: center; gap: 12px;\n  background: var(--surface2);\n  border: 2px dashed rgba(255,255,255,0.1);\n  border-radius: var(--radius-sm);\n  padding: 12px 14px; min-height: 50px;\n  transition: border-color 0.2s, background 0.2s;\n}\n.seq-slot.filled  { border-style: solid; border-color: var(--accent); cursor: pointer; }\n.seq-slot.correct { border-color: var(--pass); background: rgba(76,175,80,0.1); }\n.seq-slot.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.08); }\n.slot-num {\n  width: 24px; height: 24px; flex-shrink: 0;\n  background: var(--surface); border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 11px; font-weight: 700; color: var(--text-dim);\n  transition: background 0.2s, color 0.2s;\n}\n.seq-slot.filled .slot-num { background: var(--accent); color: #0D1B2A; }\n.slot-text { font-size: 15px; font-weight: 600; }\n.seq-pool-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }\n.seq-pool  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }\n.seq-item {\n  background: var(--surface2);\n  border: 2px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text);\n  font-size: 14px; font-weight: 600;\n  padding: 11px 14px;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.seq-item:active { background: var(--surface); }\n.seq-item.used   { opacity: 0.2; pointer-events: none; }\n\n/* \u2500\u2500\u2500 MODULE: AUDIO SPEAKING \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n.speak-target {\n  background: rgba(255,255,255,0.04);\n  border: 1.5px solid rgba(255,255,255,0.08);\n  border-radius: 14px;\n  padding: 5% 5%;\n  font-size: 5.4cqw; font-weight: 600;\n  color: #fff;\n  text-align: center; line-height: 1.5;\n  margin-bottom: 5%;\n}\n\n/* Three-button comparison row */\n.speak-trio {\n  display: flex; justify-content: center;\n  gap: 4%;\n  margin-bottom: 4%;\n}\n.trio-btn {\n  width: 22%; aspect-ratio: 1/1; border-radius: 16%;\n  display: flex; flex-direction: column;\n  align-items: center; justify-content: center; gap: 6%;\n  background: rgba(255,255,255,0.04);\n  border: 1.5px solid var(--surface2);\n  cursor: pointer;\n  transition: all 0.2s;\n}\n.trio-btn .trio-icon  { font-size: 6cqw; line-height: 1; }\n.trio-btn .trio-label { font-size: 2.6cqw; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }\n\n/* Model button \u2014 accent blue */\n.trio-btn.model { border-color: var(--accent); color: var(--accent); }\n.trio-btn.model .trio-label { color: var(--accent); }\n.trio-btn.model.playing { background: rgba(79,195,247,0.1); }\n\n/* Playback button \u2014 purple, disabled until recorded */\n.trio-btn.playback { border-color: #AB47BC; color: #CE93D8; opacity: 0.3; pointer-events: none; }\n.trio-btn.playback .trio-label { color: #AB47BC; }\n.trio-btn.playback.ready { opacity: 1; pointer-events: auto; }\n.trio-btn.playback.playing { background: rgba(171,71,188,0.1); }\n\n/* Record button \u2014 red */\n.trio-btn.record { border-color: var(--fail); color: var(--fail); }\n.trio-btn.record .trio-label { color: var(--fail); }\n.trio-btn.record.recording {\n  background: rgba(239,83,80,0.1);\n  animation: pulse-record 1s ease-in-out infinite;\n}\n@keyframes pulse-record {\n  0%, 100% { box-shadow: 0 0 0 0   rgba(239,83,80,0.4); }\n  50%       { box-shadow: 0 0 0 8px rgba(239,83,80,0);   }\n}\n\n.speak-hint {\n  font-size: 3cqw; color: var(--text-dim);\n  text-align: center; margin-bottom: 4%; min-height: 4cqw;\n}\n\n/* Self-assess \u2014 appears after first recording */\n.assess-btns { display: flex; flex-direction: column; gap: 2.5%; margin-bottom: 2%; }\n.assess-btn {\n  border: 1.5px solid transparent; border-radius: 999px;\n  font-size: 3.4cqw; font-weight: 600; padding: 3% 0; cursor: pointer;\n  transition: all 0.15s; text-align: center;\n}\n.assess-yes { background: rgba(76,175,80,0.1); color: var(--pass); border-color: var(--pass); }\n.assess-no  { background: rgba(239,83,80,0.1); color: var(--fail); border-color: var(--fail); }\n.assess-btn.selected.assess-yes { background: var(--pass); color: #fff; }\n.assess-btn.selected.assess-no  { background: var(--fail); color: #fff; }\n.assess-btn:disabled { cursor: default; opacity: 0.5; }\n.share-link {\n  display: flex; align-items: center; justify-content: center; gap: 2%;\n  background: none; border: none; color: var(--text-dim);\n  font-size: 3cqw; font-family: inherit; cursor: pointer;\n  margin: 3% auto 0; padding: 2% 4%;\n}\n.share-link:hover { color: var(--text); }\n.compare-card {\n  background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08);\n  border-radius: 14px; padding: 4% 5%; margin-bottom: 5%;\n  display: flex; align-items: center; gap: 4%;\n}\n.compare-play-btn {\n  width: 11cqw; height: 11cqw; border-radius: 50%; flex-shrink: 0;\n  background: rgba(112,82,180,0.18); border: 1.5px solid rgba(112,82,180,0.55);\n  display: flex; align-items: center; justify-content: center; font-size: 4cqw; color: #C9B8EA; cursor: pointer;\n}\n.compare-text { flex: 1; min-width: 0; }\n.compare-title { font-size: 3.1cqw; color: #fff; font-weight: 600; margin-bottom: 2%; }\n.compare-sub { font-size: 2.7cqw; color: var(--text-dim); }\n/* \u2500\u2500 Description Pyramid \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.dp-mascot-wrap { display:flex; justify-content:center; margin-bottom:4%; }\n.dp-mascot { font-size:11cqw; line-height:1; transition:transform .25s ease; }\n.dp-mascot.bump { animation: dp-mascot-bump .4s ease; }\n@keyframes dp-mascot-bump { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }\n\n.dp-pyramid { display:flex; flex-direction:column; gap:2.5%; margin-bottom:4%; }\n.dp-block {\n  border-radius:12px; padding:4% 5%; position:relative;\n  border:1.5px solid transparent; transition: all .3s ease;\n  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:1.5%;\n  min-height:60px; font-size:16px;\n}\n.dp-block-l1 { margin:0 15%; }\n.dp-block-l2 { margin:0 7%; }\n.dp-block-l3 { margin:0; }\n\n.dp-block.locked { background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.06); opacity:0.4; color:var(--text-dim); }\n.dp-block.locked .dp-lock-icon { display:inline; }\n.dp-block .dp-lock-icon { display:none; font-size:4cqw; }\n\n.dp-block.active { animation: dp-block-pulse 1.6s ease-in-out infinite; cursor:default; }\n@keyframes dp-block-pulse {\n  0%,100% { box-shadow: 0 0 0 0 var(--dp-glow, rgba(0,188,212,0.35)); }\n  50%     { box-shadow: 0 0 0 6px var(--dp-glow, rgba(0,188,212,0)); }\n}\n.dp-block-l1.active { background:rgba(0,188,212,0.14); border-color:#00BCD4; --dp-glow: rgba(0,188,212,0.35); }\n.dp-block-l2.active { background:rgba(255,152,0,0.14); border-color:#FF9800; --dp-glow: rgba(255,152,0,0.35); }\n.dp-block-l3.active { background:rgba(255,215,0,0.14); border-color:#FFD700; --dp-glow: rgba(255,215,0,0.35); }\n\n.dp-block.complete { border-width:1.5px; }\n.dp-block-l1.complete { background:rgba(0,188,212,0.2); border-color:#00BCD4; }\n.dp-block-l2.complete { background:rgba(255,152,0,0.16); border-color:#FF9800; }\n.dp-block-l3.complete { background:rgba(255,215,0,0.16); border-color:#FFD700; }\n.dp-check-icon { position:absolute; top:6%; right:4%; font-size:3.6cqw; color:#4CAF50; display:none; }\n.dp-block.complete .dp-check-icon { display:block; }\n\n.dp-block-icon { font-size:5cqw; margin-right:1%; }\n.dp-block-label { font-size:3.4cqw; font-weight:600; color:#fff; }\n.dp-block-answer { font-size:3.4cqw; font-weight:700; }\n\n.dp-tile-row { display:flex; gap:2%; overflow-x:auto; padding:2% 1%; margin-bottom:4%; scrollbar-width:none; }\n.dp-tile-row::-webkit-scrollbar { display:none; }\n.dp-tile {\n  flex-shrink:0; background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1);\n  border-radius:10px; padding:3% 4.5%; font-size:3.5cqw; color:rgba(255,255,255,0.85);\n  cursor:pointer; font-family:inherit; white-space:nowrap; transition:.15s;\n}\n.dp-tile.selected { color:#0D1B2A; font-weight:700; }\n.dp-group-label { font-size:2.8cqw; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:1.5%; padding-left:1%; }\n\n.dp-l3-free-input {\n  width:100%; background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.1);\n  border-radius:10px; padding:3% 4%; color:var(--text-hi); font-size:3.4cqw; font-family:inherit;\n  margin-bottom:3%; box-sizing:border-box;\n}\n.dp-because-label { font-size:2.9cqw; color:var(--text-dim); margin:3% 0 1.5%; }\n.dp-sayit-only-note { font-size:2.9cqw; color:var(--text-dim); font-style:italic; margin-bottom:3%; }\n\n/* \u2500\u2500 Image-to-Feeling \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.itf-stimulus {\n  width: 60%; aspect-ratio: 1/1; margin: 0 auto 5%; border-radius: 20px;\n  display: flex; align-items: center; justify-content: center; font-size: 14cqw;\n  border: 2px solid rgba(255,255,255,0.1);\n}\n.itf-stimulus-label { text-align: center; font-size: 3cqw; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5%; }\n.itf-prompt { text-align: center; font-size: 4.2cqw; font-weight: 600; color: #fff; margin-bottom: 5%; }\n\n/* \u2500\u2500 Creative Reflection Card \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.crc-card {\n  background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);\n  border-radius: 16px; padding: 6% 6%; margin-bottom: 5%;\n  font-size: 4.4cqw; line-height: 2.2; color: #fff; text-align: center;\n}\n.crc-blank-input {\n  display: inline-block; width: 20cqw; min-width: 60px; background: rgba(79,195,247,0.12);\n  border: none; border-bottom: 2px solid #4FC3F7; color: #4FC3F7; font-weight: 700;\n  font-size: 4.4cqw; font-family: inherit; text-align: center; padding: 0 1%; margin: 0 1%;\n}\n.crc-blank-input::placeholder { color: rgba(79,195,247,0.4); font-weight: 400; }\n.crc-blank-input:focus { outline: none; background: rgba(79,195,247,0.2); }\n.crc-notebook-note { text-align: center; font-size: 2.9cqw; color: var(--text-dim); font-style: italic; margin-bottom: 5%; }\n\n.dp-sentence-strip {\n  position:sticky; bottom:0; background:rgba(13,27,42,0.92); backdrop-filter:blur(6px);\n  border-top:1px solid rgba(255,255,255,0.08); border-radius:12px 12px 0 0;\n  padding:3% 4%; display:flex; flex-wrap:wrap; gap:1.5%; align-items:center; min-height:10cqw;\n}\n.dp-strip-pill { padding:1.5% 3%; border-radius:999px; font-size:3.2cqw; font-weight:600; }\n.dp-strip-pill.l1 { background:rgba(0,188,212,0.2); color:#4DD0E1; }\n.dp-strip-pill.l2-size { background:rgba(255,152,0,0.2); color:#FFB74D; }\n.dp-strip-pill.l2-shape { background:rgba(171,71,188,0.2); color:#CE93D8; }\n.dp-strip-pill.l2-dynamic { color:#0D1B2A; }\n.dp-strip-pill.l3 { background:rgba(255,215,0,0.2); color:#FFE082; }\n.dp-strip-plain { font-size:3.2cqw; color:var(--text-dim); }\n\n.dp-check-btn { display:block; width:100%; }\n.no-mic-msg {\n  background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 10px;\n  padding: 4% 4%; font-size: 3.2cqw; color: var(--text-dim);\n  text-align: center; margin-bottom: 4%; line-height: 1.6;\n}\n\n\n/* \u2500\u2500\u2500 NEW MODULE STYLES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.option-btn.selected {\n  border-color: var(--accent);\n  background: rgba(79,195,24 er-events: none; }\n\n.pos            { position: absolute; z-index: 2; }\n.block-header   { left: 12.92%; top: 8.06%;  width: 75%;    height: 3.5%; }\n.block-qlabel   { left: 13.08%; top: 15.3%; width: 75%;    height: 2.6%; display: flex; align-items: center; }\n.block-progress { left: 13.08%; top: 19.69%; width: 75.17%; height: 1.01%; }\n.block-flowzone { left: 13.00%; top: 24.99%; width: 75.08%; }\n\n.v2-badge { width: 9cqw; aspect-ratio: 1/1; border-radius: 50%; background: linear-gradient(90deg,#753A70,#A54D75); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 500; font-size: 3.6cqw; flex-shrink: 0; }\n.v2-header-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; }\n.v2-header-left { display: flex; align-items: center; gap: 2.5cqw; min-width: 0; }\n.v2-module-title { color: #fff; font-weight: 500; font-size: 3.9cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.v2-medal-icon { flex-shrink: 0; }\n.v2-medal-icon img { width: 6.5cqw; height: 6.5cqw; display: block; }\n.v2-qlabel { color: rgba(255,255,255,0.75); font-size: 3cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,0.6); justify-content: space-between; }\n.v2-prog-track { width: 100%; height: 100%; background: #202336; border-radius: 99px; overflow: hidden; }\n.v2-prog-fill { width: 0%; height: 100%; background: linear-gradient(90deg,#705697,#9D6089); border-radius: 99px; transition: width .4s; }\n\n/* Grammar-reinforcement overlay \u2014 shared by gap-fill & true-false only */\n.gr-overlay {\n  display: none; position: absolute; inset: 0; z-index: 3;\n  background: rgba(10,8,20,0.9);\n  text-align: center; align-items: center; justify-content: center;\n  flex-direction: column; padding: 5%;\n}\n.gr-continue-btn {\n  padding: 3% 12%; border-radius: 999px; border: none;\n  background: linear-gradient(180deg,#3D30B7 0%,#7052B4 45%,#A45B8B 100%);\n  color: #fff
