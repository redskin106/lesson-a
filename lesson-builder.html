ze}</button>`).join('')}</div>\n          `;\n          spokenWord = item.cloze;\n          // No per-token grammar data here, just a plain sentence string \u2014\n          // glow the whole thing rather than pretending to isolate one word\n          // we have no role-tagging for.\n          addHintButton(() => {\n            const sentenceEl = container.querySelector('#iv-sentence-text');\n            if (sentenceEl) sentenceEl.classList.add('gf-blank', 'hint-glow');\n          });\n        }\n        speak(spokenWord, 'neutral', 300);\n\n        content.querySelectorAll('.iv-option-btn').forEach(btn => {\n          btn.addEventListener('click', () => {\n            if (locked) return;\n            content.querySelectorAll('.iv-option-btn').forEach(b => b.classList.remove('selected'));\n            btn.classList.add('selected');\n            selected = { val: btn.dataset.val, ans: btn.dataset.ans };\n            const blank = content.querySelector('#iv-blank');\n            if (blank && mode === 'cloze-image') blank.textContent = btn.dataset.val;\n            checkBtn.style.display = 'block';\n          });\n        });\n\n        checkBtn.addEventListener('click', () => {\n          if (!selected || locked) return;\n          locked = true;\n          const ok = selected.val === selected.ans;\n          if (state.student) recordWordExposure(state.student, selected.ans, 'image-vocab', ok).catch(() => {});\n          if (ok) score++;\n          const feedback = container.querySelector('#iv-feedback');\n          feedback.textContent = ok ? '\u2713 Correct!' : '\u2717 See the right answer';\n          feedback.style.color = ok ? '#AED581' : '#F48FB1';\n          checkBtn.style.display = 'none';\n          content.querySelectorAll('.iv-option-btn').forEach(b => {\n            b.disabled = true;\n            if (b.dataset.val === b.dataset.ans) b.classList.add('correct');\n            else if (b.dataset.val === selected.val && !ok) b.classList.add('wrong');\n            else b.classList.remove('selected');\n          });\n          const blank = content.querySelector('#iv-blank');\n          if (blank) blank.textContent = selected.ans;\n          speak(spokenWord, ok ? 'celebrate' : 'wrong');\n          if (mode === 'cloze-image') {\n            const fullSentence = item.sentence.replace('___', selected.ans);\n            speak(fullSentence, ok ? 'celebrate' : 'neutral', 900);\n          }\n          nextBtn.style.display = 'block';\n        });\n\n        nextBtn.addEventListener('click', () => {\n          idx++;\n          if (idx < session.length) renderQuestion();\n          else onComplete(score / session.length);\n        });\n      }\n\n      renderQuestion();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  MEMORY PAIRS\n  //  v2 design: per-tier pool { pick, flipback(ms), items }, separate pool\n  //  per tier (not shared across tiers \u2014 same standardization as every\n  //  other module now). `pick` pairs drawn, image card + word card each.\n  //  Flip two, find the match. Cards colored by pair via PALETTE on match,\n  //  matching Put in Order/Gap-fill's shared palette convention.\n  //  Audio rule (confirmed with Nick): every flip says its word immediately,\n  //  EXCEPT the 2nd flip is silent if it matches the 1st (already just\n  //  heard it). On mismatch, both cards' audio already played at flip-time.\n  //  On match: grammar-color sentence reinforcement (shared with\n  //  gap-fill/true-false), not the generic word/emoji panel.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'memory-pairs': {\n    render(container, data, tier, onComplete) {\n      const { pick, flipback, items } = data;\n      const picked = biasedSelect(items, pick, it => it.word);\n      const PAIRS = picked.length;\n      const deckSrc = [\n        ...picked.map((it,i)=>({...it, kind:'image', pid:i})),\n        ...picked.map((it,i)=>({...it, kind:'word',  pid:i})),\n      ];\n      const deck = safeShuffle(deckSrc, r => {\n        for (let i=0;i<r.length-1;i++) if(r[i].pid===r[i+1].pid) return true;\n        return false;\n      });\n\n      const PALETTE = [\n        { border:'#00BCD4', bg:'rgba(0,188,212,.15)'  },\n        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },\n        { border:'#FF9800', bg:'rgba(255,152,0,.15)'  },\n        { border:'#E91E63', bg:'rgba(233,30,99,.15)'  },\n        { border:'#8BC34A', bg:'rgba(139,195,74,.15)' }\n      ];\n\n      let flipped=[], matched=0, flips=0, cardLocked=false;\n\n      document.getElementById('v2-qlabel').innerHTML =\n        `<span>Find the pairs</span><span>Flips: <span id=\"mp-flips\">0</span></span>`;\n\n      container.innerHTML = `\n        <div class=\"mp-pips-row-v2\" id=\"mp-pips\"></div>\n        <div class=\"mp-card-grid-v2\" id=\"mp-grid\"></div>\n        <p class=\"mp-status-v2\" id=\"mp-msg\">&nbsp;</p>\n      `;\n\n      const pipsEl = container.querySelector('#mp-pips');\n      picked.forEach((_, i) => {\n        const c = PALETTE[i % PALETTE.length];\n        const pip = document.createElement('div');\n        pip.className = 'mp-pip-v2';\n        pip.id = `mp-pip-${i}`;\n        pip.style.background = c.bg;\n        pip.style.borderColor = c.border;\n        pipsEl.appendChild(pip);\n      });\n\n      const gridEl = container.querySelector('#mp-grid');\n      deck.forEach((card, i) => {\n        const wrap = document.createElement('div');\n        wrap.className = 'mp-card-wrap-v2';\n        wrap.id = `mp-cw-${i}`;\n        wrap.innerHTML = `\n          <div class=\"mp-card-inner-v2\" id=\"mp-ci-${i}\">\n            <div class=\"mp-card-face-v2 mp-card-back-v2\">?</div>\n            <div class=\"mp-card-face-v2 mp-card-front-v2\" id=\"mp-cf-${i}\">\n              ${card.kind === 'image'\n                ? (card.image\n                    ? `<img src=\"${card.image}\" alt=\"${card.word}\" style=\"width:70%;height:70%;object-fit:cover;border-radius:8px;\">`\n                    : `<span class=\"mp-emoji-v2\">${card.emoji}</span>`)\n                : `<span>${card.word}</span>`}\n            </div>\n          </div>`;\n        wrap.addEventListener('click', () => mpFlip(i));\n        gridEl.appendChild(wrap);\n      });\n\n      function mpFlip(i) {\n        if (cardLocked) return;\n        const cw = document.getElementById(`mp-cw-${i}`);\n        const ci = document.getElementById(`mp-ci-${i}`);\n        if (!cw || cw.dataset.done || cw.dataset.flipped) return;\n        cw.dataset.flipped = '1';\n        ci.classList.add('flipped');\n\n        if (flipped.length === 0) {\n          // First card of the pair \u2014 always say it.\n          speak(deck[i].word, 'neutral', 0, deck[i].audioFile);\n        } else {\n          // Second card \u2014 only say it if it's NOT a match with the first;\n          // a match means it's the same word we just said a second ago.\n          const first = deck[flipped[0]];\n          const second = deck[i];\n          const isMatch = first.pid === second.pid && first.kind !== second.kind;\n          if (!isMatch) speak(second.word, 'neutral', 0, second.audioFile);\n        }\n\n        flips++;\n        document.getElementById('mp-flips').textContent = flips;\n        flipped.push(i);\n        if (flipped.length === 2) { cardLocked = true; setTimeout(mpCheck, 500); }\n      }\n\n      function mpCheck() {\n        const [a, b] = flipped;\n        const ca = deck[a], cb = deck[b];\n        const isMatch = ca.pid === cb.pid && ca.kind !== cb.kind;\n        if (state.student) {\n          if (isMatch) {\n            // ca.word === cb.word here \u2014 same underlying item, just its image\n            // and word cards \u2014 recording it twice would double-advance the box.\n            recordWordExposure(state.student, ca.word, 'memory-pairs', true).catch(() => {});\n          } else {\n            recordWordExposure(state.student, ca.word, 'memory-pairs', false).catch(() => {});\n            recordWordExposure(state.student, cb.word, 'memory-pairs', false).catch(() => {});\n          }\n        }\n        if (isMatch) {\n          matched++;\n          const c = PALETTE[ca.pid % PALETTE.length];\n          ['mp-cf-'+a,'mp-cf-'+b].forEach(id=>{\n            const el=document.getElementById(id);\n            if(el){el.style.background=c.bg;el.style.borderColor=c.border;}\n          });\n          document.getElementById(`mp-cw-${a}`).dataset.done='1';\n          document.getElementById(`mp-cw-${b}`).dataset.done='1';\n          const pip=document.getElementById(`mp-pip-${ca.pid}`);\n          if(pip){pip.classList.add('done');pip.style.background=c.border;}\n          flipped=[];\n\n          if (window.speechSynthesis) window.speechSynthesis.cancel();\n          showGrammarReinforce(ca.tokens, ca.sentence, () => {\n            cardLocked = false;\n            if (matched === PAIRS) {\n              setTimeout(()=>onComplete(matched/PAIRS), 400);\n            }\n          });\n        } else {\n          const ciA=document.getElementById(`mp-ci-${a}`);\n          const ciB=document.getElementById(`mp-ci-${b}`);\n          if(ciA){ciA.style.boxShadow='0 0 0 2px #E91E63';}\n          if(ciB){ciB.style.boxShadow='0 0 0 2px #E91E63';}\n          // No audio here \u2014 both cards already said their word at flip-time\n          // (see mpFlip). Playing again here would just repeat them.\n          setTimeout(()=>{\n            if(ciA){ciA.classList.remove('flipped');ciA.style.boxShadow='';}\n            if(ciB){ciB.classList.remove('flipped');ciB.style.boxShadow='';}\n            delete document.getElementById(`mp-cw-${a}`).dataset.flipped;\n            delete document.getElementById(`mp-cw-${b}`).dataset.flipped;\n            flipped=[]; cardLocked=false;\n          }, flipback || 1100);\n        }\n      }\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  WORD SCRAMBLE\n  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] },\n  //  separate pool per tier. Tap scrambled letter tiles into slots; tap a\n  //  filled slot to remove. Manual play button only \u2014 no auto-announce on\n  //  question load, matching the locked demo (word-scramble-demo.html).\n  //  Each question gets one color from PALETTE (not per-letter), cycling\n  //  across the session.\n  //  Audio (confirmed with Nick): correct \u2192 word once, then the sentence\n  //  (not word-word-sentence). Wrong \u2192 word once, then silent retry (not\n  //  twice). Grammar-color sentence reinforcement on correct via\n  //  showGrammarReinforce, same as gap-fill/true-false/memory-pairs.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'word-scramble': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = biasedSelect(items, pick, it => it.word);\n      let idx = 0, score = 0, slotData = [], bankData = [], wsLocked = false;\n\n      const PALETTE = [\n        { border:'#00BCD4', bg:'rgba(0,188,212,.15)' },\n        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },\n        { border:'#FF9800', bg:'rgba(255,152,0,.15)' },\n        { border:'#E91E63', bg:'rgba(233,30,99,.15)' }\n      ];\n      function itemColor() { return PALETTE[idx % PALETTE.length]; }\n\n      function pips() {\n        return session.map((_, i) => `<div class=\"mp-pip-v2${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n\n      function load() {\n        wsLocked = false;\n        const item = session[idx];\n        const letters = item.word.toUpperCase().split('');\n        slotData = letters.map(() => null);\n        const wordUp = item.word.toUpperCase();\n        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n        draw();\n      }\n\n      function draw() {\n        const item = session[idx];\n        const hasClue = !!findContextClue(item.word, item.tokens);\n        container.innerHTML = `\n          <div class=\"mp-pips-row-v2\" id=\"ws-pips\"></div>\n          ${hasClue ? '<button class=\"precheck-hint-btn\" id=\"ws-hint-btn\">\ud83d\udca1 Hint</button><p class=\"ws-feedback-v2\" id=\"ws-clue\" style=\"display:none;\"></p>' : ''}\n          <div class=\"ws-visual-v2\">\n            <div class=\"ws-emoji-v2\">${item.emoji}</div>\n            <button class=\"ws-play-btn-v2\" id=\"ws-play-btn\">\ud83d\udd0a</button>\n          </div>\n          <div class=\"ws-slots-v2\" id=\"ws-slots\"></div>\n          <div class=\"ws-bank-v2\" id=\"ws-bank\"></div>\n          <p class=\"ws-feedback-v2\" id=\"ws-fb\">&nbsp;</p>\n        `;\n        container.querySelector('#ws-pips').innerHTML = pips();\n\n        if (hasClue) {\n          const hintBtn = container.querySelector('#ws-hint-btn');\n          hintBtn.addEventListener('click', () => {\n            const clue = findContextClue(item.word, item.tokens);\n            const clueEl = container.querySelector('#ws-clue');\n            clueEl.innerHTML = `Clue: <span class=\"gf-context-clue\">${clue}</span>`;\n            clueEl.style.display = 'block';\n            hintBtn.disabled = true;\n            hintBtn.textContent = '\ud83d\udca1 Hint used';\n          }, { once: true });\n        }\n\n        const wsSlots = container.querySelector('#ws-slots');\n        slotData.forEach((_, si) => {\n          const d = document.createElement('div');\n          d.className = 'ws-slot-v2';\n          d.id = `ws-s-${si}`;\n          d.addEventListener('click', () => wsRemove(si));\n          wsSlots.appendChild(d);\n        });\n\n        const wsBank = container.querySelector('#ws-bank');\n        bankData.forEach((t, bi) => {\n          const b = document.createElement('button');\n          b.className = 'ws-tile-v2';\n          b.id = `ws-t-${bi}`;\n          b.textContent = t.letter;\n          b.addEventListener('click', () => wsTap(bi));\n          wsBank.appendChild(b);\n        });\n\n        container.querySelector('#ws-play-btn').addEventListener('click', () => {\n          speak(item.word, 'neutral');\n        });\n\n        refreshSlots(); refreshBank();\n      }\n\n      function refreshSlots() {\n        const c = itemColor();\n        slotData.forEach((entry, si) => {\n          const el = document.getElementById(`ws-s-${si}`);\n          if (!el) return;\n          el.textContent = entry ? entry.letter : '';\n          el.style.borderColor = entry ? c.border : 'rgba(255,255,255,0.08)';\n          el.style.background = entry ? c.bg : 'rgba(255,255,255,0.05)';\n          el.style.color = entry ? c.border : '#fff';\n        });\n      }\n      function refreshBank() {\n        bankData.forEach((t, bi) => {\n          const el = document.getElementById(`ws-t-${bi}`);\n          if (el) el.classList.toggle('used', t.used);\n        });\n      }\n\n      function wsTap(bi) {\n        if (wsLocked) return;\n        const tile = bankData[bi];\n        if (tile.used) return;\n        const si = slotData.indexOf(null);\n        if (si === -1) return;\n        tile.used = true;\n        slotData[si] = { letter: tile.letter, bankId: bi };\n        sfx('tap');\n        refreshSlots(); refreshBank();\n        if (slotData.indexOf(null) === -1) setTimeout(wsCheck, 200);\n      }\n      function wsRemove(si) {\n        if (wsLocked) return;\n        const entry = slotData[si];\n        if (!entry) return;\n        bankData[entry.bankId].used = false;\n        slotData[si] = null;\n        sfx('tap');\n        refreshSlots(); refreshBank();\n      }\n\n      function wsCheck() {\n        const item = session[idx];\n        const attempt = slotData.map(e => e.letter).join('').toLowerCase();\n        const ok = attempt === item.word.toLowerCase();\n        wsLocked = true;\n        if (state.student) recordWordExposure(state.student, item.word, 'word-scramble', ok).catch(() => {});\n        const c = itemColor();\n        const fb = document.getElementById('ws-fb');\n\n        slotData.forEach((_, si) => {\n          const el = document.getElementById(`ws-s-${si}`);\n          if (el) {\n            el.style.borderColor = ok ? c.border : '#E91E63';\n            el.style.background = ok ? c.bg : 'rgba(233,30,99,0.12)';\n            el.style.color = ok ? c.border : '#F48FB1';\n          }\n        });\n\n        if (ok) {\n          score++;\n          if (fb) { fb.textContent = '\u2713 Correct!'; fb.style.color = '#AED581'; }\n          speak(item.word, 'celebrate'); // word once \u2014 sentence comes from the reinforcement panel, not repeated here\n          setTimeout(() => {\n            const plainSentence = item.tokens.map(t => t.t).join(' ');\n            showGrammarReinforce(item.tokens, plainSentence, () => {\n              idx++;\n              if (idx < session.length) load();\n              else onComplete(score / session.length);\n            });\n          }, 500);\n        } else {\n          if (fb) { fb.textContent = `\u2717 The word is: ${item.word}`; fb.style.color = '#F48FB1'; }\n          speak(item.word, 'wrong'); // word once, then silent retry \u2014 no second play\n          setTimeout(() => {\n            slotData = slotData.map(() => null);\n            bankData.forEach(t => t.used = false);\n            wsLocked = false;\n            refreshSlots(); refreshBank();\n            if (fb) { fb.textContent = 'Try again!'; fb.style.color = 'rgba(255,255,255,0.4)'; }\n          }, 1500);\n        }\n      }\n\n      load();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SPELLING\n  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] }, separate\n  //  pool per tier. Bronze: image + tap tiles. Silver: audio-only + tap\n  //  tiles. Gold: audio-only + free typing (no letter bank at all \u2014 this\n  //  is the genuine skill difference from Word Scramble: production\n  //  spelling from memory, not anagram-solving). tokens can be null\n  //  (library/hospital) \u2014 falls back to just the word for reinforcement.\n  //  Manual play button only \u2014 no auto-announce, matching Word Scramble.\n  //  Audio: correct \u2192 word once, then sentence. Wrong \u2192 word once, silent\n  //  retry. Same rule Nick confirmed for Word Scramble.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'spelling': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = biasedSelect(items, pick, it => it.word);\n      let idx = 0, score = 0, spLocked = false, retypeMode = false;\n      let slotData = [], bankData = [];\n\n      function pips() {\n        return session.map((_, i) => `<div class=\"mp-pip-v2${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n\n      function load() {\n        spLocked = false; retypeMode = false;\n        const item = session[idx];\n        const letters = item.word.toUpperCase().split('');\n        slotData = letters.map(() => null);\n        const wordUp = item.word.toUpperCase();\n        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));\n\n        const showImage = tier === 'bronze';\n        const isTile = tier !== 'gold';\n        const instruction = tier === 'bronze' ? 'Tap the letters to spell the word'\n                           : tier === 'silver' ? 'Listen and spell what you hear'\n                           : 'Listen and type the word';\n\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n\n        const hasClue = !!findContextClue(item.word, item.tokens);\n\n        container.innerHTML = `\n          <div class=\"mp-pips-row-v2\" id=\"sp-pips\"></div>\n          ${hasClue ? '<button class=\"precheck-hint-btn\" id=\"sp-hint-btn\">\ud83d\udca1 Hint</button><p class=\"sp-feedback-v2\" id=\"sp-clue\" style=\"display:none;\"></p>' : ''}\n          <div class=\"sp-visual-v2\">\n            ${showImage ? `<div class=\"sp-emoji-v2\">${item.emoji}</div>` : ''}\n            <div class=\"sp-listen-row-v2\">\n              <button class=\"sp-play-btn-v2\" id=\"sp-play-btn\">\ud83d\udd0a</button>\n              <span class=\"sp-instruction-v2\">${instruction}</span>\n            </div>\n          </div>\n          ${isTile ? `\n          <div class=\"sp-slots-v2\" id=\"sp-slots\"></div>\n          <div class=\"sp-bank-v2\" id=\"sp-bank\"></div>\n          ` : `\n          <input id=\"sp-input\" class=\"sp-input-v2\" type=\"text\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Type the word\u2026\">\n          <button id=\"sp-chk\" class=\"sp-check-btn-v2\" disabled>Check \u2192</button>\n          `}\n          <p class=\"sp-feedback-v2\" id=\"sp-fb\">&nbsp;</p>\n        `;\n        container.querySelector('#sp-pips').innerHTML = pips();\n\n        if (hasClue) {\n          const hintBtn = container.querySelector('#sp-hint-btn');\n          hintBtn.addEventListener('click', () => {\n            const clue = findContextClue(item.word, item.tokens);\n            const clueEl = container.querySelector('#sp-clue');\n            clueEl.innerHTML = `Clue: <span class=\"gf-context-clue\">${clue}</span>`;\n            clueEl.style.display = 'block';\n            hintBtn.disabled = true;\n            hintBtn.textContent = '\ud83d\udca1 Hint used';\n          }, { once: true });\n        }\n\n        container.querySelector('#sp-play-btn').addEventListener('click', () => speak(item.word, 'neutral'));\n\n        if (isTile) {\n          const slotsEl = container.querySelector('#sp-slots');\n          slotData.forEach((_, si) => {\n            const d = document.createElement('div');\n            d.className = 'sp-slot-v2';\n            d.id = `sp-s-${si}`;\n            d.addEventListener('click', () => spRemove(si));\n            slotsEl.appendChild(d);\n          });\n          const bankEl = container.querySelector('#sp-bank');\n          bankData.forEach((t, bi) => {\n            const b = document.createElement('button');\n            b.className = 'sp-tile-v2';\n            b.id = `sp-t-${bi}`;\n            b.textContent = t.letter;\n            b.addEventListener('click', () => spTap(bi));\n            bankEl.appendChild(b);\n          });\n          spRefreshSlots(); spRefreshBank();\n        } else {\n          const inp = container.querySelector('#sp-input');\n          const chk = container.querySelector('#sp-chk');\n          inp.addEventListener('input', () => {\n            chk.style.display = 'block';\n            chk.disabled = inp.value.trim().length === 0;\n            chk.style.opacity = inp.value.trim().length ? '1' : '.4';\n          });\n          inp.addEventListener('keydown', e => { if (e.key === 'Enter') spCheckType(); });\n          chk.addEventListener('click', spCheckType);\n          setTimeout(() => inp.focus(), 200);\n        }\n      }\n\n      function spTap(bi) {\n        if (spLocked) return;\n        const tile = bankData[bi];\n        if (tile.used) return;\n        const si = slotData.indexOf(null);\n        if (si === -1) return;\n        tile.used = true;\n        slotData[si] = { letter: tile.letter, bankId: bi };\n        sfx('tap');\n        spRefreshSlots(); spRefreshBank();\n        if (slotData.indexOf(null) === -1) setTimeout(spCheckTiles, 200);\n      }\n      function spRemove(si) {\n        if (spLocked) return;\n        const entry = slotData[si];\n        if (!entry) return;\n        bankData[entry.bankId].used = false;\n        slotData[si] = null;\n        sfx('tap');\n        spRefreshSlots(); spRefreshBank();\n      }\n      function spRefreshSlots() {\n        slotData.forEach((entry, si) => {\n          const el = document.getElementById(`sp-s-${si}`);\n          if (!el) return;\n          el.textContent = entry ? entry.letter : '';\n          el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';\n          el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';\n        });\n      }\n      function spRefreshBank() {\n        bankData.forEach((t, bi) => {\n          const el = document.getElementById(`sp-t-${bi}`);\n          if (el) el.classList.toggle('used', t.used);\n        });\n      }\n\n      function reinforceThenAdvance(item) {\n        const plainSentence = item.tokens ? item.tokens.map(t => t.t).join(' ') : item.word;\n        showGrammarReinforce(item.tokens, plainSentence, () => {\n          idx++;\n          if (idx < session.length) load();\n          else onComplete(score / session.length);\n        });\n      }\n\n      function spCheckTiles() {\n        const item = session[idx];\n        const attempt = slotData.map(e => e.letter).join('').toLowerCase();\n        const ok = attempt === item.word.toLowerCase();\n        spLocked = true;\n        if (state.student) recordWordExposure(state.student, item.word, 'spelling', ok).catch(() => {});\n        const fb = document.getElementById('sp-fb');\n        slotData.forEach((_, si) => {\n          const el = document.getElementById(`sp-s-${si}`);\n          if (el) {\n            el.style.borderColor = ok ? '#8BC34A' : '#E91E63';\n            el.style.background = ok ? 'rgba(139,195,74,0.15)' : 'rgba(233,30,99,0.12)';\n          }\n        });\n        if (ok) {\n          score++;\n          if (fb) { fb.textContent = '\u2713 Correct!'; fb.style.color = '#AED581'; }\n          speak(item.word, 'celebrate'); // word once \u2014 sentence comes from the reinforcement panel\n          setTimeout(() => reinforceThenAdvance(item), 500);\n        } else {\n          if (fb) { fb.textContent = `\u2717 The word is: ${item.word}`; fb.style.color = '#F48FB1'; }\n          speak(item.word, 'wrong'); // word once, then silent retry\n          setTimeout(() => {\n            slotData = slotData.map(() => null);\n            bankData.forEach(t => t.used = false);\n            spLocked = false;\n            spRefreshSlots(); spRefreshBank();\n            if (fb) { fb.textContent = 'Try again!'; fb.style.color = 'rgba(255,255,255,0.4)'; }\n          }, 1500);\n        }\n      }\n\n      function spCheckType() {\n        if (spLocked) return;\n        const item = session[idx];\n        const inp = document.getElementById('sp-input');\n        if (!inp || !inp.value.trim()) return;\n        const attempt = inp.value.trim().toLowerCase();\n        const ok = attempt === item.word.toLowerCase();\n        spLocked = true;\n        // Guarded the same way score++ already is \u2014 a correct retype right\n        // after the answer was revealed isn't a genuine recall test, so it\n        // shouldn't boost the box. The original wrong attempt (below, in\n        // the miss branch) still gets recorded normally either way.\n        if (state.student && !retypeMode) recordWordExposure(state.student, item.word, 'spelling', ok).catch(() => {});\n        const fb = document.getElementById('sp-fb');\n        inp.style.borderColor = ok ? '#8BC34A' : '#E91E63';\n        inp.style.background = ok ? 'rgba(139,195,74,0.08)' : 'rgba(233,30,99,0.08)';\n        const chk = document.getElementById('sp-chk');\n        if (chk) chk.style.display = 'none';\n\n        if (ok) {\n          if (!retypeMode) score++;\n          if (fb) { fb.textContent = '\u2713 Correct!'; fb.style.color = '#AED581'; }\n          speak(item.word, 'celebrate'); // word once \u2014 sentence comes from the reinforcement panel\n          setTimeout(() => reinforceThenAdvance(item), 500);\n        } else {\n          if (fb) { fb.textContent = `\u2717 The word is: ${item.word} \u2014 now type it correctly`; fb.style.color = '#F48FB1'; }\n          speak(item.word, 'wrong'); // word once, then silent retry\n          setTimeout(() => {\n            retypeMode = true; spLocked = false;\n            inp.value = ''; inp.style.borderColor = 'rgba(255,255,255,0.08)';\n            inp.style.background = 'rgba(255,255,255,0.05)';\n            inp.placeholder = 'Type the correct word\u2026'; inp.focus();\n            if (chk) { chk.style.display = 'block'; chk.disabled = true; chk.style.opacity = '.4'; }\n            if (fb) { fb.textContent = `Type: ${item.word}`; fb.style.color = '#C9B8EA'; }\n          }, 1600);\n        }\n      }\n\n      load();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  LISTEN & MATCH\n  //  v2 design: pool-based { pick, items: [{left,right}] } \u2014 same shape\n  //  and free-pairing engine as Word Match, confirmed identical in the\n  //  locked demo (listen-match-demo.html). Only real difference: left\n  //  buttons show a \ud83d\udd0a icon and play audio on every tap (unlimited\n  //  replay) instead of showing text. left always equals right in the\n  //  data \u2014 it's an audio-echo match, not a translation pair.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-match': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const pairs = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      const total = pairs.length;\n      const isBronze = (tier === 'bronze');\n\n      const PALETTE = [\n        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },\n        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },\n        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },\n        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },\n        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }\n      ];\n      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);\n\n      document.getElementById('v2-qlabel').innerHTML =\n        `<span>Tap \ud83d\udd0a to listen, then match.</span><span id=\"am-score\">0 of ${total} paired</span>`;\n\n      container.innerHTML = `\n        <div class=\"wm-grid-v2\">\n          <div class=\"wm-col-v2\" id=\"am-left-col\"></div>\n          <div class=\"wm-col-v2\" id=\"am-right-col\"></div>\n        </div>\n        <p class=\"wm-encourage-v2\" id=\"am-encourage\"></p>\n        <p class=\"wm-nudge-v2\" id=\"am-nudge\"></p>\n        <button id=\"am-notquite-btn\" class=\"wm-notquite-btn-v2\" disabled>Not quite yet</button>\n        <button id=\"am-next-btn\" class=\"iv-proceed-btn\">Next \u2192</button>\n      `;\n\n      const leftCol      = container.querySelector('#am-left-col');\n      const rightCol     = container.querySelector('#am-right-col');\n      const scoreLabel   = document.getElementById('am-score');\n      const encourageEl  = container.querySelector('#am-encourage');\n      const nudgeEl      = container.querySelector('#am-nudge');\n      const notQuiteBtn  = container.querySelector('#am-notquite-btn');\n      const nextBtn      = container.querySelector('#am-next-btn');\n\n      let pairings = new Map();\n      let rightUsed = new Map();\n      let selectedLeftBtn = null;\n      let confirmed = false;\n\n      function styleLeft(btn) {\n        if (confirmed) return;\n        const idx = parseInt(btn.dataset.pairIdx);\n        const c = pairColor[idx];\n        const isSelected = (btn === selectedLeftBtn);\n        const isPaired = pairings.has(idx);\n        if (isSelected) {\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n          btn.style.boxShadow = `0 0 0 3px ${c.border}`;\n        } else if (isPaired) {\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n          btn.style.boxShadow = '';\n        } else {\n          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';\n          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';\n        }\n      }\n      function styleRight(btn) {\n        if (confirmed) return;\n        const rightIdx = parseInt(btn.dataset.pairIdx);\n        if (rightUsed.has(rightIdx)) {\n          const c = pairColor[rightUsed.get(rightIdx)];\n          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;\n        } else {\n          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';\n          btn.style.color = 'rgba(255,255,255,0.85)';\n        }\n      }\n      function checkAllCorrect() {\n        if (pairings.size !== total) return false;\n        for (const leftIdx of pairings.keys()) {\n          if (pairings.get(leftIdx) !== leftIdx) return false;\n        }\n        return true;\n      }\n      function refreshAll() {\n        container.querySelectorAll('.wm-btn-v2[data-side=\"left\"]').forEach(styleLeft);\n        container.querySelectorAll('.wm-btn-v2[data-side=\"right\"]').forEach(styleRight);\n\n        let correctSoFar = 0, wrongSoFar = 0;\n        pairings.forEach((rightIdx, leftIdx) => {\n          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;\n        });\n\n        if (pairings.size === total) {\n          if (checkAllCorrect()) {\n            confirmed = true;\n            sfx('correct');\n            scoreLabel.textContent = 'Good job!';\n            scoreLabel.style.color = '#AED581';\n            notQuiteBtn.style.display = 'none';\n            nudgeEl.style.opacity = '0';\n            encourageEl.style.opacity = '0';\n            nextBtn.style.display = 'flex';\n            nextBtn.onclick = () => onComplete(1);\n          } else {\n            sfx('wrong');\n            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;\n            scoreLabel.style.color = '';\n            nextBtn.style.display = 'none';\n            notQuiteBtn.style.display = 'flex';\n            nudgeEl.style.opacity = '0';\n            encourageEl.style.opacity = '0';\n          }\n        } else {\n          scoreLabel.textContent = `${pairings.size} of ${total} paired`;\n          scoreLabel.style.color = '';\n          nextBtn.style.display = 'none';\n          notQuiteBtn.style.display = 'none';\n\n          if (isBronze && wrongSoFar > 0) {\n            nudgeEl.textContent = 'Are you sure about that one?';\n            nudgeEl.style.opacity = '1';\n            encourageEl.style.opacity = '0';\n          } else {\n            nudgeEl.style.opacity = '0';\n            if (correctSoFar > 0) {\n              const ratio = correctSoFar / total;\n              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'\n                                       : ratio >= 0.34 ? 'Getting there!'\n                                       : 'Nice, keep going!';\n              encourageEl.style.opacity = '1';\n            } else {\n              encourageEl.style.opacity = '0';\n            }\n          }\n        }\n      }\n\n      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));\n      const leftItems = safeShuffle(withIdx, () => false);\n      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));\n\n      leftItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className = 'wm-btn-v2';\n        btn.innerHTML = '\ud83d\udd0a';\n        btn.dataset.side = 'left';\n        btn.dataset.pairIdx = pair.pairIdx;\n        btn.dataset.audio = pair.left;\n        leftCol.appendChild(btn);\n      });\n      rightItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className = 'wm-btn-v2';\n        btn.textContent = pair.right;\n        btn.dataset.side = 'right';\n        btn.dataset.pairIdx = pair.pairIdx;\n        rightCol.appendChild(btn);\n      });\n\n      container.querySelectorAll('.wm-btn-v2').forEach(btn => {\n        btn.addEventListener('click', () => {\n          if (confirmed) return;\n\n          if (btn.dataset.side === 'left') {\n            speak(btn.dataset.audio, 'neutral'); // unlimited replay \u2014 plays every tap, matched or not\n            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;\n            refreshAll();\n            return;\n          }\n\n          const rightIdx = parseInt(btn.dataset.pairIdx);\n          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;\n\n          if (rightUsed.has(rightIdx)) {\n            const prevLeftIdx = rightUsed.get(rightIdx);\n            pairings.delete(prevLeftIdx);\n            rightUsed.delete(rightIdx);\n            if (leftIdx === null || leftIdx === prevLeftIdx) {\n              selectedLeftBtn = null;\n              sfx('tap');\n              refreshAll();\n              return;\n            }\n          }\n          if (leftIdx === null) { refreshAll(); return; }\n\n          if (pairings.has(leftIdx)) {\n            rightUsed.delete(pairings.get(leftIdx));\n            pairings.delete(leftIdx);\n          }\n          pairings.set(leftIdx, rightIdx);\n          rightUsed.set(rightIdx, leftIdx);\n          selectedLeftBtn = null;\n          sfx('tap');\n          refreshAll();\n        });\n      });\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SENTENCE BUILDING\n  //  v2 design: pool-based { pick, items: [{tokens}] }, separate pool per\n  //  tier. Word-tile version of Word Scramble: tap tiles from the bank\n  //  into ordered slots, auto-check on last slot filled, reset on wrong.\n  //  On correct: tiles recolour by grammar role IN PLACE (subject/verb/\n  //  object/place/time; everything else neutral) and a legend + the full\n  //  sentence play \u2014 no separate overlay here, deliberately different\n  //  from every other module's reinforcement pattern, matching the\n  //  locked demo exactly. Audio was already correct in the old renderer\n  //  (single speak on each outcome, no per-tap bug) \u2014 kept as-is.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'sentence-building': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, ()=>false).slice(0, Math.min(pick, items.length));\n      let idx = 0, score = 0, sbLocked = false;\n      let slotData = [], bankData = [];\n\n      const ROLE_COLOR = { subject:'#00BCD4', verb:'#8BC34A', object:'#FF9800', place:'#AB47BC', time:'#E91E63' };\n      const roleColor = role => ROLE_COLOR[role] || null;\n\n      function pips() {\n        return session.map((_, i) => `<div class=\"mp-pip-v2${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n      function sentenceText(tokens) {\n        return tokens.map(t => t.text).join(' ');\n      }\n\n      function load() {\n        sbLocked = false;\n        const item = session[idx];\n        slotData = item.tokens.map(() => null);\n        const withId = item.tokens.map((t, i) => ({ ...t, id: i }));\n        bankData = safeShuffle(withId, r => r.every((t, i) => t.text === item.tokens[i].text))\n          .map(t => ({ ...t, used: false }));\n        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;\n        draw();\n      }\n\n      function draw() {\n        container.innerHTML = `\n          <div class=\"mp-pips-row-v2\" id=\"sb-pips\"></div>\n          <p class=\"sb-prompt-v2\">Put the words in order.</p>\n          <div class=\"sb-slots-v2\" id=\"sb-slots\"></div>\n          <div class=\"sb-bank-v2\" id=\"sb-bank\"></div>\n          <div class=\"sb-feedback-v2\" id=\"sb-fb\">&nbsp;</div>\n          <button class=\"iv-proceed-btn\" id=\"sb-next-btn\">Next \u2192</button>\n        `;\n        container.querySelector('#sb-pips').innerHTML = pips();\n\n        const slotsEl = container.querySelector('#sb-slots');\n        slotData.forEach((_, si) => {\n          const d = document.createElement('div');\n          d.className = 'sb-slot-v2';\n          d.id = `sb-s-${si}`;\n          d.addEventListener('click', () => sbRemove(si));\n          slotsEl.appendChild(d);\n        });\n        const bankEl = container.querySelector('#sb-bank');\n        bankData.forEach((t, bi) => {\n          const b = document.createElement('button');\n          b.className = 'sb-tile-v2';\n          b.id = `sb-t-${bi}`;\n          b.textContent = t.text;\n          b.addEventListener('click', () => sbTap(bi));\n          bankEl.appendChild(b);\n        });\n        refreshSlots(); refreshBank();\n      }\n\n      function refreshSlots() {\n        slotData.forEach((entry, si) => {\n          const el = document.getElementById(`sb-s-${si}`);\n          if (!el) return;\n          el.textContent = entry ? entry.text : '';\n          el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';\n          el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';\n          el.style.color = '#fff';\n        });\n      }\n      function refreshBank() {\n        bankData.forEach((t, bi) => {\n          const el = document.getElementById(`sb-t-${bi}`);\n          if (el) el.classList.toggle('used', t.used);\n        });\n      }\n\n      function sbTap(bi) {\n        if (sbLocked) return;\n        const tile = bankData[bi];\n        if (tile.used) return;\n        const si = slotData.indexOf(null);\n        if (si === -1) return;\n        tile.used = true;\n        slotData[si] = { text: tile.text, role: tile.role, bankId: bi };\n        sfx('tap');\n        refreshSlots(); refreshBank();\n        if (slotData.indexOf(null) === -1) setTimeout(sbCheck, 200);\n      }\n      function sbRemove(si) {\n        if (sbLocked) return;\n        const entry = slotData[si];\n        if (!entry) return;\n        bankData[entry.bankId].used = false;\n        slotData[si] = null;\n        sfx('tap');\n        refreshSlots(); refreshBank();\n      }\n\n      function sbCheck() {\n        const item = session[idx];\n        const ok = slotData.every((e, i) => e.text === item.tokens[i].text);\n        sbLocked = true;\n        if (state.student) {\n          // Whole-sentence check, no per-slot granularity \u2014 every token in\n          // the sentence gets the same correct/wrong status for this attempt.\n          item.tokens.forEach(tk => {\n            if (tk.text) recordWordExposure(state.student, tk.text, 'sentence-building', ok).catch(() => {});\n          });\n        }\n        const fb = document.getElementById('sb-fb');\n        const nextBtn = document.getElementById('sb-next-btn');\n\n        if (ok) {\n          score++;\n          slotData.forEach((entry, si) => {\n            const el = document.getElementById(`sb-s-${si}`);\n            if (!el) return;\n            const c = roleColor(entry.role);\n            el.style.borderColor = c || 'rgba(255,255,255,0.3)';\n            el.style.background = c ? c + '26' : 'rgba(255,255,255,0.06)';\n            el.style.color = c || 'rgba(255,255,255,0.6)';\n          });\n          // Reuse the shared grammarLegend helper \u2014 remap text/role to t/r\n          // since this module's tokens use different field names than the\n          // gap-fill/true-false grammar-token convention.\n          const legendTokens = item.tokens.map(t => ({ t: t.text, r: t.role }));\n          fb.innerHTML = `<div class=\"sb-legend-v2\">${grammarLegend(legendTokens)}</div>`;\n          speak(sentenceText(item.tokens), 'celebrate');\n          nextBtn.style.display = 'block';\n          nextBtn.onclick = () => {\n            idx++;\n            if (idx < session.length) load();\n            else onComplete(score / session.length);\n          };\n        } else {\n          slotData.forEach((_, si) => {\n            const el = document.getElementById(`sb-s-${si}`);\n            if (el) { el.style.borderColor = '#E91E63'; el.style.background = 'rgba(233,30,99,0.1)'; }\n          });\n          fb.textContent = '\u2717 Not quite \u2014 listen and try again';\n          fb.style.color = '#F48FB1';\n          speak(sentenceText(item.tokens), 'wrong'); // deliberately speaks even on wrong here, matches locked demo\n          setTimeout(() => {\n            slotData = slotData.map(() => null);\n            bankData.forEach(t => t.used = false);\n            sbLocked = false;\n            refreshSlots(); refreshBank();\n            fb.textContent = 'Try again!';\n            fb.style.color = 'rgba(255,255,255,0.4)';\n          }, 1600);\n        }\n      }\n\n      load();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  DESCRIPTION PYRAMID\n  //  Three-level scaffolded description: L1 category (one tile) \u2192 L2\n  //  observable attributes (ordered groups, sequential unlock) \u2192 L3 detail/\n  //  opinion/sensation (hybrid tile+free-type, no wrong answer). Tier gates\n  //  which levels exist at all: bronze=L1, silver=L1+L2, gold=all three \u2014\n  //  the pyramid visually grows as the tier grows, that growth IS the\n  //  feedback mechanism. On completion, chains into the same Say It\n  //  recorder/persistence/compare-card used everywhere else (optional,\n  //  skippable, never affects the star score either way).\n  'description-pyramid': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      const requiredLevels = tier === 'bronze' ? ['l1'] : tier === 'silver' ? ['l1','l2'] : ['l1','l2','l3'];\n      let idx = 0, totalStars = 0;\n\n      const COLOR_WORD_MAP = {\n        red:'#EF5350', blue:'#42A5F5', yellow:'#FFEE58', green:'#66BB6A',\n        black:'#616161', white:'#F5F5F5', pink:'#F48FB1', brown:'#8D6E63',\n        orange:'#FFA726', purple:'#AB47BC', gray:'#BDBDBD', grey:'#BDBDBD',\n        gold:'#FFD700', silver:'#B0BEC5'\n      };\n      function dynamicColorFor(word){ return COLOR_WORD_MAP[(word||'').toLowerCase()] || '#9575CD'; }\n      function isColourGroup(label){ return /colour|color/i.test(label || ''); }\n\n      function renderItem() {\n        const item = session[idx];\n        let l1Answer = null;\n        let l2Answers = []; // parallel to item.l2, undefined until that group is locked in\n        let l2GroupIndex = 0;\n        let l3TileAnswer = null;\n        let l3BecauseText = '';\n        let currentLevel = 'l1'; // 'l1' | 'l2' | 'l3' | 'done'\n\n        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;\n\n        function setMascot(reaction) {\n          const el = container.querySelector('#dp-mascot');\n          if (!el) return;\n          const map = { start:'\ud83d\ude42', l1:'\ud83d\udc40', l2:'\ud83d\ude2e', l3:'\ud83c\udf89' };\n          el.textContent = map[reaction] || '\ud83d\ude42';\n          el.classList.remove('bump');\n          void el.offsetWidth; // restart the animation\n          el.classList.add('bump');\n        }\n\n        function buildStripHtml() {\n          const pills = [`<span class=\"dp-strip-plain\">It's a</span>`];\n          if (l2Answers.length) {\n            item.l2.forEach((group, i) => {\n              if (l2Answers[i] === undefined) return;\n              if (isColourGroup(group.label)) {\n                pills.push(`<span class=\"dp-strip-pill l2-dynamic\" style=\"background:${dynamicColorFor(l2Answers[i])};\">${l2Answers[i]}</span>`);\n              } else {\n                const cls = i % 2 === 0 ? 'l2-size' : 'l2-shape';\n                pills.push(`<span class=\"dp-strip-pill ${cls}\">${l2Answers[i]}</span>`);\n              }\n            });\n          }\n          if (l1Answer) pills.push(`<span class=\"dp-strip-pill l1\">${l1Answer}</span>`);\n          if (l3TileAnswer) pills.push(`<span class=\"dp-strip-pill l3\">${l3TileAnswer}</span>`);\n          return pills.join(' ');\n        }\n        function updateStrip() {\n          const el = container.querySelector('#dp-strip');\n          if (el) el.innerHTML = buildStripHtml();\n        }\n\n        function levelStateClass(level) {\n          if (!requiredLevels.includes(level)) return 'locked'; // this tier never unlocks it\n          if (level === currentLevel) return 'active';\n          const order = ['l1','l2','l3'];\n          return order.indexOf(level) < order.indexOf(currentLevel) || currentLevel === 'done' ? 'complete' : 'locked';\n        }\n\n        function renderPyramid() {\n          const l1State = levelStateClass('l1');\n          const l2State = levelStateClass('l2');\n          const l3State = levelStateClass('l3');\n          container.querySelector('#dp-pyramid').innerHTML = `\n            <div class=\"dp-block dp-block-l1 ${l1State}\">\n              <span class=\"dp-lock-icon\">\ud83d\udd12</span>\n              <span class=\"dp-block-icon\">\ud83d\udc41\ufe0f</span>\n              <span class=\"dp-block-label\">${l1State === 'complete' ? l1Answer : 'What is it?'}</span>\n              <span class=\"dp-check-icon\">\u2713</span>\n            </div>\n            <div class=\"dp-block dp-block-l2 ${l2State}\">\n              <span class=\"dp-lock-icon\">\ud83d\udd12</span>\n              <span class=\"dp-block-icon\">\ud83d\udccf\ud83c\udfa8</span>\n              <span class=\"dp-block-label\">${l2State === 'complete' ? l2Answers.join(' \u00b7 ') : 'What does it look like?'}</span>\n              <span class=\"dp-check-icon\">\u2713</span>\n            </div>\n            <div class=\"dp-block dp-block-l3 ${l3State}\">\n              <span class=\"dp-lock-icon\">\ud83d\udd12</span>\n              <span class=\"dp-block-icon\">\u2b50</span>\n              <span class=\"dp-block-label\">${l3State === 'complete' ? (l3TileAnswer || 'noted') : 'What makes it special?'}</span>\n              <span class=\"dp-check-icon\">\u2713</span>\n            </div>`;\n        }\n\n        function renderActiveZone() {\n          const zone = container.querySelector('#dp-active-zone');\n          if (currentLevel === 'l1') {\n            zone.innerHTML = `<div class=\"dp-tile-row\" id=\"dp-tiles\"></div>`;\n            const row = zone.querySelector('#dp-tiles');\n            item.l1.options.forEach(opt => {\n              const btn = document.createElement('button');\n              btn.className = 'dp-tile';\n              btn.textContent = opt;\n              btn.addEventListener('click', () => {\n                if (opt !== item.l1.answer) {\n                  sfx('wrong');\n                  if (state.student) recordWordExposure(state.student, item.l1.answer, 'description-pyramid', false).catch(() => {});\n                  btn.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:250});\n                  return;\n                }\n                sfx('correct');\n                if (state.student) recordWordExposure(state.student, item.l1.answer, 'description-pyramid', true).catch(() => {});\n                l1Answer = opt;\n                btn.classList.add('selected');\n                btn.style.background = '#00BCD4'; btn.style.borderColor = '#00BCD4';\n                updateStrip();\n                setMascot('l1');\n                currentLevel = requiredLevels.includes('l2') ? 'l2' : 'done';\n                setTimeout(() => { renderPyramid(); renderActiveZone(); if (currentLevel === 'done') finishPyramid(); }, 450);\n              });\n              row.appendChild(btn);\n            });\n          } else if (currentLevel === 'l2') {\n            const group = item.l2[l2GroupIndex];\n            zone.innerHTML = `\n              <div class=\"dp-group-label\">${group.label}</div>\n              <div class=\"dp-tile-row\" id=\"dp-tiles\"></div>`;\n            const row = zone.querySelector('#dp-tiles');\n            const isColour = isColourGroup(group.label);\n            group.options.forEach(opt => {\n              const btn = document.createElement('button');\n              btn.className = 'dp-tile';\n              btn.textContent = opt;\n              btn.addEventListener('click', () => {\n                if (opt !== group.answer) {\n                  sfx('wrong');\n                  if (state.student) recordWordExposure(state.student, group.answer, 'description-pyramid', false).catch(() => {});\n                  btn.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:250});\n                  return;\n                }\n                sfx('correct');\n                if (state.student) recordWordExposure(state.student, group.answer, 'description-pyramid', true).catch(() => {});\n                l2Answers[l2GroupIndex] = opt;\n                btn.classList.add('selected');\n                const c = isColour ? dynamicColorFor(opt) : (l2GroupIndex % 2 === 0 ? '#FF9800' : '#AB47BC');\n                btn.style.background = c; btn.style.borderColor = c;\n                updateStrip();\n                l2GroupIndex++;\n                if (l2GroupIndex < item.l2.length) {\n                  setTimeout(renderActiveZone, 400);\n                } else {\n                  setMascot('l2');\n                  currentLevel = requiredLevels.includes('l3') ? 'l3' : 'done';\n                  setTimeout(() => { renderPyramid(); renderActiveZone(); if (currentLevel === 'done') finishPyramid(); }, 450);\n                }\n              });\n              row.appendChild(btn);\n            });\n          } else if (currentLevel === 'l3') {\n            const becauseMode = item.l3.because_mode || 'typed';\n            zone.innerHTML = `\n              <div class=\"dp-tile-row\" id=\"dp-tiles\"></div>\n              <input type=\"text\" class=\"dp-l3-free-input\" id=\"dp-l3-free\" placeholder=\"\u2026or type your own\">\n              ${becauseMode === 'typed'\n                ? `<div class=\"dp-because-label\">Why? (optional)</div><input type=\"text\" class=\"dp-l3-free-input\" id=\"dp-because-input\" placeholder=\"because it\u2026\">`\n                : `<div class=\"dp-sayit-only-note\">You'll say why out loud in a moment.</div>`}\n              <button class=\"iv-proceed-btn dp-check-btn\" id=\"dp-l3-continue\" style=\"display:none;\">Continue \u2192</button>`;\n            const row = zone.querySelector('#dp-tiles');\n            (item.l3.tiles || []).forEach(opt => {\n              const btn = document.createElement('button');\n              btn.className = 'dp-tile';\n              btn.textContent = opt;\n              btn.addEventListener('click', () => {\n                row.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.borderColor=''; });\n                btn.classList.add('selected');\n                btn.style.background = '#FFD700'; btn.style.borderColor = '#FFD700';\n                l3TileAnswer = opt;\n                freeInput.value = '';\n                updateStrip();\n                continueBtn.style.display = 'block';\n              });\n              row.appendChild(btn);\n            });\n            const freeInput = zone.querySelector('#dp-l3-free');\n            const continueBtn = zone.querySelector('#dp-l3-continue');\n            freeInput.addEventListener('input', () => {\n              if (!freeInput.value.trim()) return;\n              row.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.borderColor=''; });\n              l3TileAnswer = freeInput.value.trim();\n              updateStrip();\n              continueBtn.style.display = 'block';\n            });\n            const becauseInput = zone.querySelector('#dp-because-input');\n            if (becauseInput) {\n              becauseInput.addEventListener('input', () => { l3BecauseText = becauseInput.value.trim(); });\n            }\n            continueBtn.addEventListener('click', () => {\n              sfx('correct');\n              setMascot('l3');\n              currentLevel = 'done';\n              renderPyramid();\n              finishPyramid();\n            });\n          }\n        }\n\n        function starsForThisItem() {\n          // Deepest level actually reached determines the star count \u2014 tier\n          // gating means every completed item naturally maxes its tier's\n          // ceiling (bronze can only ever reach 1, silver 2, gold 3), which\n          // is the point: more pyramid unlocked = more stars possible.\n          if (requiredLevels.includes('l3')) return 3;\n          if (requiredLevels.includes('l2')) return 2;\n          return 1;\n        }\n        const maxStarsPerItem = requiredLevels.includes('l3') ? 3 : requiredLevels.includes('l2') ? 2 : 1;\n\n        function finishPyramid() {\n          const stars = starsForThisItem();\n          totalStars += stars;\n\n          setTimeout(() => {\n            const plain = buildStripHtml().replace(/<[^>]+>/g, '').replace(/\\s+/g, ' ').trim();\n            const fullSentence = l3BecauseText\n              ? `${plain}. I think it's special because ${l3BecauseText}.`\n              : `${plain}.`;\n\n            container.innerHTML = `\n              <div class=\"dp-mascot-wrap\"><span class=\"dp-mascot bump\" id=\"dp-mascot\">\ud83c\udf89</span></div>\n              <p class=\"module-question\" style=\"text-align:center;\">Nice work! Now you say it:</p>\n              <div id=\"dp-sayit-zone\"></div>\n            `;\n\n            if (item.full_sentence_audio) {\n              const a = new Audio(item.full_sentence_audio);\n              a.play().catch(() => {});\n            }\n\n            renderSayItInteraction(container.querySelector('#dp-sayit-zone'), {\n              prompt: null,\n              target: fullSentence,\n              audioFile: item.full_sentence_audio,\n              isBronze: tier === 'bronze',\n              moduleIndex: state.currentModuleIndex,\n              tier,\n              recordingItemIndex: idx,\n              allowSkip: true, // Say It is optional here \u2014 must never penalize skipping\n            }, () => {\n              // Stars already locked in from the pyramid itself \u2014 Say It\n              // (attempted or skipped) never changes the score, per spec.\n              idx++;\n              if (idx < session.length) renderItem();\n              else onComplete(Math.min(1, totalStars / (session.length * maxStarsPerItem)));\n            });\n          }, 700); // let the pyramid's own gold-glow settle before handing off\n        }\n\n        container.innerHTML = `\n          <div class=\"dp-mascot-wrap\"><span class=\"dp-mascot\" id=\"dp-mascot\">\ud83d\ude42</span></div>\n          <div class=\"dp-pyramid\" id=\"dp-pyramid\"></div>\n          <div id=\"dp-active-zone\"></div>\n          <div class=\"dp-sentence-strip\" id=\"dp-strip\"></div>\n        `;\n        renderPyramid();\n        renderActiveZone();\n        updateStrip();\n      }\n\n      renderItem();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  IMAGE-TO-FEELING\n  //  Subjective response, genuinely no wrong answer \u2014 a safe-zone stimulus\n  //  (colour or emoji, never a person/face) is shown, and the question is\n  //  always mediated through the mascot (\"How does [mascot] feel?\"), never\n  //  asked of the student directly, per the Feelings-lesson design\n  //  constraint. Any tile the student picks is accepted immediately \u2014 this\n  //  module scores participation, not correctness. Bronze = pick a tile,\n  //  Silver = pick + hear the model sentence, Gold = pick + say/type why,\n  //  the same Say-it/Say-more/Say-it-well depth curve as everywhere else.\n  //  The Gold \"why\" step reuses the exact shared Say It interaction built\n  //  for Description Pyramid \u2014 same recorder, same persistence, same\n  //  compare card, not a second copy.\n  'image-to-feeling': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      let idx = 0;\n\n      function renderItem() {\n        const item = session[idx];\n        const mascotEmoji = item.mascotEmoji || '\ud83d\udc7d';\n        const mascotName = item.mascotName || 'Zorp';\n        let selectedTile = null;\n        let done = false;\n\n        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;\n\n        const stimulusStyle = item.stimulusType === 'colour'\n          ? `background:${item.stimulusValue};`\n          : `background:rgba(255,255,255,0.04);`;\n        const stimulusContent = item.stimulusType === 'colour' ? '' : item.stimulusValue;\n\n        container.innerHTML = `\n          <div class=\"itf-stimulus\" style=\"${stimulusStyle}\">${stimulusContent}</div>\n          <div class=\"itf-stimulus-label\">${item.stimulusLabel}</div>\n          <div class=\"dp-mascot-wrap\"><span class=\"dp-mascot\" id=\"itf-mascot\">${mascotEmoji}</span></div>\n          <p class=\"itf-prompt\">How does ${mascotName} feel about this?</p>\n          <div class=\"dp-tile-row\" id=\"itf-tiles\"></div>\n          <div id=\"itf-why-zone\"></div>\n          <button class=\"iv-proceed-btn\" id=\"itf-continue-btn\" style=\"display:none;\">Continue \u2192</button>\n        `;\n\n        const tileRow = container.querySelector('#itf-tiles');\n        const mascotEl = container.querySelector('#itf-mascot');\n        const continueBtn = container.querySelector('#itf-continue-btn');\n        const whyZone = container.querySelector('#itf-why-zone');\n\n        function bumpMascot() {\n          mascotEl.classList.remove('bump');\n          void mascotEl.offsetWidth;\n          mascotEl.classList.add('bump');\n        }\n\n        function playModelSentence(feeling) {\n          if (!TTS) return;\n          TTS.cancel();\n          let u;\n          try { u = new SpeechSynthesisUtterance(`${mascotName} feels ${feeling}.`); }\n          catch(e) { return; }\n          u.rate = tier === 'bronze' ? 0.8 : 0.85;\n          u.lang = 'en-US';\n          TTS.speak(u);\n        }\n\n        item.tiles.forEach(feeling => {\n          const btn = document.createElement('button');\n          btn.className = 'dp-tile';\n          btn.textContent = feeling;\n          btn.addEventListener('click', () => {\n            if (done) return;\n            sfx('tap');\n            tileRow.querySelectorAll('.dp-tile').forEach(b => { b.classList.remove('selected'); b.style.background=''; b.style.color=''; });\n            btn.classList.add('selected');\n            btn.style.background = '#4FC3F7';\n            selectedTile = feeling;\n            bumpMascot();\n\n            if (tier === 'bronze') {\n              continueBtn.style.display = 'block';\n            } else {\n              playModelSentence(feeling);\n              if (tier === 'silver') {\n                continueBtn.style.display = 'block';\n              } else {\n                // Gold: a why-elaboration step, hybrid typed/say-it \u2014 mirrors\n                // Description Pyramid's L3 exactly, same design language.\n                const becauseMode = item.because_mode || 'typed';\n                whyZone.innerHTML = becauseMode === 'typed'\n                  ? `<div class=\"dp-because-label\">Why does ${mascotName} feel ${feeling}?</div><input type=\"text\" class=\"dp-l3-free-input\" id=\"itf-why-input\" placeholder=\"because\u2026\">`\n                  : `<div class=\"dp-sayit-only-note\">You'll say why out loud in a moment.</div>`;\n                continueBtn.style.display = 'block';\n              }\n            }\n          });\n          tileRow.appendChild(btn);\n        });\n\n        continueBtn.addEventListener('click', () => {\n          if (done || !selectedTile) return;\n          done = true;\n\n          if (tier === 'gold' && (item.because_mode || 'typed') === 'say-it') {\n            // Chain into the shared Say It flow for the spoken elaboration \u2014\n            // same recorder/persistence/compare-card as Description Pyramid\n            // uses, not a separate implementation.\n            const target = `${mascotName} feels ${selectedTile} because...`;\n            container.innerHTML = `<p class=\"module-question\" style=\"text-align:center;\">Tell us why:</p><div id=\"itf-sayit-zone\"></div>`;\n            renderSayItInteraction(container.querySelector('#itf-sayit-zone'), {\n              prompt: null, target, audioFile: null, isBronze: false,\n              moduleIndex: state.currentModuleIndex, tier, recordingItemIndex: idx,\n              allowSkip: true, // subjective reflection \u2014 never force a recording\n            }, () => advance());\n            return;\n          }\n\n          advance();\n        });\n\n        function advance() {\n          idx++;\n          if (idx < session.length) renderItem();\n          else onComplete(1); // no wrong answer possible \u2014 completing the session is full credit\n        }\n      }\n\n      renderItem();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  CREATIVE REFLECTION CARD\n  //  A digital companion to the physical notebook ritual (written by hand,\n  //  bottom-right of the right-hand page, every lesson) \u2014 not a\n  //  replacement for it. The template itself grows richer through the\n  //  Description Pathway (Objects: \"It is a ___\" -> \"___, ___, ___ with\n  //  ___\" / People: \"He/She looks ___ and ___\" / Feelings: \"I think it\n  //  feels ___ because ___\" / Creative Work: the full 3-line card) \u2014 so\n  //  the template is authored per lesson, not fixed in the shell. Purpose\n  //  is an emergency presentation tool: any student who freezes when\n  //  showing their work always has something ready to say. No correctness\n  //  possible \u2014 this is the student's own expression, always full credit\n  //  for genuine completion. Chains into the same shared Say It\n  //  interaction used by Description Pyramid and Image-to-Feeling.\n  'creative-reflection': {\n    render(container, data, tier, onComplete) {\n      const { pick, items } = data;\n      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));\n      let idx = 0;\n\n      function renderItem() {\n        const item = session[idx];\n        const parts = item.template.split(/(\\{\\d+\\})/g);\n        let blankCount = 0;\n\n        document.getElementById('v2-qlabel').textContent = `Item ${idx + 1} of ${session.length}`;\n\n        const cardHtml = parts.map(part => {\n          const match = part.match(/^\\{(\\d+)\\}$/);\n          if (!match) return part.replace(/&/g,'&amp;').replace(/</g,'&lt;');\n          const i = parseInt(match[1]);\n          const hint = (item.blankHints && item.blankHints[i]) || '...';\n          blankCount++;\n          return `<input type=\"text\" class=\"crc-blank-input\" id=\"crc-blank-${i}\" data-idx=\"${i}\" placeholder=\"${hint}\" size=\"1\">`;\n        }).join('');\n\n        container.innerHTML = `\n          <p class=\"crc-notebook-note\">Same as the reflection card in your notebook \u2014 fill it in here too.</p>\n          <div class=\"crc-card\" id=\"crc-card\">${cardHtml}</div>\n          <button class=\"iv-proceed-btn\" id=\"crc-continue-btn\" style=\"display:none;\">Continue \u2192</button>\n        `;\n\n        const inputs = [...container.querySelectorAll('.crc-blank-input')];\n        const continueBtn = container.querySelector('#crc-continue-btn');\n\n        function checkAllFilled() {\n          const allFilled = inputs.every(inp => inp.value.trim());\n          continueBtn.style.display = allFilled ? 'block' : 'none';\n        }\n        inputs.forEach(inp => inp.addEventListener('input', () => {\n          // Widen the box to fit what they're typing, never truncating their own words.\n          inp.size = Math.max(inp.placeholder.length, inp.value.length, 4);\n          checkAllFilled();\n        }));\n\n        continueBtn.addEventListener('click', () => {\n          const filled = template => {\n            let result = item.template;\n            inputs.forEach(inp => { result = result.replace(`{${inp.dataset.idx}}`, inp.value.trim()); });\n            return result;\n          };\n          const target = filled();\n\n          container.innerHTML = `<p class=\"module-question\" style=\"text-align:center;\">Now say it:</p><div id=\"crc-sayit-zone\"></div>`;\n          renderSayItInteraction(container.querySelector('#crc-sayit-zone'), {\n            prompt: null, target, audioFile: null, isBronze: tier === 'bronze',\n            moduleIndex: state.currentModuleIndex, tier, recordingItemIndex: idx,\n            allowSkip: true, // this is a rehearsal tool, never force the recording\n          }, () => {\n            idx++;\n            if (idx < session.length) renderItem();\n            else onComplete(1); // no wrong answer possible \u2014 genuine completion is full credit\n          });\n        });\n      }\n\n      renderItem();\n    }\n  },\n\n};\n\n\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u255
