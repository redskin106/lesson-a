<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Confidence Ladder — Objects</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #ffffff;
  --surface:    #f7f7f5;
  --card:       #ffffff;
  --border:     rgba(0,0,0,0.08);
  --border2:    rgba(0,0,0,0.14);
  --text:       #1a1a1a;
  --dim:        rgba(26,26,26,0.45);
  --faint:      rgba(26,26,26,0.05);

  /* Tile colours */
  --tile-colour:   #e53935;
  --tile-size:     #d81b60;
  --tile-shape:    #388e3c;
  --tile-noun:     #1565c0;
  --tile-detail:   #e65100;
  --tile-material: #424242;
  --tile-texture:  #6a1b9a;
  --tile-reason:   #311b92;
  --tile-default:  #455a64;

  /* Pyramid tiers */
  --bronze: #c9a84c;
  --silver: #78909c;
  --gold:   #e8a020;

  --coral:  #e8734a;
  --sage:   #5a9e7c;
  --radius: 14px;
  --pill:   999px;

  /* Notebook */
  --notebook-bg: #fdf8ed;
  --notebook-border: rgba(201,168,76,0.3);
  --notebook-text: #6b5a2e;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Shell ── */
.shell {
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.header-back { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; padding: 4px; line-height: 1; }
.header-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 700; flex: 1; }
.header-zone  { font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
.replay-btn   { background: none; border: 1px solid var(--border2); border-radius: var(--pill); color: var(--dim); cursor: pointer; font-size: 13px; padding: 5px 10px; display: flex; align-items: center; gap: 4px; }
.replay-btn:hover { border-color: var(--coral); color: var(--coral); }

/* ── Content area ── */
.content {
  flex: 1;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── Object anchor image ── */
.obj-image-corner {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 72px;
  height: 72px;
  border-radius: 12px;
  border: 2px solid var(--border2);
  object-fit: cover;
  background: var(--surface);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  display: none;
  z-index: 5;
}
.obj-image-corner.visible { display: block; }

/* ── Zone label ── */
.zone-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: -8px;
}

/* ── Model sentence card ── */
.model-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 20px 22px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.model-sentence {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  color: var(--text);
}
.model-play {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 2px;
  opacity: 0.5;
  transition: opacity 0.15s;
}
.model-play:hover { opacity: 1; }

/* ── Hero image (zone 0) ── */
.hero-image {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: contain;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}

/* ── Word display (zone 0) ── */
.word-display {
  text-align: center;
  padding: 24px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.word-big {
  font-family: 'Fraunces', serif;
  font-size: 48px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.word-play {
  background: none;
  border: 2px solid var(--border2);
  border-radius: var(--pill);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--dim);
  cursor: pointer;
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.word-play:hover { border-color: var(--coral); color: var(--coral); }

/* ── Exercise label ── */
.ex-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ── Tile drop zone ── */
.tile-drop-zone {
  min-height: 56px;
  background: var(--surface);
  border: 2px dashed var(--border2);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  transition: border-color 0.15s;
}
.tile-drop-zone.has-tiles { border-style: solid; border-color: var(--border); background: var(--bg); }
.tile-drop-zone.correct   { border-color: var(--sage); background: rgba(90,158,124,0.06); }
.tile-drop-zone.wrong     { border-color: var(--coral); background: rgba(232,115,74,0.06); }

/* ── Tile bank ── */
.tile-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* ── Tile chip ── */
.tile {
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  border: none;
  color: #fff;
  transition: transform 0.1s, opacity 0.15s;
  position: relative;
}
.tile:active { transform: scale(0.95); }
.tile.placed { opacity: 0.35; cursor: default; pointer-events: none; }
.tile.preplaced { opacity: 0.65; cursor: default; pointer-events: none; border: 2px dashed rgba(255,255,255,0.4); }

/* Tile placed in drop zone — removable */
.placed-tile {
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.1s;
}
.placed-tile:active { transform: scale(0.95); }
.placed-tile-remove { font-size: 12px; opacity: 0.6; }

/* Tile colours */
.tc-colour   { background: var(--tile-colour); }
.tc-size     { background: var(--tile-size); }
.tc-shape    { background: var(--tile-shape); }
.tc-noun     { background: var(--tile-noun); }
.tc-detail   { background: var(--tile-detail); }
.tc-material { background: var(--tile-material); }
.tc-texture  { background: var(--tile-texture); }
.tc-reason   { background: var(--tile-reason); }
.tc-default  { background: var(--tile-default); }

/* ── Check button ── */
.check-btn {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  border: none;
  background: var(--text);
  color: var(--bg);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}
.check-btn:hover { opacity: 0.85; }
.check-btn:active { transform: scale(0.98); }
.check-btn:disabled { opacity: 0.3; cursor: default; }

/* ── Continue button ── */
.continue-btn {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  border: 2px solid var(--border2);
  background: transparent;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.continue-btn:hover { border-color: var(--text); }
.continue-btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ── Feedback ── */
.feedback {
  border-radius: var(--radius);
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 500;
  display: none;
}
.feedback.correct { background: rgba(90,158,124,0.1); border: 1px solid rgba(90,158,124,0.3); color: #2d6b4f; }
.feedback.hint    { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); color: #6b5a2e; }
.feedback.visible { display: block; }

/* ── Colour choice (zone 2 step 1) ── */
.colour-choices {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 8px 0;
}
.colour-chip {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  position: relative;
}
.colour-chip:hover { transform: scale(1.08); }
.colour-chip.selected { border-color: var(--text); }
.colour-chip.correct-pick  { border-color: var(--sage); }
.colour-chip.wrong-pick    { border-color: var(--coral); opacity: 0.5; }

/* ── Yes/No questions (zone 4) ── */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.question-text {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
}
.yn-buttons { display: flex; gap: 10px; }
.yn-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius);
  border: 2px solid var(--border2);
  background: transparent;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.yn-btn:hover { border-color: var(--text); }
.yn-btn.correct { background: rgba(90,158,124,0.1); border-color: var(--sage); color: #2d6b4f; }
.yn-btn.wrong   { background: rgba(232,115,74,0.08); border-color: var(--coral); color: var(--coral); }

/* ── Silhouette reveal (zone 4) ── */
.silhouette-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
}
.silhouette-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: brightness(0);
  transition: filter 1s ease;
}
.silhouette-progress {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  background: rgba(0,0,0,0.4);
  padding: 3px 10px;
  border-radius: var(--pill);
}

/* ── Multiple choice options ── */
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  border-radius: var(--radius);
  border: 2px solid var(--border2);
  background: var(--bg);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
}
.choice-btn:hover { border-color: var(--text); background: var(--surface); }
.choice-btn.correct { background: rgba(90,158,124,0.1); border-color: var(--sage); color: #2d6b4f; }
.choice-btn.wrong   { background: rgba(232,115,74,0.08); border-color: var(--coral); color: var(--coral); opacity: 0.6; }
.choice-btn.all-good { background: rgba(90,158,124,0.1); border-color: var(--sage); color: #2d6b4f; }

/* ── Zone transition beat ── */
.zone-beat {
  text-align: center;
  padding: 40px 24px;
}
.zone-beat-text {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--text);
}

/* ── Notebook prompt ── */
.notebook-prompt {
  background: var(--notebook-bg);
  border: 1px solid var(--notebook-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.notebook-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
.notebook-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--notebook-text);
  line-height: 1.5;
}
.notebook-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(107,90,46,0.5);
  margin-bottom: 4px;
}

/* ── Zone 6 — Pyramid reveal ── */
.pyramid-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}
.pyramid-tier {
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  color: #fff;
}
.pyramid-tier.visible { opacity: 1; transform: translateY(0); }
.pyramid-tier.bronze  { background: var(--bronze); }
.pyramid-tier.silver  { background: var(--silver); }
.pyramid-tier.gold    { background: var(--gold); }

.reveal-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 4px;
  display: block;
}
.reveal-final {
  text-align: center;
  padding: 20px;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--dim);
}

/* ── Word guide ── */
.word-guide-btn {
  position: fixed;
  bottom: 108px;
  right: 20px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--pill);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  z-index: 6;
  display: none;
}
.word-guide-btn.visible { display: flex; align-items: center; gap: 4px; }

.guide-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; align-items: flex-end; }
.guide-overlay.open { display: flex; }
.guide-panel { background: var(--bg); border-radius: 18px 18px 0 0; padding: 24px; width: 100%; max-height: 70vh; overflow-y: auto; }
.guide-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.guide-table { width: 100%; border-collapse: collapse; }
.guide-table td { padding: 8px 10px; font-size: 14px; border-bottom: 1px solid var(--border); }
.guide-table td:first-child { font-weight: 700; }
.guide-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.guide-close { width: 100%; margin-top: 16px; padding: 14px; border-radius: var(--radius); border: 1.5px solid var(--border2); background: transparent; font-size: 15px; font-weight: 600; cursor: pointer; }

/* ── Landing page ── */
#landing { padding: 32px 24px; }
.landing-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.landing-sub { font-size: 14px; color: var(--dim); margin-bottom: 28px; }
.name-input-wrap { display: flex; gap: 10px; margin-bottom: 32px; }
.name-input { flex: 1; padding: 14px 16px; border-radius: var(--radius); border: 1.5px solid var(--border2); background: var(--surface); font-size: 16px; color: var(--text); }
.name-input:focus { outline: none; border-color: var(--text); }
.start-btn { padding: 14px 22px; border-radius: var(--radius); border: none; background: var(--text); color: var(--bg); font-size: 15px; font-weight: 700; cursor: pointer; }

.obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.obj-card {
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s;
  background: var(--bg);
}
.obj-card:hover { border-color: var(--text); transform: translateY(-2px); }
.obj-card.done  { border-color: var(--sage); }
.obj-card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.obj-card-label { padding: 10px 12px; font-size: 14px; font-weight: 600; }
.obj-card-done { font-size: 11px; color: var(--sage); font-weight: 600; }

/* ── Animations ── */
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp 0.35s ease both; }

/* ── Dark mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:       #0f1117;
    --surface:  #171b24;
    --card:     #1e2330;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --text:     #e8eaf0;
    --dim:      rgba(232,234,240,0.45);
    --faint:    rgba(232,234,240,0.07);
    --notebook-bg: rgba(201,168,76,0.07);
    --notebook-border: rgba(201,168,76,0.2);
    --notebook-text: #c9a84c;
  }
  .check-btn  { background: #e8eaf0; color: #0f1117; }
  .continue-btn.primary { background: #e8eaf0; color: #0f1117; border-color: #e8eaf0; }
  .start-btn  { background: #e8eaf0; color: #0f1117; }
  .silhouette-img { filter: brightness(0.15); }
  .silhouette-img.revealed-full { filter: brightness(1); }
}
</style>
</head>
<body>

<!-- ── Landing page ── -->
<div id="landing">
  <div class="landing-title">Let's describe things.</div>
  <div class="landing-sub">One step at a time.</div>
  <div class="name-input-wrap">
    <input class="name-input" id="name-input" type="text" placeholder="Your first name" maxlength="30" autocomplete="off">
    <button class="start-btn" onclick="startLanding()">Start →</button>
  </div>
  <div style="font-size:12px;color:var(--dim);margin-bottom:10px;">Or tap an object below to begin</div>
  <div class="obj-grid" id="obj-grid"></div>
</div>

<!-- ── Lesson shell ── -->
<div id="lesson-shell" style="display:none;">
  <div class="shell">
    <div class="header">
      <button class="header-back" onclick="goLanding()">←</button>
      <div class="header-title" id="header-title">Bag</div>
      <div class="header-zone"  id="header-zone">Zone 0</div>
      <button class="replay-btn" id="replay-btn" onclick="replayAudio()">🔊 Replay</button>
    </div>
    <div class="content" id="screen-content"></div>
  </div>
</div>

<!-- ── Pinned object image ── -->
<img id="obj-corner" class="obj-image-corner" src="" alt="">

<!-- ── Word guide button ── -->
<button class="word-guide-btn" id="word-guide-btn" onclick="openGuide()">❓ Word guide</button>

<!-- ── Word guide overlay ── -->
<div class="guide-overlay" id="guide-overlay" onclick="closeGuide()">
  <div class="guide-panel" onclick="event.stopPropagation()">
    <div class="guide-title">Word Guide</div>
    <table class="guide-table">
      <tbody>
        <tr><td><span class="guide-swatch" style="background:var(--tile-colour)"></span>colour</td><td style="color:var(--dim)">colour adjective</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-size)"></span>big / small</td><td style="color:var(--dim)">size adjective</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-shape)"></span>shape</td><td style="color:var(--dim)">shape adjective</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-noun)"></span>the thing</td><td style="color:var(--dim)">noun</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-detail)"></span>something special</td><td style="color:var(--dim)">detail</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-material)"></span>what it's made of</td><td style="color:var(--dim)">material noun</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-texture)"></span>how it feels</td><td style="color:var(--dim)">texture adjective</td></tr>
        <tr><td><span class="guide-swatch" style="background:var(--tile-reason)"></span>because…</td><td style="color:var(--dim)">reason clause</td></tr>
      </tbody>
    </table>
    <button class="guide-close" onclick="closeGuide()">Close</button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  DATA
// ──────────────────────────────────────────────

const STUDENT_NAME = () => localStorage.getItem('cl_name') || 'You';

// Tile colour lookup
const TC = {
  "It's":"tc-default","It":"tc-default","a":"tc-default","the":"tc-default",
  "bag":"tc-noun","zip":"tc-detail","strap":"tc-detail","handle":"tc-detail",
  "big":"tc-size","flat":"tc-size","small":"tc-size","heavy":"tc-size","light":"tc-size",
  "black":"tc-colour","dirty":"tc-colour",
  "smooth":"tc-texture","rough":"tc-texture","soft":"tc-texture",
  "old":"tc-default","looks":"tc-default","feels":"tc-default",

function renderZone() {
  hintCount   = 0;
  placedTiles = [];
  preplaced   = [];

  const zoneLabels = {
    z0:'Zone 0', z1:'Zone 1', z2:'Zone 2 · Step 1', z3:'Zone 3', z3b:'Zone 3b',
    z4a:'Zone 4a', z4b:'Zone 4b', z4c:'Zone 4c', z5:'Zone 5 · Can you say more?', z6:'Zone 6'
  };
  document.getElementById('header-zone').textContent = zoneLabels[currentZone] || '';

  // Show pinned image from zone 1 onward
  if (currentZone !== 'z0') {
    const img = document.getElementById('obj-corner');
    img.src = currentObj.image;
    img.classList.add('visible');
  }

  switch(currentZone) {
    case 'z0':   renderZ0();   break;
    case 'z1':   renderZ1();   break;
    case 'z2':   renderZ2();   break;
    case 'z3':   renderZ3();   break;
    case 'z3b':  renderZ3b();  break;
    case 'z4a':  renderZ4a();  break;
    case 'z4b':  renderZ4b();  break;
    case 'z4c':  renderZ4c();  break;
    case 'z5':   renderZ5();   break;
    case 'z6':   renderZ6();   break;
  }
}

function answerQ4(correct, chosen, zone) {
  const z = currentObj.zones[zone];
  const qs = z.questions;
  const isCorrect = chosen === correct || (correct !== 'yes' && correct !== 'no' && chosen === 'no');
  const btns = document.querySelectorAll('.yn-btn');
  btns.forEach(b => b.onclick = null);

  if (isCorrect) {
    btns[chosen === 'yes' ? 0 : 1].classList.add('correct');
    const q = qs[zone === 'z4a' ? z4aIndex : z4bIndex];
    const extra = q.extra || (correct === 'yes' ? 'Yes!' : 'No.');
    showFeedback('correct', extra);
    setTimeout(() => {
      if (zone === 'z4a') {
        z4aIndex++;
        if (z4aIndex >= qs.length) { currentStep = 1; renderZone(); }
        else renderQ4a(z);
      } else {
        z4bIndex++;
        if (z4bIndex >= qs.length) { currentStep = 1; renderZone(); }
        else renderQ4b(z);
      }
    }, 900);
  } else {
    btns[chosen === 'yes' ? 0 : 1].classList.add('wrong');
    showFeedback('hint', 'Look again. Think about the bag.');
    setTimeout(() => {
      btns.forEach(b => { b.classList.remove('wrong','correct'); });
      btns[0].onclick = () => answerQ4(correct, 'yes', zone);
      btns[1].onclick = () => answerQ4(correct, 'no', zone);
    }, 900);
  }
}

  const hints = customHints || currentObj.zones[zKey].fixit?.hints || [];

  setContent(`
    <div class="zone-eyebrow fade-up">${zoneLabel(zKey)}</div>
    ${modelCard(modelText)}
    <div class="ex-label fade-up">Build it — put the words in order</div>
    <div class="tile-drop-zone fade-up" id="drop-zone">
      ${preplaced.map(w => `<span class="placed-tile ${tileClass(w)}" data-word="${w}" style="cursor:default">${w}</span>`).join('')}
    </div>
    <div class="tile-bank fade-up" id="tile-bank">
      ${tiles.filter(t => !preplaced.includes(t) || tiles.filter(x=>x===t).length > preplaced.filter(x=>x===t).length)
             .filter((t,i,a) => {
               // handle duplicates: show each tile once per occurrence not in preplaced
               const inPre = preplaced.filter(x=>x===t).length;
               const inAll = tiles.filter(x=>x===t).length;
               return a.indexOf(t) === i || i > a.indexOf(t);
             })
             .map(t => `<button class="tile ${tileClass(t)}" onclick="placeTile(this,'${t}')">${t}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="check-btn fade-up" id="check-btn" onclick="checkBuild('${zKey}',${JSON.stringify(build.tiles)},${JSON.stringify(hints||[])},${step})">Check</button>
  `);

  speak(modelText, false);
  updateDropZone();
}

function placeTile(btn, word) {
  btn.classList.add('placed');
  btn.onclick = null;
  placedTiles.push(word);
  const drop = document.getElementById('drop-zone');
  const span = document.createElement('span');
  span.className = `placed-tile ${tileClass(word)}`;
  span.dataset.word = word;
  span.innerHTML = `${word} <span class="placed-tile-remove" onclick="removePlacedTile(this,'${word}',event)">✕</span>`;
  // Don't allow removing preplaced
  if (preplaced.includes(word) && placedTiles.filter(t=>t===word).length <= preplaced.filter(t=>t===word).length) {
    span.innerHTML = word;
    span.style.cursor = 'default';
  }
  drop.appendChild(span);
  updateDropZone();
}

function removePlacedTile(removeBtn, word, event) {
  event.stopPropagation();
  const span = removeBtn.parentElement;
  span.remove();
  const idx = placedTiles.lastIndexOf(word);
  if (idx > -1) placedTiles.splice(idx, 1);
  // Re-enable the tile in bank
  const bank = document.getElementById('tile-bank');
  const tiles = bank.querySelectorAll('.tile.placed');
  for (const t of tiles) {
    if (t.textContent.trim() === word || t.textContent.trim() === word.replace(/[✕]/g,'').trim()) {
      t.classList.remove('placed');
      t.onclick = () => placeTile(t, word);
      break;
    }
  }
  updateDropZone();
}

function updateDropZone() {
  const drop = document.getElementById('drop-zone');
  if (!drop) return;
  if (drop.querySelectorAll('.placed-tile').length > 0) drop.classList.add('has-tiles');
  else drop.classList.remove('has-tiles');
}

function checkBuild(zKey, correct, hints, nextStep) {
  const current = placedTiles.join('|');
  const target  = correct.join('|');
  const drop    = document.getElementById('drop-zone');

  if (current === target) {
    drop.classList.add('correct');
    showFeedback('correct', '✓ Correct!');
    speak(correct.join(' '), false);
    disableAll();
    setTimeout(() => {
      currentStep = nextStep + 1;
      renderZone();
    }, 1000);
  } else {
    drop.classList.add('wrong');
    setTimeout(() => drop.classList.remove('wrong'), 600);

    if (hintCount < hints.length) {
      showFeedback('hint', hints[hintCount].text || hints[hintCount]);
      hintCount++;
    } else {
      // Auto-assemble
      showFeedback('hint', 'Here is the answer.');
      autoAssemble(correct, zKey, nextStep);
    }
  }
}

function autoAssemble(correct, zKey, nextStep) {
  // Clear drop zone except preplaced, rebuild with correct tiles
  const drop = document.getElementById('drop-zone');
  drop.innerHTML = '';
  placedTiles = [];
  disableAll();

  correct.forEach((word, i) => {
    setTimeout(() => {
      placedTiles.push(word);
      const span = document.createElement('span');
      span.className = `placed-tile ${tileClass(word)}`;
      span.textContent = word;
      drop.appendChild(span);
      if (i === correct.length - 1) {
        speak(correct.join(' '), false);
        setTimeout(() => { currentStep = nextStep + 1; renderZone(); }, 1200);
      }
    }, i * 300);
  });
}

// ──────────────────────────────────────────────
//  FIX-IT EXERCISE
// ──────────────────────────────────────────────

function renderFixIt(zKey, fixit, nextStep) {
  hintCount = 0;
  preplaced = [];
  placedTiles = [];

  setContent(`
    <div class="zone-eyebrow fade-up">${zoneLabel(zKey)}</div>
    <div class="model-card fade-up" style="background:rgba(232,115,74,0.07);border-color:rgba(232,115,74,0.3);">
      <div class="model-sentence" style="font-size:18px;text-decoration:line-through;opacity:0.6;">${fixit.broken}</div>
    </div>
    <div class="ex-label fade-up">Fix it — build the correct sentence</div>
    <div class="tile-drop-zone fade-up" id="drop-zone"></div>
    <div class="tile-bank fade-up" id="tile-bank">
      ${fixit.correctTiles.map(t => `<button class="tile ${tileClass(t)}" onclick="placeTile(this,'${t}')">${t}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <p class="fade-up" style="font-size:13px;color:var(--dim);text-align:center;margin-top:-8px;">${fixit.prompt}</p>
    <button class="check-btn fade-up" onclick="checkBuild('${zKey}',${JSON.stringify(fixit.correctTiles)},${JSON.stringify(fixit.hints||[])},${nextStep})">Check</button>
  `);
}

// ──────────────────────────────────────────────
//  ZONE DONE / TRANSITION
// ──────────────────────────────────────────────

function renderZoneDone(zKey, notebookText, beatText, nextZoneKey) {
  setContent(`
    <div class="zone-beat fade-up">
      <div class="zone-beat-text">${beatText}</div>
    </div>
    ${notebookText ? notebook(notebookText) : ''}
    <button class="continue-btn primary fade-up" onclick="goNextZone('${nextZoneKey}')">Continue →</button>
  `);
}

function goNextZone(zKey) {
  currentZone  = zKey;
  currentStep  = 0;
  hintCount    = 0;
  z4aIndex     = 0;
  z4bIndex     = 0;
  z5Index      = 0;
  renderZone();
}

function nextZone() {
  const order = ['z0','z1','z2','z3','z3b','z4a','z4b','z4c','z5','z6'];
  const idx   = order.indexOf(currentZone);
  if (idx < order.length - 1) {
    currentZone = order[idx + 1];
    currentStep = 0;
    renderZone();
  }
}

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────

function setContent(html) {
  document.getElementById('screen-content').innerHTML = html;
}

function modelCard(text) {
  return `
  <div class="model-card fade-up">
    <div class="model-sentence">${text}</div>
    <button class="model-play" onclick="speak('${text.replace(/'/g,"\\'")}', false)">🔊</button>
  </div>`;
}

function notebook(text) {
  return `
  <div class="notebook-prompt fade-up">
    <div class="notebook-icon">📓</div>
    <div>
      <div class="notebook-label">In your notebook</div>
      <div class="notebook-text">${text}</div>
    </div>
  </div>`;
}

function showFeedback(type, text) {
  const el = document.getElementById('feedback');
  if (!el) return;
  el.className = `feedback ${type} visible`;
  el.textContent = text;
}

function disableAll() {
  document.querySelectorAll('.tile, .check-btn, .yn-btn, .choice-btn').forEach(el => {
    el.disabled = true;
    el.style.pointerEvents = 'none';
  });
}

function zoneLabel(zKey) {
  return { z1:'What is it?', z2:'What does it look like?', z3:'What makes it special?', z3b:'How does it make you feel?', z4a:'Physical questions', z4b:'Behaviour questions' }[zKey] || '';
}

// ──────────────────────────────────────────────
//  AUDIO — Browser TTS (placeholder until EL)
// ──────────────────────────────────────────────

function speak(text, isWord) {
  if (!text) return;
  lastAudioText = text;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'en-GB';
    u.rate  = isWord ? 0.75 : 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e) {}
}

function replayAudio() {
  if (lastAudioText) speak(lastAudioText, lastAudioText.split(' ').length === 1);
}

// ──────────────────────────────────────────────
//  WORD GUIDE
// ──────────────────────────────────────────────

function openGuide()  { document.getElementById('guide-overlay').classList.add('open'); }
function closeGuide() { document.getElementById('guide-overlay').classList.remove('open'); }

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────

renderLanding();
</script>
