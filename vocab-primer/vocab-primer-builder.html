<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Primer Builder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font-family: inherit; }

:root {
  --bg:       #0f1117;
  --panel:    #171b24;
  --card:     #1e2330;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --text:     #e8eaf0;
  --dim:      rgba(232,234,240,0.45);
  --faint:    rgba(232,234,240,0.07);
  --coral:    #e8734a;
  --coral-d:  rgba(232,115,74,0.15);
  --sage:     #7ab89a;
  --sage-d:   rgba(122,184,154,0.13);
  --gold:     #c9a84c;
  --gold-d:   rgba(201,168,76,0.13);
  --purple:   #9b7fd4;
  --purple-d: rgba(155,127,212,0.13);
  --red:      #e05c5c;
  --red-d:    rgba(224,92,92,0.13);
  --radius:   10px;
  --pill:     999px;
}

body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 14px; line-height: 1.5;
  min-height: 100vh;
}

/* ── Layout ── */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.main { flex: 1; padding: 28px; overflow-y: auto; }

/* ── Sidebar ── */
.sidebar-head {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; }
.sidebar-sub   { font-size: 11px; color: var(--dim); margin-top: 2px; }

.sidebar-section {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--dim);
  padding: 14px 16px 6px;
}

.deck-list { padding: 0 8px 8px; }
.deck-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background 0.12s; margin-bottom: 2px;
}
.deck-item:hover { background: var(--faint); }
.deck-item.active { background: var(--coral-d); }
.deck-item-icon { font-size: 14px; flex-shrink: 0; }
.deck-item-word { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.deck-item-tier {
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 2px 6px; border-radius: var(--pill);
}
.tier-bronze { color: var(--gold);   background: var(--gold-d); }
.tier-silver { color: var(--dim);    background: var(--faint); }
.tier-gold   { color: #e8d07a;       background: rgba(232,208,122,0.12); }
.deck-item-type {
  font-size: 9px; color: var(--dim);
  background: var(--faint); padding: 2px 5px; border-radius: 4px;
}

.sidebar-actions { padding: 8px; border-top: 1px solid var(--border); margin-top: auto; }
.btn-full {
  width: 100%; padding: 9px; border-radius: var(--radius);
  border: 1.5px solid var(--border2); background: transparent;
  color: var(--text); font-size: 12px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-bottom: 6px; transition: background 0.12s;
}
.btn-full:hover { background: var(--faint); }
.btn-full.primary { background: var(--coral-d); border-color: var(--coral); color: var(--coral); }
.btn-full.primary:hover { background: rgba(232,115,74,0.25); }
.btn-full.sage { background: var(--sage-d); border-color: var(--sage); color: var(--sage); }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.topbar-title { font-size: 18px; font-weight: 700; flex: 1; }
.topbar-lesson input {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 8px; padding: 7px 12px;
  color: var(--text); font-size: 13px; width: 220px;
}
.btn {
  padding: 8px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--border2); background: transparent;
  color: var(--text); font-size: 12px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center;
  gap: 5px; transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--faint); }
.btn.coral { border-color: var(--coral); color: var(--coral); background: var(--coral-d); }
.btn.coral:hover { background: rgba(232,115,74,0.25); }
.btn.sage { border-color: var(--sage); color: var(--sage); background: var(--sage-d); }
.btn.purple { border-color: var(--purple); color: var(--purple); background: var(--purple-d); }
.btn.gold  { border-color: var(--gold); color: var(--gold); background: var(--gold-d); }
.btn.red   { border-color: var(--red);  color: var(--red);  background: var(--red-d); }
.btn.sm { padding: 5px 11px; font-size: 11px; }

/* ── Card editor ── */
.editor-empty {
  text-align: center; padding: 80px 24px;
  color: var(--dim);
}
.editor-empty-icon { font-size: 48px; margin-bottom: 16px; }
.editor-empty-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

.editor { display: flex; flex-direction: column; gap: 20px; }

.field-group {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
}
.field-group-head {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
  display: flex; align-items: center; justify-content: space-between;
}
.field-group-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* Pair layout — two columns */
.pair-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; }
.pair-col-head {
  font-size: 11px; font-weight: 700; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}

/* Fields */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: 0.04em; }
.field input, .field textarea, .field select {
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: 7px; padding: 8px 10px;
  color: var(--text); font-size: 13px;
  transition: border-color 0.12s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--coral);
}
.field textarea { resize: vertical; min-height: 64px; }
.field select { cursor: pointer; }

/* Inline row */
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

/* Image upload */
.img-upload {
  border: 2px dashed var(--border2); border-radius: var(--radius);
  padding: 20px; text-align: center; cursor: pointer;
  transition: border-color 0.15s, background 0.15s; position: relative;
}
.img-upload:hover { border-color: var(--coral); background: var(--coral-d); }
.img-upload input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
  background: none; border: none; padding: 0;
}
.img-upload-icon  { font-size: 28px; margin-bottom: 6px; }
.img-upload-label { font-size: 12px; color: var(--dim); }
.img-upload-preview {
  width: 100%; aspect-ratio: 1/1; object-fit: contain;
  border-radius: 8px; background: var(--bg);
  display: none;
}

/* Phoneme builder */
.phoneme-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ph-chip {
  background: var(--gold-d); border: 1px solid var(--gold);
  border-radius: 7px; padding: 5px 10px;
  font-size: 15px; color: var(--gold);
  display: flex; align-items: center; gap: 6px;
}
.ph-chip-del {
  background: none; border: none; color: rgba(201,168,76,0.5);
  font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1;
}
.ph-chip-del:hover { color: var(--red); }
.ph-add-row { display: flex; gap: 6px; align-items: center; }
.ph-add-input {
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: 7px; padding: 6px 10px;
  color: var(--text); font-size: 14px; width: 80px;
}
.ph-add-input:focus { outline: none; border-color: var(--gold); }

/* ElevenLabs section */
.el-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.el-head {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.el-head-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.el-key-row { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.el-key-row input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px;
  font-family: monospace;
}
.el-key-row input:focus { outline: none; border-color: var(--purple); }
.el-audio-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.el-audio-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: var(--bg);
  border-radius: 8px; border: 1px solid var(--border);
}
.el-audio-label { flex: 1; font-size: 12px; color: var(--dim); }
.el-audio-text  { font-size: 13px; font-weight: 600; color: var(--text); font-family: monospace; }
.el-status { font-size: 11px; padding: 3px 8px; border-radius: var(--pill); white-space: nowrap; }
.el-status.missing { background: var(--red-d); color: var(--red); }
.el-status.ready   { background: var(--sage-d); color: var(--sage); }
.el-status.loading { background: var(--gold-d); color: var(--gold); }

/* GitHub push */
.gh-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.gh-head { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.gh-head-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.gh-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.gh-row { display: flex; gap: 8px; align-items: center; }
.gh-row label { font-size: 12px; color: var(--dim); width: 80px; flex-shrink: 0; }
.gh-row input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px;
  font-family: monospace;
}
.gh-row input:focus { outline: none; border-color: var(--sage); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e2330; border: 1px solid var(--border2);
  border-radius: var(--pill); padding: 10px 20px;
  font-size: 13px; font-weight: 500; color: var(--text);
  z-index: 999; opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Export modal */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 200;
  align-items: center; justify-content: center; padding: 24px;
}
.modal-bg.open { display: flex; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 14px; width: 100%; max-width: 680px;
  max-height: 80vh; display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head-title { font-size: 14px; font-weight: 700; }
.modal-body { flex: 1; overflow-y: auto; padding: 0; }
.modal-body pre {
  padding: 18px; font-size: 12px; font-family: monospace;
  color: #a8d8a8; white-space: pre-wrap; word-break: break-all;
}
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* Drag handle */
.deck-item-handle { color: var(--dim); cursor: grab; font-size: 14px; }

/* Status bar */
.status-bar {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px;
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: var(--dim);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
.status-dot.warn { background: var(--gold); }
.status-dot.err  { background: var(--red); }
</style>
</head>
<body>
<div class="shell">

  <!-- ══ SIDEBAR ══ -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">📚 Vocab Primer Builder</div>
      <div class="sidebar-sub">SkillsXLab</div>
    </div>

    <div class="sidebar-section">Cards <span id="card-count" style="color:var(--text);font-style:normal;">0</span></div>
    <div class="deck-list" id="deck-list"></div>

    <div class="sidebar-actions">
      <button class="btn-full" onclick="addCard('single')">＋ Add single card</button>
      <button class="btn-full" onclick="addCard('pair')">＋ Add opposite pair</button>
      <button class="btn-full primary" onclick="openExport()">⬇ Export DECK JSON</button>
      <button class="btn-full sage" onclick="pushToGitHub()">🚀 Push to GitHub</button>
    </div>
  </div>

  <!-- ══ MAIN ══ -->
  <div class="main">

    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-title">Card Editor</div>
      <div class="topbar-lesson">
        <input type="text" id="lesson-name" value="Objects Around Us" placeholder="Lesson name" oninput="markDirty()">
      </div>
      <button class="btn coral" onclick="generateAllAudio()">🎙 Generate all audio</button>
    </div>

    <!-- GitHub config -->
    <div class="gh-section" style="margin-bottom:20px;">
      <div class="gh-head"><span class="gh-head-title">GitHub & ElevenLabs</span></div>
      <div class="gh-body">
        <div class="gh-row">
          <label>EL API Key</label>
          <input type="password" id="el-key" placeholder="sk_... (rotated key)">
        </div>
        <div class="gh-row">
          <label>GitHub PAT</label>
          <input type="password" id="gh-pat" placeholder="github_pat_...">
        </div>
        <div class="gh-row">
          <label>Repo</label>
          <input type="text" id="gh-repo" value="redskin106/lesson-a">
        </div>
        <div class="gh-row">
          <label>Primer path</label>
          <input type="text" id="gh-path" value="vocab-primer/vocab-primer.html">
        </div>
      </div>
    </div>

    <!-- Editor area -->
    <div id="editor-area">
      <div class="editor-empty">
        <div class="editor-empty-icon">🃏</div>
        <div class="editor-empty-title">Select a card to edit</div>
        <div style="font-size:13px;color:var(--dim);margin-top:6px;">or add a new card using the sidebar</div>
      </div>
    </div>

  </div>
</div>

<!-- Export modal -->
<div class="modal-bg" id="export-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head-title">DECK JSON — paste into vocab-primer.html</span>
      <button class="btn sm" onclick="closeExport()">✕ Close</button>
    </div>
    <div class="modal-body"><pre id="export-pre"></pre></div>
    <div class="modal-foot">
      <button class="btn coral" onclick="copyExport()">📋 Copy to clipboard</button>
      <button class="btn" onclick="closeExport()">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let cards = [];
let activeIdx = null;
let dirty = false;
let audioBlobs = {}; // key → blob URL

// Seed with existing Objects lesson data
const SEED = [
  { type:'pair', tier:'silver', word1:'heavy', word2:'light', emoji1:'🎒', emoji2:'🪶',
    sentence1:'This bag is heavy.', sentence2:'A feather is light.',
    phonemes1:[{s:'h'},{s:'ɛ'},{s:'v'},{s:'i'}], phonemes2:[{s:'l'},{s:'aɪ'},{s:'t'}],
    video1Title:'Lifting a heavy box', video1Sub:'See what heavy feels like', video1Url:'',
    audio1Word:'', audio1Sentence:'', audio1Ph:[],
    audio2Word:'', audio2Sentence:'', audio2Ph:[] },
  { type:'pair', tier:'silver', word1:'big', word2:'small', emoji1:'📦', emoji2:'📎',
    sentence1:'The box is big.', sentence2:'A paper clip is small.',
    phonemes1:[{s:'b'},{s:'ɪ'},{s:'g'}], phonemes2:[{s:'s'},{s:'m'},{s:'ɔː'},{s:'l'}],
    audio1Word:'', audio1Sentence:'', audio1Ph:[],
    audio2Word:'', audio2Sentence:'', audio2Ph:[] },
  { type:'pair', tier:'silver', word1:'hard', word2:'soft', emoji1:'🧱', emoji2:'🧽',
    sentence1:'The brick is hard.', sentence2:'The sponge is soft.',
    phonemes1:[{s:'h'},{s:'ɑː'},{s:'d'}], phonemes2:[{s:'s'},{s:'ɒ'},{s:'f'},{s:'t'}],
    video2Title:'Squishing a sponge', video2Sub:'See what soft feels like', video2Url:'',
    audio1Word:'', audio1Sentence:'', audio1Ph:[],
    audio2Word:'', audio2Sentence:'', audio2Ph:[] },
  { type:'pair', tier:'gold', word1:'old', word2:'new', emoji1:'📰', emoji2:'✨',
    sentence1:'This newspaper is old.', sentence2:'My pen is new.',
    phonemes1:[{s:'əʊ'},{s:'l'},{s:'d'}], phonemes2:[{s:'n'},{s:'juː'}],
    audio1Word:'', audio1Sentence:'', audio1Ph:[],
    audio2Word:'', audio2Sentence:'', audio2Ph:[] },
  { type:'single', tier:'bronze', word:'bag', emoji:'🎒',
    sentence:'My bag is on the chair.', phonemes:[{s:'b'},{s:'æ'},{s:'g'}],
    audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'bronze', word:'ball', emoji:'⚽',
    sentence:'The ball is round.', phonemes:[{s:'b'},{s:'ɔː'},{s:'l'}],
    audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'bronze', word:'phone', emoji:'📱',
    sentence:'My phone is on the table.', phonemes:[{s:'f'},{s:'əʊ'},{s:'n'}],
    videoTitle:'Using a phone', videoSub:'', videoUrl:'',
    audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'bronze', word:'chair', emoji:'🪑',
    sentence:'The chair is next to the table.', phonemes:[{s:'tʃ'},{s:'ɛ'},{s:'r'}],
    audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'bronze', word:'book',   emoji:'📖', sentence:'I have a book in my bag.',
    phonemes:[{s:'b'},{s:'ʊ'},{s:'k'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'bronze', word:'cup',    emoji:'☕', sentence:'The cup is on the table.',
    phonemes:[{s:'k'},{s:'ʌ'},{s:'p'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'silver', word:'key',    emoji:'🔑', sentence:'The key is small and silver.',
    phonemes:[{s:'k'},{s:'iː'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'silver', word:'coin',   emoji:'🪙', sentence:'I have one coin in my pocket.',
    phonemes:[{s:'k'},{s:'ɔɪ'},{s:'n'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'silver', word:'bottle', emoji:'🍶', sentence:'My water bottle is empty.',
    phonemes:[{s:'b'},{s:'ɒ'},{s:'t'},{s:'l'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'gold', word:'table', emoji:'🪵', sentence:'Put your book on the table.',
    phonemes:[{s:'t'},{s:'eɪ'},{s:'b'},{s:'l'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'gold', word:'box',   emoji:'📦', sentence:'The box is big and heavy.',
    phonemes:[{s:'b'},{s:'ɒ'},{s:'k'},{s:'s'}], audioWord:'', audioSentence:'', audioPh:[] },
  { type:'single', tier:'gold', word:'pen',   emoji:'🖊️', sentence:'I write with my pen.',
    phonemes:[{s:'p'},{s:'ɛ'},{s:'n'}], audioWord:'', audioSentence:'', audioPh:[] },
];
cards = SEED.map(c => ({...c}));

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
function renderSidebar() {
  const list = document.getElementById('deck-list');
  document.getElementById('card-count').textContent = cards.length;
  list.innerHTML = '';
  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'deck-item' + (i === activeIdx ? ' active' : '');
    el.onclick = () => selectCard(i);
    const label = card.type === 'pair'
      ? `${card.word1} / ${card.word2}`
      : (card.word || 'Untitled');
    const icon = card.type === 'pair'
      ? (card.emoji1 || '⟺')
      : (card.emoji || '🃏');
    el.innerHTML = `
      <span class="deck-item-handle">⠿</span>
      <span class="deck-item-icon">${icon}</span>
      <span class="deck-item-word">${label}</span>
      <span class="deck-item-tier tier-${card.tier}">${card.tier[0].toUpperCase()}</span>
      <span class="deck-item-type">${card.type === 'pair' ? 'pair' : '1'}</span>`;
    list.appendChild(el);
  });
}

function selectCard(i) {
  activeIdx = i;
  renderSidebar();
  renderEditor();
}

function addCard(type) {
  const newCard = type === 'pair'
    ? { type:'pair', tier:'silver', word1:'', word2:'', emoji1:'', emoji2:'',
        sentence1:'', sentence2:'', phonemes1:[], phonemes2:[],
        audio1Word:'', audio1Sentence:'', audio1Ph:[],
        audio2Word:'', audio2Sentence:'', audio2Ph:[] }
    : { type:'single', tier:'bronze', word:'', emoji:'',
        sentence:'', phonemes:[], audioWord:'', audioSentence:'', audioPh:[] };
  cards.push(newCard);
  selectCard(cards.length - 1);
  markDirty();
}

function deleteCard(i) {
  if (!confirm('Delete this card?')) return;
  cards.splice(i, 1);
  activeIdx = Math.min(activeIdx, cards.length - 1);
  if (cards.length === 0) activeIdx = null;
  renderSidebar();
  renderEditor();
  markDirty();
}

═══════════════════════════════════════ */
function renderEditor() {
  const area = document.getElementById('editor-area');
  if (activeIdx === null || !cards[activeIdx]) {
    area.innerHTML = `<div class="editor-empty">
      <div class="editor-empty-icon">🃏</div>
      <div class="editor-empty-title">Select a card to edit</div>
      <div style="font-size:13px;color:var(--dim);margin-top:6px;">or add a new card using the sidebar</div>
    </div>`;
    return;
  }
  const card = cards[activeIdx];
  area.innerHTML = card.type === 'single' ? buildSingleEditor(card, activeIdx) : buildPairEditor(card, activeIdx);
  bindEditorEvents(card, activeIdx);
}

/* ── Image upload widget ── */
function buildImgUpload(field, currentUrl, cardIdx) {
  const id = `img-${field}-${cardIdx}`;
  const hasImg = currentUrl && currentUrl.length > 10;
  return `<div class="img-upload" id="upload-${id}">
    <input type="file" accept="image/*" data-imgfield="${field}" data-cardidx="${cardIdx}" onchange="handleImageUpload(this)">
    ${hasImg
      ? `<img class="img-upload-preview" src="${currentUrl}" style="display:block;" alt="">`
      : `<div class="img-upload-icon">🖼</div><div class="img-upload-label">Tap to upload</div>`
    }
  </div>`;
}

/* ── Phoneme editor ── */
function buildPhonemeEditor(field, phonemes, cardIdx) {
  const chips = (phonemes || []).map((ph, pi) =>
    `<div class="ph-chip">
      ${ph.s}
      <button class="ph-chip-del" onclick="removePhoneme('${field}',${pi},${cardIdx})">×</button>
    </div>`
  ).join('');
  return `<div class="phoneme-list" id="ph-list-${field}-${cardIdx}">
    ${chips}
    <div class="ph-add-row">
      <input class="ph-add-input" id="ph-input-${field}-${cardIdx}" placeholder="ɛ" title="IPA symbol" onkeydown="if(event.key==='Enter'){addPhoneme('${field}',${cardIdx});event.preventDefault();}">
      <button class="btn sm gold" onclick="addPhoneme('${field}',${cardIdx})">＋</button>
    </div>
  </div>`;
}

/* ── Audio section ── */
function buildAudioSection(card, i, type) {
  const rows = type === 'single'
    ? [
        { key:'audioWord',     label:'Word audio',     text: card.word,     field:'audioWord'     },
        { key:'audioSentence', label:'Sentence audio', text: card.sentence, field:'audioSentence' },
        ...(card.phonemes||[]).map((ph,pi) => ({
          key:`audioPh_${pi}`, label:`Phoneme "${ph.s}"`, text:ph.s, field:`audioPh[${pi}]`
        }))
      ]
    : [
        { key:'audio1Word',     label:'Word 1 audio',     text:card.word1,     field:'audio1Word'     },
        { key:'audio1Sentence', label:'Sentence 1 audio', text:card.sentence1, field:'audio1Sentence' },
        { key:'audio2Word',     label:'Word 2 audio',     text:card.word2,     field:'audio2Word'     },
        { key:'audio2Sentence', label:'Sentence 2 audio', text:card.sentence2, field:'audio2Sentence' },
        ...(card.phonemes1||[]).map((ph,pi) => ({
          key:`audio1Ph_${pi}`, label:`Ph1 "${ph.s}"`, text:ph.s, field:`audio1Ph[${pi}]`
        })),
        ...(card.phonemes2||[]).map((ph,pi) => ({
          key:`audio2Ph_${pi}`, label:`Ph2 "${ph.s}"`, text:ph.s, field:`audio2Ph[${pi}]`
        }))
      ];

  const rowsHtml = rows.map(r => {
    const hasAudio = audioBlobs[`${i}_${r.key}`];
    return `<div class="el-audio-row">
      <span class="el-audio-label">${r.label}</span>
      <span class="el-audio-text">${esc(r.text||'—')}</span>
      <span class="el-status ${hasAudio?'ready':'missing'}" id="el-status-${i}-${r.key}">
        ${hasAudio ? '✓ ready' : '○ missing'}
      </span>
      <button class="btn sm" onclick="generateOne(${i},'${r.key}','${esc(r.text||'')}')">🎙</button>
      ${hasAudio ? `<button class="btn sm sage" onclick="playBlob('${i}_${r.key}')">▶</button>` : ''}
    </div>`;
  }).join('');

  return `<div class="el-section">
    <div class="el-head">
      <span class="el-head-title">🎙 ElevenLabs Audio</span>
      <button class="btn sm coral" onclick="generateCardAudio(${i})">Generate all for this card</button>
    </div>
    <div class="el-audio-list">${rowsHtml}</div>
  </div>`;
}

/* ── Bind editor events ── */
function bindEditorEvents(card, i) {
  // Text / select fields
  document.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('input', () => {
      cards[i][el.dataset.field] = el.value;
      markDirty();
      renderSidebar();
    });
    el.addEventListener('change', () => {
      cards[i][el.dataset.field] = el.value;
      markDirty();
      renderSidebar();
    });
  });
}

/* ═══════════════════════════════════════
   IMAGE UPLOAD
═══════════════════════════════════════ */
function handleImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const field    = input.dataset.imgfield;
  const cardIdx  = parseInt(input.dataset.cardidx);
  const reader   = new FileReader();
  reader.onload  = e => {
    cards[cardIdx][field] = e.target.result;
    markDirty();
    // Update preview
    const wrapper = input.closest('.img-upload');
    wrapper.innerHTML = `<input type="file" accept="image/*" data-imgfield="${field}" data-cardidx="${cardIdx}" onchange="handleImageUpload(this)">
      <img class="img-upload-preview" src="${e.target.result}" style="display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;" alt="">`;
    wrapper.querySelector('input').addEventListener('change', function(){ handleImageUpload(this); });
  };
  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════
   PHONEMES
═══════════════════════════════════════ */
function addPhoneme(field, cardIdx) {
  const input = document.getElementById(`ph-input-${field}-${cardIdx}`);
  const sym = input.value.trim();
  if (!sym) return;
  if (!cards[cardIdx][field]) cards[cardIdx][field] = [];
  cards[cardIdx][field].push({ s: sym });
  input.value = '';
  markDirty();
  renderEditor();
}

function removePhoneme(field, pi, cardIdx) {
  cards[cardIdx][field].splice(pi, 1);
  markDirty();
  renderEditor();
}

/* ═══════════════════════════════════════
   ELEVENLABS AUDIO
═══════════════════════════════════════ */
async function elTTS(text, voiceId) {
  const key = document.getElementById('el-key').value.trim();
  if (!key) { toast('⚠️ Enter ElevenLabs API key first'); return null; }
  const vid = voiceId || 'EXAVITQu4vr4xnSDxMaL'; // Sarah — clear, warm
  const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vid}`, {
    method: 'POST',
    headers: { 'xi-api-key': key, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      model_id: 'eleven_flash_v2',
      voice_settings: { stability: 0.5, similarity_boost: 0.75, speed: 0.85 }
    })
  });
  if (!resp.ok) { toast('❌ ElevenLabs error: ' + resp.status); return null; }
  return await resp.blob();
}

async function generateOne(cardIdx, key, text) {
  if (!text || text === '—') { toast('No text to generate'); return; }
  updateElStatus(cardIdx, key, 'loading');
  const blob = await elTTS(text);
  if (!blob) { updateElStatus(cardIdx, key, 'missing'); return; }
  const blobKey = `${cardIdx}_${key}`;
  audioBlobs[blobKey] = URL.createObjectURL(blob);
  storeAudioOnCard(cardIdx, key, audioBlobs[blobKey]);
  updateElStatus(cardIdx, key, 'ready');
  toast(`✓ Audio ready: ${text}`);
}

async function generateCardAudio(cardIdx) {
  const card = cards[cardIdx];
  toast('🎙 Generating audio…');
  const jobs = card.type === 'single'
    ? [
        { key:'audioWord',     text: card.word     },
        { key:'audioSentence', text: card.sentence },
        ...(card.phonemes||[]).map((ph,pi) => ({ key:`audioPh_${pi}`, text:ph.s }))
      ]
    : [
        { key:'audio1Word',     text: card.word1     },
        { key:'audio1Sentence', text: card.sentence1 },
        { key:'audio2Word',     text: card.word2     },
        { key:'audio2Sentence', text: card.sentence2 },
        ...(card.phonemes1||[]).map((ph,pi) => ({ key:`audio1Ph_${pi}`, text:ph.s })),
        ...(card.phonemes2||[]).map((ph,pi) => ({ key:`audio2Ph_${pi}`, text:ph.s }))
      ];
  for (const job of jobs) {
    await generateOne(cardIdx, job.key, job.text);
    await sleep(300); // rate limit buffer
  }
  toast('✅ All audio generated for this card');
  renderEditor();
}

async function generateAllAudio() {
  toast('🎙 Generating all audio — this may take a moment…');
  for (let i = 0; i < cards.length; i++) {
    await generateCardAudio(i);
  }
  toast('✅ All audio complete');
}

function storeAudioOnCard(cardIdx, key, url) {
  // Store blob URL on card for export reference
  cards[cardIdx]['_audio_' + key] = url;
}

function updateElStatus(cardIdx, key, state) {
  const el = document.getElementById(`el-status-${cardIdx}-${key}`);
  if (!el) return;
  el.className = `el-status ${state}`;
  el.textContent = state === 'loading' ? '⏳ …' : state === 'ready' ? '✓ ready' : '○ missing';
}

function playBlob(blobKey) {
  const url = audioBlobs[blobKey];
  if (url) new Audio(url).play();
}

/* ═══════════════════════════════════════
   EXPORT
═══════════════════════════════════════ */
function buildDeckJSON() {
  const lessonName = document.getElementById('lesson-name').value;
  const exportCards = cards.map(card => {
    if (card.type === 'single') {
      const out = {
        type: 'single',
        tier: card.tier,
        word: card.word,
        emoji: card.emoji,
        sentence: card.sentence,
        phonemes: (card.phonemes || []).map((ph, pi) => ({
          s: ph.s,
          audio: audioBlobs[`${cards.indexOf(card)}_audioPh_${pi}`] || ''
        })),
        wordAudio:     audioBlobs[`${cards.indexOf(card)}_audioWord`]     || '',
        sentenceAudio: audioBlobs[`${cards.indexOf(card)}_audioSentence`] || '',
      };
      if (card.image)         out.image = card.image;
      if (card.illustration)  out.illustration = card.illustration;
      if (card.videoUrl)      out.video = { url: card.videoUrl, title: card.videoTitle||'', subtitle: card.videoSub||'' };
      return out;
    } else {
      const ci = cards.indexOf(card);
      const out = {
        type: 'pair',
        tier: card.tier,
        word1: card.word1, word2: card.word2,
        emoji1: card.emoji1, emoji2: card.emoji2,
        sentence1: card.sentence1, sentence2: card.sentence2,
        phonemes1: (card.phonemes1||[]).map((ph,pi) => ({ s:ph.s, audio: audioBlobs[`${ci}_audio1Ph_${pi}`]||'' })),
        phonemes2: (card.phonemes2||[]).map((ph,pi) => ({ s:ph.s, audio: audioBlobs[`${ci}_audio2Ph_${pi}`]||'' })),
        wordAudio1:     audioBlobs[`${ci}_audio1Word`]     || '',
        wordAudio2:     audioBlobs[`${ci}_audio2Word`]     || '',
        sentenceAudio1: audioBlobs[`${ci}_audio1Sentence`] || '',
        sentenceAudio2: audioBlobs[`${ci}_audio2Sentence`] || '',
      };
      if (card.image1)       out.image1 = card.image1;
      if (card.image2)       out.image2 = card.image2;
      if (card.illustration1) out.illustration1 = card.illustration1;
      if (card.illustration2) out.illustration2 = card.illustration2;
      if (card.video1Url)    out.video1 = { url:card.video1Url, title:card.video1Title||'', subtitle:card.video1Sub||'' };
      if (card.video2Url)    out.video2 = { url:card.video2Url, title:card.video2Title||'', subtitle:card.video2Sub||'' };
      return out;
    }
  });
  return { lessonName, cards: exportCards };
}

function openExport() {
  const deck = buildDeckJSON();
  const js = 'const DECK = ' + JSON.stringify(deck, null, 2) + ';';
  document.getElementById('export-pre').textContent = js;
  document.getElementById('export-modal').classList.add('open');
}
function closeExport() { document.getElementById('export-modal').classList.remove('open'); }
function copyExport() {

}

/* ═══════════════════════════════════════
   GITHUB PUSH
═══════════════════════════════════════ */
async function pushToGitHub() {
  const pat  = document.getElementById('gh-pat').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const path = document.getElementById('gh-path').value.trim();
  if (!pat || !repo || !path) { toast('⚠️ Fill in GitHub fields first'); return; }

  toast('⏳ Fetching current file…');

  // Get current SHA
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,
      { headers: { Authorization: `token ${pat}` } });
    if (r.ok) { const d = await r.json(); sha = d.sha; }
  } catch(e) {}

  // Fetch current primer HTML
  toast('⏳ Building updated primer…');
  let primerHTML = '';
  try {
    const r = await fetch(`https://raw.githubusercontent.com/${repo}/main/${path}`);
    primerHTML = await r.text();
  } catch(e) { toast('❌ Could not fetch primer HTML'); return; }

  // Replace the DECK object
  const deck   = buildDeckJSON();
  const newJS  = 'const DECK = ' + JSON.stringify(deck, null, 2) + ';';
  const updated = primerHTML.replace(/const DECK = \{[\s\S]*?\};(\s*\/\*|$)/, newJS + '\n');

  if (updated === primerHTML) { toast('⚠️ Could not locate DECK in primer — export manually'); return; }

  // Push
  // btoa fails on multibyte chars (e.g. emoji in dataURLs) — use TextEncoder
  const encoded = new TextEncoder().encode(updated);
  // Chunk to avoid call stack limit on large files
  let binary = '';
  const bytes = new Uint8Array(encoded);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  const content = btoa(binary);
  const payload = { message: 'Builder: update DECK data', content, ...(sha ? { sha } : {}) };

  toast('⏳ Pushing to GitHub…');
  const resp = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${pat}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (resp.ok) {
    dirty = false;
    toast('✅ Pushed! Live in ~30 seconds.');
  } else {
    const err = await resp.json();
    toast('❌ Push failed: ' + (err.message || resp.status));
  }
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function markDirty() { dirty = true; }
function sleep(ms)   { return new Promise(r => setTimeout(r, ms)); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ── Boot ── */
renderSidebar();
renderEditor();
</script>
