<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson Builder — Module Authoring (Mockup v2)</title>
<style>
  :root{
    --bg-0:#0B0714; --violet:#8B5CF6; --violet-dim:#5B3FA6;
    --glass:rgba(255,255,255,0.045); --glass-brd:rgba(255,255,255,0.09); --glass-brd-hi:rgba(139,92,246,0.55);
    --text-hi:#F3F1FA; --text-mid:rgba(243,241,250,0.62); --text-lo:rgba(243,241,250,0.34);
    --teal:#00BCD4; --green:#8BC34A; --orange:#FFB74D; --purple:#CE93D8; --pink:#F48FB1;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; color:var(--text-hi);
    background: radial-gradient(ellipse 900px 500px at 15% -5%, rgba(139,92,246,0.20), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 10%, rgba(91,63,166,0.16), transparent 55%), var(--bg-0);
    background-attachment:fixed; }
  .app{ display:grid; grid-template-columns:230px 1fr 320px; min-height:calc(100vh - 57px); }

  .top-nav{ display:flex; align-items:center; gap:26px; padding:14px 26px; border-bottom:1px solid var(--glass-brd); }
  .top-nav-brand{ font-size:13px; letter-spacing:.08em; color:var(--text-lo); text-transform:uppercase; margin-right:10px;}
  .top-nav-tabs{ display:flex; gap:4px;}
  .top-nav-tab{ font-size:13.5px; padding:8px 16px; border-radius:9px; color:var(--text-mid); cursor:pointer; display:flex; align-items:center; gap:8px;}
  .top-nav-tab:hover{ background:var(--glass); color:var(--text-hi);}
  .top-nav-tab.active{ background:var(--glass); color:var(--text-hi); border:1px solid var(--glass-brd-hi);}
  .nav-badge{ font-size:10.5px; background:rgba(244,143,177,0.2); color:var(--pink); padding:1px 7px; border-radius:999px; font-weight:700;}

  .ap-wrap{ max-width:920px; margin:0 auto; padding:26px 30px 60px;}
  .ap-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .ap-title{ font-size:20px; font-weight:700;}
  .ap-sub{ font-size:12.5px; color:var(--text-lo); margin-top:4px;}
  .ap-filter{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mid); margin:18px 0;}
  .ap-filter input{ accent-color:var(--violet);}
  .ap-row{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:14px; padding:14px 18px; margin-bottom:10px;}
  .ap-row-top{ display:flex; align-items:center; gap:14px;}
  .ap-icon{ width:34px; height:34px; border-radius:9px; background:rgba(139,92,246,0.14); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .ap-text{ flex:1; min-width:0;}
  .ap-text-main{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ap-meta{ font-size:11.5px; color:var(--text-lo); margin-top:2px; display:flex; gap:10px;}
  .ap-persona{ padding:1px 8px; border-radius:999px; background:rgba(255,255,255,0.06);}
  .ap-state{ font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600; flex-shrink:0;}
  .ap-state.never{ background:rgba(244,143,177,0.15); color:var(--pink);}
  .ap-state.draft{ background:rgba(255,183,77,0.15); color:var(--orange);}
  .ap-actions{ display:flex; gap:6px; flex-shrink:0;}
  .ap-usage-toggle{ font-size:11.5px; color:#C4B5FD; cursor:pointer; white-space:nowrap;}
  .ap-usages{ margin-top:12px; padding-top:12px; border-top:1px solid var(--glass-brd); display:none; flex-direction:column; gap:6px;}
  .ap-usages.open{ display:flex;}
  .ap-usage-item{ font-size:12px; color:var(--text-mid); display:flex; gap:8px; align-items:center;}
  .ap-usage-item .ub{ font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--text-lo);}
  .ap-bulk{ font-size:12.5px; padding:8px 16px; }

  .sidebar{ padding:22px 14px; border-right:1px solid var(--glass-brd); }
  .brand{ font-size:13px; letter-spacing:.08em; color:var(--text-lo); text-transform:uppercase; margin-bottom:22px; padding-left:6px;}
  .lesson-name{ font-size:15px; font-weight:600; margin-bottom:2px; padding-left:6px;}
  .lesson-sub{ font-size:12px; color:var(--text-lo); margin-bottom:12px; padding-left:6px;}
  .lesson-notes{ width:100%; min-height:52px; margin-bottom:18px; padding:8px 9px; font-size:11.5px; color:var(--text-mid); background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); border-radius:9px; resize:vertical; font-family:inherit; line-height:1.5;}
  .lesson-notes:focus{ outline:none; border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .lesson-notes::placeholder{ color:var(--text-lo);}
  .mod-progress{ display:flex; gap:2px; margin-left:auto; flex-shrink:0;}
  .mod-progress .dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.12);}
  .mod-progress .dot.filled{ background:var(--green);}
  .copy-tier-btn{ font-size:11.5px; padding:7px 12px; border-radius:9px; border:1px dashed var(--glass-brd); color:#C4B5FD; cursor:pointer; background:transparent;}
  .copy-tier-btn:hover{ border-style:solid; border-color:var(--glass-brd-hi);}
  .mod-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .mod-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px; font-size:13.5px; color:var(--text-mid); cursor:pointer; transition:.15s;}
  .mod-item:hover{ background:var(--glass); color:var(--text-hi);}
  .mod-item.active{ background:linear-gradient(90deg, rgba(139,92,246,0.22), rgba(139,92,246,0.05)); color:var(--text-hi); border:1px solid var(--glass-brd-hi);}
  .mod-num{ font-size:10.5px; color:var(--text-lo); width:16px; }
  .mod-item.active .mod-num{ color:var(--violet); }
  .mod-pool-tag{ margin-left:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(139,92,246,0.15); color:#C4B5FD;}
  .mod-stub-tag{ margin-left:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,0.06); color:var(--text-lo);}
  .vocab-item{ font-weight:500; }
  .vocab-issue-badge{ margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:rgba(245,158,11,0.18); color:#FBBF24; }
  .mod-item.active .vocab-issue-badge{ background:rgba(245,158,11,0.28); }
  .mod-list-divider{ height:1px; background:var(--glass-brd); margin:6px 4px; }
  .vocab-reminder-banner{ display:flex; align-items:center; gap:12px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.35); border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:13px; color:#FBBF24; }
  .vocab-reminder-banner b{ color:#FDE68A; }
  .vocab-reminder-banner button{ margin-left:auto; flex-shrink:0; }
  .vocab-tier-pool{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; min-height:32px; padding:10px; background:var(--glass); border-radius:10px; border:1px dashed var(--glass-brd); }
  .vocab-word-chip{ display:flex; align-items:center; gap:6px; background:rgba(139,92,246,0.16); border:1px solid rgba(139,92,246,0.4); color:#DDD6FE; padding:4px 10px; border-radius:999px; font-size:12.5px; }
  .vocab-word-chip .del{ cursor:pointer; opacity:0.6; }
  .vocab-word-chip .del:hover{ opacity:1; }
  .vocab-issue-row{ display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:8px; font-size:12.5px; margin-bottom:4px; }
  .vocab-issue-row.mismatch{ background:rgba(239,68,68,0.1); color:#FCA5A5; }
  .vocab-issue-row.warning{ background:rgba(245,158,11,0.1); color:#FCD34D; }
  .vocab-module-group{ margin-bottom:16px; }
  .vocab-module-title{ font-size:12px; font-weight:600; color:var(--text-mid); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em; }

  .main{ padding:22px 26px; overflow-y:auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .crumb{ font-size:12px; color:var(--text-lo);}
  .crumb b{ color:var(--text-mid); font-weight:500;}
  .actions{ display:flex; gap:8px; align-items:center;}
  .save-state{ font-size:11.5px; color:var(--text-lo); margin-right:6px;}
  .btn{ font-size:13px; padding:8px 15px; border-radius:9px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--text-hi); cursor:pointer; }
  .btn.primary{ background:linear-gradient(135deg, var(--violet), var(--violet-dim)); border:none; font-weight:600; box-shadow:0 4px 18px rgba(139,92,246,0.35);}

  .tier-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .tier-tabs{ display:flex; gap:6px; }
  .tier-tab{ padding:7px 16px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid); display:flex; align-items:center; gap:6px;}
  .tier-tab .dot{width:7px;height:7px;border-radius:50%;}
  .tier-tab.bronze .dot{background:#CD7F32;} .tier-tab.silver .dot{background:#C0C0C0;} .tier-tab.gold .dot{background:#FFD54F;}
  .tier-tab.active{ background:var(--glass); border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .compare-btn{ font-size:12px; padding:7px 14px; border-radius:9px; border:1px dashed var(--glass-brd); color:#C4B5FD; cursor:pointer; background:transparent;}
  .compare-btn.active{ background:rgba(139,92,246,0.14); border-style:solid; border-color:var(--glass-brd-hi);}

  .card{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:16px; padding:18px 20px; margin-bottom:16px; backdrop-filter:blur(14px); }
  .card-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-lo); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-mid); margin-bottom:6px;}
  .field input[type=text]{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:9px; padding:10px 12px; color:var(--text-hi); font-size:14px;}
  .field input:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .row-inline{ display:flex; gap:8px; align-items:center;}
  .speak-btn{ flex-shrink:0; width:34px; height:34px; border-radius:9px; border:1px solid var(--glass-brd); background:rgba(139,92,246,0.12); color:#C4B5FD; cursor:pointer; font-size:14px;}
  .audio-status{ font-size:11px; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;}
  .audio-status.ok{ background:rgba(139,195,74,0.15); color:var(--green);}
  .audio-status.needs{ background:rgba(255,183,77,0.15); color:var(--orange);}
  .options-list{ display:flex; flex-direction:column; gap:7px;}
  .opt-row{ display:flex; gap:8px; align-items:center;}
  .opt-row input{ flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:9px; padding:10px 12px; color:var(--text-hi); font-size:14px;}
  .opt-row input:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .opt-audio-icon{ flex-shrink:0; width:18px; text-align:center; font-size:12.5px; cursor:pointer;}
  .opt-audio-icon.needs{ color:var(--orange);}
  .opt-audio-icon.ok{ color:var(--text-lo); opacity:0.5;}
  .opt-audio-icon.overridden{ color:var(--violet); opacity:0.85;}
  .opt-audio-icon:hover{ opacity:1; transform:scale(1.1);}
  .opt-tag{ font-size:10px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--text-mid); border:1px solid var(--glass-brd); flex-shrink:0; cursor:pointer; white-space:nowrap; user-select:none;}
  .opt-tag:hover{ border-color:var(--glass-brd-hi); color:var(--text-hi);}
  .opt-tag.is-correct{ background:rgba(139,195,74,0.18); color:var(--green); border-color:var(--green);}
  .add-link{ font-size:12.5px; color:#C4B5FD; cursor:pointer; margin-top:2px; display:inline-block;}

  .token-editor{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .token-actions{ min-height:18px; margin-bottom:4px;}
  .token-action-link{ font-size:12px; color:#C4B5FD; cursor:pointer; }
  .token-action-link:hover{ text-decoration:underline; }
  .token-action-hint{ font-size:11.5px; color:var(--text-lo); }
  .chip{ padding:4px 11px; border-radius:999px; font-size:13px; font-weight:600; border:1.5px solid; cursor:pointer; user-select:none; transition:.1s;}
  .chip:hover{ filter:brightness(1.25);}
  .chip-selected{ box-shadow:0 0 0 2px var(--bg-0), 0 0 0 4px var(--violet); }
  .chip.subject{background:rgba(0,188,212,0.18); border-color:var(--teal); color:var(--teal);}
  .chip.verb{background:rgba(139,195,74,0.18); border-color:var(--green); color:var(--green);}
  .chip.object{background:rgba(255,152,0,0.18); border-color:#FF9800; color:var(--orange);}
  .chip.place{background:rgba(171,71,188,0.18); border-color:#AB47BC; color:var(--purple);}
  .chip.time{background:rgba(233,30,99,0.18); border-color:#E91E63; color:var(--pink);}
  .chip.connector{background:rgba(255,255,255,0.08); border-color:var(--text-lo); color:var(--text-mid);}
  .role-swatches{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .swatch-item{ display:flex; align-items:center; gap:6px;}
  .swatch-item span{ font-size:11.5px; color:var(--text-mid);}
  .swatch{ width:20px; height:20px; border-radius:50%; }
  .swatch.subject{background:var(--teal);} .swatch.verb{background:var(--green);} .swatch.object{background:var(--orange);}
  .swatch.place{background:var(--purple);} .swatch.time{background:var(--pink);} .swatch.none{background:var(--text-lo);}

  .pool-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .pool-count{ font-size:12px; color:#C4B5FD; background:rgba(139,92,246,0.14); padding:4px 10px; border-radius:999px;}
  .pool-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px;}
  .pool-item .emoji{ font-size:18px; width:26px; text-align:center; flex-shrink:0;}
  .pool-item .word{ font-weight:600; font-size:13.5px; flex:1;}
  .pool-item .meta{ font-size:11px; color:var(--text-lo); flex-shrink:0;}
  .pool-item input[type=text]{ flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--glass-brd); border-radius:8px; padding:7px 10px; color:var(--text-hi); font-size:13.5px;}
  .pool-item input[type=text]:focus{ outline:none; border-color:var(--glass-brd-hi); }
  .pool-item .del{ flex-shrink:0; color:var(--text-lo); cursor:pointer; font-size:13px;}
  .pool-item .emoji-btn{ flex-shrink:0; width:30px; height:30px; border-radius:8px; border:1px solid var(--glass-brd); background:rgba(255,255,255,0.03); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .pair-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px;}
  .pair-row .pair-arrow{ color:var(--text-lo); font-size:13px; flex-shrink:0;}
  .toggle-group{ display:flex; gap:8px;}
  .toggle-btn{ padding:9px 20px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid); background:rgba(255,255,255,0.02);}
  .toggle-btn.active.true{ background:rgba(139,195,74,0.16); color:var(--green); border-color:var(--green);}
  .toggle-btn.active.false{ background:rgba(244,143,177,0.16); color:var(--pink); border-color:var(--pink);}
  .reorder-row{ display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:6px;}
  .reorder-row .arrows{ display:flex; flex-direction:column; cursor:pointer; color:var(--text-lo); font-size:9px; line-height:1; flex-shrink:0;}
  .reorder-row .arrows span:hover{ color:var(--text-hi);}
  .reorder-row .step-num{ font-size:11px; color:var(--text-lo); width:16px; flex-shrink:0;}
  .shared-pool-note{ font-size:11.5px; color:var(--text-lo); margin-bottom:12px; line-height:1.5; background:rgba(139,92,246,0.06); border:1px solid var(--glass-brd); border-radius:9px; padding:9px 12px;}
  .mode-select{ display:flex; gap:8px; flex-wrap:wrap;}
  .mode-opt{ padding:8px 14px; border-radius:9px; font-size:12.5px; cursor:pointer; border:1px solid var(--glass-brd); color:var(--text-mid);}
  .mode-opt.active{ background:rgba(139,92,246,0.16); color:var(--text-hi); border-color:var(--glass-brd-hi);}
  .bs-item-row{ padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.025); border:1px solid var(--glass-brd); margin-bottom:7px; cursor:pointer;}
  .bs-item-row:hover{ border-color:var(--glass-brd-hi);}
  .bs-item-row.active{ border-color:var(--glass-brd-hi); background:rgba(139,92,246,0.06);}
  .bs-item-preview{ display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .bs-item-preview .chip{ cursor:default; font-size:12px; padding:3px 9px;}
  .bs-add-word-row{ display:flex; gap:8px; margin-top:10px;}

  .stub-card{ text-align:center; padding:50px 20px; color:var(--text-lo); font-size:13.5px; line-height:1.7;}
  .stub-card b{ color:var(--text-mid); display:block; font-size:15px; margin-bottom:8px;}

  /* compare view */
  .compare-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .compare-card{ border-radius:14px; padding:14px 16px; border:1px solid var(--glass-brd); background:rgba(255,255,255,0.03);}
  .compare-card.bronze{ border-top:3px solid #CD7F32;} .compare-card.silver{ border-top:3px solid #C0C0C0;} .compare-card.gold{ border-top:3px solid #FFD54F;}
  .compare-head{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-lo); margin-bottom:10px; display:flex; justify-content:space-between;}
  .compare-sentence{ font-size:14px; line-height:1.5; margin-bottom:10px;}
  .compare-blank{ color:var(--violet); font-weight:700;}
  .compare-opts{ font-size:12px; color:var(--text-mid); display:flex; flex-wrap:wrap; gap:5px;}
  .compare-opts span{ background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:999px;}
  .compare-opts span.ans{ color:var(--green); border:1px solid var(--green); background:rgba(139,195,74,0.12);}
  .compare-word-list{ display:flex; flex-direction:column; gap:6px;}
  .compare-word{ font-size:13px; display:flex; gap:8px; align-items:center;}
  .compare-edit-link{ font-size:11px; color:#C4B5FD; margin-top:12px; cursor:pointer; display:inline-block;}

  .preview-col{ padding:22px 18px; border-left:1px solid var(--glass-brd); }
  .preview-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-lo); margin-bottom:12px;}
  .phone{ border-radius:26px; border:1px solid var(--glass-brd); background:linear-gradient(160deg, #1a1030, #0c0818); padding:18px 16px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .phone-tier{ font-size:10px; color:#FFD54F; text-align:center; margin-bottom:10px; letter-spacing:.08em;}
  .phone-q{ font-size:15px; text-align:center; line-height:1.5; margin-bottom:16px; color:var(--text-hi);}
  .phone-blank{ color:var(--violet); font-weight:700; border-bottom:2px solid var(--violet);}
  .phone-opts{ display:flex; flex-direction:column; gap:8px;}
  .phone-opt{ padding:10px; border-radius:11px; background:rgba(255,255,255,0.04); border:1px solid var(--glass-brd); text-align:center; font-size:13px;}
  .phone-opt.correct{ border-color:var(--green); color:var(--green); background:rgba(139,195,74,0.1);}
  .phone-stars{ text-align:center; margin-top:16px; font-size:18px; letter-spacing:4px; color:var(--text-lo);}
  .live-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--green); margin-top:14px;}
  .live-dot{ width:6px;height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}
  .preview-note{ font-size:11.5px; color:var(--text-lo); margin-top:14px; line-height:1.5;}

  /* ---- Dashboard ---- */
  .dash-wrap{ max-width:980px; margin:0 auto; padding:30px 30px 60px;}
  .dash-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .dash-title{ font-size:22px; font-weight:700;}
  .dash-sub{ font-size:12.5px; color:var(--text-lo); margin-top:4px;}

// ==========================================================================
// MULTI-INSTANCE SUPPORT — the real shell allows several modules of the same
// type in one lesson (e.g. three separate "Listen & Choose" instances). The
// builder now allows that too: a lesson.modules entry is either a bare type
// slug ('gapfill', for the first/only instance of that type — preserves every
// existing lesson unchanged) or a suffixed instance id ('gapfill-2', 'gapfill-3'
// for repeats). instanceType() resolves either form back to the type slug that
// every type-dispatch switch/if-chain in this file already keys off of; the
// bare instance id itself keeps working everywhere as the LESSON_CONTENT
// storage key, since that was already just a string key with no assumption
// baked in beyond "one per lesson".
// ==========================================================================
function instanceType(id){
  return id.replace(/-\d+$/, '');
}
function instanceLabel(id){
  const type = instanceType(id);
  const catalogName = (MODULES.find(m => m.id === type) || {}).name || type;
  const suffixMatch = id.match(/-(\d+)$/);
  return suffixMatch ? `${catalogName} #${suffixMatch[1]}` : catalogName;
}
function nextInstanceId(existingIds, type){
  // First instance of a type keeps the bare slug (backward compatible with
  // every lesson authored before multi-instance existed). Repeats get -2, -3...
  if(!existingIds.includes(type)) return type;
  let n = 2;
  while(existingIds.includes(`${type}-${n}`)) n++;
  return `${type}-${n}`;
}

  const blankItem = () => ({ sentence:'', answer:'', options:['',''], tokens:[] });

    gold:   { pick:1, items:[blankItem(true, true)] },

function ensureLessonContent(lessonId){
  if(LESSON_CONTENT[lessonId]) return;
  const lesson = LESSONS.find(l => l.id === lessonId);
  let content = {};
  if(lessonId === 'food-court'){
    content.gapfill = FOOD_COURT_GAPFILL;
    content.spelling = FOOD_COURT_SPELLING;
  } else if(lessonId === 'colors' && lesson){
    content = seedColorsContent(lesson);
  } else if(lessonId === 'describing-people-things'){
    content = seedDescribingContent();
  }
  // Any module in this lesson's list that wasn't explicitly seeded above still needs SOME data,
  // or opening that module's screen crashes trying to read undefined. Fill the gaps with blanks —
  // keyed by real instance id, using the resolved type to pick the right blank shape.
  if(lesson){
    lesson.modules.forEach(m => {
      const t = instanceType(m);
      if(content[m] === undefined && BLANK_DATA_BY_MODULE[t]) content[m] = BLANK_DATA_BY_MODULE[t]();
    });
  }
  LESSON_CONTENT[lessonId] = content;
}

// ══════════════════════════════════════════════════
//  VOCABULARY CONSISTENCY CHECKER
//  Keeps the digital shell's vocabulary in sync with the classroom lesson —
//  every module's core content word must match the lesson's declared target
//  vocabulary for that tier (hard mismatch if not); supporting/distractor
//  words are checked against the real Cambridge word list for the tier's
//  CEFR level instead, since those are allowed to vary (soft warning only).
// ══════════════════════════════════════════════════

// Pulls the "core content word(s)" out of one pool item, per module type.
// Word-based modules return a single word to check exactly. Sentence-based
// modules (no single clean content-word field) return { sentenceText } —
// checked more loosely: passes if ANY target word appears anywhere in it.
function extractContentWords(moduleId, item){
  const type = instanceType(moduleId);
  switch(type){
    case 'gapfill':        return { words: [item.answer] };
    case 'listenchoose':   return { words: [item.answer] };
    case 'wordmatch':      return { words: [item.left, item.right] };
    case 'listenmatch':    return { words: [item.left] }; // left===right always
    case 'memorypairs':    return { words: [item.word] };
    case 'picword':        return { words: [item.word] };
    case 'wordscramble':   return { words: [item.word] };
    case 'spelling':       return { words: [item.word] };
    case 'truefalse':      return { sentenceText: item.statement };
    case 'sayit':          return { sentenceText: `${item.prompt} ${item.target}` };
    case 'putinorder':     return { sentenceText: `${item.prompt} ${(item.items||[]).join(' ')}` };
    case 'buildsentence':  return { sentenceText: (item.tokens||[]).map(t=>t.text).join(' ') };
    default:                return { words: [] };
  }
}

function normalizeWord(w){
  return (w||'').toString().toLowerCase().replace(/[^a-z' -]/g,'').trim();
}

// Checks one tier of one module against the lesson's declared target
// vocabulary + the Cambridge list for that tier's CEFR level. Returns
// { mismatches: [...], warnings: [...] } — mismatches are real problems
// (a content word isn't in the declared list), warnings are informational
// (a supporting word isn't on the Cambridge list for this level, allowed
// but worth knowing).
function checkVocabularyForModuleTier(lesson, moduleId, tier, data){
  const target = (lesson.targetVocabulary && lesson.targetVocabulary[tier]) || [];
  const targetSet = new Set(target.map(normalizeWord));
  const cambridgeLevel = CAMBRIDGE_LEVEL_FOR_TIER[tier];
  const levelOrder = { preA1:0, a1:1, a2:2 };
  const maxLevel = levelOrder[cambridgeLevel];

  const mismatches = [];
  const warnings = [];
  const items = (data && data[tier] && data[tier].items) || [];

  items.forEach((item, i) => {
    const extracted = extractContentWords(moduleId, item);

    if(extracted.sentenceText !== undefined){
      // Sentence-based module — soft check only: does ANY target word appear
      // somewhere in the text? No target list yet = nothing to check against.
      if(target.length === 0) return;
      const text = normalizeWord(extracted.sentenceText.toLowerCase());
      const hasAnyTarget = target.some(w => text.includes(normalizeWord(w)));
      if(!hasAnyTarget){
        mismatches.push({ itemIndex:i, message:`Item ${i+1}: no target vocabulary word found in this content` });
      }
      return;
    }

    (extracted.words || []).forEach(rawWord => {
      if(!rawWord) return;
      const word = normalizeWord(rawWord);
      if(!word) return;
      if(target.length > 0 && !targetSet.has(word)){
        // Hard mismatch — this IS a content word, and it's not on the declared list
        mismatches.push({ itemIndex:i, word: rawWord, message:`Item ${i+1}: "${rawWord}" isn't in the declared ${tier} vocabulary` });
      } else if(target.length === 0){
        // No target list declared yet — fall back to a pure Cambridge-level check
        const wordLevel = CAMBRIDGE_WORDLIST[word];
        if(wordLevel === undefined){
          warnings.push({ itemIndex:i, word: rawWord, message:`Item ${i+1}: "${rawWord}" isn't on the Cambridge word list at all` });
        } else if(levelOrder[wordLevel] > maxLevel){
          warnings.push({ itemIndex:i, word: rawWord, message:`Item ${i+1}: "${rawWord}" is Cambridge ${wordLevel}, above ${tier}'s ${cambridgeLevel} level` });
        }
      }
    });
  });

  return { mismatches, warnings };
}

// Checks a supporting (non-content) word against the Cambridge list for a
// tier's CEFR level — used for distractor options, connector words, etc.
// that are allowed to differ from the target list as long as they're at
// the right level.
function checkSupportingWord(word, tier){
  const norm = normalizeWord(word);
  if(!norm) return null;
  const cambridgeLevel = CAMBRIDGE_LEVEL_FOR_TIER[tier];
  const levelOrder = { preA1:0, a1:1, a2:2 };
  const wordLevel = CAMBRIDGE_WORDLIST[norm];
  if(wordLevel === undefined) return { word, issue:'not-on-list' };
  if(levelOrder[wordLevel] > levelOrder[cambridgeLevel]) return { word, issue:'above-level', actualLevel: wordLevel };
  return null;
}

// Full lesson-level audit — every module, every tier. Used to power the
// summary badge and the reminder banner for lessons with no declared
// vocabulary yet.
function auditLessonVocabulary(lessonId){
  const lesson = LESSONS.find(l => l.id === lessonId);
  if(!lesson) return null;
  ensureLessonContent(lessonId);
  const content = LESSON_CONTENT[lessonId];

  const hasAnyTargetVocab = lesson.targetVocabulary &&
    (lesson.targetVocabulary.bronze.length || lesson.targetVocabulary.silver.length || lesson.targetVocabulary.gold.length);

  const results = {};
  let totalMismatches = 0, totalWarnings = 0;

  lesson.modules.forEach(moduleId => {
    const data = content[moduleId];
    if(!data) return;
    results[moduleId] = {};
    TIER_ORDER.forEach(tier => {
      const r = checkVocabularyForModuleTier(lesson, moduleId, tier, data);
      results[moduleId][tier] = r;
      totalMismatches += r.mismatches.length;
      totalWarnings += r.warnings.length;
    });
  });

  return { hasAnyTargetVocab, results, totalMismatches, totalWarnings };
}

function isTierFilled(moduleId, tier, dataOverride){
  const data = dataOverride !== undefined ? dataOverride : md(moduleId);
  if(!data) return false;
  const type = instanceType(moduleId);
  try{
    switch(type){
      case 'gapfill': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.sentence && it.answer && it.options.some(o=>o)); }
      case 'truefalse': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.statement); }
      case 'listenchoose': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.question && it.answer); }
      case 'sayit': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.target); }
      case 'putinorder': { const d=data[tier]; return d.items.length>=1 && d.items.every(it=>it.items.length>=2 && it.items.every(w=>w) && !!it.prompt); }
      case 'wordmatch': case 'listenmatch':
        return data[tier].items.length>=1 && data[tier].items.every(p=>p.left && p.right);
      case 'spelling': case 'wordscramble':
        return data[tier].items.length>=1 && data[tier].items.every(it=>it.word);
      case 'buildsentence':
        return data[tier].items.length>=1 && data[tier].items.every(it=>it.tokens.length>=1);
      case 'memorypairs':
        return data[tier].items.length>=2 && data[tier].items.every(it=>it.word);
      case 'picword':
        return data[tier].items.length>=1 && data[tier].items.every(it=>it.word && it.cloze);
      case 'pyramid': {
        const d = data[tier];
        if(!d.items.length) return false;
        return d.items.every(it => {
          if(!it.l1 || !it.l1.answer || !it.l1.options || it.l1.options.length < 2) return false;
          if(tier === 'bronze') return true;
          if(!it.l2 || it.l2.length < 1 || !it.l2.every(g => g.label && g.answer && g.options && g.options.length >= 2)) return false;
          if(tier === 'silver') return true;
          return !!it.l3 && !!it.l3.because_mode; // l3.tiles can be empty — free-type alone is valid
        });
      }
      case 'imagefeeling': {
        const d = data[tier];
        if(!d.items.length) return false;
        return d.items.every(it => {
          if(!it.stimulusValue || !it.stimulusLabel) return false;
          if(!it.tiles || it.tiles.length < 2) return false; // no wrong answer, but needs real choice
          if(tier !== 'gold') return true;
          return !!it.because_mode;
        });
      }
      case 'creativereflection': {
        const d = data[tier];
        if(!d.items.length) return false;
        return d.items.every(it => {
          if(!it.template || !it.template.trim()) return false;
          const blankMatches = it.template.match(/\{\d+\}/g);
          if(!blankMatches || blankMatches.length === 0) return false; // must have at least one real blank
          return true;
        });
      }
      default: return false;
    }
  }catch(e){ return false; }
}

function renderSidebar(){

  const lesson = LESSONS.find(l => l.id === currentLessonId);
  const audit = lesson ? auditLessonVocabulary(currentLessonId) : null;
  const vocabIssueCount = audit ? audit.totalMismatches + audit.totalWarnings : 0;

  const vocabItem = `
    <li class="mod-item vocab-item ${currentModule==='__vocabulary__'?'active':''}" onclick="selectVocabulary()">
      <span class="mod-num">📖</span> Target Vocabulary
      ${vocabIssueCount > 0 ? `<span class="vocab-issue-badge">${vocabIssueCount}</span>` : ''}
    </li>
    <li class="mod-item vocab-item ${currentModule==='__visuals__'?'active':''}" onclick="selectVisuals()">
      <span class="mod-num">🖼️</span> Visuals
    </li>
    <li class="mod-list-divider"></li>`;

  // Preserve the order the teacher actually chose in the New Lesson wizard (lesson.modules),
  // not MODULES' fixed catalog order — reordering there was supposed to mean something.
  // Each entry is an instance id (bare type slug for the first of a type, 'type-2' etc for
  // repeats) — keep the real id for selection/storage, resolve display name via instanceLabel.
  const included = lesson
    ? lesson.modules.map(id => ({ id, name: instanceLabel(id) }))
    : MODULES.map(m => ({ id: m.id, name: m.name }));
  list.innerHTML = vocabItem + included.map((m,i)=>{
    const dots = ['bronze','silver','gold'].map(t=>`<span class="dot ${isTierFilled(m.id,t)?'filled':''}" title="${t}"></span>`).join('');
    const modIssues = audit && audit.results[m.id]
      ? TIER_ORDER.reduce((sum,t) => sum + audit.results[m.id][t].mismatches.length + audit.results[m.id][t].warnings.length, 0)
      : 0;
    return `
    <li class="mod-item ${m.id===currentModule?'active':''}" onclick="selectModule('${m.id}')">
      <span class="mod-num">${String(i+1).padStart(2,'0')}</span> ${m.name}
      ${modIssues > 0 ? `<span class="vocab-issue-badge" title="${modIssues} vocabulary issue${modIssues===1?'':'s'}">${modIssues}</span>` : ''}
      <span class="mod-progress">${dots}</span>
    </li>`;
  }).join('');
}

      const label = instanceLabel(moduleId);
      const rows = [
        ...r.mismatches.map(m => `<div class="vocab-issue-row mismatch">⚠ ${m.message}</div>`),
        ...r.warnings.map(w => `<div class="vocab-issue-row warning">ⓘ ${w.message}</div>`),
      ].join('');
      issuesHtml += `<div class="vocab-module-group"><div class="vocab-module-title">${label}</div>${rows}</div>`;
    });

  if(!issuesHtml){

        <button class="btn" onclick="addVocabWord()">+ Add</button>

      <div class="card-label">Vocabulary check — ${currentTier} <span style="font-weight:400;text-transform:none;letter-spacing:0;">red = content word doesn't match the declared list · yellow = supporting word worth a look</span></div>
      ${issuesHtml}
    </div>`;

  const input = document.getElementById('vocabWordInput');
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addVocabWord(); } });

function addVocabWord(){
  const lesson = LESSONS.find(l => l.id === currentLessonId);

function renderPyramidForm(moduleId){
  const editView = document.getElementById('editView');
  const tierData = md(moduleId)[currentTier];
  const items = tierData.items;
  if(dpExpandedIndex >= items.length) dpExpandedIndex = Math.max(0, items.length - 1);
  const it = items[dpExpandedIndex];
  const showL2 = currentTier !== 'bronze';
  const showL3 = currentTier === 'gold';

  function optionsRow(labelText, options, answer, onOptionsInput, onAnswerChange){
    const optId = `dp-opts-${Math.random().toString(36).slice(2,8)}`;
    return `
      <div class="field" style="margin-top:10px;">
        <label style="font-size:12px;color:var(--text-lo);">${labelText} — comma-separated options</label>
        <input type="text" value="${(options||[]).join(', ')}" onchange="${onOptionsInput}" style="margin-top:4px;">
        <div class="hint" style="font-size:11px;color:var(--text-lo);margin-top:2px;">Press Tab or click away to update the answer list below.</div>
      </div>
      <div class="field" style="margin-top:8px;">
        <label style="font-size:12px;color:var(--text-lo);">Correct answer</label>
        <select style="margin-top:4px;" onchange="${onAnswerChange}">
          <option value="">— pick —</option>
          ${(options||[]).filter(o=>o).map(o=>`<option value="${o}" ${o===answer?'selected':''}>${o}</option>`).join('')}
        </select>

function renderCreativeReflectionItemEditor(moduleId, item, i){
  const blankMatches = (item.template || '').match(/\{(\d+)\}/g) || [];
  const blankIndices = [...new Set(blankMatches.map(m => parseInt(m.slice(1,-1))))].sort((a,b)=>a-b);
  const hintsText = (item.blankHints || []).join(', ');

  // Live preview — actually renders the template with hint placeholders,
  // the same way the shell will, so a mismatched {N} count or a typo shows
  // up immediately instead of surfacing as a broken card for a student.
  let previewHtml = (item.template || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  blankIndices.forEach(idx => {
    const hint = (item.blankHints && item.blankHints[idx]) || '?';
    previewHtml = previewHtml.split(`{${idx}}`).join(`<span style="color:#4FC3F7;font-weight:700;border-bottom:2px solid #4FC3F7;">${hint}</span>`);
  });
  const hintCountMismatch = item.blankHints && blankIndices.length !== item.blankHints.filter(h=>h).length;

  return `
    <div class="pool-header">
      <div class="card-label" style="margin-bottom:0;">Item ${i+1}</div>
      ${crcPoolLength(moduleId)>1 ? `<span class="del" onclick="crcRemoveItem('${moduleId}',${i})">✕ remove</span>` : ''}
    </div>

    <div class="field" style="margin-top:10px;">
      <label style="font-size:12px;color:var(--text-lo);">Template — use {0}, {1}, {2}... for each blank</label>
      <input type="text" value="${(item.template||'').replace(/"/g,'&quot;')}" placeholder="It is a {0}, {1}, {2}." oninput="crcSetTemplate('${moduleId}',${i},this.value)" style="margin-top:4px;">
    </div>
    <div class="field" style="margin-top:10px;">
      <label style="font-size:12px;color:var(--text-lo);">Blank hints — comma-separated, one per blank, in order</label>
      <input type="text" value="${hintsText}" placeholder="size, shape, colour" oninput="crcSetHints('${moduleId}',${i},this.value)" style="margin-top:4px;">
      ${hintCountMismatch ? `<div class="hint" style="color:#FBBF24;font-size:11px;margin-top:3px;">⚠ ${blankIndices.length} blank${blankIndices.length===1?'':'s'} in the template, but ${item.blankHints.filter(h=>h).length} hint${item.blankHints.filter(h=>h).length===1?'':'s'} given — check they match.</div>` : ''}
    </div>

    <div class="field" style="margin-top:14px;">
      <label style="font-size:12px;color:var(--text-lo);">Live preview</label>
      <div id="crc-preview-${i}" style="margin-top:6px;padding:10px 14px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:10px;font-size:14px;line-height:1.8;">
        ${previewHtml || '<span style="color:var(--text-lo);">— type a template above —</span>'}
      </div>
    </div>
  `;
}

function crcRenderPreview(item){
  const blankMatches = (item.template || '').match(/\{(\d+)\}/g) || [];
  const blankIndices = [...new Set(blankMatches.map(m => parseInt(m.slice(1,-1))))].sort((a,b)=>a-b);
  let previewHtml = (item.template || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  blankIndices.forEach(idx => {
    const hint = (item.blankHints && item.blankHints[idx]) || '?';
    previewHtml = previewHtml.split(`{${idx}}`).join(`<span style="color:#4FC3F7;font-weight:700;border-bottom:2px solid #4FC3F7;">${hint}</span>`);
  });
  return previewHtml || '<span style="color:var(--text-lo);">— type a template above —</span>';
}

  md('putinorder')[currentTier].items[pioExpandedIndex].items[i] = val;

function pioAdd(){
  md('putinorder')[currentTier].items[pioExpandedIndex].items.push('');

function pioRemove(i){ md('putinorder')[currentTier].items[pioExpandedIndex].items.splice(i,1); renderMain(); }
function pioMove(i,dir){
  const items = md('putinorder')[currentTier].items[pioExpandedIndex].items;

function spSetMode(moduleId, mode){

}
function spItemUpdate(moduleId, i, field, val){

    syncSpeakableField(moduleId, 'word', i, val, document.getElementById('spIcon'+i), null, currentTier);

function spItemAdd(moduleId){

      ? { word: entry.word, emoji: entry.emoji, image:null, sentence: entry.sentence, tokens:[] }

function spItemRemove(moduleId, i){
  md(moduleId)[currentTier].items.splice(i,1);

}

// ---- Build a Sentence: pool of items, each item built word-by-word as taggable chips ----
let bsActiveItemIndex = null;
function renderBuildSentenceForm(){
  const editView = document.getElementById('editView');
  const tierData = md('buildsentence')[currentTier];
  const items = tierData.items;
  if(bsActiveItemIndex !== null && bsActiveItemIndex >= items.length) bsActiveItemIndex = null;

  editView.innerHTML = `
    <div class="card">
      <div class="pool-header">
        <div class="card-label" style="margin-bottom:0;">${currentTier} — sentence pool</div>
        <div class="pool-count">${items.length} sentences</div>
      </div>
      <div class="field" style="margin-top:8px;">
        <label style="font-size:12px;color:var(--text-lo);">Sentences drawn this session (pick)</label>
        <input type="number" min="1" max="${Math.max(1,items.length)}" value="${tierData.pick}"
          style="width:80px;margin-top:4px;" oninput="bsSetPick(this.value)">
      </div>
      <div id="bsList">
        ${items.map((it,i)=>`
          <div class="bs-item-row ${bsActiveItemIndex===i?'active':''}" onclick="bsSelectItem(${i})">
            <div class="bs-item-preview">${it.tokens.length ? it.tokens.map(t=>`<div class="chip ${t.role||'connector'}">${t.text}</div>`).join('') : '<span style="color:var(--text-lo);font-size:12.5px;">Empty — click to build</span>'}</div>
          </div>`).join('') || ''}
      </div>
      <div class="add-link" onclick="bsAddItem()">+ add sentence</div>
    </div>
    ${bsActiveItemIndex !== null ? `
    <div class="card">
      <div class="card-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Building sentence ${bsActiveItemIndex+1}</span>
        <span style="display:flex;align-items:center;gap:10px;font-weight:400;text-transform:none;letter-spacing:0;">
          <span class="audio-status" id="bsAudioStatus" onclick="bsOpenAudioModal()" style="cursor:pointer;"></span>
          <span class="del" onclick="bsRemoveItem(${bsActiveItemIndex})">remove this sentence</span>
        </span>
      </div>
      <div class="field">
        <label>Fast path <span style="color:var(--text-lo);">paste a whole sentence — replaces this sentence's chips, ready to tag</span></label>
        <div class="row-inline">
          <input type="text" id="bsFullSentenceInput" placeholder="e.g. The sky is blue today">
          <button class="btn" onclick="bsSplitFullSentence()">Split into words</button>
        </div>
      </div>
      <div class="bs-add-word-row">
        <input type="text" id="bsWordInput" placeholder="…or add one word at a time, press Enter to add">
        <button class="btn primary" onclick="bsAddWord()">+ Add word</button>
      </div>
      <div class="token-editor" id="tokenEditor" style="margin-top:14px;"></div>
      <div class="token-actions" id="tokenActions"></div>
      ${roleSwatchesHtml()}
    </div>` : ''}`;

  if(bsActiveItemIndex !== null){
    const scope = currentLessonId+'::buildsentence::'+currentTier+'::item'+bsActiveItemIndex;
    LIVE_TOKENS[scope] = items[bsActiveItemIndex].tokens.map(t=>({text:t.text, role:t.role, chunkId:t.chunkId ?? newChunkId()}));
    onTokenEditorChange = () => {
      items[bsActiveItemIndex].tokens = getChunks(scope).flatMap(c => c.words.map((w,wi)=>({text:w, role:c.role, chunkId:c.chunkId})));
      bsSyncAudio();
    };
    renderTokenEditor(scope);
    bsSyncAudio();
    const input = document.getElementById('bsWordInput');
    if(input){
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); bsAddWord(); } });
    }
  }
}
function bsSetPick(val){
  const n = Math.max(1, parseInt(val)||1);
  md('buildsentence')[currentTier].pick = n;
  renderPreview();
}
function bsAssembledText(i){
  const items = md('buildsentence')[currentTier].items;
  return items[i] ? items[i].tokens.map(t=>t.text).join(' ') : '';
}
function bsSyncAudio(){
  if(bsActiveItemIndex === null) return;
  const statusEl = document.getElementById('bsAudioStatus');
  if(!statusEl) return;
  const text = bsAssembledText(bsActiveItemIndex);
  const needs = syncSpeakableField('buildsentence', 'sentence', bsActiveItemIndex, text, statusEl, null, currentTier);
  setAudioStatusBadge(statusEl, needs);
}
function bsOpenAudioModal(){
  if(bsActiveItemIndex === null) return;
  openFieldAudioModal('buildsentence', 'sentence', bsActiveItemIndex, bsAssembledText(bsActiveItemIndex), currentTier);
}
function bsSelectItem(i){ bsActiveItemIndex = i; selectedChunkIds = new Set(); renderMain(); }
function bsAddItem(){
  md('buildsentence')[currentTier].items.push({ tokens: [] });
  bsActiveItemIndex = md('buildsentence')[currentTier].items.length - 1;
  renderMain();
}
function bsRemoveItem(i){
  md('buildsentence')[currentTier].items.splice(i,1);
  bsActiveItemIndex = null;
  renderMain();
}
function bsAddWord(){
  const input = document.getElementById('bsWordInput');
  const word = input.value.trim();
  if(!word) return;
  const scope = currentLessonId+'::buildsentence::'+currentTier+'::item'+bsActiveItemIndex;
  LIVE_TOKENS[scope] = LIVE_TOKENS[scope] || [];
  LIVE_TOKENS[scope].push({ text: word, role: null, chunkId: newChunkId() });
  md('buildsentence')[currentTier].items[bsActiveItemIndex].tokens = getChunks(scope).flatMap(c => c.words.map(w=>({text:w, role:c.role, chunkId:c.chunkId})));
  input.value = '';
  renderTokenEditor(scope);
  bsSyncAudio();
  input.focus();
}
function bsSplitFullSentence(){
  const input = document.getElementById('bsFullSentenceInput');
  const text = input.value.trim();
  if(!text) return;
  const scope = currentLessonId+'::buildsentence::'+currentTier+'::item'+bsActiveItemIndex;
  const words = text.split(/\s+/).filter(Boolean);
  LIVE_TOKENS[scope] = words.map(w => ({ text: w, role: null, chunkId: newChunkId() }));
  md('buildsentence')[currentTier].items[bsActiveItemIndex].tokens = words.map(w => ({ text: w, role: null, chunkId: null }));
  input.value = '';
  renderMain(); // rebuild pool preview + tagger with the new chips
}

        <div class="compare-word-list">${d.items.map(it=>`<div class="compare-word">${it.statement || '<span style="color:var(--text-lo);">empty</span>'} <em style="color:var(--text-lo);">(${it.answer?'True':'False'})</em></div>`).join('') || '<div class="compare-word" style="color:var(--text-lo);">empty pool</div>'}</div>

        <div class="compare-word-list">${d.items.map(it=>`<div class="compare-word">🔊 ${it.question || '<span style="color:var(--text-lo);">empty</span>'}</div>`).join('') || '<div class="compare-word" style="color:var(--text-lo);">empty pool</div>'}</div>
        ${editLink}</div>`;
    }

        <div class="compare-word-list">${d.items.map(it=>`<div class="compare-word">🎤 ${it.target || '<span style="color:var(--text-lo);">empty</span>'}</div>`).join('') || '<div class="compare-word" style="color:var(--text-lo);">empty pool</div>'}</div>

}

const LIVE_FLAGS = {}; // keyed by "gapfill-<tier>-sentence" -> {text, lesson, module, tier}

// ---- Token editor state: per-scope list of {text, role, chunkId}, one entry per WORD.
// Adjacent entries sharing a chunkId render as one merged pill. A "scope" identifies which field
// is being tagged (e.g. gap-fill's sentence, True/False's statement, one Build-a-Sentence item) so
// the same generic editor can attach to any of them without state bleeding between fields. ----
const LIVE_TOKENS = {}; // keyed by scope string -> [{text, role, chunkId}]
let selectedChunkIds = new Set();
let chunkIdCounter = 1;
function newChunkId(){ return chunkIdCounter++; }
let activeTokenScope = null; // which scope the visible token editor is currently bound to
let onTokenEditorChange = null; // optional callback other module forms can set to react when tags change

function flattenTokens(tokens){
  // Each original phrase (e.g. "every day") keeps its words grouped under one chunkId,
  // so it still renders as a single merged pill by default.
  const out = [];
  (tokens || []).forEach(tk => {
    const cid = newChunkId();
    tk.t.split(/\s+/).forEach(w => out.push({ text: w, role: tk.r, chunkId: cid }));
  });
  return out;
}

function tokenKey(tier, itemIndex){ return currentLessonId + '::gapfill::' + tier + (itemIndex!=null?'::'+itemIndex:''); }

function ensureLiveTokens(tier, itemIndex){
  const key = tokenKey(tier, itemIndex);
  if(!LIVE_TOKENS[key]) LIVE_TOKENS[key] = flattenTokens(gd()[tier].items[itemIndex].tokens);
}

function ensureLiveTokensForScope(scope, initialTokens){
  if(!LIVE_TOKENS[scope]) LIVE_TOKENS[scope] = flattenTokens(initialTokens);
}

function normWord(w){
  return w.toLowerCase().replace(/[.,!?;:"'()]+$/, '').replace(/^[.,!?;:"'()]+/, '');
}

function fillBlank(sentence, answer){
  // "___" is a display convention for the blank — never send it to a speech engine as-is,
  // since it gets read literally (spelled out or as a long pause of underscores).
  if(answer && sentence.includes('___')) return sentence.replace('___', answer);
  return sentence;
}

function rebuildTokensFromSentence(tier, itemIndex, sentenceText, answer){
  rebuildTokensForScope(tokenKey(tier, itemIndex), fillBlank(sentenceText, answer));
}

function rebuildTokensForScope(scope, displaySentence){
  const newWords = displaySentence.split(/\s+/).filter(Boolean);
  const prev = LIVE_TOKENS[scope] || [];
  LIVE_TOKENS[scope] = newWords.map((w, i) => {
    // Same word (ignoring case/trailing punctuation), same position → keep its role AND chunkId,
    // so existing merges survive edits elsewhere in the sentence — and survive punctuation-only changes too
    if(prev[i] && normWord(prev[i].text) === normWord(w)) return { text: w, role: prev[i].role, chunkId: prev[i].chunkId };
    // Changed or new word → starts untagged, and breaks out of whatever chunk it used to belong to
    return { text: w, role: null, chunkId: newChunkId() };
  });
}

function getChunks(scope){
  const tokens = LIVE_TOKENS[scope] || [];
  const chunks = [];
  let i = 0;
  while(i < tokens.length){
    let j = i;
    while(j + 1 < tokens.length && tokens[j+1].chunkId === tokens[i].chunkId) j++;
    chunks.push({ chunkId: tokens[i].chunkId, role: tokens[i].role, words: tokens.slice(i, j+1).map(t=>t.text), startIndex: i, endIndex: j });
    i = j + 1;
  }
  return chunks;
}

function handleChipClick(e, chunkId){
  if(e && e.shiftKey){
    if(selectedChunkIds.has(chunkId)) selectedChunkIds.delete(chunkId);
    else selectedChunkIds.add(chunkId);
  } else {
    selectedChunkIds = new Set([chunkId]);
  }
  renderTokenEditor();
}

function assignRole(role){
  if(selectedChunkIds.size === 0 || !activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId));
  chunks.forEach(c => {
    for(let k = c.startIndex; k <= c.endIndex; k++) LIVE_TOKENS[activeTokenScope][k].role = role;
  });
  selectedChunkIds = new Set();
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function mergeSelected(){
  if(!activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId)).sort((a,b)=>a.startIndex-b.startIndex);
  if(chunks.length < 2) return;
  const contiguous = chunks.every((c,i) => i===0 || c.startIndex === chunks[i-1].endIndex + 1);
  if(!contiguous) return;
  const newId = newChunkId();
  const role = chunks[0].role;
  for(let k = chunks[0].startIndex; k <= chunks[chunks.length-1].endIndex; k++){
    LIVE_TOKENS[activeTokenScope][k].chunkId = newId;
    LIVE_TOKENS[activeTokenScope][k].role = role;
  }
  selectedChunkIds = new Set([newId]);
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function splitSelected(){
  if(!activeTokenScope) return;
  const chunks = getChunks(activeTokenScope).filter(c => selectedChunkIds.has(c.chunkId));
  if(chunks.length !== 1 || chunks[0].words.length < 2) return;
  const c = chunks[0];
  for(let k = c.startIndex; k <= c.endIndex; k++) LIVE_TOKENS[activeTokenScope][k].chunkId = newChunkId();
  selectedChunkIds = new Set();
  renderTokenEditor();
  if(typeof onTokenEditorChange === 'function') onTokenEditorChange();
}

function renderTokenEditor(scope){
  if(scope) activeTokenScope = scope;
  const el = document.getElementById('tokenEditor');
  const actionsEl = document.getElementById('tokenActions');
  if(!el || !activeTokenScope) return;
  const chunks = getChunks(activeTokenScope);

  el.innerHTML = chunks.map(c => `
    <div class="chip ${c.role || 'connector'} ${selectedChunkIds.has(c.chunkId) ? 'chip-selected' : ''}" onclick="handleChipClick(event, ${c.chunkId})">${c.words.join(' ')}</div>
  `).join('') || '<span style="color:var(--text-lo);font-size:12.5px;">Type above to tag its words.</span>';

  if(!actionsEl) return;
  const selected = chunks.filter(c => selectedChunkIds.has(c.chunkId)).sort((a,b)=>a.startIndex-b.startIndex);
  let html = '';
  if(selected.length >= 2){
    const contiguous = selected.every((c,i) => i===0 || c.startIndex === selected[i-1].endIndex + 1);
    html = contiguous
      ? `<span class="token-action-link" onclick="mergeSelected()">🔗 Merge into one pill</span>`
      : `<span class="token-action-hint">Select adjacent words to merge them</span>`;
  } else if(selected.length === 1 && selected[0].words.length > 1){
    html = `<span class="token-action-link" onclick="splitSelected()">✂ Split into separate words</span>`;
  } else if(selected.length === 1){
    html = `<span class="token-action-hint">Shift-click an adjacent word to merge with it</span>`;
  }
  actionsEl.innerHTML = html;
}

function updatePreviewLive(){
  if(currentModule!=='gapfill' || compareMode) return;
  const sentence = document.getElementById('gfSentence').value;
  const d = gd()[currentTier].items[gfExpandedIndex];
  d.sentence = sentence; // persist immediately — content should never be lost just by switching tiers/modules
  let options = [], answer = '';
  document.querySelectorAll('#gfOptions .opt-row').forEach((r, i)=>{
    const val = r.querySelector('input').value;
    options.push(val);
    if(r.querySelector('.opt-tag').classList.contains('is-correct')) answer = val;

    // Per-option audio check — each option word is its own speakable field, flagged independently
    const icon = r.querySelector('.opt-audio-icon');
    if(icon) syncSpeakableField('gapfill', 'option', i, val, icon, undefined, currentTier, gfExpandedIndex);
  });
  d.options = options; // persist immediately, same reasoning as the sentence above
  d.answer = answer;

  // Tag editor works off the blank-filled sentence, so the answer word is taggable instead of "___"
  ensureLiveTokens(currentTier, gfExpandedIndex);
  rebuildTokensFromSentence(currentTier, gfExpandedIndex, sentence, answer);
  const scope = tokenKey(currentTier, gfExpandedIndex);
  onTokenEditorChange = () => { d.tokens = getChunks(scope).map(c=>({t:c.words.join(' '), r:c.role})); };
  renderTokenEditor(scope);
  onTokenEditorChange(); // also persist on every keystroke, not just on explicit tag/merge/split actions

  // Compare live text to the audio-recorded baseline (separate from content) — this is the hash-mismatch check in miniature
  const statusEl = document.getElementById('gfAudioStatus');
  const needs = syncSpeakableField('gapfill', 'sentence', null, sentence, null, answer, currentTier, gfExpandedIndex);
  setAudioStatusBadge(statusEl, needs);

  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <div class="phone-tier">${currentTier.toUpperCase()}</div>
    <div class="phone-q">${sentence.replace('___','<span class="phone-blank">___</span>') || '<span style="color:var(--text-lo);">Type a sentence…</span>'}</div>
    <div class="phone-opts">${options.map(o=>`<div class="phone-opt ${answer && o===answer?'correct':''}">${o || '&nbsp;'}</div>`).join('')}</div>
    <div class="phone-stars">☆ ☆ ☆</div>`;
}

// Cambridge English Young Learners (Pre-A1 Starters / A1 Movers / A2 Flyers) word
// list, official 2025 edition — word -> level ('preA1'|'a1'|'a2'). Powers the
// vocabulary-consistency checker: content words must match a lesson's declared

// ---- Global word bank — one entry per concept, shared across every lesson. ----
// Picking from it copies word+emoji+sentence in as an editable starting point (never a live link).
// Audio reuse across lessons happens separately, via exact-text matching in GLOBAL_AUDIO_LIBRARY.
let WORD_BANK = [];
let wordBankSeeded = false;
let bankIdCounter = 1;

function seedWordBankFromColors(){
  if(wordBankSeeded) return;
  wordBankSeeded = true;
  ensureLessonContent('colors');
  const content = LESSON_CONTENT['colors'];
  const byWord = {}; // dedupe by lowercase word text

  function addCandidate(word, emoji, sentence){
    if(!word) return;
    const key = word.toLowerCase();
    if(byWord[key]) return; // keep the first one seen
    byWord[key] = { id: 'bank-'+(bankIdCounter++), word, emoji: emoji||'', sentence: sentence||'' };
  }

  if(content.spelling) Object.values(content.spelling).flat().forEach(it => addCandidate(it.word, it.emoji));
  if(content.wordscramble) Object.values(content.wordscramble).flat().forEach(it => addCandidate(it.word, it.emoji));
  if(content.memorypairs) Object.values(content.memorypairs).forEach(tierData => (tierData.items||[]).forEach(it => addCandidate(it.word, it.emoji, it.sentence)));
  if(content.picword) Object.values(content.picword).forEach(tierData => (tierData.items||[]).forEach(it => addCandidate(it.word, it.emoji, it.sentence)));

  WORD_BANK = Object.values(byWord);
}
function getWordBank(){ return WORD_BANK; }

function openAddVariantPrompt(slotId){
  const slot = IMAGE_VARIANT_SLOTS[slotId];
  const label = window.prompt(`Name this variant (e.g. "Food Court"):\n\nUpload the artwork at ${slot.dims} — that's the exact size the frame is built for.`);
  if(!label || !label.trim()) return;
  const id = label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const slug = label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');
  const defaultFile = slot.variants[0].file;
  const ext = defaultFile.split('.').pop();
  const dir = defaultFile.split('/').slice(0,-1).join('/');
  const generatedFile = `${dir}/${slotId}_${slug}.${ext}`;
  // Include the slot id in the generated filename — without this, two
  // different slots (e.g. background and scene) both getting a variant
  // named "Light" would collide on the exact same file path, since both
  // slots' defaults live in the same assets/ directory.
  slot.variants.push({
    id, label: label.trim(), file: generatedFile, pending: true,
  });
  renderAssetsView();
  scheduleSave();
  window.alert(`"${label.trim()}" added.\n\nUpload the artwork to:\nshell-v2/${generatedFile}\n\nat ${slot.dims} — then come back here and click "mark as uploaded".`);
}

function markVariantUploaded(slotId, variantId){
  const variant = IMAGE_VARIANT_SLOTS[slotId].variants.find(v => v.id === variantId);
  if(variant) delete variant.pending;
  renderAssetsView();
  scheduleSave();
}

function removeImageVariant(slotId, variantId){
  const slot = IMAGE_VARIANT_SLOTS[slotId];
  slot.variants = slot.variants.filter(v => v.id !== variantId);
  // Any lesson currently assigning this variant to a module falls back to
  // default automatically — moduleImageAssignments just stops resolving to
  // a real variant, and the assignment UI already treats an unknown id as
  // "use default" rather than erroring.
  renderAssetsView();
  scheduleSave();
}

// Real per-lesson audio status check — replaces the old cross-lesson "Audio
// Polish" tab (which mixed live-edit tracking with fake seeded demo data).
// This checks ONE lesson's actual speakable content against what's genuinely
// been pushed to lessons/{id}/manifest.json, no mock data involved.
async function checkAudioStatusForLesson(lessonId){
  const speakable = extractSpeakableForTTS(lessonId);
  let pushed;
  try {
    pushed = await fetchPushedAudioIds(lessonId);
  } catch(e) {
    pushed = new Set(); // network/parse failure — fail safe to "nothing confirmed pushed" rather than block the check
  }
  const needsAudio = speakable.filter(item => !pushed.has(item.id));
  return { total: speakable.length, needsAudio, readyCount: speakable.length - needsAudio.length };
}


// ---- Inline "Generate audio" flow (Option C: works from any icon, always visible in Audio Polish too) ----
let audioModalContext = null;
let audioModalOverriding = false; // true once "generate different for this lesson" is chosen for the current modal session

// ---- Global audio library: same text + same persona = same audio, reused across every lesson. ----
// This is the actual payoff of the word bank — pick "water" from the bank, and if it already has
// audio from another lesson, you get it for free instead of generating (and paying for) it again.
const GLOBAL_AUDIO_LIBRARY = {}; // keyed by normalized text + persona -> {text, persona, firstLesson, generatedAt}
const AUDIO_OVERRIDES = new Set(); // flagKeys that deliberately opted OUT of shared audio for this one field

function audioLibKey(text, persona){ return (text||'').trim().toLowerCase() + '::' + persona; }
function findGlobalAudio(text, persona){ return GLOBAL_AUDIO_LIBRARY[audioLibKey(text, persona)]; }
function registerGlobalAudio(text, persona, lessonName){
  const key = audioLibKey(text, persona);
  if(!GLOBAL_AUDIO_LIBRARY[key]) GLOBAL_AUDIO_LIBRARY[key] = { text, persona, firstLesson: lessonName, generatedAt: Date.now() };
}

function revertToLibraryAudio(){
  if(!audioModalContext) return;
