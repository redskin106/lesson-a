<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fix the ward · teacher</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:linear-gradient(#f5ecff,#dff1ff);color:#1c1b2e;padding:20px;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.num{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.nt{display:flex;align-items:center;justify-content:space-between;width:100%;height:150px;margin:0 0 16px;padding:0 26px;border-radius:36px;border:6px solid var(--c);background:#fff;box-shadow:0 10px 24px rgba(60,30,140,.14);font:inherit;cursor:pointer}
.nt .pic{font-size:84px;line-height:1}.nt .pl{width:92px;height:92px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.nt.on{background:#fff7e0}.nt.on .pl{animation:pu 1s infinite}@keyframes pu{50%{transform:scale(1.14)}}.g{margin:6px 0 10px;font-weight:800;font-size:26px}</style></head><body><div class="top"><h1 style="margin:0;font-size:26px">All 12 voice notes (teacher laptop)</h1></div><div class="g" style="color:#ff5a6a">Group 1</div><div style="--c:#ff5a6a"><button class="nt" aria-label="voice note" data-clip="" data-say="Her temperature is thirty-six point eight. Normal. Seventy-three? That was the coffee!"><span class="pic">🌡️</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="My headache is only a little. Three out of ten."><span class="pic">🤕</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="No more coffee suddenly. She should cut down slowly."><span class="pic">💊</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button></div><div class="g" style="color:#2a8cf0">Group 2</div><div style="--c:#2a8cf0"><button class="nt" aria-label="voice note" data-clip="" data-say="Eight cups a day. Every day. I know her order!"><span class="pic">☕</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="She has felt like this since the exams started. About two weeks."><span class="pic">🗓️</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="Nobody broke my heart! My phone just buzzes with exam messages."><span class="pic">💔</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button></div><div class="g" style="color:#19b38a">Group 3</div><div style="--c:#19b38a"><button class="nt" aria-label="voice note" data-clip="" data-say="Sleep last night: three hours. She woke up exhausted."><span class="pic">🛏️</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="I never cough. Not once."><span class="pic">😷</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="On Sunday she drank no coffee. She slept nine hours and felt much better."><span class="pic">🌞</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button></div><div class="g" style="color:#f2a900">Group 4</div><div style="--c:#f2a900"><button class="nt" aria-label="voice note" data-clip="" data-say="Her pulse is one hundred and ten. Her heart is racing."><span class="pic">💓</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="We ate the same lunch. Nobody else is sick."><span class="pic">🤢</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button><button class="nt" aria-label="voice note" data-clip="" data-say="Three exams in four days! She is exhausted."><span class="pic">📚</span><span class="pl"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button></div><script>var cur=null;function stop(){if(cur){cur.pause();cur=null}if(window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('.nt.on').forEach(function(x){x.classList.remove('on')})}
document.querySelectorAll('.nt').forEach(function(b){b.onclick=function(){var was=b.classList.contains('on');stop();if(was)return;b.classList.add('on');var c=b.dataset.clip;if(c){cur=new Audio(c);cur.onended=function(){b.classList.remove('on')};cur.play()}else if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(b.dataset.say);u.lang='en-GB';u.rate=.85;u.onend=function(){b.classList.remove('on')};speechSynthesis.speak(u)}}});</script></body></html>
