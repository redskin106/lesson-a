<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vocab Primer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { font-family: inherit; cursor: pointer; }

:root {
  --bg:          #1a1714;
  --bg-card:     #221f1b;
  --bg-lift:     #2c2723;
  --cream:       #f0ead8;
  --cream-dim:   rgba(240,234,216,0.45);
  --cream-faint: rgba(240,234,216,0.09);
  --coral:       #e8734a;
  --coral-dim:   rgba(232,115,74,0.16);
  --sage:        #7ab89a;
  --sage-dim:    rgba(122,184,154,0.16);
  --gold:        #c9a84c;
  --gold-dim:    rgba(201,168,76,0.14);
  --border:      rgba(240,234,216,0.08);
  --rcard:       16px;
  --rpill:       999px;
}

html, body {
  height: 100%; background: var(--bg);
  color: var(--cream); font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; overflow: hidden; }
.screen { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.screen.active { display: flex; }
::-webkit-scrollbar { width: 0; }

/* ── Colour swatch ── */
.colour-swatch {
  width: 100%; aspect-ratio: 1/1; border-radius: var(--rcard) var(--rcard) 0 0;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.gc-swatch {
  width: 100%; min-height: 60px; flex: 1;
  border-radius: var(--rcard) var(--rcard) 0 0;
}

/* ── Shared ── */
.slabel {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--cream-dim); margin-bottom: 8px;
}
.top-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px; flex-shrink: 0;
}
.nav-back {
  background: none; border: none; color: var(--cream-dim);
  font-size: 20px; padding: 2px 4px;
}
.nav-counter { font-size: 12px; color: var(--cream-dim); letter-spacing: 0.04em; }
.nav-tier {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 3px 10px; border-radius: var(--rpill);
}
.tier-bronze { color: var(--gold);     background: var(--gold-dim); }
.tier-silver { color: var(--cream-dim); background: var(--cream-faint); }
.tier-gold   { color: #e8d07a;          background: rgba(232,208,122,0.13); }

/* ════════════════════════════════
   INDEX SCREEN
════════════════════════════════ */
.idx-header { padding: 22px 18px 10px; flex-shrink: 0; }
.idx-eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--coral); margin-bottom: 5px;
}
.idx-title {
  font-family: 'Fraunces', serif; font-size: 26px;
  font-weight: 700; color: var(--cream); line-height: 1.1;
}
.idx-sub { font-size: 12px; color: var(--cream-dim); margin-top: 5px; }

.idx-progress { padding: 0 18px 14px; flex-shrink: 0; }
.prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.prog-label { font-size: 11px; color: var(--cream-dim); }
.prog-count  { font-size: 11px; color: var(--sage); font-weight: 600; }
.prog-track  { height: 3px; background: var(--cream-faint); border-radius: var(--rpill); overflow: hidden; }
.prog-fill   { height: 100%; background: linear-gradient(90deg, var(--sage), var(--coral)); border-radius: var(--rpill); transition: width 0.4s ease; }

.idx-section {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--cream-dim);
  padding: 4px 18px 8px; flex-shrink: 0;
}

.card-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 0 18px 32px;
  overflow-y: auto; flex: 1; align-content: start;
}

/* Single grid card */
.gc {
  background: var(--bg-card); border-radius: var(--rcard);
  border: 1.5px solid var(--border);
  overflow: hidden; cursor: pointer; position: relative;
  display: flex; flex-direction: column;
  transition: transform 0.12s, border-color 0.12s;
  min-height: 72px;
}
.gc:active { transform: scale(0.97); }
.gc.pair   { grid-column: span 2; }
.gc.done-card     { border-color: var(--sage); }
.gc.practice-card { border-color: var(--coral); }

/* Status dot */
.gc-dot {
  position: absolute; top: 10px; left: 10px;
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(240,234,216,0.15);
  border: 1.5px solid rgba(240,234,216,0.2); z-index: 3;
}
.gc-dot.done       { background: var(--sage); border-color: var(--sage); }
.gc-dot.practicing { background: var(--coral); border-color: var(--coral); }

/* Single card image */
/* gc-img removed — grid is text-only */
/* Tier accent on grid cards */
.gc[data-tier="bronze"] { border-left: 3px solid var(--gold); }
.gc[data-tier="silver"] { border-left: 3px solid var(--cream-dim); }
.gc[data-tier="gold"]   { border-left: 3px solid #e8d07a; }
.gc-video-pip {
  font-size: 10px; color: var(--coral);
  margin-left: auto; flex-shrink: 0;
}
.gc-label {
  flex: 1; padding: 14px 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-card);
}
.gc-word { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; color: var(--cream); line-height: 1.1; }
.gc-play {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--cream-faint); border: none; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* Pair card */
.pair-cols { display: flex; width: 100%; }
.pair-col  {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 16px 10px; min-height: 72px;
}
.pair-col:first-child { border-right: 1px solid var(--border); }
.pair-col-img { display: none; } /* hidden in grid — shown on card */
.pair-col-word {
  font-family: 'Fraunces', serif; font-size: 19px;
  font-weight: 700; color: var(--cream);
  text-align: center; line-height: 1.1;
}
.pair-footer {
  display: flex; align-items: center; justify-content: center;
  padding: 5px 12px 8px; gap: 8px; background: var(--bg-card);
}
.pair-footer-vs {
  font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--cream-dim); text-transform: uppercase;
}
.pair-footer-video { font-size: 10px; color: var(--coral); }

/* ════════════════════════════════
   SINGLE CARD SCREEN
════════════════════════════════ */
.card-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 8px 18px 24px;
  display: flex; flex-direction: column; gap: 14px;
  -webkit-overflow-scrolling: touch;
}

/* Word hero */
.word-hero {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 10px 0 4px;
}
.word-text {
  font-family: 'Fraunces', serif;
  font-size: clamp(30px, 9vw, 40px); font-weight: 700; color: var(--cream);
}
.word-audio {
  background: var(--coral-dim); border: 1.5px solid var(--coral);
  border-radius: 50%; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; transition: background 0.12s;
}
.word-audio:active { background: rgba(232,115,74,0.35); }

/* Card image */
.card-img {
  border-radius: 14px; overflow: hidden; background: #272320;
  aspect-ratio: 1/1; display: flex; align-items: center;
  justify-content: center; font-size: 90px; position: relative;
  border: 1.5px solid var(--border);
}
.card-img img { width: 85%; height: 85%; object-fit: contain; }
.card-video-btn {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(20,17,14,0.82); border: 1.5px solid var(--coral);
  border-radius: var(--rpill); padding: 8px 14px;
  font-size: 12px; color: var(--coral); font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.13s; backdrop-filter: blur(6px);
  letter-spacing: 0.02em;
}
.card-video-btn:active { background: rgba(232,115,74,0.3); }

/* Optional illustration toggle */
.illus-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--cream-faint); font-size: 12px; color: var(--cream-dim);
  font-weight: 500;
}

/* Sentence */
.sentence-block {
  background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
}
.sentence-text { flex: 1; font-size: 14px; color: var(--cream); line-height: 1.55; }
.sentence-hl   { color: var(--coral); font-weight: 700; }
.sentence-audio {
  background: var(--cream-faint); border: 1px solid var(--border);
  border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
}

/* Phoneme tiles */
.phoneme-tiles { display: flex; flex-wrap: wrap; gap: 7px; }
.ph-tile {
  background: var(--gold-dim); border: 1.5px solid var(--gold);
  border-radius: 9px; padding: 7px 13px;
  font-family: 'Fraunces', serif; font-size: 19px; color: var(--gold);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: background 0.12s, transform 0.1s;
}
.ph-tile:active, .ph-tile.tapped { background: rgba(201,168,76,0.3); transform: scale(0.94); }
.ph-sub { font-family: 'Inter', sans-serif; font-size: 8px; color: rgba(201,168,76,0.55); letter-spacing: 0.06em; }

/* ── Trio record block ── */
.trio-wrap {
  background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.trio-row { display: flex; gap: 8px; }
.trio-btn {
  flex: 1; padding: 10px 6px; border-radius: 10px;
  border: 1.5px solid var(--border); background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; transition: all 0.15s;
}
.trio-icon  { font-size: 18px; line-height: 1; }
.trio-label { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-dim); }
/* Model — coral */
.trio-btn.model { border-color: var(--coral); color: var(--coral); }
.trio-btn.model .trio-label { color: var(--coral); }
.trio-btn.model.playing { background: var(--coral-dim); }
/* You — purple */
.trio-btn.playback { border-color: #9b7fd4; color: #c4a8f0; opacity: 0.3; pointer-events: none; }
.trio-btn.playback .trio-label { color: #9b7fd4; }
.trio-btn.playback.ready { opacity: 1; pointer-events: auto; }
.trio-btn.playback.playing { background: rgba(155,127,212,0.15); }
/* Record — red */
.trio-btn.record { border-color: #e05c5c; color: #e05c5c; }
.trio-btn.record .trio-label { color: #e05c5c; }
.trio-btn.record.recording {
  background: rgba(224,92,92,0.15);
  animation: pulse-rec 1s ease-in-out infinite;
}
@keyframes pulse-rec {
  0%,100%{ box-shadow: 0 0 0 0 rgba(224,92,92,0.4); }
  50%    { box-shadow: 0 0 0 6px rgba(224,92,92,0); }
}
.trio-hint { font-size: 11px; color: var(--cream-dim); text-align: center; }
/* Compare card */
.compare-card {
  display: none; background: var(--bg-lift);
  border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; align-items: center; gap: 10px;
}
.compare-play {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: rgba(155,127,212,0.15); border: 1.5px solid #9b7fd4;
  color: #c4a8f0; font-size: 13px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.compare-info { flex: 1; }
.compare-title { font-size: 11px; font-weight: 600; color: var(--cream); }
.compare-sub   { font-size: 10px; color: var(--cream-dim); margin-top: 1px; }
/* Recording history */
.rec-history { display: flex; flex-direction: column; gap: 6px; }
.rec-history-head { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-dim); }
.rec-history-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-lift); border-radius: 8px; padding: 7px 10px;
  border: 1px solid var(--border);
}
.rec-history-num  { font-size: 10px; color: var(--cream-dim); width: 16px; text-align: center; }
.rec-history-time { font-size: 11px; color: var(--cream-dim); flex: 1; }
.rec-history-play {
  background: none; border: none; color: var(--cream-dim); font-size: 14px; cursor: pointer; padding: 2px 4px;
}

/* Rating */
.rating-row { display: flex; gap: 8px; }
.rating-btn {
  flex: 1; padding: 12px 8px; border-radius: 10px;
  border: 1.5px solid var(--border); background: transparent;
  color: var(--cream-dim); font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.15s;
}
.rating-btn.got-it     { border-color: var(--sage); color: var(--sage); background: var(--sage-dim); }
.rating-btn.practicing { border-color: var(--coral); color: var(--coral); background: var(--coral-dim); }

/* Card nav arrows */
.card-arrows {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px 16px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.arrow-btn {
  background: var(--cream-faint); border: 1px solid var(--border);
  border-radius: var(--rpill); padding: 8px 18px;
  color: var(--cream-dim); font-size: 13px; font-weight: 600;
  transition: background 0.13s;
}
.arrow-btn:disabled { opacity: 0.3; pointer-events: none; }
.arrow-btn:active   { background: var(--cream-faint); }

/* ════════════════════════════════
   PAIR CARD SCREEN
════════════════════════════════ */
.pair-card-layout {
  flex: 1; display: flex; overflow: hidden; min-height: 0;
}
.pair-card-half {
  flex: 1; overflow-y: auto; padding: 10px 14px 28px;
  display: flex; flex-direction: column; gap: 10px;
  border-right: 1px solid var(--border);
}
.pair-card-half:last-child { border-right: none; }

.pair-word-row {
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pair-word-text {
  font-family: 'Fraunces', serif;
  font-size: clamp(20px, 6vw, 26px); font-weight: 700; color: var(--cream);
}
.pair-word-audio {
  background: var(--coral-dim); border: 1.5px solid var(--coral);
  border-radius: 50%; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.pair-card-img {
  aspect-ratio: 1/1; background: #272320; border-radius: 12px;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; position: relative; overflow: hidden;
}
.pair-card-img img { width: 82%; height: 82%; object-fit: contain; }

.pair-sentence {
  background: var(--cream-faint); border-radius: 9px;
  padding: 9px 10px; font-size: 12px; color: var(--cream-dim);
  line-height: 1.55; display: flex; align-items: flex-start; gap: 6px;
}
.pair-sentence-hl { color: var(--coral); font-weight: 700; color: var(--cream); }
.pair-s-audio { font-size: 12px; flex-shrink: 0; margin-top: 1px; }

.pair-phonemes { display: flex; flex-wrap: wrap; gap: 5px; }
.pair-ph {
  background: var(--gold-dim); border: 1px solid var(--gold);
  border-radius: 7px; padding: 5px 9px;
  font-family: 'Fraunces', serif; font-size: 15px; color: var(--gold);
  transition: background 0.12s;
}
.pair-ph:active { background: rgba(201,168,76,0.3); }

/* pair record — reuses trio styles, compact version */
.pair-trio-row { display: flex; gap: 5px; }
.pair-trio-btn {
  flex: 1; padding: 8px 4px; border-radius: 8px;
  border: 1.5px solid var(--border); background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transition: all 0.15s;
}
.pair-trio-btn .trio-icon  { font-size: 14px; }
.pair-trio-btn .trio-label { font-size: 8px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cream-dim); }
.pair-trio-btn.model   { border-color: var(--coral); color: var(--coral); }
.pair-trio-btn.model .trio-label { color: var(--coral); }
.pair-trio-btn.playback { border-color: #9b7fd4; color: #c4a8f0; opacity: 0.3; pointer-events: none; }
.pair-trio-btn.playback.ready { opacity: 1; pointer-events: auto; }
.pair-trio-btn.record  { border-color: #e05c5c; color: #e05c5c; }
.pair-trio-btn.record.recording { background: rgba(224,92,92,0.15); }

.pair-rating { display: flex; flex-direction: column; gap: 5px; }
.pair-rating-btn {
  padding: 8px 6px; border-radius: 8px;
  border: 1.5px solid var(--border); background: transparent;
  color: var(--cream-dim); font-size: 11px; font-weight: 600;
  text-align: center; transition: all 0.13s;
}
.pair-rating-btn.got-it     { border-color: var(--sage); color: var(--sage); background: var(--sage-dim); }
.pair-rating-btn.practicing { border-color: var(--coral); color: var(--coral); background: var(--coral-dim); }

/* Rotate nudge — portrait only */
.rotate-nudge {
  display: none; align-items: center; justify-content: center; gap: 5px;
  padding: 6px 14px; background: var(--cream-faint);
  border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--cream-dim); flex-shrink: 0;
}
@media (orientation: portrait) { .rotate-nudge { display: flex; } }
@media (orientation: landscape) {
  .pair-card-half { padding: 12px 18px 28px; gap: 12px; }
  .pair-card-img  { font-size: 64px; }
}

/* ════════════════════════════════
   VIDEO MODAL
════════════════════════════════ */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(10,9,8,0.9); z-index: 200;
  align-items: center; justify-content: center;
  padding: 24px; backdrop-filter: blur(8px);
}
.modal-bg.open { display: flex; }
.modal-box {
  background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 20px; width: 100%; max-width: 380px; overflow: hidden;
}
.modal-video {
  width: 100%; aspect-ratio: 16/9; background: #111;
  display: flex; align-items: center; justify-content: center;
}
.modal-play {
  width: 54px; height: 54px; background: var(--coral);
  border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 20px; color: #fff;
}
.modal-footer {
  padding: 14px 16px; display: flex;
  align-items: center; justify-content: space-between;
}
.modal-info-title { font-size: 13px; color: var(--cream); font-weight: 500; }
.modal-info-sub   { font-size: 11px; color: var(--cream-dim); margin-top: 2px; }
.modal-close {
  background: var(--cream-faint); border: none;
  border-radius: var(--rpill); padding: 7px 16px;
  color: var(--cream-dim); font-size: 12px; font-weight: 600;
}
</style>
</head>
<body>
<div class="app">

<!-- ══════════════════════
     INDEX
══════════════════════ -->
<div class="screen active" id="screen-index">
  <div class="idx-header">
    <div class="idx-eyebrow" id="idx-lesson-name">Objects Around Us</div>
    <div class="idx-title">Today's words</div>
    <div class="idx-sub">Study at your own pace. Tap any word to begin.</div>
  </div>
  <div class="idx-progress">
    <div class="prog-row">
      <span class="prog-label">Your progress</span>
      <span class="prog-count" id="prog-count">0 confident</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <!-- pairs label rendered inside grid -->
  <div class="card-grid" id="card-grid"></div>
</div>

<!-- ══════════════════════
     SINGLE CARD
══════════════════════ -->
<div class="screen" id="screen-single">
  <div class="top-nav">
    <button class="nav-back" onclick="goIndex()">Home</button>
    <span class="nav-counter" id="sc-counter"></span>
    <span class="nav-tier" id="sc-tier"></span>
  </div>
  <div class="card-scroll" id="sc-scroll">
    <!-- word hero -->
    <div class="word-hero">
      <div class="word-text" id="sc-word"></div>
      <button class="word-audio" id="sc-word-audio" onclick="playWordAudio()">🔊</button>
    </div>
    <!-- image -->
    <div class="card-img" id="sc-img-block">
      <div id="sc-img-inner"></div>
      <button class="card-video-btn" id="sc-video-btn" style="display:none" onclick="openVideo()">📹 Video reference</button>
    </div>

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
const STORAGE_KEY = 'vp_progress_' + (DECK.lessonName.replace(/\s+/g,'_'));
let progress = {};   // cardKey → 'got-it' | 'practicing'
let currentSingleIdx = 0;  // index into singleCards array
let currentPairIdx   = 0;  // index into pairCards array
let singleCards = [];
let pairCards   = [];
let currentVideoData = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob   = null;
let recordingActive = false;

function cardKey(card, side) {
  if (card.type === 'single') return 'single_' + card.word;
  return 'pair_' + card.word1 + '_' + (side || 'both');
}

function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { progress = {}; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function init() {
  loadProgress();
  document.getElementById('idx-lesson-name').textContent = DECK.lessonName;
  pairCards   = DECK.cards.filter(c => c.type === 'pair');
  singleCards = DECK.cards.filter(c => c.type === 'single');
  buildGrid();
  updateProgress();
}

/* ═══════════════════════════════════════════════
   GRID BUILD
═══════════════════════════════════════════════ */
function buildGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  // Pairs section label
  if (pairCards.length) {
    // Pairs section label inside grid
    const pairLabel = document.createElement('div');
    pairLabel.style.cssText = 'grid-column:span 2;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);padding:2px 0 4px;';
    pairLabel.textContent = 'Pairs';
    grid.appendChild(pairLabel);

    pairCards.forEach((card, i) => {
      grid.appendChild(buildPairGridCard(card, i));
    });
  }

  if (singleCards.length) {
    // Group singles by category for section labels
    const groups = [
      { label: 'Nouns',   filter: c => !c.isColour && ['bag','ball','book','box','chair','cup','pen','phone','coin','key','table','bottle'].includes(c.word) },
      { label: 'Shapes',  filter: c => !c.isColour && ['circle','rectangle','triangle','square'].includes(c.word) },
      { label: 'Colours', filter: c => c.isColour },
      { label: 'Gold',    filter: c => !c.isColour && c.tier === 'gold' && !['circle','rectangle','triangle','square'].includes(c.word) },
    ];
    groups.forEach(group => {
      const cards = singleCards.filter(group.filter);
      if (!cards.length) return;
      const lbl = document.createElement('div');
      lbl.style.cssText = 'grid-column:span 2;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);padding:8px 0 4px;';
      lbl.textContent = group.label;
      grid.appendChild(lbl);
      cards.forEach(card => {
        const i = singleCards.indexOf(card);
        grid.appendChild(buildSingleGridCard(card, i));
      });
    });
  }
}

function dotClass(key) {
  const s = progress[key];
  if (s === 'got-it') return 'gc-dot done';
  if (s === 'practicing') return 'gc-dot practicing';
  return 'gc-dot';
}
function pairDotClass(card) {
  const k1 = 'pair_' + card.word1 + '_word1';
  const k2 = 'pair_' + card.word2 + '_word2';
  const s1 = progress[k1], s2 = progress[k2];
  if (s1 === 'got-it' && s2 === 'got-it') return 'gc-dot done';
  if (s1 || s2) return 'gc-dot practicing';
  return 'gc-dot';
}

function buildSingleGridCard(card, i) {
  const el = document.createElement('div');
  const rating = progress[cardKey(card)] || '';
  el.dataset.tier = card.tier;
  el.className = 'gc' + (rating === 'got-it' ? ' done-card' : rating === 'practicing' ? ' practice-card' : '');
  el.onclick = () => openSingle(i);
  el.innerHTML = `
    <div class="${dotClass(cardKey(card))}"></div>
    <div class="gc-label">
      <span class="gc-word">${card.word}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        ${card.video ? `<span class="gc-video-pip">🎬</span>` : ''}
        <button class="gc-play" onclick="event.stopPropagation();playAudio(null,'${card.word}')">🔊</button>
      </div>
    </div>`;
  return el;
}

function buildPairGridCard(card, i) {
  const el = document.createElement('div');
  const hasVideo = card.video1 || card.video2;
  const dot = pairDotClass(card);
  el.dataset.tier = card.tier;
  el.className = 'gc pair' +
    (dot.includes('done') ? ' done-card' : dot.includes('practicing') ? ' practice-card' : '');
  el.onclick = () => openPair(i);
  el.innerHTML = `
    <div class="${dot}" style="z-index:4"></div>
    <div class="pair-cols">
      <div class="pair-col">
        <div class="pair-col-word">${card.word1}</div>
      </div>
      <div class="pair-col">
        <div class="pair-col-word">${card.word2}</div>
      </div>
    </div>
    <div class="pair-footer">
      <span class="pair-footer-vs">opposite</span>
      ${hasVideo ? `<span class="pair-footer-video">🎬</span>` : ''}
    </div>`;
  return el;
}

/* ═══════════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════════ */
function updateProgress() {
  // Each pair word rated independently → total = singles + (pairs × 2)
  const total = singleCards.length + (pairCards.length * 2);
  const done  = Object.values(progress).filter(v => v === 'got-it').length;
  const pct   = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-count').textContent = done + ' of ' + total + ' confident';
}

/* ═══════════════════════════════════════════════
   SINGLE CARD
═══════════════════════════════════════════════ */
function openSingle(i) {
  currentSingleIdx = i;
  renderSingle();
  showScreen('screen-single');
}

function renderSingle() {
  const card = singleCards[currentSingleIdx];
  const i    = currentSingleIdx;
  const tot  = singleCards.length;

  document.getElementById('sc-counter').textContent = `${i+1} of ${tot}`;
  document.getElementById('sc-tier').className = 'nav-tier tier-' + card.tier;
  document.getElementById('sc-tier').textContent = card.tier.charAt(0).toUpperCase() + card.tier.slice(1);

  document.getElementById('sc-word').textContent = card.word;

  // Image — colour cards show CSS swatch
  const imgInner = document.getElementById('sc-img-inner');
  if (card.isColour) {
    imgInner.style.cssText = `width:100%;height:100%;background:${card.swatch};border-radius:12px;`;
    imgInner.innerHTML = '';
  } else {
    imgInner.style.cssText = '';
    imgInner.innerHTML = card.image
      ? `<img src="${card.image}" alt="${card.word}" style="width:85%;height:85%;object-fit:contain;">`
      : `<span style="font-size:90px;">${card.emoji}</span>`;
  }

  // Video btn
  const vBtn = document.getElementById('sc-video-btn');
  if (card.video) {
    vBtn.style.display = '';
    currentVideoData = card.video;
  } else {
    vBtn.style.display = 'none';
    currentVideoData = null;
  }

  // Illustration toggle — swaps between photo and illustration
  const ilToggle = document.getElementById('sc-illus-toggle');
  const ilLabel  = document.getElementById('sc-illus-label');
  ilToggle.style.display = card.illustration ? '' : 'none';
  let showingIllus = false;
  ilToggle.onclick = () => {
    showingIllus = !showingIllus;
    const imgInner = document.getElementById('sc-img-inner');
    const src = showingIllus ? card.illustration : (card.image || null);
    if (src) {
      imgInner.innerHTML = `<img src="${'${src}'}" alt="${'${card.word}'}" style="width:85%;height:85%;object-fit:contain;">`;
    } else {
      imgInner.innerHTML = `<span style="font-size:90px;">${'${card.emoji}'}</span>`;
    }
    ilLabel.textContent = showingIllus ? 'Show photo' : 'Show illustration';
  };

  // Sentence
  const sentEl = document.getElementById('sc-sentence');
  sentEl.innerHTML = highlightWord(card.sentence, card.word);

  // Phonemes
  const phEl = document.getElementById('sc-phonemes');
  phEl.innerHTML = (card.phonemes || []).map((ph, pi) =>
    `<button class="ph-tile" onclick="this.classList.toggle('tapped');playPhoneme('${ph.s}','${ph.audio||''}')">
      ${ph.s}<div class="ph-sub">tap to hear</div>
    </button>`
  ).join('');

  // Rating
  const key = cardKey(card);
  const rating = progress[key] || '';
  document.getElementById('sc-got-it').className     = 'rating-btn' + (rating === 'got-it' ? ' got-it' : '');
  document.getElementById('sc-practicing').className = 'rating-btn' + (rating === 'practicing' ? ' practicing' : '');

  // Arrows
  document.getElementById('sc-prev').disabled = (i === 0) && pairCards.length === 0;
  document.getElementById('sc-next').disabled = i === tot - 1;
  // Update prev label to hint when crossing to pairs
  const scPrev = document.getElementById('sc-prev');
  scPrev.textContent = (i === 0 && pairCards.length > 0) ? '< Pairs' : '< Prev';

  // Reset trio recorder
  resetSCTrio();
  // Wire buttons after DOM update
  setTimeout(wireSCTrio, 0);
  document.getElementById('sc-scroll').scrollTop = 0;
}

function stepCard(dir) {
  const next = currentSingleIdx + dir;
  if (next < 0 && pairCards.length > 0) {
    // wrap back into pairs — go to last pair
    currentPairIdx = pairCards.length - 1;
    openPair(currentPairIdx);
    return;
  }
  if (next >= singleCards.length) return;
  if (next < 0) return;
  currentSingleIdx = next;
  renderSingle();
}

function rateCard(rating) {
  const card = singleCards[currentSingleIdx];
  const key  = cardKey(card);
  progress[key] = rating;
  saveProgress();
  document.getElementById('sc-got-it').className     = 'rating-btn' + (rating === 'got-it' ? ' got-it' : '');
  document.getElementById('sc-practicing').className = 'rating-btn' + (rating === 'practicing' ? ' practicing' : '');
  buildGrid();
  updateProgress();
}

═══════════════════════════════════════════════ */
function openPair(i) {
  currentPairIdx = i;
  renderPair();
  showScreen('screen-pair');
}

function renderPair() {
  const card = pairCards[currentPairIdx];
  const i    = currentPairIdx;
  const tot  = pairCards.length;

  document.getElementById('pc-counter').textContent = `Pair ${i+1} of ${tot}`;
  document.getElementById('pc-tier').className = 'nav-tier tier-' + card.tier;
  document.getElementById('pc-tier').textContent = card.tier.charAt(0).toUpperCase() + card.tier.slice(1);
  document.getElementById('pc-prev').disabled = i === 0;
  document.getElementById('pc-next').disabled = (i === tot - 1) && singleCards.length === 0;
  // Update next label to hint when crossing to singles
  const pcNext = document.getElementById('pc-next');
  pcNext.textContent = (i === tot - 1 && singleCards.length > 0) ? 'Words >' : 'Next >';

  const layout = document.getElementById('pair-card-layout');
  layout.innerHTML = buildPairHalfHTML(card, 1) + buildPairHalfHTML(card, 2);

  // Pre-load You buttons from history
  ['1','2'].forEach(side => {
    const word = pairCards[currentPairIdx]['word' + side];
    if (word) initPairYouBtn(word, side);
  });

  // Wire rating buttons
  layout.querySelectorAll('[data-rate]').forEach(btn => {
    btn.addEventListener('click', () => {
      const side   = btn.dataset.side;
      const rating = btn.dataset.rate;
      const key    = `pair_${card['word'+side]}_word${side}`;
      progress[key] = rating;
      saveProgress();
      const half = btn.closest('.pair-card-half');
      half.querySelectorAll('[data-rate]').forEach(b => {
        b.className = 'pair-rating-btn' + (b.dataset.rate === rating ? ' '+rating : '');
      });
      buildGrid();
      updateProgress();
    });
  });

  // Wire phoneme buttons
  layout.querySelectorAll('[data-phoneme]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('pair-ph-tapped');
      playPhoneme(btn.dataset.phoneme, btn.dataset.audio || '');
    });
  });
}

function stepPair(dir) {
  const next = currentPairIdx + dir;
  if (next >= pairCards.length && singleCards.length > 0) {
    // advance into singles — go to first single
    currentSingleIdx = 0;
    openSingle(0);
    return;
  }
  if (next < 0 || next >= pairCards.length) return;
  currentPairIdx = next;
  renderPair();
}

═══════════════════════════════════════════════ */
function playAudio(url, fallbackTTS) {
  if (url) {
    const a = new Audio(url);
    a.addEventListener('error', () => { if (fallbackTTS) speakTTS(fallbackTTS); });
    a.play().catch(() => {}); // swallow autoplay policy rejection
  } else if (fallbackTTS) {
    speakTTS(fallbackTTS);
  }
}

// Jolly Phonics grapheme → filename (same as shell PHONEME_FILE)
const PHONEME_FILE = {
  'c':'ck','k':'k','ck':'ck','g':'g','j':'j','qu':'qu',
  'x':'x','y':'y','z':'z','ng':'ng','sh':'sh','th':'thh',
  'ch':'ch','ai':'ai','ee':'ee','ie':'ie','oa':'oa',
  'oo':'ooo','or':'or','ur':'er','er':'er','ow':'ou','ou':'ou',
  'oi':'oi','ear':'ar','air':'ar','ar':'ar','ue':'ue','thh':'thh',
  // single letters that map directly
  'a':'a','b':'b','d':'d','e':'e','f':'f','h':'h','i':'i',
  'l':'l','m':'m','n':'n','o':'o','p':'p','r':'r','s':'s',
  't':'t','u':'u','v':'v','w':'w',
};

// IPA symbol → Jolly Phonics grapheme (for primer's IPA-keyed phonemes)
const IPA_TO_JP = {
  // vowels
  'æ':'a',    // CAT  → sound_a.mp3
  'ɑː':'ar',  // CAR  → sound_ar.mp3
  'ɒ':'o',    // LOT  → sound_o.mp3
  'ɔː':'or',  // CORN → sound_or.mp3
  'ə':'er',   // schwa → sound_er.mp3 (unstressed central, closer to 'butter' than 'egg')
  'ɛ':'e',    // BED/PEN/HEAVY → sound_e.mp3
  'əʊ':'oa',  // GOAT → sound_oa.mp3
  'eɪ':'ai',  // FACE → sound_ai.mp3
  'iː':'ee',  // FLEECE → sound_ee.mp3
  'ɪ':'i',    // KIT  → sound_i.mp3
  'i':'i',    // unstressed final (happy) → sound_i.mp3
  'uː':'ooo', // GOOSE (long) → sound_ooo.mp3
  'ʊ':'oo',   // FOOT (short) → sound_oo.mp3  ← was wrongly ooo
  'aɪ':'ie',  // PRICE → sound_ie.mp3
  'aʊ':'ou',  // MOUTH → sound_ou.mp3
  'ɔɪ':'oi',  // CHOICE → sound_oi.mp3
  'ɜː':'er',  // NURSE → sound_er.mp3
  'ʌ':'u',    // STRUT → sound_u.mp3
  'juː':'ue', // CUTE → sound_ue.mp3
  'eə':'ar',  // SQUARE → sound_ar.mp3 (closest)
  'ɪə':'er',  // NEAR → sound_er.mp3 (closer than ar)
  // consonants
  'b':'b','d':'d','f':'f','g':'g','h':'h','j':'j','k':'k',
  'l':'l','m':'m','n':'n','p':'p','r':'r','s':'s','t':'t',
  'v':'v','w':'w','x':'x','y':'y','z':'z',
  'tʃ':'ch','dʒ':'j','ŋ':'ng','ʃ':'sh','θ':'th','ð':'thh',
};

const PHONEME_TTS_FALLBACK = {
  'c':'cat','k':'kit','g':'got','j':'jam','qu':'quick',
  'x':'fox','y':'yes','z':'zip','ng':'ring',
};

// Module-level reference prevents GC killing short audio clips mid-play
// Phoneme queue — play tiles one at a time, queue next if busy
let _phAudio   = null;  // currently playing Audio object
let _phQueue   = [];    // pending {src, symbol, useJP} items
let _phPlaying = false;

function _phNext() {
  if (_phQueue.length === 0) { _phPlaying = false; _phAudio = null; return; }
  _phPlaying = true;
  const { src, symbol, useJP } = _phQueue.shift();
  const a = new Audio();
  _phAudio = a;

  a.addEventListener('canplaythrough', () => {
    a.play().catch(() => _phNext());
  }, { once: true });

  a.addEventListener('ended', _phNext, { once: true });

  a.addEventListener('error', () => {
    if (useJP) {
      const grapheme = IPA_TO_JP[symbol] || symbol;
      speakTTS(PHONEME_TTS_FALLBACK[grapheme] || symbol);
    }
    _phNext();
  }, { once: true });

  a.preload = 'auto';
  a.src = src;
  a.load();
}

function playPhoneme(symbol, customUrl) {
  const useJP = !customUrl;
  const src = useJP ? (() => {
    const grapheme = IPA_TO_JP[symbol] || symbol;
    const fileKey  = PHONEME_FILE[grapheme] || grapheme;
    return `https://redskin106.github.io/lesson-a/shell-v2/assets/phonemes/sound_${fileKey}.mp3`;
  })() : customUrl;

  _phQueue.push({ src, symbol, useJP });
  if (!_phPlaying) _phNext();
}

function speakTTS(text) {
  if (!text || !window.speechSynthesis) return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-GB'; utt.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

/* ═══════════════════════════════════════════════
   RECORDER — full trio system
   Model / You / Re-record + compare card + history
═══════════════════════════════════════════════ */

// Per-word recording history — stored in localStorage
// key: 'vp_rec_{word}' → array of {ts, dataUrl} (last 3)
const REC_MAX = 3;

function recStorageKey(word) { return 'vp_rec_' + word; }

function loadRecHistory(word) {
  try { return JSON.parse(localStorage.getItem(recStorageKey(word)) || '[]'); }
  catch(e) { return []; }
}

function saveRecToHistory(word, blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      let history = loadRecHistory(word);
      history.push({ ts: Date.now(), dataUrl: reader.result });
      if (history.length > REC_MAX) history = history.slice(-REC_MAX);
      localStorage.setItem(recStorageKey(word), JSON.stringify(history));
      resolve(history);
    };
    reader.readAsDataURL(blob);
  });
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60)   return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// Single card trio state
let scModelAudio   = null;
let scModelPlaying = false;
let scSelfAudio    = null;
let scSelfPlaying  = false;
let scRecording    = false;
let scRecBlob      = null;
let scMediaRec     = null;

function resetSCTrio() {
  // Stop any active audio/recording
  if (scMediaRec && scRecording) { try { scMediaRec.stop(); } catch(e) {} }
  if (scModelAudio) { scModelAudio.pause(); scModelAudio = null; }
  if (scSelfAudio)  { scSelfAudio.pause();  scSelfAudio = null; }
  scModelPlaying = false; scSelfPlaying = false;
  scRecording = false; scRecBlob = null; scMediaRec = null;

  const modelBtn  = document.getElementById('sc-model-btn');
  const playBtn   = document.getElementById('sc-play-btn');
  const recBtn    = document.getElementById('sc-rec-btn');
  const recIcon   = document.getElementById('sc-rec-icon');
  const recLabel  = document.getElementById('sc-rec-label');
  const hint      = document.getElementById('sc-trio-hint');
  const compareCard = document.getElementById('sc-compare-card');
  const histWrap  = document.getElementById('sc-history-wrap');

  if (modelBtn) modelBtn.classList.remove('playing');
  if (playBtn)  { playBtn.classList.remove('ready','playing'); }
  if (recBtn)   { recBtn.classList.remove('recording'); }
  if (recIcon)  recIcon.textContent = '🎤';
  if (recLabel) recLabel.textContent = 'Record';
  if (hint)     hint.textContent = 'Hear the model, then record yourself.';
  if (compareCard) compareCard.style.display = 'none';

  // Render history + pre-load latest recording into You button
  if (histWrap) {
    const word = singleCards[currentSingleIdx]?.word;
    if (word) {
      renderRecHistory(word, histWrap);
      const hist = loadRecHistory(word);
      if (hist.length) {
        // Use atob() not fetch() — fetch(dataUrl) fails on some mobile browsers
        try {
          const dataUrl = hist[hist.length-1].dataUrl;
          const blob = dataUrlToBlob(dataUrl);
          scRecBlob = blob;
          const pb = document.getElementById('sc-play-btn');
          const rl = document.getElementById('sc-rec-label');
          if (pb) pb.classList.add('ready');
          if (rl) rl.textContent = 'Re-record';
        } catch(e) {}
      }
    }
  }
}

function renderRecHistory(word, container) {
  const history = loadRecHistory(word);
  if (!history.length) { container.innerHTML = ''; return; }
  const reversed = history.slice().reverse();
  container.innerHTML =
    '<div class="rec-history" style="margin-top:4px;">' +
    '<div class="rec-history-head">Past recordings</div>' +
    reversed.map((r, i) =>
      '<div class="rec-history-row">' +
      '<span class="rec-history-num">' + (history.length - i) + '</span>' +
      '<span class="rec-history-time">' + timeAgo(r.ts) + '</span>' +
      '<button class="rec-history-play">&#9654;</button>' +
      '</div>'
    ).join('') +
    '</div>';
  // Wire buttons via listeners — never embed dataUrls in HTML attributes
  const btns = container.querySelectorAll('.rec-history-play');
  reversed.forEach((r, i) => {
    if (btns[i]) btns[i].addEventListener('click', () => playDataUrl(r.dataUrl));
  });
}

function playDataUrl(dataUrl) {
  new Audio(dataUrl).play().catch(() => {});
}

function dataUrlToBlob(dataUrl) {
  const [header, b64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// Wire trio buttons after DOM is ready
function wireSCTrio() {
  const modelBtn    = document.getElementById('sc-model-btn');
  const playBtn     = document.getElementById('sc-play-btn');
  const recBtn      = document.getElementById('sc-rec-btn');
  const playIcon    = document.getElementById('sc-play-icon');
  const recIcon     = document.getElementById('sc-rec-icon');
  const recLabel    = document.getElementById('sc-rec-label');
  const hint        = document.getElementById('sc-trio-hint');
  const compareCard = document.getElementById('sc-compare-card');
  const compareSub  = document.getElementById('sc-compare-sub');
  const comparePlay = document.getElementById('sc-compare-play');
  const wordAudioBtn = document.getElementById('sc-word-audio');
  const sentAudioBtn = document.getElementById('sc-sentence-audio');

  if (!modelBtn) return;
  // Audio buttons use global onclick handlers (playWordAudio, playSentenceAudio, playModelAudio)
  // Only wire the record/playback trio below

  // You / playback button
  function stopSCSelf() {
    if (scSelfAudio) { scSelfAudio.pause(); scSelfAudio = null; }
    scSelfPlaying = false;
    playIcon.textContent = '▶';
    playBtn.classList.remove('playing');
  }

  playBtn.addEventListener('click', () => {
    if (!scRecBlob) return;
    if (scSelfPlaying) { stopSCSelf(); return; }
    scSelfPlaying = true;
    playIcon.textContent = '⏸';
    playBtn.classList.add('playing');
    const url = URL.createObjectURL(scRecBlob);
    scSelfAudio = new Audio(url);
    scSelfAudio.onended = () => { stopSCSelf(); URL.revokeObjectURL(url); };
    scSelfAudio.onerror = () => { stopSCSelf(); URL.revokeObjectURL(url); };
    scSelfAudio.play().catch(stopSCSelf);
  });

  // Record button
  recBtn.addEventListener('click', async () => {
    if (scRecording) {
      scMediaRec?.stop();
      return;
    }
    stopSCSelf();
    window.speechSynthesis?.cancel();
    scModelPlaying = false;
    modelBtn.classList.remove('playing');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      const chunks = [];
      scMediaRec = new MediaRecorder(stream, { mimeType });
      scMediaRec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      scMediaRec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        scRecording = false;
        recIcon.textContent  = '🎤';
        recLabel.textContent = 'Re-record';
        recBtn.classList.remove('recording');
        scRecBlob = new Blob(chunks, { type: mimeType });
        playBtn.classList.add('ready');
        hint.textContent = 'Listen to both, then rate yourself.';

        // Save to history
        const card = singleCards[currentSingleIdx];
        const history = await saveRecToHistory(card.word, scRecBlob);

        // Show compare card if prior exists
        if (history.length >= 2) {
          const prev = history[history.length - 2];
          compareSub.textContent = 'Recorded ' + timeAgo(prev.ts);
          compareCard.style.display = 'flex';
          comparePlay.onclick = () => new Audio(prev.dataUrl).play().catch(()=>{});
        }

        // Refresh history list
        renderRecHistory(card.word, document.getElementById('sc-history-wrap'));
      };
      scMediaRec.start();
      scRecording = true;
      recIcon.textContent  = '⏹';
      recLabel.textContent = 'Stop';
      recBtn.classList.add('recording');
      hint.textContent = 'Recording… tap ⏹ to stop.';
    } catch(e) {
      hint.textContent = '⚠️ Microphone access needed.';
    }
  });
}

// Simple global audio handlers — called directly from HTML onclick
function playWordAudio() {
  const card = singleCards[currentSingleIdx];
  if (!card) return;
  playAudio(card.wordAudio, card.word);
}
function playSentenceAudio() {
  const card = singleCards[currentSingleIdx];
  if (!card) return;
  playAudio(card.sentenceAudio, card.sentence);
}
function playModelAudio() {
  const card = singleCards[currentSingleIdx];
  if (!card) return;
  const modelBtn = document.getElementById('sc-model-btn');
  if (modelBtn) modelBtn.classList.add('playing');
  const done = () => { if (modelBtn) modelBtn.classList.remove('playing'); };
  if (card.wordAudio) {
    const a = new Audio(card.wordAudio);
    a.onended = done; a.onerror = () => { speakTTS(card.word); done(); };
    a.play().catch(() => { speakTTS(card.word); done(); });
  } else {
    const utt = new SpeechSynthesisUtterance(card.word);
    utt.lang = 'en-GB'; utt.rate = 0.82;
    utt.onend = done;
    window.speechSynthesis?.cancel();
    window.speechSynthesis?.speak(utt);
  }
}

function highlightWord(sentence, word) {
  if (!sentence || !word) return sentence || '';
  const re = new RegExp(`\\b(${word})\\b`, 'gi');
  return sentence.replace(re, '<span class="sentence-hl">$1</span>');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goIndex() {
  showScreen('screen-index');
  buildGrid(); // refresh dots
}

/* ── Pair trio record ── */
function togglePairRec(btn, word, side) {
  const youBtn  = document.getElementById('pair-you-'  + side + '-' + word);
  const recIcon = document.getElementById('pair-ri-'   + side + '-' + word);
  const recLbl  = document.getElementById('pair-rl-'   + side + '-' + word);
  const hint    = document.getElementById('pair-hint-' + side + '-' + word);
  const histEl  = document.getElementById('pair-hist-' + side + '-' + word);
  if (btn.classList.contains('recording')) { btn._mr?.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
    const mime='audio/webm'; const chunks=[];
    const mr = new MediaRecorder(stream,{mimeType:mime});
    btn._mr = mr;
    mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      btn.classList.remove('recording');
      if(recIcon) recIcon.textContent='&#127908;';
      if(recLbl)  recLbl.textContent='Re-record';
      const blob = new Blob(chunks,{type:mime});
      if(youBtn){ youBtn.classList.add('ready'); youBtn.onclick=()=>new Audio(URL.createObjectURL(blob)).play().catch(()=>{}); }
      const hist = await saveRecToHistory(word,blob);
      if(histEl) renderPairHistory(hist,histEl);
      if(hint) hint.textContent='Listen to both, then rate yourself.';
    };
    mr.start();
    btn.classList.add('recording');
    if(recIcon) recIcon.textContent='&#9209;';
    if(recLbl)  recLbl.textContent='Stop';
    if(hint)    hint.textContent='Recording... tap Stop.';
  }).catch(()=>{ if(recLbl) recLbl.textContent='No mic'; });
}

function renderPairHistory(history, el) {
  if (!history.length) { el.innerHTML = ''; return; }
  const reversed = history.slice().reverse();
  el.innerHTML =
    '<div class="rec-history" style="margin-top:4px;">' +
    '<div class="rec-history-head">Past recordings</div>' +
    reversed.map((r, i) =>
      '<div class="rec-history-row">' +
      '<span class="rec-history-num">' + (history.length - i) + '</span>' +
      '<span class="rec-history-time">' + timeAgo(r.ts) + '</span>' +
      '<button class="rec-history-play">&#9654;</button>' +
      '</div>'
    ).join('') + '</div>';
  const btns = el.querySelectorAll('.rec-history-play');
  reversed.forEach((r, i) => {
    if (btns[i]) btns[i].addEventListener('click', () => playDataUrl(r.dataUrl));
  });
}

function initPairYouBtn(word, side) {
  const hist = loadRecHistory(word);
  if (!hist.length) return;
  try {
    const blob = dataUrlToBlob(hist[hist.length-1].dataUrl);
    const youBtn=document.getElementById('pair-you-'+side+'-'+word);
    const histEl=document.getElementById('pair-hist-'+side+'-'+word);
    if(youBtn){ youBtn.classList.add('ready'); youBtn.onclick=()=>new Audio(URL.createObjectURL(blob)).play().catch(()=>{}); }
    if(histEl) renderPairHistory(hist,histEl);
  } catch(e) {}
}
