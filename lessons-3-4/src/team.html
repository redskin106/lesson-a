<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team page</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:#f4f2fb;color:#1c1b2e;padding:18px;min-height:100vh}
h1{font-size:28px;margin-bottom:10px}.card{background:#fff;border-radius:28px;padding:20px;margin:12px 0;box-shadow:0 8px 30px rgba(80,60,160,.12);font-size:22px}
.sw{display:flex;gap:14px;flex-wrap:wrap}.sw button{width:84px;height:84px;border-radius:24px;border:4px solid #fff;font:inherit;font-size:34px;font-weight:800;color:#fff;cursor:pointer}
.ltr button{background:#6a35e8}.big{font-size:44px;font-weight:800}.pic{font-size:90px;text-align:center}.hide{opacity:.5;background:repeating-linear-gradient(45deg,#eee,#eee 10px,#f7f7f7 10px,#f7f7f7 20px);text-align:center;padding:30px}
button.b{font:inherit;font-weight:700;font-size:22px;padding:12px 26px;border-radius:999px;border:0;background:#6a35e8;color:#fff;margin:6px 6px 6px 0}button.g{background:#d9d3f5;color:#333}
.w{display:inline-block;font-weight:700;font-size:24px;padding:8px 16px;margin:4px;border-radius:18px;border:3px solid #d9d3f5;background:#fff;cursor:pointer;font-family:inherit}.w.u{opacity:.25}
textarea{font:inherit;font-size:22px;width:100%;height:120px;border-radius:18px;border:3px solid #d9d3f5;padding:12px}.mu{color:#6a6a7e}.hand{font-size:40px;padding:26px;border-radius:30px;color:#fff;text-align:center;font-weight:800;margin-top:14px}
.top{display:flex;align-items:center;gap:12px}.rd button{width:56px;height:56px;border-radius:50%;border:3px solid #d9d3f5;background:#fff;font:inherit;font-weight:800;font-size:24px}.rd button.on{background:#6a35e8;color:#fff}
</style></head><body><div id="app"></div><script>
const D=__DATA__;const q=new URLSearchParams(location.search);const N=q.get('case')==='4'?4:3;const C=D['l'+N];const K='sxl-team';
let me=JSON.parse(localStorage.getItem(K)||'null')||{};let r=1;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(K,JSON.stringify(me));
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
const ROLES=['Reader','Asker','Writer','Speaker'];
function draw(){const a=$('app');
 if(!me.team||!me.letter){a.innerHTML=`<h1>Your team</h1><div class="card">Colour card?<div class="sw">${D.teams.map(t=>`<button style="background:${t[2]}" onclick="me.team='${t[0]}';save();draw()">${t[1][0]}</button>`).join('')}</div></div><div class="card">Letter card?<div class="sw ltr">${['A','B','C','D'].map(l=>`<button onclick="me.letter='${l}';save();draw()">${l}</button>`).join('')}</div></div><div class="mu">Your teacher gave you a card.</div>`;return}
 const t=D.teams.find(x=>x[0]===me.team),li='ABCD'.indexOf(me.letter);const clue=C.clues.find(c=>c.team===me.team&&c.r===r);
 let h=`<div class="top"><h1 style="color:${t[2]}">${t[1]} · ${me.letter}</h1><div class="rd" style="margin-left:auto">${[1,2,3,4].map(i=>`<button class="${i===r?'on':''}" onclick="r=${i};draw()">${i}</button>`).join('')}</div></div>`;
 if(N===3){const role=ROLES[(li+r-1)%4];h+=`<div class="card"><div class="big">${role}</div>`;
  if(role==='Reader'){h+=clue.kind==='audio'?`<div class="mu">Build the question. Then listen.</div><div id="qb"></div>`:`<div class="pic">${clue.pic}</div><div style="font-size:30px;text-align:center">${clue.text.replace(/\n/g,'<br>')}</div><div class="mu" style="margin-top:8px">Do not show it. Answer your team's questions.</div>`}
  if(role==='Asker')h+=`<div>Ask the Reader:</div><div class="big" style="font-size:30px">${{audio:'Reader: build the question first!',number:'What is the number? What is normal?',photo:'What can you see? Where?',paper:'What does it say?'}[clue.kind]}</div>`;
  if(role==='Writer')h+=`<div>Write one sentence:</div><div class="mu">It might be ___ because ___.<br>It can't be ___ because ___.<br>It is higher / lower than normal.</div><textarea></textarea>`;
  if(role==='Speaker')h+=`<div>When the Writer is ready, put your hands up. Say the sentence loudly.</div>`;h+='</div>'}
 else{const d=D.dials[li];h+=`<div class="card" style="background:${d[2]};color:#fff"><div class="big">${d[0]} · ${d[1]}</div><div style="margin-top:6px">${d[3]}</div></div>`;
  h+=`<div class="card"><div class="pic">${clue.pic}</div><div style="font-size:34px;text-align:center"><b>${clue.dials[me.letter]}</b></div></div><div class="card">${li===r-1?'<div class="big">🎤 You speak this round!</div>':'<div class="big">Tell your speaker</div>'}<div class="mu">Say at least one dial: how often · how long · how bad · compared with normal.</div><textarea placeholder="Write the team sentence"></textarea></div>`}
 h+=`<button class="b" onclick="$('hd').style.display='block'">✋ We are ready</button><div id="hd" class="hand" style="display:none;background:${t[2]}">✋ hands up!</div><button class="b g" onclick="me={};save();draw()">change team</button>`;a.innerHTML=h;
 if(N===3&&clue.kind==='audio'&&ROLES[(li+r-1)%4]==='Reader'){const w=clue.ask.split(' '),box=$('qb');let n=0;const ans=document.createElement('div');ans.style.cssText='min-height:50px;font-size:26px;font-weight:700;margin:8px 0';box.appendChild(ans);shuffle(w.concat(['did','are'])).forEach(x=>{const b=document.createElement('button');b.className='w';b.textContent=x;b.onclick=()=>{if(x===w[n]){n++;b.classList.add('u');ans.textContent+=x+' ';if(n===w.length){const p=document.createElement('button');p.className='b';p.textContent='🔊 Listen';p.onclick=()=>say(clue.text);box.appendChild(p);say(clue.text)}}};box.appendChild(b)})}}
draw();
</script></body></html>
