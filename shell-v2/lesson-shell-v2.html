<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EFL Lesson</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0D1B2A;
  --surface:    #162436;
  --surface2:   #1E3248;
  --text:       #EEF2F7;
  --text-dim:   #7A9BBF;
  --accent:     #4FC3F7;
  --bronze:     #CD7F32;
  --bronze-bg:  rgba(205,127,50,0.15);
  --silver:     #A0AEC0;
  --silver-bg:  rgba(160,174,192,0.15);
  --gold:       #FFD700;
  --gold-bg:    rgba(255,215,0,0.12);
  --pass:       #4CAF50;
  --fail:       #EF5350;
  --radius:     12px;
  --radius-sm:  8px;
}

html, body {
  height: 100%;
  background: #0a0a0e;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}

.screen {
  display: none;
  flex-direction: column;
  height: 100dvh;
  overflow-y: auto;
  padding: 28px 20px 32px;
}
.screen.active { display: flex; }

/* ─── NAME PICKER ─────────────────────────── */

.welcome-label {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.welcome-title {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 4px;
}
.welcome-sub {
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 28px;
}
.name-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.name-btn {
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  color: rgba(255,255,255,0.85);
  font-size: 4.2cqw;
  font-weight: 600;
  padding: 4% 3%;
  min-height: 14cqw;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}
.name-btn.selected {
  border-color: var(--accent);
  background: rgba(79,195,247,0.1);
  color: var(--accent);
}
.start-btn {
  background: rgba(79,195,247,0.14);
  border: 1.5px solid rgba(79,195,247,0.5);
  color: var(--accent);
  border-radius: 999px;
  font-size: 4.6cqw;
  font-weight: 600;
  padding: 4% 6%;
  width: 100%;
  cursor: pointer;
  opacity: 0.25;
  pointer-events: none;
  transition: opacity 0.2s, background 0.15s;
  margin-top: auto;
  font-family: inherit;
}
.start-btn.ready { opacity: 1; pointer-events: auto; }

/* ─── MODULE SCREEN ──────────────────────── */

.module-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.student-name {
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 600;
}
.tier-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
}
.tier-badge.bronze { background: var(--bronze-bg); color: var(--bronze); }
.tier-badge.silver { background: var(--silver-bg); color: var(--silver); }
.tier-badge.gold   { background: var(--gold-bg);   color: var(--gold);   }

.progress-row {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.pip {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  transition: background 0.3s;
}
.pip.done    { background: var(--pass); }
.pip.current { background: var(--accent); }

.tier-track {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}
.tier-seg {
  flex: 1;
  padding: 9px 6px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.25;
  transition: opacity 0.3s;
}
.tier-seg.bronze { background: var(--bronze-bg); color: var(--bronze); }
.tier-seg.silver { background: var(--silver-bg); color: var(--silver); }
.tier-seg.gold   { background: var(--gold-bg);   color: var(--gold);   }
.tier-seg.active { opacity: 1; }
.tier-seg.passed { opacity: 0.65; }
.tier-seg.passed::after { content: ' ✓'; }

#module-container { flex: 1; }

/* ─── TIER RESULT SCREEN ─────────────────── */

.result-icon  { font-size: 64px; text-align: center; margin: 28px 0 14px; }
.stars-row-v2 { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 28px 0 14px; min-height: 64px; }
.stars-row-v2 img { width: 56px; height: 56px; }
.stars-row-frame-v2 { display: flex; justify-content: center; align-items: center; gap: 3%; margin-bottom: 4%; min-height: 12cqw; }
.stars-row-frame-v2 img { width: 10cqw; height: 10cqw; }
.result-title { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 6px; }
.result-score { font-size: 17px; color: var(--text-dim); text-align: center; margin-bottom: 28px; }
.result-score span { color: var(--text); font-weight: 700; }
.result-msg {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 16px 20px;
  font-size: 15px;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.6;
}
.result-msg strong { color: var(--text); }

.cta-btn {
  display: block; width: 100%;
  background: var(--accent); color: #0D1B2A;
  border: none; border-radius: var(--radius);
  font-size: 18px; font-weight: 700;
  padding: 18px; cursor: pointer;
  text-align: center; margin-bottom: 12px;
}
.secondary-btn {
  display: block; width: 100%;
  background: rgba(255,255,255,0.06); color: var(--text);
  border: 1.5px solid rgba(255,255,255,0.14); border-radius: 999px;
  font-size: 3.6cqw; font-weight: 500;
  padding: 3% 5%; cursor: pointer; text-align: center;
  font-family: inherit;
}

/* ─── END SCREEN ─────────────────────────── */

.end-header { text-align: center; padding: 16px 0 20px; }
.end-trophy  { font-size: 56px; margin-bottom: 10px; }
.end-name    { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.end-total   { font-size: 15px; color: var(--text-dim); }
.end-total span { color: var(--accent); font-weight: 700; }

.summary-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }

.summary-item {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.summary-item-label  { font-size: 15px; font-weight: 600; }
.summary-item-detail { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.summary-status {
  font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; white-space: nowrap;
}
.summary-status.complete   { background: rgba(76,175,80,0.15);  color: var(--pass); }
.summary-status.incomplete { background: rgba(239,83,80,0.15);  color: var(--fail); }

.summary-item.replayable { cursor: pointer; transition: background .15s; }
.summary-item.replayable:active { background: var(--surface); }
.summary-stars { font-size: 14px; letter-spacing: 1px; }
.summary-replay-hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.summary-candoo {
  font-size: 12px; color: var(--gold); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}

.selfassess-wrap { text-align: center; padding: 8px 0 4px; }
.selfassess-prompt { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.selfassess-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.selfassess-btn {
  flex: 1; max-width: 110px; background: var(--surface2); border: 2px solid transparent;
  border-radius: var(--radius); padding: 16px 8px; cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.selfassess-btn .emoji { font-size: 28px; }
.selfassess-btn .label { font-size: 11px; color: var(--text-dim); }
.selfassess-btn.selected { border-color: var(--accent); background: rgba(79,195,247,0.1); }

.vocab-review-summary { margin-bottom: 16px; }
.vocab-review-line {
  background: var(--surface2); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius);
  padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
}
.vocab-review-line::after { content: '▾'; color: var(--text-dim); font-size: 12px; }
.vocab-review-line.open::after { content: '▴'; }
.vocab-review-panel {
  background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius); padding: 10px 16px 14px;
}
.vocab-review-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); gap: 8px;
}
.vocab-review-row:last-of-type { border-bottom: none; }
.vocab-review-word { font-size: 13px; color: var(--text); font-weight: 600; flex: 1; }
.vocab-review-status { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.vocab-review-adjust { display: flex; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
.vocab-adjust-btn {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  padding: 5px 4px; font-size: 10.5px; color: var(--text-dim); cursor: pointer; font-family: inherit;
}
.vocab-adjust-btn:active { background: rgba(255,255,255,0.12); }
.vocab-adjust-btn.applied { color: var(--pass); border-color: var(--pass); }

.retry-btn {
  display: block; width: 100%;
  background: transparent; color: var(--text);
  border: 2px solid var(--fail); border-radius: var(--radius);
  font-size: 16px; font-weight: 600;
  padding: 16px; cursor: pointer; text-align: center; margin-bottom: 12px;
}
.done-btn {
  display: block; width: 100%;
  background: rgba(139,195,74,0.14); color: #AED581;
  border: 1.5px solid rgba(139,195,74,0.5); border-radius: 999px;
  font-size: 4.6cqw; font-weight: 600;
  padding: 4% 6%; cursor: pointer; text-align: center;
  font-family: inherit;
}

/* ─── MY LEARNING JOURNEY ──────────── */
.journey-empty {
  text-align: center; padding: 40px 20px; color: var(--text-dim);
  font-size: 15px; line-height: 1.6;
}
.journey-unit { margin-bottom: 24px; }
.journey-unit-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.journey-lesson-card {
  background: var(--surface2); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px;
}
.journey-lesson-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.journey-lesson-bar-track {
  width: 100%; height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-bottom: 6px;
}
.journey-lesson-bar-fill {
  height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s;
}
.journey-lesson-detail { font-size: 12.5px; color: var(--text-dim); }

/* ─── MODULE: AUDIO UNDERSTANDING ──────────── */

.module-title    { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.module-question { font-size: 15px; color: var(--text-dim); margin-bottom: 20px; }

.listen-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  background: var(--surface2);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-size: 16px; font-weight: 700;
  padding: 16px; cursor: pointer; margin-bottom: 20px;
  transition: background 0.15s;
}
.listen-btn.playing { background: rgba(79,195,247,0.1); }

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.option-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px; font-weight: 500;
  padding: 16px 12px; min-height: 64px;
  cursor: pointer; text-align: center;
  transition: border-color 0.15s, background 0.15s, opacity 0.25s;
}
.option-btn.correct { border-color: var(--pass); background: rgba(76,175,80,0.12); color: var(--pass); }
.option-btn.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.1);  color: var(--fail); }
.option-btn:disabled { cursor: default; }
.option-btn.locked  { opacity: 0; pointer-events: none; }

.next-ex-btn {
  display: block; width: 100%;
  background: var(--accent); color: #0D1B2A;
  border: none; border-radius: var(--radius);
  font-size: 18px; font-weight: 700;
  padding: 18px; cursor: pointer; margin-top: 20px;
}

/* ─── MODULE: GAP FILL ──────────────────────── */

.sentence-display {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 20px 18px;
  font-size: 18px;
  line-height: 2;
  margin-bottom: 20px;
}
.blank-slot {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px solid var(--accent);
  color: var(--accent);
  font-weight: 700;
  text-align: center;
  padding: 0 6px;
  transition: color 0.2s, border-color 0.2s;
}
.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 4px;
}
.word-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px; font-weight: 600;
  padding: 12px 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.word-btn.selected { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }
.word-btn.correct  { border-color: var(--pass);   color: var(--pass); }
.word-btn.wrong    { border-color: var(--fail);   color: var(--fail); }
.word-btn:disabled { cursor: default; }

/* ─── MODULE: TRUE / FALSE ──────────────────── */

.tf-statement {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 24px 20px;
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 28px;
  text-align: center;
}
.tf-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.tf-btn {
  border: 2px solid transparent;
  border-radius: var(--radius);
  font-size: 19px; font-weight: 700;
  padding: 24px 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.tf-btn.true-btn  { background: rgba(76,175,80,0.1);  color: var(--pass); border-color: var(--pass); }
.tf-btn.false-btn { background: rgba(239,83,80,0.1);  color: var(--fail); border-color: var(--fail); }
.tf-btn.highlight-correct { background: var(--pass);  color: #fff; border-color: var(--pass); }
.tf-btn.highlight-wrong   { background: var(--fail);  color: #fff; border-color: var(--fail); }
.tf-btn:disabled { cursor: default; opacity: 0.7; }

/* ─── MODULE: WORD MATCH ────────────────────── */

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.match-col { display: flex; flex-direction: column; gap: 8px; }
.match-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  padding: 12px 10px;
  min-height: 54px;
  cursor: pointer; text-align: center;
  line-height: 1.3;
  transition: all 0.15s;
}
.match-btn.selected   { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }
.match-btn.matched    { border-color: var(--pass);   background: rgba(76,175,80,0.12); color: var(--pass); pointer-events: none; }
.match-btn.wrong-flash { border-color: var(--fail);  background: rgba(239,83,80,0.1); }
.match-score {
  font-size: 14px; color: var(--text-dim);
  text-align: center; margin-bottom: 12px;
}

/* ─── MODULE: SEQUENCING ────────────────────── */

.seq-prompt { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; }
.seq-slots  { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.seq-slot {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface2);
  border: 2px dashed rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  padding: 12px 14px; min-height: 50px;
  transition: border-color 0.2s, background 0.2s;
}
.seq-slot.filled  { border-style: solid; border-color: var(--accent); cursor: pointer; }
.seq-slot.correct { border-color: var(--pass); background: rgba(76,175,80,0.1); }
.seq-slot.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.08); }
.slot-num {
  width: 24px; height: 24px; flex-shrink: 0;
  background: var(--surface); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  transition: background 0.2s, color 0.2s;
}
.seq-slot.filled .slot-num { background: var(--accent); color: #0D1B2A; }
.slot-text { font-size: 15px; font-weight: 600; }
.seq-pool-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.seq-pool  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.seq-item {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  padding: 11px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.seq-item:active { background: var(--surface); }
.seq-item.used   { opacity: 0.2; pointer-events: none; }

/* ─── MODULE: AUDIO SPEAKING ────────────────── */

.speak-target {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 5% 5%;
  font-size: 5.4cqw; font-weight: 600;
  color: #fff;
  text-align: center; line-height: 1.5;
  margin-bottom: 5%;
}

/* Three-button comparison row */
.speak-trio {
  display: flex; justify-content: center;
  gap: 4%;
  margin-bottom: 4%;
}
.trio-btn {
  width: 22%; aspect-ratio: 1/1; border-radius: 16%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6%;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid var(--surface2);
  cursor: pointer;
  transition: all 0.2s;
}
.trio-btn .trio-icon  { font-size: 6cqw; line-height: 1; }
.trio-btn .trio-label { font-size: 2.6cqw; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }

/* Model button — accent blue */
.trio-btn.model { border-color: var(--accent); color: var(--accent); }
.trio-btn.model .trio-label { color: var(--accent); }
.trio-btn.model.playing { background: rgba(79,195,247,0.1); }

/* Playback button — purple, disabled until recorded */
.trio-btn.playback { border-color: #AB47BC; color: #CE93D8; opacity: 0.3; pointer-events: none; }
.trio-btn.playback .trio-label { color: #AB47BC; }
.trio-btn.playback.ready { opacity: 1; pointer-events: auto; }
.trio-btn.playback.playing { background: rgba(171,71,188,0.1); }

/* Record button — red */
.trio-btn.record { border-color: var(--fail); color: var(--fail); }
.trio-btn.record .trio-label { color: var(--fail); }
.trio-btn.record.recording {
  background: rgba(239,83,80,0.1);
  animation: pulse-record 1s ease-in-out infinite;
}
@keyframes pulse-record {
  0%, 100% { box-shadow: 0 0 0 0   rgba(239,83,80,0.4); }
  50%       { box-shadow: 0 0 0 8px rgba(239,83,80,0);   }
}

.speak-hint {
  font-size: 3cqw; color: var(--text-dim);
  text-align: center; margin-bottom: 4%; min-height: 4cqw;
}

/* Self-assess — appears after first recording */
.assess-btns { display: flex; flex-direction: column; gap: 2.5%; margin-bottom: 2%; }
.assess-btn {
  border: 1.5px solid transparent; border-radius: 999px;
  font-size: 3.4cqw; font-weight: 600; padding: 3% 0; cursor: pointer;
  transition: all 0.15s; text-align: center;
}
.assess-yes { background: rgba(76,175,80,0.1); color: var(--pass); border-color: var(--pass); }
.assess-no  { background: rgba(239,83,80,0.1); color: var(--fail); border-color: var(--fail); }
.assess-btn.selected.assess-yes { background: var(--pass); color: #fff; }
.assess-btn.selected.assess-no  { background: var(--fail); color: #fff; }
.assess-btn:disabled { cursor: default; opacity: 0.5; }
.share-link {

/* ═══════════════════════════════════════════════════════
   SHELL V2 — Phone-frame chrome, adopted from module-demos.
   This replaces the flat header/pips/tier-track for
   screen-module. Modules only ever render into #module-container
   (= .block-flowzone), never touch the frame chrome directly.
   ═══════════════════════════════════════════════════════ */
#screen-module.screen { padding: 0; align-items: center; justify-content: center; }
.frame-wrap { width: min(400px, 100vw); max-height: 94vh; position: relative; container-type: inline-size; }
.frame-wrap::before { content: ''; display: block; padding-top: 215%; }
.app-frame {
  position: absolute; inset: 0; overflow: hidden; isolation: isolate;
  border-radius: 12cqw;
  clip-path: inset(0 0 0 0 round 12cqw);
}
.layer-bg    { position: absolute; inset: 0; background-image: url('assets/bg_and_border.png'); background-size: 100% 100%; z-index: 0; pointer-events: none; }
.layer-scene { position: absolute; left: 4%; top: 55%; width: 92%; height: 38%; background-image: url('assets/school_scene.png'); background-size: 100% 100%; z-index: 1; transition: top 0.35s ease, opacity 0.35s ease; }
.frame-mask  { position: absolute; top: -4px; left: 0; right: 0; bottom: 0; z-index: 5; background-image: url('assets/frame_mask.png'); background-size: 100% 100%; pointer-events: none; }

.pos            { position: absolute; z-index: 2; }
.block-header   { left: 12.92%; top: 8.06%;  width: 75%;    height: 3.5%; }
.block-qlabel   { left: 13.08%; top: 15.3%; width: 75%;    height: 2.6%; display: flex; align-items: center; }
.block-progress { left: 13.08%; top: 19.69%; width: 75.17%; height: 1.01%; }
.block-flowzone { left: 13.00%; top: 24.99%; width: 75.08%; bottom: 4%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.choice-zone    { left: 6%;     top: 15%;    width: 88%;    bottom: 4%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* module-container specifically reverts to natural, unbounded growth —
   repositionSceneLayer() (see JS) depends on measuring its TRUE content
   height to decide where to slide the illustration; a bounded/scrollable
   container always reports roughly the same bottom edge regardless of
   actual content, which silently breaks that entire mechanism. The
   bookend screens (name/end/journey) still get the bounded+scrollable
   treatment from .block-flowzone above, since they don't use scene
   repositioning at all. */
#module-container { bottom: auto; overflow-y: visible; }
/* Clip module content at the scene boundary so it never paints over the illustration */
#screen-module .block-flowzone { overflow: hidden; }

// ══════════════════════════════════════════════════
//  LOCAL PROGRESS DATABASE
//  One IndexedDB shared by every module that needs to remember something
//  across sessions, keyed by student name first (handles shared classroom
//  devices — a student only sees their own data as long as they pick their
//  own name). Three stores:
//    - recordings:    Say It self-eval audio, last 3 attempts per exercise
//    - tierResults:   pass/fail + score history, powers the future student
//                      progress dashboard and lets returning students keep
//                      their unlocked tiers instead of starting over
//    - wordExposure:  reserved for future spaced-repetition vocabulary
//                      tracking — created now, empty, so adding it later
//                      never needs an IndexedDB version-bump migration
// ══════════════════════════════════════════════════
const PROGRESS_DB_NAME = 'efl-progress';
const PROGRESS_DB_VERSION = 3; // bumped to add sessionTracker for spaced repetition — IndexedDB only runs onupgradeneeded on a version increase
let _progressDBPromise = null;

function openProgressDB() {
  if (_progressDBPromise) return _progressDBPromise;

  // Ask the browser for stronger persistence guarantees on this data — by
  // default, storage is "best-effort" and browsers (Safari on iOS
  // especially) can evict it under storage pressure, in Private Browsing,
  // or after a period of disuse. This doesn't force anything and the grant
  // outcome is deliberately ignored here (fire-and-forget, never awaited)
  // — recordings/progress still work either way, this just lowers the odds
  // of silent data loss. Guarded so it can never throw on an older browser.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  _progressDBPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(PROGRESS_DB_NAME, PROGRESS_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('recordings'))   db.createObjectStore('recordings',   { keyPath: 'key' });
      if (!db.objectStoreNames.contains('tierResults'))   db.createObjectStore('tierResults',   { keyPath: 'key' });
      if (!db.objectStoreNames.contains('wordExposure'))   db.createObjectStore('wordExposure',   { keyPath: 'key' });
      if (!db.objectStoreNames.contains('selfAssessments'))   db.createObjectStore('selfAssessments',   { keyPath: 'key' });
      if (!db.objectStoreNames.contains('sessionTracker'))   db.createObjectStore('sessionTracker',   { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    // Without this, a version-bump open request just hangs forever (neither
    // onsuccess nor onerror fires) if an older tab still has the DB open at
    // the previous version — reject explicitly instead of leaving every
    // awaiting caller (saveTierResult, saveSelfAssessment, etc.) stuck.
    req.onblocked = () => reject(new Error('Progress database is open in another tab — please close other tabs of this lesson and reload.'));
  });
  return _progressDBPromise;
}

function _idbGet(storeName, key) {
  return openProgressDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  })).catch(() => null); // local storage is a nice-to-have, never block the lesson on it failing
}
function _idbPut(storeName, value) {
  return openProgressDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  })).catch(() => {}); // same — a failed save shouldn't interrupt the student
}
function _idbGetAllForStudent(storeName, studentPrefix) {
  return openProgressDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve((req.result || []).filter(r => r.key.startsWith(studentPrefix)));
    req.onerror = () => reject(req.error);
  })).catch(() => []);
}

function recordingKey(student, moduleIndex, tier, itemIndex) {
  return `${student}::${LESSON_ID}::${moduleIndex}::${tier}::${itemIndex}`;
}
async function saveRecording(student, moduleIndex, tier, itemIndex, blob) {
  const key = recordingKey(student, moduleIndex, tier, itemIndex);
  const existing = await _idbGet('recordings', key);
  const attempts = (existing && existing.attempts) || [];
  attempts.push({ timestamp: Date.now(), blob });
  while (attempts.length > 3) attempts.shift(); // keep the last 3 only
  await _idbPut('recordings', { key, attempts });
  return attempts;
}
async function getRecordings(student, moduleIndex, tier, itemIndex) {
  const rec = await _idbGet('recordings', recordingKey(student, moduleIndex, tier, itemIndex));
  return (rec && rec.attempts) || [];
}

function tierResultKey(student, moduleIndex, tier) {
  return `${student}::${LESSON_ID}::${moduleIndex}::${tier}`;
}
async function saveTierResult(student, moduleIndex, tier, score, passed) {
  const key = tierResultKey(student, moduleIndex, tier);
  // lessonId/lessonName are explicit fields here, not just embedded in the
  // key string — needed so a cross-lesson view can query and group by
  // lesson without having to parse the key format.
  await _idbPut('tierResults', { key, student, lessonId: LESSON_ID, lessonName: LESSON_NAME, lessonUnit: LESSON_UNIT, moduleIndex, tier, score, passed, totalModules: LESSON.length, updatedAt: Date.now() });
}
async function getTierResultsForStudent(student) {
  return _idbGetAllForStudent('tierResults', `${student}::${LESSON_ID}::`);
}
// Genuine cross-lesson query — every tierResults record this student has,
// from every lesson they've touched on this device, not just this one.
// Filters by the student field directly rather than key-prefix matching,
// since a cross-lesson record's key won't share this lesson's LESSON_ID
// prefix at all.
async function getAllTierResultsForStudent(student) {
  return openProgressDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('tierResults', 'readonly');
    const req = tx.objectStore('tierResults').getAll();
    req.onsuccess = () => resolve((req.result || []).filter(r => r.student === student));
    req.onerror = () => reject(req.error);
  })).catch(() => []);
}

// The 8 survival units, in curriculum order — "Other" catches lessons
// published before LESSON_UNIT existed, or ones deliberately left
// unassigned, so nothing silently disappears from the view.
const JOURNEY_UNIT_ORDER = ['Identity', 'Numbers & Money', 'Food', 'Transport', 'Health', 'Time', 'Technology', 'Work', 'Other'];

// Groups raw tierResults records into per-lesson, then per-unit summaries.
// Per lesson: takes the HIGHEST score per module across whichever tiers
// were attempted (same "best tier reached" logic showEndScreen already
// uses for a single lesson), then averages across attempted modules.
function aggregateJourneyData(results) {
  const byLesson = new Map();
  results.forEach(r => {
    if (!byLesson.has(r.lessonId)) {
      byLesson.set(r.lessonId, {
        lessonId: r.lessonId, lessonName: r.lessonName || r.lessonId,
        lessonUnit: r.lessonUnit || 'Other', totalModules: r.totalModules || null,
        moduleScores: new Map(),
      });
    }
    const entry = byLesson.get(r.lessonId);
    const existing = entry.moduleScores.get(r.moduleIndex);
    if (existing === undefined || r.score > existing) entry.moduleScores.set(r.moduleIndex, r.score);
  });

  const lessons = [...byLesson.values()].map(entry => {
    const scores = [...entry.moduleScores.values()];
    const avgScore = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
    return {
      lessonId: entry.lessonId,
      lessonName: entry.lessonName,
      lessonUnit: entry.lessonUnit,
      modulesAttempted: scores.length,
      totalModules: entry.totalModules,
      avgScorePct: Math.round(avgScore * 100),
    };
  });

  const byUnit = new Map();
  lessons.forEach(l => {
    if (!byUnit.has(l.lessonUnit)) byUnit.set(l.lessonUnit, []);
    byUnit.get(l.lessonUnit).push(l);
  });
  return byUnit;
}

function journeyLessonCardHtml(l) {
  const totalLabel = l.totalModules ? `${l.modulesAttempted} of ${l.totalModules} modules` : `${l.modulesAttempted} modules attempted`;
  return `
    <div class="journey-lesson-card">
      <div class="journey-lesson-name">${l.lessonName}</div>
      <div class="journey-lesson-bar-track"><div class="journey-lesson-bar-fill" style="width:${l.avgScorePct}%;"></div></div>
      <div class="journey-lesson-detail">${totalLabel} · ${l.avgScorePct}% average</div>
    </div>`;
}

let journeyReturnScreen = 'screen-name';

async function showJourneyScreen(returnTo) {
  journeyReturnScreen = returnTo || 'screen-name';
  const content = document.getElementById('journey-content');
  content.innerHTML = '<p class="journey-empty">Loading…</p>';
  showScreen('screen-journey');

  if (!state.student) {
    content.innerHTML = '<p class="journey-empty">Pick your name first to see your journey.</p>';
    return;
  }

  let byUnit;
  try {
    const results = await getAllTierResultsForStudent(state.student);
    byUnit = aggregateJourneyData(results);
  } catch (e) {
    content.innerHTML = '<p class="journey-empty">Could not load your progress right now.</p>';
    return;
  }

  if (byUnit.size === 0) {
    content.innerHTML = '<p class="journey-empty">You haven\'t started any lessons yet on this device.<br>Come back after your first lesson to see your journey! 🌱</p>';
    return;
  }

  content.innerHTML = JOURNEY_UNIT_ORDER
    .filter(unit => byUnit.has(unit))
    .map(unit => `
      <div class="journey-unit">
        <div class="journey-unit-title">${unit}</div>
        ${byUnit.get(unit).map(journeyLessonCardHtml).join('')}
      </div>`)
    .join('');
}

async function saveSelfAssessment(student, value) {
  // One rating per student per lesson-completion visit — a private, in-the-moment
  // gut-check (matches the classroom's "three fingers" ritual), never scored or
  // graded, kept separate from tierResults on purpose.
  const key = `${student}::${LESSON_ID}::${Date.now()}`;
  await _idbPut('selfAssessments', { key, student, value, updatedAt: Date.now() });
}

// ═══════════════════════════════════════════════════════
//  SPACED REPETITION / VOCABULARY RECYCLING
//  Leitner box system, session-based (not calendar-based) intervals —
//  see SPACED_REPETITION_SPEC.md. wordExposure and sessionTracker are both
//  deliberately NOT lesson-scoped (no LESSON_ID in their keys, unlike
//  tierResults/recordings) — word mastery genuinely generalizes across
//  lessons, so it shouldn't reset just because a student opened a
//  different lesson. Both stores live in the same shared IndexedDB
//  database, and every published lesson shares one origin (GitHub Pages),
//  so this cross-lesson persistence works correctly in practice.
// ═══════════════════════════════════════════════════════

function normalise(word) {
  return (word || '').toString().trim().toLowerCase();
}

// Box -> sessions until due again. Box 5 has no interval — it's retired
// from active rotation (nextDue stays null).
const LEITNER_INTERVALS = { 1: 1, 2: 2, 3: 4, 4: 8 };

function wordExposureKey(student, normalisedWord) {
  return `${student}::${normalisedWord}`;
}

// One increment per genuine "app open + completed at least one exercise"
// event, never per question. sessionCounted is a plain module-scope
// variable, so it can only ever be true once per real page load — exactly
// matching the spec's definition of a session.
let sessionCounted = false;
let _cachedSessionNumber = null;

async function ensureSessionCounted(student) {
  if (sessionCounted) return;
  sessionCounted = true;
  const key = `session::${student}`;
  const existing = await _idbGet('sessionTracker', key);
  const newSession = (existing ? existing.currentSession : 0) + 1;
  _cachedSessionNumber = newSession;
  await _idbPut('sessionTracker', { key, student, currentSession: newSession, updatedAt: Date.now() });
}

// Records one exposure (correct or miss) for a single word, creating the
// record on first encounter. Safe to call with any raw (non-normalised)
// word string — normalises internally.
// Tracks every word touched THIS session, for the completion screen's
// "N words reviewed today" panel. Populated as a side effect of
// recordWordExposure — one source of truth, not duplicated at each of the
// 9 module call sites. wasNew distinguishes a genuine first encounter
// (no meaningful "before" box to show) from a real box transition.
let sessionReviewedWords = new Map(); // word -> { beforeBox, afterBox, wasNew, lastCorrect }

async function recordWordExposure(student, rawWord, moduleType, correct) {
  const word = normalise(rawWord);
  if (!word) return null;
  await ensureSessionCounted(student);
  const currentSession = _cachedSessionNumber || 1;
  const key = wordExposureKey(student, word);

  let record = await _idbGet('wordExposure', key);
  const wasNew = !record;
  if (!record) {
    record = { key, student, word, box: 1, exposures: 0, misses: 0, lastSeen: Date.now(), nextDue: currentSession + 1, sourceModules: [] };
  }
  const beforeBox = record.box;

  if (correct) {
    if (record.box < 5) record.box += 1;
    record.exposures += 1;
  } else {
    record.box = 1;
    record.misses += 1;
  }
  record.lastSeen = Date.now();
  record.nextDue = record.box === 5 ? null : currentSession + LEITNER_INTERVALS[record.box];
  if (!record.sourceModules.includes(moduleType)) record.sourceModules.push(moduleType);

  await _idbPut('wordExposure', record);
  sessionReviewedWords.set(word, { beforeBox, afterBox: record.box, wasNew, lastCorrect: correct });
  return record;
}

// Manual self-assessment adjustment — the spec's escape valve for
// miscalibration. "I know this" moves a word up one box even without
// another correct exercise attempt; "still learning" drops it straight to
// Box 1. Both update sessionReviewedWords too, so the completion panel
// reflects the adjustment immediately rather than showing stale numbers.
async function manuallyAdjustWord(student, rawWord, direction) {
  const word = normalise(rawWord);
  if (!word) return null;
  const currentSession = _cachedSessionNumber || 1;
  const key = wordExposureKey(student, word);

  let record = await _idbGet('wordExposure', key);
  if (!record) return null; // nothing to adjust if it was never actually recorded
  const beforeBox = record.box;

  if (direction === 'up') {
    if (record.box < 5) record.box += 1;
  } else {
    record.box = 1;
  }
  record.lastSeen = Date.now();
  record.nextDue = record.box === 5 ? null : currentSession + LEITNER_INTERVALS[record.box];

  await _idbPut('wordExposure', record);
  const existing = sessionReviewedWords.get(word);
  sessionReviewedWords.set(word, { beforeBox: existing ? existing.beforeBox : beforeBox, afterBox: record.box, wasNew: existing ? existing.wasNew : false, lastCorrect: direction === 'up' });
  return record;
}

// Word passport integration — box number drives tick status automatically,
// no separate field needed. No digital passport screen exists yet (it's
// currently a physical notebook card per the classroom ritual), so this is
// the ready-to-use mapping for whenever one gets built, not wired into any
// UI on its own.
function passportTickForBox(box) {
  if (box >= 5) return '✓✓'; // mastered
  if (box === 4) return '✓';  // confident
  return '';                  // still learning, unmarked
}

// Whole-lesson exposure cache — loaded once when the student clicks Start,
// not per-module. This keeps every module's own item-selection logic
// synchronous (unchanged in shape from before), instead of needing every
// render() function across the whole registry to become async-aware just
// to draw its session's items.
let wordExposureCache = new Map();

// Central word-field mapping for cache population only — uses each
// module's REAL data shape as actually implemented in this shell, not the
// spec's shorthand field names (e.g. Word Match has no 'answer' field at
// all, it uses left/right — 'left' is the real target word there).
// audio-match ('Listen & Match') is deliberately NOT covered here, same
// reasoning as its missing recordWordExposure calls in the module itself
// below — it shares word-match's free-pairing engine but was explicitly
// excluded from the spec's 9-module tracked list, unlike audio-understanding
// ('Listen & Choose') which IS tracked. Not an oversight.
function extractLessonTrackableWords() {
  const words = new Set();
  LESSON.forEach(mod => {
    ['bronze', 'silver', 'gold'].forEach(t => {
      const tierData = mod.data && mod.data[t];
      if (!tierData || !tierData.items) return;
      tierData.items.forEach(it => {
        if (mod.type === 'sentence-building') {
          (it.tokens || []).forEach(tk => { if (tk.text) words.add(normalise(tk.text)); });
        } else if (mod.type === 'description-pyramid') {
          if (it.l1 && it.l1.answer) words.add(normalise(it.l1.answer));
          (it.l2 || []).forEach(g => { if (g.answer) words.add(normalise(g.answer)); });
        } else if (mod.type === 'word-match') {
          if (it.left) words.add(normalise(it.left));
        } else if (mod.type === 'gap-fill' || mod.type === 'audio-understanding') {
          if (it.answer) words.add(normalise(it.answer));
        } else if (mod.type === 'memory-pairs' || mod.type === 'image-vocab' || mod.type === 'spelling' || mod.type === 'word-scramble') {
          if (it.word) words.add(normalise(it.word));
        }
      });
    });
  });
  return [...words];
}

async function loadWordExposureCache(student) {
  wordExposureCache = new Map();
  const words = extractLessonTrackableWords();
  await Promise.all(words.map(async word => {
    const rec = await _idbGet('wordExposure', wordExposureKey(student, word));
    if (rec) wordExposureCache.set(word, rec);
  }));
}

// Drop-in replacement for the safeShuffle(items,()=>false).slice(0,pick)
// pattern every module currently uses to draw its session. getWordFn lets
// each module supply its own accessor for "the word this item tests",
// since that varies by module shape. Falls back to the exact original
// random behaviour whenever the cache isn't populated (debug-harness
// direct module jumps skip the Start flow entirely, and a brand new
// device naturally starts with an empty cache) — recycling is purely
// additive, never a requirement for a module to function.
function biasedSelect(items, pick, getWordFn) {
  if (wordExposureCache.size === 0) {
    return safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
  }
  const currentSession = _cachedSessionNumber || 1;
  const scored = items.map(item => {
    const word = normalise(getWordFn(item));
    const rec = word ? wordExposureCache.get(word) : null;
    const box = rec ? rec.box : 0; // never-seen words get top priority
    const isDue = rec ? (rec.nextDue !== null && currentSession >= rec.nextDue) : true;
    return { item, box, isDue, _tiebreak: Math.random() };
  });
  scored.sort((a, b) => {
    if (a.isDue !== b.isDue) return a.isDue ? -1 : 1;
    if (a.box !== b.box) return a.box - b.box;
    return a._tiebreak - b._tiebreak;
  });
  return scored.slice(0, Math.min(pick, items.length)).map(s => s.item);
}

function timeAgo(timestamp) {
  const diffMs = Date.now() - timestamp;
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours} hour${hours===1?'':'s'} ago`;
  const days = Math.round(hours / 24);
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}

const state = {
  student: null,
  currentModuleIndex: 0,
  currentTier: 'bronze',
  results: buildResults(),
  replayMode: false, // true when a module is launched from the end-screen's free replay grid
};

function buildResults() {
  return LESSON.map(() => ({
    bronze:   { score: null, passed: false },
    silver:   { score: null, passed: false },
    gold:     { score: null, passed: false },
    complete: false
  }));
}

// ── REMEMBERED DEVICE STUDENT ──────────────────────
// Since each student now uses their own device, the full name grid only
// needs to appear once per device — after that, remember who it belongs
// to and skip straight to a one-tap "welcome back" screen. Validated
// against the CURRENT roster on every load, not just saved once: if a
// student leaves the class, any device that remembered them falls back
// to the fresh picker automatically rather than silently staying stuck
// on a name that's no longer valid.
const REMEMBERED_STUDENT_KEY = 'lessonShell.rememberedStudent';

function getRememberedStudent() {
  let name;
  try { name = localStorage.getItem(REMEMBERED_STUDENT_KEY); } catch (e) { return null; }
  if (!name) return null;
  if (!STUDENTS.includes(name)) {
    try { localStorage.removeItem(REMEMBERED_STUDENT_KEY); } catch (e) {}
    return null;
  }
  return name;
}
function rememberStudent(name) {
  try { localStorage.setItem(REMEMBERED_STUDENT_KEY, name); } catch (e) {}
}

function showFreshPicker() {
  document.getElementById('name-picker-fresh').style.display = 'block';
  document.getElementById('name-picker-remembered').style.display = 'none';
}
function showRememberedWelcome(name) {
  document.getElementById('name-picker-fresh').style.display = 'none';
  document.getElementById('name-picker-remembered').style.display = 'block';
  document.getElementById('remembered-welcome-sub').textContent = `Ready to continue, ${name}?`;
  state.student = name;
  // Update progress bar from stored results
  getAllTierResultsForStudent(name).then(results => {
    const attempted = new Set(results.map(r => r.moduleIndex)).size;
    const total = LESSON.length;
    const pct = total ? Math.round(attempted / total * 100) : 0;
    const bar = document.getElementById('remembered-progress-bar');
    const label = document.getElementById('remembered-progress-label');
    if (bar) bar.style.width = pct + '%';
    if (label) label.textContent = attempted ? `${attempted} of ${total} activities tried` : 'Not started yet';
  }).catch(() => {});
}

const nameGrid = document.getElementById('name-grid');
const startBtn = document.getElementById('start-btn');
const journeyLinkBtnName = document.getElementById('journey-link-btn-name');

STUDENTS.forEach(name => {
  const btn = document.createElement('button');
  btn.className   = 'name-btn';
  btn.textContent = name;
  btn.addEventListener('click', () => {

  else showFreshPicker();

async function beginLessonSession() {
  if (!state.student) return;
  state.currentModuleIndex = 0;
  state.currentTier = 'bronze';
  state.results = buildResults();

  // Restore this student's real pass/fail + score history from previous
  // sessions. Doesn't change where the lesson starts (still module 0,
  // bronze) — that's a separate "resume where you left off" UX decision,
  // not assumed here. This just means state.results is honest from the
  // first render instead of quietly pretending prior sessions never
  // happened, which matters for anything downstream that reads it.
  // Wrapped in try/catch — if the progress DB is ever unavailable (private
  // browsing restrictions, storage quota, another tab holding it open),
  // the lesson should still start rather than leave the student stuck on
  // the name screen with an unhandled rejection. Losing cross-session
  // history in that edge case is far better than blocking the lesson.
  try {
    const priorResults = await getTierResultsForStudent(state.student);
    priorResults.forEach(r => {
      if (state.results[r.moduleIndex]) {
        state.results[r.moduleIndex][r.tier] = { score: r.score, passed: r.passed };
      }
    });
  } catch (e) {
    console.warn('Could not restore prior progress — starting fresh this session:', e);
  }

  // Loaded once here, not per-module — every module's own item-selection
  // stays synchronous. Same fail-safe reasoning as above: if this fails,
  // biasedSelect() naturally falls back to plain random selection (an
  // empty cache is exactly its "no exposure data" case), so recycling
  // just doesn't happen this session rather than blocking the lesson.
  try {
    await loadWordExposureCache(state.student);
  } catch (e) {
    console.warn('Could not load vocabulary recycling data — continuing without it this session:', e);
  }

  showChoiceScreen();
}

startBtn.addEventListener('click', beginLessonSession);
document.getElementById('remembered-start-btn').addEventListener('click', beginLessonSession);

function bestTierLabel(r) {
  // What tier should this module open at, given current results?
  if (r.gold.passed)   return { tier: 'gold',   label: 'Gold ✓',   css: 'done' };
  if (r.silver.passed) return { tier: 'gold',   label: 'Gold',     css: 'gold' };
  if (r.bronze.passed) return { tier: 'silver', label: 'Silver',   css: 'silver' };
  return                      { tier: 'bronze', label: 'Bronze',   css: 'bronze' };
}

function showChoiceScreen() {
  const grid    = document.getElementById('choice-grid');
  const greeting= document.getElementById('choice-greeting');
  const sub     = document.getElementById('choice-sub');
  const finBtn  = document.getElementById('choice-finish-btn');

  greeting.textContent = state.student ? `${state.student}'s lesson` : 'Choose an activity';

  // Reset scroll to top
  const zone = document.getElementById('choice-flowzone');
  if (zone) { zone.scrollTop = 0; zone.scrollLeft = 0; }

  // Count how many modules are fully done
  const doneCount = state.results.filter(r => r.complete).length;
  const total     = LESSON.length;
  sub.textContent = doneCount === 0
    ? 'Tap any activity to start.'
    : doneCount === total
      ? 'All done! Great work.'
      : `${doneCount} of ${total} complete — keep going!`;

  grid.innerHTML = '';
  LESSON.forEach((mod, i) => {
    const r = state.results[i];
    const { tier, label, css } = bestTierLabel(r);
    const isComplete = r.complete;

    const card = document.createElement('div');
    card.className = 'choice-card' + (isComplete ? ' complete' : '');

    card.innerHTML = `
      <div class="choice-badge">${i + 1}</div>
      <div class="choice-info">
        <div class="choice-label">${mod.label}</div>
        <div class="choice-tier ${css}">${isComplete ? '✓ Complete' : label}</div>
      </div>
      ${isComplete ? '<div class="choice-done-icon">✓</div>' : '<div class="choice-arrow">›</div>'}
    `;

    card.addEventListener('click', () => startModule(i, tier));
    grid.appendChild(card);
  });

  // "Finish" button — always visible; goes to end screen
  finBtn.onclick = () => showEndScreen();

  showScreen('screen-choice');
  // Force scroll reset after render
  requestAnimationFrame(() => {
    const z = document.getElementById('choice-flowzone');
    if (z) z.scrollTop = 0;
  });
}

// Wire up back button — discards partial progress, returns to choice screen
document.getElementById('v2-back-btn').addEventListener('click', () => {
  // Cancel any ongoing TTS or recording
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  showChoiceScreen();
});

function startModule(moduleIndex, tier) {
  state.currentModuleIndex = moduleIndex;
  state.currentTier = tier;

  const mod = LESSON[moduleIndex];

  // v2 chrome: badge number + module title + tier-aware medal
  document.getElementById('v2-badge').textContent = moduleIndex + 1;
  document.getElementById('v2-module-title').textContent = mod.label;
  document.getElementById('v2-medal-img').src = `assets/${tier}.png?v=2`;
  document.getElementById('v2-medal-img').alt = `${cap(tier)} tier`;

  // v2 chrome: student name + tier, shown in the qlabel slot
  // qlabel text is now set per-module (short instruction or live question
  // progress) inside each renderer — see MODULE_REGISTRY. Clear it here so
  // stale text doesn't linger from the previous module.
  document.getElementById('v2-qlabel').textContent = '';

  // v2 chrome: overall lesson progress (modules fully complete / total)
  const doneCount = state.results.filter(r => r.complete).length;
  document.getElementById('v2-prog-fill').style.width = Math.round((doneCount / LESSON.length) * 100) + '%';

  // v2 chrome: per-module background/scene image variant — lets a lesson
  // give a specific exercise more visual context (e.g. a food-court scene
  // for an ordering-food module) instead of every module sharing the same
  // fixed illustration. Falls back to the default CSS-defined images when a
  // module doesn't specify one, so every already-published lesson keeps
  // working exactly as before with zero changes needed.
  // Scoped to #screen-module specifically — since the name/end/journey
  // screens now share these same classes too, an unscoped query would
  // silently grab whichever one appears first in the document instead of
  // the actual active module screen.
  const bgLayer = document.querySelector('#screen-module .layer-bg');
  const sceneLayer = document.querySelector('#screen-module .layer-scene');
  bgLayer.style.backgroundImage = (mod.imageVariant && mod.imageVariant.background)
    ? `url('${mod.imageVariant.background}')` : '';
  sceneLayer.style.backgroundImage = (mod.imageVariant && mod.imageVariant.scene)
    ? `url('${mod.imageVariant.scene}')` : '';

  showScreen('screen-module');

  // Render module
  const container = document.getElementById('module-container');
  container.innerHTML = '';
  document.getElementById('gr-overlay').style.display = 'none';
  document.getElementById('gr-reinforce-content').style.display = 'block';
  document.getElementById('gr-complete-content').style.display = 'none';

  const renderer = MODULE_REGISTRY[mod.type];
  if (!renderer) {
    container.innerHTML = `<p style="color:var(--text-dim);padding:32px 0;text-align:center">Module type "${mod.type}" not registered.</p>`;
    return;
  }

  // Every module now uses a per-tier pool: { pick, items: [...], ...mode? }.
  // No more shared-across-tiers special-casing needed (Nick's call: pools
  // shouldn't be shared across tiers since difficulty differs per tier).
  renderer.render(container, mod.data[tier], tier, score => {
    handleTierResult(moduleIndex, tier, score);
  });

  // Illustration "slides down" to clear whatever height this module's
  // content actually renders at, and stays live via MutationObserver for
  // any later content change within the same module (multi-question
  // sessions, retries, etc.) without each renderer needing to know about it.
  watchModuleContentForSceneReposition();
}

// Ported verbatim from module-demos' finishTier()/dropStar() — stars pop
// in one at a time (scale 0→1, opacity 0→1) with a tone each, then once
// all are in, a completion chime plus a staggered brightness/glow shimmer
// sweeps across all of them.
function animateStarsReveal(starCount) {
  const starsEl = document.getElementById('stars-row');
  starsEl.innerHTML = '';
  for (let s = 0; s < starCount; s++) {
    const img = document.createElement('img');
    img.src = 'assets/star.png';
    img.alt = '';
    img.style.opacity = '0';
    img.style.transform = 'scale(0)';
    starsEl.appendChild(img);
  }
  const allStarImgs = starsEl.querySelectorAll('img');
  let i = 0;
  function dropStar() {
    if (i >= starCount) {
      sfx('complete');
      allStarImgs.forEach((img, si) => {
        setTimeout(() => {
          img.animate([
            { filter: 'brightness(1) drop-shadow(0 0 0px rgba(240,174,99,0))' },
            { filter: 'brightness(1.6) drop-shadow(0 0 10px rgba(240,174,99,0.9))' },
            { filter: 'brightness(1) drop-shadow(0 0 0px rgba(240,174,99,0))' }
          ], { duration: 500, easing: 'ease-in-out' });
        }, si * 120);
      });
      return;
    }
    const img = allStarImgs[i];
    img.animate([{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'forwards' });
    sfx('star');
    i++;
    setTimeout(dropStar, 220);
  }
  dropStar();
}

function handleTierResult(moduleIndex, tier, score) {
  const passed = score >= PASS_THRESHOLD;
  state.results[moduleIndex][tier] = { score, passed };
  if (state.student) saveTierResult(state.student, moduleIndex, tier, score, passed).catch(() => {});

  const pct      = Math.round(score * 100);
  const tierName = cap(tier);
  const next     = nextTier(tier);

  const ctaBtn = document.getElementById('result-cta');

  // A free replay from the end screen's grid — not part of the normal
  // linear first-time flow, so it shouldn't try to auto-advance to "next
  // tier" or "next module" (which may be irrelevant or already complete).
  // Just acknowledge the updated score and return to the refreshed grid.
  if (state.replayMode) {
    state.replayMode = false;
    document.getElementById('result-msg').innerHTML = `<strong>Updated!</strong> Your best score is saved.`;
    ctaBtn.textContent = '← Back to results';
    ctaBtn.onclick = () => showEndScreen();

    document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} — nice try`;
    document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;
    document.getElementById('gr-reinforce-content').style.display = 'none';
    document.getElementById('gr-complete-content').style.display = 'block';
    document.getElementById('gr-overlay').style.display = 'flex';
    const stars = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;
    animateStarsReveal(stars);
    return;
  }

  // Reset the secondary menu button each time
  const menuBtn = document.getElementById('result-menu-btn');
  menuBtn.style.display = 'none';
  menuBtn.onclick = () => showChoiceScreen();

  if (passed && next) {
    document.getElementById('result-msg').innerHTML =
      `Great work! <strong>${cap(next)}</strong> is now unlocked on this activity.`;
    ctaBtn.textContent = `Try ${cap(next)} →`;
    ctaBtn.onclick = () => startModule(moduleIndex, next);
    // Give them the option to go back to menu instead
    menuBtn.style.display = 'block';

  } else if (passed && !next) {
    state.results[moduleIndex].complete = true;
    const allDone = state.results.every(r => r.complete);

    if (allDone) {
      document.getElementById('result-msg').innerHTML =
        `<strong>All done!</strong> You've completed every activity.`;
      ctaBtn.textContent = 'See my results →';
      ctaBtn.onclick = () => showEndScreen();
    } else {
      document.getElementById('result-msg').innerHTML =
        `<strong>Activity complete!</strong> What do you want to do next?`;
      ctaBtn.textContent = '← Back to menu';
      ctaBtn.onclick = () => showChoiceScreen();
    }

  } else {
    document.getElementById('result-msg').innerHTML =
      `You need <strong>${Math.round(PASS_THRESHOLD * 100)}%</strong> to unlock the next level. You can do it!`;
    ctaBtn.textContent = `↩ Try ${tierName} again`;
    ctaBtn.onclick = () => startModule(moduleIndex, tier);
  }

  document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} — try again`;
  document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;

  // Same overlay as per-question reinforcement, just swapped to the
  // completion content — no screen navigation, matches the locked demo.
  document.getElementById('gr-reinforce-content').style.display = 'none';
  document.getElementById('gr-complete-content').style.display = 'block';
  document.getElementById('gr-overlay').style.display = 'flex';

  const stars = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;
  animateStarsReveal(stars);
}

function starsFromPct(pct) {
  // Same formula as the per-tier completion celebration (handleTierResult)
  // — one consistent star scale everywhere in the shell, not a second one
  // invented just for this screen.
  return pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;
}
function starsHtml(stars) {
  return '⭐'.repeat(stars) + '✩'.repeat(3 - stars);
}

function pickSelfAssess(value) {
  document.querySelectorAll('.selfassess-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.val) === value);
  });
  if (state.student) saveSelfAssessment(state.student, value).catch(() => {});
}

function replayModule(i) {
  const r = state.results[i];
  let tier = 'bronze';
  for (const t of ['gold','silver','bronze']) {
    if (r[t].score !== null) { tier = t; break; }
  }
  state.replayMode = true;
  startModule(i, tier);
}

function showEndScreen() {
  document.getElementById('end-name').textContent = state.student;
  document.querySelectorAll('.selfassess-btn').forEach(b => b.classList.remove('selected'));

  // Overall score: highest-tier score per module, averaged
  let total = 0;
  state.results.forEach(r => {
    for (const t of ['gold','silver','bronze']) {
      if (r[t].score !== null) { total += r[t].score; break; }
    }
  });
  const overallPct = Math.round((total / LESSON.length) * 100);
  document.getElementById('end-total').innerHTML = `Overall score: <span>${overallPct}%</span>`;

  const summaryList = document.getElementById('summary-list');
  summaryList.innerHTML = '';
  let hasIncomplete = false;

  LESSON.forEach((mod, i) => {
    const r = state.results[i];
    if (!r.complete) hasIncomplete = true;

    let highestTier = null, highestScore = null;
    for (const t of ['gold','silver','bronze']) {
      if (r[t].score !== null) { highestTier = t; highestScore = r[t].score; break; }
    }

    const canDoText = highestTier && mod.canDo ? mod.canDo[highestTier] : null;

    const item = document.createElement('div');
    item.className = 'summary-item' + (highestScore !== null ? ' replayable' : '');
    item.innerHTML = `
      <div>
        <div class="summary-item-label">${mod.label}</div>
        <div class="summary-item-detail">${
          highestScore !== null
            ? `${cap(highestTier)} · <span class="summary-stars">${starsHtml(starsFromPct(Math.round(highestScore * 100)))}</span>`
            : 'Not attempted'
        }</div>
        ${highestScore !== null ? `<div class="summary-replay-hint">Tap to practice again</div>` : ''}
        ${canDoText ? `<div class="summary-candoo">✓ ${canDoText}</div>` : ''}
      </div>
      <div class="summary-status ${r.complete ? 'complete' : 'incomplete'}">
        ${r.complete ? '✓ Done' : 'Retry'}
      </div>
    `;
    if (highestScore !== null) item.addEventListener('click', () => replayModule(i));
    summaryList.appendChild(item);
  });

  renderVocabReviewSummary();

  const retryBtn = document.getElementById('retry-btn');
  retryBtn.style.display = hasIncomplete ? 'block' : 'none';
  retryBtn.onclick = retryFailed;

  document.getElementById('journey-link-btn').onclick = () => showJourneyScreen('screen-end');

  document.getElementById('done-btn').onclick = () => {
    resetAll();
    refreshNamePickerScreen();
    showScreen('screen-name');
  };

  showScreen('screen-end');
}

function vocabReviewStatusText(entry) {
  const { beforeBox, afterBox, wasNew } = entry;
  if (wasNew && afterBox === 1) return '🆕 New word';
  if (wasNew) return `⬆ New → Box ${afterBox}`;
  if (beforeBox < afterBox) return `⬆ Box ${beforeBox} → Box ${afterBox}`;
  if (beforeBox > afterBox) return `↓ Box ${beforeBox} → Box ${afterBox}`;
  return afterBox >= 5 ? '✓✓ Box 5 (mastered)' : `Box ${afterBox}`;
}

function renderVocabReviewSummary() {
  const wrap = document.getElementById('vocab-review-summary');
  const line = document.getElementById('vocab-review-line');
  const panel = document.getElementById('vocab-review-panel');
  const words = [...sessionReviewedWords.entries()];

  if (words.length === 0) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  line.textContent = `📚 ${words.length} word${words.length === 1 ? '' : 's'} reviewed today`;
  line.classList.remove('open');
  panel.style.display = 'none';

  panel.innerHTML = words.map(([word, entry]) => `
    <div class="vocab-review-row-wrap">
      <div class="vocab-review-row" onclick="toggleVocabAdjustRow('${word}')">
        <span class="vocab-review-word">${word}</span>
        <span class="vocab-review-status">${vocabReviewStatusText(entry)}</span>
      </div>
      <div class="vocab-review-adjust" id="vocab-adjust-${word}" style="display:none;">
        <button class="vocab-adjust-btn" onclick="event.stopPropagation(); applyVocabAdjust('${word}','up',this)">I know this</button>
        <button class="vocab-adjust-btn" onclick="event.stopPropagation(); applyVocabAdjust('${word}','down',this)">Still learning</button>
      </div>
    </div>`).join('');
}

function toggleVocabReviewPanel() {
  const line = document.getElementById('vocab-review-line');
  const panel = document.getElementById('vocab-review-panel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'block' : 'none';
  line.classList.toggle('open', opening);
}

function toggleVocabAdjustRow(word) {
  const el = document.getElementById(`vocab-adjust-${word}`);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}

async function applyVocabAdjust(word, direction, btnEl) {
  if (!state.student) return;
  try {
    const record = await manuallyAdjustWord(state.student, word, direction);
    if (!record) return;
    btnEl.classList.add('applied');
    btnEl.textContent = direction === 'up' ? '✓ Marked known' : '✓ Marked learning';
    const row = btnEl.closest('.vocab-review-row-wrap').querySelector('.vocab-review-status');
    if (row) row.textContent = direction === 'up' ? `⬆ moved to Box ${record.box}` : `↓ reset to Box 1`;
  } catch (e) {
    console.warn('Could not apply manual vocabulary adjustment:', e);
  }
}


function retryFailed() {
  const idx = state.results.findIndex(r => !r.complete);
  if (idx === -1) { showEndScreen(); return; }
  const r = state.results[idx];
  const tier = r.silver.passed ? 'gold' : r.bronze.passed ? 'silver' : 'bronze';
  startModule(idx, tier);
}

function resetAll() {
  state.student = null;
  state.results = buildResults();
  state.replayMode = false;
  sessionReviewedWords = new Map();
  sessionCounted = false;
  _cachedSessionNumber = null;
  wordExposureCache = new Map();
  document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));
  startBtn.classList.remove('ready');

  journeyLinkBtnName.style.pointerEvents = 'none';
}

// ══════════════════════════════════════════════════
//  MODULE REGISTRY
//  Contract: render(container, data, tier, onComplete)
//  onComplete(score)  score = 0–1
// ══════════════════════════════════════════════════

// Render ID — incremented on every render call.
// All async callbacks (onend, setTimeout) check this before acting
// so stale callbacks from a previous render can never fire into a new one.
let _audioRID = 0;

// ══════════════════════════════════════════════════
//  SHARED UTILITIES
//  speak(), speakThenSentence(), safeShuffle(),
//  showReinforcePanel() — used by new module types
// ══════════════════════════════════════════════════

const TTS = window.speechSynthesis || null;

// ══════════════════════════════════════════════════
//  SOUND EFFECTS — ported verbatim from module-demos/*.html.
//  Every demo file has this exact same tone system (tap/star/complete),
//  consistently, but none of it made it into the shell until now.
// ══════════════════════════════════════════════════
let _sfxCtx = null;
function sfxUnlock() {
  if (!_sfxCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) _sfxCtx = new AC();
  }
  if (_sfxCtx && _sfxCtx.state === 'suspended') _sfxCtx.resume();
}
function tone(freq, dur) {
  sfxUnlock();
  if (!_sfxCtx) return;
  const o = _sfxCtx.createOscillator(), g = _sfxCtx.createGain();
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, _sfxCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, _sfxCtx.currentTime + dur);
  o.connect(g); g.connect(_sfxCtx.destination);
  o.start(); o.stop(_sfxCtx.currentTime + dur);
}
function sfx(name) {
  if (name === 'tap') tone(600, 0.06);
  if (name === 'correct') { tone(880, 0.12); setTimeout(() => tone(1180, 0.14), 90); }
  if (name === 'wrong') tone(350, 0.22);
  if (name === 'star') tone(1000, 0.1);
  if (name === 'complete') { tone(700, 0.1); setTimeout(() => tone(1050, 0.16), 110); }
}

const SPEAK_MOODS = {
  neutral:   { rate:0.85, pitch:1.0,  volume:0.9 },
  wrong:     { rate:0.80, pitch:0.9,  volume:0.8 },
  celebrate: { rate:1.15, pitch:1.55, volume:1.0 },
  slow:      { rate:0.80, pitch:1.0,  volume:0.9 },
};

// onEnd (optional) fires once playback genuinely finishes, whichever path
// (audioFile or TTS) actually played. Added for modules that need to gate
// an action on "audio has finished" (e.g. Listen & Choose unlocking
// options only after the student has listened) — existing callers that
// don't pass onEnd are unaffected.
function speak(text, mood='neutral', delay=0, audioFile=null, onEnd=null) {
  setTimeout(() => {
    if (audioFile) {
      const a = new Audio(audioFile);
      a.onended = () => { if (onEnd) onEnd(); };
      a.onerror = () => speakViaTTS(text, mood, onEnd); // missing/broken file — fall back, never go silent
      a.play().catch(() => speakViaTTS(text, mood, onEnd));
      return;
    }
    speakViaTTS(text, mood, onEnd);
  }, delay);
}

function speakViaTTS(text, mood='neutral', onEnd=null) {
  if (!TTS) { if (onEnd) onEnd(); return; }
  TTS.cancel();
  let u;
  try { u = new SpeechSynthesisUtterance(text); } catch(e) { if (onEnd) onEnd(); return; }
  const m = SPEAK_MOODS[mood];
  u.rate = m.rate; u.pitch = m.pitch; u.volume = m.volume;
  u.onend = () => { if (onEnd) onEnd(); };
  TTS.speak(u);
}

function speakThenSentence(word, sentence, wordMood='celebrate', wordAudioFile=null, sentenceAudioFile=null) {
  const playSentencePart = () => {
    setTimeout(() => {
      if (sentenceAudioFile) {
        const a = new Audio(sentenceAudioFile);
        a.onerror = () => speakViaTTS(sentence, 'neutral');
        a.play().catch(() => speakViaTTS(sentence, 'neutral'));
      } else {
        speakViaTTS(sentence, 'neutral');
      }
    }, 400);
  };

  if (wordAudioFile) {
    const wa = new Audio(wordAudioFile);
    let done = false;
    const advance = () => { if (done) return; done = true; playSentencePart(); };
    wa.onended = advance;
    wa.onerror = () => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); };
    wa.play().catch(() => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); });
    // No reliable duration fallback for a file we haven't loaded yet — onended covers the
    // normal case; onerror/play() rejection covers the broken-file case.
    return;
  }
  speakWordThenSentenceViaTTS(word, sentence, wordMood);
}

function speakWordThenSentenceViaTTS(word, sentence, wordMood='celebrate') {
  if (!TTS) return;
  TTS.cancel();
  let wu;
  try { wu = new SpeechSynthesisUtterance(word); } catch(e) { return; }
  const wm = SPEAK_MOODS[wordMood];
  wu.rate = wm.rate; wu.pitch = wm.pitch; wu.volume = wm.volume;
  let done = false;
  const playSentence = () => {
    if (done) return; done = true;
    setTimeout(() => {
      if (!TTS) return;
      let su;
      try { su = new SpeechSynthesisUtterance(sentence); } catch(e) { return; }
      const nm = SPEAK_MOODS['neutral'];
      su.rate = nm.rate; su.pitch = nm.pitch; su.volume = nm.volume;
      TTS.speak(su);
    }, 400);
  };
  wu.onend = playSentence;
  const fallback = Math.max(1200, (word.length / wu.rate) * 120) + 600;
  setTimeout(playSentence, fallback);
  TTS.speak(wu);
}

// Never returns a shuffled array that satisfies badFn (e.g. same order as input)
function safeShuffle(arr, badFn, maxAttempts=20) {
  const sh = a => [...a].sort(() => Math.random() - .5);
  let result = sh(arr), attempts = 0;
  while (badFn(result) && attempts++ < maxAttempts) result = sh(arr);
  return result;
}

// Shared reinforcement panel — slides up, shows emoji/word/sentence, auto-closes
const MIN_READ_MS   = 3500;
const READ_PAUSE_MS = 1800;

function showReinforcePanel(item, onClose) {
  const plain = item.sentence.replace(/<[^>]+>/g, '');
  const panel = document.getElementById('reinforce-panel');
  const bar   = document.getElementById('rp-bar');

  document.getElementById('rp-em').innerHTML = item.image
    ? `<img src="${item.image}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;" alt="${item.word}">`
    : item.emoji;
  document.getElementById('rp-word').textContent = item.word;
  document.getElementById('rp-sent').innerHTML   = item.sentence;

  panel.style.transform = 'translateY(0)';

  const wordMs  = Math.max(800,  (item.word.length / SPEAK_MOODS.celebrate.rate) * 120);
  const sentMs  = Math.max(1500, (plain.length      / SPEAK_MOODS.neutral.rate)  * 60);
  const panelMs = Math.max(MIN_READ_MS, wordMs + 400 + sentMs + READ_PAUSE_MS);

  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${panelMs}ms linear`;
    bar.style.width = '100%';
  }));

  speakThenSentence(item.word, plain, 'celebrate', item.audioFile, item.sentenceAudioFile);

  setTimeout(() => {
    panel.style.transform = 'translateY(100%)';
    bar.style.transition = 'none'; bar.style.width = '0%';
    if (onClose) onClose();
  }, panelMs);
}

// ══════════════════════════════════════════════════
//  SCENE REPOSITIONING — illustration "slides down" to clear content
//  The frame uses a fixed aspect-ratio box (matching bg_and_border.png/
//  frame_mask.png), so the illustration can't rely on normal document
//  flow to avoid overlapping tall module content. Instead, after every
//  content change, measure the flowzone's actual rendered bottom edge
//  and move .layer-scene down to clear it. Its original design position
//  (51.47%) is the floor — it never moves *up* past that. If content is
//  tall enough to push the illustration mostly off-frame, fade it out
//  rather than showing an awkward sliver.
// ══════════════════════════════════════════════════
const SCENE_DEFAULT_TOP = 55;
let _sceneObserver = null;

function repositionSceneLayer() {
  // Scoped to #screen-module — see the note at the imageVariant swap
  // logic above; an unscoped query here silently grabbed whichever
  // .app-frame/.layer-scene came first in the document (screen-name's,
  // always hidden while a module is showing), which measured as zero
  // height and made this function return early every single time.
  const flowzone = document.getElementById('module-container');
  const scene = document.querySelector('#screen-module .layer-scene');
  const appFrame = document.querySelector('#screen-module .app-frame');
  if (!flowzone || !scene || !appFrame) return;

  const frameRect = appFrame.getBoundingClientRect();
  const flowRect = flowzone.getBoundingClientRect();
  if (frameRect.height === 0) return;

  const contentBottomPct = ((flowRect.bottom - frameRect.top) / frameRect.height) * 100;
  const GAP_PCT = 2;
  const newTop = Math.max(SCENE_DEFAULT_TOP, contentBottomPct + GAP_PCT);
  scene.style.top = newTop + '%';
  scene.style.opacity = '1';
  // No capping, no fading — mask handles clipping at phone boundary
}

function watchModuleContentForSceneReposition() {
  const flowzone = document.getElementById('module-container');
  if (!flowzone) return;
  if (_sceneObserver) _sceneObserver.disconnect();
  _sceneObserver = new MutationObserver(() => repositionSceneLayer());
  // attributes+attributeFilter:['style'] matters as much as childList here —
  // several modules reveal their Check button via style.display on an
  // already-existing node (not a fresh DOM insertion), which childList
  // alone never sees. That's exactly the gap that let the illustration
  // overlap the Check button once it appeared.
  _sceneObserver.observe(flowzone, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style'] });
  repositionSceneLayer();
}

// ══════════════════════════════════════════════════
//  GRAMMAR-COLOR REINFORCEMENT — shared by gap-fill & true-false
//  NEW in this shell (SHELL_MERGE_SPEC.md). Token fields are
//  `t` (text) / `r` (role), matching the real published data shape —
//  NOT `text`/`role` as seen in the standalone module-demos files.
// ══════════════════════════════════════════════════
const GRAMMAR_COLORS = {
  subject: { bg: 'rgba(0,188,212,0.18)',  border: '#00BCD4', color: '#00BCD4' },
  verb:    { bg: 'rgba(139,195,74,0.18)', border: '#8BC34A', color: '#8BC34A' },
  object:  { bg: 'rgba(255,152,0,0.18)',  border: '#FF9800', color: '#FFB74D' },
  place:   { bg: 'rgba(171,71,188,0.18)', border: '#AB47BC', color: '#CE93D8' },
  time:    { bg: 'rgba(233,30,99,0.18)',  border: '#E91E63', color: '#F48FB1' }
};
const GRAMMAR_FADED = {
  subject: { dot: '#1A6070', text: '#3A7A8A' },
  verb:    { dot: '#3A5C22', text: '#4A7030' },
  object:  { dot: '#6A4008', text: '#7A5010' },
  place:   { dot: '#4A2058', text: '#5A3068' },
  time:    { dot: '#6A1030', text: '#7A2040' }
};
function grammarSentence(tokens) {
  return (tokens || []).map(tok => {
    const c = GRAMMAR_COLORS[tok.r];
    if (!c) return `<span style="color:#fff;">${tok.t}</span>`;
    return `<span style="display:inline-block;background:${c.bg};border:1.5px solid ${c.border};color:${c.color};border-radius:999px;padding:0px 9px;margin:1px 2px;font-weight:600;font-size:.85em;line-height:1.6;">${tok.t}</span>`;
  }).join(' ');
}
function grammarLegend(tokens) {
  const ORDER = ['subject', 'verb', 'object', 'place', 'time'];
  const present = {};
  (tokens || []).forEach(tok => { present[tok.r] = true; });
  const roles = ORDER.filter(r => present[r] && GRAMMAR_FADED[r]);
  if (roles.length === 0) return '';
  const pills = roles.map(role => {
    const c = GRAMMAR_FADED[role];
    return `<span style="display:inline-flex;align-items:center;gap:4px;color:${c.text};font-size:11px;font-weight:600;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c.dot};flex-shrink:0;"></span>${role.charAt(0).toUpperCase()+role.slice(1)}</span>`;
  }).join('');
  return `<div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;">${pills}</div>`;
}
// Shows the grammar-colored full sentence + speaks it, then calls onContinue
// when the student taps Continue. Used only after a CORRECT answer.
function showGrammarReinforce(tokens, plainSentence, onContinue) {
  const overlay = document.getElementById('gr-overlay');
  const coloredSentence = grammarSentence(tokens);
  // Falls back to plain, uncoloured sentence text when no grammar tokens
  // are authored for this item — e.g. Memory Pairs' content already has
  // real sentence text ("The apple is red.") but no per-word role tagging,
  // so the reinforcement panel was showing nothing at all rather than
  // gracefully degrading to the plain sentence it already had on hand.
  document.getElementById('gr-sentence').innerHTML = coloredSentence || (plainSentence ? `<span style="color:#fff;">${plainSentence}</span>` : '');
  document.getElementById('gr-legend').innerHTML = grammarLegend(tokens);
  overlay.style.display = 'flex';
  speak(plainSentence, 'neutral', 200);
  const btn = document.getElementById('gr-continue-btn');
  btn.onclick = () => {
    overlay.style.display = 'none';
    onContinue();
  };
}
function setGrammarReinforceLabel(correct) {
  const label = document.querySelector('#gr-reinforce-content > div:first-child');
  label.textContent = correct ? 'correct!' : 'not quite';
  label.style.color = correct ? '#AED581' : '#F48FB1';
}

// Reuses the same #gr-overlay DOM as showGrammarReinforce, but with plain
// text instead of grammar-colored tokens — for modules that just need a
// simple "here's what was right" reveal, not a colored sentence breakdown.
// No audio plays here by default (unlike showGrammarReinforce).
function showPlainReinforce(correct, bodyText, onContinue) {
  setGrammarReinforceLabel(correct);
  document.getElementById('gr-sentence').innerHTML =
    `<span style="color:rgba(255,255,255,0.8);font-size:.85em;">${bodyText}</span>`;
  document.getElementById('gr-legend').innerHTML = '';
  document.getElementById('gr-overlay').style.display = 'flex';
  const btn = document.getElementById('gr-continue-btn');
  btn.onclick = () => {
    document.getElementById('gr-overlay').style.display = 'none';
    onContinue();
  };
}

// Shared recording interaction — record/model/compare/self-assess, with the
// same IndexedDB persistence and before/after compare card everywhere it's
// used. Extracted so the standalone Say It module and Description Pyramid's
// chained "Now you say it" step are the SAME code, not two copies that can
