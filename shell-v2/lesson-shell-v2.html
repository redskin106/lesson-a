// drift apart over time. `onDone` receives { assessed: true, correct: bool }
// on a real self-assessment, or { assessed: false } if skipped (only
// possible when opts.allowSkip is true — the standalone module never allows
// skipping, but Description Pyramid's Say It step is explicitly optional).
function renderSayItInteraction(container, opts, onDone) {
  const { prompt, target, audioFile, moduleIndex, tier, recordingItemIndex, isBronze, allowSkip } = opts;

  let modelPlaying   = false;
  let modelAudio     = null;
  let selfPlaying    = false;
  let isRecording    = false;
  let done           = false;
  let recordingBlob  = null;
  let selfAudio      = null;
  let mediaRecorder  = null;
  let stream         = null;
  let priorAttempts  = [];

  container.innerHTML = `
    ${prompt ? `<p class="module-question">${prompt}</p>` : ''}
    <div class="speak-target">${target}</div>
    <div class="speak-trio">
      <button class="trio-btn model" id="model-btn">
        <span class="trio-icon" id="model-icon">🔊</span>
        <span class="trio-label">Model</span>
      </button>
      <button class="trio-btn playback" id="play-btn">
        <span class="trio-icon" id="play-icon">▶</span>
        <span class="trio-label">You</span>
      </button>
      <button class="trio-btn record" id="rec-btn">
        <span class="trio-icon" id="rec-icon">🎤</span>
        <span class="trio-label" id="rec-label">Record</span>
      </button>
    </div>
    <p class="speak-hint" id="speak-hint">Hear the model, then record yourself.</p>
    <div class="compare-card" id="compare-card" style="display:none;">
      <div class="compare-play-btn" id="compare-play-btn">▶</div>
      <div class="compare-text">
        <div class="compare-title">Compare with your last try</div>
        <div class="compare-sub" id="compare-sub"></div>
      </div>
    </div>
    <div id="assess-wrap" style="display:none">
      <div class="assess-btns">
        <button class="assess-btn assess-yes" id="assess-yes">✓ That sounded right</button>
        <button class="assess-btn assess-no"  id="assess-no">↩ I need more practice</button>
      </div>
      <button class="share-link" id="share-btn">📤 Share this recording</button>
    </div>
    ${allowSkip ? `<button class="share-link" id="skip-sayit-btn" style="margin-top:2%;">Skip this step →</button>` : ''}
    <button class="iv-proceed-btn" id="next-btn">Next →</button>
  `;

  const modelBtn    = container.querySelector('#model-btn');
  const modelIcon   = container.querySelector('#model-icon');
  const playBtn     = container.querySelector('#play-btn');
  const playIcon    = container.querySelector('#play-icon');
  const recBtn      = container.querySelector('#rec-btn');
  const recIcon     = container.querySelector('#rec-icon');
  const recLabel    = container.querySelector('#rec-label');
  const hint        = container.querySelector('#speak-hint');
  const compareCard = container.querySelector('#compare-card');
  const compareSub  = container.querySelector('#compare-sub');
  const comparePlayBtn = container.querySelector('#compare-play-btn');
  const assessWrap  = container.querySelector('#assess-wrap');
  const yesBtn      = container.querySelector('#assess-yes');
  const noBtn       = container.querySelector('#assess-no');
  const nextBtn     = container.querySelector('#next-btn');
  const shareBtn    = container.querySelector('#share-btn');
  const skipBtn     = container.querySelector('#skip-sayit-btn');

  if (state.student) {
    getRecordings(state.student, moduleIndex, tier, recordingItemIndex).then(attempts => {
      priorAttempts = attempts;
    }).catch(() => {}); // fails safe to "no prior attempts" — matches a genuine first try either way
  }

  function finishModelPlayback() {
    modelPlaying = false;
    modelIcon.textContent = '🔊';
    modelBtn.classList.remove('playing');
  }

  function playModel() {
    if (modelPlaying) return;
    stopSelf();
    modelPlaying = true;
    modelIcon.textContent = '⏸';
    modelBtn.classList.add('playing');

    if (audioFile) {
      const a = new Audio(audioFile);
      modelAudio = a;
      a.onended = finishModelPlayback;
      a.onerror = () => playModelViaSynthesis();
      a.play().catch(() => playModelViaSynthesis());
      return;
    }
    playModelViaSynthesis();
  }

  function playModelViaSynthesis() {
    if (!TTS) { modelPlaying = false; return; }
    TTS.cancel();
    let u;
    try { u = new SpeechSynthesisUtterance(target); }
    catch(e) { modelPlaying = false; return; }
    u.rate   = isBronze ? 0.8 : 0.85;
    u.lang   = 'en-US';
    u.onend  = finishModelPlayback;
    TTS.speak(u);
  }

  modelBtn.addEventListener('click', () => {
    if (modelPlaying) {
      TTS && TTS.cancel();
      if (modelAudio) { modelAudio.pause(); modelAudio.currentTime = 0; modelAudio = null; }
      modelPlaying = false;
      modelIcon.textContent = '🔊';
      modelBtn.classList.remove('playing');
    } else {
      playModel();
    }
  });

  function stopSelf() {
    if (selfAudio) { selfAudio.pause(); selfAudio.currentTime = 0; }
    selfPlaying = false;
    playIcon.textContent = '▶';
    playBtn.classList.remove('playing');
  }

  playBtn.addEventListener('click', () => {
    if (!recordingBlob || isRecording || done) return;
    if (selfPlaying) { stopSelf(); return; }

    TTS && TTS.cancel();
    modelPlaying = false;
    modelIcon.textContent = '🔊';
    modelBtn.classList.remove('playing');

    selfPlaying = true;
    playIcon.textContent = '⏸';
    playBtn.classList.add('playing');

    const url  = URL.createObjectURL(recordingBlob);
    selfAudio  = new Audio(url);
    const resetSelfBtn = () => { stopSelf(); URL.revokeObjectURL(url); };
    selfAudio.onended = resetSelfBtn;
    selfAudio.onerror = resetSelfBtn;
    selfAudio.play().catch(resetSelfBtn);
  });

  let comparePlaying = false;
  comparePlayBtn.addEventListener('click', () => {
    if (comparePlaying || !priorAttempts.length) return;
    const lastAttempt = priorAttempts[priorAttempts.length - 1];
    TTS && TTS.cancel();
    stopSelf();
    comparePlaying = true;
    comparePlayBtn.textContent = '⏸';
    const url = URL.createObjectURL(lastAttempt.blob);
    const audio = new Audio(url);
    const resetCompareBtn = () => {
      comparePlaying = false;
      comparePlayBtn.textContent = '▶';
      URL.revokeObjectURL(url);
    };
    audio.onended = resetCompareBtn;
    audio.onerror = resetCompareBtn;
    audio.play().catch(resetCompareBtn);
  });

  recBtn.addEventListener('click', async () => {
    if (done) return;

    if (isRecording) {
      mediaRecorder.stop();
      return;
    }

    stopSelf();
    TTS && TTS.cancel();
    modelPlaying = false;
    modelIcon.textContent = '🔊';
    modelBtn.classList.remove('playing');

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      const mimeType = MediaRecorder.isTypeSupported('audio/webm')
        ? 'audio/webm' : 'audio/mp4';

      const chunks  = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        isRecording = false;
        recIcon.textContent  = '🎤';
        recLabel.textContent = 'Re-record';
        recBtn.classList.remove('recording');

        recordingBlob = new Blob(chunks, { type: mimeType });
        playBtn.classList.add('ready');

        const hadPriorBeforeThisRecording = priorAttempts.length > 0;
        yesBtn.textContent = hadPriorBeforeThisRecording ? '✓ That sounded better' : '✓ That sounded right';

        if (state.student) {
          saveRecording(state.student, moduleIndex, tier, recordingItemIndex, recordingBlob).then(() => {
            if (hadPriorBeforeThisRecording) {
              const lastAttempt = priorAttempts[priorAttempts.length - 1];
              compareSub.textContent = `Recorded ${timeAgo(lastAttempt.timestamp)}`;
              compareCard.style.display = 'flex';
            }
          }).catch(() => {});
        }

        assessWrap.style.display = 'block';
        if (skipBtn) skipBtn.style.display = 'none'; // once they've recorded, skip no longer makes sense
        hint.textContent = 'Listen to both, then tap how it went.';
      };

      mediaRecorder.start();
      isRecording = true;
      recIcon.textContent  = '⏹';
      recLabel.textContent = 'Stop';
      recBtn.classList.add('recording');
      hint.textContent = 'Recording… tap ⏹ to stop.';

    } catch (err) {
      showNoMicFallback();
    }
  });

  shareBtn.addEventListener('click', async () => {
    if (!recordingBlob) return;
    const ext = recordingBlob.type.includes('mp4') ? 'm4a' : 'webm';
    const file = new File([recordingBlob], `say-it-${Date.now()}.${ext}`, { type: recordingBlob.type });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'My recording', text: target });
      } catch (e) {}
      return;
    }

    const url = URL.createObjectURL(recordingBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `say-it-recording.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  });

  function lockAssess() {
    done = true;
    yesBtn.disabled = true;
    noBtn.disabled  = true;
    if (stream) stream.getTracks().forEach(t => t.stop());
  }

  yesBtn.addEventListener('click', () => {
    if (done) return;
    yesBtn.classList.add('selected');
    lockAssess();
    nextBtn.style.display = 'block';
    nextBtn.onclick = () => onDone({ assessed: true, correct: true });
  });

  noBtn.addEventListener('click', () => {
    if (done) return;
    noBtn.classList.add('selected');
    lockAssess();
    nextBtn.style.display = 'block';
    nextBtn.onclick = () => onDone({ assessed: true, correct: false });
  });

  if (skipBtn) {
    skipBtn.addEventListener('click', () => {
      if (done) return;
      if (stream) stream.getTracks().forEach(t => t.stop());
      onDone({ assessed: false });
    });
  }

  function showNoMicFallback() {
    recBtn.style.display  = 'none';
    playBtn.style.display = 'none';
    shareBtn.style.display = 'none';
    if (skipBtn) skipBtn.style.display = 'none';
    const msg = document.createElement('div');
    msg.className   = 'no-mic-msg';
    msg.textContent = 'Microphone not available. Listen to the model, say it aloud, then tap how it went.';
    container.querySelector('.speak-trio').insertAdjacentElement('afterend', msg);
    assessWrap.style.display = 'block';
    hint.style.display = 'none';
  }
}

const CONTEXT_ROLE_PRIORITY = ['object', 'time', 'place', 'subject', 'connector', 'verb'];

// Finds a real clue already sitting in a sentence's grammar tokens —
// whichever role the answer itself ISN'T, picked by how much context it
// usually carries (object/time/place tend to be more informative than a
// bare subject or connector). Needs no new authored content since it
// reuses tokens every module already has for the reinforcement panel.
// `answer` can be null (True/False has no single "answer word" — every
// token is fair game). `exclude` lets a second, genuinely different clue
// be found once the first has already been shown.
function findContextClue(answer, tokens, exclude) {
  if (!tokens || !tokens.length) return null;
  const answerToken = answer ? tokens.find(t => t.t.split(/\s+/).includes(answer)) : null;
  const candidates = tokens.filter(t => t !== answerToken && t.t && t.t.trim() && !(exclude || []).includes(t.t));
  if (!candidates.length) return null;
  for (const role of CONTEXT_ROLE_PRIORITY) {
    const match = candidates.find(t => t.r === role);
    if (match) return match.t;
  }
  return candidates[0].t;
}

const MODULE_REGISTRY = {

  // ─────────────────────────────────────────────
  //  LISTEN & CHOOSE
  //  v2 design: pool-based { pick, items: [{audio, question, options,
  //  answer}] }, separate pool per tier, multi-question session like every
  //  other module now. Every tier requires listening before the options
  //  unlock (the old bronze-only "unlock after 400ms regardless" safety
  //  window is gone — the new design just requires a listen every time,
  //  simpler and more consistent). Gold re-locks options on replay.
  //  Tap an option to select it, then Check (not immediate-answer-on-tap).
  // ─────────────────────────────────────────────
  'audio-understanding': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = biasedSelect(items, pick, it => it.answer);
      const isBronze = tier === 'bronze';
      const isGold = tier === 'gold';
      let idx = 0, totalScore = 0;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.18)',  color:'#4DD0E1' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.18)', color:'#CE93D8' },
        { border:'#FF9800', bg:'rgba(255,152,0,.18)',  color:'#FFB74D' },
        { border:'#E91E63', bg:'rgba(233,30,99,.18)',  color:'#F48FB1' }
      ];

      function renderQuestion() {
        const { audio, question, options, answer } = session[idx];
        let hasPlayed = false, playing = false, answered = false, optionsLive = false, selected = null, hintLevel = 0;

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <button class="precheck-hint-btn" id="lc-hint-btn" disabled>💡 Hint</button>
          <p class="lc-question-v2">${question}</p>
          <button class="lc-listen-btn-v2" id="lc-listen-btn">
            <span class="lc-listen-icon-v2" id="lc-listen-icon">🔊</span>
            <span id="lc-listen-label">Listen</span>
          </button>
          <p class="lc-hint-line-v2" id="lc-hint">&nbsp;</p>
          <div class="lc-options-grid-v2" id="lc-options"></div>
          <button id="gf-check-btn" class="gf-check-btn" style="display:none;">Check</button>
        `;

        const listenBtn = container.querySelector('#lc-listen-btn');
        const listenIcon = container.querySelector('#lc-listen-icon');
        const listenLabel = container.querySelector('#lc-listen-label');
        const hintLine = container.querySelector('#lc-hint');
        const optionsGrid = container.querySelector('#lc-options');
        const checkBtn = container.querySelector('#gf-check-btn');
        const hintBtn = container.querySelector('#lc-hint-btn');

        // Pre-check hint — no sentence/token context exists in this module
        // (just audio + options), so elimination is the honest fit here,
        // same reasoning as Picture & Word's image-to-word/word-to-image
        // modes. Gated behind having listened at least once — a hint
        // shouldn't let a student skip the actual listening step.
        // Two taps allowed now, not one — each eliminates one more wrong
        // option, same mechanism just one more step. A second hint only
        // fires if at least 2 wrong options remain afterward, so a
        // 3-option item never gets hinted down to a giveaway.
        hintBtn.addEventListener('click', () => {
          if (hintLevel >= 2 || !hasPlayed) return;
          const wrongBtns = [...optionsGrid.querySelectorAll('.lc-option-btn-v2')]
            .filter(b => b.textContent !== answer && !b.classList.contains('precheck-hint-eliminated'));
          if (hintLevel === 1 && wrongBtns.length < 2) return; // not enough left for a real second hint
          if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); }
          hintLevel++;
          const remainingWrong = [...optionsGrid.querySelectorAll('.lc-option-btn-v2')]
            .filter(b => b.textContent !== answer && !b.classList.contains('precheck-hint-eliminated'));
          if (hintLevel >= 2 || remainingWrong.length < 2) {
            hintBtn.disabled = true;
            hintBtn.textContent = '💡 Hint used';
          } else {
            hintBtn.textContent = '💡 Hint (1 more)';
          }
        });

        function showHint(msg) {
          hintLine.textContent = msg;
          hintLine.style.opacity = '1';
          setTimeout(() => { hintLine.style.opacity = '0'; }, 1800);
        }
        function setGridLive(live) {
          optionsLive = live;
          optionsGrid.querySelectorAll('.lc-option-btn-v2').forEach(b => {
            if (b.dataset.done) return;
            b.classList.toggle('locked', !live);
          });
        }

        const shuffledOptions = safeShuffle(options, () => false);
        shuffledOptions.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'lc-option-btn-v2 locked';
          btn.textContent = opt;
          const c = PALETTE[i % PALETTE.length];
          btn.addEventListener('click', () => {
            if (answered) return;
            if (!optionsLive) { showHint('🔊 Listen first!'); return; }
            if (selected === btn) {
              btn.style.borderColor = ''; btn.style.background = ''; btn.style.color = '';
              selected = null;
              checkBtn.style.display = 'none';
            } else {
              if (selected) {
                selected.style.borderColor = ''; selected.style.background = ''; selected.style.color = '';
              }
              selected = btn;
              btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
              checkBtn.style.display = 'block';
            }
          });
          optionsGrid.appendChild(btn);
        });

        setGridLive(false);

        listenBtn.addEventListener('click', () => {
          if (playing) return;
          playing = true;
          listenIcon.textContent = '⏸';
          listenLabel.textContent = 'Playing…';
          listenBtn.classList.add('playing');
          if (isGold && hasPlayed) setGridLive(false); // gold: re-hide options on replay

          const mood = isBronze ? 'slow' : 'neutral';
          let done = false;
          function onAudioEnd() {
            if (done) return;
            done = true;
            playing = false; hasPlayed = true;
            listenIcon.textContent = '🔊';
            listenLabel.textContent = 'Listen';
            listenBtn.classList.remove('playing');
            setGridLive(true);
            if (hintLevel < 2) hintBtn.disabled = false;
          }
          speak(audio, mood, 0, null, onAudioEnd);
          // Fallback in case onEnd never fires (browser quirk) — estimate
          // from text length, matching the demo's own safety margin.
          const estMs = Math.max(1500, (audio.length / (isBronze ? 0.8 : 0.85)) * 65);
          setTimeout(onAudioEnd, estMs + 2000);
        });

        checkBtn.addEventListener('click', () => {
          if (!selected || answered) return;
          answered = true;
          if (window.speechSynthesis) window.speechSynthesis.cancel();

          const correct = (selected.textContent === answer);
          if (state.student) recordWordExposure(state.student, answer, 'audio-understanding', correct).catch(() => {});
          optionsGrid.querySelectorAll('.lc-option-btn-v2').forEach(b => { b.dataset.done = '1'; b.style.pointerEvents = 'none'; });
          if (correct) totalScore++;
          checkBtn.style.display = 'none';

          setTimeout(() => {
            const bodyText = correct ? `You heard: "${audio}"` : `The answer was: ${answer}`;
            showPlainReinforce(correct, bodyText, () => {
              idx++;
              if (idx < session.length) renderQuestion();
              else onComplete(totalScore / session.length);
            });
          }, 550);
        });
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  GAP FILL
  //  One blank per question. Tap a word to fill it.
  //  Tap the same word again to clear.
  //  Check button confirms answer.
  // ─────────────────────────────────────────────
  'gap-fill': {
    // v2 design: pool-based. Each tier is { pick, items: [...] } — a separate
    // pool per tier (per Nick's decision: difficulty differs per tier, so
    // pools shouldn't be shared across tiers). Draws `pick` items.
    //
    // PILOT: Fading Hint Ladder (ported from hint-ladder-demo.html, this is
    // the first module to get it — replaces the old binary retry scoring).
    // hintLevel (0-3) only ever moves on a wrong attempt, resets each new
    // question: 1 = glow only, no text; 2 = category hint ("it's a verb");
    // 3 = first-letter hint. Stars this question: 0 hints=3, 1=2, 2+=1 —
    // mapped to a 0-1 score (1, 2/3, 1/3) that now drives the tier average
    // in place of the old first-try=1/retry=0.6 model. A Reflect pause only
    // appears when a hint was actually needed — a student who got it right
    // immediately keeps the same fast pace as before, unslowed.
    // Category hints fall back to the answer's grammar role (from tokens)
    // since there's no dedicated per-item hint-category field yet — real
    // authored categories ("it's a food word") would read richer than
    // "it's an object," but this needs no new content to work today.
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = biasedSelect(items, pick, it => it.answer);
      let idx = 0, totalScore = 0;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.18)',  color:'#4DD0E1' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.18)', color:'#CE93D8' },
        { border:'#FF9800', bg:'rgba(255,152,0,.18)',  color:'#FFB74D' },
        { border:'#E91E63', bg:'rgba(233,30,99,.18)',  color:'#F48FB1' },
        { border:'#8BC34A', bg:'rgba(139,195,74,.18)', color:'#AED581' }
      ];
      const SCORE_BY_HINT_LEVEL = { 0: 1, 1: 2/3, 2: 1/3, 3: 1/3 };

      function renderQuestion() {
        const { sentence, options, answer, tokens } = session[idx];
        let selected = null, hintLevel = 0, locked = false, usedElimination = false;
        const wrongOptions = new Set(); // confirmed wrong this question — tried by the student OR eliminated by a hint
        const contextClue1 = findContextClue(answer, tokens, []);
        const contextClue2 = contextClue1 ? findContextClue(answer, tokens, [contextClue1]) : null;

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <p class="gf-sentence" id="gf-sentence"></p>
          <div class="gf-hint-row" id="gf-hint-row">
            <span>hints</span>
            <div class="gf-hint-dot" id="gf-dot-1"></div>
            <div class="gf-hint-dot" id="gf-dot-2"></div>
            <div class="gf-hint-dot" id="gf-dot-3"></div>
          </div>
          <div class="gf-pill-row" id="gf-pill-row"></div>
          <button id="gf-check-btn" class="gf-check-btn">Check</button>
          <p class="gf-status" id="gf-status">&nbsp;</p>
          <button class="gf-reflect-btn" id="gf-reflect-btn">I see it now 👍 — continue</button>
        `;

        function renderSentence(cluesToShow) {
          let html = sentence.replace('___', '<span class="gf-blank" id="gf-blank-slot">&nbsp;</span>');
          (cluesToShow || []).forEach(clue => {
            if (clue && html.includes(clue)) {
              html = html.replace(clue, `<span class="gf-context-clue">${clue}</span>`);
            }
          });
          container.querySelector('#gf-sentence').innerHTML = html;
        }
        renderSentence([]);

        const pillRow    = container.querySelector('#gf-pill-row');
        const checkBtn   = container.querySelector('#gf-check-btn');
        const statusEl   = container.querySelector('#gf-status');
        const reflectBtn = container.querySelector('#gf-reflect-btn');
        const dots       = [null,
          container.querySelector('#gf-dot-1'),
          container.querySelector('#gf-dot-2'),
          container.querySelector('#gf-dot-3')];

        let letterHintIndex = null; // chosen once, first time hintLevel reaches 3 — stays stable after that

        function markPillWrong(word) {
          const pill = pillRow.querySelector(`[data-word="${word}"]`);
          if (pill) pill.classList.add('eliminated');
        }

        // Crosses out one wrong option the student hasn't already ruled out
        // — real, actionable narrowing, instead of a grammar-role label
        // that's equally true of every option and tells them nothing.
        // `respectFloor` protects against a PREMATURE full-solve (used at
        // level 2's fallback) — never eliminate down to 1 live option there,
        // some real retrieval effort should survive that early. Level 3 is
        // the genuine last resort after two real reasoning hints already
        // happened, so it's allowed to fully resolve if the pool is small
        // enough that nothing partial is left to reveal — that's not a
        // shortcut, it's what "last resort" is supposed to mean.
        function eliminateOneMore(respectFloor) {
          const liveCount = options.length - wrongOptions.size;
          if (respectFloor && liveCount <= 2) return null;
          const candidates = options.filter(o => o !== answer && !wrongOptions.has(o));
          if (candidates.length === 0) return null;
          const pick = candidates[0];
          wrongOptions.add(pick);
          markPillWrong(pick);
          return pick;
        }

        function updateHintVisuals() {
          if (hintLevel === 1) {
            renderSentence([contextClue1]);
          } else if (hintLevel === 2 && contextClue2) {
            renderSentence([contextClue1, contextClue2]);
          }
          const blank = container.querySelector('#gf-blank-slot'); // re-query fresh in case renderSentence just rebuilt it
          if (!blank) return;
          blank.classList.toggle('hint-glow', hintLevel >= 1);
          if (hintLevel === 3) {
            if (letterHintIndex === null) letterHintIndex = Math.floor(Math.random() * answer.length);
            const revealed = answer.split('').map((ch, i) => i === letterHintIndex ? ch : '_').join('');
            blank.innerHTML = `<span class="gf-hint-placeholder">${revealed}</span>`;
          } else if (!selected) {
            blank.innerHTML = '&nbsp;';
          }
          for (let i = 1; i <= 3; i++) dots[i].classList.toggle('used', hintLevel >= i);
        }

        const shuffledOptions = safeShuffle(options, () => false);
        shuffledOptions.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'gf-pill';
          btn.textContent = opt;
          btn.dataset.word = opt;
          const c = PALETTE[i % PALETTE.length];
          btn.addEventListener('click', () => {
            if (locked) return;
            pillRow.querySelectorAll('.gf-pill').forEach(x => {
              x.classList.remove('selected');
              x.style.borderColor = ''; x.style.background = ''; x.style.color = '';
            });
            btn.classList.add('selected');
            btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
            selected = opt;
            const blank = container.querySelector('#gf-blank-slot');
            if (blank) { blank.textContent = opt; blank.style.color = c.color; }
            sfx('tap');
          });
          pillRow.appendChild(btn);
        });

        checkBtn.addEventListener('click', () => {
          if (locked) return;
          if (!selected) { statusEl.textContent = 'pick an option first'; return; }

          if (selected === answer) {
            locked = true;
            checkBtn.disabled = true;
            sfx('correct');
            if (state.student) recordWordExposure(state.student, answer, 'gap-fill', true).catch(() => {});
            const score = SCORE_BY_HINT_LEVEL[hintLevel];
            totalScore += score;
            statusEl.textContent = 'correct!';

            const proceed = () => {
              const plain = (tokens || []).map(t => t.t).join(' ');
              showGrammarReinforce(tokens, plain, () => {
                idx++;
                if (idx < session.length) renderQuestion();
                else onComplete(totalScore / session.length);
              });
            };

            if (hintLevel > 0) {
              // A hint was actually needed this time — worth a real pause,
              // not just the usual fast handoff. A student who got it right
              // immediately never sees this and keeps the old pace exactly.
              reflectBtn.classList.add('show');
              reflectBtn.addEventListener('click', () => {
                reflectBtn.disabled = true;
                reflectBtn.textContent = 'Nice — that sticks better than just moving on ✓';
                setTimeout(proceed, 500);
              }, { once: true });
            } else {
              setTimeout(proceed, 550);
            }
          } else {
            wrongOptions.add(selected);
            markPillWrong(selected);
            hintLevel = Math.min(hintLevel + 1, 3);
            sfx('wrong');
            if (state.student) recordWordExposure(state.student, answer, 'gap-fill', false).catch(() => {});

            let eliminatedWord = null;
            let secondClueShown = false;

            if (hintLevel === 2) {
              if (contextClue2) {
                secondClueShown = true;
              } else if (!usedElimination) {
                // No second real clue exists for this sentence (short item) —
                // fall back to elimination here instead of showing nothing new.
                // Still a "middle rung" moment, so the floor still applies.
                eliminatedWord = eliminateOneMore(true);
                if (eliminatedWord) usedElimination = true;
              }
            } else if (hintLevel === 3 && !usedElimination) {
              // Only spend the elimination budget here if level 2 didn't
              // already use it via the fallback above — exactly one
              // elimination total across the whole ladder, never two.
              // No floor here — this is the genuine last resort.
              eliminatedWord = eliminateOneMore(false);
              if (eliminatedWord) usedElimination = true;
            }

            const messages = {
              1: contextClue1 ? 'Not quite — look at the highlighted word for a clue.' : 'Not quite — look at the highlighted blank.',
              2: secondClueShown
                  ? 'Not quite — here\'s another clue in the sentence.'
                  : (eliminatedWord ? `Hint: "${eliminatedWord}" isn't it either.` : 'Not quite — try again.'),
              3: eliminatedWord
                  ? `Almost — "${eliminatedWord}" is out too, and one letter is revealed in the blank.`
                  : 'Almost — one letter is revealed in the blank.',
            };
            statusEl.textContent = messages[hintLevel];
            updateHintVisuals();
            const sel = pillRow.querySelector(`[data-word="${selected}"]`);
            if (sel) sel.animate(
              [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],
              {duration:350}
            );
          }
        });
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  TRUE / FALSE
  //  Statement shown. Two big buttons.
  //  Tap one → immediate feedback, show correct.
  // ─────────────────────────────────────────────
  'true-false': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0, totalScore = 0;

      function renderQuestion() {
        const { statement, answer, tokens } = session[idx];
        let selectedChoice = null;
        let hintUsed = false;
        let attempts = 0; // track attempts for scoring

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <button class="precheck-hint-btn" id="tf-hint-btn">💡 Hint</button>
          <div class="tf-statement-v2" id="tf-statement">${statement}</div>
          <div class="tf-buttons-v2">
            <button class="tf-btn-v2" id="tf-true-btn">✓ True</button>
            <button class="tf-btn-v2" id="tf-false-btn">✗ False</button>
          </div>
          <button id="gf-check-btn" class="gf-check-btn">Check</button>
          <p class="gf-status" id="tf-status">&nbsp;</p>
        `;

        const trueBtn  = container.querySelector('#tf-true-btn');
        const falseBtn = container.querySelector('#tf-false-btn');
        const checkBtn = container.querySelector('#gf-check-btn');
        const statusEl = container.querySelector('#tf-status');
        const hintBtn  = container.querySelector('#tf-hint-btn');

        // Pre-check hint — a single, optional context-clue glow available
        // before committing an answer, not an escalating ladder. True/False
        // is a binary choice, so eliminating an option would just hand over
        // the answer — this respects that instead of forcing a mismatched
        // mechanic onto it.
        if (!findContextClue(null, tokens)) hintBtn.style.display = 'none';
        hintBtn.addEventListener('click', () => {
          if (hintUsed) return;
          hintUsed = true;
          const clue = findContextClue(null, tokens);
          if (!clue) return;
          const statementEl = container.querySelector('#tf-statement');
          if (statementEl.textContent.includes(clue)) {
            statementEl.innerHTML = statementEl.textContent.replace(clue, `<span class="gf-context-clue">${clue}</span>`);
          }
          hintBtn.disabled = true;
          hintBtn.textContent = '💡 Hint used';
        });

        function selectChoice(choice) {
          if (trueBtn.disabled) return;
          selectedChoice = (selectedChoice === choice) ? null : choice;
          trueBtn.classList.toggle('selected', selectedChoice === true);
          falseBtn.classList.toggle('selected', selectedChoice === false);
          statusEl.textContent = '\u00A0';
          sfx('tap');
        }
        trueBtn.addEventListener('click', () => selectChoice(true));
        falseBtn.addEventListener('click', () => selectChoice(false));

        checkBtn.addEventListener('click', () => {
          if (trueBtn.disabled) return;
          if (selectedChoice === null) { statusEl.textContent = 'pick True or False first'; return; }

          const correct = (selectedChoice === answer);
          attempts++;

          if (!correct && attempts === 1 && !hintUsed) {
            // First wrong attempt without hint — allow retry, nudge them
            selectedChoice = null;
            trueBtn.classList.remove('selected');
            falseBtn.classList.remove('selected');
            statusEl.textContent = 'Not quite — look again and try once more.';
            sfx('wrong');
            return;
          }
          if (!correct && attempts === 1 && hintUsed) {
            // First wrong attempt after hint — allow one more retry
            selectedChoice = null;
            trueBtn.classList.remove('selected');
            falseBtn.classList.remove('selected');
            statusEl.textContent = 'Not quite — one more try.';
            sfx('wrong');
            return;
          }

          // Lock in — score based on hint use and attempts
          trueBtn.disabled = true;
          falseBtn.disabled = true;
          checkBtn.disabled = true;
          if (correct) {
            totalScore += hintUsed ? 0.5 : (attempts === 1 ? 1 : 0.5);
          }

          const chosenBtn = selectedChoice ? trueBtn : falseBtn;
          chosenBtn.classList.remove('selected');
          chosenBtn.classList.add(correct ? 'hl-correct' : 'hl-wrong');
          statusEl.textContent = correct ? 'correct!' : 'not quite right';

          const isFalseCorrect = correct && answer === false;
          let plain, reinforceTokens;
          if (isFalseCorrect) {
            plain = session[idx].correction || null;
            reinforceTokens = null;
          } else {
            plain = tokens && tokens.length ? tokens.map(t => t.t).join(' ') : statement;
            reinforceTokens = tokens;
          }
          setTimeout(() => {
            setGrammarReinforceLabel(correct);
            showGrammarReinforce(reinforceTokens, plain, () => {
              idx++;
              if (idx < session.length) renderQuestion();
              else onComplete(totalScore / session.length);
            });
          }, 550);
        });
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  WORD MATCH
  //  Tap a word on the left, then its match on the right.
  //  Each matched pair gets a distinct colour from PALETTE.
  //  Wrong → both flash red, deselect.
  //  Score: 1.0 minus 0.1 per wrong attempt (floor 0.6).
  // ─────────────────────────────────────────────
  // ─────────────────────────────────────────────
  //  WORD MATCH
  //  v2 design: pool-based { pick, items: [{left,right}] }, separate pool
  //  per tier. Free re-pairing model (not lock-on-first-click) — tap a left,
  //  tap a right to assign it (unlinking any prior pairing on either side
  //  first), reassign as much as you want. Only checks correctness once
  //  every left has SOME right assigned; if not fully correct, shows
  //  "Not quite yet" and lets you keep adjusting rather than penalizing.
  //  Bronze-only nudge message on a wrong-but-complete-looking assignment.
  //  Always full score on completion — this module requires eventual full
  //  correctness to advance, not partial credit.
  // ─────────────────────────────────────────────
  'word-match': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const pairs = biasedSelect(items, pick, it => it.left);
      const total = pairs.length;
      const isBronze = (tier === 'bronze');

      const PALETTE = [
        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },
        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },
        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },
        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },
        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }
      ];
      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Match the words.</span><span id="wm-score">0 of ${total} paired</span>`;

      container.innerHTML = `
        <div class="wm-grid-v2">
          <div class="wm-col-v2" id="wm-left-col"></div>
          <div class="wm-col-v2" id="wm-right-col"></div>
        </div>
        <p class="wm-encourage-v2" id="wm-encourage"></p>
        <p class="wm-nudge-v2" id="wm-nudge"></p>
        <button id="wm-notquite-btn" class="wm-notquite-btn-v2" disabled>Not quite yet</button>
        <button id="wm-next-btn" class="iv-proceed-btn">Next →</button>
      `;

      const leftCol      = container.querySelector('#wm-left-col');
      const rightCol     = container.querySelector('#wm-right-col');
      const scoreLabel   = document.getElementById('wm-score');
      const encourageEl  = container.querySelector('#wm-encourage');
      const nudgeEl      = container.querySelector('#wm-nudge');
      const notQuiteBtn  = container.querySelector('#wm-notquite-btn');
      const nextBtn      = container.querySelector('#wm-next-btn');

      let pairings = new Map();   // leftIdx -> rightIdx
      let rightUsed = new Map();  // rightIdx -> leftIdx
      let selectedLeftBtn = null;
      let confirmed = false;

      function styleLeft(btn) {
        if (confirmed) return;
        const idx = parseInt(btn.dataset.pairIdx);
        const c = pairColor[idx];
        const isSelected = (btn === selectedLeftBtn);
        const isPaired = pairings.has(idx);
        if (isSelected) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = `0 0 0 3px ${c.border}`;
        } else if (isPaired) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = '';
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';
        }
      }
      function styleRight(btn) {
        if (confirmed) return;
        const rightIdx = parseInt(btn.dataset.pairIdx);
        if (rightUsed.has(rightIdx)) {
          const c = pairColor[rightUsed.get(rightIdx)];
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)';
        }
      }
      function checkAllCorrect() {
        if (pairings.size !== total) return false;
        for (const leftIdx of pairings.keys()) {
          if (pairings.get(leftIdx) !== leftIdx) return false;
        }
        return true;
      }
      function refreshAll() {
        container.querySelectorAll('.wm-btn-v2[data-side="left"]').forEach(styleLeft);
        container.querySelectorAll('.wm-btn-v2[data-side="right"]').forEach(styleRight);

        let correctSoFar = 0, wrongSoFar = 0;
        pairings.forEach((rightIdx, leftIdx) => {
          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;
        });

        if (pairings.size === total) {
          if (state.student) {
            pairings.forEach((rightIdx, leftIdx) => {
              const word = pairs[leftIdx] && pairs[leftIdx].left;
              if (word) recordWordExposure(state.student, word, 'word-match', rightIdx === leftIdx).catch(() => {});
            });
          }
          if (checkAllCorrect()) {
            confirmed = true;
            sfx('correct');
            scoreLabel.textContent = 'Good job!';
            scoreLabel.style.color = '#AED581';
            notQuiteBtn.style.display = 'none';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
            nextBtn.style.display = 'flex';
            nextBtn.onclick = () => onComplete(1);
          } else {
            sfx('wrong');
            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;
            scoreLabel.style.color = '';
            nextBtn.style.display = 'none';
            notQuiteBtn.style.display = 'flex';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
          }
        } else {
          scoreLabel.textContent = `${pairings.size} of ${total} paired`;
          scoreLabel.style.color = '';
          nextBtn.style.display = 'none';
          notQuiteBtn.style.display = 'none';

          // Bronze only: nudge the moment a wrong pairing exists, takes priority over encouragement
          if (isBronze && wrongSoFar > 0) {
            nudgeEl.textContent = 'Are you sure about that one?';
            nudgeEl.style.opacity = '1';
            encourageEl.style.opacity = '0';
          } else {
            nudgeEl.style.opacity = '0';
            if (correctSoFar > 0) {
              const ratio = correctSoFar / total;
              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'
                                       : ratio >= 0.34 ? 'Getting there!'
                                       : 'Nice, keep going!';
              encourageEl.style.opacity = '1';
            } else {
              encourageEl.style.opacity = '0';
            }
          }
        }
      }

      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));
      const leftItems = safeShuffle(withIdx, () => false);
      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));

      leftItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.left;
        btn.dataset.side = 'left';
        btn.dataset.pairIdx = pair.pairIdx;
        leftCol.appendChild(btn);
      });
      rightItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.right;
        btn.dataset.side = 'right';
        btn.dataset.pairIdx = pair.pairIdx;
        rightCol.appendChild(btn);
      });

      container.querySelectorAll('.wm-btn-v2').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirmed) return;

          if (btn.dataset.side === 'left') {
            sfx('tap');
            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;
            refreshAll();
            return;
          }

          // Right button — always unlink any existing pairing first, then optionally re-pair
          const rightIdx = parseInt(btn.dataset.pairIdx);
          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;

          if (rightUsed.has(rightIdx)) {
            const prevLeftIdx = rightUsed.get(rightIdx);
            pairings.delete(prevLeftIdx);
            rightUsed.delete(rightIdx);
            if (leftIdx === null || leftIdx === prevLeftIdx) {
              selectedLeftBtn = null;
              sfx('tap');
              refreshAll();
              return;
            }
          }
          if (leftIdx === null) { refreshAll(); return; }

          if (pairings.has(leftIdx)) {
            rightUsed.delete(pairings.get(leftIdx));
            pairings.delete(leftIdx);
          }
          pairings.set(leftIdx, rightIdx);
          rightUsed.set(rightIdx, leftIdx);
          selectedLeftBtn = null;
          sfx('tap');
          refreshAll();
        });
      });
    }
  },

  // ─────────────────────────────────────────────
  //  SEQUENCING ("Put in Order")
  //  v2 design: pool-based { pick, items: [{prompt, sequence, correct}] },
  //  same standard as every other module. Each slot is colored by its
  //  POSITION (1st, 2nd, 3rd...) using the same 5-color PALETTE as
  //  gap-fill/word-match, not by which word occupies it — matches
  //  put-in-order-demo.html exactly (SEQ_PALETTE there).
  //  Items shown in pool. Tap to place into numbered slots.
  //  Tap a filled slot to return item to pool.
  //  Check button appears when all slots filled.
  //  Score per question: correct positions / total. Averaged across the
  //  `pick` questions drawn for the tier's session.
  //  Deliberately not wired into spaced repetition — sentence-ordering
  //  exercises don't have a clean single-word signal the way gap-fill or
  //  spelling do, and this module type was never on the spec's tracked
  //  list. No recordWordExposure calls here on purpose, not an oversight.
  // ─────────────────────────────────────────────
  'sequencing': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0, totalScore = 0;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)',  text:'#00BCD4' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)', text:'#CE93D8' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)',  text:'#FFB74D' },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)',  text:'#F48FB1' },
        { border:'#8BC34A', bg:'rgba(139,195,74,.15)', text:'#AED581' }
      ];

      function renderQuestion() {
        const { prompt, sequence, correct } = session[idx];
        const slots = new Array(correct.length).fill(null);
        let checked = false;

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        container.innerHTML = `
          <p class="seq-prompt-v2">${prompt}</p>
          <div class="seq-slots-v2" id="seq-slots"></div>
          <p class="seq-pool-label-v2">Tap to place ↓</p>
          <div class="seq-pool-v2" id="seq-pool"></div>
          <button id="gf-check-btn" class="gf-check-btn" style="display:none;">Check</button>
          <p class="gf-status" id="seq-status">&nbsp;</p>
          <button id="seq-next-btn" class="iv-proceed-btn">Next →</button>
        `;

        const slotsEl  = container.querySelector('#seq-slots');
        const poolEl   = container.querySelector('#seq-pool');
        const checkBtn = container.querySelector('#gf-check-btn');
        const nextBtn  = container.querySelector('#seq-next-btn');
        const statusEl = container.querySelector('#seq-status');
        let seqAttempts = 0;
        let confirmedSlots = new Set(); // indices confirmed correct by hint

        function renderSlots() {
          slotsEl.innerHTML = '';
          slots.forEach((val, i) => {
            const c = PALETTE[i % PALETTE.length];
            const isConfirmed = confirmedSlots.has(i);
            const slot = document.createElement('div');
            slot.className = 'seq-slot-v2';
            const numColor = val ? (isConfirmed ? '#8BC34A' : c.border) : 'rgba(255,255,255,0.3)';
            slot.innerHTML = `<div class="slot-num-v2" style="color:${numColor};">${i + 1}</div><div class="slot-text-v2">${val || ''}</div>`;

            if (val && !checked && !isConfirmed) {
              slot.style.borderColor = c.border;
              slot.style.background = c.bg;
              slot.querySelector('.slot-text-v2').style.color = c.text;
              slot.style.cursor = 'pointer';
              slot.addEventListener('click', () => {
                const word = slots[i];
                slots[i] = null;
                poolEl.querySelectorAll('.seq-item-v2').forEach(b => {
                  if (b.dataset.word === word) b.classList.remove('used');
                });
                sfx('tap');
                renderSlots();
                updateCheck();
              });
            } else if (isConfirmed) {
              slot.style.borderColor = '#8BC34A';
              slot.style.background = 'rgba(139,195,74,0.15)';
              slot.querySelector('.slot-text-v2').style.color = '#AED581';
            } else if (val) {
              slot.style.borderColor = c.border;
              slot.style.background = c.bg;
              slot.querySelector('.slot-text-v2').style.color = c.text;
            }
            slotsEl.appendChild(slot);
          });
        }

        function updateCheck() {
          checkBtn.style.display = slots.every(s => s !== null) ? 'block' : 'none';
        }

        const shuffled = [...sequence].sort(() => Math.random() - 0.5);
        shuffled.forEach(word => {
          const btn = document.createElement('button');
          btn.className = 'seq-item-v2';
          btn.textContent = word;
          btn.dataset.word = word;
          btn.addEventListener('click', () => {
            if (btn.classList.contains('used') || checked) return;
            const emptyIdx = slots.findIndex((s, i) => s === null && !confirmedSlots.has(i));
            if (emptyIdx === -1) return;
            slots[emptyIdx] = word;
            btn.classList.add('used');
            sfx('tap');
            renderSlots();
            updateCheck();
          });
          poolEl.appendChild(btn);
        });

        checkBtn.addEventListener('click', () => {
          if (checked) return;
          seqAttempts++;
          poolEl.querySelectorAll('.seq-item-v2').forEach(b => b.style.pointerEvents = 'none');

          let correctCount = 0;
          let newlyConfirmed = [];
          slots.forEach((val, i) => {
            if (val === correct[i]) { correctCount++; newlyConfirmed.push(i); }
          });

          const allCorrect = correctCount === correct.length;

          if (allCorrect) {
            checked = true;
            slotsEl.querySelectorAll('.seq-slot-v2').forEach(slot => {
              slot.style.borderColor = '#8BC34A';
              slot.style.background = 'rgba(139,195,74,0.15)';
            });
            const seqScore = seqAttempts === 1 ? 1 : seqAttempts === 2 ? 0.6 : 0.3;
            totalScore += seqScore;
            checkBtn.style.display = 'none';
            nextBtn.style.display = 'block';
          } else {
            // Confirm already-correct slots, return wrong ones to pool
            newlyConfirmed.forEach(i => confirmedSlots.add(i));
            slots.forEach((val, i) => {
              if (val !== correct[i] && val !== null) {
                poolEl.querySelectorAll('.seq-item-v2').forEach(b => {
                  if (b.dataset.word === val) b.classList.remove('used');
                });
                slots[i] = null;
              }
            });
            const confirmedCount = confirmedSlots.size;
            sfx('wrong');
            if (confirmedCount > 0) {
              statusEl.textContent = `${confirmedCount} in the right place — keep going!`;
              statusEl.style.color = '#AED581';
            } else {
              statusEl.textContent = 'Not quite — try a different order.';
              statusEl.style.color = 'rgba(255,255,255,0.5)';
            }
            poolEl.querySelectorAll('.seq-item-v2').forEach(b => b.style.pointerEvents = 'auto');
            renderSlots();
            updateCheck();
          }
        });

        nextBtn.addEventListener('click', () => {
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(totalScore / session.length);
        });

        renderSlots();
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  AUDIO SPEAKING ("Say It")
  //  v2 design: pool-based, { pick, items: [{prompt,target,keyWords}] } per
  //  tier — this module was missed during the original 12-module shell
  //  merge (it kept its pre-merge single-item shape while the Lesson
  //  Builder's authoring side was already pool-based), found and fixed here.
  //
  //  Three-button compare mechanic:
  //    [🔊 Model] — plays TTS (swap src for MP3 later)
  //    [▶ You]   — plays back student's recording (unlocks after first record)
  //    [🎤 Rec]  — records / re-records via MediaRecorder
  //
  //  Recordings persist to the local progress database (last 3 kept per
  //  exercise, keyed by student — see saveRecording/getRecordings). This is
  //  a self-evaluation tool, not a teacher-review tool: nothing leaves the
  //  device unless the student actively shares it. When a prior attempt
  //  exists, a compare card appears after the fresh recording (never
  //  before — nothing to compare on a genuine first try), and the
  //  self-assess wording shifts from "sounded right" (checking against the
  //  model) to "sounded better" (checking growth against yourself).
  //
  //  Uses MediaRecorder API (works on iOS Safari 14.5+, Chrome, Firefox, Edge).
  //  Falls back to model-only + self-assess if mic permission denied.
  //  Scoring: self-assess only — student decides when they're happy.
  // ─────────────────────────────────────────────
  'audio-speaking': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      const isBronze = tier === 'bronze';
      let idx = 0, totalScore = 0;

      function renderQuestion() {
        const { prompt, target, audioFile } = session[idx];
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        renderSayItInteraction(container, {
          prompt, target, audioFile, isBronze,
          moduleIndex: state.currentModuleIndex,
          tier,
          recordingItemIndex: idx,
          allowSkip: false, // the standalone module always requires an assessment — only the pyramid's chained step is skippable
        }, (result) => {
          totalScore += result.correct ? 1 : 0;
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(totalScore / session.length);
        });
      }

      renderQuestion();
    }
  },



  // ─────────────────────────────────────────────
  //  IMAGE VOCAB
  //  Bronze: image → tap correct word
  //  Silver: word  → tap correct image
  //  Gold:   image + sentence blank → word bank
  // ─────────────────────────────────────────────
  'image-vocab': {
    // "Picture & Word" module — kept as 'image-vocab' to match the real
    // production `type` field; SHELL_MERGE_SPEC's "picture-word" is a
    // descriptive name, not the actual data-contract key.
    // v2 design: separate pool PER TIER — { pick, mode, items: [...] } —
    // per Nick's decision that difficulty (and content) shouldn't be shared
    // across tiers. `cloze` is just the answer word (e.g. "runs"), not a
    // full sentence — `sentence` already contains the ___ blank.
    render(container, data, tier, onComplete) {
      const { pick, mode, items } = data;
      const session = biasedSelect(items, pick, it => it.word);
      let idx = 0, score = 0, locked = false, selected = null;

      function pips() {
        return session.map((_, i) =>
          `<div class="iv-pip${i<idx?' done':i===idx?' current':''}"></div>`
        ).join('');
      }

      function renderQuestion() {
        locked = false; selected = null;
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        container.innerHTML = `
          <div class="iv-pips-row" id="iv-pips"></div>
          <div id="iv-content"></div>
          <p class="iv-feedback" id="iv-feedback"></p>
          <button id="iv-check-btn" class="iv-action-btn">Check →</button>
          <button id="iv-next-btn" class="iv-proceed-btn">Next →</button>
        `;
        container.querySelector('#iv-pips').innerHTML = pips();

        const content  = container.querySelector('#iv-content');
        const checkBtn = container.querySelector('#iv-check-btn');
        const nextBtn  = container.querySelector('#iv-next-btn');
        const item = session[idx];
        let spokenWord;

        let hintUsed = false;
        function addHintButton(onUse) {
          const btn = document.createElement('button');
          btn.className = 'precheck-hint-btn';
          btn.textContent = '💡 Hint';
          btn.addEventListener('click', () => {
            if (hintUsed) return;
            hintUsed = true;
            onUse();
            btn.disabled = true;
            btn.textContent = '💡 Hint used';
          }, { once: true });
          content.insertAdjacentElement('afterbegin', btn);
        }

        if (mode === 'image-to-word') {
          const pool = safeShuffle(items.filter(i => i.word !== item.word), () => false).slice(0, 2);
          const opts = safeShuffle([item, ...pool], r => r[0].word === item.word);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-emoji">${item.emoji}</div><p class="iv-instruction">Tap the correct word</p></div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn" data-val="${o.word}" data-ans="${item.word}">${o.word}</button>`).join('')}</div>
          `;
          spokenWord = item.word;
          // No sentence context exists in this mode — elimination is the
          // honest fit here, not a mismatched sentence-glow with nothing to point at.
          addHintButton(() => {
            const wrongBtns = [...content.querySelectorAll('.iv-option-btn')].filter(b => b.dataset.val !== item.word);
            if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); wrongBtns[0].disabled = true; }
          });
        } else if (mode === 'word-to-image') {
          const pool = safeShuffle(items.filter(i => i.emoji !== item.emoji), () => false).slice(0, 2);
          const opts = safeShuffle([item, ...pool], r => r[0].emoji === item.emoji);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-word">${item.word}</div><p class="iv-instruction">Tap the correct picture</p></div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn emoji-opt" data-val="${o.emoji}" data-ans="${item.emoji}">${o.emoji}</button>`).join('')}</div>
          `;
          spokenWord = item.word;
          addHintButton(() => {
            const wrongBtns = [...content.querySelectorAll('.iv-option-btn')].filter(b => b.dataset.val !== item.emoji);
            if (wrongBtns.length) { wrongBtns[0].classList.add('precheck-hint-eliminated'); wrongBtns[0].disabled = true; }
          });
        } else {
          // cloze-image: `sentence` already has ___, `cloze` is the answer word
          const pool = safeShuffle(items.filter(i => i.cloze !== item.cloze), () => false).slice(0, 3);
          const opts = safeShuffle([item, ...pool], r => r[0].cloze === item.cloze);
          content.innerHTML = `
            <div class="iv-visual"><div class="iv-emoji" style="font-size:9cqw;">${item.emoji}</div></div>
            <div class="iv-sentence" id="iv-sentence-text">${item.sentence.replace('___', '<span class="iv-blank" id="iv-blank">___</span>')}</div>
            <div class="iv-options-grid">${opts.map(o => `<button class="iv-option-btn" data-val="${o.cloze}" data-ans="${item.cloze}">${o.cloze}</button>`).join('')}</div>
          `;
          spokenWord = item.cloze;
          // No per-token grammar data here, just a plain sentence string —
          // glow the whole thing rather than pretending to isolate one word
          // we have no role-tagging for.
          addHintButton(() => {
            const sentenceEl = container.querySelector('#iv-sentence-text');
            if (sentenceEl) sentenceEl.classList.add('gf-blank', 'hint-glow');
          });
        }
        // Only word-to-image auto-speaks — there, spokenWord is already
        // visible on screen as text, so saying it aloud adds nothing new.
        // In image-to-word and cloze-image, spokenWord IS the hidden
        // answer (matches one of the option buttons, or fills the blank),
        // so speaking it automatically was giving away the answer before
        // the student could even try. No other module in the app
        // auto-speaks an answer before picking — Listen & Choose
        // deliberately gates its audio behind an explicit tap for exactly
        // this reason.
        if (mode === 'word-to-image') speak(spokenWord, 'neutral', 300);

        content.querySelectorAll('.iv-option-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (locked) return;
            content.querySelectorAll('.iv-option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selected = { val: btn.dataset.val, ans: btn.dataset.ans };
            const blank = content.querySelector('#iv-blank');
            if (blank && mode === 'cloze-image') blank.textContent = btn.dataset.val;
            checkBtn.style.display = 'block';
          });
        });

        checkBtn.addEventListener('click', () => {
          if (!selected || locked) return;
          locked = true;
          const ok = selected.val === selected.ans;
          if (state.student) recordWordExposure(state.student, selected.ans, 'image-vocab', ok).catch(() => {});
          if (ok) score++;
          const feedback = container.querySelector('#iv-feedback');
          feedback.textContent = ok ? '✓ Correct!' : '✗ See the right answer';
          feedback.style.color = ok ? '#AED581' : '#F48FB1';
          checkBtn.style.display = 'none';
          content.querySelectorAll('.iv-option-btn').forEach(b => {
            b.disabled = true;
            if (b.dataset.val === b.dataset.ans) b.classList.add('correct');
            else if (b.dataset.val === selected.val && !ok) b.classList.add('wrong');
            else b.classList.remove('selected');
          });
          const blank = content.querySelector('#iv-blank');
          if (blank) blank.textContent = selected.ans;
          speak(spokenWord, ok ? 'celebrate' : 'wrong');
          if (mode === 'cloze-image') {
            const fullSentence = item.sentence.replace('___', selected.ans);
            speak(fullSentence, ok ? 'celebrate' : 'neutral', 900);
          }
          nextBtn.style.display = 'block';
        });

        nextBtn.addEventListener('click', () => {
          idx++;
          if (idx < session.length) renderQuestion();
          else onComplete(score / session.length);
        });
      }

      renderQuestion();
    }
  },

  // ─────────────────────────────────────────────
  //  MEMORY PAIRS
  //  v2 design: per-tier pool { pick, flipback(ms), items }, separate pool
  //  per tier (not shared across tiers — same standardization as every
  //  other module now). `pick` pairs drawn, image card + word card each.
  //  Flip two, find the match. Cards colored by pair via PALETTE on match,
  //  matching Put in Order/Gap-fill's shared palette convention.
  //  Audio rule (confirmed with Nick): every flip says its word immediately,
  //  EXCEPT the 2nd flip is silent if it matches the 1st (already just
  //  heard it). On mismatch, both cards' audio already played at flip-time.
  //  On match: grammar-color sentence reinforcement (shared with
  //  gap-fill/true-false), not the generic word/emoji panel.
  // ─────────────────────────────────────────────
  'memory-pairs': {
    render(container, data, tier, onComplete) {
      const { pick, flipback, items } = data;
      const picked = biasedSelect(items, pick, it => it.word);
      const PAIRS = picked.length;
      const deckSrc = [
        ...picked.map((it,i)=>({...it, kind:'image', pid:i})),
        ...picked.map((it,i)=>({...it, kind:'word',  pid:i})),
      ];
      const deck = safeShuffle(deckSrc, r => {
        for (let i=0;i<r.length-1;i++) if(r[i].pid===r[i+1].pid) return true;
        return false;
      });

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)'  },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)'  },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)'  },
        { border:'#8BC34A', bg:'rgba(139,195,74,.15)' }
      ];

      let flipped=[], matched=0, flips=0, cardLocked=false;

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Find the pairs</span><span>Flips: <span id="mp-flips">0</span></span>`;

      container.innerHTML = `
        <div class="mp-pips-row-v2" id="mp-pips"></div>
        <div class="mp-card-grid-v2" id="mp-grid"></div>
        <p class="mp-status-v2" id="mp-msg">&nbsp;</p>
      `;

      const pipsEl = container.querySelector('#mp-pips');
      picked.forEach((_, i) => {
        const c = PALETTE[i % PALETTE.length];
        const pip = document.createElement('div');
        pip.className = 'mp-pip-v2';
        pip.id = `mp-pip-${i}`;
        pip.style.background = c.bg;
        pip.style.borderColor = c.border;
        pipsEl.appendChild(pip);
      });

      const gridEl = container.querySelector('#mp-grid');
      deck.forEach((card, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'mp-card-wrap-v2';
        wrap.id = `mp-cw-${i}`;
        wrap.innerHTML = `
          <div class="mp-card-inner-v2" id="mp-ci-${i}">
            <div class="mp-card-face-v2 mp-card-back-v2">?</div>
            <div class="mp-card-face-v2 mp-card-front-v2" id="mp-cf-${i}">
              ${card.kind === 'image'
                ? (card.image
                    ? `<img src="${card.image}" alt="${card.word}" style="width:70%;height:70%;object-fit:cover;border-radius:8px;">`
                    : `<span class="mp-emoji-v2">${card.emoji}</span>`)
                : `<span>${card.word}</span>`}
            </div>
          </div>`;
        wrap.addEventListener('click', () => mpFlip(i));
        gridEl.appendChild(wrap);
      });

      function mpFlip(i) {
        if (cardLocked) return;
        const cw = document.getElementById(`mp-cw-${i}`);
        const ci = document.getElementById(`mp-ci-${i}`);
        if (!cw || cw.dataset.done || cw.dataset.flipped) return;
        cw.dataset.flipped = '1';
        ci.classList.add('flipped');

        if (flipped.length === 0) {
          // First card of the pair — always say it.
          speak(deck[i].word, 'neutral', 0, deck[i].audioFile);
        } else {
          // Second card — only say it if it's NOT a match with the first;
          // a match means it's the same word we just said a second ago.
          const first = deck[flipped[0]];
          const second = deck[i];
          const isMatch = first.pid === second.pid && first.kind !== second.kind;
          if (!isMatch) speak(second.word, 'neutral', 0, second.audioFile);
        }

        flips++;
        document.getElementById('mp-flips').textContent = flips;
        flipped.push(i);
        if (flipped.length === 2) { cardLocked = true; setTimeout(mpCheck, 500); }
      }

      function mpCheck() {
        const [a, b] = flipped;
        const ca = deck[a], cb = deck[b];
        const isMatch = ca.pid === cb.pid && ca.kind !== cb.kind;
        if (state.student) {
          if (isMatch) {
            // ca.word === cb.word here — same underlying item, just its image
            // and word cards — recording it twice would double-advance the box.
            recordWordExposure(state.student, ca.word, 'memory-pairs', true).catch(() => {});
          } else {
            recordWordExposure(state.student, ca.word, 'memory-pairs', false).catch(() => {});
            recordWordExposure(state.student, cb.word, 'memory-pairs', false).catch(() => {});
          }
        }
        if (isMatch) {
          matched++;
          const c = PALETTE[ca.pid % PALETTE.length];
          ['mp-cf-'+a,'mp-cf-'+b].forEach(id=>{
            const el=document.getElementById(id);
            if(el){el.style.background=c.bg;el.style.borderColor=c.border;}
          });
          document.getElementById(`mp-cw-${a}`).dataset.done='1';
          document.getElementById(`mp-cw-${b}`).dataset.done='1';
          const pip=document.getElementById(`mp-pip-${ca.pid}`);
          if(pip){pip.classList.add('done');pip.style.background=c.border;}
          flipped=[];

          if (window.speechSynthesis) window.speechSynthesis.cancel();
          showGrammarReinforce(ca.tokens, ca.sentence, () => {
            cardLocked = false;
            if (matched === PAIRS) {
              setTimeout(()=>onComplete(matched/PAIRS), 400);
            }
          });
        } else {
          const ciA=document.getElementById(`mp-ci-${a}`);
          const ciB=document.getElementById(`mp-ci-${b}`);
          if(ciA){ciA.style.boxShadow='0 0 0 2px #E91E63';}
          if(ciB){ciB.style.boxShadow='0 0 0 2px #E91E63';}
          // No audio here — both cards already said their word at flip-time
          // (see mpFlip). Playing again here would just repeat them.
          setTimeout(()=>{
            if(ciA){ciA.classList.remove('flipped');ciA.style.boxShadow='';}
            if(ciB){ciB.classList.remove('flipped');ciB.style.boxShadow='';}
            delete document.getElementById(`mp-cw-${a}`).dataset.flipped;
            delete document.getElementById(`mp-cw-${b}`).dataset.flipped;
            flipped=[]; cardLocked=false;
          }, flipback || 1100);
        }
      }
    }
  },

  // ─────────────────────────────────────────────
  //  WORD SCRAMBLE
  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] },
  //  separate pool per tier. Tap scrambled letter tiles into slots; tap a
  //  filled slot to remove. Manual play button only — no auto-announce on
  //  question load, matching the locked demo (word-scramble-demo.html).
  //  Each question gets one color from PALETTE (not per-letter), cycling
  //  across the session.
  //  Audio (confirmed with Nick): correct → word once, then the sentence
  //  (not word-word-sentence). Wrong → word once, then silent retry (not
  //  twice). Grammar-color sentence reinforcement on correct via
  //  showGrammarReinforce, same as gap-fill/true-false/memory-pairs.
  // ─────────────────────────────────────────────
  'word-scramble': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = biasedSelect(items, pick, it => it.word);
      let idx = 0, score = 0, slotData = [], bankData = [], wsLocked = false;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.15)' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.15)' },
        { border:'#FF9800', bg:'rgba(255,152,0,.15)' },
        { border:'#E91E63', bg:'rgba(233,30,99,.15)' }
      ];
      function itemColor() { return PALETTE[idx % PALETTE.length]; }

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      function load() {
        wsLocked = false;
        const item = session[idx];
        const letters = item.word.toUpperCase().split('');
        slotData = letters.map(() => null);
        const wordUp = item.word.toUpperCase();
        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        draw();
      }

      let wsHintLevel = 0;
      let wsAttempts  = 0;

      function draw() {
        wsHintLevel = 0;
        wsAttempts  = 0;
        const item = session[idx];
        const hasClue = !!findContextClue(item.word, item.tokens);
        container.innerHTML = `
          <div class="mp-pips-row-v2" id="ws-pips" style="${session.length<=1?'display:none;':''}" ></div>
          <button class="precheck-hint-btn" id="ws-hint-btn">💡 Hint</button>
          <p class="ws-feedback-v2" id="ws-clue" style="display:none;"></p>
          <div class="ws-visual-v2">
            <div class="ws-emoji-v2">${item.emoji}</div>
            <button class="ws-play-btn-v2" id="ws-play-btn">🔊</button>
          </div>
          <div class="ws-slots-v2" id="ws-slots"></div>
          <div class="ws-bank-v2" id="ws-bank"></div>
          <p class="ws-feedback-v2" id="ws-fb">&nbsp;</p>
        `;
        container.querySelector('#ws-pips').innerHTML = pips();

        const hintBtn = container.querySelector('#ws-hint-btn');
        const clueEl  = container.querySelector('#ws-clue');

        hintBtn.addEventListener('click', () => {
          if (wsHintLevel >= 2) return;
          wsHintLevel++;
          if (wsHintLevel === 1 && hasClue) {
            const clue = findContextClue(item.word, item.tokens);
            clueEl.innerHTML = `Clue: <span class="gf-context-clue">${clue}</span>`;
            clueEl.style.display = 'block';
            hintBtn.textContent = '💡 Hint (1 more)';
          } else {
            // Level 2: lock one correct letter into the first empty slot
            const word = item.word.toUpperCase();
            const firstEmpty = slotData.indexOf(null);
            if (firstEmpty !== -1) {
              const correctLetter = word[firstEmpty];
              // find a bank tile with that letter that isn't used
              const tile = bankData.find(t => t.letter === correctLetter && !t.used);
              if (tile) {
                tile.used = true;
                slotData[firstEmpty] = { letter: tile.letter, bankId: tile.id, locked: true };
                refreshSlots();
                refreshBank();
              }
            }
            hintBtn.disabled = true;
            hintBtn.textContent = '💡 Hint used';
            clueEl.style.display = 'none';
          }
        });

        const wsSlots = container.querySelector('#ws-slots');
        slotData.forEach((_, si) => {
          const d = document.createElement('div');
          d.className = 'ws-slot-v2';
          d.id = `ws-s-${si}`;
          d.addEventListener('click', () => wsRemove(si));
          wsSlots.appendChild(d);
        });

        const wsBank = container.querySelector('#ws-bank');
        bankData.forEach((t, bi) => {
          const b = document.createElement('button');
          b.className = 'ws-tile-v2';
          b.id = `ws-t-${bi}`;
          b.textContent = t.letter;
          b.addEventListener('click', () => wsTap(bi));
          wsBank.appendChild(b);
        });

        container.querySelector('#ws-play-btn').addEventListener('click', () => {
          speak(item.word, 'neutral');
        });

        refreshSlots(); refreshBank();
      }

      function refreshSlots() {
        const c = itemColor();
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`ws-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.letter : '';
          if (entry && entry.locked) {
            el.style.borderColor = '#8BC34A'; el.style.background = 'rgba(139,195,74,0.15)';
            el.style.color = '#AED581';
          } else {
            el.style.borderColor = entry ? c.border : 'rgba(255,255,255,0.08)';
            el.style.background = entry ? c.bg : 'rgba(255,255,255,0.05)';
            el.style.color = entry ? c.border : '#fff';
          }
        });
      }
      function refreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`ws-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });
      }

      function wsTap(bi) {
        if (wsLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.findIndex((s, i) => s === null && !(slotData[i] && slotData[i].locked));
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { letter: tile.letter, bankId: bi };
        sfx('tap');
        refreshSlots(); refreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(wsCheck, 200);
      }
      function wsRemove(si) {
        if (wsLocked) return;
        const entry = slotData[si];
        if (!entry || entry.locked) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        sfx('tap');
        refreshSlots(); refreshBank();
      }

      function wsCheck() {
        const item = session[idx];
        const attempt = slotData.map(e => e.letter).join('').toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        wsLocked = true;
        wsAttempts++;
        if (state.student) recordWordExposure(state.student, item.word, 'word-scramble', ok).catch(() => {});
        const c = itemColor();
        const fb = document.getElementById('ws-fb');

        slotData.forEach((_, si) => {
          const el = document.getElementById(`ws-s-${si}`);
          if (el && !slotData[si]?.locked) {
            el.style.borderColor = ok ? c.border : '#E91E63';
            el.style.background = ok ? c.bg : 'rgba(233,30,99,0.12)';
            el.style.color = ok ? c.border : '#F48FB1';
          }
        });

        if (ok) {
          const wsScore = wsAttempts === 1 && wsHintLevel === 0 ? 1
                        : wsAttempts === 1 || wsHintLevel === 1 ? 0.67 : 0.34;
          score += wsScore;
