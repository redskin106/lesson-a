          speak(item.word, 'celebrate');
          const plainSentence = item.tokens.map(t => t.t).join(' ');
          showGrammarReinforce(item.tokens, plainSentence, () => {
            idx++;
            if (idx < session.length) load();
            else onComplete(score / session.length);
          });
        } else {
          if (fb) { fb.textContent = 'Not quite — try again!'; fb.style.color = 'rgba(255,255,255,0.5)'; }
          speak(item.word, 'wrong');
          setTimeout(() => {
            // Return non-locked tiles to pool
            slotData = slotData.map((e, i) => e && e.locked ? e : null);
            bankData.forEach((t, bi) => {
              const stillLocked = slotData.some(e => e && e.bankId === bi);
              if (!stillLocked) t.used = false;
            });
            wsLocked = false;
            refreshSlots(); refreshBank();
            if (fb) { fb.textContent = ''; }
          }, 1200);
        }
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  SPELLING
  //  v2 design: pool-based { pick, items: [{word,emoji,tokens}] }, separate
  //  pool per tier. Bronze: image + tap tiles. Silver: audio-only + tap
  //  tiles. Gold: audio-only + free typing (no letter bank at all — this
  //  is the genuine skill difference from Word Scramble: production
  //  spelling from memory, not anagram-solving). tokens can be null
  //  (library/hospital) — falls back to just the word for reinforcement.
  //  Manual play button only — no auto-announce, matching Word Scramble.
  //  Audio: correct → word once, then sentence. Wrong → word once, silent
  //  retry. Same rule Nick confirmed for Word Scramble.
  // ─────────────────────────────────────────────
  'spelling': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = biasedSelect(items, pick, it => it.word);
      let idx = 0, score = 0, spLocked = false, retypeMode = false;
      let slotData = [], bankData = [];

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

      let spHintLevel = 0;
      let spAttempts  = 0;

      function load() {
        spLocked = false; retypeMode = false; spHintLevel = 0; spAttempts = 0;
        const item = session[idx];
        const letters = item.word.toUpperCase().split('');
        slotData = letters.map(() => null);
        const wordUp = item.word.toUpperCase();
        bankData = safeShuffle(letters, r => r.join('') === wordUp).map((l, i) => ({ letter: l, id: i, used: false }));

        const showImage = tier === 'bronze';
        const isTile = false; // all tiers use typing — tiles only for Word Scramble
        const instruction = tier === 'bronze' ? 'Tap the letters to spell the word'
                           : tier === 'silver' ? 'Listen and spell what you hear'
                           : 'Listen and type the word';

        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;

        const hasClue = !!findContextClue(item.word, item.tokens);

        container.innerHTML = `
          <div class="mp-pips-row-v2" id="sp-pips" style="${session.length<=1?'display:none;':''}" ></div>
          <button class="precheck-hint-btn" id="sp-hint-btn">💡 Hint</button>
          <p class="sp-feedback-v2" id="sp-clue" style="display:none;"></p>
          <div class="sp-visual-v2">
            ${showImage ? `<div class="sp-emoji-v2">${item.emoji}</div>` : ''}
            <div class="sp-listen-row-v2">
              <button class="sp-play-btn-v2" id="sp-play-btn">🔊</button>
              <span class="sp-instruction-v2">${instruction}</span>
            </div>
          </div>
          ${isTile ? `
          <div class="sp-slots-v2" id="sp-slots"></div>
          <div class="sp-bank-v2" id="sp-bank"></div>
          ` : `
          <input id="sp-input" class="sp-input-v2" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Type the word…">
          <button id="sp-chk" class="sp-check-btn-v2" disabled>Check →</button>
          `}
          <p class="sp-feedback-v2" id="sp-fb">&nbsp;</p>
        `;
        container.querySelector('#sp-pips').innerHTML = pips();

        const hintBtn = container.querySelector('#sp-hint-btn');
        const clueEl  = container.querySelector('#sp-clue');

        hintBtn.addEventListener('click', () => {
          if (spHintLevel >= 2) return;
          spHintLevel++;
          if (spHintLevel === 1 && hasClue) {
            const clue = findContextClue(item.word, item.tokens);
            clueEl.innerHTML = `Clue: <span class="gf-context-clue">${clue}</span>`;
            clueEl.style.display = 'block';
            hintBtn.textContent = '💡 Hint (1 more)';
          } else {
            // Level 2: pre-fill first letter (tile mode) or show it (type mode)
            if (isTile) {
              const firstLetter = item.word.toUpperCase()[0];
              const tile = bankData.find(t => t.letter === firstLetter && !t.used);
              if (tile && slotData[0] === null) {
                tile.used = true;
                slotData[0] = { letter: tile.letter, bankId: tile.id, locked: true };
                spRefreshSlots(); spRefreshBank();
              }
            } else {
              const inp = container.querySelector('#sp-input');
              if (inp && !inp.value) {
                inp.value = item.word[0];
                inp.placeholder = item.word[0] + '…';
              }
            }
            clueEl.style.display = 'none';
            hintBtn.disabled = true;
            hintBtn.textContent = '💡 Hint used';
          }
        });

        container.querySelector('#sp-play-btn').addEventListener('click', () => speak(item.word, 'neutral'));

        if (isTile) {
          const slotsEl = container.querySelector('#sp-slots');
          slotData.forEach((_, si) => {
            const d = document.createElement('div');
            d.className = 'sp-slot-v2';
            d.id = `sp-s-${si}`;
            d.addEventListener('click', () => spRemove(si));
            slotsEl.appendChild(d);
          });
          const bankEl = container.querySelector('#sp-bank');
          bankData.forEach((t, bi) => {
            const b = document.createElement('button');
            b.className = 'sp-tile-v2';
            b.id = `sp-t-${bi}`;
            b.textContent = t.letter;
            b.addEventListener('click', () => spTap(bi));
            bankEl.appendChild(b);
          });
          spRefreshSlots(); spRefreshBank();
        } else {
          const inp = container.querySelector('#sp-input');
          const chk = container.querySelector('#sp-chk');
          inp.addEventListener('input', () => {
            chk.style.display = 'block';
            chk.disabled = inp.value.trim().length === 0;
            chk.style.opacity = inp.value.trim().length ? '1' : '.4';
          });
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') spCheckType(); });
          chk.addEventListener('click', spCheckType);
          setTimeout(() => inp.focus(), 200);
        }
      }

      function spTap(bi) {
        if (spLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.findIndex((s, i) => s === null && !(slotData[i] && slotData[i].locked));
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { letter: tile.letter, bankId: bi };
        sfx('tap');
        spRefreshSlots(); spRefreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(spCheckTiles, 200);
      }
      function spRemove(si) {
        if (spLocked) return;
        const entry = slotData[si];
        if (!entry || entry.locked) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        sfx('tap');
        spRefreshSlots(); spRefreshBank();
      }
      function spRefreshSlots() {
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`sp-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.letter : '';
          if (entry && entry.locked) {
            el.style.borderColor = '#8BC34A'; el.style.background = 'rgba(139,195,74,0.15)';
          } else {
            el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';
            el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';
          }
        });
      }
      function spRefreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`sp-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });
      }

      function reinforceThenAdvance(item) {
        const plainSentence = item.tokens ? item.tokens.map(t => t.t).join(' ') : item.word;
        showGrammarReinforce(item.tokens, plainSentence, () => {
          idx++;
          if (idx < session.length) load();
          else onComplete(score / session.length);
        });
      }

      function spCheckTiles() {
        const item = session[idx];
        const attempt = slotData.map(e => e.letter).join('').toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        spLocked = true;
        spAttempts++;
        if (state.student) recordWordExposure(state.student, item.word, 'spelling', ok).catch(() => {});
        const fb = document.getElementById('sp-fb');
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`sp-s-${si}`);
          if (el && !entry?.locked) {
            el.style.borderColor = ok ? '#8BC34A' : '#E91E63';
            el.style.background = ok ? 'rgba(139,195,74,0.15)' : 'rgba(233,30,99,0.12)';
          }
        });
        if (ok) {
          const spScore = spAttempts === 1 && spHintLevel === 0 ? 1
                        : spHintLevel === 1 || spAttempts === 1 ? 0.67 : 0.34;
          score += spScore;
          speak(item.word, 'celebrate');
          reinforceThenAdvance(item);
        } else {
          if (fb) { fb.textContent = 'Not quite — try again!'; fb.style.color = 'rgba(255,255,255,0.5)'; }
          speak(item.word, 'wrong');
          setTimeout(() => {
            slotData = slotData.map((e, i) => e && e.locked ? e : null);
            bankData.forEach((t, bi) => {
              if (!slotData.some(e => e && e.bankId === bi)) t.used = false;
            });
            spLocked = false;
            spRefreshSlots(); spRefreshBank();
            if (fb) { fb.textContent = ''; }
          }, 1200);
        }
      }

      function spCheckType() {
        if (spLocked) return;
        const item = session[idx];
        const inp = document.getElementById('sp-input');
        if (!inp || !inp.value.trim()) return;
        const attempt = inp.value.trim().toLowerCase();
        const ok = attempt === item.word.toLowerCase();
        spLocked = true;
        // Guarded the same way score++ already is — a correct retype right
        // after the answer was revealed isn't a genuine recall test, so it
        // shouldn't boost the box. The original wrong attempt (below, in
        // the miss branch) still gets recorded normally either way.
        if (state.student && !retypeMode) recordWordExposure(state.student, item.word, 'spelling', ok).catch(() => {});
        const fb = document.getElementById('sp-fb');
        inp.style.borderColor = ok ? '#8BC34A' : '#E91E63';
        inp.style.background = ok ? 'rgba(139,195,74,0.08)' : 'rgba(233,30,99,0.08)';
        const chk = document.getElementById('sp-chk');
        if (chk) chk.style.display = 'none';

        if (ok) {
          if (!retypeMode) score++;
          speak(item.word, 'celebrate'); // word once — sentence comes from the reinforcement panel
          reinforceThenAdvance(item);
        } else {
          if (fb) { fb.textContent = `✗ The word is: ${item.word} — now type it correctly`; fb.style.color = '#F48FB1'; }
          speak(item.word, 'wrong'); // word once, then silent retry
          setTimeout(() => {
            retypeMode = true; spLocked = false;
            inp.value = ''; inp.style.borderColor = 'rgba(255,255,255,0.08)';
            inp.style.background = 'rgba(255,255,255,0.05)';
            inp.placeholder = 'Type the correct word…'; inp.focus();
            if (chk) { chk.style.display = 'block'; chk.disabled = true; chk.style.opacity = '.4'; }
            if (fb) { fb.textContent = `Type: ${item.word}`; fb.style.color = '#C9B8EA'; }
          }, 1600);
        }
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  LISTEN & MATCH
  //  v2 design: pool-based { pick, items: [{left,right}] } — same shape
  //  and free-pairing engine as Word Match, confirmed identical in the
  //  locked demo (listen-match-demo.html). Only real difference: left
  //  buttons show a 🔊 icon and play audio on every tap (unlimited
  //  replay) instead of showing text. left always equals right in the
  //  data — it's an audio-echo match, not a translation pair.
  // ─────────────────────────────────────────────
  'audio-match': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const pairs = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      const total = pairs.length;
      const isBronze = (tier === 'bronze');

      const PALETTE = [
        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },
        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },
        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },
        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },
        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' }
      ];
      const pairColor = pairs.map((_, i) => PALETTE[i % PALETTE.length]);

      document.getElementById('v2-qlabel').innerHTML =
        `<span>Tap 🔊 to listen, then match.</span><span id="am-score">0 of ${total} paired</span>`;

      container.innerHTML = `
        <div class="wm-grid-v2">
          <div class="wm-col-v2" id="am-left-col"></div>
          <div class="wm-col-v2" id="am-right-col"></div>
        </div>
        <p class="wm-encourage-v2" id="am-encourage"></p>
        <p class="wm-nudge-v2" id="am-nudge"></p>
        <button id="am-notquite-btn" class="wm-notquite-btn-v2" disabled>Not quite yet</button>
        <button id="am-next-btn" class="iv-proceed-btn">Next →</button>
      `;

      const leftCol      = container.querySelector('#am-left-col');
      const rightCol     = container.querySelector('#am-right-col');
      const scoreLabel   = document.getElementById('am-score');
      const encourageEl  = container.querySelector('#am-encourage');
      const nudgeEl      = container.querySelector('#am-nudge');
      const notQuiteBtn  = container.querySelector('#am-notquite-btn');
      const nextBtn      = container.querySelector('#am-next-btn');

      let pairings = new Map();
      let rightUsed = new Map();
      let selectedLeftBtn = null;
      let confirmed = false;

      function styleLeft(btn) {
        if (confirmed) return;
        const idx = parseInt(btn.dataset.pairIdx);
        const c = pairColor[idx];
        const isSelected = (btn === selectedLeftBtn);
        const isPaired = pairings.has(idx);
        if (isSelected) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = `0 0 0 3px ${c.border}`;
        } else if (isPaired) {
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
          btn.style.boxShadow = '';
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)'; btn.style.boxShadow = '';
        }
      }
      function styleRight(btn) {
        if (confirmed) return;
        const rightIdx = parseInt(btn.dataset.pairIdx);
        if (rightUsed.has(rightIdx)) {
          const c = pairColor[rightUsed.get(rightIdx)];
          btn.style.borderColor = c.border; btn.style.background = c.bg; btn.style.color = c.color;
        } else {
          btn.style.borderColor = 'rgba(255,255,255,0.08)'; btn.style.background = 'rgba(255,255,255,0.05)';
          btn.style.color = 'rgba(255,255,255,0.85)';
        }
      }
      function checkAllCorrect() {
        if (pairings.size !== total) return false;
        for (const leftIdx of pairings.keys()) {
          if (pairings.get(leftIdx) !== leftIdx) return false;
        }
        return true;
      }
      function refreshAll() {
        container.querySelectorAll('.wm-btn-v2[data-side="left"]').forEach(styleLeft);
        container.querySelectorAll('.wm-btn-v2[data-side="right"]').forEach(styleRight);

        let correctSoFar = 0, wrongSoFar = 0;
        pairings.forEach((rightIdx, leftIdx) => {
          if (rightIdx === leftIdx) correctSoFar++; else wrongSoFar++;
        });

        if (pairings.size === total) {
          if (checkAllCorrect()) {
            confirmed = true;
            sfx('correct');
            scoreLabel.textContent = 'Good job!';
            scoreLabel.style.color = '#AED581';
            notQuiteBtn.style.display = 'none';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
            nextBtn.style.display = 'flex';
            nextBtn.onclick = () => onComplete(1);
          } else {
            sfx('wrong');
            scoreLabel.textContent = `${Math.min(pairings.size, total)} of ${total} paired`;
            scoreLabel.style.color = '';
            nextBtn.style.display = 'none';
            notQuiteBtn.style.display = 'flex';
            nudgeEl.style.opacity = '0';
            encourageEl.style.opacity = '0';
          }
        } else {
          scoreLabel.textContent = `${pairings.size} of ${total} paired`;
          scoreLabel.style.color = '';
          nextBtn.style.display = 'none';
          notQuiteBtn.style.display = 'none';

          if (isBronze && wrongSoFar > 0) {
            nudgeEl.textContent = 'Are you sure about that one?';
            nudgeEl.style.opacity = '1';
            encourageEl.style.opacity = '0';
          } else {
            nudgeEl.style.opacity = '0';
            if (correctSoFar > 0) {
              const ratio = correctSoFar / total;
              encourageEl.textContent = ratio >= 0.66 ? 'Almost there!'
                                       : ratio >= 0.34 ? 'Getting there!'
                                       : 'Nice, keep going!';
              encourageEl.style.opacity = '1';
            } else {
              encourageEl.style.opacity = '0';
            }
          }
        }
      }

      const withIdx = pairs.map((p, i) => ({ left: p.left, right: p.right, pairIdx: i }));
      const leftItems = safeShuffle(withIdx, () => false);
      const rightItems = safeShuffle(withIdx, r => r.some((item, pos) => item.pairIdx === leftItems[pos].pairIdx));

      leftItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.innerHTML = '🔊';
        btn.dataset.side = 'left';
        btn.dataset.pairIdx = pair.pairIdx;
        btn.dataset.audio = pair.left;
        leftCol.appendChild(btn);
      });
      rightItems.forEach(pair => {
        const btn = document.createElement('button');
        btn.className = 'wm-btn-v2';
        btn.textContent = pair.right;
        btn.dataset.side = 'right';
        btn.dataset.pairIdx = pair.pairIdx;
        rightCol.appendChild(btn);
      });

      container.querySelectorAll('.wm-btn-v2').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirmed) return;

          if (btn.dataset.side === 'left') {
            speak(btn.dataset.audio, 'neutral'); // unlimited replay — plays every tap, matched or not
            selectedLeftBtn = (btn === selectedLeftBtn) ? null : btn;
            refreshAll();
            return;
          }

          const rightIdx = parseInt(btn.dataset.pairIdx);
          const leftIdx = selectedLeftBtn ? parseInt(selectedLeftBtn.dataset.pairIdx) : null;

          if (rightUsed.has(rightIdx)) {
            const prevLeftIdx = rightUsed.get(rightIdx);
            pairings.delete(prevLeftIdx);
            rightUsed.delete(rightIdx);
            if (leftIdx === null || leftIdx === prevLeftIdx) {
              selectedLeftBtn = null;
              sfx('tap');
              refreshAll();
              return;
            }
          }
          if (leftIdx === null) { refreshAll(); return; }

          if (pairings.has(leftIdx)) {
            rightUsed.delete(pairings.get(leftIdx));
            pairings.delete(leftIdx);
          }
          pairings.set(leftIdx, rightIdx);
          rightUsed.set(rightIdx, leftIdx);
          selectedLeftBtn = null;
          sfx('tap');
          refreshAll();
        });
      });
    }
  },

  // ─────────────────────────────────────────────
  //  SENTENCE BUILDING
  //  v2 design: pool-based { pick, items: [{tokens}] }, separate pool per
  //  tier. Word-tile version of Word Scramble: tap tiles from the bank
  //  into ordered slots, auto-check on last slot filled, reset on wrong.
  //  On correct: tiles recolour by grammar role IN PLACE (subject/verb/
  //  object/place/time; everything else neutral) and a legend + the full
  //  sentence play — no separate overlay here, deliberately different
  //  from every other module's reinforcement pattern, matching the
  //  locked demo exactly. Audio was already correct in the old renderer
  //  (single speak on each outcome, no per-tap bug) — kept as-is.
  // ─────────────────────────────────────────────
  'sentence-building': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, ()=>false).slice(0, Math.min(pick, items.length));
      let idx = 0, score = 0, sbLocked = false;
      let slotData = [], bankData = [];

      const ROLE_COLOR = { subject:'#00BCD4', verb:'#8BC34A', object:'#FF9800', place:'#AB47BC', time:'#E91E63' };
      const roleColor = role => ROLE_COLOR[role] || null;

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }
      function sentenceText(tokens) {
        return tokens.map(t => t.text).join(' ');
      }

      function load() {
        sbLocked = false;
        const item = session[idx];
        slotData = item.tokens.map(() => null);
        const withId = item.tokens.map((t, i) => ({ ...t, id: i }));
        bankData = safeShuffle(withId, r => r.every((t, i) => t.text === item.tokens[i].text))
          .map(t => ({ ...t, used: false }));
        document.getElementById('v2-qlabel').textContent = `Question ${idx + 1} of ${session.length}`;
        draw();
      }

      function draw() {
        container.innerHTML = `
          <div class="mp-pips-row-v2" id="sb-pips" style="${session.length<=1?'display:none;':''}" ></div>
          <p class="sb-prompt-v2">Put the words in order.</p>
          <div class="sb-slots-v2" id="sb-slots"></div>
          <div class="sb-bank-v2" id="sb-bank"></div>
          <div class="sb-feedback-v2" id="sb-fb">&nbsp;</div>
          <button class="iv-proceed-btn" id="sb-next-btn">Next →</button>
        `;
        container.querySelector('#sb-pips').innerHTML = pips();

        const slotsEl = container.querySelector('#sb-slots');
        slotData.forEach((_, si) => {
          const d = document.createElement('div');
          d.className = 'sb-slot-v2';
          d.id = `sb-s-${si}`;
          d.addEventListener('click', () => sbRemove(si));
          slotsEl.appendChild(d);
        });
        const bankEl = container.querySelector('#sb-bank');
        bankData.forEach((t, bi) => {
          const b = document.createElement('button');
          b.className = 'sb-tile-v2';
          b.id = `sb-t-${bi}`;
          b.textContent = t.text;
          b.addEventListener('click', () => sbTap(bi));
          bankEl.appendChild(b);
        });
        refreshSlots(); refreshBank();
      }

      function refreshSlots() {
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`sb-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.text : '';
          el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';
          el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';
          el.style.color = '#fff';
        });
      }
      function refreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`sb-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });
      }

      function sbTap(bi) {
        if (sbLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.indexOf(null);
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { text: tile.text, role: tile.role, bankId: bi };
        sfx('tap');
        refreshSlots(); refreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(sbCheck, 200);
      }
      function sbRemove(si) {
        if (sbLocked) return;
        const entry = slotData[si];
        if (!entry) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        sfx('tap');
        refreshSlots(); refreshBank();
      }

      function sbCheck() {
        const item = session[idx];
        const ok = slotData.every((e, i) => e.text === item.tokens[i].text);
        sbLocked = true;
        if (state.student) {
          item.tokens.forEach(tk => {
            if (tk.text) recordWordExposure(state.student, tk.text, 'sentence-building', ok).catch(() => {});
          });
        }
        const fb = document.getElementById('sb-fb');
        const nextBtn = document.getElementById('sb-next-btn');

        if (ok) {
          score++;
          slotData.forEach((entry, si) => {
            const el = document.getElementById(`sb-s-${si}`);
            if (!el) return;
            const c = roleColor(entry.role);
            el.style.borderColor = c || 'rgba(255,255,255,0.3)';
            el.style.background = c ? c + '26' : 'rgba(255,255,255,0.06)';
            el.style.color = c || 'rgba(255,255,255,0.6)';
          });
          const legendTokens = item.tokens.map(t => ({ t: t.text, r: t.role }));
          fb.innerHTML = `<div class="sb-legend-v2">${grammarLegend(legendTokens)}</div>`;
          speak(sentenceText(item.tokens), 'celebrate');
          nextBtn.style.display = 'block';
          nextBtn.onclick = () => {
            idx++;
            if (idx < session.length) load();
            else onComplete(score / session.length);
          };
        } else {
          // Pulse wrong slots in red, leave correct ones highlighted green
          slotData.forEach((entry, si) => {
            const el = document.getElementById(`sb-s-${si}`);
            if (!el) return;
            const isCorrect = entry && entry.text === item.tokens[si].text;
            if (isCorrect) {
              el.style.borderColor = '#8BC34A'; el.style.background = 'rgba(139,195,74,0.12)';
            } else {
              el.style.borderColor = '#E91E63'; el.style.background = 'rgba(233,30,99,0.1)';
            }
          });
          const correctCount = slotData.filter((e, i) => e && e.text === item.tokens[i].text).length;
          fb.textContent = correctCount > 0 ? `${correctCount} in the right place — keep going!` : 'Not quite — try a different order.';
          fb.style.color = correctCount > 0 ? '#AED581' : '#F48FB1';
          speak(sentenceText(item.tokens), 'wrong');
          setTimeout(() => {
            slotData = slotData.map(() => null);
            bankData.forEach(t => t.used = false);
            sbLocked = false;
            refreshSlots(); refreshBank();
            fb.textContent = 'Try again!';
            fb.style.color = 'rgba(255,255,255,0.4)';
          }, 1600);
        }
      }

      load();
    }
  },

  // ─────────────────────────────────────────────
  //  QUESTION FORMATION
  //  "Student generates questions from situations" — shown a stated
  //  situation (e.g. "It's 3 o'clock."), the student assembles the
  //  question that would prompt it ("What time is it?"). Reuses Build a
  //  Sentence's exact proven tile/slot mechanic rather than inventing a
  //  new one — the one real addition is distractor tiles mixed into the
  //  bank (more of them at higher tiers), which the existing whole-slot
  //  check already handles correctly with zero changes needed, since a
  //  wrongly-placed distractor just naturally fails the text comparison.
  'question-formation': {
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, ()=>false).slice(0, Math.min(pick, items.length));
      let idx = 0, score = 0, qfLocked = false;
      let slotData = [], bankData = [];

      function pips() {
        return session.map((_, i) => `<div class="mp-pip-v2${i<idx?' done':i===idx?' current':''}"></div>`).join('');
      }

        return tokens.map(t => t.text).join(' ') + '?';
      }

      function load() {
        qfLocked = false;
        const item = session[idx];
        slotData = item.tokens.map(() => null);
        const correctTiles = item.tokens.map((t, i) => ({ ...t, id: `c${i}` }));
        const distractorTiles = (item.distractors || []).map((d, i) => ({ text: d, role: null, id: `d${i}` }));
        const withId = [...correctTiles, ...distractorTiles];
        bankData = safeShuffle(withId, r => r.length > 1 && r.every((t, i) => t.id === withId[i].id))

        bankData.forEach((t, bi) => {

          b.textContent = t.text;
          b.addEventListener('click', () => qfTap(bi));
          bankEl.appendChild(b);

        refreshSlots(); refreshBank();
      }

      function refreshSlots() {
        slotData.forEach((entry, si) => {
          const el = document.getElementById(`qf-s-${si}`);
          if (!el) return;
          el.textContent = entry ? entry.text : '';
          el.style.borderColor = entry ? '#7052B4' : 'rgba(255,255,255,0.08)';
          el.style.background = entry ? 'rgba(112,82,180,0.15)' : 'rgba(255,255,255,0.05)';
          el.style.color = '#fff';

      function refreshBank() {
        bankData.forEach((t, bi) => {
          const el = document.getElementById(`qf-t-${bi}`);
          if (el) el.classList.toggle('used', t.used);
        });

      function qfTap(bi) {
        if (qfLocked) return;
        const tile = bankData[bi];
        if (tile.used) return;
        const si = slotData.indexOf(null);
        if (si === -1) return;
        tile.used = true;
        slotData[si] = { text: tile.text, role: tile.role, bankId: bi };
        sfx('tap');
        refreshSlots(); refreshBank();
        if (slotData.indexOf(null) === -1) setTimeout(qfCheck, 200);
      }
      function qfRemove(si) {
        if (qfLocked) return;
        const entry = slotData[si];
        if (!entry) return;
        bankData[entry.bankId].used = false;
        slotData[si] = null;
        sfx('tap');
        refreshSlots(); refreshBank();
      }

      function qfCheck() {
        const item = session[idx];
        const ok = slotData.every((e, i) => e.text === item.tokens[i].text);
        qfLocked = true;
        if (state.student) {
          item.tokens.forEach(tk => {
            if (tk.text) recordWordExposure(state.student, tk.text, 'question-formation', ok).catch(() => {});
          });
        }
        const fb = document.getElementById('qf-fb');
        const nextBtn = document.getElementById('qf-next-btn');

        if (ok) {
          score++;
          slotData.forEach((entry, si) => {
            const el = document.getElementById(`qf-s-${si}`);
            if (!el) return;
            const c = roleColor(entry.role);
            el.style.borderColor = c || 'rgba(255,255,255,0.3)';
            el.style.background = c ? c + '26' : 'rgba(255,255,255,0.06)';
            el.style.color = c || 'rgba(255,255,255,0.6)';
          });
          const legendTokens = item.tokens.map(t => ({ t: t.text, r: t.role }));
          fb.innerHTML = `<div class="sb-legend-v2">${grammarLegend(legendTokens)}</div>`;
          speak(questionText(item.tokens), 'celebrate');
          nextBtn.style.display = 'block';
          nextBtn.onclick = () => {
            idx++;
            if (idx < session.length) load();
            else onComplete(score / session.length);
          };
        } else {
          // Pulse wrong slots red, leave correct ones green
          slotData.forEach((entry, si) => {
            const el = document.getElementById(`qf-s-${si}`);
            if (!el) return;
            const isCorrect = entry && entry.text === item.tokens[si].text;
            if (isCorrect) {
              el.style.borderColor = '#8BC34A'; el.style.background = 'rgba(139,195,74,0.12)';
            } else {
              el.style.borderColor = '#E91E63'; el.style.background = 'rgba(233,30,99,0.1)';
            }
          });
          const correctCount = slotData.filter((e, i) => e && e.text === item.tokens[i].text).length;
          fb.textContent = correctCount > 0 ? `${correctCount} in the right place — keep going!` : 'Not quite — try a different order.';
          fb.style.color = correctCount > 0 ? '#AED581' : '#F48FB1';
          speak(questionText(item.tokens), 'wrong');
          setTimeout(() => {
            slotData = slotData.map(() => null);
            bankData.forEach(t => t.used = false);
            qfLocked = false;
            refreshSlots(); refreshBank();
            fb.textContent = 'Try again!';

      load();
