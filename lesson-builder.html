st hint      = container.querySelector('#speak-hint');\n      const assessWrap= container.querySelector('#assess-wrap');\n      const yesBtn    = container.querySelector('#assess-yes');\n      const noBtn     = container.querySelector('#assess-no');\n      const nextBtn   = container.querySelector('#next-btn');\n\n      // \u2500\u2500 Model audio \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function finishModelPlayback() {\n        modelPlaying = false;\n        modelIcon.textContent = '\ud83d\udd0a';\n        modelBtn.classList.remove('playing');\n      }\n\n      function playModel() {\n        if (modelPlaying) return;\n        stopSelf();\n        modelPlaying = true;\n        modelIcon.textContent = '\u23f8';\n        modelBtn.classList.add('playing');\n\n        if (data.audioFile) {\n          const a = new Audio(data.audioFile);\n          modelAudio = a;\n          a.onended = finishModelPlayback;\n          a.onerror = () => playModelViaSynthesis();\n          a.play().catch(() => playModelViaSynthesis());\n          return;\n        }\n        playModelViaSynthesis();\n      }\n\n      function playModelViaSynthesis() {\n        if (!TTS) { modelPlaying = false; return; }\n        TTS.cancel();\n        let u;\n        try { u = new SpeechSynthesisUtterance(target); }\n        catch(e) { modelPlaying = false; return; }\n        u.rate   = isBronze ? 0.8 : 0.85;\n        u.lang   = 'en-US';\n        u.onend  = finishModelPlayback;\n        TTS.speak(u);\n      }\n\n      modelBtn.addEventListener('click', () => {\n        if (modelPlaying) {\n          TTS && TTS.cancel();\n          if (modelAudio) { modelAudio.pause(); modelAudio.currentTime = 0; modelAudio = null; }\n          modelPlaying = false;\n          modelIcon.textContent = '\ud83d\udd0a';\n          modelBtn.classList.remove('playing');\n        } else {\n          playModel();\n        }\n      });\n\n      // \u2500\u2500 Self playback \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function stopSelf() {\n        if (selfAudio) { selfAudio.pause(); selfAudio.currentTime = 0; }\n        selfPlaying = false;\n        playIcon.textContent = '\u25b6';\n        playBtn.classList.remove('playing');\n      }\n\n      playBtn.addEventListener('click', () => {\n        if (!recordingBlob || isRecording || done) return;\n        if (selfPlaying) { stopSelf(); return; }\n\n        TTS && TTS.cancel();\n        modelPlaying = false;\n        modelIcon.textContent = '\ud83d\udd0a';\n        modelBtn.classList.remove('playing');\n\n        selfPlaying = true;\n        playIcon.textContent = '\u23f8';\n        playBtn.classList.add('playing');\n\n        const url  = URL.createObjectURL(recordingBlob);\n        selfAudio  = new Audio(url);\n        selfAudio.play();\n        selfAudio.onended = () => {\n          stopSelf();\n          URL.revokeObjectURL(url);\n        };\n      });\n\n      // \u2500\u2500 MediaRecorder \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      recBtn.addEventListener('click', async () => {\n        if (done) return;\n\n        if (isRecording) {\n          // Stop recording\n          mediaRecorder.stop();\n          return;\n        }\n\n        // Stop any playback first\n        stopSelf();\n        TTS && TTS.cancel();\n        modelPlaying = false;\n        modelIcon.textContent = '\ud83d\udd0a';\n        modelBtn.classList.remove('playing');\n\n        try {\n          stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n\n          const mimeType = MediaRecorder.isTypeSupported('audio/webm')\n            ? 'audio/webm' : 'audio/mp4';\n\n          const chunks  = [];\n          mediaRecorder = new MediaRecorder(stream, { mimeType });\n\n          mediaRecorder.ondataavailable = e => {\n            if (e.data.size > 0) chunks.push(e.data);\n          };\n\n          mediaRecorder.onstop = () => {\n            // Release mic\n            stream.getTracks().forEach(t => t.stop());\n            isRecording = false;\n            recIcon.textContent  = '\ud83c\udfa4';\n            recLabel.textContent = 'Re-record';\n            recBtn.classList.remove('recording');\n\n            recordingBlob = new Blob(chunks, { type: mimeType });\n\n            // Unlock playback button\n            playBtn.classList.add('ready');\n\n            // Show self-assess after first recording\n            assessWrap.style.display = 'block';\n            hint.textContent = 'Listen to both, then tap how it went.';\n          };\n\n          mediaRecorder.start();\n          isRecording = true;\n          recIcon.textContent  = '\u23f9';\n          recLabel.textContent = 'Stop';\n          recBtn.classList.add('recording');\n          hint.textContent = 'Recording\u2026 tap \u23f9 to stop.';\n\n        } catch (err) {\n          // Mic permission denied or not available \u2014 fallback\n          showNoMicFallback();\n        }\n      });\n\n      // \u2500\u2500 Self-assess \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function lockAssess() {\n        done = true;\n        yesBtn.disabled = true;\n        noBtn.disabled  = true;\n        if (stream) stream.getTracks().forEach(t => t.stop());\n      }\n\n      yesBtn.addEventListener('click', () => {\n        if (done) return;\n        yesBtn.classList.add('selected');\n        lockAssess();\n        nextBtn.style.display = 'block';\n        nextBtn.onclick = () => onComplete(1);\n      });\n\n      noBtn.addEventListener('click', () => {\n        if (done) return;\n        noBtn.classList.add('selected');\n        lockAssess();\n        nextBtn.style.display = 'block';\n        nextBtn.onclick = () => onComplete(0);\n      });\n\n      // \u2500\u2500 No-mic fallback \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n      function showNoMicFallback() {\n        recBtn.style.display  = 'none';\n        playBtn.style.display = 'none';\n        const msg = document.createElement('div');\n        msg.className   = 'no-mic-msg';\n        msg.textContent = 'Microphone not available. Listen to the model, say it aloud, then tap how it went.';\n        container.querySelector('.speak-trio').insertAdjacentElement('afterend', msg);\n        assessWrap.style.display = 'block';\n        hint.style.display = 'none';\n      }\n    }\n  },\n\n\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  IMAGE VOCAB\n  //  Bronze: image \u2192 tap correct word\n  //  Silver: word  \u2192 tap correct image\n  //  Gold:   image + sentence blank \u2192 word bank\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'image-vocab': {\n    render(container, data, tier, onComplete) {\n      const { mode, items } = data;\n      const PICK = Math.min(items.length, 3);\n      const session = safeShuffle(items, () => false).slice(0, PICK);\n      let idx = 0, score = 0, locked = false, selected = null;\n\n      function visual(item, size=48) {\n        if (item.image) return `<img src=\"${item.image}\" style=\"width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;\" alt=\"${item.word}\">`;\n        return `<span style=\"font-size:${size}px;line-height:1;\">${item.emoji}</span>`;\n      }\n\n      function pips() {\n        return session.map((_,i) =>\n          `<div class=\"pip${i<idx?' done':i===idx?' current':''}\"></div>`\n        ).join('');\n      }\n\n      function render() {\n        locked = false; selected = null;\n        if (idx >= session.length) { finish(); return; }\n        const item = session[idx];\n\n        if (mode === 'image-to-word') {\n          const pool = safeShuffle(items.filter(i=>i.word!==item.word),()=>false).slice(0,2);\n          const opts = safeShuffle([item,...pool], r=>r[0].word===item.word);\n          container.innerHTML = `\n            <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n            <div style=\"text-align:center;margin-bottom:1.25rem;\">\n              ${visual(item,72)}\n              <p style=\"font-size:13px;color:var(--text-dim);margin-top:.5rem;\">Tap the correct word</p>\n            </div>\n            <div class=\"options-grid\">\n              ${opts.map(o=>`<button class=\"option-btn locked\" data-val=\"${o.word}\" data-ans=\"${item.word}\" data-type=\"word\" onclick=\"ivSelect(this)\">${o.word}</button>`).join('')}\n            </div>\n            <div style=\"min-height:28px;text-align:center;margin:.75rem 0;\" id=\"iv-fb\"></div>\n            <button class=\"next-ex-btn\" id=\"iv-chk\" style=\"display:none;\" onclick=\"ivCheck()\">Check \u2192</button>\n            <button class=\"next-ex-btn\" id=\"iv-nxt\" style=\"display:none;\" onclick=\"ivNext()\">Next \u2192</button>`;\n        } else if (mode === 'word-to-image') {\n          const pool = safeShuffle(items.filter(i=>i.emoji!==item.emoji),()=>false).slice(0,2);\n          const opts = safeShuffle([item,...pool], r=>r[0].emoji===item.emoji);\n          container.innerHTML = `\n            <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n            <div style=\"text-align:center;margin-bottom:1.25rem;\">\n              <div style=\"font-size:26px;font-weight:600;color:var(--text);margin-bottom:.5rem;\">${item.word}</div>\n              <p style=\"font-size:13px;color:var(--text-dim);\">Tap the correct picture</p>\n            </div>\n            <div class=\"options-grid\">\n              ${opts.map(o=>`<button class=\"option-btn locked\" data-val=\"${o.emoji}\" data-ans=\"${item.emoji}\" data-type=\"emoji\" onclick=\"ivSelect(this)\" style=\"font-size:36px;\">${o.image?`<img src=\"${o.image}\" style=\"width:48px;height:48px;object-fit:cover;border-radius:6px;\">`:o.emoji}</button>`).join('')}\n            </div>\n            <div style=\"min-height:28px;text-align:center;margin:.75rem 0;\" id=\"iv-fb\"></div>\n            <button class=\"next-ex-btn\" id=\"iv-chk\" style=\"display:none;\" onclick=\"ivCheck()\">Check \u2192</button>\n            <button class=\"next-ex-btn\" id=\"iv-nxt\" style=\"display:none;\" onclick=\"ivNext()\">Next \u2192</button>`;\n        } else {\n          // cloze-image\n          const pool = safeShuffle(items.filter(i=>i.word!==item.word),()=>false).slice(0,3);\n          const opts = safeShuffle([item,...pool], r=>r[0].word===item.word);\n          container.innerHTML = `\n            <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n            <div style=\"text-align:center;margin-bottom:1rem;\">${visual(item,64)}</div>\n            <p style=\"font-size:17px;color:var(--text);text-align:center;line-height:1.8;margin-bottom:1rem;\">\n              ${item.sentence.replace('___','<span id=\"iv-blank\" style=\"display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600;text-align:center;\">___</span>')}\n            </p>\n            <div class=\"options-grid\">\n              ${opts.map(o=>`<button class=\"option-btn locked\" data-val=\"${o.word}\" data-ans=\"${item.word}\" data-type=\"cloze\" onclick=\"ivSelect(this)\">${o.word}</button>`).join('')}\n            </div>\n            <div style=\"min-height:28px;text-align:center;margin:.75rem 0;\" id=\"iv-fb\"></div>\n            <button class=\"next-ex-btn\" id=\"iv-chk\" style=\"display:none;\" onclick=\"ivCheck()\">Check \u2192</button>\n            <button class=\"next-ex-btn\" id=\"iv-nxt\" style=\"display:none;margin-top:.5rem;\" onclick=\"ivNext()\">Got it \u2192</button>`;\n        }\n        // speak prompt word\n        speak(item.word, 'neutral', 300, item.audioFile);\n      }\n\n      // Expose handlers on window so inline onclick works\n      window.ivSelect = function(btn) {\n        if (locked) return;\n        container.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));\n        btn.classList.add('selected');\n        selected = { val: btn.dataset.val, ans: btn.dataset.ans, type: btn.dataset.type };\n        const blk = container.querySelector('#iv-blank');\n        if (blk && btn.dataset.type === 'cloze') blk.textContent = btn.dataset.val;\n        const chk = container.querySelector('#iv-chk');\n        if (chk) chk.style.display = 'block';\n      };\n\n      window.ivCheck = function() {\n        if (!selected || locked) return;\n        locked = true;\n        const ok = selected.val === selected.ans;\n        if (ok) score++;\n        const fb = container.querySelector('#iv-fb');\n        const chk = container.querySelector('#iv-chk');\n        const nxt = container.querySelector('#iv-nxt');\n        if (fb) { fb.textContent = ok ? '\u2713 Correct!' : '\u2717 See the right answer'; fb.style.color = ok ? 'var(--pass)' : 'var(--fail)'; }\n        if (chk) chk.style.display = 'none';\n        container.querySelectorAll('.option-btn').forEach(b => {\n          b.disabled = true;\n          if (b.dataset.val === b.dataset.ans) b.classList.add('correct');\n          else if (b.dataset.val === selected.val && !ok) b.classList.add('wrong');\n          else b.classList.remove('selected');\n        });\n        const blk = container.querySelector('#iv-blank');\n        if (blk) blk.textContent = selected.ans;\n        speak(session[idx].word, ok ? 'celebrate' : 'wrong', 0, session[idx].audioFile);\n        if (nxt) nxt.style.display = 'block';\n      };\n\n      window.ivNext = function() { idx++; render(); };\n\n      function finish() { onComplete(score / PICK); }\n\n      render();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  MEMORY PAIRS\n  //  4 pairs drawn from pool. Image card + word\n  //  card. Flip two, find the match.\n  //  Audio: neutral on flip, celebrate on match.\n  //  Reinforcement panel on each match.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'memory-pairs': {\n    render(container, data, tier, onComplete) {\n      const { items } = data;\n      const PAIRS = 4;\n      const picked = safeShuffle(items, ()=>false).slice(0, PAIRS);\n      const deckSrc = [\n        ...picked.map((it,i)=>({...it, kind:'image', pid:i})),\n        ...picked.map((it,i)=>({...it, kind:'word',  pid:i})),\n      ];\n      const deck = safeShuffle(deckSrc, r => {\n        for (let i=0;i<r.length-1;i++) if(r[i].pid===r[i+1].pid) return true;\n        return false;\n      });\n\n      let flipped=[], matched=0, flips=0, cardLocked=false;\n\n      function visual(item, size=32) {\n        if (item.image) return `<img src=\"${item.image}\" style=\"width:${size}px;height:${size}px;object-fit:cover;border-radius:6px;\" alt=\"${item.word}\">`;\n        return `<span style=\"font-size:${size}px;line-height:1;\">${item.emoji}</span>`;\n      }\n\n      container.innerHTML = `\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:.75rem;\">\n          <div style=\"font-size:13px;color:var(--text-dim);\">Find the pairs</div>\n          <div style=\"font-size:13px;color:var(--text-dim);\">Flips: <span id=\"mp-flips\" style=\"color:var(--text);\">0</span></div>\n        </div>\n        <div id=\"mp-pips\" style=\"display:flex;gap:6px;margin-bottom:1rem;\">\n          ${picked.map((_,i)=>`<div class=\"pip\" id=\"mp-pip-${i}\" style=\"flex:1;\"></div>`).join('')}\n        </div>\n        <div id=\"mp-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;\">\n          ${deck.map((card,i)=>`\n            <div id=\"mp-cw-${i}\" onclick=\"mpFlip(${i})\" style=\"\n              aspect-ratio:1;perspective:600px;cursor:pointer;\n            \">\n              <div id=\"mp-ci-${i}\" style=\"\n                width:100%;height:100%;position:relative;\n                transform-style:preserve-3d;\n                transition:transform .35s cubic-bezier(.4,0,.2,1);\n                border-radius:10px;\n              \">\n                <div style=\"\n                  position:absolute;inset:0;border-radius:10px;\n                  backface-visibility:hidden;\n                  background:var(--surface2);\n                  display:flex;align-items:center;justify-content:center;\n                  font-size:1.4em;color:rgba(255,255,255,.2);\n                \">?</div>\n                <div id=\"mp-cf-${i}\" style=\"\n                  position:absolute;inset:0;border-radius:10px;\n                  backface-visibility:hidden;\n                  background:var(--surface);\n                  border:1.5px solid var(--surface2);\n                  transform:rotateY(180deg);\n                  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;\n                  font-size:13px;font-weight:500;color:var(--text-dim);\n                  padding:4px;text-align:center;\n                \">\n                  ${card.kind==='image' ? visual(card,32) : `<span style=\"font-size:13px;font-weight:600;color:var(--text);\">${card.word}</span>`}\n                </div>\n              </div>\n            </div>`).join('')}\n        </div>\n        <div id=\"mp-msg\" style=\"min-height:24px;text-align:center;font-size:14px;color:var(--text-dim);\"></div>`;\n\n      window.mpFlip = function(i) {\n        if (cardLocked) return;\n        const cw = document.getElementById(`mp-cw-${i}`);\n        const ci = document.getElementById(`mp-ci-${i}`);\n        if (!cw || cw.dataset.done || cw.dataset.flipped) return;\n        cw.dataset.flipped = '1';\n        ci.style.transform = 'rotateY(180deg)';\n        speak(deck[i].word, 'neutral', 0, deck[i].audioFile);\n        flips++;\n        document.getElementById('mp-flips').textContent = flips;\n        flipped.push(i);\n        if (flipped.length === 2) { cardLocked = true; setTimeout(mpCheck, 500); }\n      };\n\n      function mpCheck() {\n        const [a, b] = flipped;\n        const ca = deck[a], cb = deck[b];\n        const isMatch = ca.pid === cb.pid && ca.kind !== cb.kind;\n        if (isMatch) {\n          matched++;\n          ['mp-cf-'+a,'mp-cf-'+b].forEach(id=>{\n            const el=document.getElementById(id);\n            if(el){el.style.background='rgba(255,215,0,.1)';el.style.borderColor='var(--gold)';}\n          });\n          document.getElementById(`mp-cw-${a}`).dataset.done='1';\n          document.getElementById(`mp-cw-${b}`).dataset.done='1';\n          const pip=document.getElementById(`mp-pip-${ca.pid}`);\n          if(pip){pip.classList.add('done');}\n          flipped=[];\n          showReinforcePanel(ca, () => {\n            cardLocked = false;\n            if (matched === PAIRS) {\n              const stars = flips<=10?3:flips<=14?2:1;\n              const starStr='\u2b50'.repeat(stars)+'\u2729'.repeat(3-stars);\n              document.getElementById('mp-msg').textContent = starStr;\n              setTimeout(()=>onComplete(matched/PAIRS), 800);\n            }\n          });\n        } else {\n          const ciA=document.getElementById(`mp-ci-${a}`);\n          const ciB=document.getElementById(`mp-ci-${b}`);\n          if(ciA){ciA.style.borderRadius='10px';ciA.style.boxShadow='0 0 0 2px var(--fail)';}\n          if(ciB){ciB.style.borderRadius='10px';ciB.style.boxShadow='0 0 0 2px var(--fail)';}\n          speak(ca.word,'wrong', 0, ca.audioFile);\n          speak(cb.word,'wrong',700, cb.audioFile);\n          setTimeout(()=>{\n            if(ciA){ciA.style.transform='';ciA.style.boxShadow='';}\n            if(ciB){ciB.style.transform='';ciB.style.boxShadow='';}\n            delete document.getElementById(`mp-cw-${a}`).dataset.flipped;\n            delete document.getElementById(`mp-cw-${b}`).dataset.flipped;\n            flipped=[]; cardLocked=false;\n          },1100);\n        }\n      }\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  WORD SCRAMBLE\n  //  Image + audio shown. Tap scrambled letter\n  //  tiles to spell the word. Wrong = reset bank.\n  //  Reinforcement panel on correct.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'word-scramble': {\n    render(container, data, tier, onComplete) {\n      const { items } = data;\n      const PICK = Math.min(items.length, 4);\n      const session = safeShuffle(items, ()=>false).slice(0, PICK);\n      let idx=0, score=0, slotData=[], bankData=[], wsLocked=false;\n\n      function visual(item) {\n        if (item.image) return `<img src=\"${item.image}\" style=\"width:72px;height:72px;object-fit:cover;border-radius:12px;\" alt=\"${item.word}\">`;\n        return `<span style=\"font-size:72px;line-height:1;\">${item.emoji}</span>`;\n      }\n\n      function pips() {\n        return session.map((_,i)=>`<div class=\"pip${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n\n      function load() {\n        wsLocked=false;\n        if(idx>=session.length){onComplete(score/PICK);return;}\n        const item=session[idx];\n        const letters=item.word.toUpperCase().split('');\n        slotData=letters.map(()=>null);\n        const wordUp=item.word.toUpperCase();\n        bankData=safeShuffle(letters,r=>r.join('')===wordUp).map((l,i)=>({letter:l,id:i,used:false}));\n        drawWS();\n        speak(item.word,'neutral',300, item.audioFile);\n      }\n\n      function drawWS() {\n        const item=session[idx];\n        container.innerHTML=`\n          <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n          <div style=\"text-align:center;margin-bottom:1rem;position:relative;display:inline-block;width:100%;\">\n            ${visual(item)}\n            <button onclick=\"speak(session&&'${item.word}','neutral',0,'${item.audioFile||\"\"}')\" style=\"\n              position:absolute;right:8px;top:0;\n              background:var(--surface2);border:1px solid var(--surface2);\n              border-radius:50%;width:36px;height:36px;font-size:16px;\n              cursor:pointer;color:var(--accent);\n            \">\ud83d\udd0a</button>\n          </div>\n          <div id=\"ws-slots\" style=\"display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;\">\n            ${slotData.map((_,si)=>`<div id=\"ws-s-${si}\" onclick=\"wsRemove(${si})\" style=\"\n              width:44px;height:52px;border-radius:8px;\n              border:2px solid var(--surface2);background:var(--surface);\n              display:flex;align-items:center;justify-content:center;\n              font-size:20px;font-weight:700;color:var(--text);cursor:pointer;\n            \"></div>`).join('')}\n          </div>\n          <div id=\"ws-bank\" style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px;margin-bottom:1rem;\">\n            ${bankData.map((t,bi)=>`<button id=\"ws-t-${bi}\" onclick=\"wsTap(${bi})\" style=\"\n              width:44px;height:52px;border-radius:8px;\n              border:1.5px solid #4A6080;background:var(--surface);\n              font-size:20px;font-weight:700;color:var(--text);\n              cursor:pointer;box-shadow:0 2px 0 #1E3248;\n              transition:opacity .2s;\n            \">${t.letter}</button>`).join('')}\n          </div>\n          <div id=\"ws-fb\" style=\"min-height:24px;text-align:center;font-size:14px;color:var(--text-dim);margin-bottom:.5rem;\"></div>`;\n      }\n\n      function refreshSlots() {\n        slotData.forEach((entry,si)=>{\n          const el=document.getElementById(`ws-s-${si}`);\n          if(!el)return;\n          el.textContent=entry?entry.letter:'';\n          el.style.borderColor=entry?'var(--accent)':'var(--surface2)';\n          el.style.background=entry?'rgba(79,195,247,.08)':'var(--surface)';\n        });\n      }\n\n      function refreshBank() {\n        bankData.forEach((t,bi)=>{\n          const el=document.getElementById(`ws-t-${bi}`);\n          if(el)el.style.opacity=t.used?'0':'1';\n        });\n      }\n\n      window.wsTap=function(bi){\n        if(wsLocked)return;\n        const tile=bankData[bi];\n        if(tile.used)return;\n        const si=slotData.indexOf(null);\n        if(si===-1)return;\n        tile.used=true;\n        slotData[si]={letter:tile.letter,bankId:bi};\n        speak(session[idx].word,'neutral', 0, session[idx].audioFile);\n        refreshSlots();refreshBank();\n        if(slotData.indexOf(null)===-1)setTimeout(wsCheck,200);\n      };\n\n      window.wsRemove=function(si){\n        if(wsLocked)return;\n        const entry=slotData[si];\n        if(!entry)return;\n        bankData[entry.bankId].used=false;\n        slotData[si]=null;\n        refreshSlots();refreshBank();\n      };\n\n      function wsCheck(){\n        const item=session[idx];\n        const attempt=slotData.map(e=>e.letter).join('').toLowerCase();\n        const ok=attempt===item.word.toLowerCase();\n        wsLocked=true;\n        const fb=document.getElementById('ws-fb');\n        slotData.forEach((_,si)=>{\n          const el=document.getElementById(`ws-s-${si}`);\n          if(el){\n            el.style.borderColor=ok?'var(--gold)':'var(--fail)';\n            el.style.background=ok?'rgba(255,215,0,.1)':'rgba(239,83,80,.1)';\n          }\n        });\n        if(ok){\n          score++;\n          if(fb){fb.textContent='\u2713 Correct!';fb.style.color='var(--pass)';}\n          speak(item.word,'celebrate', 0, item.audioFile);\n          setTimeout(()=>showReinforcePanel(item,()=>{idx++;load();}),500);\n        } else {\n          if(fb){fb.textContent=`\u2717 The word is: ${item.word}`;fb.style.color='var(--fail)';}\n          speak(item.word,'wrong', 0, item.audioFile);\n          setTimeout(()=>{\n            slotData=slotData.map(()=>null);\n            bankData.forEach(t=>t.used=false);\n            wsLocked=false;\n            refreshSlots();refreshBank();\n            if(fb){fb.textContent='Try again!';fb.style.color='var(--text-dim)';}\n            speak(item.word,'neutral',300, item.audioFile);\n          },1500);\n        }\n      }\n\n      load();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SPELLING\n  //  Bronze: image + audio \u2192 tap tiles\n  //  Silver: audio only   \u2192 tap tiles\n  //  Gold:   audio only   \u2192 free type, retype on fail\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'spelling': {\n    render(container, data, tier, onComplete) {\n      const { items } = data;\n      const PICK = Math.min(items.length, 4);\n      const session = safeShuffle(items, ()=>false).slice(0, PICK);\n      let idx=0, score=0, spLocked=false, retypeMode=false;\n      let slotData=[], bankData=[];\n\n      function visual(item) {\n        if (item.image) return `<img src=\"${item.image}\" style=\"width:72px;height:72px;object-fit:cover;border-radius:12px;\" alt=\"${item.word}\">`;\n        return `<span style=\"font-size:72px;line-height:1;\">${item.emoji}</span>`;\n      }\n\n      function pips() {\n        return session.map((_,i)=>`<div class=\"pip${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n\n      function load() {\n        spLocked=false; retypeMode=false;\n        if(idx>=session.length){onComplete(score/PICK);return;}\n        const item=session[idx];\n        const letters=item.word.toUpperCase().split('');\n        slotData=letters.map(()=>null);\n        const wordUp=item.word.toUpperCase();\n        bankData=safeShuffle(letters,r=>r.join('')===wordUp).map((l,i)=>({letter:l,id:i,used:false}));\n\n        const showImage = tier==='bronze';\n        const isTile    = tier!=='gold';\n\n        container.innerHTML=`\n          <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n          <div style=\"text-align:center;margin-bottom:1rem;\">\n            ${showImage ? visual(item) : ''}\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-top:${showImage?'.75rem':'0'};\">\n              <button onclick=\"speak('${item.word}','neutral',0,'${item.audioFile||\"\"}')\" style=\"\n                background:var(--surface2);border:1px solid var(--surface2);\n                border-radius:50%;width:42px;height:42px;font-size:18px;\n                cursor:pointer;color:var(--accent);flex-shrink:0;\n              \">\ud83d\udd0a</button>\n              <span style=\"font-size:13px;color:var(--text-dim);\">${tier==='bronze'?'Tap the letters to spell the word':tier==='silver'?'Listen and spell what you hear':'Listen and type the word'}</span>\n            </div>\n          </div>\n          ${isTile ? `\n          <div id=\"sp-slots\" style=\"display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;\">\n            ${slotData.map((_,si)=>`<div id=\"sp-s-${si}\" onclick=\"spRemove(${si})\" style=\"\n              width:44px;height:52px;border-radius:8px;\n              border:2px solid var(--surface2);background:var(--surface);\n              display:flex;align-items:center;justify-content:center;\n              font-size:20px;font-weight:700;color:var(--text);cursor:pointer;\n            \"></div>`).join('')}\n          </div>\n          <div id=\"sp-bank\" style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px;margin-bottom:1rem;\">\n            ${bankData.map((t,bi)=>`<button id=\"sp-t-${bi}\" onclick=\"spTap(${bi})\" style=\"\n              width:44px;height:52px;border-radius:8px;\n              border:1.5px solid #4A6080;background:var(--surface);\n              font-size:20px;font-weight:700;color:var(--text);\n              cursor:pointer;box-shadow:0 2px 0 #1E3248;transition:opacity .2s;\n            \">${t.letter}</button>`).join('')}\n          </div>` : `\n          <div style=\"margin-bottom:1rem;\">\n            <input id=\"sp-input\" type=\"text\"\n              autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"none\" spellcheck=\"false\"\n              placeholder=\"Type the word\u2026\"\n              oninput=\"spTypeInput()\" onkeydown=\"spTypeKey(event)\"\n              style=\"\n                width:100%;font-size:22px;font-weight:600;text-align:center;\n                padding:14px;border-radius:var(--radius);\n                border:2px solid var(--surface2);background:var(--surface);\n                color:var(--text);outline:none;letter-spacing:.08em;\n              \">\n            <button id=\"sp-chk\" onclick=\"spCheckType()\" disabled style=\"\n              width:100%;margin-top:10px;padding:13px;\n              border-radius:var(--radius);border:none;\n              background:var(--accent);color:var(--bg);\n              font-size:15px;font-weight:600;cursor:pointer;opacity:.4;\n              transition:opacity .15s;\n            \">Check \u2192</button>\n          </div>`}\n          <div id=\"sp-fb\" style=\"min-height:24px;text-align:center;font-size:14px;color:var(--text-dim);margin-bottom:.5rem;\"></div>`;\n\n        speak(item.word,'neutral',350, item.audioFile);\n        if(tier==='gold') setTimeout(()=>{const inp=document.getElementById('sp-input');if(inp)inp.focus();},200);\n      }\n\n      // \u2500\u2500 Tile mechanic \u2500\u2500\n      window.spTap=function(bi){\n        if(spLocked)return;\n        const tile=bankData[bi];\n        if(tile.used)return;\n        const si=slotData.indexOf(null);\n        if(si===-1)return;\n        tile.used=true;\n        slotData[si]={letter:tile.letter,bankId:bi};\n        speak(session[idx].word,'neutral', 0, session[idx].audioFile);\n        spRefreshSlots();spRefreshBank();\n        if(slotData.indexOf(null)===-1)setTimeout(spCheckTiles,200);\n      };\n      window.spRemove=function(si){\n        if(spLocked)return;\n        const entry=slotData[si];\n        if(!entry)return;\n        bankData[entry.bankId].used=false;\n        slotData[si]=null;\n        spRefreshSlots();spRefreshBank();\n      };\n\n      function spRefreshSlots(){\n        slotData.forEach((entry,si)=>{\n          const el=document.getElementById(`sp-s-${si}`);\n          if(!el)return;\n          el.textContent=entry?entry.letter:'';\n          el.style.borderColor=entry?'var(--accent)':'var(--surface2)';\n          el.style.background=entry?'rgba(79,195,247,.08)':'var(--surface)';\n        });\n      }\n      function spRefreshBank(){\n        bankData.forEach((t,bi)=>{\n          const el=document.getElementById(`sp-t-${bi}`);\n          if(el)el.style.opacity=t.used?'0':'1';\n        });\n      }\n\n      function spCheckTiles(){\n        const item=session[idx];\n        const attempt=slotData.map(e=>e.letter).join('').toLowerCase();\n        const ok=attempt===item.word.toLowerCase();\n        spLocked=true;\n        const fb=document.getElementById('sp-fb');\n        slotData.forEach((_,si)=>{\n          const el=document.getElementById(`sp-s-${si}`);\n          if(el){\n            el.style.borderColor=ok?'var(--gold)':'var(--fail)';\n            el.style.background=ok?'rgba(255,215,0,.1)':'rgba(239,83,80,.1)';\n          }\n        });\n        if(ok){\n          score++;\n          if(fb){fb.textContent='\u2713 Correct!';fb.style.color='var(--pass)';}\n          speak(item.word,'celebrate', 0, item.audioFile);\n          setTimeout(()=>showReinforcePanel(item,()=>{idx++;load();}),500);\n        } else {\n          if(fb){fb.textContent=`\u2717 The word is: ${item.word}`;fb.style.color='var(--fail)';}\n          speak(item.word,'wrong', 0, item.audioFile);\n          setTimeout(()=>{\n            slotData=slotData.map(()=>null);\n            bankData.forEach(t=>t.used=false);\n            spLocked=false;\n            spRefreshSlots();spRefreshBank();\n            if(fb){fb.textContent='Try again!';fb.style.color='var(--text-dim)';}\n            speak(item.word,'neutral',300, item.audioFile);\n          },1500);\n        }\n      }\n\n      // \u2500\u2500 Free type (Gold) \u2500\u2500\n      window.spTypeInput=function(){\n        const inp=document.getElementById('sp-input');\n        const chk=document.getElementById('sp-chk');\n        if(!inp||!chk)return;\n        chk.disabled=inp.value.trim().length===0;\n        chk.style.opacity=inp.value.trim().length?'1':'.4';\n      };\n      window.spTypeKey=function(e){ if(e.key==='Enter')spCheckType(); };\n      window.spCheckType=function(){\n        if(spLocked)return;\n        const item=session[idx];\n        const inp=document.getElementById('sp-input');\n        if(!inp||!inp.value.trim())return;\n        const attempt=inp.value.trim().toLowerCase();\n        const ok=attempt===item.word.toLowerCase();\n        spLocked=true;\n        const fb=document.getElementById('sp-fb');\n        if(inp){inp.style.borderColor=ok?'var(--gold)':'var(--fail)';inp.style.background=ok?'rgba(255,215,0,.05)':'rgba(239,83,80,.05)';}\n        const chk=document.getElementById('sp-chk');\n        if(chk)chk.style.display='none';\n        if(ok){\n          if(!retypeMode)score++;\n          if(fb){fb.textContent='\u2713 Correct!';fb.style.color='var(--pass)';}\n          speak(item.word,'celebrate', 0, item.audioFile);\n          setTimeout(()=>showReinforcePanel(item,()=>{idx++;load();}),500);\n        } else {\n          if(fb){fb.textContent=`\u2717 The word is: ${item.word} \u2014 now type it correctly`;fb.style.color='var(--fail)';}\n          speak(item.word,'wrong', 0, item.audioFile);\n          setTimeout(()=>{\n            retypeMode=true; spLocked=false;\n            if(inp){\n              inp.value=''; inp.style.borderColor='var(--accent)';\n              inp.style.background='rgba(79,195,247,.05)';\n              inp.placeholder='Type the correct word\u2026'; inp.focus();\n            }\n            if(chk){chk.style.display='block';chk.disabled=true;chk.style.opacity='.4';}\n            if(fb){fb.textContent=`Type: ${item.word}`;fb.style.color='var(--accent)';}\n            speak(item.word,'neutral',300, item.audioFile);\n          },1600);\n        }\n      };\n\n      load();\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  AUDIO MATCH\n  //  Left col: tap to hear (unlimited replay, never disabled).\n  //  Right col: tap the matching text.\n  //  Same match/reveal mechanic as word-match \u2014 reuses its CSS.\n  //  Tiers differ only via data: bronze = single words,\n  //  silver/gold = sentences with deliberately similar distractors.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'audio-match': {\n    render(container, data, tier, onComplete) {\n      const { pairs } = data;\n      let selectedLeft = null;\n      let matchedCount = 0;\n      let wrongCount   = 0;\n      const total      = pairs.length;\n\n      const PALETTE = [\n        { border: '#00BCD4', bg: 'rgba(0,188,212,0.15)',  color: '#00BCD4' },\n        { border: '#AB47BC', bg: 'rgba(171,71,188,0.15)', color: '#CE93D8' },\n        { border: '#FF9800', bg: 'rgba(255,152,0,0.15)',  color: '#FFB74D' },\n        { border: '#E91E63', bg: 'rgba(233,30,99,0.15)',  color: '#F48FB1' },\n        { border: '#8BC34A', bg: 'rgba(139,195,74,0.15)', color: '#AED581' },\n      ];\n\n      container.innerHTML = `\n        <p class=\"module-question\">Listen, then tap the matching sentence.</p>\n        <p class=\"match-score\" id=\"am-score\">${total} to match</p>\n        <div class=\"match-grid\">\n          <div class=\"match-col\" id=\"am-left-col\"></div>\n          <div class=\"match-col\" id=\"am-right-col\"></div>\n        </div>\n        <button class=\"next-ex-btn\" id=\"am-next-btn\" style=\"display:none\">Next \u2192</button>\n      `;\n\n      const leftCol    = container.querySelector('#am-left-col');\n      const rightCol   = container.querySelector('#am-right-col');\n      const scoreLabel = container.querySelector('#am-score');\n      const nextBtn    = container.querySelector('#am-next-btn');\n\n      const leftItems  = pairs.map((p, i) => ({ ...p, pairIdx: i })).sort(() => Math.random() - 0.5);\n      const rightItems = pairs.map((p, i) => ({ ...p, pairIdx: i })).sort(() => Math.random() - 0.5);\n\n      leftItems.forEach((pair, li) => {\n        const btn = document.createElement('button');\n        btn.className       = 'match-btn';\n        btn.innerHTML       = `\ud83d\udd0a<br><span style=\"opacity:.55;font-size:11px;\">Track ${li + 1}</span>`;\n        btn.dataset.key     = pair.text;\n        btn.dataset.side    = 'left';\n        btn.dataset.pairIdx = pair.pairIdx;\n        btn.dataset.audio   = pair.audio;\n        leftCol.appendChild(btn);\n      });\n\n      rightItems.forEach(pair => {\n        const btn = document.createElement('button');\n        btn.className       = 'match-btn';\n        btn.textContent     = pair.text;\n        btn.dataset.key     = pair.text;\n        btn.dataset.side    = 'right';\n        btn.dataset.pairIdx = pair.pairIdx;\n        rightCol.appendChild(btn);\n      });\n\n      function applyMatchColor(btn) {\n        const c = PALETTE[parseInt(btn.dataset.pairIdx) % PALETTE.length];\n        btn.style.borderColor = c.border;\n        btn.style.background  = c.bg;\n        btn.style.color       = c.color;\n        btn.classList.add('matched');\n        btn.disabled = true;\n      }\n\n      container.querySelectorAll('.match-btn').forEach(btn => {\n        btn.addEventListener('click', () => {\n          if (btn.classList.contains('matched')) return;\n\n          if (btn.dataset.side === 'left') {\n            speak(btn.dataset.audio, 'neutral', 0, btn.dataset.audioFile); // unlimited replay, every tap plays\n            if (selectedLeft !== btn) {\n              container.querySelectorAll('.match-btn[data-side=\"left\"]')\n                .forEach(b => b.classList.remove('selected'));\n              selectedLeft = btn;\n              btn.classList.add('selected');\n            }\n            return;\n          }\n\n          if (!selectedLeft) return;\n\n          const isMatch = (selectedLeft.dataset.key === btn.dataset.key);\n\n          if (isMatch) {\n            const leftBtn = selectedLeft;\n            selectedLeft  = null;\n            applyMatchColor(leftBtn);\n            applyMatchColor(btn);\n            matchedCount++;\n\n            const remaining = total - matchedCount;\n            scoreLabel.textContent = remaining > 0 ? `${remaining} left` : 'All matched! \u2713';\n\n            if (matchedCount === total) {\n              const score = Math.max(0.6, 1 - (wrongCount * 0.1));\n              nextBtn.style.display = 'block';\n              nextBtn.onclick = () => onComplete(score);\n            }\n          } else {\n            wrongCount++;\n            selectedLeft.classList.add('wrong-flash');\n            btn.classList.add('wrong-flash');\n            const prevLeft = selectedLeft;\n            selectedLeft   = null;\n            setTimeout(() => {\n              prevLeft.classList.remove('wrong-flash', 'selected');\n              btn.classList.remove('wrong-flash');\n            }, 500);\n          }\n        });\n      });\n    }\n  },\n\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  //  SENTENCE BUILDING\n  //  Word-tile version of Word Scramble: tap tiles from the bank into\n  //  ordered slots, auto-check on last slot filled, reset on wrong.\n  //  On correct: tiles recolour by grammar role (subject/verb/object/\n  //  place/time \u2014 5 colours; everything else stays neutral) and the\n  //  full sentence plays. Manual \"Next \u2192\" so the reveal isn't rushed.\n  // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  'sentence-building': {\n    render(container, data, tier, onComplete) {\n      const { items } = data;\n      const PICK = Math.min(items.length, 4);\n      const session = safeShuffle(items, ()=>false).slice(0, PICK);\n      let idx=0, score=0, sbLocked=false;\n      let slotData=[], bankData=[];\n\n      const ROLE_COLOR = {\n        subject: '#00BCD4',\n        verb:    '#8BC34A',\n        object:  '#FF9800',\n        place:   '#AB47BC',\n        time:    '#E91E63',\n      };\n      const roleColor = role => ROLE_COLOR[role] || null; // null = neutral grey\n\n      function pips() {\n        return session.map((_,i)=>`<div class=\"pip${i<idx?' done':i===idx?' current':''}\"></div>`).join('');\n      }\n\n      function sentenceText(tokens) {\n        return tokens.map(t=>t.text).join(' ');\n      }\n\n      function load() {\n        sbLocked=false;\n        if(idx>=session.length){onComplete(score/PICK);return;}\n        const item=session[idx];\n        slotData=item.tokens.map(()=>null);\n        const withId=item.tokens.map((t,i)=>({...t,id:i}));\n        bankData=safeShuffle(withId, r=>r.every((t,i)=>t.text===item.tokens[i].text))\n          .map(t=>({...t,used:false}));\n        draw();\n      }\n\n      function draw() {\n        container.innerHTML=`\n          <div class=\"progress-row\" style=\"margin-bottom:1rem;\">${pips()}</div>\n          <p class=\"module-question\" style=\"text-align:center;\">Put the words in order.</p>\n          <div id=\"sb-slots\" style=\"display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;min-height:52px;\">\n            ${slotData.map((_,si)=>`<div id=\"sb-s-${si}\" onclick=\"sbRemove(${si})\" style=\"\n              min-width:44px;height:44px;padding:0 10px;border-radius:8px;\n              border:2px solid var(--surface2);background:var(--surface);\n              display:flex;align-items:center;justify-content:center;\n              font-size:15px;font-weight:700;color:var(--text);cursor:pointer;\n            \"></div>`).join('')}\n          </div>\n          <div id=\"sb-bank\" style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:52px;margin-bottom:1rem;\">\n            ${bankData.map((t,bi)=>`<button id=\"sb-t-${bi}\" onclick=\"sbTap(${bi})\" style=\"\n              padding:11px 14px;border-radius:8px;\n              border:1.5px solid #4A6080;background:var(--surface);\n              font-size:15px;font-weight:600;color:var(--text);\n              cursor:pointer;box-shadow:0 2px 0 #1E3248;transition:opacity .2s;\n            \">${t.text}</button>`).join('')}\n          </div>\n          <div id=\"sb-fb\" style=\"min-height:24px;text-align:center;font-size:14px;color:var(--text-dim);margin-bottom:.5rem;\"></div>\n          <button class=\"next-ex-btn\" id=\"sb-next-btn\" style=\"display:none\">Next \u2192</button>`;\n      }\n\n      function refreshSlots() {\n        slotData.forEach((entry,si)=>{\n          const el=document.getElementById(`sb-s-${si}`);\n          if(!el)return;\n          el.textContent=entry?entry.text:'';\n          el.style.borderColor=entry?'var(--accent)':'var(--surface2)';\n          el.style.background=entry?'rgba(79,195,247,.08)':'var(--surface)';\n        });\n      }\n      function refreshBank() {\n        bankData.forEach((t,bi)=>{\n          const el=document.getElementById(`sb-t-${bi}`);\n          if(el)el.style.opacity=t.used?'0':'1';\n        });\n      }\n\n      window.sbTap=function(bi){\n        if(sbLocked)return;\n        const tile=bankData[bi];\n        if(tile.used)return;\n        const si=slotData.indexOf(null);\n        if(si===-1)return;\n        tile.used=true;\n        slotData[si]={text:tile.text,role:tile.role,bankId:bi};\n        refreshSlots();refreshBank();\n        if(slotData.indexOf(null)===-1)setTimeout(sbCheck,200);\n      };\n      window.sbRemove=function(si){\n        if(sbLocked)return;\n        const entry=slotData[si];\n        if(!entry)return;\n        bankData[entry.bankId].used=false;\n        slotData[si]=null;\n        refreshSlots();refreshBank();\n      };\n\n      function sbCheck(){\n        const item=session[idx];\n        const ok=slotData.every((e,i)=>e.text===item.tokens[i].text);\n        sbLocked=true;\n        const fb=document.getElementById('sb-fb');\n        const nextBtn=document.getElementById('sb-next-btn');\n\n        if(ok){\n          score++;\n          slotData.forEach((entry,si)=>{\n            const el=document.getElementById(`sb-s-${si}`);\n            if(!el)return;\n            const c=roleColor(entry.role);\n            el.style.borderColor=c||'var(--text-dim)';\n            el.style.background=c?c+'26':'rgba(255,255,255,.06)';\n            el.style.color=c||'var(--text-dim)';\n          });\n          if(fb){fb.textContent='\u2713 Correct!';fb.style.color='var(--pass)';}\n          speak(sentenceText(item.tokens),'celebrate', 0, item.audioFile);\n          if(nextBtn){\n            nextBtn.style.display='block';\n            nextBtn.onclick=()=>{idx++;load();};\n          }\n        } else {\n          slotData.forEach((_,si)=>{\n            const el=document.getElementById(`sb-s-${si}`);\n            if(el){el.style.borderColor='var(--fail)';el.style.background='rgba(239,83,80,.1)';}\n          });\n          if(fb){fb.textContent='\u2717 Not quite \u2014 listen and try again';fb.style.color='var(--fail)';}\n          speak(sentenceText(item.tokens),'wrong', 0, item.audioFile);\n          setTimeout(()=>{\n            slotData=slotData.map(()=>null);\n            bankData.forEach(t=>t.used=false);\n            sbLocked=false;\n            refreshSlots();refreshBank();\n            if(fb){fb.textContent='Try again!';fb.style.color='var(--text-dim)';}\n          },1600);\n        }\n      }\n\n      load();\n    }\n  },\n\n};\n\n\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  INIT\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nshowScreen('screen-name');\n<\/script>\n</body>\n</html>\n";

function buildPublishedLessonHTML(lessonId, pushedAudioIds){
  const lesson = LESSONS.find(l => l.id === lessonId);
  const modules = transformLessonForPublish(lessonId, pushedAudioIds);
  let html = SHELL_TEMPLATE;

  // Swap the placeholder LESSON data for this lesson's real content. JSON is valid JS array/object
  // syntax, so JSON.stringify's output drops in as a working `const LESSON = [...]` literal as-is.
  const lessonJson = JSON.stringify(modules, null, 2);
  const lessonBlockPattern = /const LESSON = \[[\s\S]*?\n\];/;
  if(!lessonBlockPattern.test(html)){
    throw new Error('Could not find "const LESSON = [...]" in the shell template — publish aborted rather than guess.');
  }
  html = html.replace(lessonBlockPattern, `const LESSON = ${lessonJson};`);

  // Cosmetic but worth doing while we're in here — the template's generic placeholder title.
  html = html.replace('<title>EFL Lesson</title>', `<title>${lesson.name}</title>`);
  html = html.replace('<p class="welcome-label">EFL Lesson</p>', `<p class="welcome-label">${lesson.name}</p>`);

  return html;
}

let publishGhState = {};
let publishLastError = null;

async function ghApiRequest(method, path, body){
  const res = await fetch(`https://api.github.com/repos/${GH_CREDS.repo}${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${GH_CREDS.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok){
    let detail = '';
    try{ const err = await res.json(); detail = err.message || ''; }catch(e){}
    throw new Error(`GitHub ${res.status}${detail ? ': '+detail : ''}`);
  }
  return res.json();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function ghPagesUrl(lessonId){
  const [owner, repo] = (GH_CREDS.repo || '').split('/');
  if(!owner || !repo) return '';
  return `https://${owner}.github.io/${repo}/lessons/${lessonId}/`;
}

// Each of these does ONE real step and stashes what the next step needs in
// publishGhState — lets the existing per-step UI stay meaningful instead of
// bundling everything into a single opaque call.
async function ghStep_readRef(){
  const ref = await ghApiRequest('GET', `/git/ref/heads/${GH_CREDS.branch}`);
  publishGhState.baseCommitSha = ref.object.sha;
  const baseCommit = await ghApiRequest('GET', `/git/commits/${publishGhState.baseCommitSha}`);
  publishGhState.baseTreeSha = baseCommit.tree.sha;
}

// Reads lessons/{lessonId}/manifest.json — the SAME file the TTS tool writes on push — so
// anything that needs to know "what audio is actually live" (publish's atomic push, and the
// pre-publish check below) shares one ground-truth source instead of two separate guesses.
// A 404 just means no audio has been pushed for this lesson yet — a normal state, not an error.
async function fetchPushedAudioIds(lessonId){
  const path = `lessons/${lessonId}/manifest.json`;
  const res = await fetch(`https://api.github.com/repos/${GH_CREDS.repo}/contents/${path}`, {
    headers: { 'Authorization': `Bearer ${GH_CREDS.token}`, 'Accept': 'application/vnd.github+json' }
  });
  if(res.status === 404) return new Set();
  if(!res.ok) throw new Error(`GitHub ${res.status} reading audio manifest`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  let manifest;
  try{ manifest = JSON.parse(content); }
  catch(e){ throw new Error('Audio manifest.json exists but is not valid JSON — publish aborted rather than guess.'); }
  return new Set((manifest.assets || []).filter(a => a.status === 'pushed').map(a => a.id));
}

async function ghStep_readAudioManifest(lessonId){
  publishGhState.pushedAudioIds = await fetchPushedAudioIds(lessonId);
}

// Ground-truth version of the old LIVE_FLAGS-based check — diffs the lesson's actual speakable
// lines (extractSpeakableForTTS, which excludes truefalse/putinorder/wordmatch — unverified
// against shell-v2, not confirmed silent; gapfill was wrongly excluded here too, now fixed)
// GitHub credentials to check for real; if none are set, returns null so the caller can decide
// how to degrade rather than silently lying with a fake "all clear".
async function getFullAudioStatusForLesson(lessonId){
  if(!GH_CREDS.token) return null;
  const pushed = await fetchPushedAudioIds(lessonId);
  const speakable = extractSpeakableForTTS(lessonId);
  return speakable.map(item => {
    const [instId, ...rest] = item.id.split('.');
    return { text: item.text, module: instanceLabel(instId), tier: rest[0] || '', key: item.id, pushed: pushed.has(item.id) };
  });
}

async function ghStep_buildUpdate(lessonId){
  const lesson = LESSONS.find(l => l.id === lessonId);
  const modules = transformLessonForPublish(lessonId, publishGhState.pushedAudioIds);

  // The real student-facing page — the shell template with this lesson's content baked in,
  // including audioFile references for any lines with real generated audio already pushed.
  const htmlPath = `lessons/${lessonId}/index.html`;
  const html = buildPublishedLessonHTML(lessonId, publishGhState.pushedAudioIds);
  const htmlB64 = btoa(unescape(encodeURIComponent(html)));
  const htmlBlob = await ghApiRequest('POST', '/git/blobs', { content: htmlB64, encoding: 'base64' });

  // A plain-JSON copy alongside it — cheap to include, useful for debugging/inspection without
  // having to read the whole HTML file, and it's what "Preview production JSON" already shows you.
  const jsonPath = `lessons/${lessonId}/content.json`;
  const jsonContent = JSON.stringify({ lessonId, lessonName: lesson.name, publishedAt: new Date().toISOString(), modules }, null, 2);
  const jsonB64 = btoa(unescape(encodeURIComponent(jsonContent)));
  const jsonBlob = await ghApiRequest('POST', '/git/blobs', { content: jsonB64, encoding: 'base64' });

  const tree = await ghApiRequest('POST', '/git/trees', {
    base_tree: publishGhState.baseTreeSha,
    tree: [
      { path: htmlPath, mode:'100644', type:'blob', sha: htmlBlob.sha },
      { path: jsonPath, mode:'100644', type:'blob', sha: jsonBlob.sha },
    ],
  });
  publishGhState.treeSha = tree.sha;
  publishGhState.htmlPath = htmlPath;
  publishGhState.jsonPath = jsonPath;
}

async function ghStep_createCommit(lessonId){
  const commit = await ghApiRequest('POST', '/git/commits', {
    message: `Publish lesson content: ${lessonId}`,
    tree: publishGhState.treeSha,
    parents: [publishGhState.baseCommitSha],
  });
  publishGhState.commitSha = commit.sha;
}

async function ghStep_atomicSwitch(){
  // The one moment anything actually goes live. Every step before this only touched
  // unreferenced git objects — a failure at or before this point leaves the live
  // branch completely untouched, safe to retry with zero side effects.
  await ghApiRequest('PATCH', `/git/refs/heads/${GH_CREDS.branch}`, { sha: publishGhState.commitSha });
}

async function runPublishStep(i){
  if(i >= publishSteps.length){
    publishState = 'done';
    markPublishTargetLive();
    renderPublishModal();
    return;
  }
  publishSteps[i].status = 'active';
  renderPublishModal();

  const step = publishSteps[i];
  const isRealLessonPush = publishKind === 'lesson';

  try{
    if(i === publishForceFailAt){
      await sleep(350);
      throw new Error('Simulated failure (testing hook)');
    }

    if(isRealLessonPush && step.isReadRef){
      await ghStep_readRef();
    } else if(isRealLessonPush && step.isReadAudioManifest){
      await ghStep_readAudioManifest(publishLessonId);
    } else if(isRealLessonPush && step.isBuildUpdate){
      await ghStep_buildUpdate(publishLessonId);
    } else if(isRealLessonPush && step.isCreateCommit){
      await ghStep_createCommit(publishLessonId);
    } else if(isRealLessonPush && step.isAtomicSwitch){
      await ghStep_atomicSwitch();
    } else {
      // Non-network steps for the real lesson path (per-module "preparing" pacing —
      // the content itself is already computed synchronously by the transform, there's
      // genuinely nothing to await here) and every step of the still-simulated asset
      // publish path, unchanged.
      await sleep(350);
    }

    publishSteps[i].status = 'done';
    renderPublishModal();
    runPublishStep(i+1);
  } catch(err){
    publishSteps[i].status = 'failed';
    publishLastError = err.message;
    // For a real push, PATCH-the-ref is genuinely atomic — it either lands or it doesn't,
    // there's no partial state. So "failed after switch" can't happen here; it's kept only
    // for the still-simulated asset path below, where it represents a different real thing
    // (a Pages build lagging after a successful switch), not an actual write failure.
    const switchIndex = publishSteps.findIndex(s => s.isAtomicSwitch);
    const pastSwitch = !isRealLessonPush && i > switchIndex;
    publishState = pastSwitch ? 'failed-after-switch' : 'failed-safe';
    if(pastSwitch) markPublishTargetLive();
    renderPublishModal();
  }
}

function retryPublish(){
  publishForceFailAt = -1; // a real retry wouldn't hit the same injected test failure twice
  if(publishKind === 'assets') beginAssetPublishSequence();
  else beginPublishSequence();
}



// ==========================================================================
// ---- Persistence layer (v1) ----
// Implements the settled design from persistence-layer-spec.md:
//   - Drafts autosave to the browser's own localStorage, no account, no server.
//   - "Export lesson" / "Import lesson" cover the occasional sharing case.
// This does NOT yet implement the GitHub Action publish step from the spec —
// "Publish lesson" below still runs the simulated publish sequence. Swapping
// that simulation for a real trigger call is separate, later work.
// ==========================================================================

const PERSIST_KEY = 'lessonBuilder.draftState.v1';
const PERSIST_DEBOUNCE_MS = 1200;
let persistSaveTimer = null;
let persistLastSavedAt = null;

// Everything a reload needs to reconstruct exactly where you left off.
function collectPersistedState(){
  return {
    schemaVersion: 1,
    savedAt: new Date().toISOString(),
    LESSONS,
    LESSON_CONTENT,
    AUDIO_RECORDED,
    WORD_BANK,
    wordBankSeeded,
    bankIdCounter,
    SHARED_ASSETS: SHARED_ASSETS.map(a => ({ id:a.id, version:a.version, pending:a.pending })),
    currentLessonId,
    currentModule,
    currentTier,
  };
}

function saveStateNow(){
  try{
    localStorage.setItem(PERSIST_KEY, JSON.stringify(collectPersistedState()));
    persistLastSavedAt = new Date();
    updateSaveIndicator();
  } catch(e){
    // Most likely a quota issue (localStorage is small, ~5MB). Surfacing this
    // beats failing silently — a teacher should know a draft isn't landing.
    console.error('Autosave failed:', e);
    updateSaveIndicator(true);
  }
}

// Debounced entry point — call this from every input/change handler that
// mutates lesson data. Matches the spec's "the moment you type" intent
// without hammering localStorage on every keystroke.
function scheduleSave(){
  updateSaveIndicator('pending');
  clearTimeout(persistSaveTimer);
  persistSaveTimer = setTimeout(saveStateNow, PERSIST_DEBOUNCE_MS);
}

function updateSaveIndicator(state){
  const el = document.querySelector('.save-state');
  if(!el) return;
  if(state === true){ el.textContent = 'Autosave failed — export a backup'; el.style.color = 'var(--pink)'; return; }
  el.style.color = '';
  if(state === 'pending'){ el.textContent = 'Saving…'; return; }
  el.textContent = 'Saved just now';
}

// Returns true if a saved draft was found and restored.
function loadPersistedState(){
  let raw;
  try{ raw = localStorage.getItem(PERSIST_KEY); } catch(e){ return false; }
  if(!raw) return false;
  let saved;
  try{ saved = JSON.parse(raw); } catch(e){ console.error('Saved draft was corrupt, ignoring it:', e); return false; }
  if(!saved || saved.schemaVersion !== 1) return false;

  // LESSONS / LESSON_CONTENT / AUDIO_RECORDED / SHARED_ASSETS are declared
  // `const` — restore by mutating in place rather than reassigning.
  LESSONS.length = 0;
  (saved.LESSONS || []).forEach(l => LESSONS.push(l));

  Object.keys(LESSON_CONTENT).forEach(k => delete LESSON_CONTENT[k]);
  Object.assign(LESSON_CONTENT, saved.LESSON_CONTENT || {});

  Object.keys(AUDIO_RECORDED).forEach(k => delete AUDIO_RECORDED[k]);
  Object.assign(AUDIO_RECORDED, saved.AUDIO_RECORDED || {});

  WORD_BANK = saved.WORD_BANK || [];
  wordBankSeeded = !!saved.wordBankSeeded;
  bankIdCounter = saved.bankIdCounter || 1;

  (saved.SHARED_ASSETS || []).forEach(sa => {
    const asset = SHARED_ASSETS.find(a => a.id === sa.id);
    if(asset){ asset.version = sa.version; asset.pending = sa.pending; }
  });

  if(saved.currentLessonId && LESSONS.some(l => l.id === saved.currentLessonId)){
    currentLessonId = saved.currentLessonId;
    currentModule = saved.currentModule || 'gapfill';
    currentTier = saved.currentTier || 'bronze';
  }
  persistLastSavedAt = new Date(saved.savedAt);
  return true;
}

function clearPersistedState(){
  if(!confirm('This clears your saved draft from this browser and reloads the original demo content. This cannot be undone. Continue?')) return;
  try{ localStorage.removeItem(PERSIST_KEY); } catch(e){}
  location.reload();
}

// ---- Export / Import — the "occasional sharing with Sophy" path from the spec ----

function exportCurrentLesson(){
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  if(!lesson) return;
  ensureLessonContent(lesson.id);
  ensureAudioRecorded(lesson.id);
  const payload = {
    schemaVersion: 1,
    exportedAt: new Date().toISOString(),
    lesson,
    content: LESSON_CONTENT[lesson.id],
    audio: AUDIO_RECORDED[lesson.id] || {},
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = (lesson.name || 'lesson').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  a.href = url;
  a.download = `${slug || 'lesson'}-export.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function triggerImportLesson(){
  document.getElementById('importLessonInput').click();
}

function importLessonFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ alert('That file isn\'t valid lesson export JSON.'); input.value = ''; return; }

    if(!payload || !payload.lesson || payload.schemaVersion !== 1){
      alert('That file doesn\'t look like a Lesson Builder export.');
      input.value = ''; return;
    }

    let { lesson, content, audio } = payload;
    // Never silently collide with an existing lesson id — imports always land
    // as their own lesson, even if re-importing something exported from here.
    let newId = lesson.id;
    if(LESSONS.some(l => l.id === newId) || !newId){
      newId = 'imported-' + Date.now();
    }
    const importedLesson = { ...lesson, id:newId, status:'draft', editedBy:'Imported', editedAgo:'just now' };
    LESSONS.unshift(importedLesson);
    LESSON_CONTENT[newId] = content || {};
    AUDIO_RECORDED[newId] = audio || {};

    input.value = '';
    saveStateNow();
    renderDashboard();
    alert(`Imported "${importedLesson.name}" as a new draft.`);
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

// ---- App init — runs last, after every function/data declaration above exists ----
function renderEditorShell(){
  const lesson = LESSONS.find(l => l.id === currentLessonId) || { name:'Untitled Lesson', status:'draft' };
  document.getElementById('editorApp').innerHTML = `
    <div class="sidebar">
      <div class="brand">Lesson Builder</div>
      <div class="lesson-name">${lesson.name}</div>
      <div class="lesson-sub">${lesson.status === 'published' ? 'Published' : 'Draft'} · edited ${lesson.editedAgo || 'just now'}</div>
      <textarea class="lesson-notes" id="lessonNotes" placeholder="Notes to keep yourself on track — theme, tone, anything you don't want to forget mid-edit…">${lesson.notes || ''}</textarea>
      <ul class="mod-list" id="modList"></ul>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="crumb">${lesson.name} / <b id="crumbMod">Gap-fill</b></div>
        <div class="actions">
          <span class="save-state">Saved just now</span>
          <button class="btn" onclick="saveStateNow()">Save draft</button>
          <button class="btn" onclick="exportCurrentLesson()">Export lesson</button>
          <button class="btn" onclick="previewProductionJSON()" title="See the exact shape the shell would receive">🔍 Preview production JSON</button>
          <button class="btn" onclick="exportForTTSTool()" title="Generate a manifest the TTS tool can import directly">🎙️ Export for TTS tool</button>
          <button class="btn" id="ghCredsBtn" onclick="openGitHubCredsModal()" title="${GH_CREDS.token ? 'Connected to '+GH_CREDS.repo : 'GitHub credentials for publishing — required before Publish can push for real'}">${GH_CREDS.token ? '🔑 GitHub ✓' : '🔑 GitHub'}</button>
          <button class="btn primary" onclick="openPublishModal()">Publish lesson</button>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-tabs" id="tierTabs"></div>
        <div style="display:flex;gap:8px;">
          <button class="copy-tier-btn" id="copyTierBtn" onclick="copyFromBronze()" style="display:none;"></button>
          <button class="compare-btn" id="compareBtn" onclick="toggleCompare()">⇄ Compare all 3 tiers</button>
        </div>
      </div>
      <div id="editView"></div>
      <div id="compareView" style="display:none;"></div>
    </div>
    <div class="preview-col">
      <div class="preview-title">Live preview — student view</div>
      <div class="phone" id="phone"></div>
      <div class="live-tag"><span class="live-dot"></span>Updates as you type</div>
      <div class="preview-note">This is exactly what a student sees on this tier — same frame, same fonts, same audio. Nothing here is a simplified stand-in.</div>
    </div>`;
  document.getElementById('lessonNotes').addEventListener('input', (e) => { lesson.notes = e.target.value; scheduleSave(); });
  renderSidebar(); renderTierTabs(); renderMain();
}

const restoredDraft = loadPersistedState();
seedWordBankFromColors(); // no-ops if a restored draft already seeded the bank
renderEditorShell();
renderAudioPolish();
renderDashboard();
showGlobalView('dashboard');

// Periodic autosave — the practical stand-in for true keystroke-level saving.
// Per-field autosave would mean instrumenting every one of the ~40 field-update
// functions across 12 module types; this interval plus the checkpoint saves at
// notes/create/publish/import/asset-upload gets the same real-world guarantee
// (nothing lost on a closed tab) without that sprawl. Worth revisiting if a
// true low-latency save becomes important later.
setInterval(saveStateNow, 4000);
window.addEventListener('beforeunload', saveStateNow);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveStateNow(); });
if(restoredDraft) console.log('Lesson Builder: restored a saved draft from this browser.');

</script>
