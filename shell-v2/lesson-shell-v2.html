<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EFL Lesson</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0D1B2A;
  --surface:    #162436;
  --surface2:   #1E3248;
  --text:       #EEF2F7;
  --text-dim:   #7A9BBF;
  --accent:     #4FC3F7;
  --bronze:     #CD7F32;
  --bronze-bg:  rgba(205,127,50,0.15);
  --silver:     #A0AEC0;
  --silver-bg:  rgba(160,174,192,0.15);
  --gold:       #FFD700;
  --gold-bg:    rgba(255,215,0,0.12);
  --pass:       #4CAF50;
  --fail:       #EF5350;
  --radius:     12px;
  --radius-sm:  8px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}

.screen {
  display: none;
  flex-direction: column;
  height: 100dvh;
  overflow-y: auto;
  padding: 28px 20px 32px;
}
.screen.active { display: flex; }

/* ─── NAME PICKER ─────────────────────────── */

.welcome-label {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.welcome-title {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 4px;
}
.welcome-sub {
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 28px;
}
.name-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.name-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--text);
  font-size: 17px;
  font-weight: 600;
  padding: 18px 12px;
  min-height: 60px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.name-btn.selected {
  border-color: var(--accent);
  background: rgba(79,195,247,0.1);
  color: var(--accent);
}
.start-btn {
  background: var(--accent);
  color: #0D1B2A;
  border: none;
  border-radius: var(--radius);
  font-size: 18px;
  font-weight: 700;
  padding: 18px;
  width: 100%;
  cursor: pointer;
  opacity: 0.25;
  pointer-events: none;
  transition: opacity 0.2s;
  margin-top: auto;
}
.start-btn.ready { opacity: 1; pointer-events: auto; }

/* ─── MODULE SCREEN ──────────────────────── */

.module-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.student-name {
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 600;
}
.tier-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
}
.tier-badge.bronze { background: var(--bronze-bg); color: var(--bronze); }
.tier-badge.silver { background: var(--silver-bg); color: var(--silver); }
.tier-badge.gold   { background: var(--gold-bg);   color: var(--gold);   }

.progress-row {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.pip {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  transition: background 0.3s;
}
.pip.done    { background: var(--pass); }
.pip.current { background: var(--accent); }

.tier-track {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}
.tier-seg {
  flex: 1;
  padding: 9px 6px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.25;
  transition: opacity 0.3s;
}
.tier-seg.bronze { background: var(--bronze-bg); color: var(--bronze); }
.tier-seg.silver { background: var(--silver-bg); color: var(--silver); }
.tier-seg.gold   { background: var(--gold-bg);   color: var(--gold);   }
.tier-seg.active { opacity: 1; }
.tier-seg.passed { opacity: 0.65; }
.tier-seg.passed::after { content: ' ✓'; }

#module-container { flex: 1; }

/* ─── TIER RESULT SCREEN ─────────────────── */

.result-icon  { font-size: 64px; text-align: center; margin: 28px 0 14px; }
.result-title { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 6px; }
.result-score { font-size: 17px; color: var(--text-dim); text-align: center; margin-bottom: 28px; }
.result-score span { color: var(--text); font-weight: 700; }
.result-msg {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 16px 20px;
  font-size: 15px;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.6;
}
.result-msg strong { color: var(--text); }

.cta-btn {
  display: block; width: 100%;
  background: var(--accent); color: #0D1B2A;
  border: none; border-radius: var(--radius);
  font-size: 18px; font-weight: 700;
  padding: 18px; cursor: pointer;
  text-align: center; margin-bottom: 12px;
}
.secondary-btn {
  display: block; width: 100%;
  background: var(--surface2); color: var(--text);
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 600;
  padding: 16px; cursor: pointer; text-align: center;
}

/* ─── END SCREEN ─────────────────────────── */

.end-header { text-align: center; padding: 16px 0 20px; }
.end-trophy  { font-size: 56px; margin-bottom: 10px; }
.end-name    { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.end-total   { font-size: 15px; color: var(--text-dim); }
.end-total span { color: var(--accent); font-weight: 700; }

.summary-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }

.summary-item {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.summary-item-label  { font-size: 15px; font-weight: 600; }
.summary-item-detail { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.summary-status {
  font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; white-space: nowrap;
}
.summary-status.complete   { background: rgba(76,175,80,0.15);  color: var(--pass); }
.summary-status.incomplete { background: rgba(239,83,80,0.15);  color: var(--fail); }

.retry-btn {
  display: block; width: 100%;
  background: transparent; color: var(--text);
  border: 2px solid var(--fail); border-radius: var(--radius);
  font-size: 16px; font-weight: 600;
  padding: 16px; cursor: pointer; text-align: center; margin-bottom: 12px;
}
.done-btn {
  display: block; width: 100%;
  background: var(--pass); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 18px; font-weight: 700;
  padding: 18px; cursor: pointer; text-align: center;
}

/* ─── MODULE: AUDIO UNDERSTANDING ──────────── */

.module-title    { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.module-question { font-size: 15px; color: var(--text-dim); margin-bottom: 20px; }

.listen-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  background: var(--surface2);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-size: 16px; font-weight: 700;
  padding: 16px; cursor: pointer; margin-bottom: 20px;
  transition: background 0.15s;
}
.listen-btn.playing { background: rgba(79,195,247,0.1); }

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.option-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px; font-weight: 500;
  padding: 16px 12px; min-height: 64px;
  cursor: pointer; text-align: center;
  transition: border-color 0.15s, background 0.15s, opacity 0.25s;
}
.option-btn.correct { border-color: var(--pass); background: rgba(76,175,80,0.12); color: var(--pass); }
.option-btn.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.1);  color: var(--fail); }
.option-btn:disabled { cursor: default; }
.option-btn.locked  { opacity: 0; pointer-events: none; }

.next-ex-btn {
  display: block; width: 100%;
  background: var(--accent); color: #0D1B2A;
  border: none; border-radius: var(--radius);
  font-size: 18px; font-weight: 700;
  padding: 18px; cursor: pointer; margin-top: 20px;
}

/* ─── MODULE: GAP FILL ──────────────────────── */

.sentence-display {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 20px 18px;
  font-size: 18px;
  line-height: 2;
  margin-bottom: 20px;
}
.blank-slot {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px solid var(--accent);
  color: var(--accent);
  font-weight: 700;
  text-align: center;
  padding: 0 6px;
  transition: color 0.2s, border-color 0.2s;
}
.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 4px;
}
.word-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px; font-weight: 600;
  padding: 12px 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.word-btn.selected { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }
.word-btn.correct  { border-color: var(--pass);   color: var(--pass); }
.word-btn.wrong    { border-color: var(--fail);   color: var(--fail); }
.word-btn:disabled { cursor: default; }

/* ─── MODULE: TRUE / FALSE ──────────────────── */

.tf-statement {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 24px 20px;
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 28px;
  text-align: center;
}
.tf-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.tf-btn {
  border: 2px solid transparent;
  border-radius: var(--radius);
  font-size: 19px; font-weight: 700;
  padding: 24px 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.tf-btn.true-btn  { background: rgba(76,175,80,0.1);  color: var(--pass); border-color: var(--pass); }
.tf-btn.false-btn { background: rgba(239,83,80,0.1);  color: var(--fail); border-color: var(--fail); }
.tf-btn.highlight-correct { background: var(--pass);  color: #fff; border-color: var(--pass); }
.tf-btn.highlight-wrong   { background: var(--fail);  color: #fff; border-color: var(--fail); }
.tf-btn:disabled { cursor: default; opacity: 0.7; }

/* ─── MODULE: WORD MATCH ────────────────────── */

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.match-col { display: flex; flex-direction: column; gap: 8px; }
.match-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  padding: 12px 10px;
  min-height: 54px;
  cursor: pointer; text-align: center;
  line-height: 1.3;
  transition: all 0.15s;
}
.match-btn.selected   { border-color: var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); }
.match-btn.matched    { border-color: var(--pass);   background: rgba(76,175,80,0.12); color: var(--pass); pointer-events: none; }
.match-btn.wrong-flash { border-color: var(--fail);  background: rgba(239,83,80,0.1); }
.match-score {
  font-size: 14px; color: var(--text-dim);
  text-align: center; margin-bottom: 12px;
}

/* ─── MODULE: SEQUENCING ────────────────────── */

.seq-prompt { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; }
.seq-slots  { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.seq-slot {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface2);
  border: 2px dashed rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  padding: 12px 14px; min-height: 50px;
  transition: border-color 0.2s, background 0.2s;
}
.seq-slot.filled  { border-style: solid; border-color: var(--accent); cursor: pointer; }
.seq-slot.correct { border-color: var(--pass); background: rgba(76,175,80,0.1); }
.seq-slot.wrong   { border-color: var(--fail); background: rgba(239,83,80,0.08); }
.slot-num {
  width: 24px; height: 24px; flex-shrink: 0;
  background: var(--surface); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  transition: background 0.2s, color 0.2s;
}
.seq-slot.filled .slot-num { background: var(--accent); color: #0D1B2A; }
.slot-text { font-size: 15px; font-weight: 600; }
.seq-pool-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.seq-pool  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.seq-item {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  padding: 11px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.seq-item:active { background: var(--surface); }
.seq-item.used   { opacity: 0.2; pointer-events: none; }

/* ─── MODULE: AUDIO SPEAKING ────────────────── */

.speak-target {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 22px 20px;
  font-size: 20px; font-weight: 700;
  text-align: center; line-height: 1.5;
  margin-bottom: 20px;
}

/* Three-button comparison row */
.speak-trio {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.trio-btn {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  padding: 16px 8px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 80px;
}
.trio-btn .trio-icon  { font-size: 24px; line-height: 1; }
.trio-btn .trio-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }

/* Model button — accent blue */
.trio-btn.model { border-color: var(--accent); color: var(--accent); }
.trio-btn.model .trio-label { color: var(--accent); }
.trio-btn.model.playing { background: rgba(79,195,247,0.1); }

/* Playback button — purple, disabled until recorded */
.trio-btn.playback { border-color: #AB47BC; color: #CE93D8; opacity: 0.3; pointer-events: none; }
.trio-btn.playback .trio-label { color: #AB47BC; }
.trio-btn.playback.ready { opacity: 1; pointer-events: auto; }
.trio-btn.playback.playing { background: rgba(171,71,188,0.1); }

/* Record button — red */
.trio-btn.record { border-color: var(--fail); color: var(--fail); }
.trio-btn.record .trio-label { color: var(--fail); }
.trio-btn.record.recording {
  background: rgba(239,83,80,0.1);
  animation: pulse-record 1s ease-in-out infinite;
}
@keyframes pulse-record {
  0%, 100% { box-shadow: 0 0 0 0   rgba(239,83,80,0.4); }
  50%       { box-shadow: 0 0 0 8px rgba(239,83,80,0);   }
}

.speak-hint {
  font-size: 13px; color: var(--text-dim);
  text-align: center; margin-bottom: 20px;
}

/* Self-assess — appears after first recording */
.assess-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
.assess-btn {
  border: 2px solid transparent; border-radius: var(--radius);
  font-size: 16px; font-weight: 700; padding: 18px; cursor: pointer;
  transition: all 0.15s;
}
.assess-yes { background: rgba(76,175,80,0.1); color: var(--pass); border-color: var(--pass); }
.assess-no  { background: rgba(239,83,80,0.1); color: var(--fail); border-color: var(--fail); }
.assess-btn.selected.assess-yes { background: var(--pass); color: #fff; }
.assess-btn.selected.assess-no  { background: var(--fail); color: #fff; }
.assess-btn:disabled { cursor: default; opacity: 0.5; }
.no-mic-msg {
  background: var(--surface2); border-radius: var(--radius-sm);
  padding: 14px 16px; font-size: 14px; color: var(--text-dim);
  text-align: center; margin-bottom: 14px; line-height: 1.6;
}


/* ─── NEW MODULE STYLES ──────────────────────── */
.option-btn.selected {
  border-color: var(--accent);
  background: rgba(79,195,247,0.08);
  color: var(--accent);
}
.module-game-label {
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
  margin-bottom: 8px;
}

/* ═══════════════════════════════════════════════════════
   SHELL V2 — Phone-frame chrome, adopted from module-demos.
   This replaces the flat header/pips/tier-track for
   screen-module. Modules only ever render into #module-container
   (= .block-flowzone), never touch the frame chrome directly.
   ═══════════════════════════════════════════════════════ */
#screen-module.screen { padding: 0; align-items: center; justify-content: center; }
.frame-wrap { width: min(400px, 100vw); max-height: 94vh; position: relative; container-type: inline-size; }
.frame-wrap::before { content: ''; display: block; padding-top: 215%; }
.app-frame { position: absolute; inset: 0; overflow: hidden; border-radius: 12.7cqw; }
.layer-bg    { position: absolute; inset: 0; background-image: url('assets/bg_and_border.png'); background-size: 100% 100%; z-index: 0; }
.layer-scene { position: absolute; left: 2.58%; top: 51.47%; width: 94.83%; height: 42.98%; background-image: url('assets/school_scene.png'); background-size: 100% 100%; z-index: 1; transition: top 0.35s ease, opacity 0.35s ease; }
.frame-mask  { position: absolute; inset: 0; z-index: 4; background-image: url('assets/frame_mask.png'); background-size: 100% 100%; pointer-events: none; }

.pos            { position: absolute; z-index: 2; }
.block-header   { left: 12.92%; top: 8.06%;  width: 75%;    height: 3.5%; }
.block-qlabel   { left: 13.08%; top: 15.3%; width: 75%;    height: 2.6%; display: flex; align-items: center; }
.block-progress { left: 13.08%; top: 19.69%; width: 75.17%; height: 1.01%; }
.block-flowzone { left: 13.00%; top: 24.99%; width: 75.08%; }

.v2-badge { width: 9cqw; aspect-ratio: 1/1; border-radius: 50%; background: linear-gradient(90deg,#753A70,#A54D75); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 500; font-size: 3.6cqw; flex-shrink: 0; }
.v2-header-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; }
.v2-header-left { display: flex; align-items: center; gap: 2.5cqw; min-width: 0; }
.v2-module-title { color: #fff; font-weight: 500; font-size: 3.9cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2-medal-icon { flex-shrink: 0; }
.v2-medal-icon img { width: 6.5cqw; height: 6.5cqw; display: block; }
.v2-qlabel { color: rgba(255,255,255,0.75); font-size: 3cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,0.6); justify-content: space-between; }
.v2-prog-track { width: 100%; height: 100%; background: #202336; border-radius: 99px; overflow: hidden; }
.v2-prog-fill { width: 0%; height: 100%; background: linear-gradient(90deg,#705697,#9D6089); border-radius: 99px; transition: width .4s; }

/* Grammar-reinforcement overlay — shared by gap-fill & true-false only */
.gr-overlay {
  display: none; position: absolute; inset: 0; z-index: 3;
  background: rgba(10,8,20,0.9);
  text-align: center; align-items: center; justify-content: center;
  flex-direction: column; padding: 5%;
}
.gr-continue-btn {
  padding: 3% 12%; border-radius: 999px; border: none;
  background: linear-gradient(180deg,#3D30B7 0%,#7052B4 45%,#A45B8B 100%);
  color: #fff; font-size: 4cqw; font-weight: 500; cursor: pointer; font-family: inherit;
}

/* Gap-fill (v2) */
.gf-sentence { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 5% 6%; color: #fff; font-size: 4.4cqw; line-height: 1.5; text-align: center; margin: 0 0 6%; }
.gf-blank { border-bottom: 2px solid rgba(255,255,255,0.5); padding: 0 1.5%; display: inline-block; min-width: 17%; white-space: nowrap; }
.gf-pill-row { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 7%; column-gap: 1.5%; margin-bottom: 6%; }
.gf-pill { background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 12px; font-size: 3.5cqw; color: rgba(255,255,255,0.85); cursor: pointer; font-family: inherit; transition: transform .12s, background .15s, border-color .15s, color .15s; padding: 2.5% 2%; min-width: 0; }

const LESSON = [
  {
    id: 'mod-1',
    type: 'audio-understanding',
    label: 'Listen & Choose 1',
    data: {
      bronze: {
        pick: 2,
        items: [
          { audio: 'dog', question: 'What word did you hear?',

        items: [

          { audio: 'I eat breakfast before school.', question: 'When does she eat breakfast?',
            options: ['after dinner','at night','before school','at the weekend'], answer: 'before school' }
        ]
      },
      gold: {
        pick: 2,
        items: [
          { audio: 'My father drives the car every morning.', question: 'What does the father do every morning?',

const TIERS = ['bronze','silver','gold'];
const nextTier  = t => TIERS[TIERS.indexOf(t) + 1] || null;
const cap       = s => s.charAt(0).toUpperCase() + s.slice(1);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.display = 'none';

  const el = document.getElementById(id);

const nameGrid = document.getElementById('name-grid');

STUDENTS.forEach(name => {

startBtn.addEventListener('click', () => {

// ══════════════════════════════════════════════════
//  SCREEN 2 — MODULE RUNNER
// ══════════════════════════════════════════════════

function startModule(moduleIndex, tier) {
  state.currentModuleIndex = moduleIndex;
  state.currentTier = tier;

  const mod = LESSON[moduleIndex];

  // v2 chrome: badge number + module title + tier-aware medal
  document.getElementById('v2-badge').textContent = moduleIndex + 1;
  document.getElementById('v2-module-title').textContent = mod.label;
  document.getElementById('v2-medal-img').src = `assets/${tier}.png?v=2`;
  document.getElementById('v2-medal-img').alt = `${cap(tier)} tier`;

  // v2 chrome: student name + tier, shown in the qlabel slot
  // qlabel text is now set per-module (short instruction or live question
  // progress) inside each renderer — see MODULE_REGISTRY. Clear it here so
  // stale text doesn't linger from the previous module.
  document.getElementById('v2-qlabel').textContent = '';

  // v2 chrome: overall lesson progress (modules fully complete / total)
  const doneCount = state.results.filter(r => r.complete).length;
  document.getElementById('v2-prog-fill').style.width = Math.round((doneCount / LESSON.length) * 100) + '%';

  showScreen('screen-module');

  // Render module
  const container = document.getElementById('module-container');
  container.innerHTML = '';
  document.getElementById('gr-overlay').style.display = 'none';

  const renderer = MODULE_REGISTRY[mod.type];
  if (!renderer) {
    container.innerHTML = `<p style="color:var(--text-dim);padding:32px 0;text-align:center">Module type "${mod.type}" not registered.</p>`;
    return;
  }

  // Every module now uses a per-tier pool: { pick, items: [...], ...mode? }.
  // No more shared-across-tiers special-casing needed (Nick's call: pools
  // shouldn't be shared across tiers since difficulty differs per tier).
  renderer.render(container, mod.data[tier], tier, score => {
    handleTierResult(moduleIndex, tier, score);
  });

  // Illustration "slides down" to clear whatever height this module's
  // content actually renders at, and stays live via MutationObserver for
  // any later content change within the same module (multi-question
  // sessions, retries, etc.) without each renderer needing to know about it.
  watchModuleContentForSceneReposition();
}

// ══════════════════════════════════════════════════
//  TIER RESULT HANDLER
// ══════════════════════════════════════════════════

function handleTierResult(moduleIndex, tier, score) {
  const passed = score >= PASS_THRESHOLD;
  state.results[moduleIndex][tier] = { score, passed };

  const pct      = Math.round(score * 100);
  const tierName = cap(tier);
  const next     = nextTier(tier);

  const stars   = pct === 100 ? 3 : pct >= 60 ? 2 : pct > 0 ? 1 : 0;
  const starStr = '⭐'.repeat(stars) + '✩'.repeat(3 - stars);
  document.getElementById('result-icon').textContent  = starStr;
  document.getElementById('result-title').textContent = passed ? `${tierName} passed!` : `${tierName} — try again`;
  document.getElementById('result-score').innerHTML   = pct === 100 ? 'Perfect!' : `${pct}% correct`;

  const ctaBtn = document.getElementById('result-cta');
  const secBtn = document.getElementById('result-secondary');
  secBtn.style.display = 'none';

  if (passed && next) {
    // Unlock next tier
    document.getElementById('result-msg').innerHTML =
      `Great work! <strong>${cap(next)}</strong> is now unlocked.`;
    ctaBtn.textContent = `Try ${cap(next)} →`;
    ctaBtn.onclick = () => startModule(moduleIndex, next);

  } else if (passed && !next) {
    // Gold passed → module complete
    state.results[moduleIndex].complete = true;
    const nextMod = moduleIndex + 1;

    if (nextMod < LESSON.length) {
      document.getElementById('result-msg').innerHTML =
        `<strong>Module complete!</strong> Moving to the next exercise.`;
      ctaBtn.textContent = 'Next module →';
      ctaBtn.onclick = () => startModule(nextMod, 'bronze');
    } else {
      document.getElementById('result-msg').innerHTML =
        `<strong>All done!</strong> You've completed every module.`;
      ctaBtn.textContent = 'See my results →';
      ctaBtn.onclick = () => showEndScreen();
    }

  } else {
    // Failed
    document.getElementById('result-msg').innerHTML =
      `You need <strong>${Math.round(PASS_THRESHOLD * 100)}%</strong> to unlock the next level. You can do it!`;
    ctaBtn.textContent = `↩ Try ${tierName} again`;
    ctaBtn.onclick = () => startModule(moduleIndex, tier);
  }

  showScreen('screen-tier-result');
}

// ══════════════════════════════════════════════════
//  SCREEN 4 — END SCREEN
// ══════════════════════════════════════════════════

function showEndScreen() {
  document.getElementById('end-name').textContent = state.student;

  // Overall score: highest-tier score per module, averaged
  let total = 0;
  state.results.forEach(r => {
    for (const t of ['gold','silver','bronze']) {
      if (r[t].score !== null) { total += r[t].score; break; }
    }
  });
  const overallPct = Math.round((total / LESSON.length) * 100);
  document.getElementById('end-total').innerHTML = `Overall score: <span>${overallPct}%</span>`;

  const summaryList = document.getElementById('summary-list');
  summaryList.innerHTML = '';
  let hasIncomplete = false;

  LESSON.forEach((mod, i) => {
    const r = state.results[i];
    if (!r.complete) hasIncomplete = true;

    let highestTier = null, highestScore = null;
    for (const t of ['gold','silver','bronze']) {
      if (r[t].score !== null) { highestTier = t; highestScore = r[t].score; break; }
    }

    const item = document.createElement('div');
    item.className = 'summary-item';
    item.innerHTML = `
      <div>
        <div class="summary-item-label">${mod.label}</div>
        <div class="summary-item-detail">${
          highestScore !== null
            ? `${cap(highestTier)} · ${Math.round(highestScore * 100)}%`
            : 'Not attempted'
        }</div>
      </div>
      <div class="summary-status ${r.complete ? 'complete' : 'incomplete'}">
        ${r.complete ? '✓ Done' : 'Retry'}
      </div>
    `;
    summaryList.appendChild(item);
  });

  const retryBtn = document.getElementById('retry-btn');
  retryBtn.style.display = hasIncomplete ? 'block' : 'none';
  retryBtn.onclick = retryFailed;

  document.getElementById('done-btn').onclick = () => {
    resetAll();
    showScreen('screen-name');
  };

  showScreen('screen-end');
}

function retryFailed() {
  const idx = state.results.findIndex(r => !r.complete);
  if (idx === -1) { showEndScreen(); return; }
  const r = state.results[idx];
  const tier = r.silver.passed ? 'gold' : r.bronze.passed ? 'silver' : 'bronze';
  startModule(idx, tier);
}

function resetAll() {
  state.student = null;
  state.results = buildResults();
  document.querySelectorAll('.name-btn').forEach(b => b.classList.remove('selected'));
  startBtn.classList.remove('ready');
}

// ══════════════════════════════════════════════════
//  MODULE REGISTRY
//  Contract: render(container, data, tier, onComplete)
//  onComplete(score)  score = 0–1
// ══════════════════════════════════════════════════

// Render ID — incremented on every render call.
// All async callbacks (onend, setTimeout) check this before acting
// so stale callbacks from a previous render can never fire into a new one.
let _audioRID = 0;

// ══════════════════════════════════════════════════
//  SHARED UTILITIES
//  speak(), speakThenSentence(), safeShuffle(),
//  showReinforcePanel() — used by new module types
// ══════════════════════════════════════════════════

const TTS = window.speechSynthesis || null;

const SPEAK_MOODS = {
  neutral:   { rate:0.85, pitch:1.0,  volume:0.9 },
  wrong:     { rate:0.80, pitch:0.9,  volume:0.8 },
  celebrate: { rate:1.15, pitch:1.55, volume:1.0 },
  slow:      { rate:0.80, pitch:1.0,  volume:0.9 },
};

// onEnd (optional) fires once playback genuinely finishes, whichever path
// (audioFile or TTS) actually played. Added for modules that need to gate
// an action on "audio has finished" (e.g. Listen & Choose unlocking
// options only after the student has listened) — existing callers that
// don't pass onEnd are unaffected.
function speak(text, mood='neutral', delay=0, audioFile=null, onEnd=null) {
  setTimeout(() => {
    if (audioFile) {
      const a = new Audio(audioFile);
      a.onended = () => { if (onEnd) onEnd(); };
      a.onerror = () => speakViaTTS(text, mood, onEnd); // missing/broken file — fall back, never go silent
      a.play().catch(() => speakViaTTS(text, mood, onEnd));
      return;
    }
    speakViaTTS(text, mood, onEnd);
  }, delay);
}

function speakViaTTS(text, mood='neutral', onEnd=null) {
  if (!TTS) { if (onEnd) onEnd(); return; }
  TTS.cancel();
  let u;
  try { u = new SpeechSynthesisUtterance(text); } catch(e) { if (onEnd) onEnd(); return; }
  const m = SPEAK_MOODS[mood];
  u.rate = m.rate; u.pitch = m.pitch; u.volume = m.volume;
  u.onend = () => { if (onEnd) onEnd(); };
  TTS.speak(u);
}

function speakThenSentence(word, sentence, wordMood='celebrate', wordAudioFile=null, sentenceAudioFile=null) {
  const playSentencePart = () => {
    setTimeout(() => {
      if (sentenceAudioFile) {
        const a = new Audio(sentenceAudioFile);
        a.onerror = () => speakViaTTS(sentence, 'neutral');
        a.play().catch(() => speakViaTTS(sentence, 'neutral'));
      } else {
        speakViaTTS(sentence, 'neutral');
      }
    }, 400);
  };

  if (wordAudioFile) {
    const wa = new Audio(wordAudioFile);
    let done = false;
    const advance = () => { if (done) return; done = true; playSentencePart(); };
    wa.onended = advance;
    wa.onerror = () => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); };
    wa.play().catch(() => { done = true; speakWordThenSentenceViaTTS(word, sentence, wordMood); });
    // No reliable duration fallback for a file we haven't loaded yet — onended covers the
    // normal case; onerror/play() rejection covers the broken-file case.
    return;
  }
  speakWordThenSentenceViaTTS(word, sentence, wordMood);
}

function speakWordThenSentenceViaTTS(word, sentence, wordMood='celebrate') {
  if (!TTS) return;
  TTS.cancel();
  let wu;
  try { wu = new SpeechSynthesisUtterance(word); } catch(e) { return; }
  const wm = SPEAK_MOODS[wordMood];
  wu.rate = wm.rate; wu.pitch = wm.pitch; wu.volume = wm.volume;
  let done = false;
  const playSentence = () => {
    if (done) return; done = true;
    setTimeout(() => {
      if (!TTS) return;
      let su;
      try { su = new SpeechSynthesisUtterance(sentence); } catch(e) { return; }
      const nm = SPEAK_MOODS['neutral'];
      su.rate = nm.rate; su.pitch = nm.pitch; su.volume = nm.volume;
      TTS.speak(su);
    }, 400);
  };
  wu.onend = playSentence;
  const fallback = Math.max(1200, (word.length / wu.rate) * 120) + 600;
  setTimeout(playSentence, fallback);
  TTS.speak(wu);
}

// Never returns a shuffled array that satisfies badFn (e.g. same order as input)
function safeShuffle(arr, badFn, maxAttempts=20) {
  const sh = a => [...a].sort(() => Math.random() - .5);
  let result = sh(arr), attempts = 0;
  while (badFn(result) && attempts++ < maxAttempts) result = sh(arr);
  return result;
}

// Shared reinforcement panel — slides up, shows emoji/word/sentence, auto-closes
const MIN_READ_MS   = 3500;
const READ_PAUSE_MS = 1800;

function showReinforcePanel(item, onClose) {
  const plain = item.sentence.replace(/<[^>]+>/g, '');
  const panel = document.getElementById('reinforce-panel');
  const bar   = document.getElementById('rp-bar');

  document.getElementById('rp-em').innerHTML = item.image
    ? `<img src="${item.image}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;" alt="${item.word}">`
    : item.emoji;
  document.getElementById('rp-word').textContent = item.word;
  document.getElementById('rp-sent').innerHTML   = item.sentence;

  panel.style.transform = 'translateY(0)';

  const wordMs  = Math.max(800,  (item.word.length / SPEAK_MOODS.celebrate.rate) * 120);
  const sentMs  = Math.max(1500, (plain.length      / SPEAK_MOODS.neutral.rate)  * 60);
  const panelMs = Math.max(MIN_READ_MS, wordMs + 400 + sentMs + READ_PAUSE_MS);

  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${panelMs}ms linear`;
    bar.style.width = '100%';
  }));

  speakThenSentence(item.word, plain, 'celebrate', item.audioFile, item.sentenceAudioFile);

  setTimeout(() => {
    panel.style.transform = 'translateY(100%)';
    bar.style.transition = 'none'; bar.style.width = '0%';
    if (onClose) onClose();
  }, panelMs);
}

// ══════════════════════════════════════════════════
//  SCENE REPOSITIONING — illustration "slides down" to clear content
//  The frame uses a fixed aspect-ratio box (matching bg_and_border.png/
//  frame_mask.png), so the illustration can't rely on normal document
//  flow to avoid overlapping tall module content. Instead, after every
//  content change, measure the flowzone's actual rendered bottom edge
//  and move .layer-scene down to clear it. Its original design position
//  (51.47%) is the floor — it never moves *up* past that. If content is
//  tall enough to push the illustration mostly off-frame, fade it out
//  rather than showing an awkward sliver.
// ══════════════════════════════════════════════════
const SCENE_DEFAULT_TOP = 51.47;
let _sceneObserver = null;

function repositionSceneLayer() {
  const flowzone = document.getElementById('module-container');
  const scene = document.querySelector('.layer-scene');
  const appFrame = document.querySelector('.app-frame');
  if (!flowzone || !scene || !appFrame) return;

  const frameRect = appFrame.getBoundingClientRect();
  const flowRect = flowzone.getBoundingClientRect();
  if (frameRect.height === 0) return;

  const contentBottomPct = ((flowRect.bottom - frameRect.top) / frameRect.height) * 100;
  const GAP_PCT = 2; // breathing room below content before the illustration starts
  const newTop = Math.max(SCENE_DEFAULT_TOP, contentBottomPct + GAP_PCT);

  scene.style.top = newTop + '%';
  // Fade out once less than ~8% of the frame's height is left for it to show in
  scene.style.opacity = (100 - newTop) < 8 ? '0' : '1';
}

function watchModuleContentForSceneReposition() {
  const flowzone = document.getElementById('module-container');
  if (!flowzone) return;
  if (_sceneObserver) _sceneObserver.disconnect();
  _sceneObserver = new MutationObserver(() => repositionSceneLayer());
  _sceneObserver.observe(flowzone, { childList: true, subtree: true, characterData: true });
  repositionSceneLayer();
}

// ══════════════════════════════════════════════════
//  GRAMMAR-COLOR REINFORCEMENT — shared by gap-fill & true-false
//  NEW in this shell (SHELL_MERGE_SPEC.md). Token fields are
//  `t` (text) / `r` (role), matching the real published data shape —
//  NOT `text`/`role` as seen in the standalone module-demos files.
// ══════════════════════════════════════════════════
const GRAMMAR_COLORS = {
  subject: { bg: 'rgba(0,188,212,0.18)',  border: '#00BCD4', color: '#00BCD4' },
  verb:    { bg: 'rgba(139,195,74,0.18)', border: '#8BC34A', color: '#8BC34A' },
  object:  { bg: 'rgba(255,152,0,0.18)',  border: '#FF9800', color: '#FFB74D' },
  place:   { bg: 'rgba(171,71,188,0.18)', border: '#AB47BC', color: '#CE93D8' },
  time:    { bg: 'rgba(233,30,99,0.18)',  border: '#E91E63', color: '#F48FB1' }
};
const GRAMMAR_FADED = {
  subject: { dot: '#1A6070', text: '#3A7A8A' },
  verb:    { dot: '#3A5C22', text: '#4A7030' },
  object:  { dot: '#6A4008', text: '#7A5010' },
  place:   { dot: '#4A2058', text: '#5A3068' },
  time:    { dot: '#6A1030', text: '#7A2040' }
};
function grammarSentence(tokens) {
  return (tokens || []).map(tok => {
    const c = GRAMMAR_COLORS[tok.r];
    if (!c) return `<span style="color:#fff;">${tok.t}</span>`;
    return `<span style="display:inline-block;background:${c.bg};border:1.5px solid ${c.border};color:${c.color};border-radius:999px;padding:0px 9px;margin:1px 2px;font-weight:600;font-size:.85em;line-height:1.6;">${tok.t}</span>`;
  }).join(' ');
}
function grammarLegend(tokens) {
  const ORDER = ['subject', 'verb', 'object', 'place', 'time'];
  const present = {};
  (tokens || []).forEach(tok => { present[tok.r] = true; });
  const roles = ORDER.filter(r => present[r] && GRAMMAR_FADED[r]);
  if (roles.length === 0) return '';
  const pills = roles.map(role => {
    const c = GRAMMAR_FADED[role];
    return `<span style="display:inline-flex;align-items:center;gap:4px;color:${c.text};font-size:11px;font-weight:600;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${c.dot};flex-shrink:0;"></span>${role.charAt(0).toUpperCase()+role.slice(1)}</span>`;
  }).join('');
  return `<div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;">${pills}</div>`;
}
// Shows the grammar-colored full sentence + speaks it, then calls onContinue
// when the student taps Continue. Used only after a CORRECT answer.
function showGrammarReinforce(tokens, plainSentence, onContinue) {
  const overlay = document.getElementById('gr-overlay');
  document.getElementById('gr-sentence').innerHTML = grammarSentence(tokens);
  document.getElementById('gr-legend').innerHTML = grammarLegend(tokens);
  overlay.style.display = 'flex';
  speak(plainSentence, 'neutral', 200);
  const btn = document.getElementById('gr-continue-btn');
  btn.onclick = () => {

const MODULE_REGISTRY = {

  // ─────────────────────────────────────────────
  //  LISTEN & CHOOSE

  'audio-understanding': {

          <button class="lc-listen-btn-v2" id="lc-listen-btn">

  // ─────────────────────────────────────────────

  // ─────────────────────────────────────────────
  'gap-fill': {
    // v2 design: pool-based. Each tier is { pick, items: [...] } — a separate
    // pool per tier (per Nick's decision: difficulty differs per tier, so
    // pools shouldn't be shared across tiers). Draws `pick` items, runs each
    // with retry-until-correct scoring (first-try=1, retry-then-correct=0.6),
    // then averages across the session for the tier's overall score.
    render(container, data, tier, onComplete) {
      const { pick, items } = data;
      const session = safeShuffle(items, () => false).slice(0, Math.min(pick, items.length));
      let idx = 0, totalScore = 0;

      const PALETTE = [
        { border:'#00BCD4', bg:'rgba(0,188,212,.18)',  color:'#4DD0E1' },
        { border:'#AB47BC', bg:'rgba(171,71,188,.18)', color:'#CE93D8' },
        { border:'#FF9800', bg:'rgba(255,152,0,.18)',  color:'#FFB74D' },
        { border:'#E91E63', bg:'rgba(233,30,99,.18)',  color:'#F48FB1' },
        { border:'#8BC34A', bg:'rgba(139,195,74,.18)', color:'#AED581' }
      ];

      function renderQuestion() {
        const { sentence, options, answer, tokens } = session[idx];

        const checkBtn = container.querySelector('#gf-check-btn');
        const statusEl = container.querySelector('#gf-status');

        options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'gf-pill';
          btn.textContent = opt;
          btn.dataset.word = opt;
          const c = PALETTE[i % PALETTE.length];
          btn.addEventListener('click', () => {
            if (locked) return;
            pillRow.querySelectorAll('.gf-pill').forEach(x => {
              x.classList.remove('selected');

        checkBtn.addEventListener('click', () => {

            statusEl.textContent = attemptedWrong ? 'correct, nice recovery' : 'correct, first try';

              showGrammarReinforce(tokens, plain, () => {
                idx++;
                if (idx < session.length) renderQuestion();

  // ─────────────────────────────────────────────

    render(container, data, tier, onComplete) {
