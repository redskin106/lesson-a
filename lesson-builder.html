type})`;\n    opt.style.background = '#0D1B2A';\n    opt.style.color = '#fff';\n    moduleSelect.appendChild(opt);\n  });\n\n  // Auto-pick the first student so audio/name display works without\n  // clicking through the name picker.\n  state.student = STUDENTS[0];\n  state.results = buildResults();\n\n  function jump() {\n    startModule(Number(moduleSelect.value), tierSelect.value);\n  }\n  moduleSelect.addEventListener('change', jump);\n  tierSelect.addEventListener('change', jump);\n\n  // Read initial state from URL if provided (?module=<index>&tier=bronze)\n  const params = new URLSearchParams(location.search);\n  const initialModule = params.get('module');\n  const initialTier = params.get('tier');\n  if (initialModule !== null && LESSON[initialModule]) moduleSelect.value = initialModule;\n  if (initialTier) tierSelect.value = initialTier;\n\n  jump();\n})();\n<\/script>\n</body>\n</html>\n";

function buildPublishedLessonHTML(lessonId, pushedAudioIds){
  const lesson = LESSONS.find(l => l.id === lessonId);
  const modules = transformLessonForPublish(lessonId, pushedAudioIds);
  let html = SHELL_TEMPLATE;

  // Swap the placeholder LESSON data for this lesson's real content. JSON is valid JS array/object
  // syntax, so JSON.stringify's output drops in as a working `const LESSON = [...]` literal as-is.
  const lessonJson = JSON.stringify(modules, null, 2);
  const lessonBlockPattern = /const LESSON = \[[\s\S]*?\n\];/;
  if(!lessonBlockPattern.test(html)){
    throw new Error('Could not find "const LESSON = [...]" in the shell template — publish aborted rather than guess.');
  }
  html = html.replace(lessonBlockPattern, `const LESSON = ${lessonJson};`);

  // Scopes this lesson's recordings/tierResults in the student's local
  // progress database so two different published lessons never collide —
  // without this every lesson would share the debug placeholder ID.
  const lessonIdPattern = /const LESSON_ID = ['"][^'"]*['"];/;
  if(lessonIdPattern.test(html)){
    html = html.replace(lessonIdPattern, `const LESSON_ID = ${JSON.stringify(lessonId)};`);
  }

  // Cosmetic but worth doing while we're in here — the template's generic placeholder title.
  html = html.replace('<title>EFL Lesson</title>', `<title>${lesson.name}</title>`);
  html = html.replace('<p class="welcome-label">EFL Lesson</p>', `<p class="welcome-label">${lesson.name}</p>`);

  // Real bug, found by Nick actually testing a published lesson: SHELL_TEMPLATE's own asset
  // references ('assets/bg_and_border.png', 'assets/star.png', etc.) are bare relative paths that
  // correctly resolve when the file lives at shell-v2/lesson-shell-v2.html (one folder deep from
  // the images at shell-v2/assets/). A PUBLISHED lesson lives at lessons/{id}/index.html — two
  // folders deep — so those same bare paths silently resolved to the wrong, nonexistent location
  // (lessons/{id}/assets/...) and every image failed to load. Rewriting to an absolute,
  // publish-depth-independent path using the real repo name.
  const [, repoName] = (GH_CREDS.repo || '').split('/');
  if(repoName){
    html = html.replace(/(['"`])assets\//g, `$1/${repoName}/shell-v2/assets/`);
  }

  return html;
}

let publishGhState = {};
let publishLastError = null;

async function ghApiRequest(method, path, body){
  const res = await fetch(`https://api.github.com/repos/${GH_CREDS.repo}${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${GH_CREDS.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok){
    let detail = '';
    try{ const err = await res.json(); detail = err.message || ''; }catch(e){}
    throw new Error(`GitHub ${res.status}${detail ? ': '+detail : ''}`);
  }
  return res.json();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function ghPagesUrl(lessonId){
  const [owner, repo] = (GH_CREDS.repo || '').split('/');
  if(!owner || !repo) return '';
  return `https://${owner}.github.io/${repo}/lessons/${lessonId}/`;
}

// Each of these does ONE real step and stashes what the next step needs in
// publishGhState — lets the existing per-step UI stay meaningful instead of
// bundling everything into a single opaque call.
async function ghStep_readRef(){
  const ref = await ghApiRequest('GET', `/git/ref/heads/${GH_CREDS.branch}`);
  publishGhState.baseCommitSha = ref.object.sha;
  const baseCommit = await ghApiRequest('GET', `/git/commits/${publishGhState.baseCommitSha}`);
  publishGhState.baseTreeSha = baseCommit.tree.sha;
}

// Reads lessons/{lessonId}/manifest.json — the SAME file the TTS tool writes on push — so
// anything that needs to know "what audio is actually live" (publish's atomic push, and the
// pre-publish check below) shares one ground-truth source instead of two separate guesses.
// A 404 just means no audio has been pushed for this lesson yet — a normal state, not an error.
async function fetchPushedAudioIds(lessonId){
  const path = `lessons/${lessonId}/manifest.json`;
  const res = await fetch(`https://api.github.com/repos/${GH_CREDS.repo}/contents/${path}`, {
    headers: { 'Authorization': `Bearer ${GH_CREDS.token}`, 'Accept': 'application/vnd.github+json' }
  });
  if(res.status === 404) return new Set();
  if(!res.ok) throw new Error(`GitHub ${res.status} reading audio manifest`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  let manifest;
  try{ manifest = JSON.parse(content); }
  catch(e){ throw new Error('Audio manifest.json exists but is not valid JSON — publish aborted rather than guess.'); }
  return new Set((manifest.assets || []).filter(a => a.status === 'pushed').map(a => a.id));
}

async function ghStep_readAudioManifest(lessonId){
  publishGhState.pushedAudioIds = await fetchPushedAudioIds(lessonId);
}

// Ground-truth version of the old LIVE_FLAGS-based check — diffs the lesson's actual speakable
// lines (extractSpeakableForTTS, which excludes putinorder/wordmatch — re-verified as genuinely
// silent, not just carried forward from a stale claim; gapfill and truefalse were both wrongly
// excluded here too, now fixed)
// GitHub credentials to check for real; if none are set, returns null so the caller can decide
// how to degrade rather than silently lying with a fake "all clear".
async function getFullAudioStatusForLesson(lessonId){
  if(!GH_CREDS.token) return null;
  const pushed = await fetchPushedAudioIds(lessonId);
  const speakable = extractSpeakableForTTS(lessonId);
  return speakable.map(item => {
    const [instId, ...rest] = item.id.split('.');
    return { text: item.text, module: instanceLabel(instId), tier: rest[0] || '', key: item.id, pushed: pushed.has(item.id) };
  });
}

async function ghStep_buildUpdate(lessonId){
  const lesson = LESSONS.find(l => l.id === lessonId);
  const modules = transformLessonForPublish(lessonId, publishGhState.pushedAudioIds);

  // The real student-facing page — the shell template with this lesson's content baked in,
  // including audioFile references for any lines with real generated audio already pushed.
  const htmlPath = `lessons/${lessonId}/index.html`;
  const html = buildPublishedLessonHTML(lessonId, publishGhState.pushedAudioIds);
  const htmlB64 = btoa(unescape(encodeURIComponent(html)));
  const htmlBlob = await ghApiRequest('POST', '/git/blobs', { content: htmlB64, encoding: 'base64' });

  // A plain-JSON copy alongside it — cheap to include, useful for debugging/inspection without
  // having to read the whole HTML file, and it's what "Preview production JSON" already shows you.
  const jsonPath = `lessons/${lessonId}/content.json`;
  const jsonContent = JSON.stringify({ lessonId, lessonName: lesson.name, publishedAt: new Date().toISOString(), modules }, null, 2);
  const jsonB64 = btoa(unescape(encodeURIComponent(jsonContent)));
  const jsonBlob = await ghApiRequest('POST', '/git/blobs', { content: jsonB64, encoding: 'base64' });

  const tree = await ghApiRequest('POST', '/git/trees', {
    base_tree: publishGhState.baseTreeSha,
    tree: [
      { path: htmlPath, mode:'100644', type:'blob', sha: htmlBlob.sha },
      { path: jsonPath, mode:'100644', type:'blob', sha: jsonBlob.sha },
    ],
  });
  publishGhState.treeSha = tree.sha;
  publishGhState.htmlPath = htmlPath;
  publishGhState.jsonPath = jsonPath;
}

async function ghStep_createCommit(lessonId){
  const commit = await ghApiRequest('POST', '/git/commits', {
    message: `Publish lesson content: ${lessonId}`,
    tree: publishGhState.treeSha,
    parents: [publishGhState.baseCommitSha],
  });
  publishGhState.commitSha = commit.sha;
}

async function ghStep_atomicSwitch(){
  // The one moment anything actually goes live. Every step before this only touched
  // unreferenced git objects — a failure at or before this point leaves the live
  // branch completely untouched, safe to retry with zero side effects.
  await ghApiRequest('PATCH', `/git/refs/heads/${GH_CREDS.branch}`, { sha: publishGhState.commitSha });
}

async function runPublishStep(i){
  if(i >= publishSteps.length){
    publishState = 'done';
    markPublishTargetLive();
    renderPublishModal();
    return;
  }
  publishSteps[i].status = 'active';
  renderPublishModal();

  const step = publishSteps[i];
  const isRealLessonPush = publishKind === 'lesson';

  try{
    if(i === publishForceFailAt){
      await sleep(350);
      throw new Error('Simulated failure (testing hook)');
    }

    if(isRealLessonPush && step.isReadRef){
      await ghStep_readRef();
    } else if(isRealLessonPush && step.isReadAudioManifest){
      await ghStep_readAudioManifest(publishLessonId);
    } else if(isRealLessonPush && step.isBuildUpdate){
      await ghStep_buildUpdate(publishLessonId);
    } else if(isRealLessonPush && step.isCreateCommit){
      await ghStep_createCommit(publishLessonId);
    } else if(isRealLessonPush && step.isAtomicSwitch){
      await ghStep_atomicSwitch();
    } else {
      // Non-network steps for the real lesson path (per-module "preparing" pacing —
      // the content itself is already computed synchronously by the transform, there's
      // genuinely nothing to await here) and every step of the still-simulated asset
      // publish path, unchanged.
      await sleep(350);
    }

    publishSteps[i].status = 'done';
    renderPublishModal();
    runPublishStep(i+1);
  } catch(err){
    publishSteps[i].status = 'failed';
    publishLastError = err.message;
    // For a real push, PATCH-the-ref is genuinely atomic — it either lands or it doesn't,
    // there's no partial state. So "failed after switch" can't happen here; it's kept only
    // for the still-simulated asset path below, where it represents a different real thing
    // (a Pages build lagging after a successful switch), not an actual write failure.
    const switchIndex = publishSteps.findIndex(s => s.isAtomicSwitch);
    const pastSwitch = !isRealLessonPush && i > switchIndex;
    publishState = pastSwitch ? 'failed-after-switch' : 'failed-safe';
    if(pastSwitch) markPublishTargetLive();
    renderPublishModal();
  }
}

function retryPublish(){
  publishForceFailAt = -1; // a real retry wouldn't hit the same injected test failure twice
  if(publishKind === 'assets') beginAssetPublishSequence();
  else beginPublishSequence();
}



// ==========================================================================
// ---- Persistence layer (v1) ----
// Implements the settled design from persistence-layer-spec.md:
//   - Drafts autosave to the browser's own localStorage, no account, no server.
//   - "Export lesson" / "Import lesson" cover the occasional sharing case.
// This does NOT yet implement the GitHub Action publish step from the spec —
// "Publish lesson" below still runs the simulated publish sequence. Swapping
// that simulation for a real trigger call is separate, later work.
// ==========================================================================

const PERSIST_KEY = 'lessonBuilder.draftState.v1';
const PERSIST_DEBOUNCE_MS = 1200;
let persistSaveTimer = null;
let persistLastSavedAt = null;

// Everything a reload needs to reconstruct exactly where you left off.
function collectPersistedState(){
  return {
    schemaVersion: 1,
    savedAt: new Date().toISOString(),
    LESSONS,
    LESSON_CONTENT,
    AUDIO_RECORDED,
    WORD_BANK,
    wordBankSeeded,
    bankIdCounter,
    FIXED_ASSETS: FIXED_ASSETS.map(a => ({ id:a.id, version:a.version, pending:a.pending })),
    currentLessonId,
    currentModule,
    currentTier,
  };
}

function saveStateNow(){
  try{
    localStorage.setItem(PERSIST_KEY, JSON.stringify(collectPersistedState()));
    persistLastSavedAt = new Date();
    updateSaveIndicator();
  } catch(e){
    // Most likely a quota issue (localStorage is small, ~5MB). Surfacing this
    // beats failing silently — a teacher should know a draft isn't landing.
    console.error('Autosave failed:', e);
    updateSaveIndicator(true);
  }
}

// Debounced entry point — call this from every input/change handler that
// mutates lesson data. Matches the spec's "the moment you type" intent
// without hammering localStorage on every keystroke.
function scheduleSave(){
  updateSaveIndicator('pending');
  clearTimeout(persistSaveTimer);
  persistSaveTimer = setTimeout(saveStateNow, PERSIST_DEBOUNCE_MS);
}

function updateSaveIndicator(state){
  const el = document.querySelector('.save-state');
  if(!el) return;
  if(state === true){ el.textContent = 'Autosave failed — export a backup'; el.style.color = 'var(--pink)'; return; }
  el.style.color = '';
  if(state === 'pending'){ el.textContent = 'Saving…'; return; }
  el.textContent = 'Saved just now';
}

// Returns true if a saved draft was found and restored.
function loadPersistedState(){
  let raw;
  try{ raw = localStorage.getItem(PERSIST_KEY); } catch(e){ return false; }
  if(!raw) return false;
  let saved;
  try{ saved = JSON.parse(raw); } catch(e){ console.error('Saved draft was corrupt, ignoring it:', e); return false; }
  if(!saved || saved.schemaVersion !== 1) return false;

  // LESSONS / LESSON_CONTENT / AUDIO_RECORDED / FIXED_ASSETS are declared
  // `const` — restore by mutating in place rather than reassigning.
  LESSONS.length = 0;
  (saved.LESSONS || []).forEach(l => LESSONS.push(l));

  Object.keys(LESSON_CONTENT).forEach(k => delete LESSON_CONTENT[k]);
  Object.assign(LESSON_CONTENT, saved.LESSON_CONTENT || {});

  Object.keys(AUDIO_RECORDED).forEach(k => delete AUDIO_RECORDED[k]);
  Object.assign(AUDIO_RECORDED, saved.AUDIO_RECORDED || {});

  WORD_BANK = saved.WORD_BANK || [];
  wordBankSeeded = !!saved.wordBankSeeded;
  bankIdCounter = saved.bankIdCounter || 1;

  (saved.FIXED_ASSETS || saved.SHARED_ASSETS || []).forEach(sa => {
    const asset = FIXED_ASSETS.find(a => a.id === sa.id);
    if(asset){ asset.version = sa.version; asset.pending = sa.pending; }
  });

  if(saved.currentLessonId && LESSONS.some(l => l.id === saved.currentLessonId)){
    currentLessonId = saved.currentLessonId;
    const restoredLesson = LESSONS.find(l => l.id === currentLessonId);
    // Only trust the saved module if it's actually still part of this lesson —
    // a mismatch here (stale reference, lesson edited since last save, etc.)
    // would otherwise crash renderMain() immediately on load, before any
    // user action, trying to read data for a module the lesson doesn't have.
    currentModule = (saved.currentModule && restoredLesson.modules.includes(saved.currentModule))
      ? saved.currentModule
      : (restoredLesson.modules[0] || 'gapfill');
    currentTier = saved.currentTier || 'bronze';
  }
  persistLastSavedAt = new Date(saved.savedAt);
  return true;
}

function clearPersistedState(){
  if(!confirm('This clears your saved draft from this browser and reloads the original demo content. This cannot be undone. Continue?')) return;
  try{ localStorage.removeItem(PERSIST_KEY); } catch(e){}
  location.reload();
}

// ---- Export / Import — the "occasional sharing with Sophy" path from the spec ----

function exportCurrentLesson(){
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  if(!lesson) return;
  ensureLessonContent(lesson.id);
  ensureAudioRecorded(lesson.id);
  const payload = {
    schemaVersion: 1,
    exportedAt: new Date().toISOString(),
    lesson,
    content: LESSON_CONTENT[lesson.id],
    audio: AUDIO_RECORDED[lesson.id] || {},
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = (lesson.name || 'lesson').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  a.href = url;
  a.download = `${slug || 'lesson'}-export.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function triggerImportLesson(){
  document.getElementById('importLessonInput').click();
}

function importLessonFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ alert('That file isn\'t valid lesson export JSON.'); input.value = ''; return; }

    if(!payload || !payload.lesson || payload.schemaVersion !== 1){
      alert('That file doesn\'t look like a Lesson Builder export.');
      input.value = ''; return;
    }

    let { lesson, content, audio } = payload;
    // Never silently collide with an existing lesson id — imports always land
    // as their own lesson, even if re-importing something exported from here.
    let newId = lesson.id;
    if(LESSONS.some(l => l.id === newId) || !newId){
      newId = 'imported-' + Date.now();
    }
    const importedLesson = { ...lesson, id:newId, status:'draft', editedBy:'Imported', editedAgo:'just now' };
    // Backfill fields that didn't exist in older export files (e.g. an export
    // made before targetVocabulary/moduleImageAssignments existed) — same gap
    // as finishCreateLesson had, just reachable via a different path.
    if(!importedLesson.targetVocabulary) importedLesson.targetVocabulary = { bronze:[], silver:[], gold:[] };
    if(!importedLesson.moduleImageAssignments) importedLesson.moduleImageAssignments = {};
    LESSONS.unshift(importedLesson);
    LESSON_CONTENT[newId] = content || {};
    AUDIO_RECORDED[newId] = audio || {};

    input.value = '';
    saveStateNow();
    renderDashboard();
    alert(`Imported "${importedLesson.name}" as a new draft.`);
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

// ---- App init — runs last, after every function/data declaration above exists ----
function renderEditorShell(){
  const lesson = LESSONS.find(l => l.id === currentLessonId) || { name:'Untitled Lesson', status:'draft' };
  document.getElementById('editorApp').innerHTML = `
    <div class="sidebar">
      <div class="brand">Lesson Builder</div>
      <div class="lesson-name">${lesson.name}</div>
      <div class="lesson-sub">${lesson.status === 'published' ? 'Published' : 'Draft'} · edited ${lesson.editedAgo || 'just now'}</div>
      <textarea class="lesson-notes" id="lessonNotes" placeholder="Notes to keep yourself on track — theme, tone, anything you don't want to forget mid-edit…">${lesson.notes || ''}</textarea>
      <ul class="mod-list" id="modList"></ul>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="crumb">${lesson.name} / <b id="crumbMod">Gap-fill</b></div>
        <div class="actions">
          <span class="save-state">Saved just now</span>
          <button class="btn" onclick="saveStateNow()">Save draft</button>
          <button class="btn" onclick="exportCurrentLesson()">Export lesson</button>
          <button class="btn" onclick="previewProductionJSON()" title="See the exact shape the shell would receive">🔍 Preview production JSON</button>
          <button class="btn" onclick="exportForTTSTool()" title="Generate a manifest the TTS tool can import directly">🎙️ Export for TTS tool</button>
          <button class="btn" onclick="openAudioStatusModal()" title="Check which fields in this lesson still need real generated audio">🔊 Check audio status</button>
          <button class="btn" id="ghCredsBtn" onclick="openGitHubCredsModal()" title="${GH_CREDS.token ? 'Connected to '+GH_CREDS.repo : 'GitHub credentials for publishing — required before Publish can push for real'}">${GH_CREDS.token ? '🔑 GitHub ✓' : '🔑 GitHub'}</button>
          <button class="btn primary" onclick="openPublishModal()">Publish lesson</button>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-tabs" id="tierTabs"></div>
        <div style="display:flex;gap:8px;">
          <button class="copy-tier-btn" id="copyTierBtn" onclick="copyFromBronze()" style="display:none;"></button>
          <button class="compare-btn" id="compareBtn" onclick="toggleCompare()">⇄ Compare all 3 tiers</button>
        </div>
      </div>
      <div id="editView"></div>
      <div id="compareView" style="display:none;"></div>
    </div>
    <div class="preview-col">
      <div class="preview-title">Live preview — student view</div>
      <div class="phone" id="phone"></div>
      <div class="live-tag"><span class="live-dot"></span>Updates as you type</div>
      <div class="preview-note">This is exactly what a student sees on this tier — same frame, same fonts, same audio. Nothing here is a simplified stand-in.</div>
    </div>`;
  document.getElementById('lessonNotes').addEventListener('input', (e) => { lesson.notes = e.target.value; scheduleSave(); });
  renderSidebar(); renderTierTabs(); renderMain();
}

const restoredDraft = loadPersistedState();
seedWordBankFromColors(); // no-ops if a restored draft already seeded the bank
renderEditorShell();
renderDashboard();
showGlobalView('dashboard');

// Periodic autosave — the practical stand-in for true keystroke-level saving.
// Per-field autosave would mean instrumenting every one of the ~40 field-update
// functions across 12 module types; this interval plus the checkpoint saves at
// notes/create/publish/import/asset-upload gets the same real-world guarantee
// (nothing lost on a closed tab) without that sprawl. Worth revisiting if a
// true low-latency save becomes important later.
setInterval(saveStateNow, 4000);
window.addEventListener('beforeunload', saveStateNow);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveStateNow(); });
if(restoredDraft) console.log('Lesson Builder: restored a saved draft from this browser.');

</script>
</body>
</html>
