<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title><style>
:root{--ink:#1c1b2e;--mu:#6a6a7e}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#eeeef3;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1920px;height:1080px;transform-origin:center;padding:90px 110px;overflow:hidden;display:none}
.slide.on{display:block}
.ph-ENGAGE{background:radial-gradient(circle at 10% 10%,#ffd27a,transparent 50%),radial-gradient(circle at 90% 20%,#ff9fb8,transparent 50%),#fff3e4}
.ph-STUDY{background:radial-gradient(circle at 10% 10%,#b98cff,transparent 50%),radial-gradient(circle at 90% 80%,#7fd3ff,transparent 50%),#efeaff}
.ph-ACTIVATE{background:radial-gradient(circle at 10% 10%,#9fe8c4,transparent 50%),radial-gradient(circle at 90% 20%,#a8e6ff,transparent 50%),#e8fbf3}
.ph-NIGHT{background:#0b0a10;color:#f6f3ff}
.tag{position:absolute;left:110px;top:50px;font-weight:700;letter-spacing:.06em;font-size:30px;padding:10px 34px;border-radius:999px;background:#fff;border:3px solid #e4e0f3;color:#6a35e8}
h1{font-size:150px;line-height:1;font-weight:800;background:linear-gradient(90deg,#7b3cf0,#ff4fa3);-webkit-background-clip:text;color:transparent}
h2{font-size:84px;font-weight:800;margin:70px 0 30px;line-height:1.05}
.sub{font-size:48px;color:var(--mu);margin-top:30px}.NIGHT .sub{color:#a9a3cc}
.big{font-size:120px;text-align:center}
ul.l{list-style:none;padding:0;font-size:52px;line-height:1.5}ul.l li{margin:10px 0}
.card{background:rgba(255,255,255,.75);border:3px solid #fff;border-radius:48px;box-shadow:0 20px 60px rgba(80,60,160,.18);padding:36px 44px}
.row{display:flex;gap:36px;flex-wrap:wrap}.row>*{flex:1}
.pic{font-size:150px;text-align:center;line-height:1.1}.cap{font-size:42px;text-align:center;margin-top:10px}
.ph{border:4px dashed #9a95b8;border-radius:40px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;color:#6a6a7e;padding:20px}
.chip{display:inline-block;font-weight:800;color:#fff;border-radius:44px;padding:8px 34px;font-size:48px;margin:6px;background:linear-gradient(135deg,#9a5cff,#6a35e8)}
button.b{font:inherit;font-weight:700;font-size:44px;padding:16px 44px;border-radius:999px;border:3px solid #d9d3f5;background:#fff;color:#4a2bb8;cursor:pointer}
button.b:active{transform:scale(.96)}
.opt{display:block;width:100%;text-align:left;font-size:46px;padding:20px 34px;margin:14px 0;border-radius:36px;border:4px solid #d9d3f5;background:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.opt.ok{background:#c9f5df;border-color:#19b38a}.opt.no{background:#ffe0e3;border-color:#ff6b78;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.words{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0;min-height:90px}
.w{font-size:52px;font-weight:700;padding:10px 30px;border-radius:30px;background:#fff;border:4px solid #d9d3f5;cursor:pointer;font-family:inherit}
.w.used{opacity:.25;pointer-events:none}
.ans{min-height:130px;border:4px dashed #b9a6f5;border-radius:36px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:rgba(255,255,255,.6)}
.ans .w{background:linear-gradient(135deg,#9a5cff,#6a35e8);color:#fff;border-color:transparent}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:9;align-items:center}
.nav button{font:inherit;font-weight:700;font-size:15px;white-space:nowrap;padding:6px 14px;border-radius:999px;border:2px solid #cfc8ee;background:#fff;cursor:pointer}
.nav .med{border-color:transparent;color:#fff}
#pg{white-space:nowrap;font-size:14px;color:#6a6a7e;margin:0 8px}
.medal{position:absolute;right:110px;top:50px;font-size:40px;font-weight:800;padding:10px 30px;border-radius:999px;color:#fff}
.bronze{background:#b87333}.silver{background:#8a93a6}.gold{background:#e0a800}
.mu{color:var(--mu)}
.vol{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.vol .r{font-weight:800;border-radius:999px;padding:6px 40px;color:#fff;background:linear-gradient(90deg,#7b3cf0,#ff4fa3)}
table.tt{border-collapse:separate;border-spacing:10px;font-size:34px;width:100%}.tt th{background:#fff;border-radius:20px;padding:12px}.tt td{background:rgba(255,255,255,.8);border-radius:20px;padding:14px;text-align:center;height:100px}
.dial{border-radius:48px;padding:30px 40px;color:#fff;font-size:44px}.dial b{font-size:64px;display:block}
textarea{font:inherit;font-size:40px;width:100%;height:230px;border-radius:30px;border:4px solid #d9d3f5;padding:20px}
a.lnk{display:inline-block;font-size:56px;font-weight:800;color:#fff;background:linear-gradient(135deg,#19b38a,#2a8cf0);padding:26px 70px;border-radius:999px;text-decoration:none;margin-top:30px}
</style></head><body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">◀</button><span id="pg"></span><button onclick="go(1)">▶</button>
<span id="medbar" style="display:none;gap:6px"><button class="med bronze" onclick="setLv('bronze')">Bronze</button><button class="med silver" onclick="setLv('silver')">Silver</button><button class="med gold" onclick="setLv('gold')">Gold</button></span>
<button onclick="music()" id="mb">♪ music</button><button onclick="menu()">☰ skip</button></div><div id="menu" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(15,14,26,.92);color:#fff;overflow:auto;padding:16px"></div><div id="rot" style="display:none;position:fixed;top:0;left:0;right:0;z-index:30;background:#ffb21f;padding:8px;text-align:center;font-weight:700">📱 Turn your phone sideways</div>
<script>
const D=__DATA__;
const S=D.slides;let cur=0,lv='silver';const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const stage=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1920,(innerHeight-(innerWidth<700?46:60))/1080);document.querySelectorAll('.slide').forEach(s=>s.style.transform='scale('+k+')')}
addEventListener('resize',fit);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
// ---------- tiny audio: music placeholder (ambient pad) + tick ----------
let ac,pad;function music(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(pad){pad.forEach(o=>o.stop());pad=null;document.getElementById('mb').style.opacity=1;return}
 const g=ac.createGain();g.gain.value=.04;g.connect(ac.destination);pad=[196,247,294,392].map(f=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();return o});document.getElementById('mb').style.opacity=.5}
// ---------- renderers ----------
const R={
cover:s=>`<div class="tag">${s.kicker||''}</div><div style="margin-top:210px"><h1>${s.title}</h1><div class="sub">${s.sub||''}</div></div><div style="position:absolute;right:140px;top:220px;font-size:340px">${s.pic||''}</div>`,
text:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2>${s.lines?`<ul class="l">${s.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}${s.note?`<div class="sub">${s.note}</div>`:''}`,
ladder:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="row"><div class="vol">${s.rungs.map((r,i)=>`<div class="r" style="font-size:${40+i*14}px;margin-left:${i*40}px">${r}</div>`).join('')}</div><div class="card" style="max-width:640px;font-size:44px">${s.side}</div></div>`,
frames:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="row">${s.groups.map(g=>`<div class="card"><div style="font-size:40px;font-weight:800;color:${g.c||'#6a35e8'};margin-bottom:12px">${g.t}</div>${g.l.map(x=>`<div style="font-size:${g.fs||38}px;margin:10px 0">${x}</div>`).join('')}</div>`).join('')}</div>${s.note?`<div class="sub" style="font-size:38px">${s.note}</div>`:''}`,
scene:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="row" id="sc">${s.frames.map((f,i)=>`<div class="card fr" style="opacity:.15;transition:.6s"><div class="pic">${f.pic}</div><div class="cap">${f.cap||''}</div></div>`).join('')}</div><div class="sub" style="font-size:36px">${s.note||''}</div><button class="b" style="margin-top:20px" onclick="playScene(this)">▶ play (silent)</button>`,
dials:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="row">${D.dials.map(d=>`<div class="dial" style="background:${d[2]}"><b>${d[0]} · ${d[1]}</b>${d[3]}</div>`).join('')}</div>`,
timetable:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><table class="tt"><tr><th></th>${s.days.map(d=>`<th>${d}</th>`).join('')}</tr>${s.rows.map(r=>`<tr><th>${r[0]}</th>${r[1].map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table><div class="sub" style="font-size:38px">${s.note||''}</div>`,
exercise:(s,i)=>`<div class="tag">${s.phase||'STUDY'}</div><div class="medal" id="md${i}"></div><h2 style="margin-top:60px">${s.ex.title}</h2><div class="mu" style="font-size:38px">${s.ex.hint}</div><div id="ex${i}" style="margin-top:20px"></div>`,
hunt:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><ul class="l">${s.lines.map(l=>`<li>${l}</li>`).join('')}</ul><a class="lnk" href="${s.href}" target="_blank">Open the case board ▶</a>`,
test:(s,i)=>`<div class="tag">${s.phase}</div><h2>${D.test.q}</h2><div id="tt${i}" style="max-width:1300px"></div><div id="why${i}" class="sub" style="font-size:38px"></div>`,
reveal:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="big" id="rv" style="opacity:0;transition:1s">${s.pic} ${s.answer}</div><div class="sub" id="rv2" style="opacity:0;transition:1s .8s;font-size:44px">${s.note}</div><button class="b" onclick="document.getElementById('rv').style.opacity=1;document.getElementById('rv2').style.opacity=1">Reveal</button>`,
boss:(s,i)=>`<div class="tag">OPTIONAL · BOSS</div><h2 style="margin:40px 0 10px;font-size:64px">${s.title}</h2><div style="font-size:42px;font-weight:800;margin:6px 0">${s.boss.q}</div><div style="display:flex;gap:30px;align-items:center;margin:6px 0 16px"><div style="font-size:56px;font-weight:800;min-width:90px" id="bt${i}">90</div><button class="b" onclick="bossStart(${i})">▶ start</button><button class="b" onclick="bossGive(${i})">We give up</button></div><div class="row" style="align-items:flex-start"><div class="card" style="font-size:31px;line-height:1.45;padding:22px 34px">${s.boss.text}</div><div id="bf${i}" class="card" style="display:none;font-size:27px;line-height:1.4;padding:20px 30px"><b>Free pass.</b><br>${s.boss.plain.join('<br>')}<br><br>${s.boss.simple}<br><br><b style="color:#19b38a">Answer: ${s.boss.answer}</b> Too easy? 😄</div></div>`,
handover:s=>`<div class="tag">${s.phase}</div><h2>${s.title}</h2><div class="row"><div class="card" style="font-size:40px">${s.frame}</div><div style="flex:1.2"><textarea placeholder="Write your sentences here (tablet)"></textarea><div class="mu" style="font-size:34px;margin-top:10px">${s.note||''}</div></div></div>`,
};
function build(){S.forEach((s,i)=>{const e=$(`<div class="slide ph-${s.bg||(s.phase==='BOSS'?'ENGAGE':s.phase)||'STUDY'} ${s.bg==='NIGHT'?'NIGHT':''}">${(R[s.t]||R.text)(s,i)}</div>`);stage.appendChild(e);if(s.t==='exercise')renderEx(i);if(s.t==='test')renderTest(i)});fit();show(0)}
function show(i){cur=Math.max(0,Math.min(S.length-1,i));document.querySelectorAll('.slide').forEach((e,k)=>e.classList.toggle('on',k===cur));document.getElementById('pg').textContent=(cur+1)+' / '+S.length;document.getElementById('medbar').style.display=S[cur].t==='exercise'?'flex':'none';location.hash=cur+1}
function go(d){show(cur+d)}
function ttl(s){return s.title||(s.ex&&s.ex.title)||(s.boss&&'Boss question')||s.t}
function menu(){const m=document.getElementById('menu');m.style.display='block';m.innerHTML='<div style="font-size:22px;margin-bottom:10px"><b>Jump to…</b> <button style="font:inherit;padding:6px 16px;border-radius:99px" onclick="this.parentNode.parentNode.style.display=\'none\'">close</button> &nbsp;<a style="color:#9fe8c4" href="board.html?case='+D.n+'">board</a> · <a style="color:#9fe8c4" href="team.html?case='+D.n+'">team page</a> · <a style="color:#9fe8c4" href="index.html">home</a></div>'+S.map((s,i)=>`<div onclick="show(${i});document.getElementById('menu').style.display='none'" style="font-size:24px;padding:12px 14px;margin:4px 0;border-radius:14px;background:${i===cur?'#6a35e8':'#24223f'}">${i+1}. ${ttl(s)}${s.t==='boss'?' (optional)':''}</div>`).join('')}
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70&&!/BUTTON|TEXTAREA/.test(e.target.tagName)){go(dx<0?1:-1)}},{passive:true});
function rot(){document.getElementById('rot').style.display=(innerHeight>innerWidth&&innerWidth<700)?'block':'none'}addEventListener('resize',rot);rot();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)&&!/TEXTAREA/.test(e.target.tagName)){e.preventDefault();go(1)}if(e.key==='ArrowLeft')go(-1);if(e.key==='1')setLv('bronze');if(e.key==='2')setLv('silver');if(e.key==='3')setLv('gold')});
let bt={};function bossStart(i){clearInterval(bt[i]);let n=90;const e=document.getElementById('bt'+i);e.textContent=n;bt[i]=setInterval(()=>{n--;e.textContent=n;if(n<=0){clearInterval(bt[i]);bossGive(i)}},1000)}
function bossGive(i){clearInterval(bt[i]);document.getElementById('bf'+i).style.display='block'}
function playScene(b){const fr=b.parentElement.querySelectorAll('.fr');fr.forEach((f,i)=>{f.style.opacity=.15;setTimeout(()=>f.style.opacity=1,900*(i+1))})}
// ---------- exercises ----------
function setLv(l){lv=l;S.forEach((s,i)=>{if(s.t==='exercise')renderEx(i)})}
function renderEx(i){const s=S[i],box=document.getElementById('ex'+i),m=document.getElementById('md'+i);if(!box)return;m.textContent=lv[0].toUpperCase()+lv.slice(1);m.className='medal '+lv;box.innerHTML='';const items=s.ex.levels[lv];let k=0;
 const next=()=>{box.innerHTML='';if(k>=items.length){box.innerHTML='<div class="big">✔ done</div>';return}const it=items[k];
  if(s.ex.kind==='choice'){box.appendChild($(`<div style="font-size:64px;margin:10px 0">${it.pic} &nbsp;${it.q}</div>`));shuffle(it.opts).forEach(o=>{const b=$(`<button class="opt">${o}</button>`);b.onclick=()=>{if(o===it.ans){b.classList.add('ok');setTimeout(()=>{k++;next()},700)}else{b.classList.add('no')}};box.appendChild(b)})}
  else{box.appendChild($(`<div style="font-size:90px">${it.pic}</div>`));const ans=$('<div class="ans"></div>'),bank=$('<div class="words"></div>');let n=0;box.appendChild(ans);box.appendChild(bank);
   shuffle(it.words.concat(it.extra)).forEach(w=>{const b=$(`<button class="w">${w}</button>`);b.onclick=()=>{if(w===it.words[n]){n++;b.classList.add('used');ans.appendChild($(`<span class="w">${w}</span>`));if(n===it.words.length){say(it.words.join(' '));setTimeout(()=>{k++;next()},1400)}}else{b.style.background='#ffe0e3';setTimeout(()=>b.style.background='',400)}};bank.appendChild(b)})}};
 next()}
function renderTest(i){const box=document.getElementById('tt'+i);D.test.opts.forEach((o,j)=>{const b=$(`<button class="opt">${o}</button>`);b.onclick=()=>{if(j===D.test.ans){b.classList.add('ok');document.getElementById('why'+i).textContent=D.test.why}else b.classList.add('no')};box.appendChild(b)})}
build();if(location.hash)show(parseInt(location.hash.slice(1))-1);
</script></body></html>
