<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 3 · Group Red</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:linear-gradient(#f5ecff,#dff1ff);color:#1c1b2e;padding:18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.dot{width:54px;height:54px;border-radius:50%;background:#ff5a6a;box-shadow:0 6px 16px rgba(0,0,0,.2)}h1{font-size:26px;margin:0}.sub{font-size:16px;color:#5a5a74;margin:2px 0 0}
.cd{position:relative;display:block;width:100%;min-height:150px;margin:0 0 14px;padding:16px 18px;border-radius:30px;border:5px solid #ff5a6a;background:#fff;text-align:left;font:inherit;cursor:pointer;box-shadow:0 10px 24px rgba(60,30,140,.14)}
.cd{display:grid;grid-template-columns:70px 1fr;column-gap:14px}.cd .e{font-size:50px;grid-row:1/4}.cd .h{font-weight:800;font-size:20px;color:#ff5a6a}.cd .t{display:none;font-weight:800;font-size:25px;line-height:1.25;margin-top:6px}.cd .tp{font-size:16px;color:#6a6a7e;margin-top:8px}.cd.on .t{display:block}.cd.on .tp{display:none}
.sec{font-weight:800;font-size:20px;margin:22px 0 8px}.fr{background:#fff;border-radius:22px;padding:12px 16px;margin-bottom:8px;font-weight:700;font-size:20px}.sec2{font-size:17px;color:#5a5a74;margin-top:6px}
</style></head><body><div class="top"><div class="dot"></div><div><h1>Group Red</h1><div class="sub">Lesson 3 · Your clues are a secret</div></div></div>
<button class="cd" data-say="No. No cough."><div class="e">🎧</div><div class="h">Clue 1</div><div class="t">No. No cough.</div><div class="tp">Tap · listen</div></button><button class="cd" data-say="Yes, a lot. In the garden by the pond, about a week ago."><div class="e">🎧</div><div class="h">Clue 2</div><div class="t">Yes, a lot. In the garden by the pond, about a week ago.</div><div class="tp">Tap · listen</div></button><button class="cd" data-say="My head and behind my eyes. My muscles hurt too."><div class="e">🎧</div><div class="h">Clue 3</div><div class="t">My head and behind my eyes. My muscles hurt too.</div><div class="tp">Tap · listen</div></button><div class="sec">Ask with the ball</div><div class="fr">Have you got …?</div><div class="fr">What does your clue say about …?</div><div class="fr">Does the patient have …?</div><div class="sec2">Answer in a full sentence. 3 of you hold a clue. 1 of you writes.</div>
<script>document.querySelectorAll('.cd').forEach(function(b){b.onclick=function(){b.classList.add('on');var s=b.dataset.say;if(s&&window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}}});</script></body></html>
