<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 3 · Group Blue</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:linear-gradient(#f5ecff,#dff1ff);color:#1c1b2e;padding:18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.dot{width:54px;height:54px;border-radius:50%;background:#2a8cf0;box-shadow:0 6px 16px rgba(0,0,0,.2)}h1{font-size:26px;margin:0}.sub{font-size:16px;color:#5a5a74;margin:2px 0 0}
.cd{position:relative;display:block;width:100%;min-height:150px;margin:0 0 14px;padding:16px 18px;border-radius:30px;border:5px solid #2a8cf0;background:#fff;text-align:left;font:inherit;cursor:pointer;box-shadow:0 10px 24px rgba(60,30,140,.14)}
.cd{display:grid;grid-template-columns:70px 1fr;column-gap:14px}.cd .e{font-size:50px;grid-row:1/4}.cd .h{font-weight:800;font-size:20px;color:#2a8cf0}.cd .t{display:none;font-weight:800;font-size:25px;line-height:1.25;margin-top:6px}.cd .tp{font-size:16px;color:#6a6a7e;margin-top:8px}.cd.on .t{display:block}.cd.on .tp{display:none}
.sec{font-weight:800;font-size:20px;margin:22px 0 8px}.fr{background:#fff;border-radius:22px;padding:12px 16px;margin-bottom:8px;font-weight:700;font-size:20px}.sec2{font-size:17px;color:#5a5a74;margin-top:6px}
</style></head><body><div class="top"><div class="dot"></div><div><h1>Group Blue</h1><div class="sub">Lesson 3 · Your clues are a secret</div></div></div>
<button class="cd" data-say=""><div class="e">🌡️</div><div class="h">Clue 1</div><div class="t">Temperature: 39.2 °C   (normal: about 37 °C)</div><div class="tp">Tap to read</div></button><button class="cd" data-say=""><div class="e">🩸</div><div class="h">Clue 2</div><div class="t">Platelets 95,000 per µL (normal 150,000–450,000)<br>White cells 3,100 per µL (normal 4,500–11,000)</div><div class="tp">Tap to read</div></button><button class="cd" data-say=""><div class="e">💓</div><div class="h">Clue 3</div><div class="t">Pulse: 104 beats per minute   (normal: 60 – 100)</div><div class="tp">Tap to read</div></button><div class="sec">Ask with the ball</div><div class="fr">Have you got …?</div><div class="fr">What does your clue say about …?</div><div class="fr">Does the patient have …?</div><div class="sec2">Answer in a full sentence. 3 of you hold a clue. 1 of you writes.</div>
<script>document.querySelectorAll('.cd').forEach(function(b){b.onclick=function(){b.classList.add('on');var s=b.dataset.say;if(s&&window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}}});</script></body></html>
